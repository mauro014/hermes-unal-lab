<?xml version='1.0' encoding='ISO-8859-1' ?>
<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:t="http://myfaces.apache.org/tomahawk"
	xmlns:s="http://myfaces.apache.org/sandbox"
	template="../../../templates/common.xhtml">

<ui:define name="content">
<h:form>

<div id="formulariobasico">
	
		<h2>
			Historial de aval
		</h2>
	

		<h:panelGrid columns="1" align="center">
			<h:panelGroup>
			<h:dataTable var="aval"
				value="#{manejadorGruposInvestigador.listaHistorialAval}" cellpadding="1"
				cellspacing="15" align="center" border="1"
				binding="#{manejadorGruposInvestigador.tablaAval}">

					<h:column>
						<f:facet name="header">
							<h:outputText value="Coordinador" styleClass="titulo" />
						</f:facet>
						<h:outputText value="#{aval.avalista.nombre1} #{aval.avalista.nombre2} #{aval.avalista.apellido1} #{aval.avalista.apellido2}" styleClass="texto" />
					</h:column>
					<h:column>
						<f:facet name="header">
							<h:outputText value="Concepto" styleClass="titulo" />
						</f:facet>
						<h:outputText value="#{aval.concepto}" />
					</h:column>
					<h:column>
						<f:facet name="header">
							<h:outputText value="Fecha" styleClass="titulo" />
						</f:facet>
						<h:outputText value="#{aval.fechaAval}" />
					</h:column>
				</h:dataTable>
			</h:panelGroup>
		 <h:commandButton action="#{manejadorGruposInvestigador.atras}" value="Atras" immediate="true" image="/imgplantilla/pngtitulos/cen_atras.png"/>
		</h:panelGrid>
</div>
</h:form>
</ui:define>
</ui:composition>
