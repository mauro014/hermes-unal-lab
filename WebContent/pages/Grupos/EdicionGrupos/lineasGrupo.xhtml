<?xml version='1.0' encoding='ISO-8859-1' ?>
<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:t="http://myfaces.apache.org/tomahawk"
	xmlns:s="http://myfaces.apache.org/sandbox"
	template="../../../templates/common.xhtml">
	<ui:define name="content">
		<div class="estilo_blanco">
			<h:form>
				<t:div styleClass="contenido-titulo-general-myriad">Áreas y lineas de investigación</t:div>
				<p:menubar style="margin-bottom: 20px;">
					<p:menuitem value="Información general" action="editarGrupo"
						icon="ui-icon-right" />
					<p:menuitem value="Integrantes" action="irEdicionIntegrantes"
						icon="ui-icon-right"
						disabled="#{!manejadorMenuFormularioGrupos.opcionIntegrantes}" />
					<p:menuitem value="Áreas y lineas de investigación" action="lineasGrupo"
						icon="ui-icon-right"
						disabled="#{!manejadorMenuFormularioGrupos.opcionLineas}" />
					<p:menuitem value="Información específica"
						action="irVisionPrioridadesPerspectiva" icon="ui-icon-right"
						disabled="#{!manejadorMenuFormularioGrupos.opcionEspecifica}" />
				</p:menubar>
			</h:form>
			<h:form>
				<p:panel id="panelInformacionLaboratorio">
					<p:panelGrid columns="2" styleClass="estilo-panelgrid-sinbordes"
						style="border-collapse: separate;">
						<t:div style="width: 100px;">
							<h:outputText value="Id: " />
						</t:div>
						<h:outputText value="#{manejadorEdicionGrupo.grupoActual.id}"
							style=' font-weight: bold;' />
						<h:outputText value="Nombre grupo: " />
						<h:outputText value="#{manejadorEdicionGrupo.grupoActual.nombre}"
							style=' font-weight: bold;' />
					</p:panelGrid>
				</p:panel>
				<p:messages id="msgs" />
				<p:panel header="Agendas de conocimiento" style="margin-top: 10px;">
					<p:panelGrid columns="4" cellpadding="5" cellspacing="5"
						id="panelAreasPrimarias" styleClass="estilo-panelgrid-sinbordes">
						<h:outputText value="Agenda principal(*):" />
						<p:selectOneMenu style="width:500px"
							value="#{manejadorLineasGrupo.agendaPrincipalGrupo}"
							id="agendaPrincipal"
							disabled="#{manejadorMenuFormularioGrupos.esConsulta}"
							required="true"
							requiredMessage="Debe seleccionar una agenda del conocimiento principal">
							<f:selectItem itemLabel="Seleccione una agenda de conocimiento"
								itemValue="" />
							<f:selectItems
								value="#{manejadorLineasGrupo.listaPosiblesAgendasItem}" />
						</p:selectOneMenu>
					</p:panelGrid>
					<br />
					<br />
					<h:outputText value="Agendas del conocimiento secundarias"
						style="font-weight: bold;" />
					<p:panelGrid columns="4" cellpadding="5" cellspacing="5"
						id="panelAreasPrimarias" styleClass="estilo-panelgrid-sinbordes">
						<h:outputText value="Agenda secundaria:" />
						<p:selectOneMenu style="width:380px"
							value="#{manejadorLineasGrupo.agendaSecundariaGrupo}"
							id="agendaSecundaria"
							disabled="#{manejadorMenuFormularioGrupos.esConsulta}">
							<f:selectItem itemLabel="Seleccione una agenda de conocimiento"
								itemValue="" />
							<f:selectItems
								value="#{manejadorLineasGrupo.listaPosiblesAgendasItem}" />
						</p:selectOneMenu>
						<p:commandButton action="#{manejadorLineasGrupo.agregarAgenda}"
							update="agentasTabla,msgs" id="agregarAgenda"
							title="Agregar agenda" value="Agregar agenda"
							onstart="dialogEspere.show()" oncomplete="dialogEspere.hide()">
							<f:setPropertyActionListener value="#{area}"
								target="#{manejadorLineasGrupo.areaSeleccionada}" />
						</p:commandButton>
					</p:panelGrid>
					<p:dataTable id="agentasTabla" var="agenda"
						value="#{manejadorLineasGrupo.listaAgendas}"
						emptyMessage="No se han agregado agendas del conocimiento secundarias"
						style="width:100%;">
						<f:facet name="header">
							<h:outputText value="Agendas del conocimiento secundarias" />
						</f:facet>
						<p:column headerText="Nombre">
							<h:outputText value="#{agenda.agenda.nombre}" />
						</p:column>
						<p:column style="width: 50px;"
							rendered="#{!manejadorMenuFormularioGrupos.esConsulta}">
							<p:commandButton action="#{manejadorLineasGrupo.eliminarAgenda}"
								update="agentasTabla" id="eliminararea" icon="ui-icon-trash"
								title="Eliminar" onstart="dialogEspere.show()"
								oncomplete="dialogEspere.hide()">
								<f:setPropertyActionListener value="#{agenda}"
									target="#{manejadorLineasGrupo.agendaSeleccionada}" />
							</p:commandButton>
						</p:column>
					</p:dataTable>
				</p:panel>
				<p:panel header="Areas OCDE" style="margin-top: 10px;"
					id="lineasInvestigacion">
					<br />
					<h:outputText value="Área principal(*)" style="font-weight: bold;" />
					<p:panelGrid columns="4" cellpadding="5" cellspacing="5"
						id="panelAreasPrimarias" styleClass="estilo-panelgrid-sinbordes">
						<h:outputText value="Area científica y tecnológica principal:" />
						<p:selectOneMenu style="width:250px"
							value="#{manejadorLineasGrupo.areaCiencia}" id="areaCiencia"
							disabled="#{manejadorMenuFormularioGrupos.esConsulta}">
							<f:selectItem itemLabel="Seleccione un área" itemValue="" />
							<f:selectItems value="#{manejadorLineasGrupo.areaCienciaItems}" />
							<p:ajax listener="#{manejadorLineasGrupo.cambiarSubareaTematica}"
								update="subareaCiencia" onstart="dialogEspere.show()"
								oncomplete="dialogEspere.hide()" />
						</p:selectOneMenu>
						<h:outputLink value="#{manejadorLineasGrupo.linkLineas}"
							target="_blank">
							<h:graphicImage id="imageee" alt="jsf-sun"
								rendered="#{!manejadorMenuFormularioGrupos.esConsulta}"
								url="/images/iconpdf.png">
							</h:graphicImage>
						</h:outputLink>
						<p:tooltip for="imageee"
							value="Descargar pdf con la clasificación de las áreas."
							showEffect="fade" hideEffect="fade" />
						<h:outputText value="Sub-área de la ciencia:" />
						<p:selectOneMenu style="width:250px"
							disabled="#{manejadorMenuFormularioGrupos.esConsulta}"
							value="#{manejadorLineasGrupo.subAreaCiencia}"
							id="subareaCiencia">
							<f:selectItem itemLabel="Seleccione una sub-área" itemValue="" />
							<f:selectItems
								value="#{manejadorLineasGrupo.subAreaCienciaItems}" />
						</p:selectOneMenu>
					</p:panelGrid>
					<br />
					<br />
					<h:outputText value="Áreas secundarias" style="font-weight: bold;" />
					<p:panelGrid columns="4" cellpadding="5" cellspacing="5"
						rendered="#{!manejadorMenuFormularioGrupos.esConsulta}"
						id="panelDurac" styleClass="estilo-panelgrid-sinbordes"
						style="margin-top: 10px;">
						<h:outputText value="Area científica y tecnológica secundaria:" />
						<p:selectOneMenu style="width:250px"
							value="#{manejadorLineasGrupo.areaCienciaSecundaria}"
							id="areaCienciaSecundaria">
							<f:selectItem itemLabel="Seleccione un área" itemValue="" />
							<f:selectItems value="#{manejadorLineasGrupo.areaCienciaItems}" />
							<p:ajax
								listener="#{manejadorLineasGrupo.cambiarSubareaTematicaSecundaria}"
								update="subareaSecundariaCiencia" onstart="dialogEspere.show()"
								oncomplete="dialogEspere.hide()" />
						</p:selectOneMenu>
						<h:outputLink value="#{manejadorLineasGrupo.linkLineas}"
							target="_blank">
							<h:graphicImage id="imageee" alt="jsf-sun"
								url="/images/iconpdf.png">
							</h:graphicImage>
						</h:outputLink>
						<p:tooltip for="imageee"
							value="Descargar pdf con la clasificación de las áreas."
							showEffect="fade" hideEffect="fade" />

						<h:outputText value="Sub-área de la ciencia:" />
						<p:selectOneMenu style="width:250px"
							value="#{manejadorLineasGrupo.subAreaCienciaSecundaria}"
							id="subareaSecundariaCiencia">
							<f:selectItem itemLabel="Seleccione una sub-área" itemValue="" />
							<f:selectItems
								value="#{manejadorLineasGrupo.subAreaCienciaSecundariaItems}" />
						</p:selectOneMenu>
					</p:panelGrid>
					<p:panelGrid columns="4" cellpadding="5" cellspacing="5"
						rendered="#{!manejadorMenuFormularioGrupos.esConsulta}"
						id="panelbtnArea" styleClass="estilo-panelgrid-sinbordes"
						style="margin: auto;">
						<p:commandButton
							action="#{manejadorLineasGrupo.agregarAreaSecundaria}"
							value="Adicionar área secundaria" icon="ui-icon-plus"
							update="areasTabla, msgs" onstart="dialogEspere.show()"
							oncomplete="dialogEspere.hide()" />
						<p:commandButton id="btnArea" icon="ui-icon-info">
						</p:commandButton>
						<p:tooltip for="btnArea" showEffect="fade" hideEffect="fade">
							<h:outputText
								value="Para agregar el Area científica y tecnológica secundaria seleccionada, por favor haga clic en el botón Adicionar área." />
						</p:tooltip>
					</p:panelGrid>
					<p:dataTable id="areasTabla" var="area"
						value="#{manejadorLineasGrupo.grupoActual.listaAreas}"
						emptyMessage="No se han agregado áreas secundarias"
						style="width:100%; margin-top: 20px;">
						<f:facet name="header">
							<h:outputText value="Áreas secundarias" />
						</f:facet>
						<p:column headerText="Área">
							<h:outputText value="#{area.areaTematicaPadre.descripcion}" />
						</p:column>
						<p:column headerText="Subárea">
							<h:outputText value="#{area.areaTematica.descripcion}" />
						</p:column>
						<p:column style="width: 50px;"
							rendered="#{!manejadorMenuFormularioGrupos.esConsulta}">
							<p:commandButton action="#{manejadorLineasGrupo.eliminarArea}"
								update="areasTabla" id="eliminararea" icon="ui-icon-trash"
								title="Eliminar" onstart="dialogEspere.show()"
								oncomplete="dialogEspere.hide()">
								<f:setPropertyActionListener value="#{area}"
									target="#{manejadorLineasGrupo.areaSeleccionada}" />
							</p:commandButton>
						</p:column>
					</p:dataTable>
				</p:panel>
				<p:panel id="ocdePrincipal" align="center" style="margin-top: 10px;">
					<f:facet name="header">
						<p:commandButton id="btnODSPri" icon="ui-icon-info"
							rendered="#{!manejadorMenuFormularioGrupos.esConsulta}">
						</p:commandButton>
						<p:tooltip for="btnODSPri" showEffect="fade" hideEffect="fade"
							rendered="#{!manejadorMenuFormularioGrupos.esConsulta}">
							<h:outputText
								value="Objetivo de Desarrollo Sostenible asociado al grupo." />
						</p:tooltip>
						<h:outputText value="Objetivos de Desarrollo Sostenible:" />
					</f:facet>
					<p:panelGrid cellpadding="5" cellspacing="5" style="width: 100%;"
						rendered="#{!manejadorMenuFormularioGrupos.esConsulta}"
						id="panelODS" styleClass="estilo-panelgrid-sinbordes">
						<p:row>
							<p:column>
								<h:outputText
									value="* Objetivo de Desarrollo Sostenible Principal:" />
							</p:column>
							<p:column>
								<p:selectOneMenu style="width:350px" panelStyle="width:350px"
									value="#{manejadorLineasGrupo.grupoActual.objetivoDesarrolloSosteniblePrincipal}"
									disabled="#{manejadorMenuFormularioGrupos.esConsulta}"
									id="objetivoDesarrolloSostenible">
									<f:selectItem itemLabel="Seleccione una opción" itemValue="" />
									<f:selectItems
										value="#{manejadorLineasGrupo.objetivosDesarrolloSostenibleItems}" />
								</p:selectOneMenu>
								<h:outputLink id="paginaODS"
									rendered="#{!manejadorMenuFormularioGrupos.esConsulta}"
									value="#{manejadorLineasGrupo.linkObjetivosDesarrolloSostenible}"
									target="_blank">
									<h:graphicImage id="paginaODSPri" alt="jsf-sun"
										url="/images/NU-icono2.PNG">
									</h:graphicImage>
								</h:outputLink>
								<p:tooltip for="paginaODSPri"
									rendered="#{!manejadorMenuFormularioGrupos.esConsulta}"
									value="Consultar página web con la descripción de los objetivos de desarrollo sostenible."
									showEffect="fade" hideEffect="fade" />
							</p:column>
						</p:row>
						<p:row>
							<p:column>
								<h:outputText
									value="Objetivo de Desarrollo Sostenible Secundario:" />
							</p:column>
							<p:column>
								<p:selectOneMenu style="width:350px" panelStyle="width:350px"
									value="#{manejadorLineasGrupo.grupoActual.objetivoDesarrolloSostenibleSecundario}"
									disabled="#{manejadorMenuFormularioGrupos.esConsulta}">
									<f:selectItem itemLabel="Seleccione una opción" itemValue="" />
									<f:selectItems
										value="#{manejadorLineasGrupo.objetivosDesarrolloSostenibleItems}" />
								</p:selectOneMenu>
								<h:outputLink id="paginaODS"
									rendered="#{!manejadorMenuFormularioGrupos.esConsulta}"
									value="#{manejadorLineasGrupo.linkObjetivosDesarrolloSostenible}"
									target="_blank">
									<h:graphicImage id="paginaODSSec" alt="jsf-sun"
										url="/images/NU-icono2.PNG">
									</h:graphicImage>
								</h:outputLink>
								<p:tooltip for="paginaODSSec"
									rendered="#{!manejadorMenuFormularioGrupos.esConsulta}"
									value="Consultar página web con la descripción de los objetivos de desarrollo sostenible."
									showEffect="fade" hideEffect="fade" />
							</p:column>
						</p:row>
					</p:panelGrid>
				</p:panel>
				<p:panel header="Lineas de investigación asociadas(*)"
					style="margin-top: 10px;" id="lineasInvestigacion">
					<p:dataTable
						value="#{manejadorLineasGrupo.grupoActual.listaLineas}"
						var="linea" id="tabla-lineas"
						emptyMessage="No hay líneas de investigación asociadas">
						<p:column>
							<f:facet name="header">
								<h:outputText value="Linea de investigación" />
							</f:facet>
							<h:outputText value="#{linea.nombre}" />
						</p:column>
						<p:column style="width: 50px;"
							rendered="#{!manejadorMenuFormularioGrupos.esConsulta}">
							<t:div style="text-align: center;">
								<p:commandButton action="#{manejadorLineasGrupo.eliminarLinea}"
									styleClass="botonGrupo" update="tabla-lineas"
									onclick="if(!confirm('Esta seguro de eliminar la línea de investigación?'))return false"
									icon="ui-icon-trash" title="Eliminar"
									onstart="dialogEspere.show()" oncomplete="dialogEspere.hide()">
									<f:setPropertyActionListener value="#{linea}"
										target="#{manejadorLineasGrupo.lineaSeleccionada}" />
								</p:commandButton>
							</t:div>
						</p:column>
					</p:dataTable>
					<h:panelGrid columns="4" align="center" style="margin-top: 10px;"
						rendered="#{!manejadorMenuFormularioGrupos.esConsulta}">
						<p:commandButton id="infoTipo" icon="ui-icon-info" />
						<p:tooltip for="infoTipo" styleClass="tooltip-mesage"
							showDelay="999">
							<t:div style="text-align: left; float:left;">
								       	Si la línea de investigación que va asociar no aparece en la lista,<br />
								       	por favor comunicarse con el Sistema de Información HERMES - Componente de Investigación<br />
								       	(Tel 3165000 ext. 11111 o a correo hermes@unal.edu.co). 
									</t:div>
						</p:tooltip>
						<h:outputText value="Agregar linea:" />
						<p:selectOneMenu style="width: 400px;" panelStyle="width: 400px;"
							value="#{manejadorLineasGrupo.lineaInvestigacion}" id="lineaInv"
							filter="true" filterMatchMode="contains">
							<f:selectItem itemLabel="Seleccione una línea" itemValue="" />
							<f:selectItems
								value="#{manejadorLineasGrupo.lineasInvestigacionItem}" />
						</p:selectOneMenu>
						<p:commandButton action="#{manejadorLineasGrupo.adicionarLinea}"
							value="Agregar" update="@form" onstart="dialogEspere.show()"
							oncomplete="dialogEspere.hide()" />
					</h:panelGrid>
				</p:panel>
				<div style="width: 100%; text-align: center;">
					<br />
					<p:commandButton action="#{manejadorLineasGrupo.atras}"
						rendered="#{!manejadorMenuFormularioGrupos.esConsulta}"
						value="Anterior" immediate="true" styleClass="botonGrupo" />
					<p:commandButton action="#{manejadorLineasGrupo.guardar}"
						value="Guardar y continuar después" update="msgs"
						onstart="dialogEspere.show()"
						rendered="#{!manejadorMenuFormularioGrupos.esConsulta}"
						oncomplete="dialogEspere.hide()" />
					<p:commandButton action="#{manejadorLineasGrupo.guardaryAvanza}"
						rendered="#{!manejadorMenuFormularioGrupos.esConsulta}"
						value="Guardar y avanzar" ajax="false" />
					<p:commandButton action="#{manejadorLineasGrupo.siguiente}"
						rendered="#{manejadorMenuFormularioGrupos.esConsulta
						and manejadorMenuFormularioGrupos.opcionEspecifica}"
						value="Siguiente" ajax="false" />
				</div>
				<p:dialog widgetVar="dialogEspere" resizable="false"
					closable="false" modal="true" header="Acción en proceso">
					<p:graphicImage value="/images/ajaxloading.gif" />
								Por favor espere
				</p:dialog>
			</h:form>
		</div>
	</ui:define>
</ui:composition>
