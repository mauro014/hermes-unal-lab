<?xml version='1.0' encoding='ISO-8859-1' ?>
<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:t="http://myfaces.apache.org/tomahawk"
	xmlns:s="http://myfaces.apache.org/sandbox"
	template="../../templates/common.xhtml">
	<ui:define name="content">
		<h:form>

			<t:div styleClass="contenido-titulo-general-myriad">Distribución Recursos</t:div>
			<br />
			<p:menubar>
				<p:menuitem value="Generalidades"
					action="irGeneralidadesConvocatoria" icon="ui-icon-triangle-1-e"
					disabled="#{!manejadorInsercionConvocatorias.activarGeneralidades}" />
				<p:menuitem value="Requisitos" action="irRequisitosConvocatoria"
					icon="ui-icon-triangle-1-e"
					disabled="#{!manejadorInsercionConvocatorias.activarRequisitos}" />
				<p:menuitem value="Rubros" action="irRubrosConvocatoria"
					icon="ui-icon-triangle-1-e"
					disabled="#{!manejadorInsercionConvocatorias.activarRubros}" />
				<p:menuitem value="Compromisos" action="irCompromisosConvocatoria"
					icon="ui-icon-triangle-1-e"
					disabled="#{!manejadorInsercionConvocatorias.activarCompromisos}" />
				<p:menuitem value="Productos" action="irProductosConvocatoria"
					icon="ui-icon-triangle-1-e"
					disabled="#{!manejadorInsercionConvocatorias.activarProductos}" />
				<p:menuitem value="Criterios de evaluación"
					action="irCriteriosEvaluacionConvocatoria"
					icon="ui-icon-triangle-1-e"
					disabled="#{!manejadorInsercionConvocatorias.activarCriterios}" />
				<p:menuitem value="Distribución Recursos"
					action="irDistribucionRecursos"
					icon="ui-icon-triangle-1-e"
					disabled="#{!manejadorInsercionConvocatorias.activarRecursos}" />
			</p:menubar>
			<br />

			<center>

				<h:outputText
					value="#{manejadorInsercionConvocatorias.mensajeDistribucion}"
					styleClass="mensajeerror" />
				<h:outputText
					value="#{manejadorInsercionConvocatorias.mensajeApoyos}"
					styleClass="mensajeerror" />
			</center>

			<br />

			<p:panel id="panelRecursos" header="Distribución de recursos">

				<h:panelGrid columns="4">
					<h:outputText value="Nivel Nacional :"
						styleClass="labels_proyecto2" />
					<p:inputText value="#{manejadorInsercionConvocatorias.nivelNal}" />
					<h:outputText value="Número Apoyos : "
						styleClass="labels_proyecto2" />
					<p:inputText
						value="#{manejadorInsercionConvocatorias.nivelNalApoyo}" />

					<h:outputText value="Sede Bogotá : " styleClass="labels_proyecto2" />
					<p:inputText value="#{manejadorInsercionConvocatorias.bogota}" />
					<h:outputText value="Número Apoyos:" styleClass="labels_proyecto2" />
					<p:inputText value="#{manejadorInsercionConvocatorias.bogotaApoyo}" />

					<h:outputText value="Sede Medellin : "
						styleClass="labels_proyecto2" />
					<p:inputText value="#{manejadorInsercionConvocatorias.medellin}" />
					<h:outputText value="Número Apoyos : "
						styleClass="labels_proyecto2" />
					<p:inputText
						value="#{manejadorInsercionConvocatorias.medellinApoyo}" />

					<h:outputText value="Sede Manizales : "
						styleClass="labels_proyecto2" />
					<p:inputText value="#{manejadorInsercionConvocatorias.manizales}" />
					<h:outputText value="Número Apoyos : "
						styleClass="labels_proyecto2" />
					<p:inputText
						value="#{manejadorInsercionConvocatorias.manizalesApoyo}" />

					<h:outputText value="Sede Palmira : " styleClass="labels_proyecto2" />
					<p:inputText value="#{manejadorInsercionConvocatorias.palmira}" />
					<h:outputText value="Número Apoyos : "
						styleClass="labels_proyecto2" />
					<p:inputText
						value="#{manejadorInsercionConvocatorias.palmiraApoyo}" />

					<h:outputText value="Sede Amazonía : "
						styleClass="labels_proyecto2" />
					<p:inputText value="#{manejadorInsercionConvocatorias.amazonia}" />
					<h:outputText value="Número Apoyos : "
						styleClass="labels_proyecto2" />
					<p:inputText
						value="#{manejadorInsercionConvocatorias.amazoniaApoyo}" />

					<h:outputText value="Sede Orinoquía : "
						styleClass="labels_proyecto2" />
					<p:inputText value="#{manejadorInsercionConvocatorias.orinoquia}" />
					<h:outputText value="Número Apoyos : "
						styleClass="labels_proyecto2" />
					<p:inputText
						value="#{manejadorInsercionConvocatorias.orinoquiaApoyo}" />

					<h:outputText value="Sede Caribe : " styleClass="labels_proyecto2" />
					<p:inputText value="#{manejadorInsercionConvocatorias.caribe}" />
					<h:outputText value="Número Apoyos : "
						styleClass="labels_proyecto2" />
					<p:inputText value="#{manejadorInsercionConvocatorias.caribeApoyo}" />
				</h:panelGrid>


			</p:panel>

			<center>
				<h:panelGrid columns="3">


					<p:commandButton styleClass="btnedicion"
						rendered="#{manejadorInsercionConvocatorias.mostrarGuardarAvanzar}"
						action="#{manejadorInsercionConvocatorias.siguiente}"
						value="Guardar y avanzar" update="@form" />

					<p:commandButton styleClass="btnguardar" rendered="false"
						action="#{manejadorInsercionConvocatorias.InsertarConvocatoria}"
						immediate="false" value="Guardar y continuar después" />

					<p:commandButton value="Guardar Convocatoria"
						rendered="#{manejadorInsercionConvocatorias.activarGuardar}"
						action="#{manejadorInsercionConvocatorias.InsertarConvocatoria}"
						update="@form"  />


				</h:panelGrid>

			</center>


		</h:form>
	</ui:define>
</ui:composition>
