<?xml version='1.0' encoding='ISO-8859-1' ?>
<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:t="http://myfaces.apache.org/tomahawk"
	xmlns:s="http://myfaces.apache.org/sandbox"
	template="../../templates/common.xhtml">
	<ui:define name="content">
		<h:form>
			<t:div styleClass="contenido-titulo-general-myriad">Información específica</t:div>
			<br />
			<p:menubar>
				<p:menuitem value="Generalidades"
					action="irGeneralidadesConvocatoria" icon="ui-icon-triangle-1-e"
					disabled="#{!manejadorInsercionConvocatorias.activarGeneralidades}" />
				<p:menuitem value="Requisitos" action="irRequisitosConvocatoria"
					icon="ui-icon-triangle-1-e"
					disabled="#{!manejadorInsercionConvocatorias.activarRequisitos}" />
				<p:menuitem value="Rubros" action="irRubrosConvocatoria"
					icon="ui-icon-triangle-1-e"
					disabled="#{!manejadorInsercionConvocatorias.activarRubros}" />
				<p:menuitem value="Compromisos" action="irCompromisosConvocatoria"
					icon="ui-icon-triangle-1-e"
					disabled="#{!manejadorInsercionConvocatorias.activarCompromisos}" />
				<p:menuitem value="Productos" action="irProductosConvocatoria"
					icon="ui-icon-triangle-1-e"
					disabled="#{!manejadorInsercionConvocatorias.activarProductos}" />
				<p:menuitem value="Criterios de evaluación"
					action="irCriteriosEvaluacionConvocatoria"
					icon="ui-icon-triangle-1-e"
					disabled="#{!manejadorInsercionConvocatorias.activarCriterios}" />
				<p:menuitem value="Información específica"
					action="irDetallesInformacionEspecifica"
					icon="ui-icon-triangle-1-e"
					disabled="#{!manejadorInsercionConvocatorias.activarInfoEspecifica}" />
			</p:menubar>
			<br />

			<center>
				<br />
				<h:outputText
					value="#{manejadorInsercionConvocatorias.avisoInfoEspecifca}"
					styleClass="mensajeerror" />
			</center>

			<br />

			<p:panel header="Campos formulario información específica"
				id="camposInfoEspe">

				<p:outputPanel id="pgSelCampoUno">

					<h:panelGrid columns="2" id="pgCampoUno">
						<h:outputText value="Mostrar campo abierto 1" />
						<p:selectOneMenu id="esCampoUno"
							value="#{manejadorInsercionConvocatorias.mostrarCampoUno}">
							<f:selectItem itemValue="S" itemLabel="Si" />
							<f:selectItem itemValue="N" itemLabel="No" />
							<p:ajax
								listener="#{manejadorInsercionConvocatorias.cambioSiMostrarCampoUno}"
								update="pgSelCampoUno,textoCampo1, pgCampoUno" />
						</p:selectOneMenu>
					</h:panelGrid>

					<h:panelGrid columns="2" id="textoCampo1" align="center"
						rendered="#{manejadorInsercionConvocatorias.visibleTextCampo1}">
						<h:outputText value="Texto a mostrar para el campo 1" />
						<p:inputTextarea id="textoCampo1"
							value="#{manejadorInsercionConvocatorias.textoCampoUno}" rows="8"
							cols="60" maxlength="100" />

						<h:outputText value="El campo abierto 1 es obligatorio" />
						<p:selectOneMenu id="esCampoUnoObl"
							value="#{manejadorInsercionConvocatorias.campoUnoObligatorio}">
							<f:selectItem itemValue="S" itemLabel="Si" />
							<f:selectItem itemValue="N" itemLabel="No" />
						</p:selectOneMenu>
					</h:panelGrid>
				</p:outputPanel>

				<p:outputPanel id="pgSelCampoDos">

					<h:panelGrid columns="2" id="pgCampoDos">
						<h:outputText value="Mostrar campo abierto 2" />
						<p:selectOneMenu id="esCampoDos"
							value="#{manejadorInsercionConvocatorias.mostrarCampoDos}">
							<f:selectItem itemValue="S" itemLabel="Si" />
							<f:selectItem itemValue="N" itemLabel="No" />
							<p:ajax
								listener="#{manejadorInsercionConvocatorias.cambioSiMostrarCampoDos}"
								update="pgSelCampoDos,textoCampo2, pgCampoDos" />
						</p:selectOneMenu>
					</h:panelGrid>

					<h:panelGrid columns="2" id="textoCampo2" align="center"
						rendered="#{manejadorInsercionConvocatorias.visibleTextCampo2}">
						<h:outputText value="Texto a mostrar para el campo 2" />
						<p:inputTextarea id="textoCampo2"
							value="#{manejadorInsercionConvocatorias.textoCampoDos}" rows="8"
							cols="60" maxlength="100" />

						<h:outputText value="El campo abierto 2 es obligatorio" />
						<p:selectOneMenu id="esCampoDosObl"
							value="#{manejadorInsercionConvocatorias.campoDosObligatorio}">
							<f:selectItem itemValue="S" itemLabel="Si" />
							<f:selectItem itemValue="N" itemLabel="No" />
						</p:selectOneMenu>
					</h:panelGrid>
				</p:outputPanel>

				<p:outputPanel id="pgSelCampoTres">

					<h:panelGrid columns="2" id="pgCampoTres">
						<h:outputText value="Mostrar campo abierto 3" />
						<p:selectOneMenu id="esCampoTres"
							value="#{manejadorInsercionConvocatorias.mostrarCampoTres}">
							<f:selectItem itemValue="S" itemLabel="Si" />
							<f:selectItem itemValue="N" itemLabel="No" />
							<p:ajax
								listener="#{manejadorInsercionConvocatorias.cambioSiMostrarCampoTres}"
								update="pgSelCampoTres,textoCampo3, pgCampoTres" />
						</p:selectOneMenu>
					</h:panelGrid>

					<h:panelGrid columns="2" id="textoCampo3" align="center"
						rendered="#{manejadorInsercionConvocatorias.visibleTextCampo3}">
						<h:outputText value="Texto a mostrar para el campo 3" />
						<p:inputTextarea id="textoCampo3"
							value="#{manejadorInsercionConvocatorias.textoCampoTres}"
							rows="8" cols="60" maxlength="100" />

						<h:outputText value="El campo abierto 3 es obligatorio" />
						<p:selectOneMenu id="esCampoTresObl"
							value="#{manejadorInsercionConvocatorias.campoTresObligatorio}">
							<f:selectItem itemValue="S" itemLabel="Si" />
							<f:selectItem itemValue="N" itemLabel="No" />
						</p:selectOneMenu>
					</h:panelGrid>
				</p:outputPanel>

				<p:outputPanel id="pgSelCampoCuatro">

					<h:panelGrid columns="2" id="pgCampoCuatro">
						<h:outputText value="Mostrar campo abierto 4" />
						<p:selectOneMenu id="esCampoCuatro"
							value="#{manejadorInsercionConvocatorias.mostrarCampoCuatro}">
							<f:selectItem itemValue="S" itemLabel="Si" />
							<f:selectItem itemValue="N" itemLabel="No" />
							<p:ajax
								listener="#{manejadorInsercionConvocatorias.cambioSiMostrarCampoCuatro}"
								update="pgSelCampoCuatro,textoCampo4, pgCampoCuatro" />
						</p:selectOneMenu>
					</h:panelGrid>

					<h:panelGrid columns="2" id="textoCampo4" align="center"
						rendered="#{manejadorInsercionConvocatorias.visibleTextCampo4}">
						<h:outputText value="Texto a mostrar para el campo 4" />
						<p:inputTextarea id="textoCampo4"
							value="#{manejadorInsercionConvocatorias.textoCampoCuatro}"
							rows="8" cols="60" maxlength="100" />

						<h:outputText value="El campo abierto 4 es obligatorio" />
						<p:selectOneMenu id="esCampoCuatroObl"
							value="#{manejadorInsercionConvocatorias.campoCuatroObligatorio}">
							<f:selectItem itemValue="S" itemLabel="Si" />
							<f:selectItem itemValue="N" itemLabel="No" />
						</p:selectOneMenu>
					</h:panelGrid>
				</p:outputPanel>

				<p:outputPanel id="pgSelCampoCinco">

					<h:panelGrid columns="2" id="pgCampoCinco">
						<h:outputText value="Mostrar campo abierto 5" />
						<p:selectOneMenu id="esCampoCinco"
							value="#{manejadorInsercionConvocatorias.mostrarCampoCinco}">
							<f:selectItem itemValue="S" itemLabel="Si" />
							<f:selectItem itemValue="N" itemLabel="No" />
							<p:ajax
								listener="#{manejadorInsercionConvocatorias.cambioSiMostrarCampoCinco}"
								update="pgSelCampoCinco,textoCampo5, pgCampoCinco" />
						</p:selectOneMenu>
					</h:panelGrid>

					<h:panelGrid columns="2" id="textoCampo5" align="center"
						rendered="#{manejadorInsercionConvocatorias.visibleTextCampo5}">
						<h:outputText value="Texto a mostrar para el campo 5" />
						<p:inputTextarea id="textoCampo5"
							value="#{manejadorInsercionConvocatorias.textoCampoCinco}"
							rows="8" cols="60" maxlength="100" />

						<h:outputText value="El campo abierto 5 es obligatorio" />
						<p:selectOneMenu id="esCampoCincoObl"
							value="#{manejadorInsercionConvocatorias.campoCincoObligatorio}">
							<f:selectItem itemValue="S" itemLabel="Si" />
							<f:selectItem itemValue="N" itemLabel="No" />
						</p:selectOneMenu>
					</h:panelGrid>
				</p:outputPanel>
				
				<p:outputPanel id="pgSelCampoSeis">

					<h:panelGrid columns="2" id="pgCampoSeis">
						<h:outputText value="Mostrar campo abierto 6" />
						<p:selectOneMenu id="esCampoSeis"
							value="#{manejadorInsercionConvocatorias.mostrarCampoSeis}">
							<f:selectItem itemValue="S" itemLabel="Si" />
							<f:selectItem itemValue="N" itemLabel="No" />
							<p:ajax
								listener="#{manejadorInsercionConvocatorias.cambioSiMostrarCampoSeis}"
								update="pgSelCampoSeis,textoCampo6, pgCampoSeis" />
						</p:selectOneMenu>
					</h:panelGrid>

					<h:panelGrid columns="2" id="textoCampo6" align="center"
						rendered="#{manejadorInsercionConvocatorias.visibleTextCampo6}">
						<h:outputText value="Texto a mostrar para el campo 6" />
						<p:inputTextarea id="textoCampo6"
							value="#{manejadorInsercionConvocatorias.textoCampoSeis}"
							rows="8" cols="60"  maxlength="100" />

						<h:outputText value="El campo abierto 6 es obligatorio" />
						<p:selectOneMenu id="esCampoSeisObl"
							value="#{manejadorInsercionConvocatorias.campoSeisObligatorio}">
							<f:selectItem itemValue="S" itemLabel="Si" />
							<f:selectItem itemValue="N" itemLabel="No" />
						</p:selectOneMenu>
					</h:panelGrid>
				</p:outputPanel>

				<h:panelGrid columns="2" id="pgCampoOtros">
					<h:outputText value="Mostrar campo asignaturas" />
					<p:selectOneMenu id="esCampoAsignaturas"
						value="#{manejadorInsercionConvocatorias.mostrarCampoAsignaturas}">
						<f:selectItem itemValue="S" itemLabel="Si" />
						<f:selectItem itemValue="N" itemLabel="No" />
					</p:selectOneMenu>

					<h:outputText
						value="Mostrar campo relación objetivos - metas - responsable" />
					<p:selectOneMenu id="esCampoObj"
						value="#{manejadorInsercionConvocatorias.mostrarCampoObjetivosResponsable}">
						<f:selectItem itemValue="S" itemLabel="Si" />
						<f:selectItem itemValue="N" itemLabel="No" />
					</p:selectOneMenu>

					<h:outputText value="Mostrar campo grupos de investigación" />
					<p:selectOneMenu id="esCampoGrupos"
						value="#{manejadorInsercionConvocatorias.mostrarCampoGrupos}">
						<f:selectItem itemValue="S" itemLabel="Si" />
						<f:selectItem itemValue="N" itemLabel="No" />
					</p:selectOneMenu>

					<h:outputText value="Mostrar campo lugar de ejecución" />
					<p:selectOneMenu id="esCampoLugarEje"
						value="#{manejadorInsercionConvocatorias.mostrarLugarEjecucion}">
						<f:selectItem itemValue="S" itemLabel="Si" />
						<f:selectItem itemValue="N" itemLabel="No" />

					</p:selectOneMenu>
				</h:panelGrid>


			</p:panel>

			<center>
				<h:panelGrid columns="3">


					<p:commandButton styleClass="btnedicion"
						rendered="#{manejadorInsercionConvocatorias.mostrarGuardarAvanzar}"
						action="#{manejadorInsercionConvocatorias.siguiente}"
						value="Guardar y avanzar" update="@form">
						<f:param name="action" value="7"></f:param>
					</p:commandButton>

					<p:commandButton styleClass="btnguardar" rendered="false"
						action="#{manejadorInsercionConvocatorias.InsertarConvocatoria}"
						immediate="false" value="Guardar y continuar después" />

					<p:commandButton value="Guardar Convocatoria"
						rendered="#{manejadorInsercionConvocatorias.activarGuardar}"
						action="#{manejadorInsercionConvocatorias.InsertarConvocatoria}"
						update="@form"/>


				</h:panelGrid>

			</center>
		</h:form>
	</ui:define>
</ui:composition>
