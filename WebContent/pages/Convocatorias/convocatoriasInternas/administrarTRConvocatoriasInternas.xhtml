<?xml version='1.0' encoding='ISO-8859-1' ?>
<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:t="http://myfaces.apache.org/tomahawk"
	xmlns:s="http://myfaces.apache.org/sandbox"
	xmlns:c="http://java.sun.com/jstl/core_rt"
	template="../../../templates/common.xhtml">
	<ui:define name="content">

		<h:form id="form">
			<t:div styleClass="contenido-titulo-general-myriad">Términos de Referencia Convocatorias Internas</t:div>
			<br />
			<p:panel id="panelBusquedaConvocatorias">
				<br />


				<p:dataTable var="conv" id="tablaConvocatorias"
					value="#{manejadorConsultarTerminosReferenciaConvocatoria.listaTerminosReferenciaConv}">

					<p:column headerText="Id" style="width:10%">
						<h:outputText value="#{conv.id}" />
					</p:column>

					<p:column headerText="Nombre" style="width:70%">
						<h:outputText value="#{conv.titulo}" />
					</p:column>
					<p:column headerText="Editar" style="width:10%">
						<center>
							<p:commandButton id="botonEditar" title="Editar"
								rendered="#{conv.estado != 'P'}" icon="ui-icon-pencil"
								action="#{manejadorConsultarTerminosReferenciaConvocatoria.editarConsultarConvocatoria}">
								<f:setPropertyActionListener value="#{conv}"
									target="#{manejadorConsultarTerminosReferenciaConvocatoria.convocatoriaSeleccionada}" />

							</p:commandButton>
						</center>
					</p:column>
					<p:column headerText="Términos de referencia" style="width:10%">
						<center>
							<h:commandLink id="botonConsultarModalidades"
								value="Descargar" ajax="false" target="_blank"
								action="#{manejadorConsultarTerminosReferenciaConvocatoria.imprimirTerminosReferenciaConvocatoria}">								
								<f:setPropertyActionListener value="#{conv}"
									target="#{manejadorConsultarTerminosReferenciaConvocatoria.convocatoriaSeleccionada}" />
							</h:commandLink>
						</center>
					</p:column>

				</p:dataTable>

			</p:panel>
		</h:form>
	</ui:define>
</ui:composition>
