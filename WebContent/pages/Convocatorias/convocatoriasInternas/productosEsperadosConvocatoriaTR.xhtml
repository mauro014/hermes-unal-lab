<?xml version='1.0' encoding='ISO-8859-1' ?>
<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:t="http://myfaces.apache.org/tomahawk"
	xmlns:s="http://myfaces.apache.org/sandbox"
	xmlns:pe="http://primefaces.org/ui/extensions"
	template="../../../templates/common.xhtml">
	<ui:define name="content">
		<h:form>
			<t:div styleClass="contenido-titulo-general-myriad">Productos esperados</t:div>
			<p:menubar>
				<p:menuitem value="Información general"
					action="crearTerminiosReferenciaConvocatoria" icon="pi pi-times" />
				<p:menuitem value="Modalidades" action="modalidadesConvocatoriaTR"
					icon="pi pi-times" />
				<p:menuitem value="Información financiera"
					action="informacionFinancieraConvocatoriaTR" icon="pi pi-times" />
				<p:menuitem value="Requisitos" action="requisitosConvocatoriaTR"
					icon="pi pi-times" />
				<p:menuitem value="Documentación"
					action="documentacionConvocatoriaTR" icon="pi pi-times" />
				<p:menuitem value="Selección ganadores"
					action="seleccionGanadoresConvocatoriaTR" icon="pi pi-times" />
				<p:menuitem value="Compromisos" action="compromisosConvocatoriaTR"
					icon="pi pi-times" />
				<p:menuitem value="Productos esperados"
					action="productosEsperadosConvocatoriaTR" icon="pi pi-times" />
				<p:menuitem value="Icompatibilidades"
					action="incompatibilidadesConvocatoriaTR" icon="pi pi-times" />
				<p:menuitem value="Calendario" action="calendarioConvocatoriaTR"
					icon="pi pi-times" />
				<p:menuitem value="Consideraciones"
					action="consideracionesConvocatoriaTR" icon="pi pi-times" />
			</p:menubar>
			<p:messages id="messages" showDetail="false" autoUpdate="true"
				closable="true" />
			<br />
			<p:panel id="panelCreacionConvocatoria">

				<h:panelGrid columns="3" align="center" cellpadding="5"
					cellspacing="5" id="infoAclaraciones">

					<h:outputText
						value="Productos académicos (texto a mostrar en los términos de referencia): "
						styleClass="labels_proyecto2" />
					<p:inputTextarea rows="5" cols="80" id="textoProductos"
						value="#{manejadorTerminosReferenciaConvocatoria.convocatoria.textoProductosAcademicos}"
						validatorMessage="El criterio de desempate debe ser de máximo 2000 caracteres"
						maxlength="2000" counter="counterTextoProductos"
						counterTemplate="{0} caracteres restantes">
						<f:validateLength minimum="2" maximum="2000" />
					</p:inputTextarea>
					<p:message for="textoProductos" />

					<h:outputText />
					<h:outputText id="counterTextoProductos" />
					<h:outputText />
				</h:panelGrid>
				<p:separator />

				<t:div
					style="text-align: center; margin-bottom: 10px; margin-top: 30px;">
					<h:outputText value="PRODUCTOS" style="font-weight: bold;" />
				</t:div>

				<h:panelGrid columns="3" align="center" cellpadding="5"
					cellspacing="5" id="pgSelProductos">

					<h:outputText value="Producto " styleClass="labels_proyecto2" />
					<p:selectOneMenu id="tipoProducto"
						value="#{manejadorTerminosReferenciaConvocatoria.producto.producto.id}"
						panelStyle="width:500px;" style="width:500px" filter="true"
						filterMatchMode="contains">
						<f:selectItem itemLabel="Seleccione una opción" itemValue="" />
						<f:selectItems
							value="#{manejadorTerminosReferenciaConvocatoria.tipoProductoItems}" />
						<p:ajax
							update="pgSelProductos"
							process="pgSelProductos" />
					</p:selectOneMenu>
					<p:message for="tipoProducto" />

					<h:outputText
						rendered="#{manejadorTerminosReferenciaConvocatoria.producto.producto.id == '74'}"
						value="¿cuál producto?: " styleClass="labels_proyecto2" />
					<p:inputTextarea rows="5" cols="80" id="textoOtroProducto"
						rendered="#{manejadorTerminosReferenciaConvocatoria.producto.producto.id == '74'}"
						value="#{manejadorTerminosReferenciaConvocatoria.producto.otroProducto}"
						validatorMessage="El otro tipo de producto debe ser de máximo 500 caracteres"
						maxlength="500" counter="counterTextoOtroProducto"
						counterTemplate="{0} caracteres restantes">
						<f:validateLength minimum="2" maximum="500" />
					</p:inputTextarea>
					<p:message for="textoOtroProducto"
						rendered="#{manejadorTerminosReferenciaConvocatoria.producto.producto.id == '74'}" />

					<h:outputText
						rendered="#{manejadorTerminosReferenciaConvocatoria.producto.producto.id == '74'}" />
					<h:outputText id="counterTextoOtroProducto"
						rendered="#{manejadorTerminosReferenciaConvocatoria.producto.producto.id == '74'}" />
					<h:outputText
						rendered="#{manejadorTerminosReferenciaConvocatoria.producto.producto.id == '74'}" />

					<h:outputText value="cantidad: " styleClass="labels_proyecto2" />
					<p:spinner id="puntajeCriterioSeleccion"
						value="#{manejadorTerminosReferenciaConvocatoria.producto.cantidad}"
						min="1" max="100" />
					<p:message for="puntajeCriterioSeleccion" />

				</h:panelGrid>

				<center>
					<h:panelGrid columns="1" align="center">
						<p:commandButton
							action="#{manejadorTerminosReferenciaConvocatoria.adicionarProducto}"
							value="Agregar" update="panelCreacionConvocatoria, tablaProducto"
							onstart="dialogEspere.show()" oncomplete="dialogEspere.hide()" />
					</h:panelGrid>
				</center>

				<br />

				<p:dataTable
					value="#{manejadorTerminosReferenciaConvocatoria.convocatoria.listaProductosConvocatoriaTR}"
					id="tablaProducto" var="moda" cellpadding="1" cellspacing="15"
					editable="true" align="center">
					<p:column headerText="Producto">
						<h:outputText value="#{moda.producto.nombre}" rendered="#{moda.producto.id != '74'}"/>
						<h:outputText value="#{moda.otroProducto}" rendered="#{moda.producto.id == '74'}"/>
					</p:column>
					<p:column headerText="Cantidad">
						<p:cellEditor>
							<f:facet name="output">
								<h:outputText value="#{moda.cantidad}" />
							</f:facet>
							<f:facet name="input">
								<p:inputText id="modelInputCantidad" value="#{moda.cantidad}"
									style="width:100%" />
							</f:facet>
						</p:cellEditor>
					</p:column>
					<p:column headerText="Orden">
						<p:cellEditor>
							<f:facet name="output">
								<h:outputText value="#{moda.orden}" />
							</f:facet>
							<f:facet name="input">
								<p:inputText id="modelInputOrden" value="#{moda.orden}"
									style="width:100%" />
							</f:facet>
						</p:cellEditor>
					</p:column>
					<p:column style="width:35px" headerText="Editar">
						<p:rowEditor />
					</p:column>
					<p:column headerText="Eliminar">
						<center>
							<p:commandButton
								action="#{manejadorTerminosReferenciaConvocatoria.eliminarProducto}"
								update="@form"
								onclick="if(!confirm('¿Está seguro(a) de eliminar el producto?'))return false"
								id="eliminarProducto" icon="ui-icon-trash"
								title="Eliminar producto">

								<f:setPropertyActionListener value="#{moda}"
									target="#{manejadorTerminosReferenciaConvocatoria.productoTRSeleccionado}" />
							</p:commandButton>
						</center>


					</p:column>
				</p:dataTable>
			</p:panel>
			<br />
			<center>
				<h:panelGrid columns="3">
					<p:commandButton value="Guardar y salir"
						action="#{manejadorTerminosReferenciaConvocatoria.guardarProductosSalir}"
						id="botonGuardarFinalizar1" styleClass="ui-priority-primary"
						ajax="false" />

					<p:commandButton value="Guardar y continuar"
						action="#{manejadorTerminosReferenciaConvocatoria.guardarProductos}"
						id="botonGuardarFinalizar3" styleClass="ui-priority-primary"
						ajax="false" />
				</h:panelGrid>
			</center>
		</h:form>
		<p:dialog widgetVar="dialogEspere" resizable="false" closable="false"
			modal="true">
			<p:graphicImage value="/images/ajaxloading.gif" />
   					 Por favor espere...
   	 </p:dialog>
	</ui:define>
</ui:composition>
