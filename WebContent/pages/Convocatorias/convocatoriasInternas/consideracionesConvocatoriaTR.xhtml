<?xml version='1.0' encoding='ISO-8859-1' ?>
<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:t="http://myfaces.apache.org/tomahawk"
	xmlns:s="http://myfaces.apache.org/sandbox"
	xmlns:pe="http://primefaces.org/ui/extensions"
	template="../../../templates/common.xhtml">
	<ui:define name="content">
		<h:form>
			<t:div styleClass="contenido-titulo-general-myriad">Consideraciones generales</t:div>
			<p:menubar>
				<p:menuitem value="Información general"
					action="crearTerminiosReferenciaConvocatoria" icon="pi pi-times" />
				<p:menuitem value="Modalidades" action="modalidadesConvocatoriaTR"
					icon="pi pi-times" />
				<p:menuitem value="Información financiera"
					action="informacionFinancieraConvocatoriaTR" icon="pi pi-times" />
				<p:menuitem value="Requisitos" action="requisitosConvocatoriaTR"
					icon="pi pi-times" />
				<p:menuitem value="Documentación"
					action="documentacionConvocatoriaTR" icon="pi pi-times" />
				<p:menuitem value="Selección ganadores"
					action="seleccionGanadoresConvocatoriaTR" icon="pi pi-times" />
				<p:menuitem value="Compromisos" action="compromisosConvocatoriaTR"
					icon="pi pi-times" />
				<p:menuitem value="Productos esperados"
					action="productosEsperadosConvocatoriaTR" icon="pi pi-times" />
				<p:menuitem value="Icompatibilidades"
					action="incompatibilidadesConvocatoriaTR" icon="pi pi-times" />
				<p:menuitem value="Calendario" action="calendarioConvocatoriaTR"
					icon="pi pi-times" />
				<p:menuitem value="Consideraciones"
					action="consideracionesConvocatoriaTR" icon="pi pi-times" />
			</p:menubar>
			<p:messages id="messages" showDetail="false" autoUpdate="true"
				closable="true" />
			<br />
			<p:panel id="panelCreacionConvocatoria"
				header="Consideraciones generales">
				<h:panelGrid columns="3" align="center" cellpadding="5"
					cellspacing="5">
					<h:outputText
						value="Propiedad intelectual: "
						styleClass="labels_proyecto2" />
					<p:inputTextarea rows="5" cols="80" id="propiedadIntelecutal"
						value="#{manejadorTerminosReferenciaConvocatoria.convocatoria.propiedadIntelectual}"
						validatorMessage="El campo de propiedad intelectual debe ser de máximo 3000 caracteres"
						maxlength="3000" counter="counterPropiedadIntelectual"
						counterTemplate="{0} caracteres restantes">
						<f:validateLength minimum="2" maximum="3000" />
					</p:inputTextarea>
					<p:message for="propiedadIntelecutal" />

					<h:outputText />
					<h:outputText id="counterPropiedadIntelectual" />
					<h:outputText />
					
					<h:outputText
						value="Considereaciones éticas: "
						styleClass="labels_proyecto2" />
					<p:inputTextarea rows="5" cols="80" id="consideracionesEticas"
						value="#{manejadorTerminosReferenciaConvocatoria.convocatoria.consideracionesEticas}"
						validatorMessage="Las consieraciones éticas debe ser de máximo 3000 caracteres"
						maxlength="3000" counter="counterConsideracionesEticas"
						counterTemplate="{0} caracteres restantes">
						<f:validateLength minimum="2" maximum="3000" />
					</p:inputTextarea>
					<p:message for="consideracionesEticas" />

					<h:outputText />
					<h:outputText id="counterConsideracionesEticas" />
					<h:outputText />
					
					<h:outputText
						value="Dependencia responsable del seguimiento técnico y financiero: "
						styleClass="labels_proyecto2" />
					<p:inputTextarea rows="5" cols="80" id="responsableSeguimiento"
						value="#{manejadorTerminosReferenciaConvocatoria.convocatoria.dependenciaResponsableSeguimientoTecnico}"
						requiredMessage="La dependencia responsable del seguimiento técnico y financiero es obligatoria"
						validatorMessage="La dependencia responsable del seguimiento técnico y financiero debe ser de máximo 1000 caracteres"
						maxlength="1000" counter="counterResponsableSeguimiento"
						counterTemplate="{0} caracteres restantes">
						<f:validateLength minimum="2" maximum="1000" />
					</p:inputTextarea>
					<p:message for="responsableSeguimiento" />

					<h:outputText />
					<h:outputText id="counterResponsableSeguimiento" />
					<h:outputText />

					<h:outputText value="Las propuestas financiadas pueden modificarse durante la fase de ejecución: "
						styleClass="labels_proyecto2" />
					<p:selectOneMenu id="propuestasModificablesEjecucion"
						value="#{manejadorTerminosReferenciaConvocatoria.convocatoria.propuestasModificablesEjecucion}">
						<f:selectItem itemLabel="Seleccione una opción" itemValue="" />
						<f:selectItem itemLabel="Si" itemValue="SI" />
						<f:selectItem itemLabel="No" itemValue="NO" />
					</p:selectOneMenu>
					<p:message for="propuestasModificablesEjecucion" />
					
					<h:outputText
						value="Consideraciones: "
						styleClass="labels_proyecto2" />
					<p:inputTextarea rows="5" cols="80" id="textoConsideraciones"
						value="#{manejadorTerminosReferenciaConvocatoria.convocatoria.textoConsideraciones}"
						validatorMessage="Las consideraciones deben ser de máximo 4000 caracteres"
						maxlength="4000" counter="counterTextoConsideraciones"
						counterTemplate="{0} caracteres restantes">
						<f:validateLength minimum="2" maximum="4000" />
					</p:inputTextarea>
					<p:message for="textoConsideraciones" />

					<h:outputText />
					<h:outputText id="counterTextoConsideraciones" />
					<h:outputText />
					
					<h:outputText />
					<h:outputText value="Nota: El reporte de los términos de referencia se va a generar con las consideraciones generales contempladas en todas las convocatorias." />
					<h:outputText />
				</h:panelGrid>
			</p:panel>
			<br />
			<p:panel id="panelInfoAdicional" header="Mayor información">
				<h:panelGrid columns="3" align="center" cellpadding="5"
					cellspacing="5">
					
					<h:outputText
						value="Información adicional: "
						styleClass="labels_proyecto2" />
					<p:inputTextarea rows="5" cols="80" id="textoMayorInformacion"
						value="#{manejadorTerminosReferenciaConvocatoria.convocatoria.textoMayorInformacion}"
						validatorMessage="La información adicional debe ser de máximo 4000 caracteres"
						maxlength="4000" counter="counterTextoMayorInformacion"
						counterTemplate="{0} caracteres restantes">
						<f:validateLength minimum="2" maximum="4000" />
					</p:inputTextarea>
					<p:message for="textoMayorInformacion" />

					<h:outputText />
					<h:outputText id="counterTextoMayorInformacion" />
					<h:outputText />
					
					<h:outputText />
					<h:outputText value="Nota: El reporte de los términos de referencia se va a generar con los datos de información sobre el sistema HERMES para dudas sobre el formulario de la convocatoria." />
					<h:outputText />

				</h:panelGrid>
			</p:panel>
			<br />
			<center>
				<h:panelGrid columns="3">
					<p:commandButton value="Guardar y salir"
						action="#{manejadorTerminosReferenciaConvocatoria.guardarConsideracionesSalir}"
						id="botonGuardarFinalizar1" styleClass="ui-priority-primary"
						ajax="false" />

					<p:commandButton value="Guardar y continuar"
						action="#{manejadorTerminosReferenciaConvocatoria.guardarConsideraciones}"
						id="botonGuardarFinalizar3" styleClass="ui-priority-primary"
						ajax="false" />
				</h:panelGrid>
			</center>
		</h:form>
		<p:dialog widgetVar="dialogEspere" resizable="false" closable="false"
			modal="true">
			<p:graphicImage value="/images/ajaxloading.gif" />
   					 Por favor espere...
   	 </p:dialog>
	</ui:define>
</ui:composition>
