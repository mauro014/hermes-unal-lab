<?xml version='1.0' encoding='ISO-8859-1' ?>
<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:t="http://myfaces.apache.org/tomahawk"
	xmlns:s="http://myfaces.apache.org/sandbox"
	xmlns:pe="http://primefaces.org/ui/extensions"
	template="../../../templates/common.xhtml">
	<ui:define name="content">
		<h:form>
			<t:div styleClass="contenido-titulo-general-myriad">Información financiera</t:div>
			<p:menubar>
				<p:menuitem value="Información general"
					action="crearTerminiosReferenciaConvocatoria" icon="pi pi-times" />
				<p:menuitem value="Modalidades" action="modalidadesConvocatoriaTR"
					icon="pi pi-times" />
				<p:menuitem value="Información financiera"
					action="informacionFinancieraConvocatoriaTR" icon="pi pi-times" />
				<p:menuitem value="Requisitos" action="requisitosConvocatoriaTR"
					icon="pi pi-times" />
				<p:menuitem value="Documentación"
					action="documentacionConvocatoriaTR" icon="pi pi-times" />
				<p:menuitem value="Selección ganadores"
					action="seleccionGanadoresConvocatoriaTR" icon="pi pi-times" />
				<p:menuitem value="Compromisos" action="compromisosConvocatoriaTR"
					icon="pi pi-times" />
				<p:menuitem value="Productos esperados"
					action="productosEsperadosConvocatoriaTR" icon="pi pi-times" />
				<p:menuitem value="Icompatibilidades"
					action="incompatibilidadesConvocatoriaTR" icon="pi pi-times" />
				<p:menuitem value="Calendario" action="calendarioConvocatoriaTR"
					icon="pi pi-times" />
				<p:menuitem value="Consideraciones"
					action="consideracionesConvocatoriaTR" icon="pi pi-times" />
			</p:menubar>
			<p:messages id="messages" showDetail="false" autoUpdate="true"
				closable="true" />
			<br />
			<p:panel id="panelCreacionConvocatoria">
				<h:panelGrid columns="3" align="center" cellpadding="5"
					cellspacing="5">

					<h:outputText
						value="Recursos disponibles para la convocatoria y fuente de dichos recursos: "
						styleClass="labels_proyecto2" />
					<p:inputTextarea id="fuenteRecursos"
						value="#{manejadorTerminosReferenciaConvocatoria.convocatoria.recursosDisponibles}"
						rows="3" cols="60" required="false"
						validatorMessage="El campo Recursos disponibles para la convocatoria y fuente de dichos recursos debe ser de máximo 3000 caracteres"
						maxlength="3000" counter="counterFuenteRecursos"
						counterTemplate="{0} caracteres restantes">
						<f:validateLength minimum="0" maximum="3000" />
					</p:inputTextarea>
					<p:message for="fuenteRecursos" />

					<h:outputText />
					<h:outputText id="counterFuenteRecursos" />
					<h:outputText />

					<h:outputText value="Unidad ejecutora: "
						styleClass="labels_proyecto2" />
					<p:inputTextarea id="unidadEjecutra"
						value="#{manejadorTerminosReferenciaConvocatoria.convocatoria.unidadEjecutra}"
						rows="3" cols="60" required="false"
						validatorMessage="El campo Unidad ejecutora debe ser de máximo 3000 caracteres"
						maxlength="3000" counter="counterUnidadEjecutra"
						counterTemplate="{0} caracteres restantes">
						<f:validateLength minimum="0" maximum="3000" />
					</p:inputTextarea>
					<p:message for="unidadEjecutra" />

					<h:outputText />
					<h:outputText id="counterUnidadEjecutra" />
					<h:outputText />

					<h:outputText value="Apoyo a ganadores: "
						styleClass="labels_proyecto2" />
					<p:inputText id="apoyoGanadores"
						value="#{manejadorTerminosReferenciaConvocatoria.convocatoria.apoyoGanadores}"
						size="20" required="false">
						<f:validateLength minimum="0" maximum="20" />
					</p:inputText>
					<p:message for="apoyoGanadores" />

					<h:outputText
						value="Liquidación de proyectos y devolución de saldos: "
						styleClass="labels_proyecto2" />
					<p:inputTextarea id="liquidacionProyectos"
						value="#{manejadorTerminosReferenciaConvocatoria.convocatoria.liquidacionProyectos}"
						rows="3" cols="60" required="false"
						validatorMessage="El campo Liquidación de proyectos y devolución de saldos debe ser de máximo 3000 caracteres"
						maxlength="3000" counter="counterLiquidacionProyectos"
						counterTemplate="{0} caracteres restantes">
						<f:validateLength minimum="0" maximum="3000" />
					</p:inputTextarea>
					<p:message for="liquidacionProyectos" />

					<h:outputText />
					<h:outputText id="counterLiquidacionProyectos" />
					<h:outputText />
				</h:panelGrid>
				
				<p:separator />

				<t:div
					style="text-align: center; margin-bottom: 10px; margin-top: 30px;">
					<h:outputText value="RUBROS FINANCIABLES"
						style="font-weight: bold;" />
				</t:div>

				<h:panelGrid columns="3" align="center" cellpadding="5"
					cellspacing="5">

					<h:outputText value="Rubro: "
						styleClass="labels_proyecto2" />
					<p:selectOneMenu id="tipoRubro"
						value="#{manejadorTerminosReferenciaConvocatoria.rubro.tipoRubro.id}">
						<f:selectItem itemLabel="Seleccione una opción" itemValue="" />
						<f:selectItems
							value="#{manejadorTerminosReferenciaConvocatoria.tipoRubroItems}" />
					</p:selectOneMenu>
					<p:message for="tipoRubro" />

					<h:outputText
						value="Justificación: "
						styleClass="labels_proyecto2" />
					<p:inputTextarea id="justificacionRubros"
						value="#{manejadorTerminosReferenciaConvocatoria.rubro.justificacion}"
						rows="3" cols="60" required="false"
						validatorMessage="El campo Liquidación de proyectos y devolución de saldos debe ser de máximo 2000 caracteres"
						maxlength="2000" counter="counterJustificacionRubros"
						counterTemplate="{0} caracteres restantes">
						<f:validateLength minimum="0" maximum="2000" />
					</p:inputTextarea>
					<p:message for="justificacionRubros" />

					<h:outputText />
					<h:outputText id="counterJustificacionRubros" />
					<h:outputText />
				</h:panelGrid>

				<center>
					<h:panelGrid columns="1" align="center">
						<p:commandButton
							action="#{manejadorTerminosReferenciaConvocatoria.adicionarRubro}"
							value="Agregar"
							update="panelCreacionConvocatoria, tablaRubro"
							onstart="dialogEspere.show()" oncomplete="dialogEspere.hide()" />
					</h:panelGrid>
				</center>

				<br />

				<p:dataTable
					value="#{manejadorTerminosReferenciaConvocatoria.convocatoria.listaRubrosConvocatoriaTR}"
					id="tablaRubro" var="moda" cellpadding="1" cellspacing="15"
					editable="true" align="center">
					<p:column headerText="Rubro">
							<h:outputText value="#{moda.tipoRubro.nombre}" />
					</p:column>
					<p:column headerText="Justificación">
						<p:cellEditor>
							<f:facet name="output">
								<h:outputText value="#{moda.justificacion}" />
							</f:facet>
							<f:facet name="input">
								<p:inputTextarea value="#{moda.justificacion}" styleClass="texto"
									rows="3" cols="40" style="width:100%" />
							</f:facet>
						</p:cellEditor>
					</p:column>
					<p:column headerText="Orden">
						<p:cellEditor>
							<f:facet name="output">
								<h:outputText value="#{moda.orden}" />
							</f:facet>
							<f:facet name="input">
								<p:inputText id="modelInput" value="#{moda.orden}"
									style="width:100%" />
							</f:facet>
						</p:cellEditor>
					</p:column>
					<p:column style="width:35px" headerText="Editar">
						<p:rowEditor />
					</p:column>
					<p:column headerText="Eliminar">
						<center>
							<p:commandButton
								action="#{manejadorTerminosReferenciaConvocatoria.eliminarRubro}"
								update="@form"
								onclick="if(!confirm('¿Está seguro(a) de eliminar el rubro?'))return false"
								id="eliminarRubro" icon="ui-icon-trash"
								title="Eliminar rubro">

								<f:setPropertyActionListener value="#{moda}"
									target="#{manejadorTerminosReferenciaConvocatoria.rubroTRSeleccionado}" />
							</p:commandButton>
						</center>


					</p:column>
				</p:dataTable>

			</p:panel>
			<br />
			<center>
				<h:panelGrid columns="3">
					<p:commandButton value="Guardar y salir"
						action="#{manejadorTerminosReferenciaConvocatoria.guardarInformacionFinancieraSalir}"
						id="botonGuardarFinalizar1" styleClass="ui-priority-primary"
						ajax="false" />

					<p:commandButton value="Guardar y continuar"
						action="#{manejadorTerminosReferenciaConvocatoria.guardarInformacionFinanciera}"
						id="botonGuardarFinalizar3" styleClass="ui-priority-primary"
						ajax="false" />
				</h:panelGrid>
			</center>
		</h:form>
		<p:dialog widgetVar="dialogEspere" resizable="false" closable="false"
			modal="true">
			<p:graphicImage value="/images/ajaxloading.gif" />
   					 Por favor espere...
   	 </p:dialog>
	</ui:define>
</ui:composition>
