<?xml version='1.0' encoding='ISO-8859-1' ?>
<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:t="http://myfaces.apache.org/tomahawk"
	xmlns:s="http://myfaces.apache.org/sandbox"
	xmlns:pe="http://primefaces.org/ui/extensions"
	template="../../../templates/common.xhtml">
	<ui:define name="content">
		<h:form>
			<t:div styleClass="contenido-titulo-general-myriad">Información General</t:div>
			<p:menubar>
				<p:menuitem value="Información general"
					action="crearTerminiosReferenciaConvocatoria" icon="pi pi-times" />
				<p:menuitem value="Modalidades" action="modalidadesConvocatoriaTR"
					icon="pi pi-times" />
				<p:menuitem value="Información financiera"
					action="informacionFinancieraConvocatoriaTR" icon="pi pi-times" />
				<p:menuitem value="Requisitos" action="requisitosConvocatoriaTR"
					icon="pi pi-times" />
				<p:menuitem value="Documentación"
					action="documentacionConvocatoriaTR" icon="pi pi-times" />
				<p:menuitem value="Selección ganadores"
					action="seleccionGanadoresConvocatoriaTR" icon="pi pi-times" />
				<p:menuitem value="Compromisos" action="compromisosConvocatoriaTR"
					icon="pi pi-times" />
				<p:menuitem value="Productos esperados"
					action="productosEsperadosConvocatoriaTR" icon="pi pi-times" />
				<p:menuitem value="Icompatibilidades"
					action="incompatibilidadesConvocatoriaTR" icon="pi pi-times" />
				<p:menuitem value="Calendario" action="calendarioConvocatoriaTR"
					icon="pi pi-times" />
				<p:menuitem value="Consideraciones"
					action="consideracionesConvocatoriaTR" icon="pi pi-times" />
			</p:menubar>
			<p:messages id="messages" showDetail="false" autoUpdate="true"
				closable="true" />
			<br />
			<p:panel id="panelCreacionConvocatoria" header="Información general">
				<h:panelGrid columns="3" align="center" cellpadding="5"
					cellspacing="5">

					<h:outputText value="Tipo de convocatoria: "
						styleClass="labels_proyecto2" />
					<p:selectOneMenu id="tipoConv"
						value="#{manejadorTerminosReferenciaConvocatoria.convocatoria.tipoConvocatoria}">
						<f:selectItem itemLabel="Seleccione una opción" itemValue="" />
						<f:selectItems
							value="#{manejadorTerminosReferenciaConvocatoria.tipoConvocatoriaItem}" />
						<p:ajax
							update="panelCreacionConvocatoria, otroTipoConvocatoria, msgOtroTipoConvocatoria, txtOtroTipoConvocatoria"
							process="panelCreacionConvocatoria, otroTipoConvocatoria, msgOtroTipoConvocatoria, txtOtroTipoConvocatoria" />
					</p:selectOneMenu>
					<p:message for="tipoConv" />

					<h:outputText id="txtOtroTipoConvocatoria" value="¿Cuál?:"
						rendered="#{manejadorTerminosReferenciaConvocatoria.convocatoria.tipoConvocatoria == '14'}"
						styleClass="labels_proyecto2" />
					<p:inputText id="otroTipoConvocatoria"
						rendered="#{manejadorTerminosReferenciaConvocatoria.convocatoria.tipoConvocatoria == '14'}"
						value="#{manejadorTerminosReferenciaConvocatoria.convocatoria.otroTipoConvocatoria}"
						size="80" required="false">
					</p:inputText>
					<p:message id="msgOtroTipoConvocatoria" for="otroTipoConvocatoria"
						rendered="#{manejadorTerminosReferenciaConvocatoria.convocatoria.tipoConvocatoria == '14'}" />

					<h:outputText value="Titulo: " styleClass="labels_proyecto2" />
					<p:inputTextarea rows="5" cols="80" id="tituloConv"
						value="#{manejadorTerminosReferenciaConvocatoria.convocatoria.titulo}"
						requiredMessage="El título de la convocatoria es obligatorio"
						validatorMessage="El título debe ser de máximo 500 caracteres"
						maxlength="500" counter="counterTitulo"
						counterTemplate="{0} caracteres restantes">
						<f:validateLength minimum="2" maximum="500" />
					</p:inputTextarea>
					<p:message for="tituloConv" />

					<h:outputText />
					<h:outputText id="counterTitulo" />
					<h:outputText />

					<h:outputText value="Introducción: " styleClass="labels_proyecto2" />
					<p:inputTextarea id="introduccion"
						value="#{manejadorTerminosReferenciaConvocatoria.convocatoria.introduccion}"
						rows="3" cols="60" required="false"
						validatorMessage="El campo introduccion debe ser de máximo 3000 caracteres"
						maxlength="3000" counter="counterIntroduccion"
						counterTemplate="{0} caracteres restantes">
						<f:validateLength minimum="0" maximum="3000" />
					</p:inputTextarea>
					<p:message for="introduccion" />

					<h:outputText />
					<h:outputText id="counterIntroduccion" />
					<h:outputText />

					<h:outputText value="Presentación: " styleClass="labels_proyecto2" />
					<p:inputTextarea id="presentacion"
						value="#{manejadorTerminosReferenciaConvocatoria.convocatoria.presentacion}"
						rows="3" cols="60" required="false"
						validatorMessage="El campo presentacion debe ser de máximo 3000 caracteres"
						maxlength="3000" counter="counterPresentacion"
						counterTemplate="{0} caracteres restantes">
						<f:validateLength minimum="0" maximum="3000" />
					</p:inputTextarea>
					<p:message for="presentacion" />

					<h:outputText />
					<h:outputText id="counterPresentacion" />
					<h:outputText />

					<h:outputText value="Antecedentes: " styleClass="labels_proyecto2" />
					<p:inputTextarea id="antecedentes"
						value="#{manejadorTerminosReferenciaConvocatoria.convocatoria.antecedentes}"
						rows="3" cols="60" required="false"
						validatorMessage="El campo antecedentes debe ser de máximo 3000 caracteres"
						maxlength="3000" counter="counterAntecedentes"
						counterTemplate="{0} caracteres restantes">
						<f:validateLength minimum="0" maximum="3000" />
					</p:inputTextarea>
					<p:message for="antecedentes" />


					<h:outputText />
					<h:outputText id="counterAntecedentes" />
					<h:outputText />

				</h:panelGrid>

				<p:separator />

				<t:div
					style="text-align: center; margin-bottom: 10px; margin-top: 30px;">
					<h:outputText value="CAMPOS ADICIONALES" style="font-weight: bold;" />
				</t:div>

				<p:panelGrid id="panelGridCamposAdicionales"
					styleClass="estilo-panelgrid-sinbordes">
					<p:row>
						<p:column style="width:180px">
							<h:outputText value="Campo:" />
						</p:column>
						<p:column>
							<p:inputTextarea id="nombreCampo"
								value="#{manejadorTerminosReferenciaConvocatoria.campo.nombre}"
								rows="3" cols="60" required="false"
								validatorMessage="El nombre del campo adicional debe ser de máximo 3000 caracteres"
								maxlength="3000" counterTemplate="{0} caracteres restantes">
								<f:validateLength minimum="0" maximum="3000" />
							</p:inputTextarea>
						</p:column>
					</p:row>
					<p:row>
						<p:column style="width:180px">
							<h:outputText value="Descripción: " />
						</p:column>
						<p:column>
							<p:inputTextarea id="descripcionCampo"
								value="#{manejadorTerminosReferenciaConvocatoria.campo.descripcion}"
								rows="3" cols="60" required="false"
								validatorMessage="La descripción del campo adicional debe ser de máximo 3000 caracteres"
								maxlength="3000" counterTemplate="{0} caracteres restantes">
								<f:validateLength minimum="0" maximum="3000" />
							</p:inputTextarea>
						</p:column>
					</p:row>
					<p:row>
						<p:column colspan="2" style="text-align: center;">
							<p:commandButton id="botonAgregarCampoAdicional"
								action="#{manejadorTerminosReferenciaConvocatoria.adicionarCampoAdicional}"
								value="Adicionar campo" icon="ui-icon-plus"
								update="camposAdicionalesTabla, panelGridCamposAdicionales"
								onstart="dialogEspere.show()" oncomplete="dialogEspere.hide()" />
							<p:commandButton id="btndpn" icon="ui-icon-info" />
						</p:column>
					</p:row>
					<p:row>
						<p:column id="msgDep" colspan="2" style="text-align: center;">
							<p:message id="msgTester" for="botonAgregarCampoAdicional"
								showSummary="false" />
						</p:column>
					</p:row>
				</p:panelGrid>
				<p:dataTable id="camposAdicionalesTabla" var="campo"
					style="margin-top: 10px; width: 550px;"
					value="#{manejadorTerminosReferenciaConvocatoria.convocatoria.listaCamposAdicionalesConvocatoriaTR}"
					styleClass="estilo-panelgrid-sinbordes"
					emptyMessage="No se han agregado dependencias" editable="true">
					<p:column headerText="Nombre campo">
						<h:outputText value="#{campo.nombre}" />
					</p:column>
					<p:column style="text-align: center;">
						<f:facet name="header">
							<h:outputText value="Descripción campo" />
						</f:facet>
						<p:cellEditor>
							<f:facet name="output">
								<h:outputText value="#{campo.descripcion}" />
							</f:facet>
							<f:facet name="input">
								<p:inputTextarea rows="3" maxlength="2000"
									value="#{campo.descripcion}" style="width:100%" />
							</f:facet>
						</p:cellEditor>
					</p:column>

					<p:column style="width:10%; text-align: center;">
						<f:facet name="header">
							<h:outputText value="Editar" />
						</f:facet>
						<p:rowEditor />
					</p:column>

					<p:column headerText="Eliminar" id="columndCampo"
						style="text-align: center;">
						<p:commandButton
							action="#{manejadorTerminosReferenciaConvocatoria.eliminarCampoAdicional}"
							update="camposAdicionalesTabla" id="eliminarCampoAdicional"
							icon="ui-icon-trash" title="Eliminar campo"
							onstart="dialogEspere.show()" oncomplete="dialogEspere.hide()">
							<f:setPropertyActionListener value="#{campo}"
								target="#{manejadorTerminosReferenciaConvocatoria.campoTRSeleccionado}" />
						</p:commandButton>
					</p:column>
				</p:dataTable>

				<p:separator />

				<t:div
					style="text-align: center; margin-bottom: 10px; margin-top: 30px;">
					<h:outputText value="OBJETIVO GENERAL" style="font-weight: bold;" />
				</t:div>

				<h:panelGrid columns="3" align="center" cellpadding="5"
					cellspacing="5" id="pgObjGen">

					<h:outputText value="Objetivo general: "
						styleClass="labels_proyecto2" />
					<p:inputTextarea id="objetivo"
						value="#{manejadorTerminosReferenciaConvocatoria.convocatoria.objetivo}"
						rows="3" cols="60"
						requiredMessage="El objetivo de la modalidad es obligatorio"
						validatorMessage="El objetivo de la modalidad debe ser de máximo 3000 caracteres"
						maxlength="3000" counter="counterObjetivo"
						counterTemplate="{0} caracteres restantes">
						<f:validateLength minimum="0" maximum="3000" />
					</p:inputTextarea>
					<p:message for="objetivo" />

					<h:outputText />
					<h:outputText id="counterObjetivo" />
					<h:outputText />

				</h:panelGrid>

				<p:separator />

				<t:div
					style="text-align: center; margin-bottom: 10px; margin-top: 30px;">
					<h:outputText value="OBJETIVOS ESPECÍFICOS"
						style="font-weight: bold;" />
				</t:div>

				<p:panelGrid styleClass="estilo-panelgrid-sinbordes">
					<p:row>
						<p:column style="width:180px">
							<h:outputText
								value="Por favor ingrese cada objetivo específico (Máx. 2000 caracteres):" />
						</p:column>
						<p:column>
							<p:inputTextarea
								value="#{manejadorTerminosReferenciaConvocatoria.objetivo.descripcion}"
								rows="3" id="objetoEspecifico"
								style="width: 350px; height: 60px;"
								validatorMessage="El objetivo específico debe estar entre 1 - 2000 caracteres"
								counter="counterObjetivo" maxlength="2000"
								counterTemplate="{0} caracteres restantes.">
							</p:inputTextarea>
							<p:message id="msgObjEsp" for="objetoEspecifico"
								showSummary="false"></p:message>
							<h:outputText id="counterObjetivo" />
						</p:column>
					</p:row>
					<p:row>
						<p:column style="text-align: center;" colspan="2">
							<p:commandButton
								action="#{manejadorTerminosReferenciaConvocatoria.adicionarObjetivo}"
								value="Adicionar objetivo" icon="ui-icon-plus"
								update="objetivoEspTable, objetoEspecifico, msgObjEsp"
								onstart="dialogEspere.show()" oncomplete="dialogEspere.hide()" />
						</p:column>
					</p:row>
					<p:row>
						<p:column colspan="2">
							<p:dataTable id="objetivoEspTable"
								value="#{manejadorTerminosReferenciaConvocatoria.convocatoria.listaObjetivosEspecificosConvocatoriaTR}"
								var="obj"
								emptyMessage="No se encuentran objetivos específicos registrados"
								editable="true" style="margin-top: 10px;width:550px;">

								<p:column style="font-weight: bold;width:5%;">
									<f:facet name="header">
										<h:outputText value="" />
									</f:facet>
									<h:outputText value="#{obj.orden}" />
								</p:column>

								<p:column style="width:70%;">
									<f:facet name="header">
										<h:outputText value="Objetivo Específico" />
									</f:facet>
									<p:cellEditor>
										<f:facet name="output">
											<h:outputText value="#{obj.descripcion}" />
										</f:facet>
										<f:facet name="input">
											<p:inputTextarea rows="3" maxlength="2000"
												value="#{obj.descripcion}" style="width:100%" />
										</f:facet>
									</p:cellEditor>
								</p:column>
								<p:column style="width:10%; text-align: center;">
									<f:facet name="header">
										<h:outputText value="Editar" />
									</f:facet>
									<p:rowEditor />
								</p:column>
								<p:column style="width:10%; text-align: center;">
									<f:facet name="header">
										<h:outputText value="Eliminar" />
									</f:facet>
									<p:commandButton id="selectButton"
										update="objetivoEspTable,@form" icon="ui-icon-trash"
										action="#{manejadorTerminosReferenciaConvocatoria.eliminarObjetivos}"
										title="Eliminar objetivo específico"
										onstart="dialogEspere.show()" oncomplete="dialogEspere.hide()">
										<f:setPropertyActionListener value="#{obj}"
											target="#{manejadorTerminosReferenciaConvocatoria.objetivoTRSeleccionado}" />
									</p:commandButton>
								</p:column>
							</p:dataTable>
						</p:column>
					</p:row>
				</p:panelGrid>

				<p:separator />

				<t:div
					style="text-align: center; margin-bottom: 10px; margin-top: 30px;">
					<h:outputText value="INFORMACIÓN DE CAMPOS DIRIGIDO A Y DURACIÓN"
						style="font-weight: bold;" />
				</t:div>

				<h:panelGrid columns="3" align="center" cellpadding="5"
					cellspacing="5" id="pgDirigido">

					<h:outputText value="Dirigido a : " styleClass="labels_proyecto2" />
					<p:inputTextarea id="dirigidoA"
						value="#{manejadorTerminosReferenciaConvocatoria.convocatoria.dirigidoA}"
						rows="3" cols="60" required="false"
						validatorMessage="El campo dirigido a debe ser de máximo 3000 caracteres"
						maxlength="3000" counter="counterDirigido"
						counterTemplate="{0} caracteres restantes">
						<f:validateLength minimum="0" maximum="3000" />
					</p:inputTextarea>
					<p:message for="dirigidoA" />

					<h:outputText />
					<h:outputText id="counterDirigido" />
					<h:outputText />

					<h:outputText value="Duración de la ejecución en meses: "
						styleClass="labels_proyecto2" />
					<p:inputText id="duracionProyecto"
						value="#{manejadorTerminosReferenciaConvocatoria.convocatoria.duracion}"
						size="5" required="false">
						<f:validateLength minimum="0" maximum="10" />
					</p:inputText>
					<p:message for="duracionProyecto" />

				</h:panelGrid>

				<p:separator />

				<t:div
					style="text-align: center; margin-bottom: 10px; margin-top: 30px;">
					<h:outputText value="DEPENDENCIAS RESPONSABLES"
						style="font-weight: bold;" />
				</t:div>

				<p:panelGrid id="panelGridDependencia"
					styleClass="estilo-panelgrid-sinbordes">
					<p:row>
						<p:column style="width:180px">
							<h:outputText value="Sede:" />
						</p:column>
						<p:column>
							<p:selectOneMenu
								value="#{manejadorTerminosReferenciaConvocatoria.sedeSel}"
								id="sedeUN" style="width:350px">
								<f:selectItem itemLabel="Seleccione una opción" itemValue="" />
								<f:selectItems
									value="#{manejadorTerminosReferenciaConvocatoria.sedeItem}" />
								<p:ajax
									listener="#{manejadorTerminosReferenciaConvocatoria.cambiarSede}"
									update="panelGridDependencia" process="panelGridDependencia"
									onstart="dialogEspere.show()" oncomplete="dialogEspere.hide()" />
							</p:selectOneMenu>
						</p:column>
					</p:row>
					<p:row
						rendered="#{manejadorTerminosReferenciaConvocatoria.mostrarFacultades}">
						<p:column>
							<h:outputText value="Facultad:" />
						</p:column>
						<p:column>
							<p:selectOneMenu
								value="#{manejadorTerminosReferenciaConvocatoria.facultadSel}"
								filter="true" filterMatchMode="contains" id="facultadUN"
								style="width:350px" panelStyle="350px">
								<f:selectItems
									value="#{manejadorTerminosReferenciaConvocatoria.facultadItem}" />
								<p:ajax
									listener="#{manejadorTerminosReferenciaConvocatoria.cambiarFacultad}"
									update="panelGridDependencia" process="panelGridDependencia"
									onstart="dialogEspere.show()" oncomplete="dialogEspere.hide()" />
							</p:selectOneMenu>
							<p:tooltip for="facultadUN" showEffect="fade" hideEffect="fade">
								<h:panelGrid columns="1"
									style="border-bottom: 0px; padding-bottom: 0px; width: 350px">
									<h:outputText
										value="Seleccione el Centro, Facultad, Dirección o Instituto correspondiente." />
								</h:panelGrid>
							</p:tooltip>
						</p:column>
					</p:row>
					<p:row>
						<p:column>
							<h:outputText value="Dependencia:" />
						</p:column>
						<p:column>
							<p:selectOneMenu filter="true" filterMatchMode="contains"
								value="#{manejadorTerminosReferenciaConvocatoria.dependenciaConvocatoria}"
								id="dependenciasUN" style="width:350px" panelStyle="width:350px">
								<f:selectItem itemLabel="Seleccione una opción" itemValue="" />
								<f:selectItems
									value="#{manejadorTerminosReferenciaConvocatoria.dependenciaItem}" />
							</p:selectOneMenu>
							<p:tooltip for="dependenciasUN" showEffect="fade"
								hideEffect="fade">
								<h:panelGrid columns="1"
									style="border-bottom: 0px; padding-bottom: 0px; width: 350px">
									<h:outputText
										value="Para agregar la dependencia seleccionada, por favor haga clic en el botón Adicionar Dependencia." />
								</h:panelGrid>
							</p:tooltip>
						</p:column>
					</p:row>
					<p:row>
						<p:column colspan="2" style="text-align: center;">
							<p:commandButton id="botonAgregarDependencia"
								action="#{manejadorTerminosReferenciaConvocatoria.adicionarDependencia}"
								value="Adicionar dependencia" icon="ui-icon-plus"
								update="dependenciasTabla, panelGridDependencia"
								onstart="dialogEspere.show()" oncomplete="dialogEspere.hide()" />
							<p:commandButton id="btndpn" icon="ui-icon-info" />
							<p:tooltip for="btndpn" showEffect="fade" hideEffect="fade">
								<p:panelGrid columns="1"
									style="width: 350px; font-weight: bold;"
									styleClass="estilo-panelgrid-sinbordes"
									id="paneltoolAdicionarDependencia">
									<h:outputText
										value="Para agregar la dependencia seleccionada, por favor haga clic en el botón 'Adicionar Dependencia'." />
								</p:panelGrid>
							</p:tooltip>
						</p:column>
					</p:row>
					<p:row>
						<p:column id="msgDep" colspan="2" style="text-align: center;">
							<p:message id="msgTester" for="botonAgregarDependencia"
								showSummary="false" />
						</p:column>
					</p:row>
				</p:panelGrid>
				<p:dataTable id="dependenciasTabla" var="dependencia"
					style="margin-top: 10px; width: 550px;"
					value="#{manejadorTerminosReferenciaConvocatoria.convocatoria.listaDependenciasConvocatoriraTR}"
					styleClass="estilo-panelgrid-sinbordes"
					emptyMessage="No se han agregado dependencias">
					<p:column headerText="Dependencia">
						<h:outputText value="#{dependencia.dependencia.nombre}" />
					</p:column>
					<p:column headerText="Sede" style="text-align: center;">
						<h:outputText value=" #{dependencia.dependencia.sede.nombre}" />
					</p:column>
					<p:column headerText="Eliminar" id="columndependencia"
						style="text-align: center;">
						<p:commandButton
							action="#{manejadorTerminosReferenciaConvocatoria.eliminarDependencia}"
							update="dependenciasTabla" id="eliminardependencia"
							icon="ui-icon-trash" title="Eliminar dependencia"
							onstart="dialogEspere.show()" oncomplete="dialogEspere.hide()">
							<f:setPropertyActionListener value="#{dependencia}"
								target="#{manejadorTerminosReferenciaConvocatoria.dependenciaTRSeleccionada}" />
						</p:commandButton>
					</p:column>
				</p:dataTable>

			</p:panel>
			<br />
			<center>
				<h:panelGrid columns="3">
					<p:commandButton value="Guardar y salir"
						action="#{manejadorTerminosReferenciaConvocatoria.guardarInformacionGeneralSalir}"
						id="botonGuardarFinalizar1" styleClass="ui-priority-primary"
						ajax="false" />
