<?xml version='1.0' encoding='ISO-8859-1' ?>
<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:t="http://myfaces.apache.org/tomahawk"
	template="../../templates/common.xhtml">

	<ui:define name="content">

		<h:form id="formCrearConv" enctype="multipart/form-data"
			styleClass="estilo-panelgrid-sinbordes">

			<t:div styleClass="contenido-titulo-general-myriad">Generalidades</t:div>
			<br />

			<p:outputPanel
				rendered="#{manejadorInsercionConvocatorias.esConvocatoriaProyectos}">
				<p:menubar>
					<p:menuitem value="Generalidades"
						action="irGeneralidadesConvocatoria" icon="ui-icon-triangle-1-e"
						disabled="#{!manejadorInsercionConvocatorias.activarGeneralidades}" />
					<p:menuitem value="Requisitos" action="irRequisitosConvocatoria"
						icon="ui-icon-triangle-1-e"
						disabled="#{!manejadorInsercionConvocatorias.activarRequisitos}" />
					<p:menuitem value="Rubros" action="irRubrosConvocatoria"
						icon="ui-icon-triangle-1-e"
						disabled="#{!manejadorInsercionConvocatorias.activarRubros}" />
					<p:menuitem value="Compromisos" action="irCompromisosConvocatoria"
						icon="ui-icon-triangle-1-e"
						disabled="#{!manejadorInsercionConvocatorias.activarCompromisos}" />
					<p:menuitem value="Productos" action="irProductosConvocatoria"
						icon="ui-icon-triangle-1-e"
						disabled="#{!manejadorInsercionConvocatorias.activarProductos}" />
					<p:menuitem value="Criterios de evaluación"
						action="irCriteriosEvaluacionConvocatoria"
						icon="ui-icon-triangle-1-e"
						disabled="#{!manejadorInsercionConvocatorias.activarCriterios}" />
					<p:menuitem value="Información específica"
						action="irDetallesInformacionEspecifica"
						icon="ui-icon-triangle-1-e"
						disabled="#{!manejadorInsercionConvocatorias.activarInfoEspecifica}" />
				</p:menubar>
				<br />


				<h:outputText
					value="#{manejadorInsercionConvocatorias.avisoFormulario}"
					styleClass="mensajeerror" />
				<h:outputText value="#{manejadorInsercionConvocatorias.avisoFechas}"
					styleClass="mensajeerror" />
				<h:outputText
					value="#{manejadorInsercionConvocatorias.avisoRequisitos}"
					styleClass="mensajeerror" />
				<h:outputText value="#{manejadorInsercionConvocatorias.avisoRubros}"
					styleClass="mensajeerror" />
				<h:outputText
					value="#{manejadorInsercionConvocatorias.avisoCompromisos}"
					styleClass="mensajeerror" />
				<h:outputText
					value="#{manejadorInsercionConvocatorias.avisoProductos}"
					styleClass="mensajeerror" />
				<br />


				<p:panel id="panelGeneralidades"
					header="Datos básicos de la modalidad">
					<p:panelGrid columns="3" align="center" cellpadding="0"
						cellspacing="1" width="95%">
						<h:outputText value="Título de la modalidad : "
							styleClass="labels_proyecto2" />
						<p:inputTextarea rows="3" cols="60" id="titulo"
							value="#{manejadorInsercionConvocatorias.convocatoriaActual.titulo}"
							required="true"
							requiredMessage="El título de la modalidad es obligatorio"
							validatorMessage="El título de la modalidad debe ser de máximo 400 caracteres"
							maxlength="400" counter="counterTitulo"
							counterTemplate="{0} caracteres restantes">
							<f:validateLength minimum="0" maximum="400" />
						</p:inputTextarea>
						<p:message for="titulo" />

						<h:outputText />
						<h:outputText id="counterTitulo" />
						<h:outputText />


						<h:outputText value="Sede : " styleClass="labels_proyecto2" />
						<p:selectOneMenu id="sede" style="width:150px"
							value="#{manejadorInsercionConvocatorias.idSede}">
							<f:selectItems
								value="#{manejadorInsercionConvocatorias.sedeItem}" />
						</p:selectOneMenu>
						<p:message for="sede" />

						<h:outputText value="Estado : " styleClass="labels_proyecto2" />
						<p:selectOneMenu style="width:150px" id="estadoList"
							value="#{manejadorInsercionConvocatorias.estadoConvocatoria.id}">
							<f:selectItems
								value="#{manejadorInsercionConvocatorias.listaEstadosConvocatoria}"
								var="estadosConvocatoria"
								itemLabel="#{estadosConvocatoria.nombre}"
								itemValue="#{estadosConvocatoria.id}" />
						</p:selectOneMenu>
						<p:message for="estadoList" />

						<h:outputText value="Oferente : " styleClass="labels_proyecto2" />
						<p:inputTextarea id="oferente"
							value="#{manejadorInsercionConvocatorias.convocatoriaActual.oferente}"
							rows="3" cols="60" required="false"
							validatorMessage="El campo oferente debe ser de máximo 3000 caracteres"
							maxlength="3000" counter="counterOferente"
							counterTemplate="{0} caracteres restantes">
							<f:validateLength minimum="0" maximum="3000" />
						</p:inputTextarea>
						<p:message for="oferente" />

						<h:outputText />
						<h:outputText id="counterOferente" />
						<h:outputText />

						<h:outputText value="Objetivo : " styleClass="labels_proyecto2" />
						<p:inputTextarea id="objetivo"
							value="#{manejadorInsercionConvocatorias.convocatoriaActual.objetivo}"
							rows="3" cols="60" required="true"
							requiredMessage="El objetivo de la modalidad es obligatorio"
							validatorMessage="El objetivo de la modalidad debe ser de máximo 3000 caracteres"
							maxlength="3000" counter="counterObjetivo"
							counterTemplate="{0} caracteres restantes">
							<f:validateLength minimum="0" maximum="3000" />
						</p:inputTextarea>
						<p:message for="objetivo" />

						<h:outputText />
						<h:outputText id="counterObjetivo" />
						<h:outputText />

						<h:outputText value="Dirigido a : " styleClass="labels_proyecto2" />
						<p:inputTextarea id="dirigidoA"
							value="#{manejadorInsercionConvocatorias.convocatoriaActual.dirigidoA}"
							rows="3" cols="60" required="false"
							validatorMessage="El campo dirigido a debe ser de máximo 3000 caracteres"
							maxlength="3000" counter="counterDirigido"
							counterTemplate="{0} caracteres restantes">
							<f:validateLength minimum="0" maximum="3000" />
						</p:inputTextarea>
						<p:message for="dirigidoA" />

						<h:outputText />
						<h:outputText id="counterDirigido" />
						<h:outputText />

					</p:panelGrid>
				</p:panel>

				<br />

				<p:panel id="panelGrupos" header="¿Es convocatoria para grupos?">
					<h:panelGrid id="pgGruposConvo">

						<h:panelGrid columns="2" id="pgSelectGruposVisible">
							<h:outputText value="¿Es para grupos?"
								styleClass="labels_proyecto2" />
							<p:selectOneMenu id="esParaGrupos"
								value="#{manejadorInsercionConvocatorias.esParaGrupos}">
								<f:selectItem itemValue="S" itemLabel="Si" />
								<f:selectItem itemValue="N" itemLabel="No" />
								<p:ajax
									listener="#{manejadorInsercionConvocatorias.cambioSiNoGrupos}"
									update="pgSelectGruposVisible, gruposVisible, pgGruposConvo" />
							</p:selectOneMenu>
						</h:panelGrid>

						<h:panelGrid columns="2" id="gruposVisible" align="center"
							rendered="#{manejadorInsercionConvocatorias.visiblePanelGrupos}">

							<h:outputText
								value="Por favor seleccione el estado de los grupos de investigación que pueden participar en la convocatoria"
								styleClass="labels_proyecto2" />
							<p:selectManyCheckbox
								value="#{manejadorInsercionConvocatorias.listaTipoGrupos}"
								layout="pageDirection">
								<f:selectItem itemValue="A" itemLabel="Activo" />
								<f:selectItem itemValue="I" itemLabel="Ingresando" />
								<f:selectItem itemValue="S" itemLabel="Solicitud de aval" />
								<f:selectItem itemValue="C" itemLabel="Devuelto para correción" />
								<f:selectItem itemValue="P" itemLabel="Registrado" />
							</p:selectManyCheckbox>

							<h:outputText
								value="¿El proyecto debe ser registrado por el líder del grupo de investigación?"
								styleClass="labels_proyecto2" />
							<p:selectOneMenu id="liderGrupos"
								value="#{manejadorInsercionConvocatorias.registroProyectoLiderGrupo}">
								<f:selectItem itemValue="S" itemLabel="Si" />
								<f:selectItem itemValue="N" itemLabel="No" />
							</p:selectOneMenu>
						</h:panelGrid>
					</h:panelGrid>
				</p:panel>



				<br />

				<p:panel header="¿Es convocatoria para facultades?">
					<h:panelGrid id="pgEsParaFacultades">

						<h:panelGrid columns="2" id="pgSelectFacultadesVisible">
							<h:outputText value="¿Es para facultades?"
								styleClass="labels_proyecto2" />
							<p:selectOneMenu id="esParaSedes"
								value="#{manejadorInsercionConvocatorias.esParaSedes}">
								<f:selectItem itemValue="S" itemLabel="Si" />
								<f:selectItem itemValue="N" itemLabel="No" />
								<p:ajax
									listener="#{manejadorInsercionConvocatorias.cambioSiNoSedes}"
									update="pgSelectFacultadesVisible, pgFacultades pgEsParaFacultades" />
							</p:selectOneMenu>
						</h:panelGrid>


						<h:panelGrid columns="1" id="pgFacultades" align="center"
							rendered="#{manejadorInsercionConvocatorias.visiblePanelSedes}">
							<p:selectOneMenu
								value="#{manejadorInsercionConvocatorias.dependenciaActualRestriccion.id}"
								filter="true" filterMatchMode="contains">
								<f:selectItems
									value="#{manejadorInsercionConvocatorias.listaDependenciaRestriccion}"
									var="listaDependenciaRestriccion"
									itemLabel="#{listaDependenciaRestriccion.nombre}"
									itemValue="#{listaDependenciaRestriccion.id}">
								</f:selectItems>
							</p:selectOneMenu>
						</h:panelGrid>
					</h:panelGrid>
				</p:panel>

				<br />

				<p:panel header="Fechas Importantes">
					<p:panelGrid columns="2" align="center" cellpadding="0"
						cellspacing="1" width="95%">
						<h:outputText value="Fecha Inicial : "
							styleClass="labels_proyecto2" />
						<p:calendar id="inicio"
							value="#{manejadorInsercionConvocatorias.convocatoriaActual.fechaInicio}"
							required="false" pattern="dd/MM/yyyy HH:mm:ss">
						</p:calendar>

						<h:outputText value="Fecha Final : " styleClass="labels_proyecto2" />
						<p:calendar id="final"
							value="#{manejadorInsercionConvocatorias.convocatoriaActual.fechaFinal}"
							required="false" pattern="dd/MM/yyyy HH:mm:ss">
						</p:calendar>

						<h:outputText value="Fecha inicio reclamación requisitos: "
							styleClass="labels_proyecto2" />
						<p:calendar id="inicioReclaReq"
							value="#{manejadorInsercionConvocatorias.convocatoriaActual.fechaInicioReclamacion}"
							required="false" pattern="dd/MM/yyyy HH:mm:ss">
						</p:calendar>
						<h:outputText value="Fecha fin reclamación requisitos: "
							styleClass="labels_proyecto2" />
						<p:calendar id="finRecRequ"
							value="#{manejadorInsercionConvocatorias.convocatoriaActual.fechaFinalReclamacion}"
							required="false" pattern="dd/MM/yyyy HH:mm:ss">
						</p:calendar>

						<h:outputText value="Fecha inicio evaluación: "
							styleClass="labels_proyecto2" />
						<p:calendar id="inicioEval"
							value="#{manejadorInsercionConvocatorias.convocatoriaActual.fechaInicioEval}"
							required="false" pattern="dd/MM/yyyy HH:mm:ss">
						</p:calendar>
						<h:outputText value="Fecha final evaluación : "
							styleClass="labels_proyecto2" />
						<p:calendar id="finalEval"
							value="#{manejadorInsercionConvocatorias.convocatoriaActual.fechaFinalEval}"
							required="false" pattern="dd/MM/yyyy HH:mm:ss">
						</p:calendar>

						<h:outputText value="Fecha inicio reclamación evaluación: "
							styleClass="labels_proyecto2" />
						<p:calendar id="inicioRecEval"
							value="#{manejadorInsercionConvocatorias.convocatoriaActual.fechaInicioReclamacionEvaluacion}"
							required="false" pattern="dd/MM/yyyy HH:mm:ss">
						</p:calendar>

						<h:outputText value="Fecha fin reclamación evaluación: "
							styleClass="labels_proyecto2" />
						<p:calendar id="finRecEval"
							value="#{manejadorInsercionConvocatorias.convocatoriaActual.fechaFinalReclamacionEvaluacion}"
							required="false" pattern="dd/MM/yyyy HH:mm:ss">
						</p:calendar>

						<h:outputText value="Fecha Publicación Resultados : "
							styleClass="labels_proyecto2" />
						<p:calendar id="publicacion"
							value="#{manejadorInsercionConvocatorias.convocatoriaActual.fechaPublicacionResultados}"
							required="false" pattern="dd/MM/yyyy HH:mm:ss">
						</p:calendar>
					</p:panelGrid>
				</p:panel>

				<br />

				<p:panel id="panelInfoFicha"
					header="Parametrización campos a mostrar en el formulario de registro de proyectos">

					<p:panelGrid id="pgParaForFM" columns="2" align="center"
						cellpadding="0" cellspacing="1" width="95%">
						<h:outputText value="¿Mostrar integrantes sin datos?"
							styleClass="labels_proyecto2" />
						<p:selectOneMenu id="smIntSinDa"
							value="#{manejadorInsercionConvocatorias.mostrarIntegrantesSinDatos}">
							<f:selectItem itemValue="S" itemLabel="Si" />
							<f:selectItem itemValue="N" itemLabel="No" />
						</p:selectOneMenu>

						<h:outputText value="¿Mostrar actividades investigadores?"
							styleClass="labels_proyecto2" />
						<p:selectOneMenu id="esMosActIn"
							value="#{manejadorInsercionConvocatorias.mostarActividadesInvestigador}">
							<f:selectItem itemValue="S" itemLabel="Si" />
							<f:selectItem itemValue="N" itemLabel="No" />
						</p:selectOneMenu>
						
						<h:outputText value="¿Mostrar actividades investigadores sin datos?"
							styleClass="labels_proyecto2" />
						<p:selectOneMenu id="esMosActInSD"
							value="#{manejadorInsercionConvocatorias.mostarActivdadesIntegrantesSinDatos}">
							<f:selectItem itemValue="S" itemLabel="Si" />
							<f:selectItem itemValue="N" itemLabel="No" />
						</p:selectOneMenu>

						<h:outputText value="¿Mostrar evaluaciones individuales?"
							styleClass="labels_proyecto2" />
						<p:selectOneMenu id="esMostrarEvaInd"
							value="#{manejadorInsercionConvocatorias.mostrarEvaluacionesIndividuales}">
							<f:selectItem itemValue="S" itemLabel="Si" />
							<f:selectItem itemValue="N" itemLabel="No" />
						</p:selectOneMenu>

						<h:outputText value="¿Tipo de financiación?"
							styleClass="labels_proyecto2" />
						<p:selectOneMenu id="esTipoFin"
							value="#{manejadorInsercionConvocatorias.convocatoriaActual.tipoFinanciacion}">
							<f:selectItem itemValue="MINIMA" itemLabel="Avanzada" />
							<f:selectItem itemValue="BASICA" itemLabel="Básica" />
						</p:selectOneMenu>

						<h:outputText value="¿Mostrar productos?"
							styleClass="labels_proyecto2" />
						<p:selectOneMenu id="esMostrarProductos"
							value="#{manejadorInsercionConvocatorias.mostrarProductos}">
							<f:selectItem itemValue="S" itemLabel="Si" />
							<f:selectItem itemValue="N" itemLabel="No" />
						</p:selectOneMenu>

						<h:outputText value="¿Mostrar biodiversidad?"
							styleClass="labels_proyecto2" />
						<p:selectOneMenu id="esMostrarBiodiversidad"
							value="#{manejadorInsercionConvocatorias.mostrarBiodiversidad}">
							<f:selectItem itemValue="S" itemLabel="Si" />
							<f:selectItem itemValue="N" itemLabel="No" />
						</p:selectOneMenu>

						<h:outputText value="Mensaje a mostrar en el formulario de adjuntar archivos "
							styleClass="labels_proyecto2" />
						<p:inputTextarea id="itaMensajeArchivos"
							value="#{manejadorInsercionConvocatorias.convocatoriaActual.mensajeArchivosAdjuntos}"
							rows="10" cols="50">
							<f:validateLength minimum="0" maximum="3000" />
						</p:inputTextarea>

					</p:panelGrid>
				</p:panel>
				<br />
				<p:panel header="Financiación" id="fsFinan">
					<h:panelGrid columns="2" id="pgTipoFuFin">
						<h:outputText value="Tipo Fuente Financiación : "
							styleClass="labels_proyecto2" />
						<p:selectOneMenu
							value="#{manejadorInsercionConvocatorias.idTipoFuenteFinanciacion}"
							style="width:320px" panelStyle="width:320px">
							<f:selectItems
								value="#{manejadorInsercionConvocatorias.listaTipoFuenteFinanciacion}" />
							<p:ajax
								listener="#{manejadorInsercionConvocatorias.cambiaTipoFinanciacion}"
								update="pgTipoFuFin, pgFuFin" />
						</p:selectOneMenu>

					</h:panelGrid>

					<p:panelGrid id="pgFuFin" styleClass="estilo-panelgrid-sinbordes"
						style="width:100%">
						<p:row>
							<p:column style="width:20%">
								<h:outputText value="Fuente Financiación : "
									styleClass="labels_proyecto2" />
							</p:column>
							<p:column>
								<p:selectOneMenu
									value="#{manejadorInsercionConvocatorias.idFuenteFinanciacion}"
									style="width:420px" panelStyle="width:520px" filter="true" filterMatchMode="contains">
									<f:selectItems
										value="#{manejadorInsercionConvocatorias.listaFuentesFinanciacion}" />
								</p:selectOneMenu>
							</p:column>
						</p:row>
						<p:row>
							<p:column>
								<h:outputText value="Porcentaje() : "
									styleClass="labels_proyecto2" />
							</p:column>
							<p:column>
								<p:inputText id="porcentajeValor"
									value="#{manejadorInsercionConvocatorias.porcentaje}"
									validatorMessage="Debe ingresar un número entre 0.01 y 100">
									<f:validateDoubleRange minimum="0.01" maximum="100"
										for="porcentajeValor" />
								</p:inputText>
							</p:column>
						</p:row>
						<p:row>
							<p:column>
								<h:outputText
									value="#{manejadorInsercionConvocatorias.avisoFuentes}" />
							</p:column>
							<p:column>
								<p:commandButton
									action="#{manejadorInsercionConvocatorias.agregaModalidadFuenteFinanciacion}"
									value="Agregar" update="fsFinan, pgFuFin, tablaFuenteFin" />
							</p:column>
						</p:row>
						<p:row>
							<p:column colspan="2">
								<p:messages autoUpdate="true" closable="true" />
							</p:column>
						</p:row>
					</p:panelGrid>
					<br></br>
					<p:dataTable cellpadding="6" cellspacing="3" id="tablaFuenteFin"
						rendered="#{not empty manejadorInsercionConvocatorias.listaModalidadFuenteFinanciacion}"
						value="#{manejadorInsercionConvocatorias.listaModalidadFuenteFinanciacion}"
						var="mff">

						<p:column>
							<h:outputText value="#{mff.fuenteFinanciacion.descripcion}"
								styleClass="labels_proyecto2" />
						</p:column>
						<p:column>
							<h:outputText value="#{mff.porcentaje}"
								styleClass="labels_proyecto2" />
						</p:column>
						<p:column>
							<p:commandButton id="borreModFuenFin"
								action="#{manejadorInsercionConvocatorias.eliminarModalidadFuenteFinanciacion}"
								ajax="false" value="Eliminar" update="tablaFuenteFin">
								<f:setPropertyActionListener value="#{mff}"
									target="#{manejadorInsercionConvocatorias.fuenteFinanciacionSeleccion}" />
							</p:commandButton>
						</p:column>
					</p:dataTable>

				</p:panel>

				<br />

				<p:panel header="Presupuesto" id="fsPresupuesto">
					<p:panelGrid columns="3" align="center" cellpadding="0"
						cellspacing="1" width="95%">
						<h:outputText
							value="Presupuesto (valor numérico sin caracteres): "
							styleClass="labels_proyecto2" />
						<p:inputText id="presupuestos"
							value="#{manejadorInsercionConvocatorias.convocatoriaActual.recursosFinancieros}"
							size="15" required="false">
							<f:validateLongRange minimum="0" maximum="10000000000000" />
						</p:inputText>
						<p:message for="presupuestos" />

						<h:outputText
							value="Número apoyos (valor numérico sin caracteres): "
							styleClass="labels_proyecto2" />
						<p:inputText id="numeroApoyos"
							value="#{manejadorInsercionConvocatorias.convocatoriaActual.numeroApoyos}"
							size="5" required="false">
							<f:validateLength minimum="0" maximum="255" />
						</p:inputText>
						<p:message for="numeroApoyos" />

						<h:outputText
							value="Monto mínimo del apoyo a ganadores (valor numérico sin caracteres): "
							styleClass="labels_proyecto2" />
						<p:inputText id="montoApoyoMin"
							value="#{manejadorInsercionConvocatorias.convocatoriaActual.montonMinimo}"
							size="15" required="false">
							<f:validateLongRange minimum="0" maximum="10000000000000" />
						</p:inputText>
						<p:message for="montoApoyoMin" />

						<h:outputText
							value="Monto máximo apoyo a ganadores (valor numérico sin caracteres): "
							styleClass="labels_proyecto2" />
						<p:inputText id="montoApoyo"
							value="#{manejadorInsercionConvocatorias.convocatoriaActual.montoApoyoGanadores}"
							size="15" required="false">
							<f:validateLongRange minimum="0" maximum="10000000000000" />
						</p:inputText>
						<p:message for="montoApoyo" />

						<h:outputText
							value="Duración proyecto (valor numérico sin caracteres): "
							styleClass="labels_proyecto2" />
						<p:inputText id="duracionProyecto"
							value="#{manejadorInsercionConvocatorias.convocatoriaActual.tiempoEjecucionProyecto}"
							size="5" required="false">
							<f:validateLength minimum="0" maximum="10" />
						</p:inputText>
