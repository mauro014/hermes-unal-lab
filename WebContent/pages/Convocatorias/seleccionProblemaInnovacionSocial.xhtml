<?xml version='1.0' encoding='ISO-8859-1' ?>
<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:t="http://myfaces.apache.org/tomahawk"
	xmlns:s="http://myfaces.apache.org/sandbox"
	xmlns:c="http://java.sun.com/jstl/core_rt"
	template="../../templates/common.xhtml">
	<ui:define name="content">
		<h:form>
			<t:div styleClass="contenido-titulo-general-myriad">Problemas Innovación Social</t:div>

			<p:panel header="Problemas de Innovación Social">
				<h:panelGrid columns="2" cellpadding="10" align="center"
					id="probleTema">
					<h:outputText value="Problema: " />
					<p:selectOneMenu style="width: 500px;" panelStyle="width: 500px;"
						value="#{manejadorSeleccionProblemaInnovacionSocial.problemaSeleccionado}"
						effect="fade" id="problema" filter="true"
						filterMatchMode="contains">
						<f:selectItem itemLabel="Seleccione una opción" itemValue="" />
						<f:selectItems
							value="#{manejadorSeleccionProblemaInnovacionSocial.problemasItem}" />
					</p:selectOneMenu>

				</h:panelGrid>
				<br />
				<center>
					<p:panel id="infoResEspe" header="NOTA" style="width:80%"
						styleClass="mypanel">
						<h:panelGrid columns="1" id="panelContrapart1"
							styleClass="estilo-panelgrid-sinbordes">
							<h:outputText
								value="Para consultar problemas registrados, por favor haga clic en el siguiente enlace:" />
							<h:outputLink
								value="http://www.hermes.unal.edu.co/pages/BancoProblemas/ProblemasAprobados.xhtml"
								target="_blank">
								<h:outputText value="[+] Consultar problemas registrados" />
							</h:outputLink>
							<br />
							 
							<br />
							<h:outputText
								value="Si usted desea conocer los datos de la persona que postuló el problema y poder contactarlo, por favor descargue este excel
								con la información de los problemas:" />
							<b><a href="#{facesContext.externalContext.requestContextPath}/pages/html/descargas/DatosContacto-ExtensionSolidaria2018.xls"
								target="_blank">[+] Descargar Datos de Contacto</a></b>
						</h:panelGrid>
					</p:panel>
				</center>
			</p:panel>

			<br />
			<p:messages id="msgs" showDetail="false" autoUpdate="true"
				closable="true" />
			<br />

			<center>
				<h:panelGrid columns="2">
					<p:commandButton id="volver" value="Salir"
						styleClass="ui-priority-primary" 
						action="#{manejadorSeleccionProblemaInnovacionSocial.volver}"
						immediate="true" />
						
					<p:commandButton styleClass="btnedicion"
						action="#{manejadorSeleccionProblemaInnovacionSocial.siguiente}"
						value="Guardar y avanzar" update="@form" />
				</h:panelGrid>

			</center>

		</h:form>
		<p:dialog widgetVar="dialogEspere" resizable="false" closable="false"
			modal="true">
			<p:graphicImage value="/images/ajaxloading.gif" />
   					 Por favor espere...
   	 </p:dialog>
	</ui:define>
</ui:composition>
