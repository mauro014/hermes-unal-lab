						style="width: 650px;">
						<p:column style="font-size:13px; width:5%; text-align: center;"
							filterBy="#{movilidadVisitante.id}" filterMatchMode="contains"
							filterStyle="width: 30px;">
							<f:facet name="header">
								<h:outputText value="Id" />
							</f:facet>
							<h:outputText value="#{movilidadVisitante.id}" />
						</p:column>
						<p:column style="text-align: center;font-size:13px;">
							<f:facet name="header">

								<br />

							</h:outputText>

								<br />
