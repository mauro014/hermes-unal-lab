							<h:outputText value="#{movilidadEstudiantePosgrado.aceptacion}" />
						</p:column>
						<p:column style="text-align: center;font-size:13px; width:12%">
							<f:facet name="header">
								<h:outputText value="Aprobado" />
								<br />
								<h:outputText value="Sede" />
							</f:facet>
							<h:outputText value="#{movilidadEstudiantePosgrado.aprobacion}" />
						</p:column>
						<p:column style="text-align: center;font-size:13px; width:12%">
							<f:facet name="header">
								<h:outputText value="Seguimiento" />
							</f:facet>
							<p:commandButton id="segEstPosCons" title="Consultar"
								icon="ui-icon-search"
								rendered="#{movilidadEstudiantePosgrado.aprobacion == 'SI' ? (movilidadEstudiantePosgrado.estadoSeguimiento == 'F' ? true:false):false}"
								action="#{manejadorAprobacionMovilidadCons.consultarSeguimientoEstRes}"
								ajax="false">
								<f:setPropertyActionListener
									value="#{movilidadEstudiantePosgrado}"
									target="#{manejadorAprobacionMovilidadCons.movilidadEstudiantesSeleccionada}" />
							</p:commandButton>
							<h:outputText value="--"
								rendered="#{movilidadEstudiantePosgrado.aprobacion == null ? true:(movilidadEstudiantePosgrado.aprobacion == 'NO' ? true:false)}"></h:outputText>
							<h:outputText value="Por registrar"
								rendered="#{movilidadEstudiantePosgrado.aprobacion == 'SI' ? (movilidadEstudiantePosgrado.estadoSeguimiento == null or movilidadEstudiantePosgrado.estadoSeguimiento == 'P' ? true:false):false}"></h:outputText>
						</p:column>
						<p:column headerText="" style="font-size:13px; width:5%">
							<h:commandLink
								action="#{manejadorAprobacionMovilidadCons.imprimirMovilidadPosgrado}"
								styleClass="ui-button ui-widget ui-state-default ui-corner-all ui-button-icon-only"
								ajax="false" style="height: 25px;" target="_blank">
								<span class="ui-button-icon-left ui-icon ui-icon-print"></span>
								<f:setPropertyActionListener
									value="#{movilidadEstudiantePosgrado}"
									target="#{manejadorAprobacionMovilidadCons.movilidadEstudiantesSeleccionada}" />
							</h:commandLink>
						</p:column>
						<p:rowExpansion>
							<p:dataTable var="archivo4"
								value="#{movilidadEstudiantePosgrado.listaArchivo}"
								style="margin: 15px;">
								<p:column headerText="Nombre archivo">
									<div class="listaSencilla" style="width: 350px;">
										<h:outputText value="#{archivo4.nombre}" />
									</div>
								</p:column>
								<p:column headerText="Acción">
									<h:commandLink
										style="text-decoration:none; 
										color: #16A8E2;
										font-weight: bold;"
										action="#{manejadorAprobacionMovilidadCons.descargarDocumentoEstPosgradoEventos2}">
											Descargar
									<f:param name="archivoResumen4" value="#{archivo4.id}" />
										<f:param name="movilidadEstudiantePosgrado"
											value="#{movilidadEstudiantePosgrado.id}" />
									</h:commandLink>
								</p:column>
							</p:dataTable>
						</p:rowExpansion>
					</p:dataTable>
					<p:dataTable var="movilidadEventoEst" rendered="false" style="margin-top: 10px;"
						value="#{manejadorAprobacionMovilidadCons.listaMovilidadesEstudiantesArtes}"
						filteredValue="#{manejadorAprobacionMovilidadCons.listaMovilidadesEstudiantesArtesFiltered}"
						emptyMessage="No hay residencias de estudiantes registradas."
						paginator="true" paginatorAlwaysVisible="false" rows="15"
						paginatorTemplate="{CurrentPageReport}  {FirstPageLink} {PreviousPageLink} {PageLinks} {NextPageLink} {LastPageLink} {RowsPerPageDropdown}">
						<f:facet name="header">
							<h:outputText value="Residencias artísticas" />
						</f:facet>
						<p:column style="font-size:13px; width:5%"
							filterBy="#{movilidadEventoEst.id}" filterMatchMode="contains">
							<f:facet name="header">
								<h:outputText value="Id" />
							</f:facet>

							<h:outputText value="#{movilidadEventoEst.id}" />
						</p:column>

						<p:column style="font-size:13px; width:8%">
							<f:facet name="header">
								<h:outputText value="Estado" />
							</f:facet>
							<h:outputText
								value="#{movilidadEventoEst.estado == 'I' ? 'Ingresando':'Propuesta'}" />
						</p:column>

						<p:column style="text-align: center;font-size:13px; width:14%">
							<f:facet name="header">
								<h:outputText value="Fecha" />
								<br />
								<h:outputText value="Inicio" />
							</f:facet>
							<h:outputText
								value="#{movilidadEventoEst.fechainicial != null ? movilidadEventoEst.fechainicial:'Sin registrar'}" />
						</p:column>

						<p:column style="text-align: center;font-size:13px; width:14%">
							<f:facet name="header">
								<h:outputText value="Fecha" />
								<br />
								<h:outputText value="Solicitud" />
							</f:facet>
							<h:outputText
								value="#{movilidadEventoEst.fechasolicitud != null ? movilidadEventoEst.fechasolicitud:'La residencia no se ha propuesto'}">
								<f:convertDateTime type="both" dateStyle="short" />
							</h:outputText>
						</p:column>


						<p:column headerText="Acciones" style="font-size:13px; width:5%">
							<p:commandButton
								action="#{manejadorAprobacionMovilidadCons.editarMovEstudiantesArtes}"
								icon="ui-icon-pencil" title="Editar">
								<f:setPropertyActionListener value="#{movilidadEventoEst}"
									target="#{manejadorAprobacionMovilidadCons.movilidadEstudiantesArtesSeleccionada}" />
							</p:commandButton>

						</p:column>



					</p:dataTable>

				</p:tab>

			</p:tabView>
		</h:form>
	</ui:define>
</ui:composition>
