<?xml version='1.0' encoding='ISO-8859-1' ?>
<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:t="http://myfaces.apache.org/tomahawk"
	xmlns:s="http://myfaces.apache.org/sandbox"
	template="../../../templates/common.xhtml">

	<ui:define name="content">
		<t:div styleClass="contenido-titulo-general-myriad">
           Aprobación movilidades sede</t:div>
		<h:form>
			<p:panel style="width: 670px; margin-bottom: 20px;"
				header="Filtrar movilidades por convocatoria">
				<p:panelGrid columns="2" styleClass="estilo-panelgrid-sinbordes">
					<h:outputText value="Convocatoria:" />
					<p:selectOneMenu style="width: 520px;" id="convocatoriaPadre"
						value="#{manejadorAprobacionMovilidadSede.convocatoriaPadreFiltro}"
						panelStyle="width: 500px;" filter="true"
						filterMatchMode="contains">
						<f:selectItem itemLabel="Seleccione una convocatoria" itemValue="" />
						<f:selectItems
							value="#{manejadorAprobacionMovilidadSede.listaConvocatoriasPadreItems}" />
						<p:ajax update="selectModalidad"
							listener="#{manejadorAprobacionMovilidadSede.cambiarConvocatoriaPadre}" />
					</p:selectOneMenu>
					<h:outputText value="Modalidad:" />
					<p:selectOneMenu id="selectModalidad" style="width:520px;"
						panelStyle="width: 520px;"
						value="#{manejadorAprobacionMovilidadSede.convocatoriaFiltro}">
						<f:selectItems
							value="#{manejadorAprobacionMovilidadSede.listaConvocatoriasItems}" />
					</p:selectOneMenu>
				</p:panelGrid>
				<t:div style="weight: 100%; text-align: center;">
					<p:commandButton title="Filtrar"
						action="#{manejadorAprobacionMovilidadSede.cargarListasMovilidades}"
						ajax="false" onstart="dialogEspere.show()" icon="ui-icon-search"
						oncomplete="dialogEspere.hide()" value="Filtrar">
					</p:commandButton>
					<p:commandButton title="Limpiar filtro"
						action="#{manejadorAprobacionMovilidadSede.reiniciarFiltro}"
						ajax="false" onstart="dialogEspere.show()" icon="ui-icon-cancel"
						oncomplete="dialogEspere.hide()" value="Reiniciar filtro">
					</p:commandButton>
				</t:div>
			</p:panel>
		</h:form>
		<h:form>
			<p:dataTable var="mov"
				value="#{manejadorAprobacionMovilidadSede.listaMovilidadesGeneral}"
				emptyMessage="No existen solicitudes vigentes"
				style="width: 670px; margin-bottom: 20px;">
				<p:column headerText="Id">
					<h:outputText value="#{mov.idSolicitud}" />
				</p:column>
				<p:column headerText="Convocatoria">
					<h:outputText value="#{mov.convocatoria.padre.titulo}" />
				</p:column>
				<p:column headerText="Modalidad">
					<h:outputText value="#{mov.convocatoria.titulo}" />
				</p:column>
				<p:column>
					<f:facet name="header">
						<h:outputText value="Fecha" />
						<br />
						<h:outputText value="Solicitud" />
					</f:facet>
					<h:outputText value="#{mov.fechaSolicitud}" />
				</p:column>
				<p:column headerText="Solicitante">
					<h:outputText value="#{mov.nombreSolicitante}" />
				</p:column>
				<p:column headerText="Facultad revisión">
					<h:outputText value="#{mov.facultadRevisionFac}" />
				</p:column>				
				<p:column headerText="Revisar" style="width: 100px;">
					<center>
						<p:commandButton title="Revisar movilidad"
							rendered="#{mov.tipoMovilidad.tabla == 'HER_MOVILIDAD_VISITANTES_EXT'}"
							action="#{manejadorAprobacionMovilidadSede.modificarMovilidadVisitante}"
							update="@form" onstart="dialogEspere.show()"
							icon="ui-icon-search"
							oncomplete="dialogEspere.hide(),movilidadVisitanteModalRevision.show()">
							<f:param name="idMovilidad" value="#{movilidadVisitante.id}" />
							<f:setPropertyActionListener value="#{mov}"
								target="#{manejadorAprobacionMovilidadSede.movilidadVistaSeleccionada}" />
						</p:commandButton>
						<p:commandButton title="Revisar movilidad"
							rendered="#{mov.tipoMovilidad.tabla == 'HER_MOVILIDAD_DOCENTES_EVENTOS'}"
							action="#{manejadorAprobacionMovilidadSede.modificarMovilidadDocentes}"
							update="@form" onstart="dialogEspere.show()"
							icon="ui-icon-search"
							oncomplete="dialogEspere.hide(),movilidadDocentesModalRevision.show()">
							<f:param name="idMovilidad" value="#{movilidadEvento.id}" />
							<f:setPropertyActionListener value="#{mov}"
								target="#{manejadorAprobacionMovilidadSede.movilidadVistaSeleccionada}" />
						</p:commandButton>
						<p:commandButton title="Revisar movilidad"
							rendered="#{mov.tipoMovilidad.tabla == 'HER_MOVILIDAD_ESTUDIANTE_POS'}"
							action="#{manejadorAprobacionMovilidadSede.modificarMovilidadEstudiantes}"
							update="@form" onstart="dialogEspere.show()"
							icon="ui-icon-search"
							oncomplete="dialogEspere.hide(),movilidadEstudiantesModalRevision.show()">
							<f:param name="idMovilidad"
								value="#{movilidadEstudiantePosgrado.id}" />
							<f:setPropertyActionListener value="#{mov}"
								target="#{manejadorAprobacionMovilidadSede.movilidadVistaSeleccionada}" />
						</p:commandButton>
						<p:commandButton title="Revisar movilidad"
							rendered="#{mov.tipoMovilidad.tabla == 'HER_MOVILIDAD_DOCENTES_ART'}"
							action="#{manejadorAprobacionMovilidadSede.modificarMovilidadDocentesArtes}"
							update="@form" onstart="dialogEspere.show()"
							icon="ui-icon-search"
							oncomplete="dialogEspere.hide(),movilidadDocentesArtesModalRevision.show()">
							<f:param name="idMovilidad" value="#{movilidadEvento.id}" />
							<f:setPropertyActionListener value="#{mov}"
								target="#{manejadorAprobacionMovilidadSede.movilidadVistaSeleccionada}" />
						</p:commandButton>
						<p:commandButton title="Revisar movilidad"
							rendered="#{mov.tipoMovilidad.tabla == 'HER_MOVILIDAD_ESTUDIANTES_ART'}"
							action="#{manejadorAprobacionMovilidadSede.modificarMovilidadEstudiantesArtes}"
							update="@form" onstart="dialogEspere.show()"
							icon="ui-icon-search"
							oncomplete="dialogEspere.hide(),movilidadEstudiantesArtesModalRevision.show()">
							<f:param name="idMovilidad" value="#{movilidadEvento.id}" />
							<f:setPropertyActionListener value="#{mov}"
								target="#{manejadorAprobacionMovilidadSede.movilidadVistaSeleccionada}" />
						</p:commandButton>
						<p:commandButton title="Revisar movilidad"
							rendered="#{mov.tipoMovilidad.tabla == 'HER_MOVILIDAD_VISITANTES_ART'}"
							action="#{manejadorAprobacionMovilidadSede.modificarMovilidadVisitantesArtes}"
							update="@form" onstart="dialogEspere.show()"
							icon="ui-icon-search"
							oncomplete="dialogEspere.hide(),movilidadVisitantesArtesModalRevision.show()">
							<f:param name="idMovilidad" value="#{movilidadEvento.id}" />
							<f:setPropertyActionListener value="#{mov}"
								target="#{manejadorAprobacionMovilidadSede.movilidadVistaSeleccionada}" />
						</p:commandButton>
					</center>
				</p:column>
			</p:dataTable>
			<p:dialog header="Revisión de movilidad"
				id="movilidadVisitanteModalRevision"
				widgetVar="movilidadVisitanteModalRevision" modal="true"
				resizable="false" width="800">
				<t:div styleClass="panel-interno-tabla"
					id="movilidadVisitanteModalRevisionDiv"
					style="max-height:660px; overflow: auto;">
					<p:panelGrid styleClass="estilo-panelgrid-sinbordes">
						<p:row>
							<p:column style="width: 120px;">
								<h:outputText value="Convocatoria:" style="font-weight: bold;" />
							</p:column>
							<p:column colspan="3">
								<h:outputText
									value="#{manejadorAprobacionMovilidadSede.movilidadVisitanteModificacion.convocatoria.padre.titulo}" />
							</p:column>
						</p:row>
						<p:row>
							<p:column>
								<h:outputText value="Modalidad:" style="font-weight: bold;" />
							</p:column>
							<p:column colspan="3">
								<h:outputText
									value="#{manejadorAprobacionMovilidadSede.movilidadVisitanteModificacion.convocatoria.titulo}" />
							</p:column>
						</p:row>
						<p:row>
							<p:column>
								<h:outputText value="Facultad:" style="font-weight: bold;" />
							</p:column>
							<p:column colspan="3">
								<h:outputText
									value="#{manejadorAprobacionMovilidadSede.movilidadVisitanteModificacion.personaInv.dependencia.facultad.nombre}" />
							</p:column>
						</p:row>
						<p:row>
							<p:column>
								<h:outputText value="Id:" style="font-weight: bold;" />
							</p:column>
							<p:column style="width: 200px;">
								<h:outputText
									value="#{manejadorAprobacionMovilidadSede.movilidadVisitanteModificacion.id}" />
							</p:column>
							<p:column style="width: 100px;">
								<h:outputText value="Fecha solicitud:"
									style="font-weight: bold;" />
							</p:column>
							<p:column>
								<h:outputText
									value="#{manejadorAprobacionMovilidadSede.movilidadVisitanteModificacion.fechasolicitud}" />
							</p:column>
						</p:row>
						<p:row>
							<p:column>
								<h:outputText value="Fecha inicio:" style="font-weight: bold;" />
							</p:column>
							<p:column>
								<h:outputText
									value="#{manejadorAprobacionMovilidadSede.movilidadVisitanteModificacion.fechainicial}" />
							</p:column>
							<p:column>
								<h:outputText value="Fecha fin:" style="font-weight: bold;" />
							</p:column>
							<p:column>
								<h:outputText
									value="#{manejadorAprobacionMovilidadSede.movilidadVisitanteModificacion.fechafinal}" />
							</p:column>
						</p:row>
						<p:row>
							<p:column>
								<h:outputText value="Documento:" style="font-weight: bold;" />
							</p:column>
							<p:column>
								<h:outputText
									value="#{manejadorAprobacionMovilidadSede.movilidadVisitanteModificacion.personaInv.id.tipoDocumento} - #{manejadorAprobacionMovilidadSede.movilidadVisitanteModificacion.personaInv.id.documento}" />
							</p:column>
							<p:column>
								<h:outputText value="Nombre:" style="font-weight: bold;" />
							</p:column>
							<p:column>
								<h:outputText
									value="#{manejadorAprobacionMovilidadSede.movilidadVisitanteModificacion.personaInv.nombreCompletoMinusculas}" />
							</p:column>
						</p:row>
						<p:row>
							<p:column>
								<h:outputText value="Valor aprobado por la facultad: "
									style="font-weight: bold;" />
							</p:column>
							<p:column colspan="3">
								<h:outputText
									value="#{manejadorAprobacionMovilidadSede.movilidadVisitanteModificacion.valorAprobadoFacultad}">
									<f:convertNumber currencySymbol="$" groupingUsed="true"
										type="currency" minFractionDigits="0" maxFractionDigits="0" />
								</h:outputText>
							</p:column>
						</p:row>
						<p:row>
							<p:column>
								<h:outputText value="Año Vigencia: "
									style="font-weight: bold;" />
							</p:column>
							<p:column colspan="3">
								<h:outputText id="AnioVigVisitante" value="#{manejadorAprobacionMovilidadSede.movilidadVisitanteModificacion.anioVigenciaAprFacultad}"/>
							</p:column>
						</p:row>
						<p:row>
							<p:column>
								<h:outputText value="Comentarios facultad:"
									style="font-weight: bold;" />
							</p:column>
							<p:column colspan="3">
								<h:outputText
									value="#{manejadorAprobacionMovilidadSede.movilidadVisitanteModificacion.comentariosFac}" />
							</p:column>
						</p:row>
						<p:row>
							<p:column>
								<h:outputText value="Comentarios sede:"
									style="font-weight: bold;" />
							</p:column>
							<p:column colspan="3">
								<p:inputTextarea forceId="true"
									value="#{manejadorAprobacionMovilidadSede.movilidadVisitanteModificacion.comentariosDir}"
									maxlength="3000" rows="3" style="width: 500px;">
									<f:validateLength
										minimum="#{valores.sizemin_campo_default_mov}" />
								</p:inputTextarea>
							</p:column>
						</p:row>
						<p:row>
							<p:column>
							</p:column>
							<p:column colspan="3">
								<h:commandLink
									action="#{manejadorAprobacionMovilidadSede.imprimirMovilidadVisitante}"
									value="Imprimir información solicitud" target="_blank"
									style="text-decoration:none; 
                                    color: #16A8E2;
                                    font-weight: bold;">
									<f:param name="idMovilidad"
										value="#{manejadorAprobacionMovilidadSede.movilidadVisitanteModificacion.id}" />
									<f:setPropertyActionListener
										value="#{manejadorAprobacionMovilidadSede.movilidadVisitanteModificacion}"
										target="#{manejadorAprobacionMovilidadSede.movilidadVisitanteSeleccionada}" />
								</h:commandLink>
							</p:column>
						</p:row>
						<p:row>
							<p:column>
								<h:outputText value="Sede: " style="font-weight: bold;"/>
							</p:column>
							<p:column>
								<h:outputText value="#{manejadorAprobacionMovilidadSede.dependenciaMov.sede.nombre}"/>
							</p:column>
						</p:row>
						<p:row>
							<p:column>
							</p:column>
							<p:column>
								<h:outputText value="¿La sede cuenta con recursos para aprobar esta movilidad?" />
							</p:column>
						</p:row>
						<p:row>
							<p:column>
							</p:column>
							<p:column>
								 <p:selectOneRadio id="aprMovVisitante" value="#{manejadorAprobacionMovilidadSede.movilidadVisitanteModificacion.dispPresupuestalSede}" unselectable="true">
						            <f:selectItem itemLabel="Sí" itemValue="SI" />
						            <f:selectItem itemLabel="No" itemValue="NO" />
						            <p:ajax update="outputPanelmovisitanteDivRevisionRequisitosPr movilidadVisitanteModalRevisionDiv"/>
						        </p:selectOneRadio>
							</p:column>
						</p:row>
						<p:row rendered="#{manejadorAprobacionMovilidadSede.movilidadVisitanteModificacion.dispPresupuestalSede=='SI'}">
							<p:column>
								<h:outputText value="Valor aprobado por la sede y nacional:"
									style="font-weight: bold;" />
							</p:column>
							<p:column colspan="3">
								<p:inputText forceId="true" maxlength="10"
									value="#{manejadorAprobacionMovilidadSede.movilidadVisitanteModificacion.valorAprobadoSede}" />
							</p:column>
						</p:row>
						<p:row rendered="#{manejadorAprobacionMovilidadSede.movilidadVisitanteModificacion.dispPresupuestalSede=='SI'}">
							<p:column>
								<h:outputText value=""/>
							</p:column>
							<p:column>
								<h:outputText value="Este valor corresponde a los aportes de la sede y/o del nivel nacional para la movilidad." style="font-weight: bold;color: #FF0000"/>
							</p:column>
						</p:row>
						
					</p:panelGrid>
					<t:div style="text-align:center; padding-top: 10px;"
						id="movilidadVisitanteDivRevision">
						<p:dataTable var="archivoResumen1"
							value="#{manejadorAprobacionMovilidadSede.movilidadVisitanteModificacion.listaArchivo}"
							rows="5" paginatorPosition="bottom"
							paginatorAlwaysVisible="false" paginator="true"
							paginatorTemplate="{FirstPageLink} {PreviousPageLink} {PageLinks} {NextPageLink} {LastPageLink}">
							<f:facet name="header">
								<h:outputText value="Archivos adjuntos" />
							</f:facet>
							<p:column style="width: 20px: text-align: center;">
								<f:facet name="header">
									<h:outputText value="Id" />
								</f:facet>
								<t:div>
									<h:outputText value="#{archivoResumen1.id}" />
								</t:div>
							</p:column>
							<p:column>
								<f:facet name="header">
									<h:outputText value="Tipo" />
								</f:facet>
								<t:div style="width: 255px;">
									<h:outputText value="#{archivoResumen1.tipoArchivo.nombre}" />
								</t:div>
							</p:column>
							<p:column>
								<f:facet name="header">
									<h:outputText value="Archivo Cargado" />
								</f:facet>
								<t:div style="width: 305px;">
									<h:commandLink
										action="#{manejadorAprobacionMovilidadSede.descargarDocumentoVisitante}"
										value="#{archivoResumen1.nombre}" ajax="false" target="_blank"
										style="text-decoration:none; 
                                    color: #16A8E2;
                                    font-weight: bold;">
										<f:param name="archivoResumen1" value="#{archivoResumen1.id}" />
									</h:commandLink>
								</t:div>
							</p:column>
						</p:dataTable>
					</t:div>
					<p:panel style="text-align: center; margin-top: 10px;">
						<p:dataTable var="archivoReRequisitosVE"
							paginatorAlwaysVisible="false"
							style="margin-top: 10px;margin-bottom: 10px;" paginator="true"
							rendered="#{!empty manejadorAprobacionMovilidadSede.movilidadVisitanteModificacion.archivosRevisionRequisitosSede}"
							value="#{manejadorAprobacionMovilidadSede.movilidadVisitanteModificacion.archivosRevisionRequisitosSede}"
							emptyMessage="Aún no se ha agregado un archivo de revisión de requisitos."
							paginatorPosition="bottom"
							paginatorTemplate="{FirstPageLink} {PreviousPageLink} {PageLinks} {NextPageLink} {LastPageLink}"
							rows="5">
							<f:facet name="header">
								<h:outputText value="Archivos de revisión de requisitos sede" />
							</f:facet>
							<p:column style="width: 20px: text-align: center;">
								<f:facet name="header">
									<h:outputText value="Id" />
								</f:facet>
								<t:div>
									<h:outputText value="#{archivoReRequisitosVE.id}" />
								</t:div>
							</p:column>
							<p:column>
								<f:facet name="header">
									<h:outputText value="Tipo" />
								</f:facet>
								<t:div style="width: 255px;">
									<h:outputText
										value="#{archivoReRequisitosVE.tipoArchivo.nombre}" />
								</t:div>
							</p:column>

							<p:column>
								<f:facet name="header">
									<h:outputText value="Archivo Cargado" />
								</f:facet>
								<t:div style="width: 325px;">
									<h:commandLink
										action="#{manejadorAprobacionMovilidadSede.descargarDocumentoVisitante}"
										value="#{archivoReRequisitosVE.nombre}" ajax="false"
										target="_blank"
										style="text-decoration:none; 
                                    color: #16A8E2;
                                    font-weight: bold;">
										<f:param name="archivoResumen1"
											value="#{archivoReRequisitosVE.id}" />
									</h:commandLink>
								</t:div>
							</p:column>
						</p:dataTable>

						<a
							href="#{manejadorAprobacionMovilidadSede.movilidadVisitanteModificacion.convocatoria.urlRequisitosSede}"
							target="_blank"
							style="text-decoration: none; color: #16A8E2; font-weight: bold;">
							Descargar archivo para realizar la revisión de requisitos</a>

						<p:fileUpload style="margin-top: 10px;"
							fileUploadListener="#{manejadorAprobacionMovilidadSede.insertarArchivoMovilidadVE}"
							mode="advanced" update="movilidadVisitanteDivRevision"
							auto="true" process="movilidadVisitanteDivRevision"
							sizeLimit="#{manejadorBase.maximoTamanoArchivos}"
							label="Seleccionar archivo revisión de requisitos diligenciado">
							<f:attribute name="idMovilidad"
								value="#{manejadorAprobacionMovilidadSede.movilidadVisitanteModificacion.id}" />
						</p:fileUpload>
					</p:panel>
					<br />
					<p:outputPanel id="outputPanelmovisitanteDivRevisionRequisitosPr">
						<div style="width: 100%; text-align: center; margin-bottom: 20px;">
							<h:outputText id="mensajeRevisionMovilidadVisitante"
								value="#{manejadorAprobacionMovilidadSede.movilidadVisitanteModificacion.error}"
								style="color: #F32020; font-weight: bold;" />
							<br />
							<p:commandButton id="aprobarMovVisitante" value="Aprobar"
								update="mensajeRevisionMovilidadVisitante"
								action="#{manejadorAprobacionMovilidadSede.aprobarMovilidadVisitante}"
								onstart="dialogEspere.show()" oncomplete="dialogEspere.hide()"
								rendered="#{manejadorAprobacionMovilidadSede.movilidadVisitanteModificacion.dispPresupuestalSede == 'SI'}">
								<f:setPropertyActionListener
									value="#{manejadorAprobacionMovilidadSede.movilidadVisitanteModificacion}"
									target="#{manejadorAprobacionMovilidadSede.movilidadVisitanteSeleccionada}" />
							</p:commandButton>
							<p:commandButton id="noAprobarMovVisitante" value="No aprobar"
								action="#{manejadorAprobacionMovilidadSede.noAprobarMovilidadVisitante}"
								update="mensajeRevisionMovilidadVisitante"
								onstart="dialogEspere.show()" oncomplete="dialogEspere.hide()"
								rendered="#{manejadorAprobacionMovilidadSede.movilidadVisitanteModificacion.dispPresupuestalSede == 'NO'}">
								<f:setPropertyActionListener
									value="#{manejadorAprobacionMovilidadSede.movilidadVisitanteModificacion}"
									target="#{manejadorAprobacionMovilidadSede.movilidadVisitanteSeleccionada}" />
							</p:commandButton>
						</div>
					</p:outputPanel>
				</t:div>
			</p:dialog>
			<p:dialog header="Revisión de movilidad"
				id="movilidadDocentesModalRevision"
				widgetVar="movilidadDocentesModalRevision" modal="true"
				resizable="false" width="800">
				<t:div styleClass="panel-interno-tabla"
					style="max-height:660px; overflow: auto;"
					id="movilidadDocentesDivRevisionCompleto">
					<p:panelGrid styleClass="estilo-panelgrid-sinbordes">
