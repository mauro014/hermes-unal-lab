									value="#{movilidadEstudiantePosgrado}"
									target="#{ManejadorAprobacionMovilidadConsSede.movilidadCancelSeleccionada}" />
							</p:commandLink>
						</p:column>
						<p:rowExpansion>
							<p:dataTable var="archivo4"
								value="#{movilidadEstudiantePosgrado.listaArchivo}"
								style="margin: 15px;">
								<p:column headerText="Nombre archivo">
									<div class="listaSencilla" style="width: 350px;">
										<h:outputText value="#{archivo4.nombre}" />
									</div>
								</p:column>
								<p:column headerText="Acción">
									<h:commandLink
										style="text-decoration:none; 
										color: #16A8E2;
										font-weight: bold;"
										action="#{ManejadorAprobacionMovilidadConsSede.descargarDocumentoEstPosgrado}">
											Descargar
									<f:param name="archivoResumen4" value="#{archivo4.id}" />
										<f:param name="movilidadEstudiantePosgrado"
											value="#{movilidadEstudiantePosgrado.id}" />
									</h:commandLink>
								</p:column>
							</p:dataTable>
						</p:rowExpansion>
					</p:dataTable>
					<br />
					<p:separator id="customSeparator" />
					<br />
					<br />
					<center>
						<h:outputText value="RESIDENCIAS ARTÍSTICAS"
							style='font-weight: bold;' />
						<br /> <br />
					</center>
					<p:dataTable var="movilidadEventoEst"
						value="#{ManejadorAprobacionMovilidadConsSede.listaMovilidadesEstudiantesArtesSede}"
						emptyMessage="No hay residencias de estudiantes registradas.">
						<p:column style="font-size:13px; width:5%"
							filterBy="#{movilidadEventoEst.id}" filterMatchMode="contains">
							<f:facet name="header">
								<h:outputText value="Id" />
							</f:facet>
							<h:outputText value="#{movilidadEventoEst.id}" />
						</p:column>
						<p:column style="font-size:13px; width:8%">
							<f:facet name="header">
								<h:outputText value="Estado" />
							</f:facet>
							<h:outputText
								value="#{movilidadEventoEst.estado == 'I' ? 'Ingresando':'Propuesta'}" />
						</p:column>
						<p:column style="text-align: center;font-size:13px; width:14%">
							<f:facet name="header">
								<h:outputText value="Fecha" />
								<br />
								<h:outputText value="Inicio" />
							</f:facet>
							<h:outputText
								value="#{movilidadEventoEst.fechainicial != null ? movilidadEventoEst.fechainicial:'Sin registrar'}" />
						</p:column>
						<p:column style="text-align: center;font-size:13px; width:14%">
							<f:facet name="header">
								<h:outputText value="Fecha" />
								<br />
								<h:outputText value="Solicitud" />
							</f:facet>
							<h:outputText
								value="#{movilidadEventoEst.fechasolicitud != null ? movilidadEventoEst.fechasolicitud:'La residencia no se ha propuesto'}">
								<f:convertDateTime type="both" dateStyle="short" />
							</h:outputText>
						</p:column>
						<p:column headerText="Acciones" style="font-size:13px; width:5%">
							<p:commandButton
								action="#{ManejadorAprobacionMovilidadConsSede.imprimirMovEstudiantesArtes}"
								icon="ui-icon-search" title="Editar">
								<f:setPropertyActionListener value="#{movilidadEventoEst}"
									target="#{ManejadorAprobacionMovilidadConsSede.movilidadEstudiantesArtes}" />
							</p:commandButton>
							<br />
							<p:commandLink value="Cancelar Movilidad" icon="ui-icon-cancel"
								title="Cancelar" update="@form"
								rendered="#{movilidadEventoEst.segMovFecha == null}"
								oncomplete="dialogCancel.show();"
								style="text-decoration:none; 
											color: #16A8E2;
											font-weight: bold;">
								<f:setPropertyActionListener value="#{movilidadEventoEst}"
									target="#{ManejadorAprobacionMovilidadConsSede.movilidadCancelSeleccionada}" />
							</p:commandLink>
						</p:column>
					</p:dataTable>
				</p:tab>
			</p:tabView>
			<p:dialog
				header="Cancelación Movilidad - ID: #{ManejadorAprobacionMovilidadConsSede.movilidadCancelSeleccionada.id}"
				widgetVar="dialogCancel" modal="true" resizable="false" width="600">
				<p:ajax event="close" update=":content" />
				<h:outputText
					value="Por favor, indique el motivo por el cual se realiza la cancelación de la movilidad:" />
				<br />
				<br />
				<p:inputTextarea minlength="4" style="width: 100%"
					value="#{ManejadorAprobacionMovilidadConsSede.motivoCancelacion}" />
				<br />
				<br />
				<center>
					<p:commandButton value="Cancelar Movilidad"
						action="#{ManejadorAprobacionMovilidadConsSede.cancelarMovilidad}"
						oncomplete="dialogCancel.hide()"
						onclick="if(!confirm('¿Esta seguro de guardar todos los cambios realizados?'))return false">
					</p:commandButton>
				</center>
			</p:dialog>
		</h:form>
	</ui:define>
</ui:composition>
