<?xml version='1.0' encoding='ISO-8859-1' ?>
<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:t="http://myfaces.apache.org/tomahawk"
	xmlns:s="http://myfaces.apache.org/sandbox"
	template="../../templates/common.xhtml">

<ui:define name="content">
<h:form>

<s:fieldset legend="Coordinadores de movilidades" 
styleClass="legend1">
	<h:outputText value="Coordinadores asociados a todas las facultades e institutos:" 
		style='font-size: 11px; font-style: normal, font-weight: lighter;'
			styleClass="labels_proyecto" />
				<br />
				<br />
		
			<t:dataTable var="movilidadCoordinador"
				value="#{manejadorEditarCoordinadoresMovilidadesFacultad.listaCoordinadores2}"
				binding="#{manejadorEditarCoordinadoresMovilidadesFacultad.tablaCoordinadores2}" 
				border="1"  cellpadding="4" cellspacing="0"
				preserveDataModel="false" rows="10" id="tablaConvocatoria5">
				<h:column>
					<f:facet name="header">
						<h:outputText value="Facultad" styleClass= 'font-size: 10px; font-style: normal' />
					</f:facet>
					<h:outputText value="#{movilidadCoordinador.dependencia2.nombre}"
						style='font-size: 10px; font-style: normal' />
				</h:column>

				<h:column>
					<f:facet name="header">
						<h:outputText value="Coordinador" styleClass='font-size: 10px; font-style: normal' />
					</f:facet>
					<h:outputText value="#{movilidadCoordinador.nombre1} #{movilidadCoordinador.apellido1} #{movilidadCoordinador.apellido2}"
						style='font-size: 10px; font-style: normal' />
				</h:column>
				
				<h:column>
					<f:facet name="header">
						<h:outputText value="Correo Electrónico" styleClass='font-size: 10px; font-style: normal' />
					</f:facet>
					<h:outputText value="#{movilidadCoordinador.email}"
						style='font-size: 10px; font-style: normal' />
				</h:column>
				<h:column>
					<f:facet name="header">
						<h:outputText value="Editar Coordinador" styleClass='font-size: 10px; font-style: normal' />
					</f:facet>
					<h:commandLink
						action="#{manejadorEditarCoordinadoresMovilidadesFacultad.eliminarCoordinador}"
						value="   Eliminar "
						style="font-style: normal; font-size: 9px; font-weight: bold; color: #0000A0; text-transform: capitalize">
					</h:commandLink>
					
				</h:column>
				
			</t:dataTable>
			
			
				<br />
		
		
		<h:panelGrid columns="1">

				<t:dataScroller id="paginador1" for="tablaConvocatoria5" fastStep="10"
					renderFacetsIfSinglePage="false" pageCountVar="contador"
					pageIndexVar="indice" paginator="true" paginatorMaxPages="10"
					paginatorTableClass="paginator"
					paginatorActiveColumnStyle="font-size:18px;font-weight:bold;">


					<f:facet name="first">
						<t:outputText value=" <<Primero " />
					</f:facet>

					<f:facet name="previous">
						<t:outputText value=" <Anterior " />
					</f:facet>

					<f:facet name="next">
						<t:outputText value=" Siguiente> " />
					</f:facet>

					<f:facet name="last">
						<t:outputText value=" Ultimo>> " />
					</f:facet>
				</t:dataScroller>

			</h:panelGrid>
</s:fieldset>	
<s:fieldset legend="Asignar Coordinadores" styleClass="legend1" 
style="width: 559px" >
	<br />
	<h:outputText value="Para asignar coordinadores de las movilidades a las facultades  por favor 
	ingrese los campos requeridos:"	
	style='font-size: 11px; font-style: normal; font-weight: lighter'
	 styleClass="texto" />
	<br />
	<br />
	<h:panelGrid columns="2" style="width: 314px">	
		<h:outputText value="Facultad: "
			style='font-size: 11px; font-style: bold;'
			styleClass="labels_proyecto" />
		<h:selectOneMenu  id="nivelFacConvocatoria" 			
			value="#{manejadorEditarCoordinadoresMovilidadesFacultad.facultad}"
			styleClass="labels_proyecto2">
			<f:selectItems value="#{manejadorEditarCoordinadoresMovilidadesFacultad.facultadItem}" />
		</h:selectOneMenu> 
	</h:panelGrid>
	<br />
	<h:outputText value="DATOS DEL COORDINADOR " style="font-size: 11px; font-style: bold;"/>
	<br /> 
	<br />
	<h:panelGrid columns="2" style="width: 364px">>>	
		
		 <h:outputText value="Tipo Documento : " style="font-size: 11px; font-style: bold;"/>	 	          	         
         <h:selectOneMenu value="#{manejadorEditarCoordinadoresMovilidadesFacultad.tipoDocumentoB}"
                         				  onchange="submit(this)"
                         				  valueChangeListener="#{manejadorEditarCoordinadoresMovilidadesFacultad.seleccionarTipoDocumento}">
	                        <f:selectItems value="#{manejadorEditarCoordinadoresMovilidadesFacultad.tipoDocumentoItem}"/>
        </h:selectOneMenu>
        <h:outputText value="Documento de Identidad: " style="font-size: 11px; font-style: bold;" />
        <h:inputText value="#{manejadorEditarCoordinadoresMovilidadesFacultad.documentoCoordinadorB}"></h:inputText>
     	<h:outputText value="" 
					style="font-size: 11px; font-style: bold"/>
		<h:outputText value="" 
					style="font-size: 11px; font-style: bold"/>	
		<h:outputText value="" 
					style="font-size: 11px; font-style: bold"/>	
		<h:commandButton  id="buscarXDocumento"
	                  action="#{manejadorEditarCoordinadoresMovilidadesFacultad.buscarCoordinadorxDocumento}" 
	                  value= "Buscar Coordinador" style="font-size: 11px; font-style: normal"/>
    </h:panelGrid>
    <br />
    <h:outputText value="#{manejadorEditarCoordinadoresMovilidadesFacultad.mensajeBusCoord}" 
					style="font-size: 11px; font-style: bold"/>
					
	<h:panelGrid columns="2" rendered="#{manejadorEditarCoordinadoresMovilidadesFacultad.panelRender[2]}">	
	<h:outputText value="Nombre Coordinador:" 
					style="font-size: 11px; font-style: bold;"/>			
	<h:outputText value="#{manejadorEditarCoordinadoresMovilidadesFacultad.investigadorRes}" 
					style="font-size: 11px; font-style: normal;"/>
	<h:outputText value="" 
					style="font-size: 11px; font-style: normal;"/>		
		
	<h:commandLink action="#{manejadorEditarCoordinadoresMovilidadesFacultad.asociarCoordinador}" 
					value="   Asociar coordinador a la facultad " 
					style="font-style: normal; font-size: 10px; font-weight: bold; color: #0000A0; text-transform: capitalize">
	</h:commandLink>
	<br />
	</h:panelGrid>
		<br />
	
			
</s:fieldset>	



</h:form>
</ui:define>
</ui:composition>
