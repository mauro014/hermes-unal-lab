<?xml version='1.0' encoding='ISO-8859-1' ?>
<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:t="http://myfaces.apache.org/tomahawk"
	xmlns:s="http://myfaces.apache.org/sandbox"
	template="../../templates/common.xhtml">

	<ui:define name="title">Seleccionar tipo de Solicitud</ui:define>
	<ui:define name="content">
		<h:form id="form">
			<t:div styleClass="contenido-titulo-general-myriad">Seleccionar tipo de Solicitud</t:div>
			<br />

			<h:panelGrid columns="1" cellpadding="5" cellspacing="5"
				align="center" rendered="#{manejadorAceptarTerminosReferencia.mostrarInfoMov2}">
				<t:div style="width:300px;">
					Por favor seleccione el tipo de solicitud.
				</t:div>
				<p:selectOneRadio id="options"
					value="#{manejadorAceptarTerminosReferencia.opcionMovilidadModalidad2}">
					<f:selectItem itemLabel="Ponencias orales y representaciones artísticas" itemValue="1" />
					<f:selectItem itemLabel="Estancias de investigación" itemValue="4" />					
					<f:selectItem itemLabel="Residencias artísticas" itemValue="2" />
				</p:selectOneRadio>

			</h:panelGrid>
			
			<h:panelGrid columns="2" cellpadding="5" cellspacing="5"
				align="center" rendered="#{manejadorAceptarTerminosReferencia.mostrarInfoMov4}">
				<h:outputText
					value="Por favor seleccione el tipo de solicitud"></h:outputText>
				<p:selectOneRadio id="options2"
					value="#{manejadorAceptarTerminosReferencia.opcionMovilidadModalidad4}">
					<f:selectItem itemLabel="Pasantías" itemValue="1" />
					<f:selectItem itemLabel="Residencias artísticas" itemValue="2" />
				</p:selectOneRadio>

			</h:panelGrid>
			
			<br/>

			<p:messages id="messages" showDetail="false" autoUpdate="true"
				closable="true" />


			<h:panelGroup rendered="#{manejadorAceptarTerminosReferencia.mostrarInfoMov2}">
				<center>

					<h:panelGrid columns="3">
						<p:commandButton value="Salir" id="botonAtras"
							action="#{manejadorAceptarTerminosReferencia.atras}"
							styleClass="ui-priority-primary" />

						<p:commandButton value="Continuar" id="botonGuardarSalir"
							update="@form"
							action="#{manejadorAceptarTerminosReferencia.asociarMovilidad}"
							styleClass="ui-priority-primary" />
					</h:panelGrid>


				</center>
			</h:panelGroup>
			
			<h:panelGroup rendered="#{manejadorAceptarTerminosReferencia.mostrarInfoMov4}">
				<center>

					<h:panelGrid columns="3">
						<p:commandButton value="Salir" id="botonAtras2"
							action="#{manejadorAceptarTerminosReferencia.atras}"
							styleClass="ui-priority-primary" />

						<p:commandButton value="Continuar" id="botonGuardarSalir2"
							update="@form"
							action="#{manejadorAceptarTerminosReferencia.asociarMovilidadTipoCuatro}"
							styleClass="ui-priority-primary" />
					</h:panelGrid>


				</center>
			</h:panelGroup>




		</h:form>
	</ui:define>
</ui:composition>
