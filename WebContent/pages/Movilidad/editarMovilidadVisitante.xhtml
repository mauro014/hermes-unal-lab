<?xml version='1.0' encoding='ISO-8859-1' ?>
<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:t="http://myfaces.apache.org/tomahawk"
	xmlns:s="http://myfaces.apache.org/sandbox"
	template="../../templates/common.xhtml">

<ui:define name="content">
<h:form>

<s:fieldset
	legend="Crear movilidad para apoyo a profesores visitantes internacionales"
	styleClass="legend1">
	<h:panelGroup id="evento">
		<h:panelGrid columns="2">
			<h:outputText value="Grupo que hace la solicitud:"
				styleClass="labels_pro" />
			<h:outputText
				value="#{ManejadorAprobacionMovilidad.movilidadVista.nombreGrupo}"
				styleClass="texto" />

			<h:outputText value="Lider del grupo:" styleClass="labels_pro" />
			<h:outputText
				value="#{ManejadorAprobacionMovilidad.movilidadVista.nombreLiderGrupo}"
				styleClass="texto" />
			<h:outputText value="Documento de identidad:" styleClass="labels_pro" />
			<h:outputText
				value="#{ManejadorAprobacionMovilidad.movilidadVista.idpersona}"
				styleClass="texto" />

			<h:outputText value="Facultad o instituto:" styleClass="labels_pro" />
			<h:outputText
				value="#{ManejadorAprobacionMovilidad.movilidadVista.nombreFacultadSolicitante}"
				styleClass="texto" />

			<h:outputText value="Departamento:" styleClass="labels_pro" />
			<h:outputText
				value="#{ManejadorAprobacionMovilidad.movilidadVista.nombreDepartamentoSolicitante}"
				styleClass="texto" />


			<h:outputText value="Nombre del programa asociado a la visita:"
				styleClass="labels_pro" />
			<h:outputText
				value="#{ManejadorAprobacionMovilidad.movilidadVista.nombreProgramaAsociado}"
				styleClass="texto" />

			<h:outputText value="Nombre del docente visitante:"
				styleClass="labels_pro" />
			<h:outputText id="nombreDocente"
				value="#{ManejadorAprobacionMovilidad.movilidadVista.nombreDocente}"
				styleClass="texto" />

			<h:outputText value="Pasaporte:" styleClass="labels_pro" />
			<h:outputText id="documentoVisitante"
				value="#{ManejadorAprobacionMovilidad.movilidadVista.documentoVisitante}"
				styleClass="texto" />

			<h:outputText value="Nacionalidad del docente:"
				styleClass="labels_pro" />
			<h:outputText id="nacionalidad"
				value="#{ManejadorAprobacionMovilidad.movilidadVista.nacionalidad}"
				styleClass="texto" />

			<h:outputText value="País de procedencia:" styleClass="labels_pro" />
			<h:outputText
				value="#{ManejadorAprobacionMovilidad.movilidadVista.nombrePais}"
				styleClass="texto" />

			<h:outputText value="Institución a la que pertenece el docente:"
				styleClass="labels_pro" />
			<h:outputText styleClass="texto" id="institucion"
				value="#{ManejadorAprobacionMovilidad.movilidadVista.universidad}"
				styleClass="texto" />

			<h:outputText value="Ruta del viaje:" styleClass="labels_pro" />
			<h:outputText
				value="#{ManejadorAprobacionMovilidad.movilidadVista.plan}"
				styleClass="texto" />

			<h:outputText value="Fecha de inicio del viaje:"
				styleClass="labels_pro" />
			<h:outputText
				value="#{ManejadorAprobacionMovilidad.movilidadVista.fechainicial}"
				styleClass="texto" />

			<h:outputText value="Fecha de finalización del viaje:"
				styleClass="labels_pro" />
			<h:outputText
				value="#{ManejadorAprobacionMovilidad.movilidadVista.fechafinal}"
				styleClass="texto" />

			<h:outputText value="Evento de difusión asociado a la visita:"
				styleClass="labels_pro" />
			<h:outputText
				value="#{ManejadorAprobacionMovilidad.movilidadVista.evento}"
				styleClass="texto" />

			<h:outputText value="Valor del tiquete en pesos colombianos:"
				styleClass="labels_pro" />
			<h:outputText id="valorTiquete"
				value="#{ManejadorAprobacionMovilidad.movilidadVista.costotiquete}"
				styleClass="texto">
				<f:convertNumber pattern="#,##0.00" />
			</h:outputText>

			<h:outputText
				value="Monto diario a financiar por concepto de gastos de estadía en dólares:"
				styleClass="labels_pro" />
			<h:outputText id="montoDiario"
				value="#{ManejadorAprobacionMovilidad.movilidadVista.monto}"
				styleClass="texto">
				<f:convertNumber pattern="#,##0.00" />
			</h:outputText>

			<h:outputText
				value="Número de días a financiar por concepto de gastos de estadía:"
				styleClass="labels_pro" />
			<h:outputText id="numeroDias"
				value="#{ManejadorAprobacionMovilidad.movilidadVista.numerodias}"
				styleClass="texto" />
		</h:panelGrid>
	</h:panelGroup>

	<h:dataTable cellpadding="6" cellspacing="3" border="1"
		value="#{ManejadorAprobacionMovilidad.movilidadVista.listaActividades}"
		var="actividadMovilidad"
		binding="#{ManejadorAprobacionMovilidad.tablaActividades}">

		<h:column>

			<h:message for="descripcion" styleClass="mensajeerror"
				showDetail="true" showSummary="true" />
			<h:outputText />

			<h:outputText value="Descripción:" styleClass="labels_pro" />

			<h:outputText value="#{actividadMovilidad.descripcion}"
				styleClass="texto" />

			<h:panelGrid columns="2" align="center" cellpadding="6"
				cellspacing="3">

				<h:outputText value="Fecha:" styleClass="labels_pro" />
				<h:outputText value="#{actividadMovilidad.fecha}" styleClass="texto" />

				<h:outputText value="Duración de la actividad (en horas):"
					styleClass="labels_pro" />
				<h:outputText value="#{actividadMovilidad.duracion}"
					styleClass="texto" />

			</h:panelGrid>
		</h:column>

	</h:dataTable>

	<h:panelGroup id="evento3">
		<h:panelGrid columns="2">
			<h:outputText value="Archivos Adjuntos:" styleClass="labels_pro" />
			<h:panelGroup id="evento2"
				rendered="#{ManejadorAprobacionMovilidad.mostrarArchivo}">
				<h:panelGrid columns="2" border="1">
					<h:panelGrid columns="1">
						<f:facet name="header">
							<h:outputText value="Nombre del archivo" />
						</f:facet>
						<h:outputText
							value=" #{ManejadorAprobacionMovilidad.movilidadVista.nombreArchivo}"
							styleClass="texto" />
					</h:panelGrid>
					<h:panelGrid columns="1">
						<f:facet name="header">
							<h:outputText value="Descargar" />
						</f:facet>
						<h:commandButton value="Descargar"
							action="#{ManejadorAprobacionMovilidad.descargarArchivo}"
							image="/imgplantilla/pngtitulos/cen_descargar.png" />
					</h:panelGrid>
				</h:panelGrid>
			</h:panelGroup>

			<h:outputText value="Aprobación facultad:" styleClass="labels_pro" />
			<h:outputText
				value="#{ManejadorAprobacionMovilidad.movilidadVista.aceptacion}"
				styleClass="texto" />

			<h:outputText />
			<h:message for="#{ManejadorAprobacionMovilidad.aceptacionDIB}"
				styleClass="mensajeerror" showDetail="true" showSummary="false" />
			<h:outputText value="Aprobacion DIB:" styleClass="labels_pro" />
			<h:selectOneMenu
				value="#{ManejadorAprobacionMovilidad.aceptacionDIB}"
				styleClass="texto">
				<f:selectItems value="#{ManejadorAprobacionMovilidad.aprobacion}" />
			</h:selectOneMenu>
		</h:panelGrid>
	</h:panelGroup>

</s:fieldset>


	<br />
	<center>

<h:commandButton action="#{ManejadorAprobacionMovilidad.guardar}"
	value="Guardar" image="/imgplantilla/pngtitulos/cen_guardar2.png" />
<h:commandButton id="visitante" value="Reporte"
	actionListener="#{ManejadorAprobacionMovilidad.reporteMovilidadEvento}"
	action="#{ManejadorAprobacionMovilidad.reporteMovilidad}"
	image="/imgplantilla/pngtitulos/cen_imprimireporte.png">
	<f:param name="opcion" value="visitante" />
</h:commandButton>

	</center>


</h:form>
</ui:define>
</ui:composition>
