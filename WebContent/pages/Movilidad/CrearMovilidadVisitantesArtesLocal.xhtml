<?xml version='1.0' encoding='ISO-8859-1' ?>
<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:t="http://myfaces.apache.org/tomahawk"
	xmlns:s="http://myfaces.apache.org/sandbox"
	template="../../templates/common.xhtml">

<ui:define name="content">
<h:form>

<s:pprPanelGroup id="pprSelectAreas"

		<h:panelGrid columns="2">

				value="#{ManejadorCrearEditarMovilidadVisArtLocal.errores[1]}"

				rendered="#{ManejadorCrearEditarMovilidadVisArtLocal.panelRenderError[1]}" />
			<h:outputText value="Primer Nombre(*)"
				style='font-size: 10px; font-style: normal'
				styleClass="labels_proyecto" />

				value="#{ManejadorCrearEditarMovilidadVisArtLocal.nombreUno}"
				style='font-size: 10px; font-style: normal'  size="60"
				styleClass="labels_proyecto">
			</h:inputText>
			
			    <h:outputText value="" rendered="#{ManejadorCrearEditarMovilidadVisArtLocal.panelRenderError[2]}"/>

				value="#{ManejadorCrearEditarMovilidadVisArtLocal.errores[2]}"

			<h:outputText value="Segundo Nombre"
				style='font-size: 10px; font-style: normal'
				styleClass="labels_proyecto" />

				value="#{ManejadorCrearEditarMovilidadVisArtLocal.nombreDos}"

				value="#{ManejadorCrearEditarMovilidadVisArtLocal.errores[3]}"

				rendered="#{ManejadorCrearEditarMovilidadVisArtLocal.panelRenderError[3]}" />

				style='font-size: 10px; font-style: normal'

			</h:inputText>
			
			<h:outputText value="" rendered="#{ManejadorCrearEditarMovilidadVisArtLocal.panelRenderError[4]}"/>
			<h:outputText
				value="#{ManejadorCrearEditarMovilidadVisArtLocal.errores[4]}"

				rendered="#{ManejadorCrearEditarMovilidadVisArtLocal.panelRenderError[4]}" />
			<h:outputText value="Segundo Apellido"
				style='font-size: 10px; font-style: normal'
				styleClass="labels_proyecto" />
			<h:inputText id="Apellidos2Visiatente"
				value="#{ManejadorCrearEditarMovilidadVisArtLocal.apellidoDos}"
				style='font-size: 10px; font-style: normal'  size="60"
				styleClass="labels_proyecto">

				style='font-size: 10px; font-style: normal'
				styleClass="labels_proyecto" />

				value="#{ManejadorCrearEditarMovilidadVisArtLocal.movArt.formacion.id}"
				styleClass="texto" style='font-size: 10px; font-style: normal'>
				<f:selectItems
					value="#{ManejadorCrearEditarMovilidadVisArtLocal.tipoFormacion}" />
			</h:selectOneMenu>
			
			<h:outputText value="Genero(*)"
				style='font-size: 10px; font-style: normal'
				styleClass="labels_proyecto" />

					value="#{ManejadorCrearEditarMovilidadVisArtLocal.convenio}" />

			<h:outputText value="" rendered="#{ManejadorCrearEditarMovilidadVisArtLocal.panelRenderError[5]}"/>

			<f:selectItems
						value="#{ManejadorCrearEditarMovilidadVisArtLocal.continentes}" />
			</h:selectOneMenu>		
		
			
			<h:outputText value="Nacionalidad(*)"
				style='font-size: 10px; font-style: normal'
				styleClass="labels_proyecto" />

				value="#{ManejadorCrearEditarMovilidadVisArtLocal.movArt.nacionalidad.id}"
				styleClass="texto" style='font-size: 10px; font-style: normal'>
				<f:selectItems
					value="#{ManejadorCrearEditarMovilidadVisArtLocal.nacionalidad}" />
			</h:selectOneMenu>

			<h:outputText value="" rendered="#{ManejadorCrearEditarMovilidadVisArtLocal.panelRenderError[6]}"/>

				value="#{ManejadorCrearEditarMovilidadVisArtLocal.errores[6]}"
				styleClass="mensajeerror"
				rendered="#{ManejadorCrearEditarMovilidadVisArtLocal.panelRenderError[6]}" />

				style='font-size: 10px; font-style: normal'
				styleClass="labels_proyecto" />

				value="#{ManejadorCrearEditarMovilidadVisArtLocal.movArt.pasaporte}"
				style='font-size: 10px; font-style: normal' size="60"
				styleClass="labels_proyecto">

		<h:panelGrid columns="2" align="center"

				value="#{ManejadorCrearEditarMovilidadVisArtLocal.errores[0]}"
				styleClass="labels_proyecto" />
		</h:panelGrid>
	</s:fieldset>
</s:pprPanelGroup>


	<center><br />


	</center>



<h:panelGrid columns="1" align="center">
	<h:commandButton
		action="#{ManejadorCrearEditarMovilidadVisArtLocal.guardar}"
		value="Guardar" image="/imgplantilla/pngtitulos/cen_guardar2.png" />
</h:panelGrid>
