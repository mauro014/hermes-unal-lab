<?xml version='1.0' encoding='ISO-8859-1' ?>
<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:t="http://myfaces.apache.org/tomahawk"
	xmlns:s="http://myfaces.apache.org/sandbox"
	template="../../templates/common.xhtml">
	<ui:define name="content">
		<h:form id="formCrearMovilidadEvento">
			<t:div styleClass="contenido-titulo-general-myriad">Registro solicitud de movilidad</t:div>
			<p:panel header="Participación de docente investigador">
				<p:panelGrid columns="2" styleClass="estilo-panelgrid-sinbordes">
					<t:div style="width: 247px;">
						<h:outputText value="Tipo de documento docente UN:" />
					</t:div>
					<p:selectOneMenu disable="true"
						value="#{ManejadorCrearEditarMovilidadEvento.tipoDocumento.id}">
						<f:selectItems
							value="#{ManejadorCrearEditarMovilidadEvento.tipoDocumentoItem}" />
					</p:selectOneMenu>
					<h:outputText value="Número de documento del docente UN:" />
					<p:inputText id="Numero" disable="true"
						value="#{ManejadorCrearEditarMovilidadEvento.documento}" size="20">
					</p:inputText>
					<h:outputText />
					<p:commandButton value="Continuar" icon="ui-icon-search"
						onstart="dialogEspere.show()" oncomplete="dialogEspere.hide()"
						action="#{ManejadorCrearEditarMovilidadEvento.buscarPersona}"
						update="formCrearMovilidadEvento" />
					<h:outputText
						value="#{ManejadorCrearEditarMovilidadEvento.noExiste1}"
						styleClass="mensajeerror" />
					<h:outputText
						value="#{ManejadorCrearEditarMovilidadEvento.noExiste}"
						styleClass="mensajeerror"
						rendered="#{ManejadorCrearEditarMovilidadEvento.panelNoExiste}" />
				</p:panelGrid>
			</p:panel>
			<p:spacer height="20"
				rendered="#{ManejadorCrearEditarMovilidadEvento.mostrarDatosEvento}" />
			<p:panel header="Investigador" id="idDatosInvestigador"
				rendered="#{ManejadorCrearEditarMovilidadEvento.mostrarDatosEvento}">
				<p:panelGrid columns="2" id="evento"
					styleClass="estilo-panelgrid-sinbordes"
					rendered="#{ManejadorCrearEditarMovilidadEvento.mostrarDatosEvento}">
					<t:div style="width: 247px;">
						<h:outputText value="Nombre del docente" />
					</t:div>
					<h:outputText
						value="#{ManejadorCrearEditarMovilidadEvento.nombreDocente}" />
					<h:outputText value="Documento de identidad" />
					<h:outputText
						value="#{ManejadorCrearEditarMovilidadEvento.documentoDocente}" />
					<h:outputText value="Facultad o instituto" />
					<h:outputText
						value="#{ManejadorCrearEditarMovilidadEvento.facultadDocente}" />
					<h:outputText value="Departamento" />
					<h:outputText
						value="#{ManejadorCrearEditarMovilidadEvento.departamentoDocente}" />

					<h:outputText
						rendered="#{ManejadorCrearEditarMovilidadEvento.errorGrupo}" />
					<h:outputText
						value="#{ManejadorCrearEditarMovilidadEvento.msgErrorGrupo}"
						styleClass="mensajeerror"
						rendered="#{ManejadorCrearEditarMovilidadEvento.errorGrupo}" />

					<h:outputText value="Grupo de investigación"
						rendered="#{ManejadorCrearEditarMovilidadEvento.validarGrupo}" />
					<p:selectOneMenu id="somGrupo" style="width:330px;"
						panelStyle="width:330px;"
						value="#{ManejadorCrearEditarMovilidadEvento.idgrupo}"
						rendered="#{ManejadorCrearEditarMovilidadEvento.validarGrupo}">
						<f:selectItems
							value="#{ManejadorCrearEditarMovilidadEvento.listaGrupos}" />
					</p:selectOneMenu>

					<h:outputText
						rendered="#{ManejadorCrearEditarMovilidadEvento.errorPasaporte}" />
					<h:outputText
						value="#{ManejadorCrearEditarMovilidadEvento.msgErrorPasaporte}"
						styleClass="mensajeerror"
						rendered="#{ManejadorCrearEditarMovilidadEvento.errorPasaporte}" />

					<h:outputText value="Pasaporte"
						rendered="#{ManejadorCrearEditarMovilidadEvento.mostrarPasaporte}" />
					<p:inputText id="numPasaporte"
						value="#{ManejadorCrearEditarMovilidadEvento.mde.pasaporteInvestigador}"
						style="width: 350px;" maxlength="100"
						rendered="#{ManejadorCrearEditarMovilidadEvento.mostrarPasaporte}">
					</p:inputText>

				</p:panelGrid>
				<h:panelGrid columns="2" id="eventoInfoUno" cellpadding="5"
					cellspacing="5" align="center">
					<h:outputText
						value="¿En los últimos 24 meses calendario se ha postulado para alguna convocatoria externa de proyectos o programas de investigación ó ha publicado uno o más artículos indexados internacionalmente en la base de datos ISI o Scopus? "
						rendered="false" />
					<p:selectOneMenu id="optionsConvExt"
						value="#{ManejadorCrearEditarMovilidadEvento.mde.infoConvocatoriaExterna}"
						rendered="false">
						<f:selectItem itemLabel="NO" itemValue="NO" />
						<f:selectItem itemLabel="SI" itemValue="SI" />
						<p:ajax update="idDatosInvestigador, eventoInfoDos"
							onstart="dialogEspere.show()" oncomplete="dialogEspere.hide()"
							listener="#{ManejadorCrearEditarMovilidadEvento.revisarInfoConvExt}" />
					</p:selectOneMenu>
				</h:panelGrid>
				<p:panelGrid columns="2" id="eventoInfoDos"
					styleClass="estilo-panelgrid-sinbordes"
					rendered="#{ManejadorCrearEditarMovilidadEvento.siConvExt}">
					<t:div style="width: 247px;">
						<h:outputText
							value="Indique cuales y adjunte al final del registro los documentos de soporte correspondientes" />
					</t:div>
					<p:inputTextarea id="idInTexArConvExt"
						value="#{ManejadorCrearEditarMovilidadEvento.mde.descConvocatoriaExterna}"
						maxlength="3000" counter="counterDetalleConvocatoriaExterna"
						counterTemplate="{0} caracteres restantes." rows="8" cols="50">
					</p:inputTextarea>
					<h:outputText value="" />
					<h:outputText id="counterDetalleConvocatoriaExterna" />

				</p:panelGrid>
			</p:panel>
			<p:spacer height="20"
				rendered="#{ManejadorCrearEditarMovilidadEvento.mostrarDatosEvento}" />
			<p:panel header="Trabajo a presentar"
				rendered="#{ManejadorCrearEditarMovilidadEvento.mostrarDatosEvento and !ManejadorCrearEditarMovilidadEvento.esEstanciaInvestigacionDocente}">
				<p:panelGrid columns="2" styleClass="estilo-panelgrid-sinbordes">
					<h:outputText
						rendered="#{ManejadorCrearEditarMovilidadEvento.BErrorListaPonencia}" />
					<h:outputText
						value="#{ManejadorCrearEditarMovilidadEvento.errores[10]}"
						styleClass="mensajeerror"
						rendered="#{ManejadorCrearEditarMovilidadEvento.BErrorListaPonencia}" />
					<h:outputText value="Objeto de la movilidad" />
					<p:selectOneMenu id="somTipoPonencia1"
						value="#{ManejadorCrearEditarMovilidadEvento.idTipoPonencia}"
						panelStyle="width:600px;" style="width:400px">
						<f:selectItems
							value="#{ManejadorCrearEditarMovilidadEvento.tipoPonencia}" />
						<p:ajax update="@parent" process="@parent"
							listener="#{ManejadorCrearEditarMovilidadEvento.activarOtrotipoPonencia}" />
					</p:selectOneMenu>
					<h:outputText value="Cual tipo de ponencia"
						rendered="#{ManejadorCrearEditarMovilidadEvento.BOtroTipoPonencia}" />
					<p:inputText id="otroTipoPonencia"
						value="#{ManejadorCrearEditarMovilidadEvento.otroTipoPonencia}"
						size="40" maxlength="200"
						rendered="#{ManejadorCrearEditarMovilidadEvento.BOtroTipoPonencia}">
					</p:inputText>
					<h:outputText
						rendered="#{ManejadorCrearEditarMovilidadEvento.BErrorTitulo}" />
					<h:outputText
						value="#{ManejadorCrearEditarMovilidadEvento.errores[2]}"
						styleClass="mensajeerror"
						rendered="#{ManejadorCrearEditarMovilidadEvento.BErrorTitulo}" />
					<h:outputText value="Título del trabajo a presentar" />
					<p:inputTextarea id="tituloPonencia"
						value="#{ManejadorCrearEditarMovilidadEvento.tituloPonencia}"
						rows="3" style="width: 350px;" counter="counterTituloPonencia"
						maxlength="2000" counterTemplate="{0} caracteres restantes." />
					<h:outputText value="" />
					<h:outputText id="counterTituloPonencia" />
					<center>
						<p:commandButton value="Adicionar" icon="ui-icon-plusthick"
							onstart="dialogEspere.show()" oncomplete="dialogEspere.hide()"
							action="#{ManejadorCrearEditarMovilidadEvento.adicionarPonencia}"
							update="formCrearMovilidadEvento"
							rendered="#{ManejadorCrearEditarMovilidadEvento.trabajosDisponibles}">
						</p:commandButton>
					</center>
				</p:panelGrid>

				<p:dataTable var="ponenciaTabla"
					value="#{ManejadorCrearEditarMovilidadEvento.listaPonencias}"
					emptyMessage="No existen ponencias.">
					<p:column>
						<f:facet name="header">
							<h:outputText value="Código" />
						</f:facet>
						<h:outputText value="#{ponenciaTabla.ponencia.id}" />
					</p:column>
					<p:column>
						<f:facet name="header">
							<h:outputText value="Objeto de la movilidad" />
						</f:facet>
						<h:outputText value="#{ponenciaTabla.ponencia.descripcion}" />
					</p:column>
					<p:column>
						<f:facet name="header">
							<h:outputText value="Título del trabajo" />
						</f:facet>
						<h:outputText value="#{ponenciaTabla.titulo}" />
					</p:column>
					<p:column>
						<f:facet name="header">
							<h:outputText value="Eliminar" />
						</f:facet>
						<p:commandButton icon="ui-icon-trash"
							onclick="if(!confirm('Esta seguro de eliminar la ponencia?'))return false"
							action="#{ManejadorCrearEditarMovilidadEvento.eliminarPonencia}"
							immediate="true" update=":formCrearMovilidadEvento">
							<f:setPropertyActionListener value="#{ponenciaTabla}"
								target="#{ManejadorCrearEditarMovilidadEvento.movilidadPonenciaSeleccionada}" />
						</p:commandButton>
					</p:column>
				</p:dataTable>

			</p:panel>

			<p:panel header="Información de la estancia de investigación"
				rendered="#{ManejadorCrearEditarMovilidadEvento.mostrarDatosEvento and ManejadorCrearEditarMovilidadEvento.esEstanciaInvestigacionDocente}">

				<h:panelGrid columns="2" id="evento">

					<h:outputText value="País donde se realizará la estancia" />
					<p:selectOneMenu
						value="#{ManejadorCrearEditarMovilidadEvento.idPais}">
						<f:selectItem itemLabel="Seleccione Uno" itemValue="00" />
						<f:selectItems
							value="#{ManejadorCrearEditarMovilidadEvento.paises}" />
					</p:selectOneMenu>

					<h:outputText
						rendered="#{ManejadorCrearEditarMovilidadEvento.BErrorCiudad}" />
					<h:outputText
						value="#{ManejadorCrearEditarMovilidadEvento.errores[4]}"
						styleClass="mensajeerror"
						rendered="#{ManejadorCrearEditarMovilidadEvento.BErrorCiudad}" />

					<h:outputText value="Ciudad donde se realizará la estancia" />
					<p:inputText id="Ciudad"
						value="#{ManejadorCrearEditarMovilidadEvento.mde.ciudad}"
						size="40" styleClass="labels_proyecto" maxlength="200">
					</p:inputText>

					<h:outputText
						rendered="#{ManejadorCrearEditarMovilidadEvento.bErrorNombreUniversidad}" />
					<h:outputText
						value="#{ManejadorCrearEditarMovilidadEvento.errores[14]}"
						styleClass="mensajeerror"
						rendered="#{ManejadorCrearEditarMovilidadEvento.bErrorNombreUniversidad}" />

					<t:div style="width: 247px;">
						<h:outputText
							value="Universidad o entidad extranjera donde va a realizar la estancia de investigación" />
					</t:div>
					<p:inputText id="univ1"
						value="#{ManejadorCrearEditarMovilidadEvento.mde.nombreUniversidad}"
						size="40" styleClass="labels_proyecto">
					</p:inputText>

					<h:outputText
						rendered="#{ManejadorCrearEditarMovilidadEvento.fechaIncorrecta}" />
					<h:outputText
						value="La fecha del viaje debe ser superior que la fecha actual en 30 días calendario."
						styleClass="mensajeerror"
						rendered="#{ManejadorCrearEditarMovilidadEvento.fechaIncorrecta}" />

					<h:outputText value="Fecha de inicio del viaje" />
					<p:calendar id="fechainicio" pages="1" locale="es"
						readonlyInput="true" pattern="dd/MM/yyyy" navigator="true"
						value="#{ManejadorCrearEditarMovilidadEvento.mde.fechainicial}"
						mindate="#{ManejadorCrearEditarMovilidadEvento.fechaMinimaInicio}"
						valueChangeListener="#{ManejadorCrearEditarMovilidadEvento.validarFecha}">
						<p:ajax event="dateSelect" update="formCrearMovilidadEvento"
							onstart="dialogEspere.show()" oncomplete="dialogEspere.hide()"
							process="@form" />
					</p:calendar>


					<h:outputText
						rendered="#{ManejadorCrearEditarMovilidadEvento.fechaIncorrecta2}" />
					<h:outputText value="La fecha de finalización viaje no es válida."
						styleClass="mensajeerror"
						rendered="#{ManejadorCrearEditarMovilidadEvento.fechaIncorrecta2}" />

					<h:outputText value="Fecha de finalización del viaje"
						rendered="#{ManejadorCrearEditarMovilidadEvento.panelMasDatos}" />
					<p:calendar id="fechafin" pages="1" locale="es"
						readonlyInput="true" pattern="dd/MM/yyyy" navigator="true"
						value="#{ManejadorCrearEditarMovilidadEvento.mde.fechafinal}"
						mindate="#{ManejadorCrearEditarMovilidadEvento.fechaMinimaInicio}"
						rendered="#{ManejadorCrearEditarMovilidadEvento.panelMasDatos}">
						<p:ajax event="dateSelect" update="formCrearMovilidadEvento"
							onstart="dialogEspere.show()" oncomplete="dialogEspere.hide()"
							process="@form" />
					</p:calendar>
				</h:panelGrid>
			</p:panel>

			<p:spacer height="20"
				rendered="#{ManejadorCrearEditarMovilidadEvento.mostrarDatosEventoAux}" />
			<p:panel header="Datos del evento, estancia o residencia artística"
				rendered="#{ManejadorCrearEditarMovilidadEvento.mostrarDatosEventoAux and !ManejadorCrearEditarMovilidadEvento.esEstanciaInvestigacionDocente}">

				<p:panelGrid styleClass="estilo-panelgrid-sinbordes" columns="2"
					id="pgDatosEvento" align="center">

					<h:outputText
						rendered="#{ManejadorCrearEditarMovilidadEvento.errorSubmodalidad}" />
					<h:outputText value="Por favor seleccionar el tipo de movilidad."
						styleClass="mensajeerror"
						rendered="#{ManejadorCrearEditarMovilidadEvento.errorSubmodalidad}" />
					<h:outputText value="Tipo de movilidad"
						rendered="#{ManejadorCrearEditarMovilidadEvento.mostrarSubModalidades}" />
					<p:selectOneMenu id="idListaSelDos"
						value="#{ManejadorCrearEditarMovilidadEvento.mde.subModalidadConvocatoria}"
						rendered="#{ManejadorCrearEditarMovilidadEvento.mostrarSubModalidades}"
						style="width:400px" panelStyle="width:460px">
						<f:selectItem itemLabel="Seleccione una opción" itemValue="" />
						<f:selectItems
							value="#{ManejadorCrearEditarMovilidadEvento.listaSubmodalidades}" />
					</p:selectOneMenu>

					<h:outputText
						rendered="#{ManejadorCrearEditarMovilidadEvento.BErrorEvento}" />
					<h:outputText
						value="#{ManejadorCrearEditarMovilidadEvento.errores[1]}"
						styleClass="mensajeerror"
						rendered="#{ManejadorCrearEditarMovilidadEvento.BErrorEvento}" />
					<t:div style="width: 247px;">
						<h:outputText
							value="Nombre del evento científico (incluir enlace del evento)" />
					</t:div>
					<p:inputTextarea id="nombreEvento"
						value="#{ManejadorCrearEditarMovilidadEvento.nombreEvento}"
						counter="counterNombreEvento" maxlength="2000"
						counterTemplate="{0} caracteres restantes." rows="3"
						style="width: 350px;" />
					<h:outputText value="" />
					<h:outputText id="counterNombreEvento" />
					<h:outputText
						rendered="#{ManejadorCrearEditarMovilidadEvento.bErrorNombreUniversidad}" />
					<h:outputText
						value="#{ManejadorCrearEditarMovilidadEvento.errores[14]}"
						styleClass="mensajeerror"
						rendered="#{ManejadorCrearEditarMovilidadEvento.bErrorNombreUniversidad}" />
					<t:div style="width:247px;">
						<h:outputText
							value="Nombre de la Universidad o Institución organizadora del evento o donde se realizará la estancia o residencia artística:" />
					</t:div>
					<p:inputText id="nombreUniversidad"
						value="#{ManejadorCrearEditarMovilidadEvento.mde.nombreUniversidad}"
						style="width: 350px;" maxlength="250">
					</p:inputText>
					<h:outputText
						rendered="#{ManejadorCrearEditarMovilidadEvento.BErrorPais}" />
					<h:outputText
						value="#{ManejadorCrearEditarMovilidadEvento.errores[3]}"
						styleClass="mensajeerror"
						rendered="#{ManejadorCrearEditarMovilidadEvento.BErrorPais}" />
					<h:outputText
						value="País donde se realizará el evento, la estancia o residencia artística:" />
					<p:selectOneMenu filter="true" filterMatchMode="contains"
						value="#{ManejadorCrearEditarMovilidadEvento.idPais}">
						<f:selectItems
							value="#{ManejadorCrearEditarMovilidadEvento.paises}" />
						<p:ajax update="pgDatosEvento" process="pgDatosEvento"
							listener="#{ManejadorCrearEditarMovilidadEvento.revisarPais}" />
					</p:selectOneMenu>
					<h:outputText
						rendered="#{ManejadorCrearEditarMovilidadEvento.BErrorCiudad}" />
					<h:outputText
						value="#{ManejadorCrearEditarMovilidadEvento.errores[4]}"
						styleClass="mensajeerror"
						rendered="#{ManejadorCrearEditarMovilidadEvento.BErrorCiudad}" />
					<h:outputText
						value="Departamento donde se realizará el evento, la estancia o residencia artística:"
						rendered="#{ManejadorCrearEditarMovilidadEvento.siColombia}" />
					<p:selectOneMenu
						value="#{ManejadorCrearEditarMovilidadEvento.departamentoActual.id}"
						effect="fade" id="depto" panelStyle="width:350px;"
						style="width:350px" filter="true" filterMatchMode="contains"
						rendered="#{ManejadorCrearEditarMovilidadEvento.siColombia}">
						<f:selectItems
							value="#{ManejadorCrearEditarMovilidadEvento.departamentoItem}" />
						<p:ajax update="depto,CiudadSel " processo="depto,CiudadSel "
							listener="#{ManejadorCrearEditarMovilidadEvento.cambiarDepartamento}" />
					</p:selectOneMenu>
					<h:outputText
						value="Ciudad donde se realizará el evento, la estancia o residencia artística:"
						rendered="#{ManejadorCrearEditarMovilidadEvento.siColombia}" />
					<p:selectOneMenu
						value="#{ManejadorCrearEditarMovilidadEvento.ciudadEvento}"
						effect="fade" id="CiudadSel" panelStyle="width:350px;"
						style="width:350px" filter="true" filterMatchMode="contains"
						rendered="#{ManejadorCrearEditarMovilidadEvento.siColombia}">
						<f:selectItems
							value="#{ManejadorCrearEditarMovilidadEvento.ciudadItem}" />
					</p:selectOneMenu>
					<h:outputText
						value="Ciudad donde se realizará el evento, la estancia o residencia artística:"
						rendered="#{!ManejadorCrearEditarMovilidadEvento.siColombia}" />
					<p:inputText id="Ciudad"
						value="#{ManejadorCrearEditarMovilidadEvento.mde.ciudad}"
						rendered="#{!ManejadorCrearEditarMovilidadEvento.siColombia}"
						style="width: 350px;">
					</p:inputText>
					<h:outputText value="Tipo de Movilidad:"
						rendered="#{ManejadorCrearEditarMovilidadEvento.mostrarTipoMovilidad}" />
					<p:selectOneMenu id="uiTipoMov" style="width:350px;"
						panelStyle="width: 350px;"
						value="#{ManejadorCrearEditarMovilidadEvento.mde.movilidadTipo}"
						rendered="#{ManejadorCrearEditarMovilidadEvento.mostrarTipoMovilidad}">
						<f:selectItem itemValue="P" itemLabel="Presencial" />
						<f:selectItem itemValue="V" itemLabel="Virtual" />
						<p:ajax
							listener="#{ManejadorCrearEditarMovilidadEvento.definirInicioConvNal2022_2024}"
							update="@form" process="@form" onstart="dialogEspere.show()"
							oncomplete="dialogEspere.hide()" />
					</p:selectOneMenu>
					<h:outputText value="Carácter del evento:" />
					<p:selectOneMenu
						value="#{ManejadorCrearEditarMovilidadEvento.mde.caracterEvento}">
						<f:selectItem itemValue="" itemLabel="Seleccione una opción" />
						<f:selectItems
							value="#{ManejadorCrearEditarMovilidadEvento.caracterEventoItem}" />
						<p:ajax
							listener="#{ManejadorCrearEditarMovilidadEvento.definirInicio4049}"
							update="@form" process="@form" onstart="dialogEspere.show()"
							oncomplete="dialogEspere.hide()" />
					</p:selectOneMenu>



					<p:column
						rendered="#{not empty ManejadorCrearEditarMovilidadEvento.convActual.infoAdicionalFormulario}"
						style="vertical-align: top; padding-top:10px; width:250px;">
						<h:outputText value="Información adicional:"
							style="font-weight:bold;" />
					</p:column>

					<p:column
						rendered="#{not empty ManejadorCrearEditarMovilidadEvento.convActual.infoAdicionalFormulario}">
						<h:panelGroup layout="block"
							style="border:1px solid #7b1e3a; 
                             background:#fdecef; 
                             color:#4a0f1f; 
                             border-radius:8px; 
                             padding:10px;">
							<h:outputText
								value="#{ManejadorCrearEditarMovilidadEvento.convActual.infoAdicionalFormulario}"
								style="white-space:pre-line; font-weight:500;" escape="true" />
						</h:panelGroup>
					</p:column>

					<h:outputText
						rendered="#{ManejadorCrearEditarMovilidadEvento.fechaIncorrecta}" />
					<h:outputText
