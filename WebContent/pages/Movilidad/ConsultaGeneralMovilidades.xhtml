	<ui:define name="content">

			<t:div styleClass="contenido-titulo-general-myriad">Consultar movilidades registradas</t:div>
			<p:panel id="panelConsultaMovilidades">
				<p:panelGrid columns="3" styleClass="estilo-panelgrid-sinbordes"
					style="margin: auto;">
					<p:outputLabel for="idMovilidad" value="Id de la movilidad:" />
					<p:inputText id="idMovilidad" style="width: 100px;"
						value="#{manejadorBuscarReporteMovilidad.sCodigoMovilidad}"
						size="7">
						<f:validateDoubleRange minimum="0" maximum="100000" />
						<f:validateLength maximum="5" />
					</p:inputText>
					<p:commandButton update="@form"
						action="#{manejadorBuscarReporteMovilidad.buscarReporteMovilidad}"
						value="Buscar" icon="ui-icon-search" onstart="dialogEspere.show()"
						oncomplete="dialogEspere.hide()" />
				</p:panelGrid>
				<p:messages id="msgs" />
			</p:panel>
			<br />
			<p:panel id="panelImprimirMovilidades"
				header="Informacion movilidad encontrada"
				rendered="#{manejadorBuscarReporteMovilidad.imprimirReporteMovilidades}">
				<p:panelGrid columns="2" styleClass="estilo-panelgrid-sinbordes">
					<h:outputText value="Código:" style="font-weight: bold;" />
					<h:outputText
						value="#{manejadorBuscarReporteMovilidad.sCodigoMovilidad}" />
					<h:outputText value="Modalidad:" style="font-weight: bold;" />
					<h:outputText value="Apoyo a docentes en eventos en el extranjero"
						rendered="#{manejadorBuscarReporteMovilidad.habMovDE}" />
					<h:outputText value="Apoyo para la visita de extranjeros"
						rendered="#{manejadorBuscarReporteMovilidad.habilitarMovVE}" />
					<h:outputText
						value="Apoyo a estudiantes en eventos en el extranjero"
						rendered="#{manejadorBuscarReporteMovilidad.habMovEP}" />
					<h:outputText
						value="Apoyo a docentes para residencias artisticas en el extranjero"
						rendered="#{manejadorBuscarReporteMovilidad.habMovDA}" />
					<h:outputText value="Apoyo a visitantes extranjeros Artes"
						rendered="#{manejadorBuscarReporteMovilidad.habMovVA}" />
					<h:outputText
						value="Apoyo a estudiantes para residencias artisticas en el extranjero"
						rendered="#{manejadorBuscarReporteMovilidad.habMovEA}" />
					<h:outputText value="" />
					<h:commandLink value="Imprimir reporte" target="_blank"
						action="#{manejadorBuscarReporteMovilidad.imprimirReportesMovilidades}"
						ajax="false"
						style="text-decoration:none; 
									color: #16A8E2;
									font-weight: bold;" />
					<h:outputText value="Estado Movilidad:" style="font-weight: bold;" />
					<h:outputText
						value="#{manejadorBuscarReporteMovilidad.sEstadoMovilidad}" />
					<h:outputText value="Estado informe seguimiento:"
						rendered="#{!empty manejadorBuscarReporteMovilidad.estadoSeguimiento}"
						style="font-weight: bold;" />
					<h:outputText value="Ingresando"
						rendered="#{!empty manejadorBuscarReporteMovilidad.estadoSeguimiento  and 
									manejadorBuscarReporteMovilidad.estadoSeguimiento == 'P'}" />
					<h:outputText value="Registrado"
						rendered="#{!empty manejadorBuscarReporteMovilidad.estadoSeguimiento  and 
									manejadorBuscarReporteMovilidad.estadoSeguimiento == 'F'}" />
					<h:outputText value=""
						rendered="#{!empty manejadorBuscarReporteMovilidad.estadoRevisionSeguimiento}" />
					<h:outputText value="Revisado"
						rendered="#{manejadorBuscarReporteMovilidad.estadoRevisionSeguimiento == 'L'}" />
					<h:outputText value="Devuelto para correcciones"
						rendered="#{manejadorBuscarReporteMovilidad.estadoRevisionSeguimiento == 'D'}" />
					<h:outputText value=""
						rendered="#{manejadorBuscarReporteMovilidad.estadoSeguimiento == 'F' || manejadorBuscarReporteMovilidad.sEstadoMovilidad == 'Cancelada'}" />
					<h:commandLink value="Consultar informe de seguimiento"
						rendered="#{manejadorBuscarReporteMovilidad.estadoSeguimiento == 'F' || manejadorBuscarReporteMovilidad.sEstadoMovilidad == 'Cancelada'}"

						ajax="false"
						style="text-decoration:none; 
									color: #16A8E2;
									font-weight: bold;" />
					<h:outputText value=""
						rendered="#{manejadorBuscarReporteMovilidad.estadoRevisionSeguimiento == 'D'}" />
					<p:commandButton value="Consultar Motivos de Devolución"
						rendered="#{manejadorBuscarReporteMovilidad.estadoRevisionSeguimiento == 'D'}"
						action="#{manejadorBuscarReporteMovilidad.consultarDevolucion}"
						oncomplete="dialogComentarios.show();" update="@form" />
				</p:panelGrid>
				
<!-- 				listaArchivosMovilidadDE -->

					</p:column>
				</p:dataTable>

				<p:dataTable var="historico" id="historicoModalidadDataTable"
					value="#{manejadorBuscarReporteMovilidad.historicoMovilidad}"
					rendered="#{!empty manejadorBuscarReporteMovilidad.historicoMovilidad}"
					style="margin-top: 10px;" paginatorPosition="bottom"
