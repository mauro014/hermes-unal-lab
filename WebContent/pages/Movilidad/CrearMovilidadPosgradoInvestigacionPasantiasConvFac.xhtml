<?xml version='1.0' encoding='ISO-8859-1' ?>
<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:t="http://myfaces.apache.org/tomahawk"
	xmlns:s="http://myfaces.apache.org/sandbox"
	template="../../templates/common.xhtml">

	<ui:define name="content">
		<h:form id="formCrearMovilidadPosgradoInvestigacion"
			enctype="multipart/form-data" styleClass="estilo-panelgrid-sinbordes">
			<t:div styleClass="contenido-titulo-general-myriad" >Registro solicitud de movilidad</t:div>
			<p:panel header="Estudiantes de posgrado que participan en actividades de investigación">
				<p:panelGrid columns="3" id="identificacion" align="left">
					<t:div style="width: 247px;">
						<h:outputText value="Tipo de documento del docente UN"
							 />
					</t:div>
					<p:selectOneMenu
						value="#{ManejadorCrearEditarMovilidadPosgradoInvestigacionPasantias.tipoDocumento.id}" >
						<f:selectItems
							value="#{ManejadorCrearEditarMovilidadPosgradoInvestigacionPasantias.tipoDocumentoItem}" />
					</p:selectOneMenu>
					<h:outputText />

					<h:outputText value="Número de documento del docente UN"
						 />
					<p:inputText id="Numero"
						value="#{ManejadorCrearEditarMovilidadPosgradoInvestigacionPasantias.documento}"
						size="20">
					</p:inputText>
					<p:commandButton value="Continuar" icon="ui-icon-search"
						action="#{ManejadorCrearEditarMovilidadPosgradoInvestigacionPasantias.buscarPersona}"
						update="formCrearMovilidadPosgradoInvestigacion" />
				</p:panelGrid>
				<br/>
				<p:panelGrid columns="1" id="identificacionEstudiante"
					rendered="#{ManejadorCrearEditarMovilidadPosgradoInvestigacionPasantias.mostrarDatosEvento}">

					<p:panelGrid columns="3">
						<t:div style="width: 247px;">
							<h:outputText value="Tipo de documento del estudiante"
								 />
						</t:div>
						<p:selectOneMenu
							value="#{ManejadorCrearEditarMovilidadPosgradoInvestigacionPasantias.tipoDocumentoEstudiante.id}">
							<f:selectItems
								value="#{ManejadorCrearEditarMovilidadPosgradoInvestigacionPasantias.tipoDocumentoEstudianteItem}" />
						</p:selectOneMenu>
						<h:outputText />

						<h:outputText value="Número de documento del estudiante"
							 />
						<p:inputText id="NumeroEstudiante"
							value="#{ManejadorCrearEditarMovilidadPosgradoInvestigacionPasantias.documentoEstudiante}"
							size="20">
						</p:inputText>

						<p:commandButton value="Buscar" icon="ui-icon-search"
							action="#{ManejadorCrearEditarMovilidadPosgradoInvestigacionPasantias.buscarEstudiante}"
							update="formCrearMovilidadPosgradoInvestigacion" />
					</p:panelGrid>

					<p:panelGrid columns="2"
						rendered="#{ManejadorCrearEditarMovilidadPosgradoInvestigacionPasantias.mostrarDatosEstudiante}">
						
						<h:outputText value="Grupo de investigación" />
						<p:selectOneMenu id="somGrupo" style="width:330px;"
						panelStyle="width:330px;"
						value="#{ManejadorCrearEditarMovilidadPosgradoInvestigacionPasantias.idgrupo}">
							<f:selectItems
								value="#{ManejadorCrearEditarMovilidadPosgradoInvestigacionPasantias.listaGrupos}" />
						</p:selectOneMenu>

						<t:div style="width: 247px;">
							<h:outputText value="Nombre de Estudiante"
								 />
						</t:div>
						<h:outputText style="font-weight: bold;"
							value="#{ManejadorCrearEditarMovilidadPosgradoInvestigacionPasantias.nombreDocente}" />

						<h:outputText value="Documento de identidad"
							 />
						<h:outputText style="font-weight: bold;"
							value="#{ManejadorCrearEditarMovilidadPosgradoInvestigacionPasantias.documentoDocente}" />

						<h:outputText value="Facultad o instituto"
							 />
						<h:outputText style="font-weight: bold;"
							value="#{ManejadorCrearEditarMovilidadPosgradoInvestigacionPasantias.facultadDocente}" />
							<h:outputText value="Departamento"  />
						<h:outputText style="font-weight: bold;"
							value="#{ManejadorCrearEditarMovilidadPosgradoInvestigacionPasantias.departamentoDocente}" />
						<h:outputText value="Programa académico"
							 />
						<h:outputText style="font-weight: bold;"
							value="#{ManejadorCrearEditarMovilidadPosgradoInvestigacionPasantias.carreraDocente}" />
						<h:outputText value="Correo electónico:"  style="font-weight: bold;"
							 />
						<h:outputText  style="font-weight: bold;"
							value="#{ManejadorCrearEditarMovilidadPosgradoInvestigacionPasantias.correoDocente}" />

						

						<h:outputText
							rendered="#{ManejadorCrearEditarMovilidadPosgradoInvestigacionPasantias.BErrorPapa}" />
						<h:outputText
							value="#{ManejadorCrearEditarMovilidadPosgradoInvestigacionPasantias.errores[10]}"
							styleClass="mensajeerror"  style="font-weight: bold;"
							rendered="#{ManejadorCrearEditarMovilidadPosgradoInvestigacionPasantias.BErrorPapa}" />

						<t:div style="width: 247px;">
							<h:outputText
								value="Promedio aritmético ponderado acumulado PAPA"
								 />
						</t:div>
						<h:outputText  style="font-weight: bold;"
							value="#{ManejadorCrearEditarMovilidadPosgradoInvestigacionPasantias.papaEstudiante}" />
					</p:panelGrid>
				</p:panelGrid>

			</p:panel>

			<p:spacer height="20"
				rendered="#{ManejadorCrearEditarMovilidadPosgradoInvestigacionPasantias.mostrarDatosEstudiante}" />
			<p:panel header="Información de la pasantía de investigación"
				rendered="#{ManejadorCrearEditarMovilidadPosgradoInvestigacionPasantias.mostrarDatosEstudiante}">

				<p:panelGrid columns="2" id="evento">
				
					<t:div style="width: 247px;">
						<h:outputText value="Resumen de la pasantía (Máximo 3900 caracteres)" />
					</t:div>
					<p:inputTextarea id="resumenPonencia"
						value="#{ManejadorCrearEditarMovilidadPosgradoInvestigacionPasantias.resumenPonencia}"
						rows="9" cols="50" maxlength="3900">
					</p:inputTextarea>

					<h:outputText
						value="Continente en el cual realizará la pasantía" />
					<p:selectOneMenu
						value="#{ManejadorCrearEditarMovilidadPosgradoInvestigacionPasantias.idContinente}">
						<f:selectItems id="continente"
							value="#{ManejadorCrearEditarMovilidadPosgradoInvestigacionPasantias.continentes}" />
						<p:ajax update="continente,pais" 
							listener="#{ManejadorCrearEditarMovilidadPosgradoInvestigacionPasantias.cargarPaises}" />
					</p:selectOneMenu>
					<h:outputText value="País donde se realizará la pasantía"/>
					<p:selectOneMenu id="pais"
						value="#{ManejadorCrearEditarMovilidadPosgradoInvestigacionPasantias.idPais}">
						<f:selectItems
							value="#{ManejadorCrearEditarMovilidadPosgradoInvestigacionPasantias.paises}" />
					</p:selectOneMenu>

					<h:outputText
						rendered="#{ManejadorCrearEditarMovilidadPosgradoInvestigacionPasantias.BErrorCiudad}" />
					<h:outputText
						value="#{ManejadorCrearEditarMovilidadPosgradoInvestigacionPasantias.errores[4]}"
						styleClass="mensajeerror"
						rendered="#{ManejadorCrearEditarMovilidadPosgradoInvestigacionPasantias.BErrorCiudad}" />

					<h:outputText value="Ciudad donde se realizará la pasantía"
						 />
					<p:inputText id="Ciudad"
						value="#{ManejadorCrearEditarMovilidadPosgradoInvestigacionPasantias.ciudadEvento}"
						size="40" styleClass="labels_proyecto" maxlength="200">
					</p:inputText>

					<t:div style="width: 247px;">
						<h:outputText value="Universidad o entidad extranjera donde va a realizar la pasantía de investigación"/>
					</t:div>
					<p:inputText id="univ1"
						value="#{ManejadorCrearEditarMovilidadPosgradoInvestigacionPasantias.universidad}"
						size="40" styleClass="labels_proyecto">
					</p:inputText>

					<h:outputText
						rendered="#{ManejadorCrearEditarMovilidadPosgradoInvestigacionPasantias.fechaIncorrecta}" />
					<h:outputText maxlength="900"
						value="La fecha del viaje debe ser superior que la fecha actual mas 20 días calendario."
						styleClass="mensajeerror"
						rendered="#{ManejadorCrearEditarMovilidadPosgradoInvestigacionPasantias.fechaIncorrecta}" />

					<h:outputText value="Fecha de inicio del viaje"
						 />
					<p:calendar id="fechainicio" pages="1" locale="es"
						navigator="true"
						readonlyInput="true" pattern="dd/MM/yyyy"
						value="#{ManejadorCrearEditarMovilidadPosgradoInvestigacionPasantias.fechaInicioEvento}"
						mindate="#{ManejadorCrearEditarMovilidadPosgradoInvestigacionPasantias.fechaMinimaInicio}"
						valueChangeListener="#{ManejadorCrearEditarMovilidadPosgradoInvestigacionPasantias.validarFecha}">
						<p:ajax event="dateSelect" process="@all"
							update="formCrearMovilidadPosgradoInvestigacion" />
					</p:calendar>

					<h:outputText
						rendered="#{ManejadorCrearEditarMovilidadPosgradoInvestigacionPasantias.fechaIncorrecta2}" />
					<h:outputText
						value="La fecha de finalización viaje no es válida. La fecha debe ser superior a la fecha de inicio mas 30 días."
						styleClass="mensajeerror"
						rendered="#{ManejadorCrearEditarMovilidadPosgradoInvestigacionPasantias.fechaIncorrecta2}" />

					<h:outputText value="Fecha de finalización del viaje"
						rendered="#{ManejadorCrearEditarMovilidadPosgradoInvestigacionPasantias.panelMasDatos}" />
					<p:calendar id="fechafin" pages="1" locale="es"
						readonlyInput="true" pattern="dd/MM/yyyy"
						navigator="true"
						value="#{ManejadorCrearEditarMovilidadPosgradoInvestigacionPasantias.fechaFinEvento}"
						mindate="#{ManejadorCrearEditarMovilidadPosgradoInvestigacionPasantias.fechaInicioEvento}"
						valueChangeListener="#{ManejadorCrearEditarMovilidadPosgradoInvestigacionPasantias.validarFechaLlegada}"
						rendered="#{ManejadorCrearEditarMovilidadPosgradoInvestigacionPasantias.panelMasDatos}">
						<p:ajax event="dateSelect" process="@all"
							update="formCrearMovilidadPosgradoInvestigacion" />
					</p:calendar>

				</p:panelGrid>
			</p:panel>

			<p:spacer height="20"
				rendered="#{ManejadorCrearEditarMovilidadPosgradoInvestigacionPasantias.panelMasDatos2}" />
			<p:panel header="Apoyo Financiero"
				rendered="#{ManejadorCrearEditarMovilidadPosgradoInvestigacionPasantias.panelMasDatos2}">
				<p:panelGrid columns="2" id="panelMasDatos2">

					<h:outputText value="Medio de transporte" />
					<p:selectOneMenu
						value="#{ManejadorCrearEditarMovilidadPosgradoInvestigacionPasantias.medioTransporte}">
						<f:selectItems
							value="#{ManejadorCrearEditarMovilidadPosgradoInvestigacionPasantias.medioTransporteItem}" />
					</p:selectOneMenu>
					
					<h:outputText />
					<p:message for="valorTiquetes" styleClass="mensajeerror"
						showDetail="true" showSummary="true" />

					<h:outputText value="Valor del tiquete (en pesos colombianos)"
						 />
					<p:inputText id="valorTiquetes"
						value="#{ManejadorCrearEditarMovilidadPosgradoInvestigacionPasantias.costoTiquetes}">
						<f:converter converterId="ConvertidorLong" />
					</p:inputText>
					
					<t:div style="width: 247px;">
						<h:outputText value="Valor del alojamiento y transporte local (en pesos colombianos)"
						  rendered = "#{ManejadorCrearEditarMovilidadPosgradoInvestigacionPasantias.mostrarValorViaticos}"/>
					</t:div>
					<p:inputText id="valorAlojamiento"
						value="#{ManejadorCrearEditarMovilidadPosgradoInvestigacionPasantias.costoInscripcion}" rendered = "#{ManejadorCrearEditarMovilidadPosgradoInvestigacionPasantias.mostrarValorViaticos}">
						<f:converter converterId="ConvertidorLong" />
					</p:inputText>
					
					<t:div style="width: 247px;"
						rendered="#{ManejadorCrearEditarMovilidadPosgradoInvestigacionPasantias.mostrarAportesOtrasDependencias}">
						<h:outputText
							value="Valor del apoyo de otras dependencias" />
					</t:div>
					<p:inputText id="valorApOtDep"
						value="#{ManejadorCrearEditarMovilidadPosgradoInvestigacionPasantias.valorAporteOtrasDep}"
						rendered="#{ManejadorCrearEditarMovilidadPosgradoInvestigacionPasantias.mostrarAportesOtrasDependencias}">
						<f:converter converterId="ConvertidorLong" />
					</p:inputText>
					
					<t:div style="width: 247px;"
						rendered="#{ManejadorCrearEditarMovilidadPosgradoInvestigacionPasantias.mostrarAportesOtrasDependencias}">
						<h:outputText
							value="Nombre de las dependencias" />
					</t:div>

					<p:inputTextarea id="depApOtDep"
						value="#{ManejadorCrearEditarMovilidadPosgradoInvestigacionPasantias.depValorAporteOtrasDep}"
						rendered="#{ManejadorCrearEditarMovilidadPosgradoInvestigacionPasantias.mostrarAportesOtrasDependencias}"
						rows="9" cols="50" maxlength="3900">
					</p:inputTextarea>

					
				</p:panelGrid>
				
			</p:panel>	

			<p:spacer height="20"
				rendered="#{ManejadorCrearEditarMovilidadPosgradoInvestigacionPasantias.panelMasDatos2}" />

			<h:outputText
				rendered="#{ManejadorCrearEditarMovilidadPosgradoInvestigacionPasantias.BErrorDocumentos}" />
			<h:outputText
				value="#{ManejadorCrearEditarMovilidadPosgradoInvestigacionPasantias.errores[11]}"
				styleClass="mensajeerror"
				rendered="#{ManejadorCrearEditarMovilidadPosgradoInvestigacionPasantias.BErrorDocumentos}" />

			<p:panel header="Documentos Obligatorios" id="panelDocumentos"
				rendered="#{ManejadorCrearEditarMovilidadPosgradoInvestigacionPasantias.panelMasDatos2}">
				<center>
					<p:panelGrid columns="2">
						<h:outputText value="Tipos de documentos"
							 />
						<p:selectOneMenu
							value="#{ManejadorCrearEditarMovilidadPosgradoInvestigacionPasantias.tipoDocumentoSel}">
							<f:selectItems
								value="#{ManejadorCrearEditarMovilidadPosgradoInvestigacionPasantias.tipoDocumentoSelItem}" />
							<p:ajax update="panelDocumentos"
								listener="#{ManejadorCrearEditarMovilidadPosgradoInvestigacionPasantias.seleccionarTipoDocumento}" />
						</p:selectOneMenu>

						<h:outputText />
					</p:panelGrid>
				</center>

				<p:fileUpload id="myFileId11" label="Adjuntar" auto="true"
					mode="advanced" showButtons="false"
					style="width: 100%;"
					update="tablaArchivos, panelDocumentos"
					fileUploadListener="#{ManejadorCrearEditarMovilidadPosgradoInvestigacionPasantias.guardarArchivoMovEP}"
					disabled="#{!ManejadorCrearEditarMovilidadPosgradoInvestigacionPasantias.puedeSubirArchivos}">
				</p:fileUpload>
				<center>
					<p:dataTable var="archivoResumen1" style="width:100%" id="tablaArchivos"
						value="#{ManejadorCrearEditarMovilidadPosgradoInvestigacionPasantias.listaArchivosObligatoriosSel}"
						emptyMessage="No existen archivos.">
						<p:column>
							<f:facet name="header">
								<h:outputText value="Nombre documento" />
							</f:facet>
							<h:outputText value="#{archivoResumen1.tipoArchivo.nombre}" />
						</p:column>
						<p:column>
							<f:facet name="header">
								<h:outputText value="Archivo Cargado" />
							</f:facet>
							<h:outputText value="#{archivoResumen1.nombre}" />
						</p:column>
						<p:column>
							<f:facet name="header">
								<h:outputText value="Eliminar" />
							</f:facet>
							<p:commandButton icon="ui-icon-trash"
								action="#{ManejadorCrearEditarMovilidadPosgradoInvestigacionPasantias.eliminarArchivoObligatorio}"
								update=":formCrearMovilidadPosgradoInvestigacion"
								onclick="if(!confirm('Esta seguro de eliminar el archivo?'))return false">
								<f:setPropertyActionListener value="#{archivoResumen1}"
									target="#{ManejadorCrearEditarMovilidadPosgradoInvestigacionPasantias.archivoMovilidadEPSeleccionado}" />
							</p:commandButton>
						</p:column>
						<p:column>
							<f:facet name="header">
								<h:outputText value="Descargar" />
							</f:facet>
	
							<p:commandButton id="descargar"
								action="#{ManejadorCrearEditarMovilidadPosgradoInvestigacionPasantias.descargarArchivoMovEP}"
								icon="ui-icon-arrowthickstop-1-s" title="Descargar archivo"
								ajax="false">
								<f:setPropertyActionListener value="#{archivoResumen1}"
									target="#{ManejadorCrearEditarMovilidadPosgradoInvestigacionPasantias.documentoSeleccionado}" />
							</p:commandButton>
						</p:column>
					</p:dataTable>
				</center>
			</p:panel>

			<center>
				<h:outputText
					value="#{ManejadorCrearEditarMovilidadPosgradoInvestigacionPasantias.noExiste}"
					styleClass="mensajeerror"
					rendered="#{ManejadorCrearEditarMovilidadPosgradoInvestigacionPasantias.panelNoExiste}" />

				<h:outputText
					value="#{ManejadorCrearEditarMovilidadPosgradoInvestigacionPasantias.noExiste1}"
					styleClass="mensajeerror"
					rendered="#{ManejadorCrearEditarMovilidadPosgradoInvestigacionPasantias.panelNoExiste}" />
			</center>

			<p:messages id="msg" autoUpdate="true" closable="true"
				redisplay="false" />

			<p:spacer height="20"
				rendered="#{ManejadorCrearEditarMovilidadPosgradoInvestigacionPasantias.panelMasDatos2}" />
			<center>
				<p:commandButton value="Guardar y enviar" icon="ui-icon-check"
					action="#{ManejadorCrearEditarMovilidadPosgradoInvestigacionPasantias.guardar}"
					rendered="#{ManejadorCrearEditarMovilidadPosgradoInvestigacionPasantias.panelMasDatos2}"
					update="formCrearMovilidadPosgradoInvestigacion"
					onstart="dialogEspere.show()" oncomplete="dialogEspere.hide()" />
			</center>

			<p:dialog header="Por favor espere..." widgetVar="dialogEspere"
				resizable="false" closable="false" modal="true">
				<p:graphicImage value="/images/ajaxloading.gif" />
			</p:dialog>

		</h:form>
	</ui:define>
</ui:composition>
