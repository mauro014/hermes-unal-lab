<?xml version='1.0' encoding='ISO-8859-1' ?>
<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:t="http://myfaces.apache.org/tomahawk"
	xmlns:s="http://myfaces.apache.org/sandbox"
	template="../../templates/common.xhtml">
	<ui:define name="content">
		<h:form>
			<t:div styleClass="contenido-titulo-general-myriad">Aval pendientes - Otras Dependencias</t:div>
			<br />
			<p:dataTable var="aval"
				value="#{manejadorRectoriaAvales.listaAvalesPendientes}"
				emptyMessage="No existen avales pendientes de revisión."
				paginator="true" rows="5">
				<f:facet name="header">
					<h:outputText
						value="Han sido encontrados #{manejadorRectoriaAvales.tamañoListaPendientes} avales pendientes de revisión." />
				</f:facet>
				<p:column style="font-size:11px;">
					<f:facet name="header">
						<h:outputText value="Tipo - Código" />
					</f:facet>
					<h:outputText value="#{aval.nombreTipo} - #{aval.aviId}" />
				</p:column>
				<p:column style="font-size:11px; width:16%;">
					<f:facet name="header">
						<h:outputText value="Título" />
					</f:facet>
					<h:outputText value="#{aval.aviTitulo}" />
				</p:column>
				<p:column style="font-size:11px; width:14%;">
					<f:facet name="header">
						<h:outputText value="Profesor" />
					</f:facet>
					<h:outputText value="#{aval.nombreInvestigador}" />
				</p:column>
				<p:column style="font-size:11px; width:14%;">
					<f:facet name="header">
						<h:outputText value="Sede" />
					</f:facet>
					<h:outputText value="#{aval.evento}" />
				</p:column>
				<p:column style="font-size:11px; width:14%;">
					<f:facet name="header">
						<h:outputText value="Facultad" />
					</f:facet>
					<h:outputText value="#{aval.nombreFacultad}" />
				</p:column>
				<p:column style="font-size:11px; width:14%;">
					<f:facet name="header">
						<h:outputText value="Estado" />
					</f:facet>
					<h:outputText value="#{aval.nombreEstado}" />
				</p:column>
				<p:column style="font-size:11px; width:14%;">
					<f:facet name="header">
						<h:outputText value="Fecha" />
					</f:facet>
					<h:outputText value="#{aval.fecha}" />
				</p:column>
			</p:dataTable>
		</h:form>
	</ui:define>
</ui:composition>
