								style="font-weight: bold" />

								value="#{ManejadorFormularioRegistroFuncytca.temp.duracion}"
								size="4" />
							<h:outputText value="" />

							<p:commandButton value="Adicionar"
								update="tablaActividadesEstancia"
								actionListener="#{ManejadorFormularioRegistroFuncytca.adicionarActividadEstancia}"
								ajax="false" onstart="dialogEspere.show()"
								oncomplete="dialogEspere.hide()">
							</p:commandButton>
						</p:panelGrid>

						<p:dataTable var="actividadMovilidad"
							id="tablaActividadesEstancia"
							value="#{ManejadorFormularioRegistroFuncytca.listaActividadesEstancia}"
							emptyMessage="No existen actividades.">
							<p:column>
								<f:facet name="header">
									<h:outputText value="Tipo" />
								</f:facet>
								<h:outputText value="#{actividadMovilidad.nomCursoEvento}" />
							</p:column>

							<p:column>
								<f:facet name="header">
									<h:outputText value="Descripción" />
								</f:facet>
								<t:div style="width: 350px;">
									<h:outputText value="#{actividadMovilidad.descripcion}" />
								</t:div>
							</p:column>

							<p:column>
								<f:facet name="header">
									<h:outputText value="Duración" />
								</f:facet>
								<h:outputText value="#{actividadMovilidad.duracion}" />
							</p:column>

							<p:column>
								<f:facet name="header">
									<h:outputText value="Fecha" />
									<br />
									<h:outputText value="de inicio" />
								</f:facet>
								<h:outputText value="#{actividadMovilidad.fecha}" />
							</p:column>


							<p:column>
								<f:facet name="header">
									<h:outputText value="Eliminar" />
								</f:facet>
								<p:commandButton icon="ui-icon-trash" ajax="false"
									update="@parent"
									action="#{ManejadorFormularioRegistroFuncytca.eliminarActividadEstancia}"
									onclick="if(!confirm('Esta seguro de eliminar la Actividad?'))return false">
									<f:setPropertyActionListener value="#{actividadMovilidad}"
										target="#{ManejadorFormularioRegistroFuncytca.actividadMovilidadVESeleccionada}" />
								</p:commandButton>
							</p:column>

						</p:dataTable>

					</p:panelGrid>

					<br />
					<br />

					<h:panelGroup
						rendered="#{ManejadorFormularioRegistroFuncytca.mostrarBotones}">
						<center>
							<h:panelGrid columns="3">

								<p:commandButton value="Guardar y continuar"
									id="botonContinuarEst" rendered="true"
									action="#{ManejadorFormularioRegistroFuncytca.guardarGeneral}"
									styleClass="ui-priority-primary" />
								<p:commandButton value="Guardar y continuar después"
									id="botonSalirEst" rendered="true"
									action="#{ManejadorFormularioRegistroFuncytca.salirGuardarGeneral}"
									styleClass="ui-priority-primary"
									onclick="if(!confirm('Su información se ha guardado, recuerde que puede ingresar nuevamente con su clave para terminar el registro'))return false" />
								<p:commandButton value="guardar y enviar"
									id="botonGuardarProponerEst" rendered="true"
									action="#{ManejadorFormularioRegistroFuncytca.guardarFinalizar}"
									styleClass="ui-priority-primary"
									onclick="if(!confirm('Está seguro de enviar la información final para la aplicación de la convocatoria, está ya no podrá modificarse'))return false" />

							</h:panelGrid>
						</center>
					</h:panelGroup>
				</p:tab>
				<p:tab title="Adjuntar documentos">

					<br />
					<div>
						<span>
							<center>Aquí puede adjuntar los archivos requeridos en
								la convocatoria. Recuerde que el tamaño máximo permitido de los
								archivos es de 2MB.</center>
						</span>
					</div>
					<br />

					<h:panelGrid id="subirArchivos" columns="2" border="0"
						cellspacing="5" align="center">

						<h:outputText value="Tipo de Archivo:" />
						<p:selectOneMenu
							value="#{ManejadorFormularioRegistroFuncytca.tipoArchivo.id}"
							style="width:400px">
							<f:selectItems
								value="#{ManejadorFormularioRegistroFuncytca.tipoArchivoItem}" />
						</p:selectOneMenu>

						<h:outputText value="Archivo: " />
						<p:fileUpload
							value="#{ManejadorFormularioRegistroFuncytca.archivo}"
							mode="simple" />

						<h:outputText />
						<p:commandButton value="Adjuntar Archivo" ajax="false"
							actionListener="#{ManejadorFormularioRegistroFuncytca.insertarArchivo}" />


					</h:panelGrid>

					<br />

					<p:dataTable var="archivoResumen"
						value="#{ManejadorFormularioRegistroFuncytca.listaArchivos}"
						cellpadding="1" cellspacing="8" align="center" border="1"
						emptyMessage=""
						rendered="#{not empty ManejadorFormularioRegistroFuncytca.listaArchivos}"
						id="tabla-archivo">

						<p:column>
							<f:facet name="header">
								<h:outputText value="Tipo Archivo" />
							</f:facet>
							<h:outputText value=" #{archivoResumen.tipoArchivo.nombre}" />
						</p:column>

						<p:column>
							<f:facet name="header">
								<h:outputText value="Nombre del archivo" />
							</f:facet>
							<h:outputText value=" #{archivoResumen.nombre}" />
						</p:column>

						<p:column>
							<f:facet name="header">
								<h:outputText value="Descargar" />
							</f:facet>
							<center>
								<p:commandButton
									action="#{ManejadorFormularioRegistroFuncytca.descargarArchivo}"
									icon="ui-icon-arrowthickstop-1-s" title="Descargar archivo"
									ajax="false">
									<f:setPropertyActionListener value="#{archivoResumen}"
										target="#{ManejadorFormularioRegistroFuncytca.archivoSeleccionado}" />
								</p:commandButton>
							</center>
						</p:column>

						<p:column>
							<f:facet name="header">
								<h:outputText value="Eliminar" />
							</f:facet>
							<center>
								<p:commandButton
									action="#{ManejadorFormularioRegistroFuncytca.eliminarArchivo}"
									icon="ui-icon-trash" title="Eliminar archivo" ajax="false"
									onclick="if(!confirm('¿Esta seguro de eliminar este archivo?, esta acción no puede deshacerse'))return false">
									<f:setPropertyActionListener value="#{archivoResumen}"
										target="#{ManejadorFormularioRegistroFuncytca.archivoSeleccionado}" />
								</p:commandButton>
							</center>
						</p:column>

					</p:dataTable>
					<br />
					<div>
						<span>
							<center>Recuerde verificar que se encuentran cargados
								todos los documentos necesarios para la participación en esta
								convocatoria.</center>
						</span>
					</div>
					<br />
					<br />

					<h:panelGroup
						rendered="#{ManejadorFormularioRegistroFuncytca.mostrarBotones}">
						<center>
							<h:panelGrid columns="3">

								<p:commandButton value="Guardar y continuar"
									id="botonContinuarArc" rendered="true"
									action="#{ManejadorFormularioRegistroFuncytca.guardarGeneral}"
									styleClass="ui-priority-primary" />
								<p:commandButton value="Guardar y continuar después"
									id="botonSalirArc" rendered="true"
									action="#{ManejadorFormularioRegistroFuncytca.salirGuardarGeneral}"
									styleClass="ui-priority-primary"
									onclick="if(!confirm('Su información se ha guardado, recuerde que puede ingresar nuevamente con su clave para terminar el registro'))return false" />
								<p:commandButton value="guardar y enviar"
									id="botonGuardarProponerArc" rendered="true"
									action="#{ManejadorFormularioRegistroFuncytca.guardarFinalizar}"
									styleClass="ui-priority-primary"
									onclick="if(!confirm('Está seguro de enviar la información final para la aplicación de la convocatoria, está ya no podrá modificarse'))return false" />

							</h:panelGrid>
						</center>
					</h:panelGroup>
				</p:tab>


			</p:tabView>

			

			<br />
			<p:messages id="msgs" autoUpdate="true" closable="true" />
			<br />

			<br />
			<br />

			<t:div styleClass="logo-pequeño-principal">
				<a href="#{facesContext.externalContext.requestContextPath}/"> <img
					src="#{facesContext.externalContext.requestContextPath}/images/her-general/logo_hermes1.png" />
				</a>
			</t:div>


			<p:dialog widgetVar="dialogEspere" resizable="false" closable="false"
				modal="true">
				<p:graphicImage value="/images/ajaxloading.gif" />
							Por favor espere...
			</p:dialog>
		</h:form>
	</ui:define>
</ui:composition>
