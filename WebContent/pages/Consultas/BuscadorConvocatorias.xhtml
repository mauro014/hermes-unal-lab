<?xml version='1.0' encoding='ISO-8859-1' ?>
<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:t="http://myfaces.apache.org/tomahawk"
	xmlns:s="http://myfaces.apache.org/sandbox"
	template="../principal/PlantillaUnalVacia.xhtml">
	<head>
<title>Laboratorios UN</title>
	</head>
	<ui:define name="content">
		<style type="text/css">
.paraFlechita .ui-selectonemenu .ui-selectonemenu-trigger .ui-icon {
	border: none;
}

.informacion-resultado-buscador a {
	font-size: 13px;
}

.etiqueta-proyecto-investigacion {
	background: #144b73 !important;
	width: 72px !important;
	height: 18px !important;
	border-radius: 10px !important;
	font-size: 12px !important;
	color: #e5e5e5 !important;
	font-weight: normal;
}

.etiqueta-proyecto-extension {
	background: #ff7341 !important;
	width: 72px !important;
	height: 18px !important;
	border-radius: 10px !important;
	font-size: 12px !important;
	color: #323232 !important;
	font-weight: normal;
}

.ui-selectcheckboxmenu-panel .ui-selectcheckboxmenu-list-item label {
	font-weight: normal;
}
</style>
		<f:metadata>
			<f:event type="preRenderView"
				listener="#{ManejadorBusqueda.refrescar}" />
		</f:metadata>
		<h:form>
			<t:div id="panelTitulo" style="text-align: center; width: 100%;">
				<h:panelGrid columns="1" styleClass="estilo-panelgrid-sinbordes1"
					style="width: 100%;">
					<t:div styleClass="contendido-titulo-principal"
						style="margin-bottom: 30px;">
						<t:div style="text-align: center;"
							styleClass="contenido-titulo-general-myriad-3">
							Búsqueda Convocatorias
					    </t:div>
						<t:div styleClass="logo-pequeño-principal"
							style="text-align: right;">
							<a href="#{facesContext.externalContext.requestContextPath}/">
								<img
								src="#{facesContext.externalContext.requestContextPath}/images/her-general/logo_hermes1.png" />
							</a>
						</t:div>
					</t:div>
				</h:panelGrid>
			</t:div>
			<t:div styleClass="panel-buscar-principal-docentes"
				id="panel-buscador-ppal">
				<p:panelGrid columns="3" styleClass="estilo-panelgrid-sinbordes1"
					style="margin:auto;">
					<h:inputText id="campo" value="#{ManejadorBusqueda.campoBusqueda}"
						styleClass="campo-buscador-nombre2" />
					<p:watermark for="campo"
						value="Ingrese todo o parte del nombre de la convocatoria" />
					<p:commandButton action="#{ManejadorBusqueda.buscarConvocatorias}"
						styleClass="boton_buscar_principal" value="" update="@form"
						onstart="dialogEspere.show()" oncomplete="dialogEspere.hide()"
						ajax="false" />
				</p:panelGrid>
			</t:div>
			<t:div
				style="padding-top: 30px; padding-left:130px; padding-right:128px;"
				id="toltip-principal">
				<h:outputLink id="grow" value="#">
					<img
						src="#{facesContext.externalContext.requestContextPath}/images/her-pagina-principal/informacion.png" />
				</h:outputLink>
				<p:tooltip for="grow" styleClass="tooltip-message" showDelay="999">
					<t:div style="text-align: left;">
				         En <b>Búsqueda avanzada</b> puede filtrar su búsqueda agregando <br /> 
						uno o varios filtros. Para eliminar un filtro haga click nuevamente <br /> 
						sobre el filtro que previamente seleccionó.   
					</t:div>
				</p:tooltip>
				<t:div style="float:right; padding-top:10px;">

					<img
						src="#{facesContext.externalContext.requestContextPath}/images/her-buscadores/flecha_reiniciar.png" />

					<p:commandLink
						style="text-decoration:underline; 
								color: #16A8E2;
								font-weight: bold;
								padding-left:2px;
								padding-right:10px;"
						value="Reiniciar búsqueda"
						action="#{ManejadorBusqueda.reiniciarBusqueda}" update="@form"
						ajax="false">
					</p:commandLink>

				</t:div>
			</t:div>
			<t:div styleClass="paraFlechita">
				<p:growl id="growl" showDetail="true" />

				<t:div id="busquedaAvanzada" styleClass="avanzadaDivD"
					style="width:630px !important;">

					<p:accordionPanel toggleSpeed="500">

						<p:tab title="Búsqueda avanzada" styleClass="tabAvanzada"
							style="font-weight:bold;">

							<t:div id="opcionesFiltrosConvocatorias"
								styleClass="botonesFiltros">
								<p:commandButton
									rendered="#{!ManejadorBusqueda.mostrarAgregarSede and !ManejadorBusqueda.mostrarAgregarFacultad and empty ManejadorBusqueda.listaSedesFiltro}"
									value="" id="sedeConvocatoria"
									action="#{ManejadorBusqueda.cargarNuevaSede}"
									styleClass="boton-sede-nacional-over"
									update="filtrosConvocatorias,@(.botonesFiltros)" />
								<p:commandButton
									rendered="#{ManejadorBusqueda.mostrarAgregarSede or ManejadorBusqueda.mostrarAgregarFacultad or not empty ManejadorBusqueda.listaSedesFiltro}"
									value="" id="sedeConvocatoria2"
									action="#{ManejadorBusqueda.cargarNuevaSede}"
									styleClass="boton-sede-nacional"
									update="filtrosConvocatorias,@(.botonesFiltros)" />

								<p:commandButton
									rendered="#{!ManejadorBusqueda.mostrarAgregarFacultad and empty ManejadorBusqueda.listaFacultadesFiltro}"
									value="" id="facultadConvocatoria"
									styleClass="boton-facultad-over"
									action="#{ManejadorBusqueda.cargarNuevaFacultad}"
									update="filtrosConvocatorias,@(.botonesFiltros)" />
								<p:commandButton
									rendered="#{ManejadorBusqueda.mostrarAgregarFacultad or not empty ManejadorBusqueda.listaFacultadesFiltro}"
									value="" id="facultadIConvocatoria2"
									styleClass="boton-facultad"
									action="#{ManejadorBusqueda.cargarNuevaFacultad}"
									update="filtrosConvocatorias,@(.botonesFiltros)" />

								<p:commandButton
									rendered="#{!ManejadorBusqueda.mostrarAgregarEntidad and empty ManejadorBusqueda.listaEntidadesFiltro}"
									value="" id="entidadConvocatoria"
									styleClass="boton-entidad-over"
									action="#{ManejadorBusqueda.cargarNuevaEntidad}"
									update="filtrosConvocatorias,@(.botonesFiltros)" />
								<p:commandButton
									rendered="#{ManejadorBusqueda.mostrarAgregarEntidad or not empty ManejadorBusqueda.listaEntidadesFiltro}"
									value="" id="entidadConvocatoria2" styleClass="boton-entidad"
									action="#{ManejadorBusqueda.cargarNuevaEntidad}"
									update="filtrosConvocatorias,@(.botonesFiltros)" />

								<p:commandButton
									rendered="#{!ManejadorBusqueda.mostrarAgregarEstado and empty ManejadorBusqueda.listaEstadosFiltro}"
									value="" id="estadoConvocatoria" styleClass="boton-estado-over"
									action="#{ManejadorBusqueda.cargarNuevoEstado}"
									update="filtrosConvocatorias,@(.botonesFiltros)" />
								<p:commandButton
									rendered="#{ManejadorBusqueda.mostrarAgregarEstado or not empty ManejadorBusqueda.listaEstadosFiltro}"
									value="" id="estadoConvocatoria2" styleClass="boton-estado"
									action="#{ManejadorBusqueda.cargarNuevoEstado}"
									update="filtrosConvocatorias,@(.botonesFiltros)" />

							</t:div>

							<t:div id="divFiltrosConvocatorias">
								<p:panelGrid styleClass="estilo-panelgrid-sinbordes1"
									id="filtrosConvocatorias">
									<p:row>
										<p:column style="width:200px;" styleClass="color-columnas">
											<t:div
												rendered="#{not empty ManejadorBusqueda.listaSedesFiltro}"
												style="margin-left:5px;">
									Sede
								</t:div>
										</p:column>
										<p:column style="max-width:430px;" styleClass="color-columnas">
											<t:div
												rendered="#{not empty ManejadorBusqueda.listaSedesFiltro}"
												styleClass="campo-filtros-usados">
												<p:dataList var="sede"
													value="#{ManejadorBusqueda.listaSedesFiltro}">
													<t:div style="float: left;">
														<h:commandButton
															action="#{ManejadorBusqueda.eliminarSede}" value=""
															styleClass="boton-cerrar-gris">
															<f:setPropertyActionListener value="#{sede}"
																target="#{ManejadorBusqueda.sedeSeleccionada}" />
														</h:commandButton>
													</t:div>
													<h:outputText value="#{sede.nombre}" />
												</p:dataList>
											</t:div>
										</p:column>
									</p:row>
									<p:row>
										<p:column styleClass="color-columnas">
											<t:div
												rendered="#{not empty ManejadorBusqueda.listaFacultadesFiltro}"
												style="margin-left:5px;">
									Facultad
								</t:div>
										</p:column>
										<p:column styleClass="color-columnas">
											<t:div
												rendered="#{not empty ManejadorBusqueda.listaFacultadesFiltro}"
												styleClass="campo-filtros-usados">
												<p:dataList var="facultad"
													value="#{ManejadorBusqueda.listaFacultadesFiltro}">
													<t:div style="float: left;">
														<h:commandButton
															action="#{ManejadorBusqueda.eliminarFacultad}" value=""
															styleClass="boton-cerrar-gris">
															<f:setPropertyActionListener value="#{facultad}"
																target="#{ManejadorBusqueda.facultadSeleccionada}" />
														</h:commandButton>
													</t:div>
													<h:outputText value="#{facultad.nombre}" />
												</p:dataList>
											</t:div>
										</p:column>
									</p:row>
									<p:row>
										<p:column styleClass="color-columnas">
											<t:div
												rendered="#{not empty ManejadorBusqueda.listaEstadosFiltro}"
												style="margin-left:5px;">
									Estado
								</t:div>
										</p:column>
										<p:column styleClass="color-columnas">
											<t:div
												rendered="#{not empty ManejadorBusqueda.listaEstadosFiltro}"
												styleClass="campo-filtros-usados">
												<p:dataList var="estado"
													value="#{ManejadorBusqueda.listaEstadosFiltro}">
													<t:div style="float: left;">
														<h:commandButton
															action="#{ManejadorBusqueda.eliminarEstado}" value=""
															styleClass="boton-cerrar-gris">
															<f:setPropertyActionListener value="#{estado}"
																target="#{ManejadorBusqueda.estadoSeleccionado}" />
														</h:commandButton>
													</t:div>
													<h:outputText value="#{estado}" />
												</p:dataList>
											</t:div>
										</p:column>
									</p:row>
									<p:row>
										<p:column styleClass="color-columnas">
											<t:div
												rendered="#{not empty ManejadorBusqueda.listaEntidadesFiltro}"
												style="margin-left:5px;">
									Entidad
								</t:div>
										</p:column>
										<p:column styleClass="color-columnas">
											<t:div
												rendered="#{not empty ManejadorBusqueda.listaEntidadesFiltro}"
												styleClass="campo-filtros-usados">
												<p:dataList var="entidad"
													value="#{ManejadorBusqueda.listaEntidadesFiltro}">
													<t:div style="float: left;">
														<h:commandButton
															action="#{ManejadorBusqueda.eliminarEntidad}" value=""
															styleClass="boton-cerrar-gris">
															<f:setPropertyActionListener value="#{entidad}"
																target="#{ManejadorBusqueda.entidadSeleccionada}" />
														</h:commandButton>
													</t:div>
													<h:outputText value="#{entidad.descripcion}" />
												</p:dataList>
											</t:div>
										</p:column>
									</p:row>
									<p:row>
										<p:column styleClass="color-columnas">
											<t:div
												rendered="#{ManejadorBusqueda.mostrarAgregarFacultad or ManejadorBusqueda.mostrarAgregarSede}"
												style="margin-left:5px;">
												<h:outputText value="Agregar sede:"
													rendered="#{ManejadorBusqueda.mostrarAgregarSede}" />
												<h:outputText value="Seleccione sede:"
													rendered="#{ManejadorBusqueda.mostrarAgregarFacultad}" />
											</t:div>
										</p:column>
										<p:column styleClass="color-columnas">
											<t:div styleClass="paraBorde"
												rendered="#{ManejadorBusqueda.mostrarAgregarFacultad or ManejadorBusqueda.mostrarAgregarSede}">
												<p:selectOneMenu style="width:440px;"
													id="opcionFacultadInvestigador1"
													value="#{ManejadorBusqueda.sedeAgregar}"
													disabled="#{not empty ManejadorBusqueda.listaSedesFiltro}">
													<f:selectItems value="#{ManejadorBusqueda.listaSedesItem}" />
													<f:selectItem itemLabel="Nivel nacional" itemValue="1" />
													<p:ajax update="selectFacultad"
														listener="#{ManejadorBusqueda.cargarFacultadesSede}" />
												</p:selectOneMenu>
											</t:div>
										</p:column>
									</p:row>
									<p:row>
										<p:column styleClass="color-columnas">
											<t:div rendered="#{ManejadorBusqueda.mostrarAgregarFacultad}"
												style="margin-left:5px;">
												<h:outputText value="Agregar facultad:" />
											</t:div>
										</p:column>
										<p:column styleClass="color-columnas">
											<t:div styleClass="paraBorde"
												rendered="#{ManejadorBusqueda.mostrarAgregarFacultad}">
												<p:selectOneMenu style="width:440px;" id="selectFacultad"
													value="#{ManejadorBusqueda.facultadAgregar}"
													disabled="#{not empty ManejadorBusqueda.listaFacultadesFiltro}">
													<f:selectItems
														value="#{ManejadorBusqueda.listaFacultadesItem}" />
												</p:selectOneMenu>
											</t:div>
										</p:column>
									</p:row>
									<p:row>
										<p:column styleClass="color-columnas">
											<t:div rendered="#{ManejadorBusqueda.mostrarAgregarEstado}"
												style="margin-left:5px;">
												<h:outputText value="Estado:" />
											</t:div>
										</p:column>
										<p:column styleClass="color-columnas">
											<t:div styleClass="paraBorde">
												<t:div rendered="#{ManejadorBusqueda.mostrarAgregarEstado}">

													<p:selectOneMenu style="width:440px;" id="selectEstado"
														value="#{ManejadorBusqueda.estadoAgregar}"
														disabled="#{not empty ManejadorBusqueda.listaEstadosFiltro}">
														<f:selectItems value="#{ManejadorBusqueda.estadoItem}" />
													</p:selectOneMenu>
												</t:div>

											</t:div>
										</p:column>
									</p:row>
									<p:row>
										<p:column styleClass="color-columnas">
											<t:div rendered="#{ManejadorBusqueda.mostrarAgregarEntidad}"
												style="margin-left:5px;">
												<h:outputText value="Entidad:" />
											</t:div>
										</p:column>
										<p:column styleClass="color-columnas">
											<t:div>
												<t:div rendered="#{ManejadorBusqueda.mostrarAgregarEntidad}">

													<p:selectOneMenu style="width:440px;" id="selectEntidad"
														value="#{ManejadorBusqueda.entidadAgregar}"
														disabled="#{not empty ManejadorBusqueda.listaEntidadesFiltro}"
														panelStyle="width: 420px;" filter="true"
														filterMatchMode="contains">
														<f:selectItems
															value="#{ManejadorBusqueda.listaEntidadesItem}" />
													</p:selectOneMenu>
												</t:div>

											</t:div>
										</p:column>
									</p:row>
									<p:row>
										<p:column colspan="2" styleClass="color-columnas">
											<t:div
												rendered="#{ManejadorBusqueda.mostrarAgregarSede or ManejadorBusqueda.mostrarAgregarFacultad or ManejadorBusqueda.mostrarAgregarEstado or ManejadorBusqueda.mostrarAgregarEntidad}">
												<p:commandButton
													action="#{ManejadorBusqueda.buscarConvocatorias}"
													styleClass="boton_agregar" value="" update="@form"
													onstart="dialogEspere.show()"
													oncomplete="dialogEspere.hide()" ajax="false" />
											</t:div>
										</p:column>
									</p:row>
								</p:panelGrid>
							</t:div>
						</p:tab>
					</p:accordionPanel>

				</t:div>
			</t:div>

			<t:div>
				<t:div style="width:600px; margin:auto; margin-left: 3px;"
					id="resultados-buscador"
					rendered="#{ManejadorBusqueda.banderaResultadosBusqueda and ManejadorBusqueda.mostrarResultadosConvocatorias}">
					<t:div styleClass="informacion-titulo-buscador">
						<h:outputText value="Resultados " />
					</t:div>
					<t:div styleClass="informacion-resultado-buscador"
						style="border-bottom: none; color: #464646; padding-bottom: 0px; padding-top: 3px;">
						<t:outputText
							value="Se han encontrado #{ManejadorBusqueda.resultadosConvocatorias} registros" />
					</t:div>
					<t:div styleClass="panel-buscador">
						<br />
						<p:dataList id="tablaResultadoConvocatorias"
							value="#{ManejadorBusqueda.listaConvocatorias}"
							var="convocatoria" rows="8" type="none"
							paginatorTemplate=" {FirstPageLink} {PreviousPageLink} {PageLinks} {NextPageLink} {LastPageLink} "
							paginator="true" paginatorPosition="bottom"
							paginatorAlwaysVisible="false">
							<t:div styleClass="informacion-resultado-buscador"
								style="width:640px !important;">
								<t:outputText rendered="#{convocatoria.tipo == 'I'}"
									value=" Interna " styleClass="etiqueta-proyecto-investigacion"
									style="font-style: italic; padding:3px; margin-right: 8px; padding-left: 10px; padding-right: 5px;" />
								<t:outputText rendered="#{convocatoria.tipo == 'E'}"
									value=" Externa " styleClass="etiqueta-proyecto-extension"
									style="font-style: italic; padding:3px; margin-right: 8px; padding-left: 10px; padding-right: 5px;" />

								<p:commandLink rendered="#{convocatoria.vinculo==null}"
									action="#{ManejadorBusqueda.consultarPaginaConvocatoria}"
									value="#{convocatoria.nombre}">
									<f:setPropertyActionListener value="#{convocatoria}"
										target="#{ManejadorBusqueda.convocatoriaSeleccionada}" />
								</p:commandLink>
								<h:commandLink rendered="#{convocatoria.vinculo!=null}"
									value="#{convocatoria.nombre}" ajax="false"
									target="_popUpWindow"
									onclick="javascript: void window.open('', '_popUpWindow', 'status=0,toolbar=0,location=0,menubar=0,resizable,width=630,height=630,scrollbars,left=0,top=0');"
									action="#{ManejadorBusqueda.consultarPaginaConvocatoria}">
									<f:setPropertyActionListener value="#{convocatoria}"
										target="#{ManejadorBusqueda.convocatoriaSeleccionada}" />
								</h:commandLink>
								<br />
								<t:outputText rendered="#{convocatoria.tipo == 'I'}"
									value="#{convocatoria.entidad.descripcion} | #{convocatoria.estado} " />
								<t:outputText rendered="#{convocatoria.tipo == 'E'}"
									value="Número: #{convocatoria.numero} | #{convocatoria.entidad.descripcion} | #{convocatoria.estado} " />
							</t:div>
						</p:dataList>
					</t:div>
				</t:div>
			</t:div>

			<t:div styleClass="final-contenedor-informacion" />

			<p:dialog widgetVar="dialogEspere" resizable="false" closable="false"
				modal="true">
				<p:graphicImage value="/images/ajaxloading.gif" />
							Por favor espere...
			</p:dialog>
		</h:form>
	</ui:define>
</ui:composition>
