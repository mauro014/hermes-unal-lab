<?xml version='1.0' encoding='ISO-8859-1' ?>
<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:t="http://myfaces.apache.org/tomahawk"
	xmlns:s="http://myfaces.apache.org/sandbox"
	template="../principal/PlantillaUnalVacia.xhtml">
	<ui:define name="content">
		<f:metadata>
			<f:event type="preRenderView"
				listener="#{ManejadorBusqueda.refrescar}" />
		</f:metadata>
		<h:form>
			<t:div id="panelTitulo" style="text-align: center; width: 100%;">
				<h:panelGrid columns="1" styleClass="estilo-panelgrid-sinbordes1"
					style="width: 100%;">
					<t:div styleClass="contendido-titulo-principal"
						style="margin-bottom: 30px;">
						<t:div style="text-align: center;"
							styleClass="contenido-titulo-general-myriad-3">
							Búsqueda Investigadores
					    </t:div>
						<t:div styleClass="logo-pequeño-principal"
							style="text-align: right;">
							<a href="#{facesContext.externalContext.requestContextPath}/">
								<img
								src="#{facesContext.externalContext.requestContextPath}/images/her-general/logo_hermes1.png" />
							</a>
						</t:div>
					</t:div>
				</h:panelGrid>
			</t:div>
			<t:div styleClass="panel-buscar-principal-docentes"
				id="panel-buscador-ppal">
				<p:panelGrid columns="3" styleClass="estilo-panelgrid-sinbordes1"
					style="margin:auto;">
					<h:inputText id="campo" value="#{ManejadorBusqueda.campoBusqueda}"
						styleClass="campo-buscador-nombre2">
						<p:ajax event="keyup" update="busquedaAvanzada" />
					</h:inputText>
					<p:watermark for="campo"
						value="Ingrese todo o parte del nombre del investigador que desea consultar" />
					<p:commandButton action="#{ManejadorBusqueda.buscarInvestigadores}"
						styleClass="boton_buscar_principal" value="" update="@form"
						onstart="dialogEspere.show()" oncomplete="dialogEspere.hide()" />
				</p:panelGrid>
			</t:div>
			<t:div
				style="padding-top: 30px; padding-left:130px; padding-right:128px;"
				id="toltip-principal">
				<h:outputLink id="grow" value="#">
					<img
						src="#{facesContext.externalContext.requestContextPath}/images/her-pagina-principal/informacion.png" />
				</h:outputLink>
				<p:tooltip for="grow" styleClass="tooltip-message" showDelay="999">
					<t:div style="text-align: left;">
				         En <b>Búsqueda avanzada</b> puede filtrar su búsqueda agregando <br /> 
						uno o varios filtros. Para eliminar un filtro haga click nuevamente <br /> 
						sobre el filtro que previamente seleccionó.   
					</t:div>
				</p:tooltip>
				<t:div style="float:right; padding-top:10px;">
					<img
						src="#{facesContext.externalContext.requestContextPath}/images/her-buscadores/flecha_reiniciar.png" />
					<p:commandLink
						style="text-decoration:underline; 
								color: #16A8E2;
								font-weight: bold;
								padding-left:2px;
								padding-right:10px;"
						value="Reiniciar búsqueda"
						action="#{ManejadorBusqueda.reiniciarBusqueda}" update="@form">
					</p:commandLink>
				</t:div>
			</t:div>
			<t:div styleClass="paraFlechita">
				<p:growl id="growl" showDetail="true" />
				<t:div id="busquedaAvanzada" styleClass="avanzadaDivD">
					<p:accordionPanel toggleSpeed="500">
						<p:tab title="Búsqueda avanzada" styleClass="tabAvanzada">
							<t:div styleClass="busqueda-exacta"
								rendered="#{ManejadorBusqueda.campoBusqueda!=null and ManejadorBusqueda.campoBusqueda!=''}">
								<p:panelGrid styleClass="estilo-panelgrid-sinbordes">
									<p:row>
										<p:column style="background: #F1F3F3;">
											<p:selectBooleanCheckbox
												value="#{ManejadorBusqueda.nombreExacto}">
												<p:ajax update="@form"
													listener="#{ManejadorBusqueda.controlCoincidenciaNombre}"
													process="@form" />
											</p:selectBooleanCheckbox>
										</p:column>
										<p:column style="background: #F1F3F3;">
											<h:outputText
												value="¿Desea buscar la coincidencia del texto únicamente en los nombres y apellidos del investigador? " />
										</p:column>

									</p:row>
								</p:panelGrid>
								<br />
							</t:div>
							<t:div styleClass="busqueda-exacta"
								rendered="#{ManejadorBusqueda.campoBusqueda!=null and ManejadorBusqueda.campoBusqueda!=''}">
								<p:panelGrid styleClass="estilo-panelgrid-sinbordes">
									<p:row>
										<p:column style="background: #F1F3F3;">
											<p:selectBooleanCheckbox
												value="#{ManejadorBusqueda.nombreExacto2}">
												<p:ajax update="@form"
													listener="#{ManejadorBusqueda.controlCoincidenciaArea}"
													process="@form" />
											</p:selectBooleanCheckbox>
										</p:column>
										<p:column style="background: #F1F3F3;">
											<h:outputText
												value="¿Desea buscar la coincidencia del texto únicamente en las áreas de conocimiento del investigador? " />
										</p:column>

									</p:row>
								</p:panelGrid>
								<br />
							</t:div>
							<t:div id="opcionesFiltrosInvestigador"
								styleClass="botonesFiltros">
								<p:commandButton
									rendered="#{!ManejadorBusqueda.mostrarAgregarSede and !ManejadorBusqueda.mostrarAgregarFacultad and empty ManejadorBusqueda.listaSedesFiltro}"
									value="" id="sedeInvestigador"
									action="#{ManejadorBusqueda.cargarNuevaSede}"
									styleClass="boton-sede-over"
									update="filtroInvestigador,@(.botonesFiltros)" />
								<p:commandButton
									rendered="#{ManejadorBusqueda.mostrarAgregarSede or ManejadorBusqueda.mostrarAgregarFacultad or not empty ManejadorBusqueda.listaSedesFiltro}"
									value="" id="sedeInvestigador2"
									action="#{ManejadorBusqueda.cargarNuevaSede}"
									styleClass="boton-sede"
									update="filtroInvestigador,@(.botonesFiltros)" />

								<p:commandButton
									rendered="#{!ManejadorBusqueda.mostrarAgregarFacultad and empty ManejadorBusqueda.listaFacultadesFiltro}"
									value="" id="facultadInvestigador"
									styleClass="boton-facultad-over"
									action="#{ManejadorBusqueda.cargarNuevaFacultad}"
									update="filtroInvestigador,@(.botonesFiltros)" />
								<p:commandButton
									rendered="#{ManejadorBusqueda.mostrarAgregarFacultad or not empty ManejadorBusqueda.listaFacultadesFiltro}"
									value="" id="facultadInvestigador2" styleClass="boton-facultad"
									action="#{ManejadorBusqueda.cargarNuevaFacultad}"
									update="filtroInvestigador,@(.botonesFiltros)" />

								<p:commandButton
									rendered="#{!ManejadorBusqueda.mostrarAgregarArea and empty ManejadorBusqueda.listaAreasFiltro}"
									value="" id="areaInvestigador" styleClass="boton-area-over"
									action="#{ManejadorBusqueda.cargarNuevaArea}"
									update="filtroInvestigador,@(.botonesFiltros)" />
								<p:commandButton
									rendered="#{ManejadorBusqueda.mostrarAgregarArea or not empty ManejadorBusqueda.listaAreasFiltro}"
									value="" id="areaInvestigador2" styleClass="boton-area"
									action="#{ManejadorBusqueda.cargarNuevaArea}"
									update="filtroInvestigador,@(.botonesFiltros)" />
							</t:div>
							<t:div id="divFiltrosInvestigador">
								<p:panelGrid styleClass="estilo-panelgrid-sinbordes1"
									id="filtroInvestigador">
									<p:row>
										<p:column style="width:200px;" styleClass="color-columnas">
											<t:div
												rendered="#{not empty ManejadorBusqueda.listaSedesFiltro}"
												style="margin-left:5px;">
									Sede
								</t:div>
										</p:column>
										<p:column style="max-width:430px;" styleClass="color-columnas">
											<t:div
												rendered="#{not empty ManejadorBusqueda.listaSedesFiltro}"
												styleClass="campo-filtros-usados">
												<p:dataList var="sede"
													value="#{ManejadorBusqueda.listaSedesFiltro}">
													<t:div style="float: left;">
														<h:commandButton
															action="#{ManejadorBusqueda.eliminarSede}" value=""
															styleClass="boton-cerrar-gris">
															<f:setPropertyActionListener value="#{sede}"
																target="#{ManejadorBusqueda.sedeSeleccionada}" />
														</h:commandButton>
													</t:div>
													<h:outputText value="#{sede.nombre}" />
												</p:dataList>
											</t:div>
										</p:column>
									</p:row>
									<p:row>
										<p:column styleClass="color-columnas">
											<t:div
												rendered="#{not empty ManejadorBusqueda.listaFacultadesFiltro}"
												style="margin-left:5px;">
									Facultad
								</t:div>
										</p:column>
										<p:column styleClass="color-columnas">
											<t:div
												rendered="#{not empty ManejadorBusqueda.listaFacultadesFiltro}"
												styleClass="campo-filtros-usados">
												<p:dataList var="facultad"
													value="#{ManejadorBusqueda.listaFacultadesFiltro}">
													<t:div style="float: left;">
														<h:commandButton
															action="#{ManejadorBusqueda.eliminarFacultad}" value=""
															styleClass="boton-cerrar-gris">
															<f:setPropertyActionListener value="#{facultad}"
																target="#{ManejadorBusqueda.facultadSeleccionada}" />
														</h:commandButton>
													</t:div>
													<h:outputText value="#{facultad.nombre}" />
												</p:dataList>
											</t:div>
										</p:column>
									</p:row>
									<p:row>
										<p:column styleClass="color-columnas">
											<t:div
												rendered="#{not empty ManejadorBusqueda.listaAreasFiltro}"
												style="margin-left:5px;">
									Áreas de conocimiento
								</t:div>
										</p:column>
										<p:column styleClass="color-columnas">
											<t:div
												rendered="#{not empty ManejadorBusqueda.listaAreasFiltro}"
												styleClass="campo-filtros-usados">
												<p:dataList var="area"
													value="#{ManejadorBusqueda.listaAreasFiltro}">
													<t:div style="float: left;">
														<h:commandButton
															action="#{ManejadorBusqueda.eliminarArea}" value=""
															styleClass="boton-cerrar-gris">
															<f:setPropertyActionListener value="#{area}"
																target="#{ManejadorBusqueda.areaSeleccionada}" />
														</h:commandButton>
													</t:div>
													<h:outputText value="#{area}" />
												</p:dataList>
											</t:div>
										</p:column>
									</p:row>
									<p:row>
										<p:column styleClass="color-columnas">
											<t:div
												rendered="#{ManejadorBusqueda.mostrarAgregarFacultad or ManejadorBusqueda.mostrarAgregarSede}"
												style="margin-left:5px;">
												<h:outputText value="Agregar sede:"
													rendered="#{ManejadorBusqueda.mostrarAgregarSede}" />
												<h:outputText value="Seleccione sede:"
													rendered="#{ManejadorBusqueda.mostrarAgregarFacultad}" />
											</t:div>
										</p:column>
										<p:column styleClass="color-columnas">
											<t:div
												rendered="#{ManejadorBusqueda.mostrarAgregarFacultad or ManejadorBusqueda.mostrarAgregarSede}">
												<p:selectOneMenu style="width:430px;"
													id="opcionFacultadInvestigador1"
													value="#{ManejadorBusqueda.sedeAgregar}"
													disabled="#{not empty ManejadorBusqueda.listaSedesFiltro}">
													<f:selectItems value="#{ManejadorBusqueda.listaSedesItem}" />
													<p:ajax update="selectFacultad"
														listener="#{ManejadorBusqueda.cargarFacultadesSede}" />
												</p:selectOneMenu>
											</t:div>
										</p:column>
									</p:row>
									<p:row>
										<p:column styleClass="color-columnas">
											<t:div rendered="#{ManejadorBusqueda.mostrarAgregarFacultad}"
												style="margin-left:5px;">
												<h:outputText value="Agregar facultad:" />
											</t:div>
										</p:column>
										<p:column styleClass="color-columnas">
											<t:div rendered="#{ManejadorBusqueda.mostrarAgregarFacultad}">
												<p:selectOneMenu style="width:430px;" id="selectFacultad"
													filter="true" filterMatchMode="contains"
													value="#{ManejadorBusqueda.facultadAgregar}"
													disabled="#{not empty ManejadorBusqueda.listaFacultadesFiltro}">
													<f:selectItems
														value="#{ManejadorBusqueda.listaFacultadesItem}" />
												</p:selectOneMenu>
											</t:div>
										</p:column>
									</p:row>
									<p:row>
										<p:column styleClass="color-columnas">
											<t:div rendered="#{ManejadorBusqueda.mostrarAgregarArea}"
												style="margin-left:5px;">
												<h:outputText value="Agregar área de conocimiento:" />
											</t:div>
										</p:column>
										<p:column styleClass="color-columnas">
											<t:div styleClass="paraBorde">
												<t:div rendered="#{ManejadorBusqueda.mostrarAgregarArea}">
													<p:autoComplete minQueryLength="3" style="width:440px;"
														value="#{ManejadorBusqueda.areaAgregar}"
														completeMethod="#{ManejadorBusqueda.obtenerPalabraClaves}"
														size="30" panelStyle="width: 440px;" scrollHeight="100" />
												</t:div>
											</t:div>
										</p:column>
									</p:row>
									<p:row>
										<p:column colspan="2" styleClass="color-columnas">
											<t:div
												rendered="#{ManejadorBusqueda.mostrarAgregarSede or ManejadorBusqueda.mostrarAgregarFacultad or ManejadorBusqueda.mostrarAgregarArea}">
												<p:commandButton action="#{ManejadorBusqueda.buscar}"
													styleClass="boton_agregar" value="" update="@form"
													onstart="dialogEspere.show()"
													oncomplete="dialogEspere.hide()" />
											</t:div>
										</p:column>
									</p:row>
								</p:panelGrid>
							</t:div>
						</p:tab>
					</p:accordionPanel>
				</t:div>
			</t:div>
			<t:div>
				<t:div style="width:700px; margin:auto;" id="resultados-buscador"
					rendered="#{ManejadorBusqueda.banderaResultadosBusqueda}">
					<t:div styleClass="informacion-titulo-buscador">
						<h:outputText value="Resultados " />
					</t:div>
					<t:div styleClass="informacion-resultado-buscador"
						rendered="#{ManejadorBusqueda.mostrarResultadosInvestigador}"
						style="color: #464646; padding-bottom: 0px; padding-top: 3px; border-bottom: 1px solid #DCDCDC;">
						<t:outputText
							value="Se han encontrado #{ManejadorBusqueda.resultadosInvestigadores} registros" />
						<t:div style="text-align:right; float:right;"
							rendered="#{ManejadorBusqueda.mostrarResultadosInvestigador}">
							<img
								src="#{facesContext.externalContext.requestContextPath}/images/her-paginas/icono_pdf.png"
								style="border: none; width: 18px; margin-right: 5px;" />
							<h:commandLink value="Descargar resultados de búsqueda"
								ajax="false"
								style="text-decoration:underline; 
								color: #16A8E2;
								font-weight: bold;
								padding-left:2px;"
								target="_popUpWindow"
								onclick="javascript: void window.open('', '_popUpWindow', 'status=0,toolbar=0,location=0,directories=0,menubar=0,resizable,width=750,height=500,scrollbars,left=0,top=0');"
								action="#{ManejadorBusqueda.reporteInvestigadores}">
							</h:commandLink>
						</t:div>
						<t:div styleClass="panel-buscador">
							<p:dataList id="tablaResultadoInvestigadores"
								rendered="#{ManejadorBusqueda.mostrarResultadosInvestigador}"
								value="#{ManejadorBusqueda.listaPersonas}" var="persona"
								rows="8" type="none"
								paginatorTemplate=" {FirstPageLink} {PreviousPageLink} {PageLinks} {NextPageLink} {LastPageLink} "
								paginator="true" paginatorPosition="bottom"
								paginatorAlwaysVisible="false" style="">
								<t:div styleClass="informacion-resultado-buscador">
									<p:commandLink
										action="#{ManejadorBusqueda.consultarPaginaInvestigador}"
										value="#{persona.nombreCompleto}" ajax="false">
										<f:setPropertyActionListener value="#{persona}"
											target="#{ManejadorBusqueda.personaSeleccionada}" />
									</p:commandLink>
									<br />
									<h:outputText value="#{persona.direccion}" /> | Sede <h:outputText
										value="#{persona.edad}" />
								</t:div>
							</p:dataList>
						</t:div>
					</t:div>
				</t:div>
			</t:div>
			<t:div styleClass="panel-inicio-docentes"
				rendered="#{!ManejadorBusqueda.banderaResultadosBusqueda}" />
			<p:dialog widgetVar="dialogEspere" resizable="false" closable="false"
				modal="true">
				<p:graphicImage value="/images/ajaxloading.gif" />
							Por favor espere...
			</p:dialog>
		</h:form>
	</ui:define>
</ui:composition>
