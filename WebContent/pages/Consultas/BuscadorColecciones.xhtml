<?xml version='1.0' encoding='ISO-8859-1' ?>
<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:t="http://myfaces.apache.org/tomahawk"
	xmlns:s="http://myfaces.apache.org/sandbox"
	template="../principal/PlantillaColecciones.xhtml">
	<ui:define name="content">
		<h:form>
		<style type="text/css">
		.menu li a
		{
		font-family: "Ancizar sans", Tahoma, Geneva, sans-serif;
		}

	</style>
			<t:div id="panelTitulo" style="text-align: center; width: 100%;">
				<h:panelGrid columns="1" styleClass="estilo-panelgrid-sinbordes1" 
					style="width: 100%;"	
					rendered="#{!manejadorBuscadorColecciones.banderaResultadosBusqueda}">
					<t:div styleClass="contendido-titulo-principal" style="margin-bottom: 30px;">			
						<t:div styleClass="contenido-titulo-general-myriad-3-colecciones">
							Búsqueda colecciones
					    </t:div>
						<t:div styleClass="logo-pequeño-principal-colecciones">
							<a href="#{facesContext.externalContext.requestContextPath}">
								<img src="../../images/colecciones/logo_1.png"/>
							</a>					
						</t:div>
				    </t:div>
				</h:panelGrid>
				<h:panelGrid columns="1" styleClass="estilo-panelgrid-sinbordes1" rendered="#{manejadorBuscadorColecciones.banderaResultadosBusqueda}"
					style="width: 100%;"	>	
					<t:div styleClass="contendido-titulo-principal" style="margin-bottom: 30px;">			
						<t:div styleClass="contenido-titulo-general-myriad-3-colecciones">
							Búsqueda colecciones
					    </t:div>
						<t:div styleClass="logo-pequeño-principal-colecciones">
							<a href="#{facesContext.externalContext.requestContextPath}">
								<img src="../../images/colecciones/logo_1.png"/>
							</a>					
						</t:div>
				    </t:div>	
				</h:panelGrid>
			</t:div>
			<t:div styleClass="panel-buscar-principal-colecciones"
				id="panel-buscador-ppal">
				<p:panelGrid columns="3" styleClass="estilo-panelgrid-sinbordes1" style="margin:auto;">
					<h:inputText id="campo" value="#{manejadorBuscadorColecciones.campoBusqueda}" styleClass="campo-buscador-nombre2" />
					<p:watermark for="campo"
						value="Ingrese todo o parte del nombre" />
					<p:commandButton action="#{manejadorBuscadorColecciones.buscar}" styleClass="boton_buscar_principal_colecciones" value="" update="@form"/>
				</p:panelGrid>
			</t:div>
			<t:div style="padding-top: 30px;" id="toltip-principal"  >
				<h:outputLink id="grow" value="#">  
			    	<img src="#{facesContext.externalContext.requestContextPath}/images/colecciones/info.png" />
			    </h:outputLink>
			    <p:tooltip for="grow" styleClass="tooltip-message-colecciones" showDelay="999" >  
			    	<t:div style="text-align: left;" >
				         En <b>Búsqueda avanzada</b> puede filtrar su búsqueda agregando <br /> 
						uno o varios filtros. Para eliminar un filtro haga click nuevamente <br /> 
						sobre el filtro que previamente seleccionó.   
					</t:div>
			    </p:tooltip> 
			     <t:div style="float:right; padding-top:10px;">
			    
			    <img src="#{facesContext.externalContext.requestContextPath}/images/her-buscadores/flecha_reiniciar_mutis.png" />
			    
			    <p:commandLink style="text-decoration:underline; 
								color: #00AB51;
								font-weight: bold;
								padding-left:2px;
								padding-right:10px;" 
								value="Reiniciar búsqueda"
								action="#{manejadorBuscadorColecciones.reiniciarBusqueda}"
								update="@form" >  
			    </p:commandLink>
			    </t:div>  
		    </t:div>
		    <t:div styleClass="paraFlechita">
			<p:growl id="growl" showDetail="true" />
			
			<t:div id="busquedaAvanzada" styleClass="avanzadaDivC">

				<p:accordionPanel toggleSpeed="500" >
			 
					<p:tab title="Búsqueda avanzada" styleClass="tabAvanzada" style="font-weight:bold;">
			 		
				<t:div id="opcionesFiltrosInvestigador"  styleClass="botonesFiltros">
							<p:commandButton rendered="#{!manejadorBuscadorColecciones.mostrarAgregarSede and !manejadorBuscadorColecciones.mostrarAgregarFacultad and empty manejadorBuscadorColecciones.listaSedesFiltro}" styleClass="boton-sede-colecciones-over" value="" id="sedeColeccion" action="#{manejadorBuscadorColecciones.cargarNuevaSede}" update="filtroColecciones,filtroColecciones2,@(.botonesFiltros)"/>
							<p:commandButton rendered="#{manejadorBuscadorColecciones.mostrarAgregarSede or manejadorBuscadorColecciones.mostrarAgregarFacultad or not empty manejadorBuscadorColecciones.listaSedesFiltro}" styleClass="boton-sede-colecciones" value="" id="sedeColeccion2" action="#{manejadorBuscadorColecciones.cargarNuevaSede}" update="filtroColecciones,filtroColecciones2,@(.botonesFiltros)"/>
							<p:commandButton rendered="#{!manejadorBuscadorColecciones.mostrarAgregarFacultad and empty manejadorBuscadorColecciones.listaFacultadesFiltro}" styleClass="boton-facultad-colecciones-over" value="" id="facultadColeccion" action="#{manejadorBuscadorColecciones.cargarNuevaFacultad}" update="filtroColecciones,filtroColecciones2,@(.botonesFiltros)"/>
							<p:commandButton rendered="#{manejadorBuscadorColecciones.mostrarAgregarFacultad or not empty manejadorBuscadorColecciones.listaFacultadesFiltro}" styleClass="boton-facultad-colecciones" value="" id="facultadColeccion2" action="#{manejadorBuscadorColecciones.cargarNuevaFacultad}" update="filtroColecciones,filtroColecciones2,@(.botonesFiltros)"/>
							<p:commandButton rendered="#{!manejadorBuscadorColecciones.mostrarAgregarTipoColeccion and empty manejadorBuscadorColecciones.listaTiposColeccionesFiltro}" styleClass="boton-tipo-colecciones-over" value="" id="tipoColeccion" action="#{manejadorBuscadorColecciones.cargarNuevoTipoColeccion}" update="filtroColecciones,filtroColecciones2,@(.botonesFiltros)" />
							<p:commandButton rendered="#{manejadorBuscadorColecciones.mostrarAgregarTipoColeccion or not empty manejadorBuscadorColecciones.listaTiposColeccionesFiltro}" styleClass="boton-tipo-colecciones" value="" id="tipoColeccion2" action="#{manejadorBuscadorColecciones.cargarNuevoTipoColeccion}" update="filtroColecciones,filtroColecciones2,@(.botonesFiltros)" />
						</t:div>
			
						<t:div id="divFiltrosInvestigador">
							<p:panelGrid styleClass="estilo-panelgrid-buscadores-selects-col" id="filtroColecciones" columnClasses="'',columna-etiquetas-buscador">
								<p:row style="background:#F1F3F3 !important;">
								<p:column styleClass="color-columnas" style="width:170px;"><t:div rendered="#{not empty manejadorBuscadorColecciones.listaSedesFiltro}" style="margin-left:5px;">
									Sede
								</t:div>
								</p:column>
								<p:column style="max-width:450px;" styleClass="color-columnas">
								<t:div rendered="#{not empty manejadorBuscadorColecciones.listaSedesFiltro}" styleClass="campo-filtros-usados-colecciones" >
									<p:dataList var="sede" value="#{manejadorBuscadorColecciones.listaSedesFiltro}">
											<t:div style="float: left;">
												<h:commandButton action="#{manejadorBuscadorColecciones.eliminarSede}" value="" styleClass="boton-cerrar-gris" >
													<f:setPropertyActionListener value="#{sede}" target="#{manejadorBuscadorColecciones.sedeSeleccionada}" />
												</h:commandButton>
											</t:div>
											<h:outputText value="#{sede.nombre}" />
									</p:dataList>
								</t:div>
								</p:column>
								</p:row>
								<p:row style="background:#F1F3F3 !important;">
								<p:column style="width:170px;" styleClass="color-columnas"><t:div rendered="#{not empty manejadorBuscadorColecciones.listaFacultadesFiltro}" style="margin-left:5px;">
									Facultad
								</t:div>
								</p:column>
								<p:column styleClass="color-columnas">
								<t:div rendered="#{not empty manejadorBuscadorColecciones.listaFacultadesFiltro}" styleClass="campo-filtros-usados-colecciones" >
									<p:dataList var="facultad" value="#{manejadorBuscadorColecciones.listaFacultadesFiltro}">
											<t:div style="float: left;">
												<h:commandButton action="#{manejadorBuscadorColecciones.eliminarFacultad}" value="" styleClass="boton-cerrar-gris" >
													<f:setPropertyActionListener value="#{facultad}" target="#{manejadorBuscadorColecciones.facultadSeleccionada}" />
												</h:commandButton>
											</t:div>
											<h:outputText value="#{facultad.nombre}" />
									</p:dataList>
								</t:div>
								</p:column>
								</p:row>
								<p:row style="background:#F1F3F3 !important;">
								<p:column styleClass="color-columnas">
								<t:div rendered="#{not empty manejadorBuscadorColecciones.listaTiposColeccionesFiltro}" style="margin-left:5px;">
									Tipo de Colección
								</t:div>
								</p:column>
								<p:column styleClass="color-columnas">
								<t:div rendered="#{not empty manejadorBuscadorColecciones.listaTiposColeccionesFiltro}" styleClass="campo-filtros-usados-colecciones" >
									<p:dataList var="tipoColeccion" value="#{manejadorBuscadorColecciones.listaTiposColeccionesFiltro}">
											<t:div style="float: left;">
												<h:commandButton action="#{manejadorBuscadorColecciones.eliminarTipoColeccion}" value="" styleClass="boton-cerrar-gris" >
													<f:setPropertyActionListener value="#{tipoColeccion}" target="#{manejadorBuscadorColecciones.tipoColeccionSeleccionado}" />
												</h:commandButton>
											</t:div>
											<h:outputText value="#{tipoColeccion.descripcion}" />
									</p:dataList>
								</t:div>
								</p:column>
								</p:row>
								</p:panelGrid>
								<p:panelGrid styleClass="estilo-panelgrid-buscadores-selects-col" id="filtroColecciones2" columnClasses="'',columna-etiquetas-buscador">								
								<p:row style="background:#F1F3F3 !important;">
								<p:column style="width:170px;" styleClass="color-columnas">
								<t:div rendered="#{manejadorBuscadorColecciones.mostrarAgregarFacultad or manejadorBuscadorColecciones.mostrarAgregarSede}" style="margin-left:5px;">
									<h:outputText value="Agregar sede:" rendered="#{manejadorBuscadorColecciones.mostrarAgregarSede}"/> 
									<h:outputText value="Seleccione sede:" rendered="#{manejadorBuscadorColecciones.mostrarAgregarFacultad}"/> 
								</t:div>
								</p:column>
								<p:column style="max-width:450px;" styleClass="color-columnas">
								<t:div rendered="#{manejadorBuscadorColecciones.mostrarAgregarFacultad or manejadorBuscadorColecciones.mostrarAgregarSede}">
									<p:selectOneMenu styleClass="select-item-buscador" style="width:440px; height:24px;" id="opcionFacultadInvestigador1" value="#{manejadorBuscadorColecciones.sedeAgregar}">
		                				<f:selectItems value="#{manejadorBuscadorColecciones.listaSedesItem}"/>
										<p:ajax update="selectFacultad"
											listener="#{manejadorBuscadorColecciones.cargarFacultadesSede}" />
									</p:selectOneMenu>
								</t:div>
								</p:column>
								</p:row>
								<p:row style="background:#F1F3F3 !important;">
								<p:column styleClass="color-columnas">
								<t:div rendered="#{manejadorBuscadorColecciones.mostrarAgregarFacultad}" style="margin-left:5px;">
									<h:outputText value="Agregar facultad:"/> 
								</t:div>
								</p:column>
								<p:column styleClass="color-columnas">
								<t:div rendered="#{manejadorBuscadorColecciones.mostrarAgregarFacultad}">
									<p:selectOneMenu style="width:440px; height:24px;" styleClass="select-item-buscador" id="selectFacultad" value="#{manejadorBuscadorColecciones.facultadAgregar}">
		                				<f:selectItems value="#{manejadorBuscadorColecciones.listaFacultadesItem}"/>
									</p:selectOneMenu>
								</t:div>
								</p:column>
								</p:row>
								<p:row style="background:#F1F3F3 !important;">
								<p:column styleClass="color-columnas">
								<t:div rendered="#{manejadorBuscadorColecciones.mostrarAgregarTipoColeccion}" style="margin-left:5px;">
									<h:outputText value="Agregar tipo de colección:"/> 
								</t:div>
								</p:column>
								<p:column styleClass="color-columnas">
								<t:div  rendered="#{manejadorBuscadorColecciones.mostrarAgregarTipoColeccion}">
									<p:selectOneMenu styleClass="select-item-buscador" style="width:440px; height:24px;" id="selectTipoColeccion" value="#{manejadorBuscadorColecciones.tipoColeccionAgregar}">
		                				<f:selectItems value="#{manejadorBuscadorColecciones.listaTiposColeccionesItem}"/>
									</p:selectOneMenu>
				                </t:div>
				                </p:column>
				                </p:row>
				                <p:row style="background:#F1F3F3 !important;">
				                <p:column colspan="2" styleClass="color-columnas">
								<t:div rendered="#{manejadorBuscadorColecciones.mostrarAgregarSede or manejadorBuscadorColecciones.mostrarAgregarFacultad or manejadorBuscadorColecciones.mostrarAgregarTipoColeccion}">
									<p:commandButton action="#{manejadorBuscadorColecciones.buscar}" styleClass="boton_buscar_colecciones" value="" update="@form"/>
							</t:div>
							</p:column>
							</p:row>
							</p:panelGrid>
							
						</t:div>
					</p:tab>
				</p:accordionPanel>
					
		</t:div>
		</t:div>
		
			<t:div style="padding-left:3px;" id="resultados-buscador" rendered="#{manejadorBuscadorColecciones.banderaResultadosBusqueda}">
				<t:div styleClass="informacion-titulo-buscador" >
					<h:outputText value="Resultados " />
				</t:div>
				<t:div styleClass="informacion-resultado-buscador"
					style="border-bottom: none; color: #464646; padding-bottom: 0px; padding-top: 3px;">
					<t:outputText value="Se han encontrado #{manejadorBuscadorColecciones.numeroResultados} registros" />
				</t:div>
				<t:div styleClass="panel-buscador-colecciones">
				<br />
					<p:dataList 
						id="tablaResultadoColecciones"
						value="#{manejadorBuscadorColecciones.listaColecciones}" var="coleccion"
						rows="8" type="none"
						paginatorTemplate=" {FirstPageLink} {PreviousPageLink} {PageLinks} {NextPageLink} {LastPageLink} "
						paginator="true" paginatorPosition="bottom"
						paginatorAlwaysVisible="false" style="">
						<t:div styleClass="informacion-resultado-buscador-colecciones">
							<p:commandLink action="#{manejadorBuscadorColecciones.consultarPaginaColeccion}"
								value="#{coleccion.nombre}" target="blank">
									<f:setPropertyActionListener value="#{coleccion}"
									target="#{manejadorBuscadorColecciones.coleccionSeleccionada}" />
							</p:commandLink>
							<br />
							Sede <h:outputText value="#{coleccion.dependencia.sede.nombre}" /> | <h:outputText
								value="#{coleccion.dependencia.nombre}" />
						</t:div>
					</p:dataList>
				</t:div>
			</t:div>
		
			 <t:div styleClass="panel-inicio-colecciones" rendered="#{!manejadorBuscadorColecciones.banderaResultadosBusqueda}"/>
		</h:form>
	</ui:define>
</ui:composition>
