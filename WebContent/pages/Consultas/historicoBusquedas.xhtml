<?xml version='1.0' encoding='ISO-8859-1' ?>
<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:t="http://myfaces.apache.org/tomahawk"
	xmlns:s="http://myfaces.apache.org/sandbox"
	template="../../templates/common.xhtml">

	<ui:define name="content">
		<h:form>
			<t:div styleClass="contenido-titulo-general-myriad">Histórico de búsquedas portafolio SIUN</t:div>

			<p:growl id="growl" showDetail="true" />
			<p:growl id="growl1" showDetail="true" />
			
			<p:tabView>	
			<p:tab title="Resumen búsquedas" titleStyle="font-size:12px">
				<p:growl id="growl1" showDetail="true" />
				<p:panelGrid style="width:100%;">
							<p:row>
								<p:column colspan="2" style="font-weight:bold; text-align:center;">
									<h:outputText
										value="Resumen de búsquedas en portafolio" />
								</p:column>
							</p:row>
							<p:row>
								<p:column style="font-weight:bold; text-align:center;">
									<h:outputText value="Categoría" />
								</p:column>
								<p:column style="text-align:center; font-weight:bold;">
									<h:outputText value="Cantidad" />
								</p:column>
							</p:row>
							<p:row>
								<p:column>
									<h:outputText value="Colecciones biológicas" style="color:gray;" />
								</p:column>
								<p:column style="text-align:right; font-weight:bold;">
									<h:outputText
										value="#{manejadorHistoricoBusqueda.totalCatColecciones}">
									</h:outputText>
								</p:column>
							</p:row>
							<p:row>
								<p:column>
									<h:outputText value="Convocatorias" style="color:gray;"/>
								</p:column>
								<p:column style="text-align:right; font-weight:bold;">
									<h:outputText
										value="#{manejadorHistoricoBusqueda.totalCatConvocatoria}">
									</h:outputText>
								</p:column>
							</p:row>
							<p:row>
								<p:column>
									<h:outputText value="Educación continua" style="color:gray;"/>
								</p:column>
								<p:column style="text-align:right; font-weight:bold;">
									<h:outputText
										value="#{manejadorHistoricoBusqueda.totalCatEcp}">
									</h:outputText>
								</p:column>
							</p:row>
							<p:row>
								<p:column>
									<h:outputText
										value="Grupos" style="color:gray;"/>
								</p:column>
								<p:column style="text-align:right; font-weight:bold;">
									<h:outputText
										value="#{manejadorHistoricoBusqueda.totalCatGrupos}" />
								</p:column>
							</p:row>
							<p:row>
								<p:column>
									<h:outputText value="Investigadores" style="color:gray;"/>
								</p:column>
								<p:column style="text-align:right; font-weight:bold;">
									<h:outputText
										value="#{manejadorHistoricoBusqueda.totalCatInvestigadores}">
									</h:outputText>
								</p:column>
							</p:row>
							<p:row>
								<p:column>
									<h:outputText value="Laboratorios" style="color:gray;"/>
								</p:column>
								<p:column style="text-align:right; font-weight:bold;">
									<h:outputText 
										value="#{manejadorHistoricoBusqueda.totalCatLaboratorios}">
									</h:outputText>
								</p:column>
							</p:row>
							<p:row>
								<p:column>
									<h:outputText value="Proyectos" style="color:gray;"/>
								</p:column>
								<p:column style="text-align:right; font-weight:bold;">
									<h:outputText
										value="#{manejadorHistoricoBusqueda.totalCatProyectos}">
									</h:outputText>
								</p:column>
							</p:row>
							<p:row>
								<p:column>
									<h:outputText value="Todas" style="color:gray;"/>
								</p:column>
								<p:column style="text-align:right; font-weight:bold;">
									<h:outputText
										value="#{manejadorHistoricoBusqueda.totalCatTodas}">
									</h:outputText>
								</p:column>
							</p:row>
							<p:row>
								<p:column style="text-align:right;">
									<h:outputText value="Total" />
								</p:column>
								<p:column style="text-align:right; font-weight:bold; color:red;">
									<h:outputText
										value="#{manejadorHistoricoBusqueda.totalUsoBuscador}">
									</h:outputText>
								</p:column>
							</p:row>
						</p:panelGrid>
						<br />
						<br />
						<center>
							
						</center>
			</p:tab>
			<p:tab title="Detalle búsquedas" titleStyle="font-size:12px">
						<p:messages id="msgs" autoUpdate="true" closable="true" />
			<br />
			<p:panelGrid styleClass="estilo-panelgrid-sinbordes"
				id="panelReporte">
				<p:row>
					<p:column style="width:120px;">
						<h:outputText value="Fecha Inicial:" />
					</p:column>
					<p:column style="width:200px;">
						<p:calendar id="fechaInicial"
							value="#{manejadorHistoricoBusqueda.fechaInicio}" mindate="06/01/15"/>
					</p:column>
					<p:column style="width:120px;">
						<h:outputText value="Fecha Final:" />
					</p:column>
					<p:column style="width:200px;">
						<p:calendar id="fechaFinal"
							value="#{manejadorHistoricoBusqueda.fechaFin}" mindate="07/01/15"/>
					</p:column>
				</p:row>
				<p:row>
					<p:column colspan="4">
					</p:column>
				</p:row>
				<p:row>
					<p:column style="width:120px;">
						<h:outputText value="Categorias buscador:" />
					</p:column>
					<p:column colspan="3">
						<p:selectCheckboxMenu id="menu" style="width:220px;"
							value="#{manejadorHistoricoBusqueda.selectedCategorias}" label="Seleccione categoría(s)"
							panelStyle="width:220px">
							<f:selectItems value="#{manejadorHistoricoBusqueda.listaCategorias}" />
						</p:selectCheckboxMenu>
					</p:column>
				</p:row>
				<p:row style="text-align:center;">
						<p:column colspan="4" style="text-align:center;">
							<p:commandButton value="Consultar"
								actionListener="#{manejadorHistoricoBusqueda.consultarRegistros}"
								update="historicoBusq" onstart="dialogEspere.show()"
								oncomplete="dialogEspere.hide()" />
						</p:column>
					</p:row>
				</p:panelGrid>
			<br />
			<p:dataTable id="historicoBusq" var="busqueda" emptyMessage="0 registros encontrados"
				value="#{manejadorHistoricoBusqueda.listaBusquedas}" paginator="true" rows="20"
				paginatorPosition="bottom" style="width:650px;" filteredValue="#{manejadorHistoricoBusqueda.filteredCategorias}">

				<f:facet name="header">  
	           Histórico de búsquedas
	        	</f:facet>
				
				<p:column filterBy="#{busqueda.nombreCategoria}" filterMatchMode="contains" style="width:150px;">
						<f:facet name="header">
			                <h:outputText value="Categoría" />
			            </f:facet>
						<h:outputText value="#{busqueda.nombreCategoria}" />
				</p:column>

				<p:column style="width:400px;">
						<f:facet name="header">
			                <h:outputText value="Palabras clave" />
			            </f:facet>
						<h:outputText value="#{busqueda.palabra}" />
				</p:column>
				
				<p:column style="width:100px;">
					<f:facet name="header">
						<h:outputText value="Fecha" />
					</f:facet>
					<h:outputText value="#{busqueda.fechaBusqueda}" />
				</p:column>

				<f:facet name="footer">Han sido encontrados #{manejadorHistoricoBusqueda.totalBusquedas} búsquedas</f:facet>
			</p:dataTable>
			 <div style="text-align:right;">
				 <h:commandLink value="Exportar">
			        <p:dataExporter type="xls" target="historicoBusq" fileName="historicoBusq" />
			    </h:commandLink>
			 </div>
			 </p:tab>
			</p:tabView>
			 
				<p:dialog widgetVar="dialogEspere" resizable="false"
						closable="false" modal="true">
						<p:graphicImage value="/images/ajaxloading.gif" />
							Por favor espere...
				</p:dialog>

		</h:form>
	</ui:define>
</ui:composition>
