<?xml version='1.0' encoding='ISO-8859-1' ?>
<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:t="http://myfaces.apache.org/tomahawk"
	xmlns:s="http://myfaces.apache.org/sandbox"
	template="../../templates/her-plantillaBasica.xhtml">
	<ui:define name="content">
		<h:form>
			<style type="text/css">
		
		.estilo-panelgrid-sinbordes tr, .estilo-panelgrid-sinbordes td{
		font-family: "Ancizar sans", Tahoma, Geneva, sans-serif;
		}

	</style>
			<img src="#{facesContext.externalContext.requestContextPath}/images/her-paginas/cabezote.png" style="margin-bottom: 10px; border-radius:10px;" />
			<t:div  styleClass="contenido-menu-paginas-buscadores"  rendered="#{!manejadorProyectoBusqueda.error}" >
				<t:div styleClass="menu-superior">
				<p:graphicImage id="localCroppedImage3"
						value="/images/imagen_proyectos.png" />
				<br />
				<br />
				<h:outputText value="Sede:" style="font-weight:bold;" />
				<br />
				<h:outputText rendered="#{manejadorProyectoBusqueda.proyectoActual.esInvestigacion}"
						value="#{manejadorProyectoBusqueda.nombreSede}" />
				<h:outputText rendered="#{manejadorProyectoBusqueda.proyectoActual.esExtension}"
						value="#{manejadorProyectoBusqueda.proyectoActual.dependenciaPrincipal.sede.nombre}" />
				<br />
				<br />
				<h:outputText value="Facultad:" style="font-weight:bold;" />
				<br />
				<h:outputText rendered="#{manejadorProyectoBusqueda.proyectoActual.esInvestigacion}"
					value="#{manejadorProyectoBusqueda.nombreFacultad}" />
				<h:outputText rendered="#{manejadorProyectoBusqueda.proyectoActual.esExtension}"
						value="#{manejadorProyectoBusqueda.proyectoActual.dependenciaPrincipal.facultad.nombre}" />
				<br />
				<br />
				<h:outputText value="Dependencia:" style="font-weight:bold;" />
					<br />
					<h:outputText rendered="#{manejadorProyectoBusqueda.proyectoActual.esInvestigacion}"
						value="#{manejadorProyectoBusqueda.nombreDependencia}" />
					<h:outputText rendered="#{manejadorProyectoBusqueda.proyectoActual.esExtension}"
						value="#{manejadorProyectoBusqueda.proyectoActual.dependenciaPrincipal.nombre}" />
					<br />
					<br />
				<t:div styleClass="separador" style="width:195px;"></t:div>
				<br />
				<h:outputText value="Lugar:" style="font-weight:bold;" />
					<br />
					<h:outputText rendered="#{manejadorProyectoBusqueda.proyectoActual.lugar !=null}"
						value="#{manejadorProyectoBusqueda.proyectoActual.lugar}" />
					<h:outputText rendered="#{manejadorProyectoBusqueda.proyectoActual.lugar ==null}"
						value="---" />
					<br />
					<br />
					<h:outputText value="Duración:" style="font-weight:bold;" />
					<br />
					<h:outputText style="text-align:justify;" rendered="#{manejadorProyectoBusqueda.proyectoActual.esInvestigacion}"
						value="#{manejadorProyectoBusqueda.proyectoActual.duracion} meses" />
					<h:outputText style="text-align:justify;" rendered="#{manejadorProyectoBusqueda.proyectoActual.esExtension}"
						value="#{manejadorProyectoBusqueda.proyectoActual.tipoEspacio}" />
					<br />
					<br />
					<img src="#{facesContext.externalContext.requestContextPath}/images/her-paginas/icono_pdf.png" style="border: none; width: 18px; margin-bottom:5px;" />
					<br />
					<h:commandLink value="Descargar resultado de búsqueda" ajax="false"
							style="text-decoration:underline; 
								color: #16A8E2;
								font-weight: bold;
								padding-left:2px;"
							target="_popUpWindow"
							onclick="javascript: void window.open('', '_popUpWindow', 'status=0,toolbar=0,location=0,directories=0,menubar=0,resizable,width=750,height=500,scrollbars,left=0,top=0');"
							action="#{manejadorProyectoBusqueda.reporteProyectoBusqueda}"
							rendered ="#{manejadorProyectoBusqueda.proyectoActual.esInvestigacion}">
					</h:commandLink>
					<h:commandLink value="Descargar resultado de búsqueda" ajax="false"
							style="text-decoration:underline; 
								color: #16A8E2;
								font-weight: bold;
								padding-left:2px;"
							target="_popUpWindow"
							onclick="javascript: void window.open('', '_popUpWindow', 'status=0,toolbar=0,location=0,directories=0,menubar=0,resizable,width=750,height=500,scrollbars,left=0,top=0');"
							action="#{manejadorProyectoBusqueda.reporteProyectoBusquedaExtension}"
							rendered ="#{manejadorProyectoBusqueda.proyectoActual.esExtension}">
					</h:commandLink>
					<br />
					<br />
					<t:div styleClass="separador" style="width:195px;"></t:div>
					<br />
					<t:div styleClass="regresar-buscador-docente" style="width:194px;">
						<h:outputLink value="#{facesContext.externalContext.requestContextPath}/pages/principal/Principal.xhtml" style="text-decoration:none;">
							<h:outputText value="Regresar" style="color:white !important; text-decoration:none;" />
						</h:outputLink>
					</t:div>
				</t:div>
			</t:div>
			<t:div  styleClass="contenido-informacion-paginas-buscadores"  rendered="#{!manejadorProyectoBusqueda.error}" >
				<t:div styleClass="cabezote-informacion-pagina-buscador">
					<h:outputText value="Proyectos" />
				</t:div>
				<t:div styleClass="contenedor-informacion" style="border-radius:0px; margin-top:0px; padding-left:16px;">
					<t:div styleClass="contenido-nombre" style="padding-left:16px;">
						<h:outputText value="#{manejadorProyectoBusqueda.proyectoActual.nombre}"/>
					</t:div>
					<t:div styleClass="titulo-informacion" style="margin-left:16px; width:640px;">	
					</t:div>
					<t:div styleClass="menu-paginas-buscadores" style="padding-left:16px;">
					<a href="#resumen">Resumen</a>	
						
						<h:outputText> | </h:outputText>
						
					<a href="#convocatoria">Convocatoria</a>	
						
						<h:outputText> | </h:outputText>
					
					<a href="#responsable">Responsable</a>	

					<br />
					<br />
					</t:div>
					
					<t:div styleClass="informacion" >
						<h:panelGrid columns="1">
						
						<a name="resumen">
							<t:div styleClass="informacion-titulo" style="width: 640px;" >
									<h:outputText value="Resumen " />
							</t:div>
							<t:div styleClass="informacion-texto" rendered="#{manejadorProyectoBusqueda.visibleResumen}" style="width: 640px;">
								<h:outputText value="#{manejadorProyectoBusqueda.proyectoActual.resumen}" />
							</t:div>
						</a>
						<a name="convocatoria">
						<t:div styleClass="informacion-titulo" style="width: 640px;" >
									<h:outputText value="Convocatoria " />
						</t:div>
						<t:div styleClass="informacion-texto" rendered="#{manejadorProyectoBusqueda.proyectoActual.esInvestigacion}">
						 <p:panelGrid styleClass="estilo-panelgrid-sinbordes">
								        	<p:row>
								        		<p:column style="width:200px; font-weight:bold;">
								        			<h:outputText value="Nombre de la convocatoria:" />
								        		</p:column>
								        		<p:column style="width:480px;">
								        			<h:outputText value="#{manejadorProyectoBusqueda.nombreConvocatoria}"/>
								        		</p:column>
								        	</p:row>
								        	<p:row>
								        		<p:column style="width:200px; font-weight:bold;">
								        			<h:outputText value="Modalidad:" />
								        		</p:column>
								        		<p:column style="width:480px;">
								        			<h:outputText value="#{manejadorProyectoBusqueda.nombreModalidad}"/>
								        		</p:column>
								        	</p:row>
								        	
								        	
							</p:panelGrid>
						</t:div>
						<t:div styleClass="informacion-texto" rendered="#{manejadorProyectoBusqueda.proyectoActual.esExtension}">
						 <p:panelGrid styleClass="estilo-panelgrid-sinbordes">
								        	<p:row>
								        		<p:column style="width:200px; font-weight:bold;">
								        			<h:outputText value="Modalidad:" />
								        		</p:column>
								        		<p:column style="width:480px;">
								        			<h:outputText value="#{manejadorProyectoBusqueda.proyectoActual.observaciones}"/>
								        		</p:column>
								        	</p:row>
								        	<p:row>
								        		<p:column style="width:200px; font-weight:bold;">
								        			<h:outputText value="Sub Modalidad:" />
								        		</p:column>
								        		<p:column style="width:480px;">
								        			<h:outputText value="#{manejadorProyectoBusqueda.proyectoActual.antecedentes}"/>
								        		</p:column>
								        	</p:row>
							</p:panelGrid>
						</t:div>
						</a>
						<a name="responsable">
							<t:div styleClass="informacion-titulo" style="width: 640px;" >
									<h:outputText value="Responsable " />
						</t:div>
								<t:div styleClass="informacion-texto" >
									<t:div styleClass="informacion-subtitulo-link">
									<h:outputLink target="_blank"
										value="#{facesContext.externalContext.requestContextPath}/pages/Docentes/Docente.jsf?u=#{manejadorProyectoBusqueda.emailPersona}">
										<img src="#{facesContext.externalContext.requestContextPath}/images/her-paginas/icono_enlace.png" style="border:none; width: 16px;"/>
				            		 	<h:outputText value=" #{manejadorProyectoBusqueda.nombreResponsable}" style="font-weight: bold;"/>
				            		 </h:outputLink>
									</t:div>
								</t:div>
						</a>
						</h:panelGrid>
					</t:div>
				</t:div>
				<t:div styleClass="final-contenedor-informacion" />
			</t:div>
			
		</h:form>
	</ui:define>
</ui:composition>
