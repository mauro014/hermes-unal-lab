<?xml version='1.0' encoding='ISO-8859-1' ?>
<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:t="http://myfaces.apache.org/tomahawk"
	xmlns:s="http://myfaces.apache.org/sandbox"
	template="../../templates/her-plantillaBasica.xhtml">

	<ui:define name="content">
		<h:form>

			<img
				src="#{facesContext.externalContext.requestContextPath}/images/her-paginas/cabezote.png"
				style="margin-bottom: 10px; border-radius:10px;" />


			<t:div styleClass="contenido-menu-paginas-buscadores"
				rendered="#{!manejadorPersonaBusqueda.error}">
				<t:div styleClass="menu-superior">

					<p:graphicImage id="localCroppedImage2"
						value="#{manejadorPersonaBusqueda.imagen}"
						rendered="#{manejadorPersonaBusqueda.bandera}" />

					<p:graphicImage id="localCroppedImage3"
						value="/images/Docentes_BN_210px.png"
						rendered="#{!manejadorPersonaBusqueda.bandera}" />
					<br />
					<br />
					<h:outputText value="E-mail:" style="font-weight:bold;" />
					<br />
					<h:outputText
						value="#{manejadorPersonaBusqueda.investigadorActual.email}" />
					<br />
					<br />
					<h:outputText value="Teléfono:" style="font-weight:bold;" />
					<br />
					<t:div
						rendered="#{manejadorPersonaBusqueda.investigadorInterno.telefonoHojaVida != null or manejadorPersonaBusqueda.investigadorInterno.telefonoHojaVida != ''}">
						<h:outputText
							value="#{manejadorPersonaBusqueda.investigadorInterno.telefonoHojaVida}" />
					</t:div>
					<t:div
						rendered="#{manejadorPersonaBusqueda.investigadorInterno.telefonoHojaVida == null or manejadorPersonaBusqueda.investigadorInterno.telefonoHojaVida == ''}">
						<t:div
							rendered="#{manejadorPersonaBusqueda.investigadorInterno.dependencia.sede.id == 2}">
							<h:outputText value="+57 (1) 316 5000" />
						</t:div>
						<t:div
							rendered="#{manejadorPersonaBusqueda.investigadorInterno.dependencia.sede.id == 3}">
							<h:outputText value="+57 (4) 430 9000" />
						</t:div>
						<t:div
							rendered="#{manejadorPersonaBusqueda.investigadorInterno.dependencia.sede.id == 4}">
							<h:outputText value="+57 (6) 887 9300" />
						</t:div>
						<t:div
							rendered="#{manejadorPersonaBusqueda.investigadorInterno.dependencia.sede.id == 5}">
							<h:outputText value="+57 (2) 271 7000" />
						</t:div>
						<t:div
							rendered="#{manejadorPersonaBusqueda.investigadorInterno.dependencia.sede.id == 6}">
							<h:outputText value="+57 (8) 592 7996" />
						</t:div>
						<t:div
							rendered="#{manejadorPersonaBusqueda.investigadorInterno.dependencia.sede.id == 7}">
							<h:outputText value="+57 (7) 885 3004/9" />
						</t:div>
						<t:div
							rendered="#{manejadorPersonaBusqueda.investigadorInterno.dependencia.sede.id == 8}">
							<h:outputText value="+57 (8) 513 3310/11" />
						</t:div>
						<t:div
							rendered="#{manejadorPersonaBusqueda.investigadorInterno.dependencia.sede.id == 9}">
							<h:outputText value="+57 (2) 727 4317" />
						</t:div>
					</t:div>
					<br />
					<h:outputText value="Extensión:" style="font-weight:bold;" />
					<t:div
						rendered="#{manejadorPersonaBusqueda.investigadorInterno.telExtension != null}">
						<h:outputText
							value="#{manejadorPersonaBusqueda.investigadorInterno.telExtension}" />
					</t:div>
					<t:div
						rendered="#{manejadorPersonaBusqueda.investigadorInterno.telExtension == null}">
						<h:outputText value="---" />
					</t:div>
					<br />
					<h:outputText value="Dependencia:" style="font-weight:bold;" />
					<br />
					<h:outputText
						value="#{manejadorPersonaBusqueda.investigadorInterno.dependencia.nombre}" />
					<br />
					<br />
					<img src="#{facesContext.externalContext.requestContextPath}/images/her-paginas/icono_pdf.png" style="border: none; width: 18px; margin-bottom:5px;" />
					<br />
					<h:commandLink value="Descargar resultado de búsqueda" ajax="false"
							style="text-decoration:underline; 
								color: #16A8E2;
								font-weight: bold;
								padding-left:2px;"
							target="_popUpWindow"
							onclick="javascript: void window.open('', '_popUpWindow', 'status=0,toolbar=0,location=0,directories=0,menubar=0,resizable,width=750,height=500,scrollbars,left=0,top=0');"
							action="#{manejadorPersonaBusqueda.reporteInvestigadorBusqueda}">
					</h:commandLink>
					<br />
					<br />
					<t:div styleClass="separador" style="width:195px;"></t:div>
					<br />
					<t:div styleClass="regresar-buscador-docente"
						style="margin-top:10px;">
						<h:outputLink
							value="#{facesContext.externalContext.requestContextPath}/pages/principal/Principal.xhtml?n=1"
							style="text-decoration:none;">
							<h:outputText value="Regresar"
								style="color:white !important; font-style:none; text-decoration:none;" />
						</h:outputLink>
					</t:div>
				</t:div>
			</t:div>



			<t:div styleClass="contenido-informacion-paginas-buscadores"
				style="border: 1px solid #DDD;"
				rendered="#{!manejadorPersonaBusqueda.error}">
				<t:div styleClass="cabezote-informacion-pagina-buscador">
					<h:outputText value="Información Investigador" />
				</t:div>
				<t:div styleClass="contenedor-informacion"
					style="border-radius:0px; margin-top:0px; padding-left:16px;">
					<t:div styleClass="contenido-nombre1" style="padding-left:16px;">
						<h:outputText
							value="#{manejadorPersonaBusqueda.investigadorActual.nombre11} #{manejadorPersonaBusqueda.investigadorActual.apellido11} #{manejadorPersonaBusqueda.investigadorActual.apellido22}" />
					</t:div>
					<t:div styleClass="titulo-informacion" style="margin-left:16px; width:640px;">
					</t:div>

					<t:div styleClass="menu-paginas-buscadores"
						style="padding-left:16px;">
						<a href="#perfil">Perfil</a>

						<h:outputText> | </h:outputText>

						<a href="#proyectos">Proyectos</a>

						<h:outputText> | </h:outputText>

						<a href="#grupos">Grupos</a>

						<h:outputText> | </h:outputText>

						<a href="#colciencias">Colciencias</a>

						<h:outputText> | </h:outputText>

						<a href="#hv">Hoja de vida</a>
						<br />
						<br />
					</t:div>

					<t:div styleClass="informacion">
						<h:panelGrid columns="1">
							<a name="perfil"> <t:div styleClass="informacion-titulo">
									<h:outputText value="Perfil" />
								</t:div> <t:div styleClass="informacion-texto" style="width: 640px;">
									<h:outputText
										value="#{manejadorPersonaBusqueda.investigadorInterno.perfil}"
										rendered="#{manejadorPersonaBusqueda.investigadorInterno.perfil != null}" />

									<t:div styleClass="informacion-subtexto"
										rendered="#{manejadorPersonaBusqueda.investigadorInterno.perfil == null or manejadorPersonaBusqueda.investigadorInterno.perfil == ''}"
										style="text-align: center; font-weight: bold; width: 640px; padding-bottom: 40px;">
										<h:outputText
											value="El perfil del investigador no se encuentra disponible." />
									</t:div>
								</t:div>
							</a>
							<a name="proyectos"> <t:div styleClass="informacion-titulo">
									<h:outputText value="Proyectos " />
								</t:div> <t:div styleClass="informacion-texto" style="width: 640px;">
									<t:dataTable
										rendered="#{not empty manejadorPersonaBusqueda.proyectosInvestigador}"
										var="investigadorProyecto"
										value="#{manejadorPersonaBusqueda.proyectosInvestigador}">
										<h:column>
										<t:div styleClass="informacion-subtitulo-link" 
												style="padding-bottom: 8px; text-align: justify; padding-right: 40px;">
											<h:outputLink target="_blank"
												value="#{facesContext.externalContext.requestContextPath}/pages/Consultas/Proyecto.xhtml?idProyecto=#{investigadorProyecto.proyecto.id}">
												<img src="#{facesContext.externalContext.requestContextPath}/images/her-paginas/icono_enlace.png"
														style="border: none; width: 15px;" />
												<h:outputText
													value=" #{investigadorProyecto.proyecto.nombre}" style="text-transform:uppercase;"/>
												<h:outputText
														value=" (Fecha de inicio: #{investigadorProyecto.proyecto.fechaTentativaInicio})" rendered="#{investigadorProyecto.proyecto.fechaTentativaInicio !=null}" />
											</h:outputLink>
										</t:div>
										</h:column>
									</t:dataTable>
									<t:div styleClass="informacion-subtexto"
										rendered="#{empty manejadorPersonaBusqueda.proyectosInvestigador}"
										style="text-align: center; font-weight: bold; width: 640px; padding-bottom: 40px;">
										<h:outputText
											value="El investigador no tiene proyectos visibles." />
									</t:div>
								</t:div>
							</a>
							<a name="grupos"> <t:div styleClass="informacion-titulo">
									<h:outputText value="Grupos " />
								</t:div> <t:div styleClass="informacion-texto" style="width: 640px;">
									<t:dataTable
										rendered="#{not empty manejadorPersonaBusqueda.investigadorActual.gruposInvestigador}"
										var="investigadorGrupo"
										value="#{manejadorPersonaBusqueda.investigadorActual.gruposInvestigador}">
										<h:column>
										<t:div styleClass="informacion-subtitulo-link">
											<h:outputLink target="_blank"
												value="#{facesContext.externalContext.requestContextPath}/pages/Consultas/Grupo.xhtml?idGrupo=#{investigadorGrupo.grupo.id}">
												<img src="#{facesContext.externalContext.requestContextPath}/images/her-paginas/icono_enlace.png"
														style="border: none; width: 15px;" />
												<h:outputText value=" #{investigadorGrupo.grupo.nombre}" />
											</h:outputLink>
										</t:div>
								</h:column>
									</t:dataTable>
									<t:div styleClass="informacion-subtexto"
										rendered="#{empty manejadorPersonaBusqueda.investigadorActual.gruposInvestigador}"
										style="text-align: center; font-weight: bold; width: 640px; padding-bottom: 40px;">
										<h:outputText
											value="El investigador no tiene grupos asociados." />
									</t:div>
								</t:div>
							</a>
							<a name="colciencias"> <t:div styleClass="informacion-titulo">
									<h:outputText value="Colciencias " />
								</t:div> <t:div styleClass="informacion-texto" style="width: 640px;">
									<t:div styleClass="informacion-subtitulo-link">
										<h:outputLink 
											rendered="#{manejadorPersonaBusqueda.investigadorActual.urlColciencias!=null and manejadorPersonaBusqueda.investigadorActual.urlColciencias!=''}"
											value="#{manejadorPersonaBusqueda.investigadorActual.urlColciencias}"
											target="_blank">
											<img
												src="#{facesContext.externalContext.requestContextPath}/images/her-paginas/icono_enlace.png"
												style="border: none; width: 18px;" />
											<h:outputText value=" Hoja de vida CVLAC" />
										</h:outputLink>
									</t:div>
									<t:div styleClass="informacion-subtexto"
										rendered="#{manejadorPersonaBusqueda.investigadorActual.urlColciencias==null or manejadorPersonaBusqueda.investigadorActual.urlColciencias==''}"
										style="text-align: center; font-weight: bold; width: 640px; padding-bottom: 40px;">
										<h:outputText value="Sin información del CVLAC." />
									</t:div>
								</t:div>
							</a>
							<a name="hv"> <t:div styleClass="informacion-titulo">
									<h:outputText value="Hoja de vida docente " />
								</t:div> <t:div styleClass="informacion-texto" style="width: 640px;">
									<t:div styleClass="informacion-subtitulo-link">
										<h:commandLink target="_blank"
											action="#{manejadorPersonaBusqueda.consultarPaginaPersona}">
											<img
												src="#{facesContext.externalContext.requestContextPath}/images/her-paginas/icono_enlace.png"
												style="border: none; width: 18px;" />
											<h:outputText value=" Hoja de vida" />
										</h:commandLink>
									</t:div>
								</t:div>
							</a>
						</h:panelGrid>
					</t:div>
				</t:div>
				<t:div styleClass="final-contenedor-informacion" />
			</t:div>
		</h:form>
	</ui:define>
</ui:composition>
