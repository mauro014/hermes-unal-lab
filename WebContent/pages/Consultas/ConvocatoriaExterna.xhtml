<?xml version='1.0' encoding='ISO-8859-1' ?>
<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:t="http://myfaces.apache.org/tomahawk"
	xmlns:s="http://myfaces.apache.org/sandbox"
	template="../../templates/her-plantillaBasica.xhtml">
	<ui:define name="content">
		<h:form>
			<img
				src="#{facesContext.externalContext.requestContextPath}/images/her-paginas/cabezote.png"
				style="margin-bottom: 10px; border-radius: 10px;" />
			<t:div rendered="#{manejadorConvocatoriaBusqueda.error}">
				<t:div styleClass="contenido-menu-paginas-buscadores">
					<t:div styleClass="menu-superior">
						<p:graphicImage id="localCroppedImage3"
							value="/images/imagen_convocatorias.png" />
						<BR />
						<BR />
						<t:div styleClass="regresar-buscador-docente"
							style="margin-top:10px;">
							<h:outputLink
								value="#{facesContext.externalContext.requestContextPath}/pages/principal/Principal.xhtml">
								<h:outputText value="Regresar" style="color:white !important;" />
							</h:outputLink>
						</t:div>
					</t:div>
				</t:div>
				<t:div styleClass="contenido-informacion-paginas-buscadores"
					style="height:650px; padding:20px; font-size:16px; padding-top:50px;">
					<h:outputText value="Lo sentimos!"
						style="font-weight:bold; font-size: 24px;" />
					<br />
					<br />
					<h:outputText value="No hemos encontrado la convocatoria."
						style="font-weight:bold;" />
				</t:div>
			</t:div>
			<t:div styleClass="contenido-menu-paginas-buscadores"
				rendered="#{!manejadorConvocatoriaBusqueda.error}">
				<t:div styleClass="menu-superior">

					<p:graphicImage id="localCroppedImage3"
						value="/images/imagen_convocatorias.png" />
					<br />
					<br />
					<h:outputText value="Entidad:" style="font-weight:bold;" />
					<br />
					<h:outputText
						value="#{manejadorConvocatoriaBusqueda.convocatoriaExternaActual.entidad.descripcion}" />
					<br />
					<br />
					<h:outputText value="Número:" style="font-weight:bold;" />
					<br />
					<h:outputText
						value="#{manejadorConvocatoriaBusqueda.convocatoriaExternaActual.numero}" />
					<br />
					<br />
					<h:outputText value="Naturaleza:" style="font-weight:bold;" />
					<br />
					<h:outputText
						value="#{manejadorConvocatoriaBusqueda.convocatoriaExternaActual.naturaleza.nombre}" />
					<br />
					<br />
					<h:outputText value="Estado:" style="font-weight:bold;" />
					<br />
					<h:outputText
						rendered="#{manejadorConvocatoriaBusqueda.convocatoriaExternaActual.estado == 'A'}"
						value="Activa" />
					<h:outputText
						rendered="#{manejadorConvocatoriaBusqueda.convocatoriaExternaActual.estado == 'I'}"
						value="Inactiva" />
					<br />
					<br />
					<t:div styleClass="separador" style="width:195px;"></t:div>
					<br />
					<t:div styleClass="regresar-buscador-docente" style="width:194px;">
						<h:outputLink
							value="#{facesContext.externalContext.requestContextPath}/pages/principal/Principal.xhtml"
							style="text-decoration:none;">
							<h:outputText value="Regresar"
								style="color:white !important; text-decoration:none;" />
						</h:outputLink>
					</t:div>
				</t:div>
			</t:div>

			<t:div styleClass="contenido-informacion-paginas-buscadores"
				rendered="#{!manejadorConvocatoriaBusqueda.error}"
				style="border: 1px solid #DDD;">
				<t:div styleClass="cabezote-informacion-pagina-buscador">
					<h:outputText value="Convocatorias" />
				</t:div>
				<t:div styleClass="contenedor-informacion"
					style="border-radius:0px; margin-top:0px; padding-left:16px;">
					<t:div styleClass="contenido-nombre" style="padding-left: 5px;">
						<h:outputText
							value="#{manejadorConvocatoriaBusqueda.convocatoriaExternaActual.nombre}" />
					</t:div>
					<t:div styleClass="titulo-informacion">
					</t:div>

					<t:div styleClass="menu-paginas-buscadores"
						style="padding-left:16px;">

						<a href="#enlace">Enlace externo</a>
						<h:outputText> | </h:outputText>
						<a href="#contrapartida">Contrapartida</a>
						<h:outputText> | </h:outputText>
						<a href="#fechas">Fechas del proceso</a>
						<h:outputText> | </h:outputText>
						<a href="#documentos">Documentos del proceso</a>
						<br />
						<br />
					</t:div>

					<t:div styleClass="informacion">
						<h:panelGrid columns="1">
							<a name="enlace"> <t:div styleClass="informacion-titulo">
									<h:outputText value="Enlace externo" />
								</t:div> <t:div>
									<h:outputLink styleClass="cvlac"
										value="#{manejadorConvocatoriaBusqueda.convocatoriaExternaActual.urlExterna}"
										target="_blank">
										<img
											src="#{facesContext.externalContext.requestContextPath}/images/her-paginas/icono_enlace.png"
											style="border: none;" />
										<t:outputText value=" Consultar página externa" />
									</h:outputLink>
								</t:div>
							</a>
							<a name="contrapartida"> <t:div
									styleClass="informacion-titulo">
									<h:outputText value="Contrapartida" />
								</t:div> <t:div>
									<h:outputText
										value="¿La convocatoria exige el aporte de contrapartida?: "
										style="font-weight:bold;" />
									<br />
									<h:outputText value="SI"
										rendered="#{manejadorConvocatoriaBusqueda.convocatoriaExternaActual.exigeContrapartida == 1}" />
									<h:outputText value="NO"
										rendered="#{manejadorConvocatoriaBusqueda.convocatoriaExternaActual.exigeContrapartida == 0}" />
									<h:outputText value="No se registran datos"
										rendered="#{manejadorConvocatoriaBusqueda.convocatoriaExternaActual.exigeContrapartida == null}" />
									<br />
								</t:div> <t:div
									rendered="#{manejadorConvocatoriaBusqueda.convocatoriaExternaActual.exigeContrapartida == 0}">
									<h:outputText
										value="¿A pesar de no requerir el aporte de contrapartida es un criterio de evaluación de la convocatoria?: "
										style="font-weight:bold;" />
									<br />
									<h:outputText value="SI"
										rendered="#{manejadorConvocatoriaBusqueda.convocatoriaExternaActual.contrapartidaCriterioEvaluacion == 1}" />
									<h:outputText value="NO"
										rendered="#{manejadorConvocatoriaBusqueda.convocatoriaExternaActual.contrapartidaCriterioEvaluacion == 0}" />
									<h:outputText value="No se registran datos"
										rendered="#{manejadorConvocatoriaBusqueda.convocatoriaExternaActual.contrapartidaCriterioEvaluacion == null}" />
									<br />
								</t:div>
							</a>
							<a name="fechas"> <t:div styleClass="informacion-titulo">
									<h:outputText value="Fechas del proceso" />
								</t:div> <t:div>
									<h:outputText value="Fecha de apertura: "
										style="font-weight:bold;" />
									<h:outputText
										value="#{manejadorConvocatoriaBusqueda.convocatoriaExternaActual.fechaApertura}" />
									<br />
									<h:outputText value="Fecha de cierre en la entidad externa: "
										style="font-weight:bold;" />
									<h:outputText
										value="#{manejadorConvocatoriaBusqueda.convocatoriaExternaActual.fechaCierre}" />
									<br />
									<h:outputText
										value="Fecha de entrega de resultados por parte de la entidad externa: "
										style="font-weight:bold;" />
									<h:outputText
										value="#{manejadorConvocatoriaBusqueda.convocatoriaExternaActual.fechaResultados}">
										<f:convertDateTime pattern="dd/MM/yyyy HH:mm:ss" />
									</h:outputText>
									<br />
									<br />
									<h:outputText
										value="Fecha máxima para solicitud de aval en el Sistema Hermes: "
										style="font-weight:bold;" />
									<h:outputText
										value="#{manejadorConvocatoriaBusqueda.convocatoriaExternaActual.fechaMaxRegistro}">
										<f:convertDateTime pattern="dd/MM/yyyy HH:mm:ss" />
									</h:outputText>
									<br />
									<br />
									<h:outputText
										value="Fecha máxima para solicitud de aval por sede: "
										style="font-weight:bold;" />
									<t:div styleClass="informacion-texto" style="background-color: transparent;">
									<t:dataTable style="width:600px" preserveDataModel="false" id="cortes"
										redered="#{manejadorConvocatoriaBusqueda.convocatoriaExterna.listaCortes != null}"
										value="#{manejadorConvocatoriaBusqueda.convocatoriaExternaActual.listaCortes}"
										var="corte" emptyMessage="Sin cortes por sede">
										<t:column style="font-weight: bold;">
											<f:facet name="header">
												<h:outputText value="Sede" />
											</f:facet>
											<t:div styleClass="informacion-subtexto"
												style="padding-bottom: 0px; font-size: 12px;  width: 250px;">
												<h:outputText value="#{corte.sede.nombre}" />
											</t:div>

										</t:column>
										<t:column>
											<f:facet name="header">
												<h:outputText value="Fecha límite para solicitud de aval" />
											</f:facet>
											<t:div styleClass="informacion-subtexto"
												style="padding-bottom: 0px; font-size: 12px;  width: 100px;">
												<p:calendar id="fechaLimiteSede" locale="es"
													readonlyInput="true" pattern="dd/MM/yyyy HH:mm:ss"
													value="#{corte.fechaLimite}" disabled="true" />
											</t:div>
										</t:column>
									</t:dataTable>
									</t:div>
								</t:div>
							</a>
							<a name="documentos"> <t:div styleClass="informacion-titulo" style="background-color: transparent;">
									<h:outputText value="Documentos del proceso" />
								</t:div> <t:div styleClass="informacion-texto">
									<t:dataTable style="width:100%" preserveDataModel="false"
										value="#{manejadorConvocatoriaBusqueda.listaArchivos}"
										var="archivo"
										rendered="#{manejadorConvocatoriaBusqueda.visibleDocumentosProceso}">
										<t:column>
											<p:commandButton id="descargar"
												action="#{manejadorConvocatoriaBusqueda.descargarArchivo}"
												icon="ui-icon-circle-arrow-s" title="Descargar archivo"
												ajax="false">
												<f:setPropertyActionListener value="#{archivo}"
													target="#{manejadorConvocatoriaBusqueda.archivoSeleccionado}" />
											</p:commandButton>
										</t:column>
										<t:column>
											<t:div styleClass="informacion-subtexto"
												style="padding-bottom: 0px; font-size: 12px;  width: 640px;">
												<h:outputText value=" #{archivo.nombre}" />
											</t:div>
										</t:column>
									</t:dataTable>
									<t:div styleClass="informacion-subtexto"
										rendered="#{!manejadorConvocatoriaBusqueda.visibleDocumentosProceso}"
										style="text-align: center; font-weight: bold; width: 640px; padding-bottom: 40px;">
										<h:outputText value="Sin documentos disponibles" />
									</t:div>
								</t:div>
							</a>
						</h:panelGrid>
					</t:div>

				</t:div>
				<t:div styleClass="final-contenedor-informacion" />
			</t:div>
		</h:form>
	</ui:define>
</ui:composition>
