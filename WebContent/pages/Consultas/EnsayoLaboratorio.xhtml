<?xml version='1.0' encoding='ISO-8859-1' ?>
<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:t="http://myfaces.apache.org/tomahawk"
	xmlns:s="http://myfaces.apache.org/sandbox"
	template="../../templates/her-plantillaBasica.xhtml">
	<ui:define name="content">
	
		<style type="text/css">
			.informacion-texto .ui-widget-content {
				border:none;
			}
			.estilo-panelgrid-sinbordes tr, .estilo-panelgrid-sinbordes td{
				font-weight: normal;
				font-family: "Ancizar sans", Tahoma, Geneva, sans-serif;
			}
		</style>
	
		<h:form>
			<img style="margin-bottom: 10px; border-radius:10px;"
				src="#{facesContext.externalContext.requestContextPath}/images/her-paginas/cabezote.png" />
			<t:div styleClass="contenido-menu-paginas-buscadores" rendered="#{!manejadorEnsayoLaboratorioBusqueda.error}">
				<t:div styleClass="menu-superior">
					
					<p:graphicImage id="localCroppedImage2"
						value="#{manejadorEnsayoLaboratorioBusqueda.imagen}"
						rendered="#{manejadorEnsayoLaboratorioBusqueda.bandera}" 
						width="160" height="160"/>

					<p:graphicImage id="localCroppedImage3"
						value="/images/imagen_labs.png"
						rendered="#{!manejadorEnsayoLaboratorioBusqueda.bandera}" />
						
					<br />
					<br />
					<h:outputText value="Sede:" style="font-weight:bold;" />
					<br />
					<h:outputText
						value="#{manejadorEnsayoLaboratorioBusqueda.laboratorioActual.sede.nombre}" />
					<br />
					<br />
					<h:outputText value="Facultad:" style="font-weight:bold;" />
					<br />
					<h:outputText
						value="#{manejadorEnsayoLaboratorioBusqueda.laboratorioActual.facultad.nombre}" />
					<br />
					<br />
					<h:outputText value="Departamento:" style="font-weight:bold;" />
					<br />
					<h:outputText
						value="#{manejadorEnsayoLaboratorioBusqueda.laboratorioActual.departamento.nombre}" />
					<br />
					<br />
					<h:outputText value="Ubicación:" style="font-weight:bold;" />
					<br />
					<h:outputText
						value="#{manejadorEnsayoLaboratorioBusqueda.laboratorioActual.sede.ciudad}, #{manejadorEnsayoLaboratorioBusqueda.laboratorioActual.campus.nombre}, edificio #{manejadorEnsayoLaboratorioBusqueda.laboratorioActual.edificio.codigo} - #{manejadorEnsayoLaboratorioBusqueda.laboratorioActual.edificio.nombre}, piso #{manejadorEnsayoLaboratorioBusqueda.laboratorioActual.piso}, salón #{manejadorEnsayoLaboratorioBusqueda.laboratorioActual.salon}" />
					<br />
					<br />
					<h:outputText value="E-mail:" style="font-weight:bold;" />
					<br />
					<h:outputText rendered="#{not empty manejadorEnsayoLaboratorioBusqueda.laboratorioActual.email}" value="#{manejadorEnsayoLaboratorioBusqueda.laboratorioActual.email}" />
					<h:outputText rendered="#{empty manejadorEnsayoLaboratorioBusqueda.laboratorioActual.email}" value="---" />
					<br />
					<br />
					<h:outputText value="Teléfono:" style="font-weight:bold;" />
					<br />
					<h:outputText value="#{manejadorEnsayoLaboratorioBusqueda.laboratorioActual.telefono} " />
					<br />
					<br />
					<h:outputText value="Horario atención:" style="font-weight:bold;" />
					<br />
					<h:outputText value="#{manejadorEnsayoLaboratorioBusqueda.laboratorioActual.horarioAtencion} " />
					<br />
					<br />
					<h:outputText value="Acto administrativo de las tarifas:" style="font-weight:bold;" />
					<br />
					<h:commandLink value="Descargar archivo" style="color: #16A8E2;font-weight: bold;padding-left:2px;"
						rendered="#{manejadorEnsayoLaboratorioBusqueda.archivoLaboratorioTarifas ne null}">
					    <p:fileDownload value="#{manejadorEnsayoLaboratorioBusqueda.archivoLaboratorioTarifas}"/>
					</h:commandLink>
					<h:outputText value="El archivo de tarifas no ha sido cargado" 
						rendered="#{manejadorEnsayoLaboratorioBusqueda.archivoLaboratorioTarifas eq null}"/>
					<br />
					<br />
					<h:outputText value="Reglamento:" style="font-weight:bold;" />
					<br />
					<h:commandLink value="Descargar archivo" style="color: #16A8E2;font-weight: bold;padding-left:2px;"
						rendered="#{manejadorEnsayoLaboratorioBusqueda.archivoLaboratorioReglamento ne null}">
					    <p:fileDownload value="#{manejadorEnsayoLaboratorioBusqueda.archivoLaboratorioReglamento}"/>
					</h:commandLink>
					<h:outputText value="El archivo de reglamento no ha sido cargado" 
						rendered="#{manejadorEnsayoLaboratorioBusqueda.archivoLaboratorioReglamento eq null}"/>
					<br />
					<br />
					<h:outputText value="Brochure del laboratorio:" style="font-weight:bold;" />
					<br />
					<h:commandLink value="Descargar archivo" style="color: #16A8E2;font-weight: bold;padding-left:2px;"
						rendered="#{manejadorEnsayoLaboratorioBusqueda.archivoLaboratorioBrochure ne null}">
					    <p:fileDownload value="#{manejadorEnsayoLaboratorioBusqueda.archivoLaboratorioBrochure}"/>
					</h:commandLink>
					|
					<h:outputLink style="color: #16A8E2;font-weight: bold;padding-left:2px;"
						value="#{manejadorEnsayoLaboratorioBusqueda.laboratorioActual.linkBrochure}" target="_blank"
						rendered="#{manejadorEnsayoLaboratorioBusqueda.laboratorioActual.linkBrochure ne null}">
						<img style="border: none; width: 10px;" src="#{facesContext.externalContext.requestContextPath}/images/her-paginas/icono_enlace.png" />
						<h:outputText value="Enlace externo" />
					</h:outputLink>
					<h:outputText value="El archivo o link de tarifas no ha sido cargado" 
						rendered="#{manejadorEnsayoLaboratorioBusqueda.archivoLaboratorioBrochure eq null and manejadorEnsayoLaboratorioBusqueda.laboratorioActual.linkBrochure eq null}"/>
					<br />
					<br />
					<h:outputText value="Condiciones de prestación del servicio:" style="font-weight:bold;" />
					<br />
					<h:commandLink value="Descargar archivo" style="color: #16A8E2;font-weight: bold;padding-left:2px;"
						rendered="#{manejadorEnsayoLaboratorioBusqueda.archivoLaboratorioCondServicio ne null}">
					    <p:fileDownload value="#{manejadorEnsayoLaboratorioBusqueda.archivoLaboratorioCondServicio}"/>
					</h:commandLink>
					|
					<h:outputLink style="color: #16A8E2;font-weight: bold;padding-left:2px;"
						value="#{manejadorEnsayoLaboratorioBusqueda.laboratorioActual.linkCondiciones}" target="_blank"
						rendered="#{manejadorEnsayoLaboratorioBusqueda.laboratorioActual.linkCondiciones ne null}">
						<img style="border: none; width: 10px;" src="#{facesContext.externalContext.requestContextPath}/images/her-paginas/icono_enlace.png" />
						<h:outputText value="Enlace externo" />
					</h:outputLink>
					<h:outputText value="El archivo o link de condiciones de servicio no ha sido cargado" 
						rendered="#{manejadorEnsayoLaboratorioBusqueda.archivoLaboratorioCondServicio eq null and manejadorEnsayoLaboratorioBusqueda.laboratorioActual.linkCondiciones eq null}"/>
					<br />
					<br />
					<h:outputLink styleClass="cvlac"
						value="#{manejadorEnsayoLaboratorioBusqueda.laboratorioActual.paginaWeb}" target="_blank">
						<img style="border: none; width: 16px;"
							src="#{facesContext.externalContext.requestContextPath}/images/her-paginas/icono_enlace.png" />
						<h:outputText value=" Página web" />
					</h:outputLink>
					<br />
					<br />
					<img src="#{facesContext.externalContext.requestContextPath}/images/her-paginas/icono_pdf.png" style="border: none; width: 18px; margin-bottom:5px;" />
					<br />
					<h:commandLink value="Descargar resultado de búsqueda" ajax="false"
							style="text-decoration:underline; 
								color: #16A8E2;
								font-weight: bold;
								padding-left:2px;"
							target="_popUpWindow"
							onclick="javascript: void window.open('', '_popUpWindow', 'status=0,toolbar=0,location=0,directories=0,menubar=0,resizable,width=750,height=500,scrollbars,left=0,top=0');"
							action="#{manejadorEnsayoLaboratorioBusqueda.reporteLaboratorioBusqueda}">
							<f:param name="idEnsayo" value="#{manejadorEnsayoLaboratorioBusqueda.laboratorioActual.id}"/> 
					</h:commandLink>
					<br />
					<br />
					<t:div styleClass="separador" style="width:195px;"></t:div>
					<br />
					<t:div styleClass="regresar-buscador-docente" style="width:194px;">
						<h:outputLink value="#{facesContext.externalContext.requestContextPath}/pages/Consultas/BuscadorLaboratorios.xhtml" style="text-decoration:none;">
							<h:outputText value="Regresar" style="color:white !important; text-decoration:none;" />
						</h:outputLink>
					</t:div>
				</t:div>
			</t:div>
			<t:div styleClass="contenido-informacion-paginas-buscadores"
				rendered="#{!manejadorEnsayoLaboratorioBusqueda.error}">
				<t:div styleClass="cabezote-informacion-pagina-buscador">
					<h:outputText value="Laboratorio" />
				</t:div>
				<t:div styleClass="contenedor-informacion" style="border-radius:0px; margin-top:0px; padding-left:16px;">
					<t:div styleClass="contenido-nombre" style="padding-left:16px;">
						<h:outputText
							value="#{manejadorEnsayoLaboratorioBusqueda.laboratorioActual.nombre}" />
					</t:div>
					<t:div styleClass="titulo-informacion"  style="margin-left:16px; width:640px;">
					</t:div>
					<t:div styleClass="menu-paginas-buscadores"
						style="padding-left:16px;">
						
						<a href="#descripcion">Descripción</a>
						
						<h:outputText rendered="#{manejadorEnsayoLaboratorioBusqueda.laboratorioActual.gestionAcreditacionNorma != null and manejadorEnsayoLaboratorioBusqueda.laboratorioActual.gestionAcreditacion==50}"> | </h:outputText>
						<h:outputLink rendered="#{manejadorEnsayoLaboratorioBusqueda.laboratorioActual.gestionAcreditacionNorma != null and manejadorEnsayoLaboratorioBusqueda.laboratorioActual.gestionAcreditacion==50}" value="#acreditacion"> Acreditación </h:outputLink>
						

						<h:outputText> | </h:outputText>
						
						<a href="#coordinador">Coordinador(a)</a>

						<h:outputText> | </h:outputText>

						<a href="#servicios">Servicios ofrecidos</a>

						<h:outputText> | </h:outputText>

						<a href="#equipos">Equipos robustos y/o especializados</a>
						
						
						<br />
						<br />
					</t:div>
					<t:div styleClass="informacion">
						<h:panelGrid columns="1">
						<a name="descripcion">
						<t:div styleClass="informacion-titulo">
									<h:outputText value="Descripción" />
								</t:div>
							<t:div styleClass="informacion-texto" style="width: 640px;">
									<h:outputText rendered="#{not empty manejadorEnsayoLaboratorioBusqueda.laboratorioActual.descripcion}"
										value="#{manejadorEnsayoLaboratorioBusqueda.laboratorioActual.descripcion} " />
									<t:div styleClass="informacion-subtexto"
									rendered="#{empty manejadorEnsayoLaboratorioBusqueda.laboratorioActual.descripcion}"
									style="text-align: center; font-weight: bold; width: 640px; padding-bottom: 40px;">
									<h:outputText value="La descripción del laboratorio no está disponible." />
								</t:div>
							</t:div>
						</a>
						<a name="acreditacion">
							<t:div styleClass="informacion-titulo" rendered="#{manejadorEnsayoLaboratorioBusqueda.laboratorioActual.gestionAcreditacionNorma != null and manejadorEnsayoLaboratorioBusqueda.laboratorioActual.gestionAcreditacion==50}">
									<h:outputText value="Acreditación" />
								</t:div>
							<t:div styleClass="informacion-texto" style="width: 640px;" rendered="#{manejadorEnsayoLaboratorioBusqueda.laboratorioActual.gestionAcreditacionNorma != null and manejadorEnsayoLaboratorioBusqueda.laboratorioActual.gestionAcreditacion==50}">
									<h:outputText style="font-weight:bold;"
										value="Norma: " />
									<h:outputText 
										value="#{manejadorEnsayoLaboratorioBusqueda.laboratorioActual.gestionAcreditacionNorma} " />
							</t:div>
						</a>
							<a name="coordinador">
							
								<t:div styleClass="informacion-titulo">
									<h:outputText value="Coordinador(a)" />
								</t:div>
								
								<t:div styleClass="informacion-texto" style="width: 640px;">
									<t:div styleClass="informacion-subtitulo-link" rendered="#{not empty manejadorEnsayoLaboratorioBusqueda.coordinadorLaboratorioActual}">
										<h:outputLink target="_blank"
												value="#{facesContext.externalContext.requestContextPath}/pages/Docentes/Docente.jsf?u=#{manejadorEnsayoLaboratorioBusqueda.emailPersona}">
												<img
													src="#{facesContext.externalContext.requestContextPath}/images/her-paginas/icono_enlace.png"
													style="border: none; width: 16px;" />
												<h:outputText
													value=" #{manejadorEnsayoLaboratorioBusqueda.coordinadorLaboratorioActual.persona.nombre11} 
													#{manejadorEnsayoLaboratorioBusqueda.coordinadorLaboratorioActual.persona.nombre22} 
													#{manejadorEnsayoLaboratorioBusqueda.coordinadorLaboratorioActual.persona.apellido11} 
													#{manejadorEnsayoLaboratorioBusqueda.coordinadorLaboratorioActual.persona.apellido22}"
													style="font-weight: bold;" />
										</h:outputLink>
									</t:div>
									
									<t:div styleClass="informacion-subtexto"
									rendered="#{empty manejadorEnsayoLaboratorioBusqueda.coordinadorLaboratorioActual}"
									style="text-align: center; font-weight: bold; width: 640px; padding-bottom: 40px;">
									<h:outputText value="El laboratorio no tiene coordinador asociado." />
									
									</t:div>
								</t:div>
							</a>
							
							<a name="servicios">
							<t:div styleClass="informacion-titulo">
								<h:outputText value="Servicios ofrecidos" />
							</t:div>
							
							<t:div styleClass="informacion-texto" style="width: 640px;">
								<t:dataList
										var="ensayoActual"
										value="#{manejadorEnsayoLaboratorioBusqueda.ensayosServiciosActuales}"
										layout="unorderedList"
										paginator="true"
										paginatorPosition="bottom" paginatorAlwaysVisible="false"
										rendered="#{not empty manejadorEnsayoLaboratorioBusqueda.ensayosServiciosActuales}"
										emptyMessage="No existen ensayos asociados">
										<h:outputText value="#{ensayoActual.nombre}"/>
										<h:outputText value=" - ACREDITADO" style="font-weight: bold;" rendered="#{ensayoActual.acreditado}" />
										<h:outputText value=" - NORMA TÉCNICA (#{ensayoActual.tipoNormaTecnica.nombre} #{ensayoActual.numeroNormaTecnica})" 
													  style="font-weight: bold;" rendered="#{ensayoActual.tipoNormaTecnica != null and ensayoActual.numeroNormaTecnica != null}" />
								</t:dataList>
								<t:div styleClass="informacion-subtexto"
									rendered="#{empty manejadorEnsayoLaboratorioBusqueda.ensayosServiciosActuales}"
									style="text-align: center; font-weight: bold; width: 640px; padding-bottom: 40px;">
									<h:outputText value="El laboratorio no tiene servicios asociados." />
								</t:div>
							</t:div>
							</a>
						
							<a name="equipos">
								<t:div styleClass="informacion-titulo">
									<h:outputText value="Equipos robustos y/o especializados" />
								</t:div>
								<t:div styleClass="informacion-texto" style="width: 640px;">
									<p:panelGrid styleClass="estilo-panelgrid-sinbordes" rendered="#{not empty manejadorEnsayoLaboratorioBusqueda.equiposActuales}">
									        	<p:row>
									        		<p:column style="width:100px; text-align:center; font-weight:bold;"><h:outputText value="Cantidad"/></p:column>
									        		<p:column style="width:540px; font-weight:bold;"><h:outputText value="Descripción equipo"/></p:column>
									        		<p:column style="width:150px; text-align:center; font-weight:bold;"><h:outputText value="Especializado"/></p:column>
										        	<p:column style="width:100px; text-align:center; font-weight:bold;"><h:outputText value="Robusto"/></p:column>
									        	</p:row>
									</p:panelGrid>
									<p:dataList rendered="#{not empty manejadorEnsayoLaboratorioBusqueda.equiposActuales}"
										value="#{manejadorEnsayoLaboratorioBusqueda.equiposActuales}"
										var="equipoActual" type="definition" style="border:none;">
		
											<p:panelGrid styleClass="estilo-panelgrid-sinbordes" style="margin-top:-8px;">
											        	<p:row>
											        		<p:column style="width:100px; text-align:center;"><h:outputText value="#{equipoActual.estadoFisico}"/></p:column>
											        		<p:column style="width:540px;"><h:outputText  value="#{equipoActual.equipo}"/></p:column>
											        		<p:column style="width:150px;"><h:outputText  value="#{equipoActual.especializado ? 'Si' : 'No'}"/></p:column>
											        		<p:column style="width:100px; text-align:center;"><h:outputText  value="#{equipoActual.robusto ? 'Si' : 'No'}"/></p:column>
											        	</p:row>
											</p:panelGrid>
									</p:dataList>
									<t:div styleClass="informacion-subtexto"
										rendered="#{empty manejadorEnsayoLaboratorioBusqueda.equiposActuales}"
										style="text-align: center; font-weight: bold; width: 640px; padding-bottom: 40px;">
										<h:outputText value="El laboratorio no tiene equipos asociados." />
									</t:div>
								</t:div>
							</a>
						
						</h:panelGrid>
					</t:div>
				</t:div>
				<t:div styleClass="final-contenedor-informacion" />
			</t:div>
			
		</h:form>
	</ui:define>
</ui:composition>
