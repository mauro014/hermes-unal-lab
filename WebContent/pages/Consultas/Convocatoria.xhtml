<?xml version='1.0' encoding='ISO-8859-1' ?>
<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:t="http://myfaces.apache.org/tomahawk"
	xmlns:s="http://myfaces.apache.org/sandbox"
	template="../../templates/her-plantillaBasica.xhtml">
	<ui:define name="content">
		 <h:form>
			<img src="#{facesContext.externalContext.requestContextPath}/images/her-paginas/cabezote.png" style="margin-bottom: 10px; border-radius:10px;" />
			<t:div rendered="#{manejadorConvocatoriaBusqueda.error}">
				<t:div styleClass="contenido-menu-paginas-buscadores">
						<t:div styleClass="menu-superior">
								<p:graphicImage id="localCroppedImage3"
									value="/images/imagen_convocatorias.png" />
							<BR />
							<BR />
							<t:div styleClass="regresar-buscador-docente" style="margin-top:10px;">
								<h:outputLink value="#{facesContext.externalContext.requestContextPath}/pages/principal/Principal.xhtml">
									<h:outputText value="Regresar" style="color:white !important;" />
								</h:outputLink>
							</t:div>
					</t:div>
				</t:div>
				<t:div styleClass="contenido-informacion-paginas-buscadores" style="height:650px; padding:20px; font-size:16px; padding-top:50px;">
					<h:outputText value="Lo sentimos!" style="font-weight:bold; font-size: 24px;" /><br /><br />
					<h:outputText value="No hemos encontrado la convocatoria." style="font-weight:bold;" />
				</t:div>
			</t:div>
			<t:div styleClass="contenido-menu-paginas-buscadores" rendered="#{!manejadorConvocatoriaBusqueda.error}">
				<t:div styleClass="menu-superior">

					<p:graphicImage id="localCroppedImage3"
						value="/images/imagen_convocatorias.png" />
					<br />
					<br />
					<h:outputText value="Dependencia:" style="font-weight:bold;" />
					<br />
						<h:outputText value="#{manejadorConvocatoriaBusqueda.convocatoriaPadreActual.dependencia.nombre}" />
					<br />
					<br />
					<h:outputText value="Año:" style="font-weight:bold;" />
					<br />
					<h:outputText value="#{manejadorConvocatoriaBusqueda.convocatoriaPadreActual.ano}" />
					<br />
					<br />
					<h:outputText value="Estado:" style="font-weight:bold;" />
					<br />
					<h:outputText value="#{manejadorConvocatoriaBusqueda.convocatoriaPadreActual.estadoConvocatoria.nombre}" />
					<br />
					<br />
					<t:div styleClass="separador" style="width:195px;"></t:div>
					<br />
					<t:div styleClass="regresar-buscador-docente" style="width:194px;">
						<h:outputLink value="#{facesContext.externalContext.requestContextPath}/pages/Consultas/BuscadorConvocatorias.xhtml" style="text-decoration:none;">
							<h:outputText value="Regresar" style="color:white !important; text-decoration:none;" />
						</h:outputLink>
					</t:div>
				</t:div>
			</t:div>
			
			<t:div  styleClass="contenido-informacion-paginas-buscadores"  rendered="#{!manejadorConvocatoriaBusqueda.error}" style="border: 1px solid #DDD;">
				<t:div styleClass="cabezote-informacion-pagina-buscador">
					<h:outputText value="Convocatorias" />
				</t:div>
				<t:div styleClass="contenedor-informacion" style="border-radius:0px; margin-top:0px; padding-left:16px;">
					<t:div styleClass="contenido-nombre" style="padding-left: 5px;">
						<h:outputText value="#{manejadorConvocatoriaBusqueda.convocatoriaPadreActual.titulo}"/>
					</t:div>
					<t:div styleClass="titulo-informacion" >
					</t:div>
					
					<t:div styleClass="menu-paginas-buscadores"
						style="padding-left:16px;">
						
						<a href="#modalidades">Modalidades</a>
						<h:outputText> | </h:outputText>
						<a href="#infoAdicional">Información adicional</a>
						<h:outputText> | </h:outputText>
						<a href="#documentos">Documentos del proceso</a>
						<br />
						<br />
					</t:div>				
					
					<t:div styleClass="informacion" >
						<h:panelGrid columns="1">
						<a name="modalidades">
						<t:div
									styleClass="informacion-titulo">
									<h:outputText value="Modalidades" />
								</t:div>
								<t:div styleClass="informacion-texto">
								<t:dataTable
						         value              = "#{manejadorConvocatoriaBusqueda.listaModalidades}" 
						       	var="modalidad">
						       	<t:column>
							       	<t:div styleClass="informacion-subtitulo" style="padding-bottom: 22px; padding-top: 10px; width: 640px; font-size: 12px;">
							       		<t:div  style="margin: 0px; padding: 0px;"><t:div style="float: left; padding-top: 5px; padding-right: 7px; margin-"><f:verbatim><img src="#{facesContext.externalContext.requestContextPath}/images/her-paginas/punto_listado.png" style="padding-bottom: 10px;" />
							       		</f:verbatim></t:div><t:div style="display: table; font-weight:bold;"><h:outputText value="#{modalidad.titulo} "/></t:div></t:div>
									</t:div>
							       	<t:div styleClass="informacion-texto"   style=" border: 0px; padding-left: 12px; padding-bottom: 0px;">	
							       		
										<t:div styleClass="informacion-subtexto" style="padding-bottom: 0px;">
											<h:outputText value="#{modalidad.objetivo} "/>
										</t:div>
										<t:div styleClass="informacion-subtitulo" style="padding-top: 10px; ">
											<h:outputText value="Oferente"/>
										</t:div>
										<t:div styleClass="informacion-subtexto" style="padding-bottom: 8px; padding-top: 5px;">
											<h:outputText value="#{modalidad.oferente} "/>
										</t:div>
										<t:div styleClass="informacion-subtitulo" style="padding-top: 10px;">
											<h:outputText value="Fecha de inicio"/>
										</t:div>
										<t:div styleClass="informacion-subtexto" style="padding-bottom: 8px; padding-top: 5px;">
											<h:outputText value="#{modalidad.fechaInicio} "/>
										</t:div>
										<t:div styleClass="informacion-subtitulo" style="padding-top: 10px; ">
											<h:outputText value="Fecha de finalización"/>
										</t:div>
										<t:div styleClass="informacion-subtexto" style="padding-bottom: 8px; padding-top: 5px;">
											<h:outputText value="#{modalidad.fechaFinal} "/>
										</t:div>
										<t:div styleClass="informacion-subtitulo" style="padding-top: 10px; ">
											<h:outputText value="Monto apoyo a ganadores"/>
										</t:div>
										<t:div styleClass="informacion-subtexto" style="padding-bottom: 0px; padding-top: 5px;">
											<h:outputText value="#{modalidad.montoApoyoGanadores} "/>
										</t:div>
							       	</t:div>
						       	</t:column>
						     </t:dataTable>
							</t:div>
								
						</a>
						<a name="infoAdicional">
						<t:div
									styleClass="informacion-titulo">
									<h:outputText value="Información adicional" />
								</t:div>
							<t:div rendered="#{!empty manejadorConvocatoriaBusqueda.convocatoriaPadreActual.vinculo}">
						    	<h:outputText value="Para mayor información " />
							     <h:outputLink value="#{manejadorConvocatoriaBusqueda.convocatoriaPadreActual.vinculo}" target="_blank"
							     			style="text-decoration:none; 
											color: #16A8E2; font-weight: bold;">			
									<h:outputText value="clic aquí" />
								</h:outputLink>
							</t:div>
							<t:div styleClass="informacion-texto">
								<t:div styleClass="informacion-subtexto"  style="padding-bottom: 0px; "  rendered="#{manejadorConvocatoriaBusqueda.esInformacionAdicional}">
									<h:outputText escape="false" value="#{manejadorConvocatoriaBusqueda.convocatoriaPadreActual.informacion}" />
								</t:div>
							<t:div styleClass="informacion-subtexto"
									rendered="#{!manejadorConvocatoriaBusqueda.esInformacionAdicional and empty manejadorConvocatoriaBusqueda.convocatoriaPadreActual.vinculo}"
									style="text-align: center; font-weight: bold; width: 640px; padding-bottom: 40px;">
									<h:outputText value="Sin información adicional de la convocatoria" />
								</t:div>
							</t:div>
						</a>

						<a name="documentos">
							<t:div styleClass="informacion-titulo">
								<h:outputText value="Documentos del proceso"/>
							</t:div>
						<t:div styleClass="informacion-texto">
							<t:dataTable
						         preserveDataModel  = "false"
						         value              = "#{manejadorConvocatoriaBusqueda.archivosProceso}" 
						       	var="archivo" rendered="#{manejadorConvocatoriaBusqueda.visibleDocumentosProceso}">
							       	<t:column>
						       			<p:commandButton id="downloadLink" value="" ajax="false" onclick="PrimeFaces.monitorDownload(start, stop)"   
										        icon="ui-icon-arrowthickstop-1-s" style="height: 30px; width: 30px;">  
										    <p:fileDownload value="#{archivo}" />
										</p:commandButton>
									</t:column>
							       	<t:column>
							       		<t:div styleClass="informacion-subtexto" style="padding-bottom: 0px; font-size: 12px;">
											<h:outputText value="#{archivo.contentType}"  />
										</t:div>
							       	</t:column>
								</t:dataTable>
								<t:div styleClass="informacion-subtexto"
									rendered="#{!manejadorConvocatoriaBusqueda.visibleDocumentosProceso}"
									style="text-align: center; font-weight: bold; width: 640px; padding-bottom: 40px;">
									<h:outputText value="Sin documentos disponibles" />
								</t:div>
							</t:div>
						</a>
						</h:panelGrid>
					</t:div>
				
				</t:div>
				<t:div styleClass="final-contenedor-informacion" />
			</t:div>
		</h:form>	
	</ui:define>
</ui:composition>
