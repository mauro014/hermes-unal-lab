<?xml version='1.0' encoding='ISO-8859-1' ?>
<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:t="http://myfaces.apache.org/tomahawk"
	xmlns:s="http://myfaces.apache.org/sandbox"
	template="../../templates/common.xhtml">

<ui:define name="content">
<h:form>

<h:form>
 <br /><center> 
 <h:outputText value="Han sido encontrados #{manejadorConsultas.tamañoListaInvestigadores} investigadores " styleClass="titulo"/> 
 </center><br />

 <div style="overflow:auto; width:100%; height:200px">  
 
 <t:buffer into= "#{tablaInvestigadores}">    
   <h:dataTable id			  = "tablaResultadoInvestigadores"
   				styleClass    = "tablaSimple"                
                headerClass   = "cabeceraSimple"
                
                var           = "investigador"
                value         = "#{manejadorConsultas.listaInvestigadores}" 
                binding       = "#{manejadorConsultas.tablaConsultas}"
                rows		  = "25">	               
    <h:column>
      <f:facet name="header">
       <h:outputText value="Nombre del investigador" styleClass="titulo"/>
      </f:facet>                
      <h:commandLink action="#{manejadorConsultas.setObjetoActual}" styleClass="linkSimple">
       <h:outputText value="#{investigador.apellido1} #{investigador.apellido2} #{investigador.nombre1} #{investigador.nombre2}"/>
      </h:commandLink>                
    </h:column>
    
   </h:dataTable>
  </t:buffer>
  </div>
   <br /><center>
   <t:buffer into="#{tablaScrollerInvestigadores}">
	<h:panelGrid columns="1" >
       <t:dataScroller id="scrollInvestigadores"
                       for="tablaResultadoInvestigadores"
                       fastStep="5"
                       pageCountVar="pageCount"
                       pageIndexVar="pageIndex"
                       paginator="true"
                       paginatorMaxPages="9"
                       paginatorTableClass="paginator"
                       paginatorActiveColumnStyle="font-weight:bold;">
			<f:facet name="first">
				<t:outputText  value = "<<"/>
	        </f:facet>
	        
	        <f:facet name="previous">
				<t:outputText  value = "<"/>
	        </f:facet>

			<f:facet name="next">
				<t:outputText  value = ">"/>
	        </f:facet>
	        
	        <f:facet name="last">
				<t:outputText  value = ">>"/>
	        </f:facet>

		</t:dataScroller>
	</h:panelGrid>
  </t:buffer>
  
  <h:outputText value="#{tablaScrollerInvestigadores}" escape="false"/>
  <h:outputText value="#{tablaInvestigadores}" escape="false"/>
  <h:outputText value="#{tablaScrollerInvestigadores}" escape="false"/>
   <center>
	 <br />
      
   <h:commandLink action="#{manejadorConsultas.volver_busqueda}" styleClass="linkResaltado">
	 <h:outputText value="[Nueva búsqueda]"/>
   </h:commandLink>
  </center>
 </h:form></h:form>
</ui:define>
</ui:composition>
