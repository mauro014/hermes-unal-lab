<?xml version='1.0' encoding='ISO-8859-1' ?>
<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:t="http://myfaces.apache.org/tomahawk"
	xmlns:s="http://myfaces.apache.org/sandbox"
	template="../../templates/her-plantillaBasica.xhtml">

	<ui:define name="content">
		<h:form>
			<img src="#{facesContext.externalContext.requestContextPath}/images/her-paginas/cabezote.png" style="padding-bottom: 10px;" />
			<t:div  styleClass="contenido-informacion"  rendered="#{!manejadorPersonaBusqueda.error}" >
				<t:div styleClass="cabezote-informacion-pagina-buscador">
					<h:outputText value="Investigadores" />
				</t:div>
				<t:div styleClass="contenedor-informacion"  >
					<t:div styleClass="contenido-nombre">
						<h:outputText
							value="#{manejadorPersonaBusqueda.investigadorActual.nombre1} #{manejadorPersonaBusqueda.investigadorActual.apellido1} #{manejadorPersonaBusqueda.investigadorActual.apellido2}" />
					</t:div>
					<t:div styleClass="titulo-informacion" >
						<img src="#{facesContext.externalContext.requestContextPath}/images/her-paginas/#{manejadorPersonaBusqueda.tituloActual}" />
					</t:div>
					<t:div styleClass="informacion" style="width: 660px;">
						<t:div styleClass="informacion-titulo">
							<h:outputText value="E-mail " />
						</t:div>
						<t:div styleClass="informacion-texto" style="width: 660px;">
								<h:outputText value="#{manejadorPersonaBusqueda.investigadorActual.email}"/>
						</t:div>
						<t:div styleClass="informacion-titulo">
							<h:outputText value="Proyectos " />
						</t:div>
						<t:div styleClass="informacion-texto" >
							<t:dataList
								binding="#{manejadorPersonaBusqueda.dataListProyectosInvestigador}"
								var="investigadorProyecto"
								value="#{manejadorPersonaBusqueda.investigadorActual.proyectosInvestigador}"
								layout="unorderedList" emptyMessage="No tiene proyectos asociados">
	
							    <t:div styleClass="informacion-subtitulo">
									<h:outputLink
										value="#{facesContext.externalContext.requestContextPath}/pages/Consultas/Proyecto.xhtml?idProyecto=#{investigadorProyecto.proyecto.id}&amp;opcion=1">
										<h:outputText value="#{investigadorProyecto.proyecto.nombre}" />
									</h:outputLink>
								</t:div>
	
							</t:dataList>
						</t:div>
						<t:div styleClass="informacion-titulo">
							<h:outputText value="Grupos " />
						</t:div>
						<t:div styleClass="informacion-texto" >
							<t:dataList
								binding="#{manejadorPersonaBusqueda.dataListGruposInvestigador}"
								var="investigadorGrupo"
								value="#{manejadorPersonaBusqueda.investigadorActual.gruposInvestigador}"
								layout="unorderedList">
	
							    <t:div styleClass="informacion-subtitulo">
									<h:outputLink value="#{facesContext.externalContext.requestContextPath}/pages/Consultas/Grupo.xhtml?idGrupo=#{investigadorGrupo.grupo.id}&amp;opcion=1">
										<h:outputText value="#{investigadorGrupo.grupo.nombre}" />
									</h:outputLink>
								</t:div>
	
							</t:dataList>
						</t:div>
						<t:div styleClass="informacion-titulo">
							<h:outputText value="Colciencias " />
						</t:div>
						<t:div styleClass="informacion-texto" style="width: 660px;">
							    <t:div styleClass="informacion-subtitulo">
									<h:outputLink
										value="#{manejadorPersonaBusqueda.investigadorActual.urlColciencias}">
										<h:outputText value="Hoja de vida CVLAC" />
									</h:outputLink>
								</t:div>
						</t:div>
						<t:div styleClass="informacion-titulo">
							<h:outputText value="Hoja de vida en línea " />
						</t:div>
						<t:div styleClass="informacion-texto" style="width: 660px;">
							    <t:div styleClass="informacion-subtitulo">
									<h:outputLink
										value="http://www.docentes.unal.edu.co/#{manejadorPersonaBusqueda.investigadorActual.uid}">
										<h:outputText value="Hoja de vida WEBDOCENTE" />
									</h:outputLink>
								</t:div>
						</t:div>
					</t:div>
				</t:div>
				<t:div styleClass="final-contenedor-informacion" />
			</t:div>
			<t:div  styleClass="contenido-menu"  rendered="#{!manejadorPersonaBusqueda.error}" >
				<t:div styleClass="menu-superior">
					<t:div styleClass="cabezote-derecho-menu">
						<h:outputText value="Acerca del grupo" />
					</t:div>
					<t:div styleClass="menu" >
						<ul>
							<li>
								<h:form> 
									<h:outputLink value="#{manejadorPersonaBusqueda.informacionBasica}" onclick="submit()">			
										<h:outputText value="Información general" />
									</h:outputLink>
								</h:form>
							</li>
							<li>
								<h:form> 
									<h:outputLink value="#{facesContext.externalContext.requestContextPath}/pages/Consultas/BuscadorInvestigadores.xhtml">			
										<h:outputText value="Regresar al buscador" />
									</h:outputLink>
								</h:form>
							</li>
						</ul>
					</t:div>
				</t:div>
			</t:div>


			</h:form>
	</ui:define>
</ui:composition>
