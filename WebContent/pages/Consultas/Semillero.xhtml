<?xml version='1.0' encoding='ISO-8859-1' ?>
<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:t="http://myfaces.apache.org/tomahawk"
	xmlns:s="http://myfaces.apache.org/sandbox"
	template="../../templates/commonBuscador.xhtml">
	<ui:define name="menu">
		<h:form>
			<t:div styleClass="menu-superior"
				rendered="#{!manejadorSemillerosBusqueda.error}">
				<h:outputText value="E-mail de Semillero:" style="font-weight:bold;" />
				<br />
				<h:outputText
					value="#{manejadorSemillerosBusqueda.semilleroActual.email}" />
				<br />
				<br />
				<h:outputText value="E-mail de Lider:" style="font-weight:bold;" />
				<br />
				<h:outputText
					value="#{manejadorSemillerosBusqueda.semilleroActual.lider.email}" />
				<br />
				<br />
				<h:outputText value="Estado UN:" style="font-weight:bold;" />
				<br />
				<h:outputText
					value="#{manejadorSemillerosBusqueda.semilleroActual.estadoActual.nombre}" />
				<br />
				<br />
				<img
					src="#{facesContext.externalContext.requestContextPath}/images/her-paginas/icono_pdf.png"
					style="border: none; width: 18px; margin-bottom: 5px;" />
				<br />
				<h:commandLink value="Descargar resultado de búsqueda"
					action="#{manejadorSemillerosBusqueda.reporteSemilleroBusqueda}"
					target="_popUpWindow1"
					onclick="javascript: void window.open('', '_popUpWindow1', 'status=0,toolbar=0,location=0,directories=0,menubar=0,resizable,width=750,height=500,scrollbars,left=0,top=0');"
					style="text-decoration:none; 
										color: #16A8E2;
										font-weight: bold;">
					<f:param name="id"
						value="#{manejadorSemillerosBusqueda.semilleroActual.id}" />
				</h:commandLink>
			</t:div>
		</h:form>
	</ui:define>
	<ui:define name="content">
		<t:div styleClass="contenido-informacion-paginas-buscadores"
			rendered="#{manejadorSemillerosBusqueda.error}"
			style="height:650px; padding:20px; font-size:16px; padding-top:50px; width: 100%;">
			<img
				src="#{facesContext.externalContext.requestContextPath}/images/her-error/Logo_H.png"
				style="border: none;" />
			<br />
			<br />
			<h:outputText value="Lo sentimos!"
				style="font-weight:bold; font-size: 24px;" />
			<br />
			<br />
			<h:outputText value="No hemos encontrado el semillero solicitado."
				style="font-weight:bold;" />
		</t:div>
		<h:form rendered="#{!manejadorSemillerosBusqueda.error}">
			<t:div styleClass="contenido-nombre" style="padding-left:16px;">
				<h:outputText
					value="#{manejadorSemillerosBusqueda.semilleroActual.nombre}" />
			</t:div>
			<t:div styleClass="titulo-informacion"
				style="margin-left:16px; width:640px;">
			</t:div>
			<t:div styleClass="menu-paginas-buscadores"
				style="padding-left:16px;">
				<a href="#presentacion">Presentación</a>
				<h:outputText> | </h:outputText>
				<a href="#objetivo">Objetivo</a>
				<h:outputText> | </h:outputText>
				<a href="#enfoque">Enfoque</a>
				<h:outputText> | </h:outputText>
				<a href="#lider">Líder</a>
				<h:outputText> | </h:outputText>
				<a href="#sede">Sede</a>
				<h:outputText> | </h:outputText>
				<a href="#facultad">Facultad</a>
				<h:outputText> | </h:outputText>
				<a href="#articulacion">Articulación con grupos de investigación</a>
				<h:outputText> | </h:outputText>
				<a href="#areas">Áreas</a>
				<h:outputText> | </h:outputText>
				<a href="#agendas">Agendas de conocimiento</a>
				<h:outputText> | </h:outputText>
				<a href="#lineas">Líneas de trabajo</a>
				<h:outputText> | </h:outputText>
				<a href="#ods">Objetivos de desarrollo sostenible</a>
				<h:outputText> | </h:outputText>
				<a href="#integrantes">Integrantes</a>
				<h:outputText> | </h:outputText>
				<a href="#laboratorios">Laboratorios</a>
				<h:outputText> | </h:outputText>
				<a href="#grupos">Grupos de investigación</a>
				<h:outputText> | </h:outputText>
				<a href="#proyectos">Proyectos asociados</a>
				<h:outputText> | </h:outputText>
			</t:div>
			<t:div styleClass="informacion" style="float: none;">
				<h:panelGrid columns="1">
					<a name="presentacion"> <t:div styleClass="informacion-titulo">
							<h:outputText value="Presentacion" />
						</t:div> <t:div styleClass="informacion-texto" style="width: 640px;">
							<h:outputText
								value="#{manejadorSemillerosBusqueda.semilleroActual.presentacion}" />
						</t:div>
					</a>
					<a name="objetivo"> <t:div styleClass="informacion-titulo">
							<h:outputText value="Objetivo" />
						</t:div> <t:div styleClass="informacion-texto" style="width: 640px;">
							<h:outputText
								value="#{manejadorSemillerosBusqueda.semilleroActual.objetivoGeneral}" />
						</t:div>
					</a>
					<a name="enfoque"> <t:div styleClass="informacion-titulo">
							<h:outputText value="Enfoque" />
						</t:div> <t:div styleClass="informacion-texto" style="width: 640px;">
							<h:outputText
								value="#{manejadorSemillerosBusqueda.semilleroActual.enfoque}" />
						</t:div>
					</a>
					<a name="lider"> <t:div styleClass="informacion-titulo">
							<h:outputText value="Líder" />
						</t:div> <t:div styleClass="informacion-texto" style="width: 640px;">
							<t:div styleClass="informacion-subtitulo-link">
								<h:outputLink target="_blank"
									value="#{facesContext.externalContext.requestContextPath}/pages/Docentes/Docente.jsf?u=#{manejadorSemillerosBusqueda.semilleroActual.usuarioLider}">
									<img
										src="#{facesContext.externalContext.requestContextPath}/images/her-paginas/icono_enlace.png"
										style="border: none; width: 16px;" />
									<h:outputText
										value="#{manejadorSemillerosBusqueda.semilleroActual.lider.nombreCompleto}" />
								</h:outputLink>
							</t:div>
						</t:div>
					</a>
					<a name="sede"> <t:div styleClass="informacion-titulo">
							<h:outputText value="Sede" />
						</t:div> <t:div styleClass="informacion-texto" style="width: 640px;">
							<h:outputText
								value="#{manejadorSemillerosBusqueda.semilleroActual.lider.dependencia.sede.nombre}" />
						</t:div>
					</a>
					<a name="facultad"> <t:div styleClass="informacion-titulo">
							<h:outputText value="Facultad" />
						</t:div> <t:div styleClass="informacion-texto" style="width: 640px;">
							<h:outputText
								value="#{manejadorSemillerosBusqueda.semilleroActual.lider.dependencia.facultad.nombre}" />
						</t:div>
					</a>
					<a name="articulacion"> <t:div styleClass="informacion-titulo">
							<h:outputText value="Articulación con grupos de investigación" />
						</t:div> <t:div styleClass="informacion-texto" style="width: 640px;">
							<h:outputText
								value="#{manejadorSemillerosBusqueda.semilleroActual.pertinencia}" />
						</t:div>
					</a>
					<a name="areas"> <t:div styleClass="informacion-titulo">
							<h:outputText value="Áreas" />
						</t:div> <t:div styleClass="informacion-texto" style="width: 640px;">
							<t:div styleClass="informacion-subtexto-uppercase">
								<h:outputText
									value="#{manejadorSemillerosBusqueda.areaOCDEP} - #{manejadorSemillerosBusqueda.subAreaOCDEP}" />
							</t:div>
							<t:div styleClass="informacion-subtitulo">
								<h:outputText value="Áreas OCDE secundarias" />
							</t:div>
							<t:div styleClass="informacion-subtexto"
								style="padding-bottom: 0px; width: 640px;">
								<t:dataList var="area"
									value="#{manejadorSemillerosBusqueda.semilleroActual.listaAreasOCDESecundarias}"
									layout="unorderedList">
									<h:outputText
										value="#{area.areaOCDE.descripcion} - #{area.subAreaOCDE.descripcion}" />
								</t:dataList>
							</t:div>
						</t:div>
					</a>
					<a name="agendas"> <t:div styleClass="informacion-titulo">
							<h:outputText value="Agendas de conocimiento" />
						</t:div> <t:div styleClass="informacion-texto" style="width: 640px;">
							<t:div styleClass="informacion-subtexto-uppercase">
								<h:outputText
									value="#{manejadorSemillerosBusqueda.semilleroActual.agendaPrincipal.nombre}" />
							</t:div>
							<t:div styleClass="informacion-subtitulo">
								<h:outputText value="Agendas de conocimiento secundarias" />
							</t:div>
							<t:div styleClass="informacion-subtexto"
								style="padding-bottom: 0px; width: 640px;">
								<t:dataList var="agenda"
									value="#{manejadorSemillerosBusqueda.semilleroActual.listaAgendasSecundarias}"
									layout="unorderedList">
									<h:outputText value="#{agenda.agenda.nombre}" />
								</t:dataList>
							</t:div>
						</t:div>
					</a>
					<a name="lineas"> <t:div styleClass="informacion-titulo">
							<h:outputText value="Líneas de trabajo" />
						</t:div> <t:div styleClass="informacion-texto" style="width: 640px;">
							<t:div styleClass="informacion-subtexto-uppercase">
								<t:dataList var="linea"
									value="#{manejadorSemillerosBusqueda.semilleroActual.listaLineasInvestigacion}"
									layout="unorderedList">
									<h:outputText value="#{linea.linea.nombre}" />
								</t:dataList>
							</t:div>
						</t:div>
					</a>
					<a name="ods"> <t:div styleClass="informacion-titulo">
							<h:outputText value="Objetivos de desarrollo sostenible" />
						</t:div> <t:div styleClass="informacion-texto" style="width: 640px;">
							<t:div styleClass="informacion-subtexto-uppercase">
								<h:outputText value="#{manejadorSemillerosBusqueda.ODSP}" />
							</t:div>
							<t:div styleClass="informacion-subtitulo">
								<h:outputText
									value="Objetivos de desarrollo sostenible secundario" />
							</t:div>
							<t:div styleClass="informacion-subtexto"
								style="padding-bottom: 0px; width: 640px;">
								<h:outputText value="#{manejadorSemillerosBusqueda.ODSS}" />
							</t:div>
						</t:div>
					</a>
					<a name="integrantes"> <t:div styleClass="informacion-titulo">
							<h:outputText value="Integrantes" />
						</t:div> <t:div styleClass="informacion-texto" style="width: 640px;">
							<t:div styleClass="informacion-subtexto-uppercase">
								<t:dataTable preserveDataModel="false"
									value="#{manejadorSemillerosBusqueda.semilleroActual.listaIntegrantes}"
									var="integrante">
									<h:column>
										<t:div styleClass="informacion-subtitulo">
											<h:outputLink target="_blank"
												rendered="#{integrante.tipo.id eq 'D' or integrante.tipo.id eq 'DD'}"
												value="#{facesContext.externalContext.requestContextPath}/pages/Docentes/Docente.jsf">
												<f:param name="u" value="#{integrante.usuario}" />
												<img
													src="#{facesContext.externalContext.requestContextPath}/images/her-paginas/icono_enlace.png"
													style="border: none; width: 15px;" />
												<h:outputText
													value=" #{integrante.integrante.nombreCompleto}" />
											</h:outputLink>
											<h:outputText
												rendered="#{not(integrante.tipo.id eq 'D' or integrante.tipo.id eq 'DD')}"
												value="#{integrante.integrante.nombreCompleto}" />
										</t:div>
										<t:div styleClass="informacion-subtexto">
											<h:outputText
												value="#{integrante.tipo.nombre} - #{integrante.actividades}" />
										</t:div>
									</h:column>
								</t:dataTable>
							</t:div>
						</t:div>
					</a>
					<a name="laboratorios"> <t:div styleClass="informacion-titulo">
							<h:outputText value="Laboratorios" />
						</t:div> <t:div styleClass="informacion-texto" style="width: 640px;">
							<t:div styleClass="informacion-subtexto-uppercase">
								<t:dataTable preserveDataModel="false"
									value="#{manejadorSemillerosBusqueda.semilleroActual.listaLaboratorios}"
									var="laboratorio">
									<h:column>
										<t:div styleClass="informacion-subtitulo">
											<h:outputLink target="_blank"
												value="#{facesContext.externalContext.requestContextPath}/pages/Consultas/EnsayoLaboratorio.xhtml">
												<f:param name="idEnsayo"
													value="#{laboratorio.laboratorio.id}" />
												<img
													src="#{facesContext.externalContext.requestContextPath}/images/her-paginas/icono_enlace.png"
													style="border: none; width: 15px;" />
												<h:outputText value=" #{laboratorio.laboratorio.nombre}" />
											</h:outputLink>
										</t:div>
									</h:column>
								</t:dataTable>
							</t:div>
						</t:div>
					</a>
					<a name="grupos"> <t:div styleClass="informacion-titulo">
							<h:outputText value="Grupos de investigación" />
						</t:div> <t:div styleClass="informacion-texto" style="width: 640px;">
							<t:div styleClass="informacion-subtexto-uppercase">
								<t:dataTable preserveDataModel="false"
									value="#{manejadorSemillerosBusqueda.semilleroActual.listaGrupos}"
									var="grupo">
									<h:column>
										<t:div styleClass="informacion-subtitulo">
											<h:outputLink target="_blank"
												value="#{facesContext.externalContext.requestContextPath}/pages/Consultas/Grupo.jsf">
												<f:param name="idGrupo" value="#{grupo.grupo.id}" />
												<img
													src="#{facesContext.externalContext.requestContextPath}/images/her-paginas/icono_enlace.png"
													style="border: none; width: 15px;" />
												<h:outputText value=" #{grupo.grupo.nombre}" />
											</h:outputLink>
										</t:div>
									</h:column>
								</t:dataTable>
							</t:div>
						</t:div>
					</a>
					<a name="proyectos"> <t:div styleClass="informacion-titulo">
							<h:outputText value="Proyectos asociados" />
						</t:div> <t:div styleClass="informacion-texto" style="width: 640px;">
							<t:div styleClass="informacion-subtexto-uppercase">
								<t:dataTable preserveDataModel="false"
									value="#{manejadorSemillerosBusqueda.semilleroActual.listaProyectos}"
									var="proyecto">
									<h:column>
										<t:div styleClass="informacion-subtitulo">
											<h:outputLink target="_blank"
												value="#{facesContext.externalContext.requestContextPath}/pages/Consultas/Proyecto.xhtml">
												<f:param name="idProyecto" value="#{proyecto.proyecto.id}" />
												<img
													src="#{facesContext.externalContext.requestContextPath}/images/her-paginas/icono_enlace.png"
													style="border: none; width: 15px;" />
												<h:outputText value=" #{proyecto.proyecto.nombre}" />
											</h:outputLink>
										</t:div>
									</h:column>
								</t:dataTable>
							</t:div>
						</t:div>
					</a>
				</h:panelGrid>
			</t:div>
		</h:form>
	</ui:define>
</ui:composition>
