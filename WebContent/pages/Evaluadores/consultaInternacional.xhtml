<?xml version='1.0' encoding='ISO-8859-1' ?>
<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:t="http://myfaces.apache.org/tomahawk"
	xmlns:s="http://myfaces.apache.org/sandbox"
	template="../../templates/common.xhtml">

<ui:define name="content">
<h:form>


<div id=formulariointernacional><h:panelGrid columns="2"
	border="0" cellpadding="1" cellspacing="1"
	columnClasses="alignTop, alignTop">


	<h:panelGroup>

		
		<h:outputText value="Programas" styleClass="proyectoH3" />
		
			<br />
			<br />
		
		<h:panelGroup>
			<h:outputText value="Programa Nacional"
				styleClass="proyectoH4" />
		</h:panelGroup>


		<h:dataTable id="DTProyectos" var="proyectoInvestigador" align="center" border="0"
			cellpadding="6" cellspacing="3" headerClass="cabeceraSim1"
			value="#{manejadorInternacional.listaProyectosVista}"
		    rowClasses="proyectoFilas,proyectoColumnas" binding="#{manejadorInternacional.tablaProyectosActivos}"
			>
			<h:column>

				<h:panelGrid columns="2" width="420" border="0" align="left"
					style="border-right-color: #C0C0C0; border-right-style: solid; border-bottom-color: #C0C0C0; border-top-width: 1px; border-top-color: #C0C0C0; border-bottom-style: solid; border-right-width: 1px; border-left-width: 1px; border-left-style: solid; border-top-style: solid; border-left-color: #C0C0C0; border-bottom-width: 1px; background-color: #FFFFFF">
					
					<h:outputText value="Modalidad:" styleClass="labels_pro" />
					<h:outputText value=" #{proyectoInvestigador.nombreModalidad}"
						styleClass="texto" />

					<h:outputText value=" Código:" styleClass="labels_pro" />
					<h:outputText value=" #{proyectoInvestigador.id}"
						styleClass="texto" />

					<h:outputText value=" Título:" styleClass="labels_pro" />
					<h:outputText value=" #{proyectoInvestigador.nombre}"
						styleClass="texto" />
						
					<h:outputText value=" Estado:" styleClass="labels_proyecto" />
					<h:outputText value=" #{proyectoInvestigador.mensajeEstado}"
						styleClass="texto" />

				
					<h:outputText value="Acciones:" />
					<h:panelGrid columns="4" border="0" align="left">
			
										
						<h:commandLink
							action="#{manejadorInternacional.reporteProgramaNacional}"
							value="reporteProgramaNacinal|"
							style="font-style: normal; font-size: 11px; font-weight: bold; color: #0000A0; text-transform: capitalize"
							immediate="true"
							style="font-style: normal; font-size: 11px; font-weight: bold; color: #0000A0; text-transform: capitalize"
							 />
							
											
						<h:commandLink
							action="#{manejadorInternacional.reportePlanAccion}"
							value="reportePlanAccion|"
							style="font-style: normal; font-size: 11px;  font-weight: bold; color: #0000A0; text-transform: capitalize"
							immediate="true"
							style="font-style: normal; font-size: 11px;  font-weight: bold; color: #0000A0; text-transform: capitalize"
							 />	

						<h:commandLink
							action="#{manejadorInternacional.evaluarProyectoInter}"
							value="Evaluar|"
							style="font-style: normal; font-size: 11px;  font-weight: bold; color: #0000A0; text-transform: capitalize"
							immediate="true"
							style="font-style: normal; font-size: 11px;  font-weight: bold; color: #0000A0; text-transform: capitalize"
							 />
					</h:panelGrid>

					<h:outputText value="" />
								<h:panelGroup binding="#{manejadorInternacional.panelArchivos}">
							
								<br />
								<center>
							

							<h:outputText value="Archivos del proyecto"
								styleClass="normal_resultados" />
							
								<br />
								</center>
							

							<h:dataTable var="archivoResumen"
								value="#{proyectoInvestigador.listaArchivos}" cellpadding="1"
								cellspacing="8" align="center" border="1"
								binding="#{manejadorInternacional.tablaArchivos}"
								rendered="#{proyectoInvestigador.mostrarArchivos}">

								<h:column>
									<f:facet name="header">
										<h:outputText value="Nombre del archivo" />
									</f:facet>
									<h:outputText value=" #{archivoResumen.nombre}"
										styleClass="normal" />
								</h:column>

								<h:column>

									<f:facet name="header">
										<h:outputText value="Descargar" />
									</f:facet>

									<h:commandButton value="Descargar"
										action="#{manejadorInternacional.descargarArchivo}"
										image="/imgplantilla/pngtitulos/cen_descargar.png" />
								</h:column>

							</h:dataTable>
							<h:outputText value="No existen archivos asociados"
								rendered="#{!proyectoInvestigador.mostrarArchivos}"
								styleClass="labels_proyecto" />
							
								<br />
							
						</h:panelGroup>

				</h:panelGrid>
	


			</h:column>
		</h:dataTable>
	</h:panelGroup>

</h:panelGrid></div>
</h:form>
</ui:define>
</ui:composition>
