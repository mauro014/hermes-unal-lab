<?xml version='1.0' encoding='ISO-8859-1' ?>
<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:t="http://myfaces.apache.org/tomahawk"
	xmlns:s="http://myfaces.apache.org/sandbox"
	template="../../templates/common.xhtml">

<ui:define name="content">
<h:form>
<%@ taglib uri="http://java.sun.com/jstl/core_rt" prefix="c"%>


	<h2>Evaluadores Internacionales</h2>

<div id="formulariobasico">
	<br />
	<center>
 <h:panelGroup id="grupoPalabrasClave">

	<h:dataTable id="DTProyectos" var="proyectoInvestigador"
		value="#{manejadorInternacional.listaProyectosVista}" rows="3"
		cellpadding="1" cellspacing="15" rowClasses="menuusuario2"
		align="center" border="1"
		binding="#{manejadorInternacional.tablaProyectosActivos}"
		styleClass="legend1">
		<h:column>
			<h:panelGrid columns="1" border="0" cellpadding="1" cellspacing="1"
				align="center">



				<h:panelGrid columns="2" border="0" align="left">

					<h:outputText value="Modalidad:" styleClass="labels_proyecto" />
					<h:outputText value=" #{proyectoInvestigador.nombreModalidad}"
						styleClass="texto" />


					<h:outputText value=" Título:" styleClass="labels_proyecto" />
					<h:outputText value=" #{proyectoInvestigador.nombre}"
						styleClass="texto" />

					<h:outputText value=" Código:" styleClass="labels_proyecto" />
					<h:outputText value=" #{proyectoInvestigador.id}"
						styleClass="texto" />

					<h:outputText value=" Estado:" styleClass="labels_proyecto" />
					<h:outputText value=" #{proyectoInvestigador.mensajeEstado}"
						styleClass="texto" />
				</h:panelGrid>
				<h:panelGrid columns="2" border="0" align="left">
					<h:panelGrid columns="1" border="0" align="left">
						<h:panelGroup binding="#{manejadorInternacional.panelArchivos}">
							
								<br />
								<center>
							

							<h:outputText value="Archivos del proyecto"
								styleClass="normal_resultados" />
							
								<br />
								</center>
							

							<h:dataTable var="archivoResumen"
								value="#{proyectoInvestigador.listaArchivos}" cellpadding="1"
								cellspacing="8" align="center" border="1"
								binding="#{manejadorInternacional.tablaArchivos}"
								rendered="#{proyectoInvestigador.mostrarArchivos}">

								<h:column>
									<f:facet name="header">
										<h:outputText value="Nombre del archivo" />
									</f:facet>
									<h:outputText value=" #{archivoResumen.nombre}"
										styleClass="normal" />
								</h:column>

								<h:column>

									<f:facet name="header">
										<h:outputText value="Descargar" />
									</f:facet>

									<h:commandButton value="Descargar"
										action="#{manejadorInternacional.descargarArchivo}"
										image="/imgplantilla/pngtitulos/cen_descargar.png" />
								</h:column>

							</h:dataTable>
							<h:outputText value="No existen archivos asociados"
								rendered="#{!proyectoInvestigador.mostrarArchivos}"
								styleClass="labels_proyecto" />
							
								<br />
							
						</h:panelGroup>

					</h:panelGrid>

					<h:panelGrid columns="1" border="0" align="center">

						<h:commandButton
							action="#{manejadorInternacional.reporteProgramaNacional}"
							value="reporteProgramaNacinal"
							image="/imgplantilla/pngtitulos/cen_consultar_programanal.png" />

						<h:commandButton
							action="#{manejadorInternacional.reportePlanAccion}"
							value="reportePlanAccion"
							image="/imgplantilla/pngtitulos/cen_consultar_plan.png" />

						<h:commandButton
							action="#{manejadorInternacional.evaluarProyectoInter}"
							value="Evaluar"
							image="/imgplantilla/pngtitulos/cen_revisar_eval.png" />
					</h:panelGrid>
				</h:panelGrid>
			</h:panelGrid>
		</h:column>
	</h:dataTable>
</h:panelGroup> <h:panelGrid columns="1" cellpadding="3">
	<h:commandButton styleClass="btnlimpiar"
		action="#{manejadorInternacional.atras}" value="Atrás"
		immediate="true" />
</h:panelGrid> 
	</center>
</div>
</h:form>
</ui:define>
</ui:composition>
