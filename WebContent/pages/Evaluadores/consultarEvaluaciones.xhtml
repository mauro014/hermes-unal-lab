<?xml version='1.0' encoding='ISO-8859-1' ?>
<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:t="http://myfaces.apache.org/tomahawk"
	xmlns:s="http://myfaces.apache.org/sandbox"
	template="../../templates/common.xhtml">
	<ui:define name="content-title">	
		<t:div styleClass="contenido-titulo-general-myriad">Consultar Evaluaciones</t:div>
	</ui:define>
	
	<ui:define name="content">
		<h:form enctype="multipart/form-data">		
			<p:dataTable var="evaluacion" 
				value="#{manejadorConsultarEvaluaciones.evaluacionesLista}"
				tableStyle="width:auto"
				cellpadding="1" cellspacing="15" align="center">
				<f:facet name="header">
					<h:outputText value="Evaluaciones Finalizadas" />
				</f:facet>
				
				<p:column style="text-align: center;">
					<f:facet name="header">
						<h:outputText value="Convocatoria" />
					</f:facet>
										
					<h:outputText value=" #{evaluacion.nombreConvocatoria}"
						styleClass="normal" />
				</p:column>
				
				<p:column>
					<f:facet name="header">
						<t:div>
							Código<br />
							Proyecto
                    	</t:div>
					</f:facet>				
					<h:outputText value=" #{evaluacion.idProyecto}"
						styleClass="normal" />
				</p:column>
	
				<p:column style="text-align: center;">
					<f:facet name="header">
						<t:div>
							Nombre Proyecto
                    	</t:div>
					</f:facet>
					<h:outputText value=" #{evaluacion.nombreProyecto}"
						styleClass="normal" />
				</p:column>			
				
				<p:column style="text-align: center;">
					<f:facet name="header">
						<t:div>
							Fecha<br />
							Evaluación
                    	</t:div>
					</f:facet>
					<h:outputText value=" #{evaluacion.fechaEvaluacion}"
						styleClass="normal" />
				</p:column>
				
				<p:column style="text-align: center;">
					<f:facet name="header">
						<t:div>
							Consultar<br />
							Evaluación
                    	</t:div>
					</f:facet>
					<center>
						<p:commandButton icon="ui-icon-search"
							title="Consultar Evaluación"
							action="#{manejadorConsultarEvaluaciones.consultarEvaluacion}">
							<f:setPropertyActionListener value="#{evaluacion}"
								target="#{manejadorConsultarEvaluaciones.evaluacionSeleccionada}" />
						</p:commandButton>
					</center>
				</p:column>
			</p:dataTable>
		</h:form>
	</ui:define>
</ui:composition>
