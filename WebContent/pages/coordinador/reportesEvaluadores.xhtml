<?xml version='1.0' encoding='ISO-8859-1' ?>
<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:t="http://myfaces.apache.org/tomahawk"
	xmlns:s="http://myfaces.apache.org/sandbox"
	template="../../templates/common.xhtml">

	<ui:define name="content">
		<h:form>
			<t:div styleClass="contenido-titulo-general-myriad">Reportes</t:div>

			<p:growl id="growl" showDetail="true" />

			<p:tabView>
				<p:tab title="Evaluadores" titleStyle="font-size:12px">
					<p:panelGrid styleClass="estilo-panelgrid-sinbordes"
						id="reportes-evaluadores">
						<p:row>
							<p:column colspan="2">
								<h:outputText value="Generar reporte evaluadores " />
							</p:column>
						</p:row>
						<p:row>
							<p:column styleClass="confirmaEdicion"
								style="text-align:justify; width:50%;">
								<table>
									<tr>
										<td><h:outputText value="Evaluadores internos" /></td>
										<td style="vertical-align: middle;"><p:selectBooleanCheckbox
												value="#{manejadorReportesEvaluadores.evaluadoresInternos}">
											</p:selectBooleanCheckbox></td>
									</tr>
								</table>
							</p:column>
							<p:column colspan="2" styleClass="confirmaEdicion"
								style="text-align:justify; width:50%;">
								<table>
									<tr>
										<td><h:outputText value="Evaluadores externos" /></td>
										<td style="vertical-align: middle;"><p:selectBooleanCheckbox
												value="#{manejadorReportesEvaluadores.evaluadoresExternos}">
											</p:selectBooleanCheckbox></td>
									</tr>
								</table>
							</p:column>
						</p:row>
						<p:row>
							<p:column colspan="2" style="text-align:center;">
								<center>
									<p:commandButton
										action="#{manejadorReportesEvaluadores.generarReporteEvaluadores}"
										value="Generar reporte evaluadores" ajax="false">
									</p:commandButton>
								</center>
							</p:column>
						</p:row>
						<p:row>
							<p:column colspan="2" style="text-align:center;">
								<p:messages id="msgs" autoUpdate="true" closable="true" />
							</p:column>
						</p:row>
					</p:panelGrid>
				</p:tab>
			</p:tabView>

		</h:form>
	</ui:define>
</ui:composition>
