<?xml version='1.0' encoding='ISO-8859-1' ?>
<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:t="http://myfaces.apache.org/tomahawk"
	xmlns:s="http://myfaces.apache.org/sandbox"
	template="../../../templates/common.xhtml">
	<ui:define name="content">
		<h:form>
			<t:div styleClass="contenido-titulo-general-myriad">Asignación de proyectos a coordinadores editoriales</t:div>
			<t:div style="color:#464646; text-align:justify;">
									<ul>
						<li type="circle">La asignación de proyectos está habilitada para las  <strong
							style="color: #FF0000;">convocatorias de libros.</strong> En este formulario no encontrará proyectos de otras convocatorias.
						</li>
					</ul>
				</t:div>
			<p:panel>
				<p:panelGrid columns="2" styleClass="estilo-panelgrid-sinbordes"
					style="margin: auto; ">
					<h:outputText value="Buscar proyectos por:" />
					<p:selectOneButton
						value="#{manejadorAsignacionProyectosEditorial.tipoBusqueda}">
						<f:selectItem itemLabel="Convocatoria" itemValue="Convocatoria" />
						<f:selectItem itemLabel="Código proyecto" itemValue="Individual" />
						<p:ajax event="change" update="@form"
							listener="#{manejadorAsignacionProyectosEditorial.cambiarForm}"
							onstart="dialogEspere.show()" oncomplete="dialogEspere.hide()" />
					</p:selectOneButton>
				</p:panelGrid>
			</p:panel>
			<p:panel rendered="#{manejadorAsignacionProyectosEditorial.panelRender[2]}"
				style="margin-top: 10px;" id="groupIndividual">
				<p:panelGrid columns="3" styleClass="estilo-panelgrid-sinbordes"
					style="margin:auto;" id="panelBusquedaProyectosEvaluadoresxCodigo">
					<t:div style="width: 120px;">
						<h:outputText value="Código del proyecto:" />
					</t:div>
					<p:inputText id="numCom" style="width:80px;"
						value="#{manejadorAsignacionProyectosEditorial.codigoProyecto}" />
					<p:commandButton
						action="#{manejadorAsignacionProyectosEditorial.buscarProyectoxCodigo}"
						onstart="dialogEspere.show()" oncomplete="dialogEspere.hide()"
						value="Consultar" update="@form">
					</p:commandButton>
				</p:panelGrid>
				<div style="width: 100%; text-align: center;">
					<h:outputText
						value="#{manejadorAsociarEvaluadoresProyecto.mensajeBusqueProyecto}"
						style="font-size: 11px; font-weight: bold; color: #FF0000;" />
				</div>
			</p:panel>
			<p:panel rendered="#{manejadorAsignacionProyectosEditorial.panelRender[1]}"
				style="margin-top: 10px;">
				<p:panelGrid columns="2" styleClass="estilo-panelgrid-sinbordes"
					id="panelBusquedaProyectosEvaluadoresxConvocatoria">
					<t:div style="width: 120px;">
						<h:outputText value="Nombre convocatoria:" />
					</t:div>
					<t:div>
						<p:inputText id="numCom" style="width:418px;"
							value="#{manejadorAsignacionProyectosEditorial.nombreConvocatoria}" />
						<p:commandButton
							action="#{manejadorAsignacionProyectosEditorial.consultarConvocatorias}"
							value="Consultar" update="@form" onstart="dialogEspere.show()"
							oncomplete="dialogEspere.hide()">
						</p:commandButton>
					</t:div>
					<h:outputText value="Convocatoria:" />
					<p:selectOneMenu id="selectConvocatoria"
						value="#{manejadorAsignacionProyectosEditorial.convocatoriaPadre}"
						style="width:520px;" panelStyle="width: 520px;">
						<f:selectItems
							value="#{manejadorAsignacionProyectosEditorial.convocatoriaPadreItem}" />
						<p:ajax update="selectModalidadAsignacion"
							listener="#{manejadorAsignacionProyectosEditorial.cambiarConvocatoriaPadre}" />
					</p:selectOneMenu>
					<h:outputText value="Modalidad:" />
					<p:selectOneMenu id="selectModalidadAsignacion"
						style="width:520px;" panelStyle="width: 520px;"
						value="#{manejadorAsignacionProyectosEditorial.convocatoria}">
						<f:selectItems
							value="#{manejadorAsignacionProyectosEditorial.convocatoriaItem}" />
					</p:selectOneMenu>
					<h:outputText value="Sede: " />
					<p:selectOneMenu id="selectSede"
						value="#{manejadorAsignacionProyectosEditorial.sede}" style="width:150px;">
						<f:selectItems value="#{manejadorAsignacionProyectosEditorial.sedeItem}" />
						<p:ajax update="@parent"
							listener="#{manejadorAsignacionProyectosEditorial.cargarFacultad}" />
					</p:selectOneMenu>
					<h:outputText value="Estado: " />
					<p:selectOneMenu id="selectEstado"
						value="#{manejadorAsignacionProyectosEditorial.estado}"
						style="width:170px;">
						<f:selectItems value="#{manejadorAsignacionProyectosEditorial.estadoItem}" />
					</p:selectOneMenu>
					<h:outputText value="Buscar por facultad: " />
					<p:selectOneRadio id="busqFac"
						value="#{manejadorAsignacionProyectosEditorial.buscarFac}"
						styleClass="ui-radiobutton">
						<f:selectItem itemValue="Si" itemLabel="Si" />
						<f:selectItem itemValue="No" itemLabel="No" />
						<p:ajax update="@parent"
							listener="#{manejadorAsignacionProyectosEditorial.habilitarBuscarFacultad}" />
					</p:selectOneRadio>
					<h:outputText value="Facultad ó Instituto: "
						rendered="#{manejadorAsignacionProyectosEditorial.panelRender[3]}"
						onstart="dialogEspere.show()" oncomplete="dialogEspere.hide()" />
					<p:selectOneMenu id="selectFacultad"
						value="#{manejadorAsignacionProyectosEditorial.facultad}"
						rendered="#{manejadorAsignacionProyectosEditorial.panelRender[3]}"
						style="width:520px;" panelStyle="width: 520px;">
						<f:selectItems
							value="#{manejadorAsignacionProyectosEditorial.facultadItem}" />
					</p:selectOneMenu>
					<h:outputText value="" />
					<p:commandButton
						action="#{manejadorAsignacionProyectosEditorial.buscarProyectosxModalidad}"
						value="Buscar por facultad"
						rendered="#{manejadorAsignacionProyectosEditorial.panelRender[3]}"
						update="@form" onstart="dialogEspere.show()"
						oncomplete="dialogEspere.hide()">
					</p:commandButton>
					<p:commandButton
						action="#{manejadorAsignacionProyectosEditorial.buscarProyectosxModalidadxSede}"
						value="Buscar por sede"
						rendered="#{manejadorAsignacionProyectosEditorial.panelRender[4]}"
						update="@form" onstart="dialogEspere.show()"
						oncomplete="dialogEspere.hide()">
					</p:commandButton>
				</p:panelGrid>
			</p:panel>
			<p:panel header="Asignación de coordinadores a todos los proyectos"
				rendered="#{manejadorAsignacionProyectosEditorial.mostrarTabla}"
				style="margin-top: 10px;">
				<p:panelGrid columns="1" styleClass="estilo-panelgrid-sinbordes">
					<h:outputText
						value="En la siguiente lista de coordinadores seleccione aquel que desee asignar 
							a todos los proyectos y haga clic sobre 
							el tipo de asignación que va a realizar (Revisión, evaluación, seguimiento)." />
					<h:outputText
						value="Si el coordinador que desea actualizar no aparece en la lista, agreguelo en la opción 'Asociar coordinadores'." />
					<h:outputText
						value="	Para finalizar es necesarios dar clic sobre el botón 'Guardar Coordinadores' 
							en la parte inferior." />
				</p:panelGrid>
				<p:panelGrid id="asigCadaUno" columns="2"
					styleClass="estilo-panelgrid-sinbordes"
					style="margin: auto; margin-top: 10px; margin-bottom: 10px;">
					<h:outputText value=" Coordinador:  " />
					<p:selectOneMenu
						value="#{manejadorAsignacionProyectosEditorial.coordinadorNuevo}"
						style="width:550px;" panelStyle="width: 550px;">
						<f:selectItems
							value="#{manejadorAsignacionProyectosEditorial.coordinadorNuevoItem}" />
					</p:selectOneMenu>
				</p:panelGrid>
				<t:div style="text-align: center; width: 100%;">
					<p:commandButton id="revi"
						action="#{manejadorAsignacionProyectosEditorial.asignarCoordinadorRevisionProyectoTodos}"
						update="@form" value="Asignar para revision"
						onstart="dialogEspere.show()" oncomplete="dialogEspere.hide()" />						
					<p:commandButton id="eval"
						action="#{manejadorAsignacionProyectosEditorial.asignarCoordinadorEvaluacionProyectoTodos}"
						update="@form" value="Asignar para evaluacion"
						onstart="dialogEspere.show()" oncomplete="dialogEspere.hide()" />
					<p:commandButton id="concep"
						action="#{manejadorAsignacionProyectosEditorial.asignarCoordinadorConceptoProyectoTodos}"
						update="@form" value="Asignar para concepto editorial"
						onstart="dialogEspere.show()" oncomplete="dialogEspere.hide()" />
					<p:commandButton id="seg" 
						action="#{manejadorAsignacionProyectosEditorial.asignarCoordinadorProyectoTodos}"
						value="Asignar para seguimiento" update="@form"
						onstart="dialogEspere.show()" oncomplete="dialogEspere.hide()" />
				</t:div>
			</p:panel>
			<t:div style="width: 100%; text-align: center; margin: 10px;"
				rendered="#{!empty manejadorAsignacionProyectosEditorial.mensajeAsignacion}">
				<h:outputText
					value="#{manejadorAsignacionProyectosEditorial.mensajeAsignacion}"
					style="margin: 10px; color: #FF0000; font-weight: bold;" />
			</t:div>
			<p:panel header="Asignación de coordinadores individualmente"
				rendered="#{manejadorAsignacionProyectosEditorial.mostrarTabla}"
				style="margin-top: 10px;">
				<p:panelGrid columns="1" styleClass="estilo-panelgrid-sinbordes">
					<h:outputText
						value="En la siguiente tabla podrá asignar coordinadores de forma individual seleccionando el nombre
								en la lista. 
								Para finalizar es necesarios dar clic sobre el botón 'Guardar Coordinadores' en la parte inferior." />
				</p:panelGrid>
				<p:dataTable var="proyectoCoordinador" id="tabla_pry"
					emptyMessage="No existen proyectos relacionados"
					value="#{manejadorAsignacionProyectosEditorial.listaProyectosCoordinador}"
					border="1" cellpadding="0" cellspacing="1" align="center"
					style="width:100%; margin-top: 10px;"
					rendered="#{manejadorAsignacionProyectosEditorial.mostrarTabla}"
					paginator="true" rows="10" paginatorPosition="bottom">

					<p:column headerText="Proyecto">
						<div class="panel-interno-tabla">
							<p:panelGrid columns="1" styleClass="estilo-panelgrid-sinbordes"
								style="margin: auto; text-align: left; margin-top: 10px;">
								<t:div>
									<h:outputText value="#{proyectoCoordinador.idProyecto}" style="font-weight: bold;"/> -
									<h:outputText value="#{proyectoCoordinador.nombreProyecto}"
										style="font-weight: normal !important;" />
									<br />
									<br />
									<h:outputText value="#{proyectoCoordinador.nombreFacultad}"
										style="font-weight: normal !important;" />
								</t:div>
							</p:panelGrid>
						</div>
					</p:column>

					<p:column headerText="Revisión" style="width: 130px;" >
						<p:selectOneMenu value="#{proyectoCoordinador.perRevision}"
							style="width: 100px;"
							rendered="#{proyectoCoordinador.coordinadorRequisitosAsociadoAsesor}">
							<f:selectItems
								value="#{manejadorAsignacionProyectosEditorial.coordinadoresItemRev}" />
						</p:selectOneMenu>
						<h:outputText value="#{proyectoCoordinador.nombreRevision}"
							style="color:#FF8000;"
							rendered="#{!proyectoCoordinador.coordinadorRequisitosAsociadoAsesor}" />
					</p:column>

					<p:column headerText="Evaluación" style="width: 130px;" >
						<p:selectOneMenu value="#{proyectoCoordinador.perEvaluacion}"
							style="width: 100px;"
							rendered="#{proyectoCoordinador.coordinadorEvaluacionAsociadoAsesor}">
							<f:selectItems
								value="#{manejadorAsignacionProyectosEditorial.coordinadoresItemEv}" />
						</p:selectOneMenu>
						<h:outputText value="#{proyectoCoordinador.nombreEvaluacion}"
							style="color:#FF8000;"
							rendered="#{!proyectoCoordinador.coordinadorEvaluacionAsociadoAsesor}" />
					</p:column>
					
					<p:column headerText="Concepto ED" style="width: 130px;" >
						<p:selectOneMenu value="#{proyectoCoordinador.perConcepto}"
							style="width: 100px;"
							rendered="#{proyectoCoordinador.coordinadorEvaluacionAsociadoAsesor}">
							<f:selectItems
								value="#{manejadorAsignacionProyectosEditorial.coordinadoresItemCon}" />
						</p:selectOneMenu>
						<h:outputText value="#{proyectoCoordinador.nombreConcepto}"
							style="color:#FF8000;"
							rendered="#{!proyectoCoordinador.coordinadorConceptoAsociadoAsesor}" />
					</p:column>

					<p:column headerText="Seguimiento" style="width: 130px;">
						<p:selectOneMenu value="#{proyectoCoordinador.perId}"
							style="width: 100px;"
							rendered="#{proyectoCoordinador.coordinadorSeguimientoAsociadoAsesor}">
							<f:selectItems
								value="#{manejadorAsignacionProyectosEditorial.coordinadoresItem}" />
						</p:selectOneMenu>
						<h:outputText value="#{proyectoCoordinador.nombreSeguimiento}"
							style="color:#FF8000;"
							rendered="#{!proyectoCoordinador.coordinadorSeguimientoAsociadoAsesor}" />
					</p:column>
				</p:dataTable>
				<p:panelGrid columns="1" styleClass="estilo-panelgrid-sinbordes"
					style="margin: auto; text-align: left; margin-top: 10px;">
					<t:div style="width: 100%;">
						<h:outputText value="Los nombres en color " />
						<h:outputText value="naranja"
							style="color:#FF8000; font-weigth: bold;" />
						<h:outputText
							value=" corresponden a coordinadores que no estan asociados a su rol de Asesor." />
					</t:div>
				</p:panelGrid>
			</p:panel>
			<t:div style="width: 100%; text-align: center; margin-top: 20px;">
				<p:commandButton
					action="#{manejadorAsignacionProyectosEditorial.guardarAsociacionProyectosCoordinador}"
					value="Guardar Coordinadores"
					rendered="#{manejadorAsignacionProyectosEditorial.mostrarTabla}"
					ajax="false">
				</p:commandButton>
			</t:div>
			<p:dialog widgetVar="dialogEspere" resizable="false" closable="false"
				modal="true">
				<p:graphicImage value="/images/ajaxloading.gif" />
						Por favor espere...
			</p:dialog>
		</h:form>
	</ui:define>
</ui:composition>
