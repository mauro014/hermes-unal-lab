<?xml version='1.0' encoding='ISO-8859-1' ?>
<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:t="http://myfaces.apache.org/tomahawk"
	xmlns:s="http://myfaces.apache.org/sandbox"
	template="../../templates/common.xhtml">
	<ui:define name="content">
		<h:form>
			<t:div styleClass="contenido-titulo-general-myriad">Preguntas frecuentes</t:div>

			<p:panel>
				<p:panelGrid columns="2" styleClass="estilo-panelgrid-sinbordes"
					id="panelPreguntas">
					<t:div style="width: 100px;">
						<h:outputText value="Clasificación:" />
					</t:div>
					<t:div>
						<p:selectOneMenu style="width:540px;"
							value="#{manejadorAdministrarPreguntas.clasificacion}"
							panelStyle="width: 520px;" filter="true"
							filterMatchMode="contains">
							<f:selectItem itemLabel="" itemValue="" />
							<f:selectItems
								value="#{manejadorAdministrarPreguntas.listaClasificacionesActivasItem}" />
						</p:selectOneMenu>
					</t:div>
				</p:panelGrid>
				<div
					style="width: 100%; text-align: center; padding-top: 10px; padding-bottom: 10px;">
					<p:commandButton value="Consultar preguntas"
						icon="ui-icon-search" update="@form" ajax="false"
						actionListener="#{manejadorAdministrarPreguntas.consultarPreguntas}" />
				</div>
			</p:panel>
			<p:messages id="msgs" autoUpdate="true" showDetail="true"
				closable="true" />
			<br />
			<p:dataTable var="pregunta"
				value="#{manejadorAdministrarPreguntas.listaPreguntas}"
				emptyMessage="No se encontraron preguntas"
				paginator="true" rows="20" paginatorPosition="bottom"
				filteredValue="#{manejadorAdministrarPreguntas.filteredPreguntas}">
				<f:facet name="header">Preguntas frecuentes</f:facet>
				<p:column style="text-align: center; width: 5%;">
					<f:facet name="header">
						<h:outputText value="Visible?" />
					</f:facet>
					<p:graphicImage value="/images/check.png"
						rendered="#{pregunta.estado == 'A'}" style="width: 25px;" />
					<p:graphicImage value="/images/cancel.png"
						rendered="#{pregunta.estado != 'A'}" style="width: 20px;" />
				</p:column>
				<p:column style="width: 20%;"
					filterBy="#{pregunta.etiqueta}" filterMatchMode="contains">
					<f:facet name="header">
						<h:outputText value="Etiqueta" />
					</f:facet>
					<h:outputText value="#{pregunta.etiqueta}" />
				</p:column>
				<p:column
					filterBy="#{pregunta.descripcion}" filterMatchMode="contains">
					<f:facet name="header">
						<h:outputText value="Pregunta" />
					</f:facet>
					<h:outputText value="#{pregunta.descripcion}" />
				</p:column>
				<p:column style="text-align: center; width: 10%;" headerText="-">
					<p:commandButton
						action="#{manejadorAdministrarPreguntas.editarPregunta}"
						icon="ui-icon-pencil" ajax="false">
						<f:setPropertyActionListener value="#{pregunta}"
							target="#{manejadorAdministrarPreguntas.preguntaSeleccionada}" />
					</p:commandButton>
				</p:column>
				<f:facet name="footer">Han sido encontradas #{manejadorAdministrarPreguntas.tamanoLista} preguntas</f:facet>
			</p:dataTable>
		</h:form>
	</ui:define>
</ui:composition>
