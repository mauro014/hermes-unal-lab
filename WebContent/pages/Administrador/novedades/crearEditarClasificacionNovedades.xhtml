<?xml version='1.0' encoding='ISO-8859-1' ?>
<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:t="http://myfaces.apache.org/tomahawk"
	template="../../../templates/common.xhtml">

	<ui:define name="content">

		<h:form enctype="multipart/form-data">
			<t:div styleClass="contenido-titulo-general-myriad">Crear / editar clasificación novedades</t:div>
			<t:div style="padding:15px;">
				<p:panelGrid styleClass="estilo-panelgrid-sinbordes"
					id="panelConvocatoria">
					<p:row>
						<p:column>
							<h:outputText value="Nombre de la clasificación:" />
						</p:column>
						<p:column>
							<p:inputText id="clasificacionNombre" size="70"
								value="#{manejadorCrearEditarClasificacionNovedades.clasificacionNovedad.nombre}"
								maxlength="400"
								validatorMessage="El nombre de la clasificación puede tener máximo 400 caracteres">
							</p:inputText>
						</p:column>
					</p:row>
					<p:row>
						<p:column>
							<h:outputText value="Descripción:" />
						</p:column>
						<p:column>
							<p:inputTextarea cols="65" rows="4" maxlength="3000"
								value="#{manejadorCrearEditarClasificacionNovedades.clasificacionNovedad.descripcion}"
								id="clasificacionDescripcion">
							</p:inputTextarea>
						</p:column>
					</p:row>
					<p:row>
						<p:column>
						</p:column>
						<p:column>
							<h:outputText id="counterDescripcion"
								value="Tamaño máximo 3000 caracteres" />
						</p:column>
					</p:row>
					<p:row>
						<p:column>
							<h:outputText value="Estado:" />
						</p:column>
						<p:column>
							<p:selectOneMenu style="width:120px;"
								value="#{manejadorCrearEditarClasificacionNovedades.clasificacionNovedad.estado}"
								panelStyle="width: 120px;">
								<f:selectItems
									value="#{manejadorCrearEditarClasificacionNovedades.estadoClasificacion}" />
							</p:selectOneMenu>
						</p:column>
					</p:row>
					<p:row>
						<p:column colspan="2" style="text-align:center;">
							<br />
							<p:commandButton
								action="#{manejadorCrearEditarClasificacionNovedades.guardarClasificacion}"
								value="Guardar" icon="ui-icon-disk" update="@form"
								onstart="dialogEspere.show()" oncomplete="dialogEspere.hide()" />
						</p:column>
					</p:row>
				</p:panelGrid>
			</t:div>
			<p:messages id="msgs" autoUpdate="true" showDetail="true"
				closable="true" />
			<p:dialog widgetVar="dialogEspere" resizable="false" closable="false"
				modal="true">
				<p:graphicImage value="/images/ajaxloading.gif" />
						Por favor espere...
			</p:dialog>
		</h:form>
	</ui:define>
</ui:composition>
