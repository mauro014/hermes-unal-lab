<?xml version='1.0' encoding='ISO-8859-1' ?>
<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:t="http://myfaces.apache.org/tomahawk"
	xmlns:c="http://java.sun.com/jsp/jstl/core"
	template="../../../templates/common.xhtml">

	<ui:define name="content">

		<h:form enctype="multipart/form-data">
			<t:div styleClass="contenido-titulo-general-myriad">Crear / editar novedad </t:div>
			<t:div style="padding:15px;">
				<p:panelGrid styleClass="estilo-panelgrid-sinbordes"
					id="panelNovedad" style="width:100%;">
					<p:row>
						<p:column style="width:18%;">
							<h:outputText value="Clasificación:" />
						</p:column>
						<p:column>
							<p:selectOneMenu id="clasificacion"
								value="#{manejadorCrearEditarNovedad.novedad.clasificacion.id}"
								style="width:100%;" panelStyle="width: 500px;" filter="true"
								filterMatchMode="contains">
								<f:selectItem itemLabel="" itemValue="" />
								<f:selectItems
									value="#{manejadorCrearEditarNovedad.listaClasificacionesActivasItem}" />
							</p:selectOneMenu>
						</p:column>
					</p:row>
					<p:row>
						<p:column>
							<h:outputText value="Nombre de la novedad:" />
						</p:column>
						<p:column>
							<p:inputText
								value="#{manejadorCrearEditarNovedad.novedad.nombre}"
								id="etiqueta" style="width:100%;" maxlength="500" />
						</p:column>
					</p:row>
					<p:row>
						<p:column>
							<h:outputText value="Descripción:" />
						</p:column>
						<p:column>
							<p:inputTextarea rows="4" maxlength="3000"
								value="#{manejadorCrearEditarNovedad.novedad.descripcion}"
								id="textoDescripcion" style="width:100%; height:50px; overflow:auto;">
								<f:validateLength minimum="0" maximum="3000"
									for="textoDescripcion"></f:validateLength>
							</p:inputTextarea>
						</p:column>
					</p:row>
					<p:row>
						<p:column>
						</p:column>
						<p:column>
							<h:outputText id="counterNovedad"
								value="Tamaño máximo 3000 caracteres" />
						</p:column>
					</p:row>
					<p:row>
						<p:column>
							<h:outputText value="Enlace externo:" />
						</p:column>
						<p:column>
							<p:inputText style="width:100%;" columns="70"
								value="#{manejadorCrearEditarNovedad.novedad.url}" />
						</p:column>
					</p:row>
					<p:row>
						<p:column>
							<h:outputText value="Fecha de la novedad:" />
						</p:column>
						<p:column colspan="2">
							<p:calendar id="fechaNovedad" navigator="true" locale="es"
								readonlyInput="true"
								value="#{manejadorCrearEditarNovedad.novedad.fechaNovedad}" />
						</p:column>
					</p:row>
					<p:row>
						<p:column>
							<h:outputText value="Estado:" />
						</p:column>
						<p:column>
							<p:selectOneMenu style="width:120px;"
								value="#{manejadorCrearEditarNovedad.novedad.estado}"
								panelStyle="width: 120px;">
								<f:selectItem itemLabel="" itemValue="" />
								<f:selectItems
									value="#{manejadorCrearEditarNovedad.estadoItem}" />
							</p:selectOneMenu>
						</p:column>
					</p:row>
					<p:row>
						<p:column colspan="2" style="text-align:center;">
							<br />
							<p:commandButton
								action="#{manejadorCrearEditarNovedad.guardar}"
								value="Guardar" icon="ui-icon-disk" update="@form"
								onstart="dialogEspere.show()" oncomplete="dialogEspere.hide()" />
						</p:column>
					</p:row>
				</p:panelGrid>
			</t:div>
			<p:messages id="msgs" autoUpdate="true" showDetail="false"
				closable="true" />
			<p:dialog widgetVar="dialogEspere" resizable="false" closable="false"
				modal="true">
				<p:graphicImage value="/images/ajaxloading.gif" />
						Por favor espere...
			</p:dialog>
		</h:form>
	</ui:define>
</ui:composition>
