<?xml version='1.0' encoding='ISO-8859-1' ?>
<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:t="http://myfaces.apache.org/tomahawk"
	xmlns:s="http://myfaces.apache.org/sandbox"
	template="../../templates/common.xhtml">


	<ui:define name="content">
		<h:form id="content" enctype="multipart/form-data">

			<t:div styleClass="contenido-titulo-general-myriad">Solicitud de creación de fuente de financiación</t:div>
			<br/>
			<p:panel
				header="Solicitud fuente de financiación"
				align="center" id="solFuente">

				<p:messages id="msgs" />

				<br/>
				<p:panelGrid columns="2" styleClass="estilo-panelgrid-sinbordes"
					id="panelReq">

					<h:outputText value="Número de la solicitud:" />
					<h:outputText value="#{ManejadorEditarFuente.solicitud.id}" />					

					<h:outputText value="Nombre:" />
					<p:inputTextarea id="nombreFuente" cols="60" rows="3" readonly="true"
						value="#{ManejadorEditarFuente.fuenteFinanciacion.descripcion}">
					</p:inputTextarea>

					<h:outputText value="NIT:" />
					<p:inputText id="nitFuente" size="30" readonly="true"
						value="#{ManejadorEditarFuente.fuenteFinanciacion.nit}">
					</p:inputText>

					<h:outputText value="Naturaleza:" />
					<p:selectOneMenu id="SOM_fuentesNuevas1" disabled="true"
						value="#{ManejadorEditarFuente.fuenteFinanciacion.naturaleza}"
						style="width:150px">
						<f:selectItems
							value="#{ManejadorEditarFuente.tiposNaturalezaFuenteItem}" />
					</p:selectOneMenu>

					<h:outputText value="Dirección" />
					<p:inputText id="direcc" size="60" readonly="true"
						value="#{ManejadorEditarFuente.fuenteFinanciacion.direccion}">
					</p:inputText>

					<h:outputText value="Teléfono" />
					<p:inputText id="tel" size="20" readonly="true"
						value="#{ManejadorEditarFuente.fuenteFinanciacion.telefono}">
					</p:inputText>


					<h:outputText value="Fecha de solicitud:" />
					<p:calendar 
						value="#{ManejadorEditarFuente.solicitud.fechaRegistro}"
						id="fechaEntrega" disabled="true"
						requiredMessage="Escoja la fecha en la que el usuario espera que se entregue la solución."
						pattern="dd/MM/yyyy" />


					<h:outputText value="Estado de la solicitud:"  />
					<p:selectOneMenu 
						value="#{ManejadorEditarFuente.solicitud.estado}"
						id="estSol" disabled="true">
						<p:ajax process="@form" update="@form" />
						<f:selectItems value="#{ManejadorEditarFuente.estadosItem}" />
					</p:selectOneMenu>
					
					<h:outputText value="Tipo de fuente:"  rendered="#{ManejadorEditarFuente.solicitud.estado eq 'Aprobado'}"/>
					<p:selectOneMenu disabled="true"
						value="#{ManejadorEditarFuente.fuenteFinanciacion.internaExterna}"
						id="tipo" rendered="#{ManejadorEditarFuente.solicitud.estado eq 'Aprobado'}">
						<f:selectItems value="#{ManejadorEditarFuente.estadosFteItem}" />
					</p:selectOneMenu>
					
				</p:panelGrid>				
				
				<br/>
				
			</p:panel>
			
			<br></br>
			
		</h:form>
	</ui:define>

</ui:composition>
