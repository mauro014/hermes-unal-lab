<?xml version='1.0' encoding='ISO-8859-1' ?>
<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:t="http://myfaces.apache.org/tomahawk"
	xmlns:s="http://myfaces.apache.org/sandbox"
	template="../../templates/common.xhtml">


	<ui:define name="content">
		<h:form id="content" enctype="multipart/form-data">

			<t:div styleClass="contenido-titulo-general-myriad">Solicitud de creación de fuente de financiación</t:div>
			<br />
			<p:panel header="Solicitud fuente de financiación" align="center"
				id="solFuente">

				<p:messages id="msgs" />

				<br />
				<p:panelGrid styleClass="estilo-panelgrid-sinbordes" id="panelReq">

					<p:row>
						<p:column>
							<h:outputText value="Número de la solicitud:" />
						</p:column>
						<p:column>
							<h:outputText value="#{ManejadorEditarFuente.solicitud.id}" />
						</p:column>
					</p:row>

					<p:row>
						<p:column>
							<h:outputText value="Naturaleza:" />
						</p:column>
						<p:column>
							<p:selectOneMenu id="SOM_fuentesNuevas1"
								value="#{ManejadorEditarFuente.fuenteFinanciacion.naturaleza}"
								style="width:200px">
								<f:selectItems
									value="#{ManejadorEditarFuente.tiposNaturalezaFuenteItem}" />
							</p:selectOneMenu>
						</p:column>
					</p:row>

					<p:row>
						<p:column>
							<h:outputText value="País:" />
						</p:column>
						<p:column>
							<p:selectOneMenu id="SOM_paisFuente" filter="true"
								filterMatchMode="contains" style="width:200px"
								value="#{ManejadorEditarFuente.fuenteFinanciacion.pais.id}">
								<f:selectItem itemLabel="Seleccione una opción" itemValue="" />
								<f:selectItems value="#{ManejadorEditarFuente.listaPaisesItem}" />
							</p:selectOneMenu>
						</p:column>
					</p:row>

					<p:row>
						<p:column>
							<h:outputText value="Carácter:" />
						</p:column>
						<p:column>
							<p:selectOneMenu id="SOM_fuentesCaracter"
								value="#{ManejadorEditarFuente.fuenteFinanciacion.caracter}"
								style="width:200px">
								<f:selectItems
									value="#{ManejadorEditarFuente.caracterFuenteFinanciacionItem}" />
							</p:selectOneMenu>
						</p:column>
					</p:row>

					<p:row>
						<p:column>
							<h:outputText value="Tipo de fuente:" />
						</p:column>
						<p:column>
							<p:selectOneMenu id="SOM_fuentesTipoFuente"
								value="#{ManejadorEditarFuente.fuenteFinanciacion.tipoFuente}"
								style="width:200px">
								<f:selectItems
									value="#{ManejadorEditarFuente.tiposFuenteFinanciacionItem}" />
							</p:selectOneMenu>
						</p:column>
					</p:row>

					<p:row>
						<p:column>
							<h:outputText value="Nombre:" />
						</p:column>
						<p:column>
							<p:inputTextarea id="nombreFuente" cols="60" rows="3"
								value="#{ManejadorEditarFuente.fuenteFinanciacion.descripcion}" />
						</p:column>
					</p:row>

					<p:row>
						<p:column>
							<h:outputText value="NIT:" />
						</p:column>
						<p:column>
							<p:inputText id="nitFuente" size="30"
								value="#{ManejadorEditarFuente.fuenteFinanciacion.nit}" />
						</p:column>
					</p:row>

					<p:row>
						<p:column>
							<h:outputText value="Dirección" />
						</p:column>
						<p:column>
							<p:inputText id="direcc" size="60"
								value="#{ManejadorEditarFuente.fuenteFinanciacion.direccion}" />
						</p:column>
					</p:row>

					<p:row>
						<p:column>
							<h:outputText value="Teléfono" />
						</p:column>
						<p:column>
							<p:inputText id="tel" size="20"
								value="#{ManejadorEditarFuente.fuenteFinanciacion.telefono}" />
						</p:column>
					</p:row>

					<p:row>
						<p:column>
							<h:outputText value="Fecha de solicitud:" />
						</p:column>
						<p:column>
							<p:calendar id="fechaEntrega" pattern="dd/MM/yyyy"
								value="#{ManejadorEditarFuente.solicitud.fechaRegistro}"
								requiredMessage="Escoja la fecha en la que el usuario espera que se entregue la solución." />
						</p:column>
					</p:row>

					<p:row>
						<p:column>
							<h:outputText value="Tipología:" />
						</p:column>
						<p:column>
							<p:selectOneMenu id="tipologiaFuente" style="width:160px;"
								value="#{ManejadorEditarFuente.fuenteFinanciacion.internaExterna}">
								<f:selectItem itemLabel="Seleccione una opción" itemValue="" />
								<f:selectItems value="#{ManejadorEditarFuente.estadosItem}" />
							</p:selectOneMenu>
						</p:column>
					</p:row>

					<p:row>
						<p:column>
							<h:outputText value="Estado:" />
						</p:column>
						<p:column>
							<p:selectOneMenu id="estado" style="width:160px;"
								value="#{ManejadorEditarFuente.fuenteFinanciacion.estado}">
								<f:selectItem itemLabel="Seleccione una opción" itemValue="" />
								<f:selectItem itemLabel="Visible" itemValue="V" />
								<f:selectItem itemLabel="Oculta" itemValue="O" />
							</p:selectOneMenu>
						</p:column>
					</p:row>

					<p:row>
						<p:column>
							<h:outputText value="Visible para Aval:" />
						</p:column>
						<p:column>
							<p:selectOneMenu id="visibleAval" style="width:160px;"
								value="#{ManejadorEditarFuente.fuenteFinanciacion.visibleAval}"
								converter="javax.faces.Boolean">
								<f:selectItem itemLabel="Sí" itemValue="true" />
								<f:selectItem itemLabel="No" itemValue="false" />
							</p:selectOneMenu>
						</p:column>
					</p:row>

				</p:panelGrid>

				<!-- Botón Guardar -->
				<center>
					<br />
					<p:commandButton value="Guardar"
						action="#{ManejadorEditarFuente.guardar}" update="msgs"
						icon="ui-icon-disk" ajax="false" />
				</center>
				<br />


			</p:panel>

			<br></br>

		</h:form>
	</ui:define>

</ui:composition>
