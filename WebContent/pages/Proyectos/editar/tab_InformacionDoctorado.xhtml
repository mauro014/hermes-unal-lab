<?xml version='1.0' encoding='ISO-8859-1' ?>
<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:t="http://myfaces.apache.org/tomahawk"
	xmlns:s="http://myfaces.apache.org/sandbox"
	template="../../../templates/common.xhtml">

	<ui:define name="title">INFORMACIÓN DOCTORADO BECAS COLCIENCIAS</ui:define>
	<ui:define name="content">
		<h:form id="form" enctype="multipart/form-data">
			<t:div styleClass="contenido-titulo-general-myriad">Información del doctorado</t:div>
			<br />
			<p:menubar model="#{manejadorMenuFormularios.modelItemProyecto}" />
			<br />

			<br />
			<p:outputPanel id="depEjeOP">

				<h:panelGrid columns="2" cellpadding="5" cellspacing="5"
					id="panelGridSede" align="center">

					<h:outputText value="Doctorado: " />
					<p:selectOneMenu
						value="#{manejadorInformacionBecasDoctoradoColciencias.doctoradoSeleccionado}"
						id="sedeUN" style="width:500px">
						<f:selectItems
							value="#{manejadorInformacionBecasDoctoradoColciencias.doctoradoItem}" />
					</p:selectOneMenu>

					<h:outputText
						value="Requerimiento o perfil del estudiante de Doctorado" />
					<p:inputTextarea id="perfilEstudiante"
						value="#{manejadorInformacionBecasDoctoradoColciencias.proyectoActual.marcoTeorico}"
						rows="8" cols="80" required="false" autoResize="false"
						maxlength="4000" counter="counter1"
						counterTemplate="{0} caracteres restantes" />
					<h:outputText />
					<h:outputText id="counter1" />

					<h:outputText
						value="Objetivos a desarrollar por parte del estudiante de Doctorado" />
					<p:inputTextarea id="objetivosDoctorado"
						value="#{manejadorInformacionBecasDoctoradoColciencias.proyectoActual.marcoTeorico}"
						rows="8" cols="80" required="false" autoResize="false"
						maxlength="4000" counter="counter2"
						counterTemplate="{0} caracteres restantes" />
					<h:outputText />
					<h:outputText id="counter2" />

					<h:outputText
						value="Impacto de la participación del estudiante de Doctorado" />
					<p:inputTextarea id="impactoEstudiante"
						value="#{manejadorInformacionBecasDoctoradoColciencias.proyectoActual.marcoTeorico}"
						rows="8" cols="80" required="false" autoResize="false"
						maxlength="4000" counter="counter3"
						counterTemplate="{0} caracteres restantes" />
					<h:outputText />
					<h:outputText id="counter3" />

					<h:outputText
						value="Actividades a realizar por parte del estudiante de Doctorado" />
					<p:inputTextarea id="actividadesEstudiante"
						value="#{manejadorInformacionBecasDoctoradoColciencias.proyectoActual.marcoTeorico}"
						rows="8" cols="80" required="false" autoResize="false"
						maxlength="4000" counter="counter4"
						counterTemplate="{0} caracteres restantes" />
					<h:outputText />
					<h:outputText id="counter4" />

					<h:outputText
						value="Recursos para el estudiante de Doctorado (puesto de trabajo, beca de Colciencias y demás)" />
					<p:inputTextarea id="recursosEstudiante"
						value="#{manejadorInformacionBecasDoctoradoColciencias.proyectoActual.marcoTeorico}"
						rows="8" cols="80" required="false" autoResize="false"
						maxlength="4000" counter="counter5"
						counterTemplate="{0} caracteres restantes" />
					<h:outputText />
					<h:outputText id="counter5" />

					<h:outputText value="Datos de contacto o aplicación" />
					<p:inputTextarea id="datosContacto"
						value="#{manejadorInformacionBecasDoctoradoColciencias.proyectoActual.marcoTeorico}"
						rows="8" cols="80" required="false" autoResize="false"
						maxlength="4000" counter="counter6"
						counterTemplate="{0} caracteres restantes" />
					<h:outputText />
					<h:outputText id="counter6" />

				</h:panelGrid>

			</p:outputPanel>

			<h:panelGrid columns="3" cellpadding="3" align="center">
				<p:commandButton
					action="#{manejadorInformacionBecasDoctoradoColciencias.atras}"
					value="Atrás" immediate="true" />
				<p:commandButton
					action="#{manejadorInformacionBecasDoctoradoColciencias.salirGuardar}"
					value="Guardar y continuar después" update="@form" />
				<p:commandButton
					action="#{manejadorInformacionBecasDoctoradoColciencias.siguiente}"
					value="Guardar y avanzar" update="@form" />
			</h:panelGrid>

		</h:form>
	</ui:define>
</ui:composition>
