<?xml version='1.0' encoding='ISO-8859-1' ?>
<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:t="http://myfaces.apache.org/tomahawk"
	xmlns:s="http://myfaces.apache.org/sandbox"
	template="../../../templates/common.xhtml">

	<ui:define name="content">
		<h:form>
			<t:div styleClass="contenido-titulo-general-myriad">Información General</t:div>
			<br />
			<p:menubar model="#{manejadorMenuFormularios.modelItemProyecto}" />
			<br />

			<h:panelGrid id="mostrarSiConvocatoriaLibros"
				rendered="#{ManejadorConvocatoriaLibros.mostrarSiConvLibros}"
				style="width:100%">

				<p:panel id="datosContactoConvLib" header="Datos de Contacto">

					<h:panelGrid columns="2" cellpadding="5" cellspacing="5"
						id="formInfoGeneral">

						<h:outputText value="Nombre del docente:" />
						<h:outputText
							value="#{ManejadorConvocatoriaLibros.nombreCompletoPersonaActual}" />

						<h:outputText value="Documento de identidad:" />
						<h:outputText
							value="#{ManejadorConvocatoriaLibros.documentoCoinv}" />

						<h:outputText value="Tipo de Documento:" />
						<h:outputText
							value="#{ManejadorConvocatoriaLibros.tipoDocumentoCoInv.nombre}" />

						<h:outputText value="Sede:" />
						<h:outputText value="#{ManejadorConvocatoriaLibros.nombreSede}" />

						<h:outputText value="Facultad/Instituto:" />
						<h:outputText
							value="#{ManejadorConvocatoriaLibros.nombreFacultad}" />

						<h:outputText value="Departamento:" />
						<h:outputText
							value="#{ManejadorConvocatoriaLibros.nombreDepartamento}" />

						<h:outputText value="Correo electrónico:" />
						<h:outputText
							value="#{ManejadorConvocatoriaLibros.emailPersonaActual}" />
						<h:outputText value="Teléfono de contacto:" />
						<h:outputText value="#{ManejadorConvocatoriaLibros.telefono}" />
					</h:panelGrid>

				</p:panel>
				<br />
				<p:panel header="Información General" id="idInfoGeneral">
					<h:panelGrid columns="2" cellpadding="10" align="center">
						<h:outputText value="Título (Máx. 1000 caracteres)"
							styleClass="legend2" />
						<p:inputTextarea rows="5" cols="65" autoResize="false"
							counter="counterTitulo" maxlength="1000"
							counterTemplate="{0} caracteres restantes." required="true"
							id="Titulo"
							value="#{ManejadorConvocatoriaLibros.proyectoActual.nombre}"
							requiredMessage="El título del proyecto es obligatorio" />
						<h:outputText id="countTitulo" value="" />
						<h:outputText id="counterTitulo" />

						<h:outputText value="Resumen (Máx. 4000 caracteres)" />
						<p:inputTextarea id="Resumen" autoResize="false"
							counter="counterResumen" maxlength="4000"
							counterTemplate="{0} caracteres restantes."
							value="#{ManejadorConvocatoriaLibros.proyectoActual.resumen}"
							rows="10" cols="65" required="true"
							requiredMessage="Debe ingresar el resumen del proyecto">
						</p:inputTextarea>
						<h:outputText id="countRes" value="" />
						<h:outputText id="counterResumen" />

						<h:outputText
							value="Objeto/Objetivo principal (Máx. 4000 caracteres):" />
						<p:inputTextarea id="objeto" autoResize="false"
							counter="counterObjeto" maxlength="4000"
							counterTemplate="{0} caracteres restantes."
							validatorMessage="Objeto/Objetivo Principal debe estar entre 1 - 4000 caracteres"
							value="#{ManejadorConvocatoriaLibros.proyectoActual.objetivoGeneral}"
							rows="10" cols="65" required="true"
							requiredMessage="Debe ingresar el objetivo del proyecto">
						</p:inputTextarea>
						<h:outputText id="countObj" value="" />
						<h:outputText id="counterObjeto" />
					</h:panelGrid>
					<t:div
						style="text-align: center; margin-bottom: 10px; margin-top: 30px;">
						<h:outputText value="ÁREAS OCDE" style="font-weight: bold;" />
					</t:div>
					<p:panelGrid id="panelAreaCientifica"
						styleClass="estilo-panelgrid-sinbordes">
						<p:row>
							<p:column style="width: 180px;">
								<h:outputText value="Area científica y tecnológica principal:" />
							</p:column>
							<p:column>
								<p:selectOneMenu style="width:350px" panelStyle="width:350px"
									value="#{ManejadorConvocatoriaLibros.areaCiencia}"
									id="areaCiencia">
									<f:selectItem itemLabel="Seleccione una opción" itemValue="" />
									<f:selectItems
										value="#{ManejadorConvocatoriaLibros.areaCienciaItems}" />
									<p:ajax listener="#{ManejadorConvocatoriaLibros.cambiarArea}"
										update="subareaCiencia" onstart="dialogEspere.show()"
										oncomplete="dialogEspere.hide()" />
								</p:selectOneMenu>
								<h:outputLink value="#{ManejadorConvocatoriaLibros.linkLineas}"
									target="_blank">
									<h:graphicImage id="imageee" alt="jsf-sun"
										url="/images/iconpdf.png">
									</h:graphicImage>
								</h:outputLink>
								<p:tooltip for="imageee"
									value="Descargar pdf con la clasificación de las áreas."
									showEffect="fade" hideEffect="fade" />
							</p:column>
						</p:row>
						<p:row>
							<p:column>
								<h:outputText value="Sub-área de la ciencia:" />
							</p:column>
							<p:column>
								<p:selectOneMenu style="width:350px" panelStyle="width:350px"
									value="#{ManejadorConvocatoriaLibros.subAreaCiencia}"
									id="subareaCiencia">
									<f:selectItem itemLabel="Seleccione una Sub-área secundaria"
										itemValue="" />
									<f:selectItems
										value="#{ManejadorConvocatoriaLibros.subAreaCienciaItems}" />
								</p:selectOneMenu>
							</p:column>
						</p:row>
					</p:panelGrid>
					<t:div
						style="text-align: center; margin-bottom: 10px; margin-top: 30px;">
						<h:outputText value="ÁREAS SECUNDARIAS" style="font-weight: bold;" />
					</t:div>
					<p:panelGrid id="panelAreaCientificaSecundaria"
						styleClass="estilo-panelgrid-sinbordes">
						<p:row>
							<p:column style="width: 180px;">
								<h:outputText value="Area científica y tecnológica secundaria:" />
							</p:column>
							<p:column>
								<p:selectOneMenu style="width:350px" panelStyle="width:350px"
									value="#{ManejadorConvocatoriaLibros.areaCienciaSec}"
									id="areaCienciaSec">
									<f:selectItem itemLabel="Seleccione una opción" itemValue="" />
									<f:selectItems
										value="#{ManejadorConvocatoriaLibros.areaCienciaItems}" />
									<p:ajax
										listener="#{ManejadorConvocatoriaLibros.cambiarAreaSec}"
										update="subareaCienciaSec" onstart="dialogEspere.show()"
										oncomplete="dialogEspere.hide()" />
								</p:selectOneMenu>
								<h:outputLink value="#{ManejadorConvocatoriaLibros.linkLineas}"
									target="_blank">
									<h:graphicImage id="imageees" alt="jsf-sun"
										url="/images/iconpdf.png">
									</h:graphicImage>
								</h:outputLink>
								<p:tooltip for="imageees"
									value="Descargar pdf con la clasificación de las áreas."
									showEffect="fade" hideEffect="fade" />
							</p:column>
						</p:row>
						<p:row>
							<p:column style="width: 180px;">
								<h:outputText value="Sub-área de la ciencia secundaria:" />
							</p:column>
							<p:column>
								<p:selectOneMenu style="width:350px" panelStyle="width:350px"
									value="#{ManejadorConvocatoriaLibros.subAreaCienciaSec}"
									id="subareaCienciaSec">
									<f:selectItem itemLabel="Seleccione una Sub-área secundaria"
										itemValue="" />
									<f:selectItems
										value="#{ManejadorConvocatoriaLibros.subAreaCienciaSecItems}" />
								</p:selectOneMenu>
							</p:column>
						</p:row>
						<p:row>
							<p:column colspan="2" style="text-align: center;">
								<p:commandButton
									action="#{ManejadorConvocatoriaLibros.agregarArea}"
									value="Adicionar área secundaria" icon="ui-icon-plus"
									update="areasTabla, botonAreasTabla, msgArea, msgAreaSEc, areaCienciaSec, subareaCienciaSec"
									onstart="dialogEspere.show()" oncomplete="dialogEspere.hide()" />
								<p:commandButton id="btnArea" icon="ui-icon-info">
								</p:commandButton>
								<p:tooltip for="btnArea" showEffect="fade" hideEffect="fade">
									<p:panelGrid columns="1" style="width:170px"
										styleClass="estilo-panelgrid-sinbordes" id="paneltool2">
										<h:outputText
											value="Para agregar el Area científica y tecnológica secundaria seleccionada, por favor haga clic en el botón Adicionar área." />
									</p:panelGrid>
								</p:tooltip>
							</p:column>
						</p:row>
						<p:row>
							<p:column colspan="2">
								<h:outputText id="botonAreasTabla" value=""
									binding="#{ManejadorConvocatoriaLibros.botonAreasTabla}">
								</h:outputText>
								<p:outputPanel id="msgArea" align="center">
									<p:message id="msgAreaSEc" for="botonAreasTabla"
										showSummary="false" />
								</p:outputPanel>
							</p:column>
						</p:row>
						<p:row>
							<p:column colspan="2">
								<p:dataTable id="areasTabla" var="area"
									value="#{ManejadorConvocatoriaLibros.listaAreasTematicas}"
									emptyMessage="No se han agregado áreas" style="width: 550px;">
									<p:column headerText="Área">
										<h:outputText value="#{area.nombreArea}" />
									</p:column>
									<p:column headerText="Subárea">
										<h:outputText value=" #{area.nombreSubArea}" />
									</p:column>
									<p:column headerText="Eliminar" id="columndarea"
										style="width: 10%;">
										<p:commandButton
											action="#{ManejadorConvocatoriaLibros.eliminarArea}"
											update="areasTabla" id="eliminararea" icon="ui-icon-trash"
											onstart="dialogEspere.show()"
											oncomplete="dialogEspere.hide()" title="Eliminar área">
											<f:setPropertyActionListener value="#{area}"
												target="#{ManejadorConvocatoriaLibros.areaSeleccionada}" />
										</p:commandButton>
									</p:column>
								</p:dataTable>
							</p:column>
						</p:row>
					</p:panelGrid>

					<br />
					<h:panelGrid columns="2" cellpadding="10" align="center"
						rendered="#{ManejadorConvocatoriaLibros.proyectoActual.modalidad.mostrarColeccionAsociada eq 1}">

						<h:outputText value="Colección asociada:" />
						<p:selectOneMenu
							value="#{ManejadorConvocatoriaLibros.proyectoActual.claseEvento}"
							id="tipoEvento">
							<f:selectItem itemLabel="Seleccione una opción" itemValue="" />
							<f:selectItems
								value="#{ManejadorConvocatoriaLibros.tipoEventoItems}" />
							<p:ajax
								listener="#{ManejadorConvocatoriaLibros.cambiarTipoEvento}"
								update="panOtroTipEve" />
						</p:selectOneMenu>
					</h:panelGrid>

					<h:panelGrid id="panOtroTipEve" columns="2" cellpadding="5"
						cellspacing="5"
						rendered="#{ManejadorConvocatoriaLibros.proyectoActual.modalidad.mostrarColeccionAsociada eq 1}">
						<h:outputText value="Otra - Cuál?:" id="otroEventotxt"
							rendered="#{ManejadorConvocatoriaLibros.mostrarOtroTipoEvento}" />
						<p:inputText size="40" id="otroEvento"
							rendered="#{ManejadorConvocatoriaLibros.mostrarOtroTipoEvento}"
							value="#{ManejadorConvocatoriaLibros.proyectoActual.otroClaseEvento}" />
					</h:panelGrid>
				</p:panel>
				<br />

				<p:panel header="Palabras Clave" id="idPalabrasClave">

					<h:panelGrid columns="3" id="gridPalabraClave" align="center">
						<h:outputText value="Palabras Clave" />
						<p:autoComplete id="palabraClaveS"
							value="#{ManejadorConvocatoriaLibros.palabraClave.palabra}"
							size="50" maxResults="10"
							completeMethod="#{ManejadorConvocatoriaLibros.obtenerPalabraClavesSugeridas}"
							minQueryLength="2">
							<f:validateLength maximum="100" />
						</p:autoComplete>

						<p:commandButton id="agregarPalabraClave" value="Agregar palabra"
							update="palabrasTable, gridPalabraClave"
							action="#{ManejadorConvocatoriaLibros.insertarPalabraClave}">
						</p:commandButton>

					</h:panelGrid>

					<br />
					<br />
					<p:outputPanel id="grupoListaPalabras" align="center">
						<p:dataTable id="palabrasTable"
							value="#{ManejadorConvocatoriaLibros.proyectoActual.listaPalabrasES}"
							var="pal"
							emptyMessage="No se encuentran palabras clave registradas">

							<p:column style="width:25%">
								<f:facet name="header">
									<h:outputText value="Palabra Clave" />
								</f:facet>
								<h:outputText value="#{pal.palabraVista}" />
							</p:column>

							<p:column style="width:3%">
								<center>
									<p:commandButton id="selectButton" update="palabrasTable"
										icon="ui-icon-trash"
										action="#{ManejadorConvocatoriaLibros.eliminarPalabraClave}"
										title="Eliminar palabra clave">
										<f:setPropertyActionListener value="#{pal}"
											target="#{ManejadorConvocatoriaLibros.palabraClaveTabla}" />
									</p:commandButton>
								</center>
							</p:column>

						</p:dataTable>
					</p:outputPanel>
				</p:panel>
				<br />
				<p:panel header="Autores" id="idAutores">

					<h:panelGrid columns="2" align="center" cellpadding="5"
						id="pgFormInves" cellspacing="5">

						<h:outputText value="Tipo de documento" />
						<p:selectOneMenu id="tipoDocInvestigadorSelect"
							value="#{ManejadorConvocatoriaLibros.tipoDocumentoCoInv2.id}">
							<f:selectItems
								value="#{ManejadorConvocatoriaLibros.tipoDocumentoItem}" />
						</p:selectOneMenu>

						<h:outputText value="No. documento: " />
						<p:inputText id="numDocumento"
							value="#{ManejadorConvocatoriaLibros.documentoCoinv2}" />

						<h:outputText value="Tipo de participante:" />
						<p:selectOneMenu id="tipoInvMain"
							value="#{ManejadorConvocatoriaLibros.tipoInvestigador}">
							<f:selectItems value="#{ManejadorConvocatoriaLibros.autores}" />
							<p:ajax
								listener="#{ManejadorConvocatoriaLibros.cambiarVinculacion}"
								update="pgFormInvesExt, OP_prueba" />
						</p:selectOneMenu>

					</h:panelGrid>

					<p:outputPanel id="OP_prueba">

						<h:panelGrid columns="2" align="center" cellpadding="5"
							id="pgFormInvesExt" cellspacing="5"
							rendered="#{ManejadorConvocatoriaLibros.esOtraVinculacion}">

							<h:outputText value="Primer Nombre *"
								rendered="#{ManejadorConvocatoriaLibros.esOtraVinculacion}" />
							<p:inputText id="primerNombreInvestigador"
								rendered="#{ManejadorConvocatoriaLibros.esOtraVinculacion}"
								value="#{ManejadorConvocatoriaLibros.investigadorExterno.nombre1}"
								size="38" requiredMessage="El Primer Nombre es obligatorio">
								<f:validateLength maximum="20" />
							</p:inputText>

							<h:outputText value="Segundo Nombre"
								rendered="#{ManejadorConvocatoriaLibros.esOtraVinculacion}" />
							<p:inputText id="segundoNombreInv"
								value="#{ManejadorConvocatoriaLibros.investigadorExterno.nombre2}"
								size="38"
								rendered="#{ManejadorConvocatoriaLibros.esOtraVinculacion}">
								<f:validateLength maximum="20" />
							</p:inputText>

							<h:outputText value="Primer Apellido *"
								rendered="#{ManejadorConvocatoriaLibros.esOtraVinculacion}" />
							<p:inputText id="primerApellidoInvestigador"
								rendered="#{ManejadorConvocatoriaLibros.esOtraVinculacion}"
								value="#{ManejadorConvocatoriaLibros.investigadorExterno.apellido1}"
								size="38" requiredMessage="El Primer Apellido es obligatorio">
								<f:validateLength maximum="20" />
							</p:inputText>

							<h:outputText value="Segundo Apellido"
								rendered="#{ManejadorConvocatoriaLibros.esOtraVinculacion}" />
							<p:inputText id="segundoApellidoInv"
								rendered="#{ManejadorConvocatoriaLibros.esOtraVinculacion}"
								value="#{ManejadorConvocatoriaLibros.investigadorExterno.apellido2}"
								size="38">
								<f:validateLength maximum="20" />
							</p:inputText>

							<h:outputText value="Género"
								rendered="#{ManejadorConvocatoriaLibros.esOtraVinculacion}" />
							<p:selectOneMenu
								rendered="#{ManejadorConvocatoriaLibros.esOtraVinculacion}"
								value="#{ManejadorConvocatoriaLibros.investigadorExterno.genero}"
								id="idGenero" style="width:40px">
								<f:selectItems value="#{ManejadorConvocatoriaLibros.generoItem}" />
							</p:selectOneMenu>

							<h:outputText value="Institución *"
								rendered="#{ManejadorConvocatoriaLibros.esOtraVinculacion}" />
							<p:inputText id="insitucionNombre"
								rendered="#{ManejadorConvocatoriaLibros.esOtraVinculacion}"
								value="#{ManejadorConvocatoriaLibros.insitucionNombre}"
								size="38" requiredMessage="La institución es obligatoria">
								<f:validateLength maximum="200" />
							</p:inputText>



						</h:panelGrid>

					</p:outputPanel>

					<br />
					<center>
						<p:commandButton value="Adicionar investigador"
							id="botonAdicionarInvestigador"
							update="listaParticipantes, pgFormInvesExt, OP_prueba, pgFormInves"
							action="#{ManejadorConvocatoriaLibros.agregarParticipante}"
							styleClass="ui-priority-primary" />
					</center>

					<br />
					<br />

					<p:dataTable var="i" style="width:650px"
						value="#{ManejadorConvocatoriaLibros.listaParticipantes}"
						id="listaParticipantes">

						<p:column style="width:30%">
							<f:facet name="header">
								<h:outputText value="Nombre" />
							</f:facet>
							<h:outputText
								value="#{i.investigador.nombre1} #{i.investigador.nombre2} #{i.investigador.apellido1} #{i.investigador.apellido2}" />
						</p:column>

						<p:column style="width:10%">
							<f:facet name="header">
								<h:outputText value="Tipo de Autor" />
							</f:facet>
							<h:outputText
								value="#{i.tipo.id == 'AI' ? 'Autor interno':(i.tipo.id == 'AEL' ? 'Autor externo':( i.tipo.id == 'P' ? 'Solicitante':''))}" />
						</p:column>

						<p:column style="width:10%">
							<f:facet name="header">
								<h:outputText value="Eliminar" />
							</f:facet>
							<center>
								<p:commandButton id="botonEliminarIntegrantes"
									update="listaParticipantes" icon="ui-icon-trash"
									action="#{ManejadorConvocatoriaLibros.eliminarParticipante}"
									title="Eliminar" rendered="#{i.tipo.id=='P'? false:true}">
									<f:setPropertyActionListener value="#{i}"
										target="#{ManejadorConvocatoriaLibros.participante}" />
								</p:commandButton>
							</center>
						</p:column>
					</p:dataTable>
					<br />


				</p:panel>

				<br />

				<p:panel header="Dependencias Relacionadas" id="idDepRelacionadas">

					<p:panelGrid id="panelGridDependencia"
						styleClass="estilo-panelgrid-sinbordes">
						<p:row>
							<p:column style="width:180px">
								<h:outputText value="Sede:" />
							</p:column>
							<p:column>
								<p:selectOneMenu value="#{ManejadorConvocatoriaLibros.sedeSel}"
									id="sedeUN" style="width:300px">
									<f:selectItems value="#{ManejadorConvocatoriaLibros.sedeItem}" />
									<p:ajax listener="#{ManejadorConvocatoriaLibros.cambiarSede}"
										update="panelGridDependencia" process="panelGridDependencia" />
								</p:selectOneMenu>
							</p:column>
						</p:row>
						<p:row rendered="#{ManejadorConvocatoriaLibros.mostrarFacultades}">
							<p:column>
								<h:outputText value="Facultad:" />
							</p:column>
							<p:column>
								<p:selectOneMenu
									value="#{ManejadorConvocatoriaLibros.facultadSel}"
									filter="true" filterMatchMode="contains" id="facultadUN"
									style="width:380px" panelStyle="380px">
									<f:selectItems
										value="#{ManejadorConvocatoriaLibros.facultadItem}" />
									<p:ajax
										listener="#{ManejadorConvocatoriaLibros.cambiarFacultad}"
										update="panelGridDependencia" process="panelGridDependencia" />
								</p:selectOneMenu>
								<p:tooltip for="facultadUN" showEffect="fade" hideEffect="fade">
									<h:panelGrid columns="1"
										style="border-bottom: 0px; padding-bottom: 0px; width: 300px">
										<h:outputText
											value="Seleccione el Centro, Facultad, Dirección o Instituto correspondiente." />
									</h:panelGrid>
								</p:tooltip>
							</p:column>
						</p:row>
						<p:row>
							<p:column>
								<h:outputText value="Dependencia:" />
							</p:column>
							<p:column>
								<p:selectOneMenu filter="true" filterMatchMode="contains"
									value="#{ManejadorConvocatoriaLibros.dependenciaProyecto}"
									id="dependenciasUN" style="width:380px"
									panelStyle="width:380px">
									<f:selectItem itemLabel="Seleccione una opción" itemValue="" />
									<f:selectItems
										value="#{ManejadorConvocatoriaLibros.dependenciaItem}" />
								</p:selectOneMenu>

					<h:panelGrid columns="2" align="center" cellpadding="5"
						id="PG_Coautores" cellspacing="5">

						<h:outputText value="Tipo de documento" />
						<p:selectOneMenu id="tipoDocInvestigadorSelect2"
							value="#{ManejadorConvocatoriaLibros.tipoDocumentoCoInv2.id}">
							<f:selectItems
								value="#{ManejadorConvocatoriaLibros.tipoDocumentoItem}" />
						</p:selectOneMenu>

						<h:outputText value="No. documento: " />
						<p:inputText id="numDocumento2"
							value="#{ManejadorConvocatoriaLibros.documentoCoinv2}" />

						<h:outputText value="Tipo de participante:" />
						<p:selectOneMenu id="tipoInvMain2"
							value="#{ManejadorConvocatoriaLibros.tipoInvestigador}">
							<f:selectItems value="#{ManejadorConvocatoriaLibros.autores}" />
							<p:ajax
								listener="#{ManejadorConvocatoriaLibros.cambiarVinculacion}"
								update="pgFormInvesExt2, OP_prueba2" />
						</p:selectOneMenu>

					</h:panelGrid>

					<p:outputPanel id="OP_prueba2">

						<h:panelGrid columns="2" align="center" cellpadding="5"
							id="pgFormInvesExt2" cellspacing="5"
							rendered="#{ManejadorConvocatoriaLibros.esOtraVinculacion}">

							<h:outputText value="Primer Nombre *"
								rendered="#{ManejadorConvocatoriaLibros.esOtraVinculacion}" />
							<p:inputText id="primerNombreInvestigador2"
								rendered="#{ManejadorConvocatoriaLibros.esOtraVinculacion}"
								value="#{ManejadorConvocatoriaLibros.investigadorExterno.nombre1}"
								size="38" requiredMessage="El Primer Nombre es obligatorio">
								<f:validateLength maximum="20" />
							</p:inputText>

							<h:outputText value="Segundo Nombre"
								rendered="#{ManejadorConvocatoriaLibros.esOtraVinculacion}" />
							<p:inputText id="segundoNombreInv2"
								value="#{ManejadorConvocatoriaLibros.investigadorExterno.nombre2}"
								size="38"
								rendered="#{ManejadorConvocatoriaLibros.esOtraVinculacion}">
								<f:validateLength maximum="20" />
							</p:inputText>

							<h:outputText value="Primer Apellido *"
								rendered="#{ManejadorConvocatoriaLibros.esOtraVinculacion}" />
							<p:inputText id="primerApellidoInvestigador2"
								rendered="#{ManejadorConvocatoriaLibros.esOtraVinculacion}"
								value="#{ManejadorConvocatoriaLibros.investigadorExterno.apellido1}"
								size="38" requiredMessage="El Primer Apellido es obligatorio">
								<f:validateLength maximum="20" />
							</p:inputText>

							<h:outputText value="Segundo Apellido"
								rendered="#{ManejadorConvocatoriaLibros.esOtraVinculacion}" />
							<p:inputText id="segundoApellidoInv"
								rendered="#{ManejadorConvocatoriaLibros.esOtraVinculacion}"
								value="#{ManejadorConvocatoriaLibros.investigadorExterno.apellido2}"
								size="38">
								<f:validateLength maximum="20" />
							</p:inputText>

							<h:outputText value="Género"
								rendered="#{ManejadorConvocatoriaLibros.esOtraVinculacion}" />
							<p:selectOneMenu
								rendered="#{ManejadorConvocatoriaLibros.esOtraVinculacion}"
								value="#{ManejadorConvocatoriaLibros.investigadorExterno.genero}"
								id="idGenero2" style="width:40px">
								<f:selectItems value="#{ManejadorConvocatoriaLibros.generoItem}" />
							</p:selectOneMenu>

							<h:outputText value="Institución *"
								rendered="#{ManejadorConvocatoriaLibros.esOtraVinculacion}" />
							<p:inputText id="insitucionNombre2"
								rendered="#{ManejadorConvocatoriaLibros.esOtraVinculacion}"
								value="#{ManejadorConvocatoriaLibros.insitucionNombre}"
								size="38" requiredMessage="La institución es obligatoria">
								<f:validateLength maximum="20" />
							</p:inputText>

						</h:panelGrid>

					</p:outputPanel>

					<br />
					<center>
						<p:commandButton value="Adicionar investigador"
							id="botonAdicionarInvestigador2"
							update="listaParticipantes2, pgFormInvesExt2, OP_prueba2, PG_Coautores"
							action="#{ManejadorConvocatoriaLibros.agregarParticipante}"
							styleClass="ui-priority-primary" />
					</center>

					<br />
					<br />

					<p:dataTable var="i" style="width:650px"
						value="#{ManejadorConvocatoriaLibros.listaParticipantes}"
						id="listaParticipantes2">

						<p:column style="width:30%">
							<f:facet name="header">
								<h:outputText value="Nombre" />
							</f:facet>
							<h:outputText
								value="#{i.investigador.nombre1} #{i.investigador.nombre2} #{i.investigador.apellido1} #{i.investigador.apellido2}" />
						</p:column>

						<p:column style="width:10%">
							<f:facet name="header">
								<h:outputText value="Tipo de Autor" />
							</f:facet>
							<h:outputText
								value="#{i.tipo.id == 'AI' ? 'Autor interno':(i.tipo.id == 'AEL' ? 'Autor externo':( i.tipo.id == 'P' ? 'Solicitante / Autor Principal':''))}" />
						</p:column>

						<p:column style="width:10%">
							<f:facet name="header">
								<h:outputText value="Eliminar" />
							</f:facet>
							<center>
								<p:commandButton id="botonEliminarIntegrantes2"
									update="listaParticipantes2" icon="ui-icon-trash"
									action="#{ManejadorConvocatoriaLibros.eliminarParticipante}"
									title="Eliminar" rendered="#{i.tipo.id=='P'? false:true}">
									<f:setPropertyActionListener value="#{i}"
										target="#{ManejadorConvocatoriaLibros.participante}" />
								</p:commandButton>
							</center>
						</p:column>
					</p:dataTable>
					<br />
				</p:panel>
			</p:outputPanel>

			<br />
			<p:messages id="messages" showDetail="false" autoUpdate="true"
				closable="true" />

			<br />

			<h:panelGroup>
				<center>
					<h:panelGrid columns="3">
						<p:commandButton value="Salir" id="botonAtras"
							action="#{ManejadorConvocatoriaLibros.atras}"
							styleClass="ui-priority-primary"
							rendered="#{ManejadorConvocatoriaLibros.validarBotonGuardar}" />

						<p:commandButton value="Guardar y continuar después"
							id="botonGuardarSalir"
							action="#{ManejadorConvocatoriaLibros.salirGuardar}"
							styleClass="ui-priority-primary" update="@form"
							rendered="#{ManejadorConvocatoriaLibros.validarBotonGuardar}" />

						<p:commandButton value="Guardar y avanzar"
							id="botonGuardarSiguiente"
							action="#{ManejadorConvocatoriaLibros.siguiente}"
							styleClass="ui-priority-primary" update="@form"
							rendered="#{ManejadorConvocatoriaLibros.validarBotonGuardar}" />
					</h:panelGrid>
				</center>
			</h:panelGroup>

		</h:form>
		<p:dialog widgetVar="dialogEspere" resizable="false" closable="false"
			modal="true">
			<p:graphicImage value="/images/ajaxloading.gif" />
   					 Por favor espere...
   	 </p:dialog>
	</ui:define>
