<?xml version='1.0' encoding='ISO-8859-1' ?>
<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:t="http://myfaces.apache.org/tomahawk"
	xmlns:s="http://myfaces.apache.org/sandbox"
	template="../../../templates/common.xhtml">

	<ui:define name="content">
		<h:form id="form">
			<t:div styleClass="contenido-titulo-general-myriad">Rubros Estimados</t:div>
			<br />
			<p:menubar model="#{manejadorMenuFormularios.modelItemProyecto}" />
			<br />
			
			<h:panelGrid columns="1" cellpadding="6" cellspacing="3">
		
				<t:div styleClass="contenido-titulo-general-myriad-1">
					<h:outputText value="#{manejadorRubros.proyectoActual.nombre}"
							style="font-weight: bold" />
				</t:div>
				
			</h:panelGrid>
			<br />
			
			<p:panel id="panelRubros" header="lngreso de Rubros">
				<h:panelGrid columns="2">
					<h:outputText value="El total de la fuente seleccionada es de $ " />
					<h:outputText id="totalFuente"
						value="#{manejadorRubros.totalFinanciacion}">
						<f:convertNumber pattern="#,##0.00" />
					</h:outputText>
				</h:panelGrid>
				<h:panelGrid columns="2" align="center">
					<h:outputText value="Fuente del gasto" />
					<p:selectOneMenu
						value="#{manejadorRubros.gastoActual.financiacion.id}"
						valueChangeListener="#{manejadorRubros.cambiaFinanciacion}"
						immediate="true"
						style="width:95%">
						<p:ajax update="totalFuente" />
						<f:selectItems value="#{manejadorRubros.fuentesFinancierasItem}" />
					</p:selectOneMenu>

					<h:outputText value="Tipo de rubro" />
					<p:selectOneMenu
						value="#{manejadorRubros.gastoActual.tipoRubro.id}"
						id="selectTipoRubro" immediate="true" style="width:500px;"
						valueChangeListener="#{manejadorRubros.cambiaTipoRubro}">
						<f:selectItems value="#{manejadorRubros.tiposRubroItem}" />
					</p:selectOneMenu>

					<h:outputText value="Año"
						rendered="#{manejadorRubros.esProgramaNacional}" />
					<p:selectOneMenu value="#{manejadorRubros.gastoActual.vigencia}"
						rendered="#{manejadorRubros.esProgramaNacional}">
						<f:selectItems value="#{manejadorRubros.vigenciaItem}" />
					</p:selectOneMenu>

					<h:outputText value="Valor" />
					<p:inputText id="valorRubro"
						value="#{manejadorRubros.gastoActual.valor}" required="true" 
						requiredMessage="Debe ingresar una cantidad para el valor">
						<f:validateLength minimum="1"/>
					</p:inputText>

					<h:outputText value="Descripción" />
					<p:inputTextarea id="gastosDescripcion"
						value="#{manejadorRubros.gastoActual.descripcion}" rows="4"
						cols="50" required="false" forceId="true"
						autoResize="false" maxlenght="3000"/>
				</h:panelGrid>
				<br />
				<p:messages id="msgs" />
				<h:panelGrid align="center">
					<p:commandButton action="#{manejadorRubros.agregarGasto}"
						value="Agregar" update="@form" ajax="false"/>
				</h:panelGrid>
				<br />
				<p:accordionPanel id="fuentesRubros" multiple="true"
					value="#{manejadorRubros.listaFinanciacionVista}"
					var="financiacionVista">
					<p:tab id="fuenteFinanRubros"
						value="#{financiacionVista.colapsado}"
						title="#{financiacionVista.financiacion.fuente.descripcion}">
						<h:panelGrid columns="1" align="center">
							<h:outputText value="No hay rubros asociados a esta fuente"
								rendered="#{empty financiacionVista.listaGastosVista }" />
						</h:panelGrid>								
						<h:dataTable id="dataTableGastoVista" var="gastoVista"
							value="#{financiacionVista.listaGastosVista}" align="center"
							border="1" cellpadding="4" cellspacing="0"
							rendered="#{!empty financiacionVista.listaGastosVista }">
							<p:column>
								<f:facet name="header">
									<h:outputText value="RUBRO ADICIONADO" />
								</f:facet>
								
								<h:outputText value="#{gastoVista.gasto.tipoRubro.nombre}" />
								<h:panelGrid columns="2" align="center"
									rendered="#{manejadorRubros.esProgramaNacional}">
									<h:outputText value="Año" />
									<h:outputText value="#{gastoVista.gasto.vigencia}"
										rendered="#{manejadorRubros.esProgramaNacional}" />
								</h:panelGrid>
							</p:column>
							<p:column >
								<f:facet name="header">
									<h:outputText value="DESCRIPCIÓN" />
								</f:facet>
								<h:outputText value="#{gastoVista.gasto.descripcion}" />
							</p:column>
							<p:column >
								<f:facet name="header">
									<h:outputText value="VALOR" />
								</f:facet>
								<h:outputText value="#{gastoVista.gasto.valor}" />
							</p:column>
							<p:column>								
								<f:facet name="header">
									<h:outputText value="ELIMINAR" />
								</f:facet>
								<center>
									<p:commandButton action="#{manejadorRubros.eliminarGasto}"
										icon="ui-icon-trash" update="@form">
										<f:setPropertyActionListener
											target="#{manejadorRubros.gastoSeleccionado}"
											value="#{gastoVista}" />
									</p:commandButton>
								</center>
							</p:column>
						</h:dataTable>
					</p:tab>
				</p:accordionPanel>
			</p:panel>
			<br />
			<h:panelGrid columns="4" cellpadding="3" align="center" rendered = "false">
				<h:outputText value="* Si su proyecto NO requiere financiación: " />
				<h:outputText value=" " />
				<p:commandLink
					action="#{manejadorRubros.siguienteUno}" value="Haga Click Aquí." />
				<h:outputText value="Para omitir este Formulario" />
			</h:panelGrid>

			<h:panelGrid columns="3" cellpadding="3" align="center">
				<p:commandButton action="#{manejadorRubros.atras}" value="Atrás"
					immediate="true" update="@form" />
				<p:commandButton action="#{manejadorRubros.salirGuardar}"
					value="Guardar y continuar después" immediate="true" update="@form" />
				<p:commandButton action="#{manejadorRubros.siguiente}"
					value="Guardar y avanzar" immediate="true" update="@form"
					ajax="false" />
			</h:panelGrid>
		</h:form>
	</ui:define>
</ui:composition>
