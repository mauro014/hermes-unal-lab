<?xml version='1.0' encoding='ISO-8859-1' ?>
<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:t="http://myfaces.apache.org/tomahawk"
	xmlns:s="http://myfaces.apache.org/sandbox"
	template="../../../templates/common.xhtml">

<ui:define name="content">
<h:form>


	<h3>Agendas del Conocimiento</h3>
	<br />


<h:panelGroup>
	<h:panelGrid columns="2" align="center" cellpadding="6" cellspacing="3">
		<h:outputText value="Programa:" styleClass="legend1" />
		<h:outputText value="#{manejadorAgendaConocimientos.inicioTitulo}"
			styleClass="legend1" />
	</h:panelGrid>
</h:panelGroup>


<h:panelGrid columns="1" align="left" cellpadding="3" cellspacing="3">

	<h:panelGroup id="panelGeneralAreasPlanGlobal">

		<s:fieldset legend="Áreas de las Agendas del Conocimiento"
			styleClass="legend1">


			
				<br />
			

			<h:panelGrid columns="1" id="panelAreas" align="center">				

				<h:panelGroup>
					<h:panelGrid columns="1" cellpadding="3" align="left" >

						<h:panelGrid columns="2" cellpadding="3" align="left" border="1" >
						<h:outputText value="Área Uno"
							styleClass="legend2" />
						<h:selectOneMenu id="SelectArea1" 
							value="#{manejadorAgendaConocimientos.agendaConocimiento1}"
							onchange="submit(this)" immediate="true"
							valueChangeListener="#{manejadorAgendaConocimientos.cambiarAreaNivel1}"
							styleClass="textarea">
							<f:selectItems value="#{manejadorAgendaConocimientos.agendaConocimiento1Item}" />
						</h:selectOneMenu>
						
					
						<h:outputText value="Sub-Área Uno"
							styleClass="legend2" />
						<h:selectOneMenu id="SelectArea11" 
							value="#{manejadorAgendaConocimientos.agendaSubConocimiento1}"							
							styleClass="textarea">
							<f:selectItems value="#{manejadorAgendaConocimientos.agendaSubConocimiento1Item}" />
						</h:selectOneMenu>
						</h:panelGrid>
						
						<h:panelGrid columns="2" cellpadding="3" align="left" border="1" >
						<h:outputText value="Área Dos"
							styleClass="legend2" />
						<h:selectOneMenu id="SelectArea2" 
							value="#{manejadorAgendaConocimientos.agendaConocimiento2}"
							onchange="submit(this)" immediate="true"
							valueChangeListener="#{manejadorAgendaConocimientos.cambiarAreaNivel2}"
							styleClass="textarea">
							<f:selectItems value="#{manejadorAgendaConocimientos.agendaConocimiento2Item}" />
						</h:selectOneMenu>
						
						<h:outputText value="Sub-Área Dos"
							styleClass="legend2" />
						<h:selectOneMenu id="SelectArea22" 
							value="#{manejadorAgendaConocimientos.agendaSubConocimiento2}"							
							styleClass="textarea">
							<f:selectItems value="#{manejadorAgendaConocimientos.agendaSubConocimiento2Item}" />
						</h:selectOneMenu>
						</h:panelGrid>
						
						<h:panelGrid columns="2" cellpadding="3" align="left" border="1" >
						<h:outputText value="Área Tres"
							styleClass="legend2" />
						<h:selectOneMenu id="SelectArea3" 
							value="#{manejadorAgendaConocimientos.agendaConocimiento3}"
							onchange="submit(this)" immediate="true"
							valueChangeListener="#{manejadorAgendaConocimientos.cambiarAreaNivel3}"
							styleClass="textarea">
							<f:selectItems value="#{manejadorAgendaConocimientos.agendaConocimiento3Item}" />
						</h:selectOneMenu>
						
						<h:outputText value="Sub-Área Tres"
							styleClass="legend2" />
						<h:selectOneMenu id="SelectArea33" 
							value="#{manejadorAgendaConocimientos.agendaSubConocimiento3}"							
							styleClass="textarea">
							<f:selectItems value="#{manejadorAgendaConocimientos.agendaSubConocimiento3Item}" />
						</h:selectOneMenu>
						</h:panelGrid>
						
						<h:outputText />
						<h:outputText value="#{manejadorAgendaConocimientos.errorValidacion}" style="font-size:xx-small; color:#FF3939;  text-align:left;"/>

					</h:panelGrid>
				</h:panelGroup>		
			

			</h:panelGrid>


		</s:fieldset>

	</h:panelGroup>

	

	<h:outputText value="#{manejadorAgendaConocimientos.mensajeValidacion}" style="font-size: xx-small; color:#FF3939; font-weight: bold; text-align: left; font-style: normal" />

	<h:panelGroup>
		
			<br />
			<center>
		

		<h:panelGrid columns="4" cellpadding="3">
			<h:commandButton styleClass="btnlimpiar"
				binding="#{manejadorAgendaConocimientos.botonAtras}"
				action="#{manejadorAgendaConocimientos.atras}" value="Atrás"
				immediate="true" />
			<!--<h:commandButton binding="#{manejadorAgendaConocimientos.botonSalir}" action="#{manejadorAgendaConocimientos.salir}" value="Continuar Después" immediate="true" image="/imgplantilla/pngtitulos/cen_continuardespues.png"/>-->
			<h:commandButton styleClass="btnguardar"
				binding="#{manejadorAgendaConocimientos.botonSalirGuardar}"
				action="#{manejadorAgendaConocimientos.salirGuardar}"
				value="Guardar y continuar después" />
			<h:commandButton styleClass="btnedicion"
				binding="#{manejadorAgendaConocimientos.botonSiguiente}"
				action="#{manejadorAgendaConocimientos.siguiente}"
				value="Guardar y avanzar" />
		</h:panelGrid>
		
			</center>
		

	</h:panelGroup>
</h:panelGrid>


</h:form>
</ui:define>
</ui:composition>
