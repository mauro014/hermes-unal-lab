<?xml version='1.0' encoding='ISO-8859-1' ?>
<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:t="http://myfaces.apache.org/tomahawk"
	xmlns:s="http://myfaces.apache.org/sandbox"
	template="../../../templates/common.xhtml">

	<ui:define name="title">INFORMACIÓN GENERAL</ui:define>
	<ui:define name="content">
		<h:form id="form">


			<t:div styleClass="contenido-titulo-general-myriad">Información General</t:div>
			<br />
			<p:menubar model="#{manejadorMenuFormularios.modelItemProyecto}" />
			<br />

			<h:panelGrid id="mostrarSiConvocatoriaFichaMinima"
				rendered="#{!manejadorFichaMinimaProyectos.mostrarSiConvocatoriaEventos}"
				style="width:100%">

				<p:panel id="panelInformacionAcademica"
					header="I. INFORMACIÓN ACADÉMICO - ADMINISTRATIVA DEL PROYECTO"
					toggleable="true" toggleSpeed="500" closeSpeed="500">

					<p:accordionPanel id="panelUnoInfAcad" multiple="false"
						activeIndex="">
						<p:tab title="Información general" id="infoGeneral"
							rendered="#{!manejadorFichaMinimaProyectos.esConvIni}">
							<br />

							<h:panelGrid columns="3" cellpadding="5" cellspacing="5"
								id="panelGridDescrGeneral" >

								<h:outputText value="Título del proyecto: " rendered="#{!manejadorFichaMinimaProyectos.esConvCienciasAgraEquipos2015}"/>
								<h:outputText value="Detallar el equipo a adquirir: " rendered="#{manejadorFichaMinimaProyectos.esConvCienciasAgraEquipos2015}"/>
								<p:inputTextarea
									value="#{manejadorFichaMinimaProyectos.proyectoActual.nombre}"
									id="titulo"
									validatorMessage="Título debe estar entre 1 - 3000 caracteres"
									rows="3" cols="70">
									<f:validateLength minimum="1" maximum="3000" for="titulo"></f:validateLength>
								</p:inputTextarea>
								<p:message for="titulo" display="icon" />
								
								<h:outputText
									value="Objeto/Objetivo principal (Máx. 4000 caracteres):" rendered="#{!manejadorFichaMinimaProyectos.esConvCienciasAgraEquipos2015}"/>
								<p:inputTextarea
									validatorMessage="Objeto/Objetivo Principal debe estar entre 1 - 4000 caracteres"
									value="#{manejadorFichaMinimaProyectos.proyectoActual.objetivoGeneral}"
									rows="3" id="objeto" cols="70" rendered="#{!manejadorFichaMinimaProyectos.esConvCienciasAgraEquipos2015}">
									<f:validateLength minimum="1" maximum="4000" for="objeto"></f:validateLength>
								</p:inputTextarea >
								<p:message for="objeto" display="icon" rendered="#{!manejadorFichaMinimaProyectos.esConvCienciasAgraEquipos2015}"/>

							</h:panelGrid>


							<br />
							<center>
								<h:outputText value="Productos esperados"
									style='font-weight: bold;' />
							</center>

							<h:outputText
								value="* Seleccionar del siguiente listado los productos de acuerdo a los términos de referencia de la convocatoria o el alcance de la propuesta" />
							<h:outputText
								value="* En esta sección, también podrá escoger el tipo producto 'Estudiante en formación' e ingresar el número de estudiantes participantes en caso de no 
							tener los nombres exactos de los estudiantes."
								rendered="#{manejadorFichaMinimaProyectos.esPosgrado1_2}" />

							<h:outputText
								value=". Si el producto esperado no se encuentra en el listado, por favor comunicarse a las extensiones 18414, 10978 y 10997."
								rendered="#{manejadorFichaMinimaProyectos.esProyectoInnoModDos}" />



							<br />
							<h:panelGrid columns="1" id="panelProductos" align="center">

								<h:panelGroup>

									<h:panelGrid columns="2" cellpadding="5" cellspacing="5"
										align="center" id="panelSubProductos">


										<h:outputText value="Productos" />
										<p:selectOneMenu id="listaNivel3" style="width:200px"
											value="#{manejadorFichaMinimaProyectos.productoNivel3}">
											<f:selectItems
												value="#{manejadorFichaMinimaProyectos.productoNivel3Item}" />
										</p:selectOneMenu>

										<h:outputText value="Cantidad" />
										<p:inputText id="uiCantidad"
											value="#{manejadorFichaMinimaProyectos.cantidad}"
											binding="#{manejadorFichaMinimaProyectos.uiCantidad}"
											validatorMessage="La cantidad debe ser máximo de 4 dígitos y mayor a 0"
											size="5">
											<f:validateLength minimum="1" maximum="4" />
											<f:validateDoubleRange minimum="1" maximum="99999" />
										</p:inputText>
										<h:outputText value="" />
										<p:message id="msgCantiProd" for="uiCantidad" />

									</h:panelGrid>


								</h:panelGroup>

								<h:panelGroup>
									<center>

										<p:commandButton
											action="#{manejadorFichaMinimaProyectos.adicionarProducto}"
											value="Adicionar producto" icon="ui-icon-plus"
											update="panelProductosAdicionados, panelSubProductos, uiCantidad, msgCantiProd" />
									</center>
									<br />
								</h:panelGroup>

								<h:panelGrid columns="1" align="left"
									id="panelProductosAdicionados" style="width:600px">

									<p:dataTable id="tablaProductos"
										value="#{manejadorFichaMinimaProyectos.proyectoActual.listaProductosProyecto}"
										var="proyectoProducto" cellpadding="6" cellspacing="3"
										border="0"
										emptyMessage="No existen productos asociados al proyecto">

										<p:column>
											<f:facet name="header">
												<h:outputText value="PRODUCTOS ADICIONADOS" />
											</f:facet>
											<h:outputText value="#{proyectoProducto.producto.nombre}" />
										</p:column>

										<p:column>
											<f:facet name="header">
												<h:outputText value="CANTIDAD" />
											</f:facet>
											<h:outputText value="#{proyectoProducto.cantidad}" />
										</p:column>

										<p:column>
											<f:facet name="header">
												<h:outputText value="ELIMINAR" />
											</f:facet>
											<center>
												<p:commandButton
													action="#{manejadorFichaMinimaProyectos.eliminarProducto}"
													title="Eliminar Producto" icon="ui-icon-trash"
													update="tablaProductos" immediate="true">
													<f:setPropertyActionListener
														target="#{manejadorFichaMinimaProyectos.productoSeleccionado}"
														value="#{proyectoProducto}" />
												</p:commandButton>
											</center>
										</p:column>
									</p:dataTable>

								</h:panelGrid>
							</h:panelGrid>

						</p:tab>

						<p:tab title="Clasificación y duración"
							id="duracionClasificacion">
							<br />

							<h:panelGrid columns="3" cellpadding="5" cellspacing="5"
								id="panelDurac">

								<h:outputText value="Area de la ciencia principal:"
									rendered="#{!manejadorFichaMinimaProyectos.esConvIni}" />
								<p:selectOneMenu style="width:160px"
									value="#{manejadorFichaMinimaProyectos.areaCiencia}"
									id="areaCiencia"
									rendered="#{!manejadorFichaMinimaProyectos.esConvIni}">
									<f:selectItems
										value="#{manejadorFichaMinimaProyectos.areaCienciaItems}" />
								</p:selectOneMenu>
								<h:outputLink
									value="#{manejadorFichaMinimaProyectos.linkLineas}"
									target="_blank">
									<h:graphicImage id="imageee" alt="jsf-sun"
										url="/images/iconpdf.png">
									</h:graphicImage>
								</h:outputLink>

								<h:outputText value="Area de la ciencia secundaria:"
									rendered="#{!manejadorFichaMinimaProyectos.esConvIni}" />
								<p:selectOneMenu style="width:160px"
									value="#{manejadorFichaMinimaProyectos.areaCienciaSec}"
									id="areaCiencia1"
									rendered="#{!manejadorFichaMinimaProyectos.esConvIni}">
									<f:selectItems
										value="#{manejadorFichaMinimaProyectos.areaCienciaItems}" />
								</p:selectOneMenu>
								<p:message for="areaCiencia" display="icon" />


								<h:outputText value="Objetivo socioeconómico:"
									rendered="#{!manejadorFichaMinimaProyectos.esConvIni}" />
								<p:selectOneMenu id="socioeconomico" style="width:160px"
									rendered="#{!manejadorFichaMinimaProyectos.esConvIni}"
									value="#{manejadorFichaMinimaProyectos.proyectoActual.objetivoSocioeconomico}">
									<f:selectItems
										value="#{manejadorFichaMinimaProyectos.objSocioeconomicoItems}" />
								</p:selectOneMenu>
								<h:outputLink
									value="#{manejadorFichaMinimaProyectos.linkObjetivos}"
									target="_blank">
									<h:graphicImage id="images" alt="jsf-sun"
										url="/images/iconpdf.png">
									</h:graphicImage>
								</h:outputLink>

								<h:outputText value="Duración (Meses):" rendered="#{!manejadorFichaMinimaProyectos.esConvCienciasAgraEquipos2015}"/>
								<p:inputText
									value="#{ manejadorFichaMinimaProyectos.proyectoActual.duracion}"
									size="3" id="horam" rendered="#{!manejadorFichaMinimaProyectos.esConvCienciasAgraEquipos2015}">
								</p:inputText>
								<p:message for="horam" display="icon" rendered="#{!manejadorFichaMinimaProyectos.esConvCienciasAgraEquipos2015}"/>


							</h:panelGrid>




							<br />
						</p:tab>

						<p:tab title="Palabras clave" id="palabrasClave"
							rendered="#{!manejadorFichaMinimaProyectos.esConvIni}">
							<h:panelGrid columns="3" id="gridPalabraClave" align="center">
								<h:outputText value="Palabras Clave" />
								<p:autoComplete id="palabraClaveS"
									value="#{manejadorFichaMinimaProyectos.palabraClave.palabra}"
									size="50" maxResults="10"
									completeMethod="#{manejadorFichaMinimaProyectos.obtenerPalabraClavesSugeridas}"
									minQueryLength="2">
									<f:validateLength maximum="100" />
								</p:autoComplete>

								<p:commandButton id="agregarPalabraClave"
									value="Agregar palabra"
									update="palabrasTable, gridPalabraClave"
									action="#{manejadorFichaMinimaProyectos.insertarPalabraClave}">
								</p:commandButton>

							</h:panelGrid>

							<br />
							<br />
							<p:outputPanel id="grupoListaPalabras" align="center">
								<p:dataTable id="palabrasTable"
									value="#{manejadorFichaMinimaProyectos.proyectoActual.listaPalabrasES}"
									var="pal"
									emptyMessage="No se encuentran palabras clave registradas">

									<p:column style="width:25%">
										<f:facet name="header">
											<h:outputText value="Palabra Clave" />
										</f:facet>
										<h:outputText value="#{pal.palabraVista}" />
									</p:column>

									<p:column style="width:3%">
										<center>
											<p:commandButton id="selectButton" update="palabrasTable"
												icon="ui-icon-trash"
												action="#{manejadorFichaMinimaProyectos.eliminarPalabraClave}"
												title="Eliminar palabra clave">
												<f:setPropertyActionListener value="#{pal}"
													target="#{manejadorFichaMinimaProyectos.palabraClaveTabla}" />
											</p:commandButton>
										</center>
									</p:column>

								</p:dataTable>
							</p:outputPanel>
							<br />

						</p:tab>

						<p:tab title="Equipo de trabajo UN" id="equipoTrabajo">

							<br />
							<br />

							<center>
								<h:outputText value="Director"
									style='font-weight: bold;' />
							</center>
							<br />

							<p:panelGrid columns="3" styleClass="estilo-panelgrid-sinbordes"
								id="registroinv">

								<h:outputText value="Tipo documento:" />
								<p:selectOneMenu style="width:160px"
									value="#{manejadorFichaMinimaProyectos.tipoDocumentoCoInv.id}"
									id="tipodoecv" disabled="true">
									<f:selectItems
										value="#{manejadorFichaMinimaProyectos.tipoDocumentoItem}" />
								</p:selectOneMenu>
								<p:message for="tipodoecv" display="icon" />

								<h:outputText value="Documento de identidad:" />
								<p:inputText
									value="#{manejadorFichaMinimaProyectos.documentoCoinv}"
									id="documentov" readonly="true" />
								<p:message for="documentov" display="icon" />

								<h:outputText
									value="Tiempo de dedicación al proyecto (Horas semanales) - td:" />
								<p:inputText id="horasCoinv"
									value="#{manejadorFichaMinimaProyectos.horasDirector}">
									<f:validateLongRange minimum="0" maximum="1000"
										for="horasCoinv" />
								</p:inputText>
								<p:message for="horasCoinv" display="icon" />

								<h:outputText value="" />
								<p:commandButton id="buscarDirector" update="@form"
									action="#{manejadorFichaMinimaProyectos.agregarDirector}"
									value="Agregar" />


							</p:panelGrid>



							<br />
							<h:outputText value="El director es:"
								style='font-weight: bold;' />
							<br />
							<br />

							<center>
								<p:dataTable id="directorTabla" var="coinvestigador"
									value="#{manejadorFichaMinimaProyectos.listaDirector}"
									emptyMessage="No se ha agregado el director" style="width:80%">

									<p:column headerText="Director">
										<h:outputText
											value="#{coinvestigador.investigador.nombre1} #{coinvestigador.investigador.apellido1}" />
									</p:column>
									<p:column headerText="Documento">
										<h:outputText
											value="#{coinvestigador.investigador.id.documento}" />
									</p:column>

									<p:column headerText="Unidad">
										<h:outputText
											value="#{coinvestigador.investigador.dependencia.nombre}" />
									</p:column>

									<p:column headerText="td" style="width:60%">
										<h:outputText value=" #{coinvestigador.dedicacionHorasSemana}" />
									</p:column>

									<p:column headerText="Valor(dedicación-$)" style="width:60%">
										<h:outputText value=" #{coinvestigador.valorPagar}" />
									</p:column>


									<p:column headerText="Eliminar" id="columnCoinv">
										<p:commandButton
											action="#{manejadorFichaMinimaProyectos.eliminarDirector}"
											update="@form" id="eliminarDirector" icon="ui-icon-trash"
											title="Eliminar Director">
										</p:commandButton>
									</p:column>

								</p:dataTable>
							</center>
							<br />



							<br />
							<p:separator></p:separator>
							<br />
							<center>
								<h:outputText value="Participantes:"
									style='font-weight: bold;' />
							</center>
							<br />

							<p:panelGrid columns="1" styleClass="estilo-panelgrid-sinbordes"
								id="msgEstudiante" style='font-weight: bold;'>
								<h:outputText
									value=" A continuación ingrese el(los) estudiante(s) que haga(n) parte del equipo de trabajo. Para ello, tenga en cuenta  que debe asociar al estudiante que desarrollará el proyecto con el tipo de vinculación 'Estudiante Líder'"
									rendered="#{manejadorFichaMinimaProyectos.verFichaMin}" />

								<h:outputText
									value="* No es necesario ingresar los estudiantes del curso como partipantes del proyecto"
									rendered="#{manejadorFichaMinimaProyectos.materiasSIA}" />

								<h:outputText
									value="* Para la Modalidad 2: Ingrese sólo un estudiante"
									rendered="#{manejadorFichaMinimaProyectos.verFichaMin}" />

								<h:outputText
									value="* Para la Modalidad 3: Se aclara que cada apoyo está dirigido a financiar el trabajo de grado de un estudiante. 
									No obstante, si el trabajo de grado puede ser desarrollado por más de un estudiante, podrá hacerse solo una postulación vinculando los estudiantes respectivos."
									rendered="#{manejadorFichaMinimaProyectos.verFichaMin}" />

								<h:outputText
									value="NOTA: Si ya tiene definidos los estudiantes de posgrado que va a vincular, puede ingresarlos a continuación. De lo contrario NO es obligatorio"
									rendered="#{manejadorFichaMinimaProyectos.esPosgrado1_2}" />

							</p:panelGrid>

							<br />
							<p:panelGrid columns="3" styleClass="estilo-panelgrid-sinbordes"
								id="registroinv2">

								<h:outputText value="Tipo de vinculación:" />
								<p:selectOneMenu
									value="#{manejadorFichaMinimaProyectos.selItems}"
									id="somCategoriaGrupos" style="width:160px">
									<f:selectItems id="siCategoriaGrupos"
										value="#{manejadorFichaMinimaProyectos.tipoVinculacionItems}" />
									<p:ajax
										listener="#{manejadorFichaMinimaProyectos.cambiarVinculacion}"
										update="@parent" />
								</p:selectOneMenu>
								<h:outputText value="" />

								<h:outputText value="Tipo documento:" />
								<p:selectOneMenu style="width:160px"
									value="#{manejadorFichaMinimaProyectos.tipoDocumentoCoInv2.id}"
									id="tipodoecv2">
									<f:selectItems
										value="#{manejadorFichaMinimaProyectos.tipoDocumentoItem}" />
								</p:selectOneMenu>
								<p:message for="tipodoecv2" display="icon" />

								<h:outputText value="Documento de identidad:" />
								<p:inputText
									value="#{manejadorFichaMinimaProyectos.documentoCoinv2}"
									id="documentov2" />
								<p:message for="documentov2" display="icon" />

								<h:outputText value="Primer Nombre *"
									rendered="#{manejadorFichaMinimaProyectos.esOtraVinculacion}" />
								<p:inputText id="primerNombreInvestigador"
									rendered="#{manejadorFichaMinimaProyectos.esOtraVinculacion}"
									value="#{manejadorFichaMinimaProyectos.investigadorExterno.nombre1}"
									size="38" requiredMessage="El Primer Nombre es obligatorio">
									<f:validateLength maximum="20" />
								</p:inputText>
								<p:message id="errorPrimerNombreInvestigador"
									for="primerNombreInvestigador"
									rendered="#{manejadorFichaMinimaProyectos.esOtraVinculacion}" />

								<h:outputText value="Segundo Nombre"
									rendered="#{manejadorFichaMinimaProyectos.esOtraVinculacion}" />
								<p:inputText id="segundoNombreInv"
									value="#{manejadorFichaMinimaProyectos.investigadorExterno.nombre2}"
									size="38"
									rendered="#{manejadorFichaMinimaProyectos.esOtraVinculacion}">
									<f:validateLength maximum="20" />
								</p:inputText>
								<p:message id="errorSegundoNombreInv" for="segundoNombreInv"
									rendered="#{manejadorFichaMinimaProyectos.esOtraVinculacion}" />

								<h:outputText value="Primer Apellido *"
									rendered="#{manejadorFichaMinimaProyectos.esOtraVinculacion}" />
								<p:inputText id="primerApellidoInvestigador"
									rendered="#{manejadorFichaMinimaProyectos.esOtraVinculacion}"
									value="#{manejadorFichaMinimaProyectos.investigadorExterno.apellido1}"
									size="38" requiredMessage="El Primer Apellido es obligatorio">
									<f:validateLength maximum="20" />
								</p:inputText>
								<p:message id="errorPrimerApellidoInvestigador"
									rendered="#{manejadorFichaMinimaProyectos.esOtraVinculacion}"
									for="primerApellidoInvestigador" />

								<h:outputText value="Segundo Apellido"
									rendered="#{manejadorFichaMinimaProyectos.esOtraVinculacion}" />
								<p:inputText id="segundoApellidoInv"
									rendered="#{manejadorFichaMinimaProyectos.esOtraVinculacion}"
									value="#{manejadorFichaMinimaProyectos.investigadorExterno.apellido2}"
									size="38">
									<f:validateLength maximum="20" />
								</p:inputText>
								<p:message id="errorSegundoApellidoInv" for="segundoApellidoInv"
									rendered="#{manejadorFichaMinimaProyectos.esOtraVinculacion}" />

								<h:outputText value="Género"
									rendered="#{manejadorFichaMinimaProyectos.esOtraVinculacion}" />
								<p:selectOneMenu
									rendered="#{manejadorFichaMinimaProyectos.esOtraVinculacion}"
									value="#{manejadorFichaMinimaProyectos.investigadorExterno.genero}"
									id="idGenero" style="width:40px">
									<f:selectItems
										value="#{manejadorFichaMinimaProyectos.generoItem}" />
								</p:selectOneMenu>
								<h:outputText value="" />

								<h:outputText value="Unidad ejecutora"
									rendered="#{manejadorFichaMinimaProyectos.esOtraVinculacion}" />
								<p:selectOneMenu
									rendered="#{manejadorFichaMinimaProyectos.esOtraVinculacion}"
									value="#{manejadorFichaMinimaProyectos.unidadEjecutoraPart}"
									id="dependenciasUN" style="width:300px" filter="true">
									<f:selectItems
										value="#{manejadorFichaMinimaProyectos.dependenciaItem}" />
								</p:selectOneMenu>
								<h:outputText value="" />

							</p:panelGrid>


							<p:panelGrid columns="3" styleClass="estilo-panelgrid-sinbordes"
								id="registroinv2_3">

								<h:outputText
									value="Tiempo de dedicación al proyecto (Horas semanales) - td:" />
								<p:inputText id="horasCoinv2"
									value="#{manejadorFichaMinimaProyectos.horasParticipante}">
									<f:validateLongRange minimum="0" maximum="1000"
										for="horasCoinv2" />
								</p:inputText>
								<p:message for="horasCoinv2" display="icon" />

								<h:outputText
									value="Tiempo total de dedicación al proyecto (meses) - tt:" />
								<p:inputText id="horasCoinv3"
									value="#{manejadorFichaMinimaProyectos.tiempoTotalParticipante}">

										<h:outputText value="CANTIDAD" />
									</f:facet>
									<h:outputText value="#{proyectoProducto.cantidad}" />
								</p:column>

								<p:column>
									<f:facet name="header">
										<h:outputText value="ELIMINAR" />
									</f:facet>
									<center>
										<p:commandButton
											action="#{manejadorFichaMinimaProyectos.eliminarProducto}"
											title="Eliminar Producto" icon="ui-icon-trash"
											update="tablaProductosEventos" immediate="true">
											<f:setPropertyActionListener
												target="#{manejadorFichaMinimaProyectos.productoSeleccionado}"
												value="#{proyectoProducto}" />
										</p:commandButton>
									</center>
								</p:column>
							</p:dataTable>

						</h:panelGrid>
					</h:panelGrid>

				</p:panel>

			</h:panelGrid>

			<br />

			<p:messages id="messages" showDetail="false" autoUpdate="true"
				closable="true" />

			<h:panelGroup>
				<center>

					<h:panelGrid columns="3">
						<p:commandButton value="Atrás" id="botonAtras"
							styleClass="ui-priority-primary" />

						<p:commandButton value="Guardar y continuar después"
							action="#{manejadorFichaMinimaProyectos.salirGuardar}"
							id="botonGuardarSalir" styleClass="ui-priority-primary" />


						<p:commandButton value="Guardar y avanzar"
							action="#{manejadorFichaMinimaProyectos.siguiente}" ajax="false"
							id="botonGuardarSiguiente" styleClass="ui-priority-primary" />
					</h:panelGrid>

				</center>
			</h:panelGroup>
		</h:form>
	</ui:define>
