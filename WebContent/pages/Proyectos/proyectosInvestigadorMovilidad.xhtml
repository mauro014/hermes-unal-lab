	<ui:define name="content">
		<h:form id="content">
			<t:div styleClass="contenido-titulo-general-myriad">Consultar movilidades</t:div>
			<p:growl id="growl" showDetail="true" />
			<p:growl id="growl2" showDetail="true" />
			<p:growl id="growl3" showDetail="true" />
			<p:growl id="growl4" showDetail="true" />
			<p:tabView>
				<!-- 	Visitantes internacionales -->
				<p:tab title="Visitantes extranjeros" titleStyle="font-size:12px">
					<p:growl id="growl" showDetail="true" />
					<p:dataTable var="movilidadVisitante"
						value="#{manejadorConsultaMovilidadesInvestigador.listaMovilidadesVisitante}"
						emptyMessage="No existen movilidades de visitantes internacionales"
						paginator="true" paginatorAlwaysVisible="false" rows="15" filteredValue="#{manejadorConsultaMovilidadesInvestigador.listaMovilidadesVisitanteFil}"

						<p:ajax event="rowToggle" update=":content:growl" />
						<p:column style="width:4%">
							<p:rowToggler />
						</p:column>
						<p:column style="text-align: center;font-size:13px; width:5%">
							<f:facet name="header">
								<h:outputText value="Id" />
							</f:facet>

							<h:outputText value="#{movilidadVisitante.id}" />
						</p:column>
						<p:column style="text-align: center;font-size:13px; width:7%">
							<f:facet name="header">
								<h:outputText value="Fecha" />
								<br />
								<h:outputText value="inicio" />
							</f:facet>
							<h:outputText value="#{movilidadVisitante.fechainicial}" />
						</p:column>
						<p:column style="text-align: center;font-size:13px; width:25%">
							<f:facet name="header">
								<h:outputText value="Fecha" />
								<br />
								<h:outputText value="solicitud" />
							</f:facet>
							<h:outputText value="#{movilidadVisitante.fechasolicitud}">
								<f:convertDateTime type="both" dateStyle="short" />
							</h:outputText>
						</p:column>
						<p:column style="text-align: center;font-size:13px; width:7%" filterBy="#{movilidadVisitante.convocatoria.padre.titulo}" filterMatchMode="contains">
							<f:facet name="header">

							</f:facet>
							<h:outputText value="#{movilidadVisitante.convocatoria.padre.titulo}" />
						</p:column>
						<p:column style="text-align: center;font-size:13px; width:7%">
							<f:facet name="header">
								<h:outputText value="Aprobado" />
								<br />
								<h:outputText value="facultad" />
							</f:facet>
							<h:outputText value="#{movilidadVisitante.aceptacion}" />
						</p:column>
						<p:column style="text-align: center;font-size:13px; width:7%">
							<f:facet name="header">
								<h:outputText value="Aprobado" />
								<br />
								<h:outputText value="sede" />
							</f:facet>
							<h:outputText value="#{movilidadVisitante.aprobacion}" />
						</p:column>
						<p:column style="text-align: center;font-size:13px; width:12%">
							<f:facet name="header">
								<h:outputText value="Seguimiento" />
							</f:facet>
							<p:commandButton id="segVisReg" title="Registrar"
								icon="ui-icon-pencil"
								rendered="#{movilidadVisitante.aprobacion == 'SI' ? (movilidadVisitante.estadoSeguimiento == null or movilidadVisitante.estadoSeguimiento == 'P' or movilidadVisitante.estadoRevisionSeguimiento == 'D' ? true:false):false}"
								action="#{manejadorConsultaMovilidadesInvestigador.registrarSeguimientoVisExt}"
								ajax="false">
								<f:setPropertyActionListener value="#{movilidadVisitante}"
									target="#{manejadorConsultaMovilidadesInvestigador.movilidadVisExtSel}" />
							</p:commandButton>
							<p:commandButton id="segVisCons" title="Consultar"
								icon="ui-icon-search"
								rendered="#{movilidadVisitante.aprobacion == 'SI' ? (movilidadVisitante.estadoSeguimiento == 'F' and movilidadVisitante.estadoRevisionSeguimiento != 'D'? true:false):false}"
								action="#{manejadorConsultaMovilidadesInvestigador.consultarSeguimientoVisExt}"
								ajax="false">
								<f:setPropertyActionListener value="#{movilidadVisitante}"
									target="#{manejadorConsultaMovilidadesInvestigador.movilidadVisExtSel}" />
							</p:commandButton>
							<h:outputText value="--"
								rendered="#{movilidadVisitante.aprobacion == null ? true:(movilidadVisitante.aprobacion == 'NO' ? true:false)}"></h:outputText>
						</p:column>
						<p:column headerText="Acciones"
							style="font-size:13px; width:5%; text-align: center; ">
							<h:commandLink

								<f:setPropertyActionListener value="#{movilidadVisitante}"
									target="#{manejadorConsultaMovilidadesInvestigador.movilidadVisitanteExteSeleccionada}" />
							</h:commandLink>
							<p:commandButton id="editarMovVis" title="Editar"
								icon="ui-icon-pencil"
								rendered="#{movilidadVisitante.estado == 'I'}"
								action="#{manejadorConsultaMovilidadesInvestigador.editarMovVisExt}"
								ajax="false">
								<f:setPropertyActionListener value="#{movilidadVisitante}"
									target="#{manejadorConsultaMovilidadesInvestigador.movilidadVisExtSel}" />
							</p:commandButton>
						</p:column>

							<p:dataTable var="archivo"
								value="#{movilidadVisitante.listaArchivo}" style="margin: 15px;"

								<f:facet name="header">
									<h:outputText value="Archivos asociados" />
								</f:facet>

									<div class="listaSencilla">
										<h:outputText value="#{archivo.id}" />
									</div>
								</p:column>
								<p:column headerText="Nombre archivo">
									<div class="listaSencilla" style="width: 350px;">
										<h:outputText value="#{archivo.nombre}" />
									</div>
								</p:column>
								<p:column headerText="Acción"
									style="width: 100px; text-align: center;">
									<h:commandLink
										style="text-decoration:none; 
											color: #16A8E2;
											font-weight: bold;"
										action="#{manejadorConsultaMovilidadesInvestigador.descargarDocumentoVisitante}">
												Descargar
										<f:param name="archivoResumen1" value="#{archivo.id}" />
										<f:param name="movilidadVisitante"
											value="#{movilidadVisitante.id}" />
									</h:commandLink>
								</p:column>
							</p:dataTable>
						</p:rowExpansion>
					</p:dataTable>
				</p:tab>

								ajax="false">
								<f:setPropertyActionListener value="#{movilidadEvento}"
									target="#{manejadorConsultaMovilidadesInvestigador.movilidadDocentesExteriorSeleccionada}" />
							</p:commandButton>
						</p:column>
						<p:rowExpansion>
							<p:dataTable var="archivo2"

										<h:outputText value="#{archivo2.nombre}" />

							</p:dataTable>

								<h:outputText value="Inicio" />
							</f:facet>
							<h:outputText
								value="#{movilidadEvento.fechainicial != null ? movilidadEvento.fechainicial:'Sin registrar'}" />

						<p:column style="text-align: center;font-size:13px; width:14%">
							<f:facet name="header">
								<h:outputText value="Fecha" />
								<br />
								<h:outputText value="Solicitud" />

							</h:outputText>

						<p:column style="text-align: center;font-size:13px; width:7%" filterBy="#{movilidadEvento.convocatoria.padre.titulo}" filterMatchMode="contains">
							<f:facet name="header">

								<f:setPropertyActionListener value="#{movilidadEvento}"
									target="#{manejadorConsultaMovilidadesInvestigador.movilidadDocenteArt}" />
