<?xml version='1.0' encoding='ISO-8859-1' ?>
<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:t="http://myfaces.apache.org/tomahawk"
	xmlns:s="http://myfaces.apache.org/sandbox"
	template="../../../templates/common.xhtml">
	<ui:define name="content">
		<h:form enctype="multipart/form-data">
			<t:div styleClass="contenido-titulo-general-myriad"
				rendered="#{manejadorRegistroInformeBancoProyectos.editable}">Registro informe proyecto</t:div>
			<t:div styleClass="contenido-titulo-general-myriad"
				rendered="#{!manejadorRegistroInformeBancoProyectos.editable}">Consultar informe proyecto</t:div>
			<p:panel>
				<p:panelGrid columns="2" styleClass="estilo-panelgrid-sinbordes"
					style="border-collapse: separate;">
					<h:outputText value="Código: " />
					<h:outputText
						value="#{manejadorRegistroInformeBancoProyectos.proyectoActual.id}"
						style=' font-weight: bold' />
					<h:outputText value="Nombre proyecto: " />
					<h:outputText
						value="#{manejadorRegistroInformeBancoProyectos.proyectoActual.nombre}"
						style=' font-weight: bold;' />
					<h:outputText value="Fecha de entrega: " />
					<h:outputText
						value="#{manejadorRegistroInformeBancoProyectos.fechaEntrega}"
						style=' font-weight: bold;' />
				</p:panelGrid>
			</p:panel>
			<p:messages id="msgs" />
			<p:dataTable var="actividadInforme"
				emptyMessage="No se ha encontrado ninguna actividad"
				value="#{manejadorRegistroInformeBancoProyectos.listaActividades}"
				style="width: 670px; margin-top: 20px;">
				<f:facet name="header">
					<h:outputText value="Desarrollo de actividades" />
				</f:facet>
				<p:column>
					<f:facet name="header">
						<h:outputText value="Descripción actividad" />
						<br />
						<h:outputText value="esperada" />
					</f:facet>
					<t:div style="width: 145px;">
						<h:outputText value="#{actividadInforme.actividad.descripcion}" />
					</t:div>
				</p:column>
				<p:column>
					<f:facet name="header">
						<h:outputText value="Descripción actividad desarrolada" />
					</f:facet>
					<h:outputText value="#{actividadInforme.desarrollada}"
						rendered="#{!manejadorRegistroInformeBancoProyectos.editable}" />
					<p:inputTextarea value="#{actividadInforme.desarrollada}"
						style="width: 220px;"
						rendered="#{manejadorRegistroInformeBancoProyectos.editable}"
						maxlength="3800" />
				</p:column>
				<p:column>
					<f:facet name="header">
						<h:outputText value="Observaciones" />
					</f:facet>
					<h:outputText value="#{actividadInforme.observaciones}"
						rendered="#{!manejadorRegistroInformeBancoProyectos.editable}" />
					<p:inputTextarea style="width: 220px;"
						value="#{actividadInforme.observaciones}"
						rendered="#{manejadorRegistroInformeBancoProyectos.editable}"
						maxlength="1800" />
				</p:column>
			</p:dataTable>
			<p:dataTable var="resultadoInforme"
				emptyMessage="No se ha encontrado ningún resultado"
				value="#{manejadorRegistroInformeBancoProyectos.listaResultados}"
				style="width: 670px; margin-top: 20px;">
				<f:facet name="header">
					<h:outputText value="Resultados obtenidos" />
				</f:facet>
				<p:column>
					<f:facet name="header">
						<h:outputText value="Descripción resultado" />
						<br />
						<h:outputText value="esperado" />
					</f:facet>
					<t:div style="width: 145px;">
						<h:outputText
							value="#{resultadoInforme.resultadoProyecto.descripcion}" />
					</t:div>
				</p:column>
				<p:column>
					<f:facet name="header">
						<h:outputText value="Resultado logrado" />
					</f:facet>
					<h:outputText value="#{resultadoInforme.logrado}"
						rendered="#{!manejadorRegistroInformeBancoProyectos.editable}" />
					<p:inputTextarea value="#{resultadoInforme.logrado}"
						style="width: 220px;"
						rendered="#{manejadorRegistroInformeBancoProyectos.editable}"
						maxlength="3800" />
				</p:column>
				<p:column>
					<f:facet name="header">
						<h:outputText value="Observaciones" />
					</f:facet>
					<h:outputText value="#{resultadoInforme.observaciones}"
						rendered="#{!manejadorRegistroInformeBancoProyectos.editable}" />
					<p:inputTextarea style="width: 220px;"
						value="#{resultadoInforme.observaciones}"
						rendered="#{manejadorRegistroInformeBancoProyectos.editable}"
						maxlength="1800" />
				</p:column>
			</p:dataTable>
			<p:panel header="Avance en trabajo colaborativo"
				id="pAvanceColaboratico" style="margin-top:20px;">
				<p:panelGrid columns="2" styleClass="estilo-panelgrid-sinbordes"
					style="border-collapse: separate;">
					<h:outputText
						value="Describa como se fortalecieron las relaciones con las entidades externas de colaboración en el marco del trabajo conjunto:" />
					<h:outputText
						value="#{manejadorRegistroInformeBancoProyectos.avanceColaborativo}"
						rendered="#{!manejadorRegistroInformeBancoProyectos.editable}"
						style="font-weight: bold;" />
					<p:inputTextarea cols="50"
						value="#{manejadorRegistroInformeBancoProyectos.avanceColaborativo}"
						rendered="#{manejadorRegistroInformeBancoProyectos.editable}"
						maxlength="3800" counter="counterAvanceColaborativo"
						counterTemplate="{0} caracteres restantes." />
					<h:outputText value=""
						rendered="#{manejadorRegistroInformeBancoProyectos.editable}" />
					<h:outputText id="counterAvanceColaborativo"
						rendered="#{manejadorRegistroInformeBancoProyectos.editable}" />
				</p:panelGrid>
			</p:panel>
			<p:panel header="Avance en la postulación" id="pAvancePostulacion"
				style="margin-top:20px;">
				<p:panel
					rendered="#{manejadorRegistroInformeBancoProyectos.editable}">
					<h:outputText
						value="Si la entidad externa a la cual presento el proyecto no se encuentra en la lista por favor 
					comunicarse con la linea de soporte del Sistema de Información Hermes para que esta sea creada." />
				</p:panel>
				<p:panelGrid columns="2" styleClass="estilo-panelgrid-sinbordes"
					style="border-collapse: separate;">
					<h:outputText
						value="Nombre de la entidad externa a la cual presentó el proyecto:" />
					<p:selectOneMenu
						value="#{manejadorRegistroInformeBancoProyectos.entidadExterna}"
						style="width:350px"
						disabled="#{!manejadorRegistroInformeBancoProyectos.editable}"
						panelStyle="width: 350px;" filter="true"
						filterMatchMode="contains">
						<f:selectItems
							value="#{manejadorRegistroInformeBancoProyectos.entidadesExternas}"
							var="entidadesExternas" itemValue="#{entidadesExternas.id}"
							itemLabel="#{entidadesExternas.descripcion}" />
					</p:selectOneMenu>
					<h:outputText
						value="Nombre de la convocatoria o proceso de la entidad externa a la que se presentó el proyecto:" />
					<h:outputText
						value="#{manejadorRegistroInformeBancoProyectos.convocatoriaExterna}"
						rendered="#{!manejadorRegistroInformeBancoProyectos.editable}" />
					<p:inputTextarea cols="40"
						value="#{manejadorRegistroInformeBancoProyectos.convocatoriaExterna}"
						maxlength="3800"
						rendered="#{manejadorRegistroInformeBancoProyectos.editable}"
						counter="counterConvocatoriaExterna"
						counterTemplate="{0} caracteres restantes." />
					<h:outputText value=""
						rendered="#{manejadorRegistroInformeBancoProyectos.editable}" />
					<h:outputText id="counterConvocatoriaExterna"
						rendered="#{manejadorRegistroInformeBancoProyectos.editable}" />
					<h:outputText value="Estado de la postulación:" />
					<p:selectOneMenu style="width:200px;"
						value="#{manejadorRegistroInformeBancoProyectos.estadoPostulacion}"
						id="selectEstadoPostulacion" panelStyle="width: 200px;"
						disabled="#{!manejadorRegistroInformeBancoProyectos.editable}">
						<f:selectItems
							value="#{manejadorRegistroInformeBancoProyectos.estadosPostulacion}"
							var="estadoPostulacion"
							itemValue="#{estadoPostulacion.identificador.tipo}"
							itemLabel="#{estadoPostulacion.descripcion}" />
						<p:ajax update="@parent" process="@parent"
							onstart="dialogEspere.show()" oncomplete="dialogEspere.hide()" />
					</p:selectOneMenu>
					<h:outputText value="Fecha prevista de resultados:"
						rendered="#{manejadorRegistroInformeBancoProyectos.estadoPostulacion == manejadorRegistroInformeBancoProyectos.OPCION_FECHA_PREVISTA_RESULTADOS}" />
					<p:calendar id="fechainicio" locale="es"
						rendered="#{manejadorRegistroInformeBancoProyectos.estadoPostulacion == manejadorRegistroInformeBancoProyectos.OPCION_FECHA_PREVISTA_RESULTADOS}"
						readonlyInput="true" pattern="dd/MM/yyyy" navigator="true"
						value="#{manejadorRegistroInformeBancoProyectos.fechaPrevista}"
						mindate="today" />
					<h:outputText
						value="#{manejadorRegistroInformeBancoProyectos.fechaPrevista}"
						rendered="#{!manejadorRegistroInformeBancoProyectos.editable and manejadorRegistroInformeBancoProyectos.estadoPostulacion == manejadorRegistroInformeBancoProyectos.OPCION_FECHA_PREVISTA_RESULTADOS}" />
					<h:outputText value="Monto solicitado a entidad convocante:" />
					<p:inputText id="montoSolicitado"
						value="#{manejadorRegistroInformeBancoProyectos.montoSolicitado}"
						validatorMessage="Debe indicar el monto que solicitud a entidad convocante."
						converterMessage="Monto solicitado a la entidad convocante debe ser un número válido"
						rendered="#{manejadorRegistroInformeBancoProyectos.editable}"
						maxlength="40">
						<f:validateLongRange minimum="0" maximum="10000000000000"
							for="montoSolicitado" />
					</p:inputText>
					<h:outputText
						value="#{manejadorRegistroInformeBancoProyectos.montoSolicitado}"
						rendered="#{!manejadorRegistroInformeBancoProyectos.editable}" />
					<h:outputText
						value="Contribución a la formación en procesos de investigación o de extensión de estudiantes de pregrado o de posgrado de la Universidad Nacional de Colombia. (Si aplica):" />
					<p:inputTextarea cols="40"
						value="#{manejadorRegistroInformeBancoProyectos.contribucionFormacion}"
						maxlength="3800"
						rendered="#{manejadorRegistroInformeBancoProyectos.editable}"
						counter="counterContribucionFormacion"
						counterTemplate="{0} caracteres restantes." />
					<h:outputText value=""
						rendered="#{manejadorRegistroInformeBancoProyectos.editable}" />
					<h:outputText id="counterContribucionFormacion"
						rendered="#{manejadorRegistroInformeBancoProyectos.editable}" />
					<h:outputText
						value="#{manejadorRegistroInformeBancoProyectos.contribucionFormacion}"
						rendered="#{!manejadorRegistroInformeBancoProyectos.editable}" />
				</p:panelGrid>
			</p:panel>
			<p:panel header="Documentos adicionales" id="pDocumentosAdicionales"
				style="margin-top:20px;">
				<p:panel
					rendered="#{manejadorRegistroInformeBancoProyectos.editable}">
					<h:outputText
						value="Recuerde que debe adjuntar los siguientes documentos: * Evidencias de los acuerdos y otros logros del trabajo conjunto, 
					* Preacuerdo sobre la participación de la propiedad intelectual, * Proyecto formulado y * Evidencia de postulación y radicación." />
				</p:panel>
				<p:panelGrid columns="1" styleClass="estilo-panelgrid-sinbordes"
					id="tablaArchivosAdicionales" style="border-collapse: separate;">

					<p:dataTable var="archivo"
						emptyMessage="No ha adjuntado ningún archivo adjunto"
						value="#{manejadorRegistroInformeBancoProyectos.listaArchivos}"
						style="width: 650px;">
						<p:column>
							<f:facet name="header">
								<h:outputText value="Nombre del archivo" />
							</f:facet>
							<h:outputText value=" #{archivo.nombre}" />
						</p:column>
						<p:column>
							<f:facet name="header">
								<h:outputText value="Descargar" />
							</f:facet>
							<p:commandButton value="ver"
								action="#{manejadorRegistroInformeBancoProyectos.verArchivo}"
								ajax="false">
								<f:setPropertyActionListener value="#{archivo}"
									target="#{manejadorRegistroInformeBancoProyectos.archivoSeleccionado}" />
							</p:commandButton>
						</p:column>
						<p:column
							rendered="#{manejadorRegistroInformeBancoProyectos.editable}">
							<f:facet name="header">
								<h:outputText value="Eliminar" />
							</f:facet>
							<p:commandButton value="Eliminar"
								rendered="#{manejadorRegistroInformeBancoProyectos.editable}"
								action="#{manejadorRegistroInformeBancoProyectos.eliminarArchivo}"
								update="@form">
								<f:setPropertyActionListener value="#{archivo}"
									target="#{manejadorRegistroInformeBancoProyectos.archivoSeleccionado}" />
							</p:commandButton>

						</p:column>
					</p:dataTable>
					<p:fileUpload
						fileUploadListener="#{manejadorRegistroInformeBancoProyectos.guardarArchivo}"
						rendered="#{manejadorRegistroInformeBancoProyectos.editable}"
						mode="advanced" auto="true" update="@form" multiple="true"
						sizeLimit="3000000" label="Seleccionar archivo"
						style="margin: auto;" />
				</p:panelGrid>
			</p:panel>
			<t:div style="width: 100%; text-align: center; margin-top: 20px;"
				rendered="#{empty manejadorRegistroInformeBancoProyectos.revisionInforme}">
				<p:commandButton value="Guardar"
					onclick="if(!confirm('¿Está seguro(a) de guardar el informe?'))return false"
					action="#{manejadorRegistroInformeBancoProyectos.guardar}"
					rendered="#{manejadorRegistroInformeBancoProyectos.editable}"
					ajax="false">
				</p:commandButton>
				<p:commandButton value="Cancelar"
					rendered="#{manejadorRegistroInformeBancoProyectos.editable}"
					action="#{manejadorRegistroInformeBancoProyectos.atras}"
					ajax="false">
				</p:commandButton>
				<p:commandButton value="Volver"
					action="#{manejadorRegistroInformeBancoProyectos.atras}" ajax="false" />
			</t:div>
			<p:panel header="Revision informe"
				style="margin-top: 20px; text-align: center;"
				rendered="#{manejadorRegistroInformeBancoProyectos.revisionInforme == 'UAB' || manejadorRegistroInformeBancoProyectos.revisionInforme == 'VIF' }">
				<br />
				<h:outputText value="Comenatrios:" />
				<br />
				<p:inputTextarea value="#{manejadorRegistroInformeBancoProyectos.comentariosVIF}"
					id="comentariosVIF" rows="10" maxlength="2000"
					style="width: 530px; margin-top: 20px; margin-bottom: 20px;">
				</p:inputTextarea>
				<br />
				<p:commandButton value="Aprobar"
					rendered="#{manejadorRegistroInformeBancoProyectos.revisionInforme == 'VIF'}"
					action="#{manejadorRegistroInformeBancoProyectos.revisarAvalVIF}" ajax="false" />
				<p:commandButton value="Aprobar"
					rendered="#{manejadorRegistroInformeBancoProyectos.revisionInforme == 'UAB'}"
					action="#{manejadorRegistroInformeBancoProyectos.revisarAvalUAB}" ajax="false" />
				<p:commandButton value="Devolver para correcciones"
					action="#{manejadorRegistroInformeBancoProyectos.devolverCorreccionesVIF}"
					ajax="false" />
				<p:commandButton value="Volver"
					action="#{manejadorRegistroInformeBancoProyectos.atras}" ajax="false" />
			</p:panel>
			<p:panel header="Revision informe"
				style="margin-top: 20px; text-align: center;"
				rendered="#{manejadorRegistroInformeBancoProyectos.revisionInforme == 'C'}">
				<br />
				<h:outputText value="Comenatrios:" />
				<br />
				<p:inputTextarea
					value="#{manejadorRegistroInformeBancoProyectos.comentariosCoordinadorLectura}"
					id="comentariosVIF" rows="10" maxlength="2000"
					style="width: 530px; margin-top: 20px; margin-bottom: 20px;">
				</p:inputTextarea>
				<br />
				<p:commandButton value="Lectura"
					rendered="#{!manejadorRegistroInformeBancoProyectos.proyectoInformeActual.proyecto.esPermisoMarco and !manejadorRegistroInformeBancoProyectos.proyectoInformeActual.proyecto.esContratoBiodiversidad}"
					action="#{manejadorRegistroInformeBancoProyectos.aprobarInformeCoordinador}"
					ajax="false" />
				<p:commandButton value="Aprobar"
					rendered="#{manejadorRegistroInformeBancoProyectos.proyectoInformeActual.proyecto.esPermisoMarco or manejadorRegistroInformeBancoProyectos.proyectoInformeActual.proyecto.esContratoBiodiversidad}"
					action="#{manejadorRegistroInformeBancoProyectos.aprobarInformeCoordinador}"
					ajax="false" />
				<p:commandButton value="Devolver para correcciones"
					action="#{manejadorRegistroInformeBancoProyectos.rechazarInformeCoordinador}"
					ajax="false" />
				<p:commandButton value="Volver"
					action="#{manejadorRegistroInformeBancoProyectos.atras}" ajax="false" />
			</p:panel>
			<p:dialog widgetVar="dialogEspere" resizable="false" closable="false"
				modal="true">
				<p:graphicImage value="/images/ajaxloading.gif" />
							Por favor espere...
			</p:dialog>
		</h:form>
	</ui:define>
</ui:composition>
