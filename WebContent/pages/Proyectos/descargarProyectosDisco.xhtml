<?xml version='1.0' encoding='ISO-8859-1' ?>
<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:t="http://myfaces.apache.org/tomahawk"
	xmlns:s="http://myfaces.apache.org/sandbox"
	template="../../templates/common.xhtml">
	<ui:define name="content">
		<h:form>
			<s:fieldset legend="Descargar Archivos Proyecto" styleClass="legend1"
				style='font-size: 12px;'>
				<h:panelGrid columns="2">
					<h:outputText value="Descargar Archivos solicitud Aval:"
						styleClass="labels_proyecto"
						style='font-size: 10px; font-style: normal' />
					<h:commandButton
						action="#{ManejadorArchivosDisco.descargarArchivosSolicitudAval}"
						value="Descargar" />
					<h:outputText value="Cargar  a disco archivos solicitud avales:"
						styleClass="labels_proyecto"
						style='font-size: 10px; font-style: normal' />
					<h:commandButton
						action="#{ManejadorArchivosDisco.subirArchivosAval}"
						value="Cargar" />
					<h:commandButton
						action="#{ManejadorArchivosDisco.dividirArchivosSolicitudAval}"
						value="Dividir" ajax="false" />
					<h:commandButton
						action="#{ManejadorArchivosDisco.verificarArchivosAval}"
						value="Verificar" ajax="false" />
					<h:outputText value="#{ManejadorArchivosDisco.faltantesAvales}" />
				</h:panelGrid>
			</s:fieldset>
		</h:form>
	</ui:define>
</ui:composition>
