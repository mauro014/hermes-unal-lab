<?xml version='1.0' encoding='ISO-8859-1' ?>
<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:t="http://myfaces.apache.org/tomahawk"
	xmlns:s="http://myfaces.apache.org/sandbox"
	template="../../../templates/common.xhtml">

	<ui:define name="content">
		<h:form id="form">
			<t:div styleClass="contenido-titulo-general-myriad">Solicitud ISBN</t:div>
			<br />
			<p:menubar model="#{manejadorMenuFormularios.modelItemProyecto}" />
			<br />
			
<!-- 		INICIO	Formulario Solicitud ISBN -->

			<h:panelGrid id="mostrarSiSolicitudISBN"
						 rendered="#{ManejadorSolicitudISBN.mostrarSiSolicitudISBN}"
						 style="width:100%">
			
			<p:panel header="Información General" id="idInfoGeneralIS">
				
				<t:div styleClass="contenido-titulo-general-myriad-2">INFORMACIÓN DEL TÍTULO</t:div>
				<br />
				
				<h:panelGrid columns="2" cellpadding="5" cellspacing="1" align="center" id="panelTituloInf">
					
					<h:outputText value="*Título de obra independiente" 
								  styleClass="legend2" />
					<p:inputTextarea rows="2" cols="65" autoResize="false"
						id="TituloOI"
						value="#{ManejadorSolicitudISBN.proyectoActual.nombre}"
						readonly="true"/>
					
					<h:outputText value="Título de volumen" 
								  styleClass="legend2" />
					<p:inputTextarea rows="2" cols="65" autoResize="false"
						id="TituloV"
						value="#{ManejadorSolicitudISBN.proyectoActual.tituloVolumenISBN}" 
						readonly="true"/>
					
					<h:outputText value="Título de obra completa" 
								  styleClass="legend2" />
					<p:inputTextarea rows="2" cols="65" autoResize="false"
						id="TituloOC"
						value="#{ManejadorSolicitudISBN.proyectoActual.tituloObraCompletaISBN}" 
						readonly="true"/>
					
				</h:panelGrid>
				
				<t:div styleClass="contenido-titulo-general-myriad-2">CLASIFICACIÓN TEMÁTICA</t:div>
				<br />
				
				<h:panelGrid columns="2" cellpadding="5" 
							 cellspacing="1" align="center" 
							 id="panelClasificacion">
					
					<h:outputText value="*Materia" styleClass="legend2" />
					<h:outputText value="#{ManejadorSolicitudISBN.descripcionMateriasISBN}" styleClass="legend2" />
					
					<h:outputText value="*Tipo de contenido" styleClass="legend2" />
					<h:outputText value="#{ManejadorSolicitudISBN.descripcionTipoContenidoISBN}" styleClass="legend2" />
					
					<h:outputText value="Nombre de la colección" styleClass="legend2" />
					<p:inputTextarea rows="2" cols="65" autoResize="false"
						id="nombreColeccion"
						value="#{ManejadorSolicitudISBN.proyectoActual.nombreColeccionISBN}" 
						readonly="true"/>
					
					<h:outputText value="Número" styleClass="legend2" />
					<p:inputText value="#{ManejadorSolicitudISBN.proyectoActual.numeroColeccionISBN}"
						size="50" id="numeroColeccion"
						readonly="true"/>
					
					<h:outputText value="Serie" styleClass="legend2" />
					<p:inputText value="#{ManejadorSolicitudISBN.proyectoActual.serieISBN}"
						size="50" id="serieColeccion"
						readonly="true"/>
					
					<h:outputText value="*Idioma" styleClass="legend2" />
					<h:outputText value="#{ManejadorSolicitudISBN.descripcionIdiomaPrincipalISBN}" styleClass="legend2" />
					
				</h:panelGrid>	
				
				<t:div styleClass="contenido-titulo-general-myriad-2">TRADUCCIÓN</t:div>
				<br />
				
				<h:panelGrid columns="2" cellpadding="5" cellspacing="1" 
							 align="center" border="0" id="panelTraduccionSN">
				
					<h:outputText value="*¿Es Traducción?" styleClass="legend2" />
					<h:outputText value="#{ManejadorSolicitudISBN.proyectoActual.esTraduccionISBN}" styleClass="legend2" />
				
					<h:outputText value="*Idioma original" styleClass="legend2" 
					rendered="#{ManejadorSolicitudISBN.proyectoActual.esTraduccionISBN == 'SI'}"/>
					<h:outputText value="#{ManejadorSolicitudISBN.descripcionIdiomaOriginalISBN}" styleClass="legend2" />
					
					<h:outputText value="*Idioma al cual se traduce" styleClass="legend2" 
					rendered="#{ManejadorSolicitudISBN.proyectoActual.esTraduccionISBN == 'SI'}"/>
					<h:outputText value="#{ManejadorSolicitudISBN.descripcionIdiomaDestinoISBN}" styleClass="legend2" />
					
					<h:outputText value="*Título en el idioma original" styleClass="legend2" 
					rendered="#{ManejadorSolicitudISBN.proyectoActual.esTraduccionISBN == 'SI'}"/>
					<p:inputTextarea rows="2" cols="65" autoResize="false"
						id="TituloIOrig"
						value="#{ManejadorSolicitudISBN.proyectoActual.tituloIdiomaOriginalISBN}"
						rendered="#{ManejadorSolicitudISBN.proyectoActual.esTraduccionISBN == 'SI'}"
						readonly="true"/>
					
				</h:panelGrid>
				
				<t:div styleClass="contenido-titulo-general-myriad-2">INFORMACIÓN DE LA EDICIÓN</t:div>
				<br />
				
				<h:panelGrid columns="2" cellpadding="5" cellspacing="1" 
							 align="center" border="0" id="panelEdicion" >
							 
					<h:outputText value="*Número de edición" styleClass="legend2" />
					<p:inputText value="#{ManejadorSolicitudISBN.proyectoActual.numeroEdicionISBN}"
						size="50" id="numeroEdicion"
						readonly="true"/>
					
					<h:outputText value="*Departamento, estado o provincia" styleClass="legend2" />
					<h:outputText value="#{ManejadorSolicitudISBN.descripcionDepartamento}" styleClass="legend2" />
						
					<h:outputText value="*Ciudad de edición" styleClass="legend2" />
					<h:outputText value="#{ManejadorSolicitudISBN.descripcionCiudad}" styleClass="legend2" />
					
					<h:outputText value="*Fecha de aparición" styleClass="legend2" />
					<h:outputText value="#{ManejadorSolicitudISBN.proyectoActual.fechaAparicionISBN}" styleClass="legend2" />

					<h:outputText value="*Es Coedición?" styleClass="legend2" />
					<h:outputText value="#{ManejadorSolicitudISBN.proyectoActual.esCoedicionISBN}" styleClass="legend2" />
					
					<h:outputText value="*Coeditor" styleClass="legend2" id="labelCoeditor"
								  rendered="#{ManejadorSolicitudISBN.mostrarCoeditor}"/>
					<p:inputText value="#{ManejadorSolicitudISBN.proyectoActual.coeditorISBN}"
						size="50" id="coeditor"
						rendered="#{ManejadorSolicitudISBN.mostrarCoeditor}"
						readonly="true"/>			
					
			    </h:panelGrid>
			    
			    <t:div styleClass="contenido-titulo-general-myriad-2">COMERCIALIZABLE</t:div>
				<br />
				
				<h:panelGrid columns="2" cellpadding="5" cellspacing="1" 
							 align="center" border="0" id="panelComercializable" >
				
					<h:outputText value="*¿Es comercializable?" styleClass="legend2" />
					<h:outputText value="#{ManejadorSolicitudISBN.proyectoActual.esComercializableISBN}" styleClass="legend2" />
					
					<h:outputText value="*Número de ejemplares de oferta nacional" styleClass="legend2"
								  rendered="#{ManejadorSolicitudISBN.proyectoActual.esComercializableISBN == 'SI'}"/>
					<p:inputText value="#{ManejadorSolicitudISBN.proyectoActual.numEjemplaresNacionalISBN}"
						size="50" id="numeroEjNal"
						readonly="true"
						rendered="#{ManejadorSolicitudISBN.proyectoActual.esComercializableISBN == 'SI'}"/>
					
					<h:outputText value="*Precio en moneda nacional ($)" styleClass="legend2" 
								  rendered="#{ManejadorSolicitudISBN.proyectoActual.esComercializableISBN == 'SI'}"/>
					<p:inputText value="#{ManejadorSolicitudISBN.proyectoActual.precioCOPISBN}"
						size="50" id="precioCop"
						readonly="true"
						rendered="#{ManejadorSolicitudISBN.proyectoActual.esComercializableISBN == 'SI'}"/>
					
					<h:outputText value="Número de ejemplares de oferta externa" styleClass="legend2" 
								  rendered="#{ManejadorSolicitudISBN.proyectoActual.esComercializableISBN == 'SI'}"/>
					<p:inputText value="#{ManejadorSolicitudISBN.proyectoActual.numEjemplaresExternosISBN}"
						size="50" id="numEjemplaresExternosISBN"
						readonly="true"
						rendered="#{ManejadorSolicitudISBN.proyectoActual.esComercializableISBN == 'SI'}"/>
					
					<h:outputText value="*Precio en dólares (USD)" styleClass="legend2" 
								  rendered="#{ManejadorSolicitudISBN.proyectoActual.esComercializableISBN == 'SI'}"/>
					<p:inputText value="#{ManejadorSolicitudISBN.proyectoActual.precioUSDISBN}"
						size="50" id="precioUSDISBN"
						readonly="true"
						rendered="#{ManejadorSolicitudISBN.proyectoActual.esComercializableISBN == 'SI'}"/>
					
					<h:outputText value="*Oferta total" styleClass="legend2" 
								  rendered="#{ManejadorSolicitudISBN.proyectoActual.esComercializableISBN == 'SI'}"/>
					<p:inputText value="#{ManejadorSolicitudISBN.proyectoActual.ofertaTotalISBN}"
						size="50" id="ofertaTotalISBN"
						readonly="true"
						rendered="#{ManejadorSolicitudISBN.proyectoActual.esComercializableISBN == 'SI'}"/>
						
					<h:outputText value="*¿Por qué no es comercializable?" 
								  styleClass="legend2"
								  rendered="#{ManejadorSolicitudISBN.proyectoActual.esComercializableISBN == 'NO'}"/>
					<p:inputTextarea rows="7" cols="65" autoResize="false"
						id="noComercial"
						value="#{ManejadorSolicitudISBN.proyectoActual.razonesNoComercializableISBN}"
						rendered="#{ManejadorSolicitudISBN.proyectoActual.esComercializableISBN == 'NO'}"
						readonly="true" />
					
				</h:panelGrid>
				
				<t:div styleClass="contenido-titulo-general-myriad-2">DESCRIPCIÓN FÍSICA DEL MATERIAL</t:div>
				<br />
				
				<h:panelGrid columns="3" cellpadding="5" cellspacing="1" 
							 align="center" border="0" id="panelDescFisica" >
				
					<h:outputText value="*Tipo de soporte" styleClass="legend2" />
					<h:outputText value="#{ManejadorSolicitudISBN.descripcionTipoSoporteISBN}" styleClass="legend2" />
					<h:outputText value=""/>
					
					<h:outputText value="*Descripción física" styleClass="legend2" 
								  rendered="#{ManejadorSolicitudISBN.proyectoActual.tipoSoporteISBN == 'ISBN_TS_LI'}"/>
					<h:outputText value="#{ManejadorSolicitudISBN.descripcionDescFisicaISBN}" styleClass="legend2" 
								  rendered="#{ManejadorSolicitudISBN.proyectoActual.tipoSoporteISBN == 'ISBN_TS_LI'}"/>
					<h:outputText value=""/>
					
					<h:outputText value="*Tipo de encuadernación" styleClass="legend2" 
								  rendered="#{ManejadorSolicitudISBN.proyectoActual.tipoSoporteISBN == 'ISBN_TS_LI'}"/>
					<h:outputText value="#{ManejadorSolicitudISBN.descripcionTipoEncuadernacionISBN}" styleClass="legend2" 
								  rendered="#{ManejadorSolicitudISBN.proyectoActual.tipoSoporteISBN == 'ISBN_TS_LI'}"/>
					<h:outputText value=""/>
					
					<h:outputText value="*Tipo de papel" styleClass="legend2" 
								  rendered="#{ManejadorSolicitudISBN.proyectoActual.tipoSoporteISBN == 'ISBN_TS_LI'}" />
					<h:outputText value="#{ManejadorSolicitudISBN.descripcionTipoPapelISBN}" styleClass="legend2" 
								  rendered="#{ManejadorSolicitudISBN.proyectoActual.tipoSoporteISBN == 'ISBN_TS_LI'}"/>
					<h:outputText value=""/>
					
					<h:outputText value="*Gramaje" styleClass="legend2" 
								  rendered="#{ManejadorSolicitudISBN.proyectoActual.tipoSoporteISBN == 'ISBN_TS_LI'}"/>
					<h:outputText value="#{ManejadorSolicitudISBN.descripcionGramajeISBN}" styleClass="legend2" 
								  rendered="#{ManejadorSolicitudISBN.proyectoActual.tipoSoporteISBN == 'ISBN_TS_LI'}"/>
					<h:outputText value=""/>
					
					<h:outputText value="*Tipo de impresión" styleClass="legend2" 
								  rendered="#{ManejadorSolicitudISBN.proyectoActual.tipoSoporteISBN == 'ISBN_TS_LI'}"/>
					<h:outputText value="#{ManejadorSolicitudISBN.descripcionTipoImpresionISBN}" styleClass="legend2" 
								  rendered="#{ManejadorSolicitudISBN.proyectoActual.tipoSoporteISBN == 'ISBN_TS_LI'}"/>
					<h:outputText value=""/>
					
					<h:outputText value="*Número de páginas" styleClass="legend2" 
								  rendered="#{ManejadorSolicitudISBN.proyectoActual.tipoSoporteISBN == 'ISBN_TS_LI'}"/>
					<p:inputText value="#{ManejadorSolicitudISBN.proyectoActual.numPaginasISBN}"
						size="40" id="numPaginasISBN"
						readonly="true"
						rendered="#{ManejadorSolicitudISBN.proyectoActual.tipoSoporteISBN == 'ISBN_TS_LI'}"/>
					<h:outputText value=""/>	
					
					<h:outputText value="*Número de tintas" styleClass="legend2" 
								  rendered="#{ManejadorSolicitudISBN.proyectoActual.tipoSoporteISBN == 'ISBN_TS_LI'}"/>
					<h:outputText value="#{ManejadorSolicitudISBN.descripcionNumTintasISBN}" styleClass="legend2" 
								  rendered="#{ManejadorSolicitudISBN.proyectoActual.tipoSoporteISBN == 'ISBN_TS_LI'}"/>
					<h:outputText value=""/>
					
					<h:outputText value="*Ancho (cm)" styleClass="legend2" 
								  rendered="#{ManejadorSolicitudISBN.proyectoActual.tipoSoporteISBN == 'ISBN_TS_LI'}"/>
					<p:inputText value="#{ManejadorSolicitudISBN.proyectoActual.anchoISBN}"
						size="40" id="anchoISBN"
						readonly="true"
						rendered="#{ManejadorSolicitudISBN.proyectoActual.tipoSoporteISBN == 'ISBN_TS_LI'}"/>
					<h:outputText value=""/>
					
					<h:outputText value="*Alto (cm)" styleClass="legend2"
								  rendered="#{ManejadorSolicitudISBN.proyectoActual.tipoSoporteISBN == 'ISBN_TS_LI'}"/>
					<p:inputText value="#{ManejadorSolicitudISBN.proyectoActual.altoISBN}"
						size="40" id="altoISBN"
						readonly="true"
						rendered="#{ManejadorSolicitudISBN.proyectoActual.tipoSoporteISBN == 'ISBN_TS_LI'}"/>
					<h:outputText value=""/>
					
					<h:outputText value="*Medio electrónico o digital" styleClass="legend2" 
								  rendered="#{ManejadorSolicitudISBN.proyectoActual.tipoSoporteISBN == 'ISBN_TS_PE'}"/>
					<h:outputText value="#{ManejadorSolicitudISBN.descripcionMedElecISBN}" styleClass="legend2" 
								  rendered="#{ManejadorSolicitudISBN.proyectoActual.tipoSoporteISBN == 'ISBN_TS_PE'}"/>
					<h:outputText value=""/>
					
					<h:outputText value="*Formato" styleClass="legend2" 
								  rendered="#{ManejadorSolicitudISBN.proyectoActual.tipoSoporteISBN == 'ISBN_TS_PE'}"/>
					<h:outputText value="#{ManejadorSolicitudISBN.descripcionFormatoISBN}" styleClass="legend2" 
								  rendered="#{ManejadorSolicitudISBN.proyectoActual.tipoSoporteISBN == 'ISBN_TS_PE'}"/>
					<h:outputText value=""/>
					
					<h:outputText value="*Tamaño" styleClass="legend2" 
								  rendered="#{ManejadorSolicitudISBN.proyectoActual.tipoSoporteISBN == 'ISBN_TS_PE'}"/>
					<p:inputText
						value="#{ManejadorSolicitudISBN.proyectoActual.tamañoISBN}"
						size="40" 
						readonly="true"
						rendered="#{ManejadorSolicitudISBN.proyectoActual.tipoSoporteISBN == 'ISBN_TS_PE'}"/>			  
					<h:outputText value="#{ManejadorSolicitudISBN.descripcionTamañoISBN}" styleClass="legend2" 
								  rendered="#{ManejadorSolicitudISBN.proyectoActual.tipoSoporteISBN == 'ISBN_TS_PE'}"/>
	 
				</h:panelGrid>		 
				
			</p:panel>
			 
			<br />
			
			<p:panel header="Autores o compiladores" id="idPanelAutoresCompiladores">

				<br />

				<p:dataTable var="i" style="width:650px"
					value="#{ManejadorSolicitudISBN.listaParticipantes}"
					id="listaParticipantesISBN"
					emptyMessage="No se encuentran autores asociados">

					<p:column style="width:35%">
						<f:facet name="header">
							<h:outputText value="Nombre" />
						</f:facet>
						<h:outputText
							value="#{i.investigador.nombre1} #{i.investigador.nombre2} #{i.investigador.apellido1} #{i.investigador.apellido2}" />
					</p:column>

					<p:column style="width:25%">
						<f:facet name="header">
							<h:outputText value="Rol" />
						</f:facet>
<!-- 						<h:outputText -->
<!-- 							value="#{i.tipo.id == 'AI' ? 'Autor interno':(i.tipo.id == 'AEL' ? 'Autor externo':( i.tipo.id == 'P' ? 'Solicitante':''))}" /> -->
						
						<h:outputText value="#{i.tipo.id == 'P' ? i.funcion : i.tipo.nombre}" />
						
<!-- 						<h:outputText value="#{i.tipo.nombre}" /> -->
					</p:column>
					
					<p:column style="width:10%">
						<f:facet name="header">
							<h:outputText value="Nacionalidad" />
						</f:facet>
						<h:outputText
							value="#{i.investigador.paisOrigen}" /> 
					</p:column>
					
					<p:column style="width:20%">
						<f:facet name="header">
							<h:outputText value="Fecha Nacimiento" />
						</f:facet>
						<h:outputText
							value="#{i.investigador.fechaNacimiento}" /> 
					</p:column>

				</p:dataTable>
				<br />
			
			</p:panel>
			
			</h:panelGrid>
			
<!-- 		FIN	Formulario Solicitud ISBN -->

			<h:panelGrid id="mostrarSiConvocatoriaLibros"
				rendered="#{ManejadorSolicitudISBN.mostrarSiConvLibros}"
				style="width:100%">

				<p:panel header="Información General" id="idInfoGeneral">
					<h:panelGrid columns="2" cellpadding="10" align="center">
						<h:outputText value="Título" styleClass="legend2" />
						<p:inputTextarea rows="5" cols="65" autoResize="false"
							counter="counterTitulo" maxlength="1000"
							counterTemplate="{0} caracteres restantes." required="true"
							id="Titulo"
							value="#{ManejadorSolicitudISBN.proyectoActual.nombre}"
							requiredMessage="El título del proyecto es obligatorio" />
						<h:outputText id="countTitulo" value="" />
						<h:outputText id="counterTitulo" />

						<h:outputText value="Resumen (Máx. 4000 caracteres)" />
						<p:inputTextarea id="Resumen" autoResize="false"
							counter="counterResumen" maxlength="1000"
							counterTemplate="{0} caracteres restantes."
							value="#{ManejadorSolicitudISBN.proyectoActual.resumen}"
							rows="10" cols="65" required="false">
						</p:inputTextarea>
						<h:outputText id="countRes" value="" />
						<h:outputText id="counterResumen" />

						<h:outputText
							value="Objeto/Objetivo principal (Máx. 4000 caracteres):" />
						<p:inputTextarea id="objeto" autoResize="false"
							counter="counterObjeto" maxlength="1000"
							counterTemplate="{0} caracteres restantes."
							validatorMessage="Objeto/Objetivo Principal debe estar entre 1 - 4000 caracteres"
							value="#{ManejadorSolicitudISBN.proyectoActual.objetivoGeneral}"
							rows="10" cols="65">
						</p:inputTextarea>
						<h:outputText id="countObj" value="" />
						<h:outputText id="counterObjeto" />

						<h:outputText value="Consultar áreas de la ciencia" />
						<h:outputLink value="#{ManejadorSolicitudISBN.linkLineas}"
							target="_blank">
							<h:graphicImage id="imageee" alt="jsf-sun"
								url="/images/iconpdf.png">
							</h:graphicImage>
						</h:outputLink>

						<h:outputText value="Area de la ciencia principal:" />
						<p:selectOneMenu style="width:160px"
							value="#{ManejadorSolicitudISBN.areaCiencia}"
							id="areaCiencia">
							<f:selectItems
								value="#{ManejadorSolicitudISBN.areaCienciaItems}" />
						</p:selectOneMenu>

						<h:outputText value="Area de la ciencia secundaria:" />
						<p:selectOneMenu style="width:160px"
							value="#{ManejadorSolicitudISBN.areaCienciaSec}"
							id="areaCiencia1">
							<f:selectItems
								value="#{ManejadorSolicitudISBN.areaCienciaItems}" />
						</p:selectOneMenu>

						<h:outputText value="Colección asociada:" />
						<p:selectOneMenu
							value="#{ManejadorSolicitudISBN.proyectoActual.claseEvento}"
							id="tipoEvento">
							<f:selectItems
								value="#{ManejadorSolicitudISBN.tipoEventoItems}" />
							<p:ajax
								listener="#{ManejadorSolicitudISBN.cambiarTipoEvento}"
								update="panOtroTipEve" />
						</p:selectOneMenu>

					</h:panelGrid>

					<h:panelGrid id="panOtroTipEve" columns="2" cellpadding="5"
						cellspacing="5">
						<h:outputText value="Otra - Cuál?:" id="otroEventotxt"
							rendered="#{ManejadorSolicitudISBN.mostrarOtroTipoEvento}" />
						<p:inputText size="40" id="otroEvento"
							rendered="#{ManejadorSolicitudISBN.mostrarOtroTipoEvento}"
							value="#{ManejadorSolicitudISBN.proyectoActual.otroClaseEvento}" />
					</h:panelGrid>
				</p:panel>
				<br />

				<p:panel header="Palabras Clave" id="idPalabrasClave">

					<h:panelGrid columns="3" id="gridPalabraClave" align="center">
						<h:outputText value="Palabras Clave" />
						<p:autoComplete id="palabraClaveS"
							value="#{ManejadorSolicitudISBN.palabraClave.palabra}"
							size="50" maxResults="10"
							completeMethod="#{ManejadorSolicitudISBN.obtenerPalabraClavesSugeridas}"
							minQueryLength="2">
							<f:validateLength maximum="100" />
						</p:autoComplete>

						<p:commandButton id="agregarPalabraClave" value="Agregar palabra"
							update="palabrasTable, gridPalabraClave"
							action="#{ManejadorSolicitudISBN.insertarPalabraClave}">
						</p:commandButton>

					</h:panelGrid>

					<br />
					<br />
					<p:outputPanel id="grupoListaPalabras" align="center">
						<p:dataTable id="palabrasTable"
							value="#{ManejadorSolicitudISBN.proyectoActual.listaPalabrasES}"
							var="pal"
