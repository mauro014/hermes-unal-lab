<?xml version='1.0' encoding='ISO-8859-1' ?>
<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:t="http://myfaces.apache.org/tomahawk"
	xmlns:s="http://myfaces.apache.org/sandbox"
	template="../../../templates/common.xhtml">



	<ui:define name="content">
		<h:form>
			<t:div styleClass="contenido-titulo-general-myriad">Elegir modalidad Convocatoria Jóvenes Investigadores</t:div>
			<p:panel>
				<p:panelGrid columns="1" styleClass="estilo-panelgrid-sinbordes"
					style="margin: auto; ">
					<br />
					<h:outputText
						value="A continuación ingrese el tipo de inscripción que desea realizar:" />
					<p:selectOneButton
						value="#{ManejadorElegirMod_JI_SEM_2014.tipoBusqueda}">
						<f:selectItem itemLabel="Grupo de investigación" itemValue="Grupo" />

						<f:selectItem itemLabel="Aval Asociado" itemValue="Aval" />

						<p:ajax event="change" update="@form"
							listener="#{ManejadorElegirMod_JI_SEM_2014.cambiarForm}" />
					</p:selectOneButton>
				</p:panelGrid>
			</p:panel>

			<br />

			<p:panel rendered="#{ManejadorElegirMod_JI_SEM_2014.panelAval}">
				<h:panelGrid columns="1" cellpadding="5" cellspacing="5"
					align="center"
					rendered="#{ManejadorElegirMod_JI_SEM_2014.panelAval}">
					<h:outputText
						value="Por favor seleccione el Aval que desea vincular: "></h:outputText>
					<p:inputText id="idPry" size="6"
						value="#{ManejadorElegirMod_JI_SEM_2014.codigoAval}"
						rendered="false"></p:inputText>
					<p:selectOneMenu
						value="#{ManejadorElegirMod_JI_SEM_2014.avalSeleccionado}"
						style="width: 600px;" panelStyle="width: 355px;">
						<f:selectItems
							value="#{ManejadorElegirMod_JI_SEM_2014.avalesInvestigador}" />
					</p:selectOneMenu>
				</h:panelGrid>

				<t:div style="width: 100%; text-align: center; margin-top: 20px;">

					<br />
					<p:commandButton value="Cargar información Aval"
						id="botonBuscarAval"
						action="#{ManejadorElegirMod_JI_SEM_2014.buscarAval}"
						update="proyectoInfo, messages" ajax="false"
						styleClass="ui-priority-primary" />
				</t:div>

			</p:panel>
			<br />
			<p:panel rendered="#{ManejadorElegirMod_JI_SEM_2014.panelInfoAval}">
				<t:div style="width: 100%; margin-top: 20px;">
					<p:panelGrid columns="2" styleClass="estilo-panelgrid-sinbordes"
						style="width: 100%;" id="panelTipoAval"
						rendered="#{ManejadorElegirMod_JI_SEM_2014.panelAval}">
						<h:outputText value="Código de Aval:"
							style="font-weight: bold; margin-top: 10px;" />
						<h:outputText
							value="#{ManejadorElegirMod_JI_SEM_2014.avalAsociar.aviId}"
							style="width: 340px;" />
						<h:outputText value="Nombre del aval:"
							style="font-weight: bold; margin-top: 10px;" />
						<h:outputText
							value="#{ManejadorElegirMod_JI_SEM_2014.avalAsociar.aviTitulo}"
							style="width: 340px;" />
						<h:outputText value="Proyecto Asociado:"
							style="font-weight: bold; margin-top: 10px;" />
						<h:outputText
							value="#{ManejadorElegirMod_JI_SEM_2014.avalAsociar.idProyecto}"
							style="width: 340px;" />
						<h:outputText/>	
						<h:outputText value="Nombre del proyecto:"
							style="font-weight: bold; margin-top: 10px;" />
						<h:outputText
							value="#{ManejadorElegirMod_JI_SEM_2014.avalAsociar.nombreProyecto}"
							style="width: 340px;" />
					</p:panelGrid>
					
					<center><p:commandButton
						value="Asociar el aval seleccionado" id="botonAsociar"
						update="@form"
						action="#{ManejadorElegirMod_JI_SEM_2014.asociarAval}"
						styleClass="ui-priority-primary" ajax="false" /></center>
				</t:div>
			</p:panel>

			<br />
			<br />

			<center><p:commandButton
				value="Continuar con el formulario de solicitud"
				rendered="#{ManejadorElegirMod_JI_SEM_2014.panelInfoAval}"
				id="botonProyectoJI" 
				action="#{ManejadorElegirMod_JI_SEM_2014.asociarProyectoNoHermes}"
				ajax="false" styleClass="ui-priority-primary" /></center>

		</h:form>
	</ui:define>
</ui:composition>
