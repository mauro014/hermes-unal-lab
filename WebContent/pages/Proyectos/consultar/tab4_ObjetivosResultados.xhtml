<?xml version='1.0' encoding='ISO-8859-1' ?>
<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:t="http://myfaces.apache.org/tomahawk"
	xmlns:s="http://myfaces.apache.org/sandbox"
	template="../../../templates/common.xhtml">

	<ui:define name="content">
		<h:form>

			<div id="formulariobasico">

				<t:div styleClass="contenido-titulo-general-myriad">Objetivos y Resultados</t:div>
				<br />
				<p:menubar model="#{manejadorMenuFormularios.modelItemProyecto}" />
				<br />

				<h:panelGrid columns="1" cellpadding="6" cellspacing="3">
			
					<t:div styleClass="contenido-titulo-general-myriad-1">
						<h:outputText value="#{manejadorObjetivosResultados.inicioTitulo}"
								style="font-weight: bold" />
					</t:div>
					
				</h:panelGrid>

				<br />

				<p:panel header="Objetivo General" id="grupoObjetivoGeneral">

					<center>

						<h:panelGrid columns="1" cellpadding="6" cellspacing="3"
							align="center">

							<p:inputTextarea id="objetivoGeneral" readonly="true"
								value="#{manejadorObjetivosResultados.proyectoActual.objetivoGeneral}"
								rows="10" cols="70" required="true">
							</p:inputTextarea>
						</h:panelGrid>

					</center>

				</p:panel>

				<br />

				<p:panel header="Objetivos Específicos"
					rendered="#{!manejadorObjetivosResultados.esProgramaNacional}">

					<h:panelGrid columns="1" align="center">
						<p:dataTable id="tablaObjetivos" cellpadding="6" cellspacing="3"
							value="#{manejadorObjetivosResultados.listaObjetivos}"
							var="objetivo"
							binding="#{manejadorObjetivosResultados.tablaObjetivos}"
							style="width:500px;text-align:center">

							<center>
								<p:column>

									<p:inputTextarea id="nombreObjetivo" value="#{objetivo.nombre}"
										readonly="true" rendered="#{!objetivo.borrable}" cols="60"
										rows="5" required="true">
										<f:validateLength maximum="3000" />
									</p:inputTextarea>

								</p:column>
							</center>

						</p:dataTable>
					</h:panelGrid>

				</p:panel>

				<br />

				<p:panel header="Resultados Esperados"
					rendered="#{!manejadorObjetivosResultados.esProgramaNacional}">
					<h:panelGrid columns="1" align="center">
						<p:dataTable cellpadding="6" cellspacing="3"
							value="#{manejadorObjetivosResultados.listaResultados}"
							var="resultado"
							binding="#{manejadorObjetivosResultados.tablaResultados}"
							style="width:500px;text-align:center">

							<center>
								<p:column>
									<p:inputTextarea rendered="#{!resultado.borrable}"
										value="#{resultado.descripcion}" cols="60" rows="5"
										required="true" readonly="true">
										<f:validateLength maximum="2000" />
									</p:inputTextarea>

								</p:column>
							</center>


						</p:dataTable>
					</h:panelGrid>
				</p:panel>


				<p:panel header="Linea Base"
					rendered="#{manejadorObjetivosResultados.esSena}">

					<div align="center">
						<p:inputTextarea
							value="#{manejadorObjetivosResultados.proyectoActual.lineaBaseProyecto}"
							rows="10" cols="50">
							<f:validateLength maximum="4000" />
						</p:inputTextarea>
					</div>

				</p:panel>
				<br />

			</div>
		</h:form>
	</ui:define>
</ui:composition>
