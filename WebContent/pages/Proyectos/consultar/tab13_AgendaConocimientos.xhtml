<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:t="http://myfaces.apache.org/tomahawk"
	xmlns:s="http://myfaces.apache.org/sandbox"
	template="../../templates/common.xhtml">

<ui:define name="content">
<h:form>



	<h3>Agendas del Conocimiento</h3>
	<br />


<h:panelGroup>
	<h:panelGrid columns="2" align="center" cellpadding="6" cellspacing="3">
		<h:outputText value="Programa:" styleClass="legend1" />
		<h:outputText value="#{manejadorAgendaConocimientos.inicioTitulo}"
			styleClass="legend1" />
	</h:panelGrid>
</h:panelGroup>


<h:panelGrid columns="1" align="left" cellpadding="3" cellspacing="3">

	<h:panelGroup id="panelGeneralAreasPlanGlobal">

		<s:fieldset legend="햞eas de las Agendas del Conocimiento"
			styleClass="legend1">


			
				<br />
			

			<h:panelGrid columns="1" id="panelAreas" align="center">				

				<h:panelGroup>
					<h:panelGrid columns="1" cellpadding="3" align="left" >

						<h:panelGrid columns="2" cellpadding="3" align="left" border="1" >
						<h:outputText value="햞ea Uno"
							styleClass="legend2" />
						<h:selectOneMenu id="SelectArea1" readonly="true"
							value="#{manejadorAgendaConocimientos.agendaConocimiento1}"
							onchange="submit(this)" immediate="true"
							valueChangeListener="#{manejadorAgendaConocimientos.cambiarAreaNivel1}"
							styleClass="textarea">
							<f:selectItems value="#{manejadorAgendaConocimientos.agendaConocimiento1Item}" />
						</h:selectOneMenu>
						
					
						<h:outputText value="Sub-햞ea Uno" 
							styleClass="legend2" />
						<h:selectOneMenu id="SelectArea11" readonly="true"
							value="#{manejadorAgendaConocimientos.agendaSubConocimiento1}"							
							styleClass="textarea">
							<f:selectItems value="#{manejadorAgendaConocimientos.agendaSubConocimiento1Item}" />
						</h:selectOneMenu>
						</h:panelGrid>
						
						<h:panelGrid columns="2" cellpadding="3" align="left" border="1" >
						<h:outputText value="햞ea Dos"
							styleClass="legend2" />
						<h:selectOneMenu id="SelectArea2" readonly="true"
							value="#{manejadorAgendaConocimientos.agendaConocimiento2}"
							onchange="submit(this)" immediate="true"
							valueChangeListener="#{manejadorAgendaConocimientos.cambiarAreaNivel2}"
							styleClass="textarea">
							<f:selectItems value="#{manejadorAgendaConocimientos.agendaConocimiento2Item}" />
						</h:selectOneMenu>
						
						<h:outputText value="Sub-햞ea Dos"
							styleClass="legend2" />
						<h:selectOneMenu id="SelectArea22" readonly="true"
							value="#{manejadorAgendaConocimientos.agendaSubConocimiento2}"							
							styleClass="textarea">
							<f:selectItems value="#{manejadorAgendaConocimientos.agendaSubConocimiento2Item}" />
						</h:selectOneMenu>
						</h:panelGrid>
						
						<h:panelGrid columns="2" cellpadding="3" align="left" border="1" >
						<h:outputText value="햞ea Tres"
							styleClass="legend2" />
						<h:selectOneMenu id="SelectArea3" readonly="true"
							value="#{manejadorAgendaConocimientos.agendaConocimiento3}"
							onchange="submit(this)" immediate="true"
							valueChangeListener="#{manejadorAgendaConocimientos.cambiarAreaNivel3}"
							styleClass="textarea">
							<f:selectItems value="#{manejadorAgendaConocimientos.agendaConocimiento3Item}" />
						</h:selectOneMenu>
						
						<h:outputText value="Sub-햞ea Tres"
							styleClass="legend2" />
						<h:selectOneMenu id="SelectArea33" readonly="true"
							value="#{manejadorAgendaConocimientos.agendaSubConocimiento3}"							
							styleClass="textarea">
							<f:selectItems value="#{manejadorAgendaConocimientos.agendaSubConocimiento3Item}" />
						</h:selectOneMenu>
						</h:panelGrid>
						
						<h:outputText />
						<h:outputText value="#{manejadorAgendaConocimientos.errorValidacion}" style="font-size:xx-small; color:#FF3939;  text-align:left;"/>

					</h:panelGrid>
				</h:panelGroup>		
			

			</h:panelGrid>


		</s:fieldset>

	</h:panelGroup>

	

	<h:outputText value="#{manejadorAgendaConocimientos.mensajeValidacion}" style="font-size: xx-small; color:#FF3939; font-weight: bold; text-align: left; font-style: normal" />


</h:panelGrid>


</h:form>
</ui:define>
</ui:composition>
