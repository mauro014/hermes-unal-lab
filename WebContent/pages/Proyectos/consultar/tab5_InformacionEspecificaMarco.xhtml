<?xml version='1.0' encoding='ISO-8859-1' ?>
<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:t="http://myfaces.apache.org/tomahawk"
	xmlns:s="http://myfaces.apache.org/sandbox"
	template="../../../templates/common.xhtml">

	<ui:define name="content">
		<h:form id="form">
		<t:div styleClass="contenido-titulo-general-myriad">Información Permiso Marco</t:div>
			<br />
			<p:menubar model="#{manejadorMenuFormularios.modelItemProyecto}" />

			<br />
			<p:panel>
				<p:panelGrid styleClass="estilo-panelgrid-sinbordes"
					style="width: 100%;">
				<p:row>
					<p:column>
						<t:div style="width: 100px;">
							<p:selectOneButton value="#{manejadorInformacionMarco.opcion0}" disabled="true">  
								<f:selectItem itemLabel="Si" itemValue="true" />  
								<f:selectItem itemLabel="No" itemValue="false" />
								<p:ajax update="@form" process="@form" />
							</p:selectOneButton>
						</t:div> 
					</p:column>
					<p:column>
					<h:outputText 
						value="Declaro que el proyecto tiene como finalidad exclusiva investigación científica no comercial y NO CONTIENE 
						actividades de recolección con fines industriales, comerciales, prospección biológica o estudios ambientales." />
					</p:column>
				</p:row>
				<p:row rendered="#{!manejadorInformacionMarco.opcion0}">
					<p:column colspan="2">
							<p:panel style="text-align:justify;"
								id="investigadoresExtranjeros">
								<h:outputText
									value="El PMR otorgado mediante Resolución 0255 de 2014 no ampara actividades de recolección de 
									especímenes de especies silvestres de la diversidad biológica con fines industriales, 
									comerciales, prospección biológica o estudios ambientales. 
									Si su investigación tiene estos fines debe realizar por medio de la Vicerrectoría de Investigación 
									el trámite del correspondiente permiso el cual se regirá por la 
									reglamentación específica, expedida por el Gobierno Nacional para tal efecto.	" />
							</p:panel>
					</p:column>
				</p:row>
				<p:row>
					<p:column>
						<h:outputText value="Ambito general:" />
					</p:column>
					<p:column>
						<p:selectOneMenu value="#{manejadorInformacionMarco.proyectoActual.ambitoGeneralPM}"
						style="width: 100%;" panelStyle="width: 400px;" disabled="true">
						<f:selectItems
							value="#{manejadorInformacionMarco.ambitoRecolecta}" />
					</p:selectOneMenu>
					</p:column>
				</p:row>
				<p:row>
					<p:column>
						<t:div style="width: 100px;">
							<p:selectOneButton value="#{manejadorInformacionMarco.opcion1}" disabled="true">  
								<f:selectItem itemLabel="Sí" itemValue="true" />  
								<f:selectItem itemLabel="No" itemValue="false" />
								<p:ajax update="@form" process="@form" />
							</p:selectOneButton>
						</t:div>
					</p:column>
					<p:column style="text-align:justify;">
						<h:outputText
						value="Declaro que me comprometo a depositar los especímenes recolectados en el proyecto en una 
						colección biológica de la Universidad Nacional registrada ante el Instituto de Investigación de Recursos Biológicos Alexander von Humboldt 
						una vez finalizadas las actividades de investigación, y que aportaré al informe final el correspondiente certificado." />
					</p:column>
				</p:row>
				<p:row>
					<p:column>
						<h:outputText
							value="Colección Biológica: " />
					</p:column>
					<p:column>
						<p:selectOneMenu
							value="#{manejadorInformacionMarco.proyectoActual.coleccionBiologicaPM}"
							style="width: 100%;" panelStyle="width: 400px;" disabled="true">
							<f:selectItems
								value="#{manejadorInformacionMarco.listaColeccionesItem}" />
						</p:selectOneMenu>
					</p:column>
				</p:row>
				<p:row>
					<p:column>
						<t:div style="width: 100px;">
							<p:selectOneButton value="#{manejadorInformacionMarco.opcion2}" disabled="true">  
								<f:selectItem itemLabel="Si" itemValue="true" />  
								<f:selectItem itemLabel="No" itemValue="false" />
								<p:ajax update="@form" process="@form" />
							</p:selectOneButton>
						</t:div>
					</p:column>
					<p:column>
						<h:outputText
						value="Pretende recolectar especies amenazadas, vedadas o endémicas." />
					</p:column>
				</p:row>
				<p:row rendered="#{manejadorInformacionMarco.opcion2}">
					<p:column colspan="2" style="text-align:justify;">
						<p:panel id="especiesVedadas">
							<h:outputText
								value="Deberá solicitar autorización previa por medio de la Vicerrectoría de Investigación a la autoridad competente para llevar a cabo dicho proyecto de acuerdo al Formato de Solicitud de Autorización de Recolección de Especies Amenazadas, Vedadas o Endémicas." />
							<br />
							<h:outputLink
								value="http://www.anla.gov.co/documentos/normativa/Anexo%2011D%20dec_1376_especies%20amenazadas,%20end%C3%A9micas%20o%20vedadas.pdf"
								target="_blank"
								style="text-decoration:none; 
										color: #16A8E2;
										font-weight: bold;">
								<h:outputText value="Descargar formato" />
							</h:outputLink>
							<h:outputText value=" para realizar solicitud." />
						</p:panel>
					</p:column>
				</p:row>
				<p:row>
					<p:column>
							<t:div style="width: 100px;">
								<p:selectOneButton value="#{manejadorInformacionMarco.opcion3}" disabled="true">  
									<f:selectItem itemLabel="Si" itemValue="true" />  
									<f:selectItem itemLabel="No" itemValue="false" />
									<p:ajax update="@form" process="@form" />
								</p:selectOneButton>
							</t:div>
					</p:column>
					<p:column>
						<h:outputText
							value="La recolección de especimenes se realizará en área de comunidades étnicas" />
					</p:column>
				</p:row>
				<p:row rendered="#{manejadorInformacionMarco.opcion3}">
					<p:column colspan="2" style="text-align:justify;">
						<p:panel id="consultaPrevia">
							<h:outputText
								value="Previo al inicio de la ejecución del proyecto deberá cumplir con el proceso de consulta previa por intermedio de la vicerrectoría de Investigación." />
							<br />
							<h:outputLink
								value="http://www.mininterior.gov.co/mision/direccion-de-consulta-previa/formato-de-solicitudes-proceso-consulta-previa"
								target="_blank"
								style="text-decoration:none; 
										color: #16A8E2;
										font-weight: bold;">
								<h:outputText value="Descargar formato" />
							</h:outputLink>
							<h:outputText value=" para realizar solicitud." />
						</p:panel>
					</p:column>
				</p:row>
				<p:row>
					<p:column>
						<t:div style="width: 100px;">
							<p:selectOneButton value="#{manejadorInformacionMarco.opcion4}" disabled="true">  
								<f:selectItem itemLabel="Si" itemValue="true" />  
								<f:selectItem itemLabel="No" itemValue="false" />
								<p:ajax update="@form" process="@form" />
							</p:selectOneButton>
						</t:div>
					</p:column>
					<p:column>
						<h:outputText
							value="Pretende recolectar especimenes al interior de un área del sistema de parques nacionales." />
					</p:column>
				</p:row>
				<p:row rendered="#{manejadorInformacionMarco.opcion4}">
					<p:column colspan="2" style="text-align:justify;">
						<p:panel id="consultaPrevia">
							<h:outputText
								value="Deberá previo a la recolección tramitar a través de la Vicerrectoría de Investigación la obtención de la autorización de Parques Nacionales Naturales de Colombia." />
							<br />
							<h:outputLink
								value="http://www.suit.gov.co/VisorSUIT/index.jsf?FI=30157"
								target="_blank"
								style="text-decoration:none; 
										color: #16A8E2;
										font-weight: bold;">
								<h:outputText value="Descargar formato" />
							</h:outputLink>
							<h:outputText value=" para realizar solicitud." />
						</p:panel>
					</p:column>
				</p:row>
				<p:row>
					<p:column>
						<h:outputText
						value="Grupo taxonómico a ser recolectado:" />
					</p:column>
					<p:column>
						<p:inputTextarea style="width: 100%;" disabled="true"
						value="#{manejadorInformacionMarco.proyectoActual.cateogoriasTaxonomicasPM}" />
					</p:column>
				</p:row>
				<p:row rendered="#{manejadorInformacionMarco.opcion2 or manejadorInformacionMarco.opcion3 or manejadorInformacionMarco.opcion4}">
					<p:column>
						
					</p:column>
					<p:column>
						
					</p:column>
				</p:row>
				</p:panelGrid>
			</p:panel>
			<h:panelGrid columns="3" cellpadding="3" align="center">
				<p:commandButton
					action="#{manejadorInformacionMarco.siguienteConsulta}"
					value="Siguiente" update="@form" />
			</h:panelGrid>
		</h:form>
	</ui:define>
</ui:composition>
