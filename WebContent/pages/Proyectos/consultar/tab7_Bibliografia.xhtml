<?xml version='1.0' encoding='ISO-8859-1' ?>
<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:t="http://myfaces.apache.org/tomahawk"
	xmlns:s="http://myfaces.apache.org/sandbox"
	template="../../../templates/common.xhtml">

	<ui:define name="content">
		<h:form>

			<t:div styleClass="contenido-titulo-general-myriad">Bibliografía</t:div>
			<br />
			<p:menubar model="#{manejadorMenuFormularios.modelItemProyecto}" />
			<br />

			<h:panelGrid columns="1" cellpadding="6" cellspacing="3">

				<t:div styleClass="contenido-titulo-general-myriad-1">
					<h:outputText value="#{manejadorBibliografia.inicioTitulo}"
						style="font-weight: bold" />
				</t:div>

			</h:panelGrid>
			<br />

			<p:panel id="grupoInsercionReferencias"
				header="Inserción de Referencias Bibliográficas">

				<h:panelGrid columns="1" align="center">

					<p:dataTable id="tablaBibliografica"
						binding="#{manejadorBibliografia.tablaBibliografia}"
						cellpadding="6" cellspacing="3"
						value="#{manejadorBibliografia.listaBibliografia}"
						var="bibliografia"
						emptyMessage="No existen referencias bibliograficas asociadas al proyecto"
						style="width:500px">

						<center>
							<p:column>
								<p:inputTextarea id="bibliografiaValor" readonly="true"
									value="#{bibliografia.valor}"
									rendered="#{!bibliografia.borrable}" cols="70" rows="5"
									required="true">
									<f:validateLength maximum="500" />
								</p:inputTextarea>
							</p:column>
						</center>
					</p:dataTable>

				</h:panelGrid>

			</p:panel>

		</h:form>
	</ui:define>
</ui:composition>
