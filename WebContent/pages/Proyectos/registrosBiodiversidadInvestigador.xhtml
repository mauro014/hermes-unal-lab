<?xml version='1.0' encoding='ISO-8859-1' ?>
<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:t="http://myfaces.apache.org/tomahawk"
	template="../../templates/common.xhtml">
	<ui:define name="content">
		<script type="text/javascript">
			if (window.addEventListener) {
				  window.addEventListener('pageshow', function(event) {
				    if (event.persisted) {
				      // Eliminar caché de la página
				      window.location.reload(); 
				    }
				  }, false);
				}
		</script>
		<div class="estilo-propio"><h:form>
			<t:div styleClass="contenido-titulo-general-myriad">Registros de biodiversidad</t:div>
			<p:dataTable id="proyectosInvestigador" var="proyectoInvestigador"
				value="#{manejadorProyectosInvestigador.listaBiodiversidad}"
				emptyMessage="No tiene registros de biodiversidad asociados."
				filteredValue="#{manejadorProyectosInvestigador.filteredRegistroBiodiversidad}"
				sortBy="#{proyectoInvestigador.id}" sortOrder="descending">
				<p:column 
					filterBy="#{proyectoInvestigador.nombre} #{proyectoInvestigador.id} #{proyectoInvestigador.nombreEstadoProyecto}"
					filterStyleClass="filtro-proyecto-campo"
					filterStyle="width: 400px;" filterMatchMode="contains">
					<f:facet name="header">
						<div style="width: 400px; margin: auto; text-align: center;">
						<h:outputText value="Buscar registro (estado, código o nombre):" /></div>
					</f:facet>			
					<div style="padding-bottom: ">
						<h:outputText
						value="Código:  #{proyectoInvestigador.id}" style='font-weight:bold;' />
						<br />
						 <h:outputText
						value="#{proyectoInvestigador.nombre}" style="font-size:16px;"/><br />
					<br />
					<b>Convocatoria: </b> <h:outputText
						value=" #{proyectoInvestigador.convocatoriaPadre}" /> <br />
					<b>Modalidad: </b> <h:outputText
						value=" #{proyectoInvestigador.nombreModalidad}" />					
					<br />
					</div>
					<br />
					<t:div rendered="#{proyectoInvestigador.estadoProyecto=='Activo'}"
						style="text-align: left;">
						<img
							src="#{facesContext.externalContext.requestContextPath}/images/estados-proyectos/Activo.png" /><br />
							<br />
						<h:outputText value=" Este proyecto tiene compromisos pendientes relacionados con el registro del informes." style="color: #FF0000; font-weight: bold;"
						rendered="#{proyectoInvestigador.compromisosPendientes == 'S'}"/>
						<h:outputText value=" Este proyecto tiene compromisos pendientes relacionados con la revisión del informes por parte del coordinador asignado." style="color: #FF0000; font-weight: bold;"
						rendered="#{proyectoInvestigador.compromisosPendientes == 'E'}"/>
					</t:div>
					<t:div
						rendered="#{proyectoInvestigador.estadoProyecto=='Aprobado'}"
						style="text-align: left;">
						<img
							src="#{facesContext.externalContext.requestContextPath}/images/estados-proyectos/Aprobado.png" />
					</t:div>
					<t:div
						rendered="#{proyectoInvestigador.estadoProyecto=='Aprobado Vicerrectoría'}"
						style="text-align: left;">
						<img
							src="#{facesContext.externalContext.requestContextPath}/images/estados-proyectos/Aprobado.png" />
					</t:div>
					<t:div
						rendered="#{proyectoInvestigador.estadoProyecto=='Cancelado'}"
						style="text-align: left;">
						<img
							src="#{facesContext.externalContext.requestContextPath}/images/estados-proyectos/Cancelado.png" />
					</t:div>
					<t:div
						rendered="#{proyectoInvestigador.estadoProyecto=='Elegible'}"
						style="text-align: left;">
						<img
							src="#{facesContext.externalContext.requestContextPath}/images/estados-proyectos/Elegible.png" />
					</t:div>
					<t:div
						rendered="#{proyectoInvestigador.estadoProyecto=='Finalizado'}"
						style="text-align:  left;">
						<img
							src="#{facesContext.externalContext.requestContextPath}/images/estados-proyectos/Finalizado.png" />
					</t:div>
					<t:div
						rendered="#{proyectoInvestigador.estadoProyecto=='Por finalizar entidad externa'}"
						style="text-align:  left;">
						<img
							src="#{facesContext.externalContext.requestContextPath}/images/estados-proyectos/porFinalizar.png" />
					</t:div>
					<t:div
						rendered="#{proyectoInvestigador.estadoProyecto=='Ingresando Proyecto'}"
						style="text-align: left;">
						<img
							src="#{facesContext.externalContext.requestContextPath}/images/estados-proyectos/Ingresando.png" />
					</t:div>
					<t:div
						rendered="#{proyectoInvestigador.estadoProyecto=='No aprobado'}"
						style="text-align: left;">
						<img
							src="#{facesContext.externalContext.requestContextPath}/images/estados-proyectos/No_financiado.png" />
					</t:div>
					<t:div
						rendered="#{proyectoInvestigador.estadoProyecto=='No Aprobado Vicerrectoría'}"
						style="text-align: left;">
						<img
							src="#{facesContext.externalContext.requestContextPath}/images/estados-proyectos/No_financiado.png" />
					</t:div>
					<t:div
						rendered="#{proyectoInvestigador.estadoProyecto=='Propuesto'}"
						style="text-align: left;">
						<img
							src="#{facesContext.externalContext.requestContextPath}/images/estados-proyectos/Propuesto.png" />
					</t:div>
					<t:div
						rendered="#{proyectoInvestigador.estadoProyecto=='Suspendido'}"
						style="text-align: left;">
						<img
							src="#{facesContext.externalContext.requestContextPath}/images/estados-proyectos/Suspendido.png" />
					</t:div>
					<t:div
						rendered="#{proyectoInvestigador.estadoProyecto=='No cumplió requisitos'}"
						style="text-align: left;">
						<img
							src="#{facesContext.externalContext.requestContextPath}/images/estados-proyectos/No_cumplio_requisitos.png" />
					</t:div>
					<br />
					<t:div>
						<h:commandLink
							action="#{manejadorProyectosInvestigador.editarProyectoActivo}"
							value="Consultar"
							rendered="#{(!proyectoInvestigador.esIngresando &amp;&amp; proyectoInvestigador.proyectoPadre!=0 and !proyectoInvestigador.esContratoAccesoBiodiversidad)}">
							<f:setPropertyActionListener value="#{proyectoInvestigador}"
								target="#{manejadorProyectosInvestigador.proyectoSeleccionado}" />
						</h:commandLink>
						<h:outputText rendered="#{(!proyectoInvestigador.esIngresando &amp;&amp; proyectoInvestigador.proyectoPadre!=0 and !proyectoInvestigador.esContratoAccesoBiodiversidad)}"> | </h:outputText>
						
						<h:commandLink
							action="#{manejadorProyectosInvestigador.editarGenerico}"
							value="Editar"
							rendered="#{proyectoInvestigador.esEditable
							|| proyectoInvestigador.esIngresando }">
							<f:setPropertyActionListener value="#{proyectoInvestigador}"
								target="#{manejadorProyectosInvestigador.proyectoSeleccionado}" />
						</h:commandLink>
						<h:outputText
							rendered="#{proyectoInvestigador.esEditable	||	proyectoInvestigador.esIngresando}"> | </h:outputText>
						
						<h:commandLink
							onclick="if(!confirm('Esta seguro de eliminar el proyecto?'))return false"
							action="#{manejadorProyectosInvestigador.borrarPropuesto}"
							value="Eliminar"
							rendered="#{(proyectoInvestigador.mostrarBotonEditarEliminarProyectoPropuesto &amp;&amp; proyectoInvestigador.esPropuesto) ||
								(proyectoInvestigador.mostrarBotonEditarOEliminarProyectoIngresando &amp;&amp; proyectoInvestigador.esIngresando)}">
							<f:setPropertyActionListener value="#{proyectoInvestigador}"
								target="#{manejadorProyectosInvestigador.proyectoSeleccionado}" />
						</h:commandLink>
						<h:outputText
							rendered="#{(proyectoInvestigador.mostrarBotonEditarEliminarProyectoPropuesto &amp;&amp; proyectoInvestigador.esPropuesto) ||
								(proyectoInvestigador.mostrarBotonEditarOEliminarProyectoIngresando &amp;&amp; proyectoInvestigador.esIngresando)}"> | </h:outputText>
						
						<h:commandLink value="Solicitudes"
							action="#{manejadorProyectosInvestigador.listarSolicitudes}"
							rendered="#{(proyectoInvestigador.mostrarBotonEditarProyectoActivoSolicitud &amp;&amp; (proyectoInvestigador.esActivo or proyectoInvestigador.esSuspendido)) or (proyectoInvestigador.esElegible and proyectoInvestigador.esContratoAccesoBiodiversidad) or (proyectoInvestigador.esPropuesto and proyectoInvestigador.esPermisoMarcoAsignatura)}">
							<f:setPropertyActionListener value="#{proyectoInvestigador}"
								target="#{manejadorProyectosInvestigador.proyectoSeleccionado}" />
						</h:commandLink>
						<h:outputText
							rendered="#{(proyectoInvestigador.mostrarBotonEditarProyectoActivoSolicitud  
							&amp;&amp; (proyectoInvestigador.esActivo or proyectoInvestigador.esSuspendido)) or (proyectoInvestigador.esElegible and proyectoInvestigador.esContratoAccesoBiodiversidad) or (proyectoInvestigador.esPropuesto and proyectoInvestigador.esPermisoMarcoAsignatura)}"> | </h:outputText>
						
						<h:commandLink
							action="#{manejadorProyectosInvestigador.ingresarInforme}"
							value="Informes"
							rendered="#{proyectoInvestigador.mostrarBotonInforme &amp;&amp; (proyectoInvestigador.esActivo or proyectoInvestigador.esFinalizado)}">
							<f:setPropertyActionListener value="#{proyectoInvestigador}"
								target="#{manejadorProyectosInvestigador.proyectoSeleccionado}" />
						</h:commandLink>
						<h:outputText
							rendered="#{proyectoInvestigador.mostrarBotonInforme &amp;&amp; (proyectoInvestigador.esActivo or proyectoInvestigador.esFinalizado)}"> | </h:outputText>

						<h:commandLink
							action="#{manejadorProyectosInvestigador.reporteRequisitos}"
							value="Reporte requisitos"
							rendered="#{(proyectoInvestigador.esRechazado 
							|| proyectoInvestigador.esElegible ||  proyectoInvestigador.esAprobado
							||  proyectoInvestigador.esActivo || proyectoInvestigador.esFinalizado) and !proyectoInvestigador.esContratoAccesoBiodiversidad}">
							<f:setPropertyActionListener value="#{proyectoInvestigador}"
								target="#{manejadorProyectosInvestigador.proyectoSeleccionado}" />
						</h:commandLink>
						<h:outputText rendered="#{(proyectoInvestigador.esRechazado || proyectoInvestigador.esElegible ||  proyectoInvestigador.esAprobado
							||  proyectoInvestigador.esActivo || proyectoInvestigador.esFinalizado) and !proyectoInvestigador.esContratoAccesoBiodiversidad}"> | </h:outputText>
						
						<h:commandLink
							action="#{manejadorProyectosInvestigador.cargarCartasProyecto}"
							value="Información seguimiento"
							rendered="#{((proyectoInvestigador.esActivo) ||
									(proyectoInvestigador.esAprobado) || 
									(proyectoInvestigador.esFinalizado)) or (proyectoInvestigador.esContratoAccesoBiodiversidad)}" target="_blank" >
							<f:setPropertyActionListener value="#{proyectoInvestigador}"
								target="#{manejadorProyectosInvestigador.proyectoSeleccionado}" />
						</h:commandLink>
						<h:outputText rendered="#{((proyectoInvestigador.esActivo) ||
									(proyectoInvestigador.esAprobado) || 
									(proyectoInvestigador.esFinalizado)) or (proyectoInvestigador.esContratoAccesoBiodiversidad)}"> | </h:outputText>
						
						<h:commandLink rendered="#{!proyectoInvestigador.esContratoAccesoBiodiversidad}"
							action="#{manejadorProyectosInvestigador.imprimirProyecto}"
							target="_blank" value="Descargar reporte">
							<f:setPropertyActionListener value="#{proyectoInvestigador}"
								target="#{manejadorProyectosInvestigador.proyectoSeleccionado}" />
						</h:commandLink>
						<h:outputText rendered="#{!proyectoInvestigador.esContratoAccesoBiodiversidad}" > | </h:outputText>
							
						<h:commandLink
							action="#{manejadorProyectosInvestigador.imprimirProyectoAsociado}"
							target="_blank" value="Descargar reporte proyecto asociado"
							rendered="#{!empty proyectoInvestigador.codigoDib}">
							<f:setPropertyActionListener value="#{proyectoInvestigador}"
								target="#{manejadorProyectosInvestigador.proyectoSeleccionado}" />
						</h:commandLink>
						<h:outputText							
							rendered="#{!empty proyectoInvestigador.codigoDib}"> | </h:outputText>
					</t:div>
				</p:column>
			</p:dataTable>
		</h:form></div>			
	</ui:define>

</ui:composition>
