								</p>
							</center>

						<t:div styleClass="informacion-subtexto">
							<h:outputText
								value="UNINNOVA representa al proyecto de inversión “Fomento de una Cultura de Innovación en la Universidad Nacional de Colombia”, liderado por la Vicerrectoría de  Investigación y la Dirección de Extensión Sede Bogotá. Propone escenarios y actividades dirigidas a la comunidad Universitaria de la sede Bogotá, con el ánimo de establecer una cultura de la innovación, la creación y los procesos asociados de gestión de la propiedad intelectual, por medio del apoyo a la formulación de propuestas de innovación, procesos de transferencia de conocimiento, educación continua y creación de un ambiente cultural sobre la importancia de la innovación social y tecnológica para el desarrollo del país." />
						</t:div>

					</t:div>
