<?xml version='1.0' encoding='ISO-8859-1' ?>
<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:t="http://myfaces.apache.org/tomahawk"
	xmlns:s="http://myfaces.apache.org/sandbox"
	template="../../../templates/common.xhtml">

	<ui:define name="title">DIVULGAR INFORMACIÓN CURSO</ui:define>
	<ui:define name="content">
		
		<p:growl id="growl"/>
		
		<h:form id="form">
			
			<t:div styleClass="contenido-titulo-general-myriad">Divulgar Cursos ECP</t:div>

			<p:panel header="Configuración de correo">
				<br />
				
				<t:div styleClass="informacion-subtitulo">
					<h:outputText value="Curso : #{ManejadorDivulgarCursosModuloECP.cursoActual.nombre}"/>
				</t:div>
				<br />

				<h:panelGrid columns="3" style="width: 90%">
					
					<t:div styleClass="informacion-subtitulo">
						<h:outputText value="Asunto" />
					</t:div>
					<p:inputText id="Asunto" size="83"
						value="#{ManejadorDivulgarCursosModuloECP.asuntoCorreo}"
						maxlength="200" 
						required="true"
						requiredMessage="Debe ingresar un asunto para el correo electrónico"/>
					<p:message for="Asunto" display="icon"/>	
					
					<t:div styleClass="informacion-subtitulo">
						<h:outputText value="Cuerpo de correo" />
					</t:div>	
					<p:inputTextarea id="cuerpoCorreo"
						value="#{ManejadorDivulgarCursosModuloECP.cuerpoCorreo}" rows="15"
						cols="80" autoResize="false" maxlength="2000" counter="counter"
						counterTemplate="{0} caracteres restantes" required="true" 
						requiredMessage="Debe ingresar un cuerpo para el correo electrónico"/>
					<p:message for="cuerpoCorreo" display="icon"/>		

					<h:outputText />
					<t:div styleClass="informacion-subtitulo">
						<h:outputText id="counter" />
					</t:div>	
					<h:outputText />
					
					<h:outputText />
					<br />
					<h:outputText />
					
					<t:div styleClass="informacion-subtitulo">
						<h:outputText value="Correo prueba" />
					</t:div>
					<h:panelGrid columns="3">
						<p:inputText id="correoPrueba"
							value="#{ManejadorDivulgarCursosModuloECP.correoPrueba}"
							maxlength="60"
							size="30">	
						</p:inputText>	
						<p:commandButton icon="ui-icon-mail-closed"
									 action="#{ManejadorDivulgarCursosModuloECP.enviarCorreoPrueba}"
								     title="Enviar Correo Prueba"
								     update="msgs"/>
					    <p:message for="correoPrueba" display="icon"/>
					</h:panelGrid>				     
					<h:outputText />			     
					
					<t:div styleClass="informacion-subtitulo">
						<h:outputText value="Población" />
					</t:div>	
					<p:selectManyCheckbox id="opcionesPoblacion" 
										  value="#{ManejadorDivulgarCursosModuloECP.listaSeleccionadosPoblacion}"
										  required="true"
										  requiredMessage="Debe seleccionar mínimo una población como destinatario">
						<f:selectItems value="#{ManejadorDivulgarCursosModuloECP.listaOpcionesPoblacion}"/>
					</p:selectManyCheckbox>
					<p:message for="opcionesPoblacion" display="icon"/>
					
				</h:panelGrid>
				
				<br /><br />
				
				<h:panelGrid columns="2" align="center" id="pG_botones">
				<p:commandButton value="Atras"
					action="#{ManejadorDivulgarCursosModuloECP.atras}"
					immediate="true" rendered="false"/>

				<p:commandButton value="Enviar"
					action="#{ManejadorDivulgarCursosModuloECP.enviarCorreo}"
					update="@form">
				</p:commandButton>
				
			</h:panelGrid>
						
			</p:panel>
			
			<br />
			
			<p:messages id="msgs" showSummary="true"/>

		</h:form>
	</ui:define>
</ui:composition>
