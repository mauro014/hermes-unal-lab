<?xml version='1.0' encoding='ISO-8859-1' ?>
<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:t="http://myfaces.apache.org/tomahawk"
	xmlns:s="http://myfaces.apache.org/sandbox"
	template="../../../templates/common.xhtml">

	<ui:define name="title">CONSULTAR MODULO</ui:define>
	<ui:define name="content">
		<h:form id="form">
			<p:panel id="defModulo" header="Definición del Módulo">
				<h:panelGrid id="pG_informativo" columns="1">
					<h:outputText
						value="Los módulos cerrados son aquellos que se derivan de un proceso de negociación con una entidad contratante, los cursos abiertos corresponden a la oferta de educación continua y permanente de la Universidad"
						style="text-align: justify" />
				</h:panelGrid>
				<br />
				<h:panelGrid id="pGModalidad" columns="2">
					<h:outputText value="Modalidad:" />
					<p:selectOneMenu id="modalidad"
						value="#{ManejadorAdministrarModuloECP.modalidadECP}"
						disabled="true">
						<f:selectItem itemLabel="Cerrado" itemValue="Cerrado" />
						<f:selectItem itemLabel="Abierto" itemValue="Abierto" />
					</p:selectOneMenu>

					<h:outputText value="Nombre:" />
					<p:inputTextarea id="ITA_nombre"
						value="#{ManejadorAdministrarModuloECP.nombre}" rows="5" cols="60"
						autoResize="false" maxlength="90" 
						readonly="true" />

					<h:outputText value="Objetivo General:" />
					<p:inputTextarea id="ITA_objetivoGeneral"
						value="#{ManejadorAdministrarModuloECP.objGeneral}" rows="5" cols="60"
						autoResize="false" maxlength="220"  
						readonly="true" />
						
					<h:outputText value="Clase de Evento: " />
					<p:inputTextarea id="IT_claseEvento"
						value="#{ManejadorAdministrarModuloECP.claseEventoECP}"
						readonly="true"
						autoResize="false"
						rows="2" cols="60"/>
					
					<h:outputText value="Evento de Extensión:" id="tpEvento" rendered="#{ManejadorAdministrarModuloECP.mostrarSubEvento}"/>
					<p:inputText id="IT_subEvento"
						value="#{ManejadorAdministrarModuloECP.subEventoECP}"
						rendered="#{ManejadorAdministrarModuloECP.mostrarSubEvento}"
						size="30"
						readonly="true"/>
					
					<h:outputText id="OT_otroEvento" value="Otro evento de extensión:" rendered="#{ManejadorAdministrarModuloECP.subEventoECP == 'OTRA'}"/>
					<p:inputText id="IT_otroEvento"
						value="#{ManejadorAdministrarModuloECP.otroEvento}"
						size="70"
						rendered="#{ManejadorAdministrarModuloECP.subEventoECP == 'OTRA'}"
						readonly="true" />

				</h:panelGrid>			
								
			</p:panel>
			
			<br/>
			<h:panelGrid columns="2" align="center" id="pG_botones">
				<p:commandButton value="Volver"
					action="#{ManejadorAdministrarModuloECP.volverAdmin}"
					immediate="true"/>				
			</h:panelGrid>			

		</h:form>
	</ui:define>
</ui:composition>
