<?xml version='1.0' encoding='ISO-8859-1' ?>
<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:t="http://myfaces.apache.org/tomahawk"
	xmlns:s="http://myfaces.apache.org/sandbox"
	template="../../../templates/common.xhtml">

	<ui:define name="title">EDITAR CURSOS DE EDUCACIÓN CONTINUA Y PERMANENTE</ui:define>

	<ui:define name="content">

		<style type="text/css">
.datalist-noborder .ui-widget-content {
	border: none;
}
</style>

		<h:form id="form">

			<t:div styleClass="contenido-titulo-general-myriad">
				<h:outputText value="#{ManejadorEditarCursoECP.curso.nombre}" />
			</t:div>

			<p:growl id="growl" showDetail="true" sticky="true" />

			<t:div styleClass="informacion">
				<p:panelGrid columns="1"
					rendered="#{ManejadorEditarCursoECP.curso != null}"
					style="width:675px" styleClass="estilo-panelgrid-sinbordes">
					<t:div styleClass="informacion-texto">

						<t:div styleClass="informacion-subtitulo">
							<h:outputText value="Objetivo General" />
						</t:div>
						<t:div styleClass="informacion-subtexto">
							<h:outputText
								value="#{ManejadorEditarCursoECP.curso.objetivoGeneral}" />
						</t:div>


						<t:div styleClass="informacion-subtitulo">
							<h:outputText value="Objetivos Especificos" />
						</t:div>
						<div class="datalist-noborder">
							<p:dataList value="#{ManejadorEditarCursoECP.listaObjetivos}"
								itemType="disc" var="objetivo">
									#{objetivo.nombre}
						</p:dataList>
						</div>
						<br />


						<t:div styleClass="informacion-subtitulo">
							<h:outputText value="Código" />
						</t:div>
						<t:div styleClass="informacion-subtexto">
							<h:outputText value="#{ManejadorEditarCursoECP.curso.id} " />
						</t:div>

						<t:div styleClass="informacion-subtitulo">
							<h:outputText value="Responsable" />
						</t:div>
						<t:div styleClass="informacion-subtexto">
							<h:outputText
								value="#{ManejadorEditarCursoECP.curso.responsable.nombre1} 
            		 						 #{ManejadorEditarCursoECP.curso.responsable.nombre2}
            		 						 #{ManejadorEditarCursoECP.curso.responsable.apellido1}
            		 						 #{ManejadorEditarCursoECP.curso.responsable.apellido2}" />
						</t:div>

						<t:div styleClass="informacion-subtitulo">
							<h:outputText value="Estado" />
						</t:div>
						<t:div styleClass="informacion-subtexto">
							<h:outputText
								value="#{ManejadorEditarCursoECP.curso.estadoProyecto.nombre}" />
						</t:div>

						<t:div styleClass="informacion-subtitulo">
							<h:outputText value="Modalidad ECP" />
						</t:div>
						<t:div styleClass="informacion-subtexto">
							<h:outputText value="#{ManejadorEditarCursoECP.modalidadEcp}" />
						</t:div>

						<t:div styleClass="informacion-subtitulo">
							<h:outputText value="Sub-modalidad ECP" />
						</t:div>
						<t:div styleClass="informacion-subtexto">
							<h:outputText value="#{ManejadorEditarCursoECP.claseEvento}" />
						</t:div>

						<t:div styleClass="informacion-subtitulo"
							rendered="#{ManejadorEditarCursoECP.curso.claseEvento == 'SUB_EVENTO'}">
							<h:outputText value="Clase Evento" />
						</t:div>
						<t:div styleClass="informacion-subtexto"
							rendered="#{ManejadorEditarCursoECP.curso.claseEvento == 'SUB_EVENTO'}">
							<h:outputText value="#{ManejadorEditarCursoECP.claseEventoExt}"
								rendered="#{ManejadorEditarCursoECP.curso.claseEventoExt != 'OT'}" />
							<h:outputText
								value="#{ManejadorEditarCursoECP.curso.otroClaseEvento}"
								rendered="#{ManejadorEditarCursoECP.curso.claseEventoExt == 'OT'}" />
						</t:div>

						<t:div styleClass="informacion-subtitulo">
							<h:outputText value="Modulo" />
						</t:div>
						<t:div styleClass="informacion-subtexto">
							<h:outputText
								value="#{ManejadorEditarCursoECP.curso.modalidad.tipo.nombre}" />
						</t:div>

						<t:div styleClass="informacion-subtitulo">
							<h:outputText value="" />
						</t:div>

						<t:div styleClass="contenido-titulo-general-myriad-2">Fechas</t:div>
						<br />

						<h:panelGrid columns="3">

							<t:div styleClass="informacion-subtitulo">
								<h:outputText value="Fecha Inicio" />
							</t:div>
							<p:calendar id="fechainicio"
								value="#{ManejadorEditarCursoECP.curso.fechaTentativaInicio}"
								required="true"
								requiredMessage="Fecha de inicio es campo requerido" />
							<h:outputText value="" />

							<t:div styleClass="informacion-subtitulo">
								<h:outputText value="Fecha Fin" />
							</t:div>
							<p:calendar id="fechaFin"
								value="#{ManejadorEditarCursoECP.curso.fechaFinalizacion}"
								required="true"
								requiredMessage="Fecha de fin es campo requerido" />
							<h:outputText value="" />
						</h:panelGrid>

						<t:div styleClass="contenido-titulo-general-myriad-2">Lugar de ejecución</t:div>
						<br />

						<h:panelGrid columns="2" cellpadding="5" cellspacing="5"
							id="panelGridSede" styleClass="estilo-panelgrid-sinbordes">

							<t:div styleClass="informacion-subtitulo">
								<h:outputText value="Sede:" />
							</t:div>
							<p:selectOneMenu
								value="#{ManejadorEditarCursoECP.curso.sedeEjecucion.id}"
								id="sedeUN" style="width:300px" filter="true">
								<f:selectItems value="#{ManejadorEditarCursoECP.sedeItem}" />
							</p:selectOneMenu>

							<t:div styleClass="informacion-subtitulo">
								<h:outputText value="Facultad:" />
							</t:div>
							<p:selectOneMenu
								value="#{ManejadorEditarCursoECP.curso.facultadEjecucion.id}"
								id="facultadUN" style="width:300px" filter="true">
								<f:selectItems value="#{ManejadorEditarCursoECP.facultadItem}" />
							</p:selectOneMenu>

							<t:div styleClass="informacion-subtitulo">
								<h:outputText value="Lugar especifico" />
							</t:div>
							<p:inputTextarea value="#{ManejadorEditarCursoECP.curso.lugar}"
								rows="3" id="lugarEsp" cols="70" maxlength="500"
								counter="counterLugar"
								counterTemplate="{0} caracteres restantes" style="width:400px">
							</p:inputTextarea>

							<h:outputText value="" />
							<h:outputText id="counterLugar" />



						</h:panelGrid>

						<br />
						<t:div styleClass="contenido-titulo-general-myriad-2">Duración</t:div>
						<br />

						<p:panelGrid columns="1" cellpadding="5" cellspacing="5"
							id="panelGridLugar" styleClass="estilo-panelgrid-sinbordes">

							<h:panelGrid columns="18">
								<h:outputText value="Años" />
								<p:inputText value="#{ManejadorEditarCursoECP.curso.duracionA}"
									size="3" id="horaA" required="true"
									requiredMessage="Años es requerido" maxlength="2"
									validatorMessage="Años entre 0 - 99"
									converter="javax.faces.Integer"
									converterMessage="Años sólo debe contener numeros">
									<f:validateLongRange minimum="0" maximum="99" for="horaA" />
								</p:inputText>
								<p:message for="horam" display="icon" />
								<h:outputText value="Meses" />
								<p:inputText value="#{ManejadorEditarCursoECP.curso.duracion}"
									size="3" id="horam" required="true"
									requiredMessage="Meses es requerido" maxlength="3"
									validatorMessage="Meses entre 0 - 999"
									converter="javax.faces.Integer"
									converterMessage="Meses sólo debe contener numeros">
									<f:validateLongRange minimum="0" maximum="999" for="horam" />
								</p:inputText>
								<p:message for="horam" display="icon" />
								<h:outputText value="Semanas" />
								<p:inputText value="#{ManejadorEditarCursoECP.curso.duracions}"
									size="3" id="horas" required="true"
									requiredMessage="Semanas es requerido" maxlength="3"
									validatorMessage="Semanas entre 0 - 999"
									converter="javax.faces.Integer"
									converterMessage="Semanas sólo debe contener numeros">
									<f:validateLongRange minimum="0" maximum="999" for="horas" />
								</p:inputText>
								<p:message for="horas" display="icon" />

								<h:outputText value="Días" />
								<p:inputText value="#{ManejadorEditarCursoECP.curso.duraciond}"
									size="4" id="horad" required="true"
									requiredMessage="Dias es requerido" maxlength="4"
									validatorMessage="Dias entre 0 - 9999"
									converter="javax.faces.Integer"
									converterMessage="Dias sólo debe contener numeros">
									<f:validateLongRange minimum="0" maximum="9999" for="horad" />
								</p:inputText>
								<p:message for="horad" display="icon" />
								<h:outputText value="Horas" />
								<p:inputText value="#{ManejadorEditarCursoECP.curso.duracionh}"
									size="4" id="horah" required="true"
									requiredMessage="Horas es requerido" maxlength="4"
									validatorMessage="Horas entre 0 - 9999"
									converter="javax.faces.Integer"
									converterMessage="Horas sólo debe contener numeros">
									<f:validateLongRange minimum="0" maximum="9999" for="horah" />
								</p:inputText>
								<p:message for="horah" display="icon" />

								<h:outputText value="No aplica " />
								<p:selectBooleanCheckbox
									value="#{ManejadorEditarCursoECP.curso.naDuracion}" />
								<h:outputText value="" />

							</h:panelGrid>

						</p:panelGrid>

						<br />
						<t:div styleClass="contenido-titulo-general-myriad-2">Población objetivo</t:div>
						<br />

						<p:panelGrid columns="2" cellpadding="5" cellspacing="5"
							id="panelGridLugar" styleClass="estilo-panelgrid-sinbordes">

							<t:div styleClass="informacion-subtitulo">
								<h:outputText value="Perfil asistentes" />
							</t:div>
							<h:outputText value="Perfil asistentes - {{ - PENDIENTE - }}" />

						</p:panelGrid>

						<br />
						<t:div styleClass="contenido-titulo-general-myriad-2">Información adicional</t:div>
						<br />

						<p:panelGrid columns="3" cellpadding="5" cellspacing="5"
							id="panelGridLugar" styleClass="estilo-panelgrid-sinbordes">

							<t:div styleClass="informacion-subtitulo">
								<h:outputText value="Estado:" for="costopersona" />
							</t:div>
							<p:selectOneMenu
								value="#{ManejadorEditarCursoECP.curso.estadoProyecto.id}"
								id="estadoCurso" style="width:140px">
								<f:selectItems
									value="#{ManejadorEditarCursoECP.listaEstadosProyectoItem}" />
							</p:selectOneMenu>
							<h:outputText value="" />

							<t:div styleClass="informacion-subtitulo">
								<h:outputText value="Metodología" />
							</t:div>
							<p:inputTextarea
								value="#{ManejadorEditarCursoECP.curso.metodologia}" rows="5"
								id="metUEC" cols="70" style="width:500px" maxlength="2000"
								counter="counterMet" counterTemplate="{0} caracteres restantes">
							</p:inputTextarea>
							<p:message for="metUEC" display="icon" />

							<h:outputText value="" />
							<h:outputText id="counterMet" />
							<h:outputText value="" />

							<t:div styleClass="informacion-subtitulo">
								<h:outputText value="Contenido" />
							</t:div>
							<p:inputTextarea
								value="#{ManejadorEditarCursoECP.curso.descripcion}" rows="5"
								id="contUEC" cols="70" maxlength="2000" counter="counterCont"
								counterTemplate="{0} caracteres restantes" style="width:500px">
							</p:inputTextarea>
							<p:message for="contUEC" display="icon" />

							<h:outputText value="" />
							<h:outputText id="counterCont" />
							<h:outputText value="" />

							<t:div styleClass="informacion-subtitulo">
								<h:outputText value="Observaciones" />
							</t:div>
							<p:inputTextarea
								value="#{ManejadorEditarCursoECP.curso.observaciones}" rows="5"
								id="obsUEC" cols="70" maxlength="2000" counter="counterObsev"
								counterTemplate="{0} caracteres restantes" style="width:500px">
							</p:inputTextarea>
							<p:message for="obsUEC" display="icon" />

							<h:outputText value="" />
							<h:outputText id="counterObsev" />
							<h:outputText value="" />

						</p:panelGrid>

						<br />
						<p:messages id="msgs" autoUpdate="true" showDetail="true"
							showSummary="false" />
						<br />


						<center>

							<p:commandButton action="#{ManejadorEditarCursoECP.guardar}"
								value="GUARDAR INFORMACIÓN CURSO" icon="ui-icon-check"
								update="msgs" />
						</center>


					</t:div>
				</p:panelGrid>
			</t:div>

		</h:form>

	</ui:define>

</ui:composition>
