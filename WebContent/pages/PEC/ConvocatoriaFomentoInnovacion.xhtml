<?xml version='1.0' encoding='ISO-8859-1' ?>

	<ui:define name="title">CONCURSO INNOVACIÓN 2013</ui:define>

	<ui:define name="content">

		<img
			src="#{facesContext.externalContext.requestContextPath}/images/her-paginas/cabezote.png"
			style="padding-bottom: 10px;" />

		<t:div styleClass="contenido-informacion">

			<t:div styleClass="cabezote-informacion-pagina-buscador">
				<h:outputText
					value="Dirección de Extensión Bogotá - Vicerrectoría de Investigación" />
			</t:div>

			<t:div styleClass="contenedor-informacion">

				<br />

				<t:div styleClass="contenido-titulo-general-myriad">Convocatoria Fomento de una Cultura de la Innovación</t:div>
				<br />

				<center>
					<img
						src="#{facesContext.externalContext.requestContextPath}/images/concursoInnovacionVRI-DEB/image-convocatoria fomento.png" width="600" />
				</center>

				<br />

				<t:div styleClass="informacion">

					<t:div styleClass="informacion-texto">

						<t:div styleClass="informacion-subtitulo">
							<p>
								<b>SE EXTIENDE LA CONVOCATORIA FOMENTO DE UNA CULTURA DE LA
									INNOVACIÓN EN LA UNIVERSIDAD NACIONAL DE COLOMBIA </b>
							</p>
						</t:div>

						<br />

						<t:div styleClass="informacion-subtexto">
							<h:outputText
								value="Debido al interés por parte de los Investigadores y creadores de la UN, en participar de la convocatoria “Fomento de una Cultura de la Innovación” (cuya apertura se estableció mediante Resolución de la Vicerrectoría de Investigación número 12 de 2013) se ha decidido extender la fecha límite para el cierre de la inscripción a la convocatoria en el sistema Hermes hasta el viernes 8 de noviembre de 2013. Los interesados pueden inscribirse a través del sistema de información de investigación Hermes, en la página WEB www.hermes.unal.edu.co." />
						</t:div>

						<br />

						<t:div styleClass="informacion-subtexto">
							<h:outputText
								value="La convocatoria “Fomento de una Cultura de la Innovación”, está dirigida a Investigadores y creadores de la Universidad Nacional Sede Bogotá, en todas las áreas del conocimiento, y que estén trabajando en la formulación, desarrollo o transferencia de conocimiento mediante proyectos de innovación para los sectores estatal, social y productivo. Hasta el momento se han registrado 26 proyectos en el marco de la convocatoria." />
						</t:div>

						<br />

					</t:div>

				</t:div>

				<br />
			</t:div>

			<t:div styleClass="final-contenedor-informacion" />
		</t:div>
		<t:div styleClass="contenido-menu">
			<t:div styleClass="menu-superior">
				<t:div styleClass="cabezote-derecho-menu">
					<h:outputText value="UNINNOVA" />
				</t:div>
				<t:div styleClass="menu-grande1">

					<ul>
						<li><h:form>
								<h:outputLink
									value="#{facesContext.externalContext.requestContextPath}/pages/PEC/PrincipalUninnova.xhtml"
									onclick="submit()">
									<h:outputText value="UNINNOVA" />
								</h:outputLink>
							</h:form></li>

						<li><h:form>
								<h:outputLink
									value="#{facesContext.externalContext.requestContextPath}/pages/PEC/ConvocatoriaFomentoInnovacion.xhtml"
									onclick="submit()">
									<h:outputText value="Convocatoria Cultura de la Innovación" />
								</h:outputLink>
							</h:form></li>

						<li><h:form>

									value="#{facesContext.externalContext.requestContextPath}/pages/PEC/CapacitacionesPropiedadIntelectual.xhtml"

							</h:form></li>

						<li><h:form>

									value="#{facesContext.externalContext.requestContextPath}/pages/PEC/ConcursoInnovacion.xhtml"
									onclick="submit()">
									<h:outputText value="Espíritu Innovador" />
								</h:outputLink>
							</h:form></li>

						<li><h:form>
								<h:outputLink
									value="#{facesContext.externalContext.requestContextPath}/pages/PEC/ProgramacionMesInnovacion.xhtml"
									onclick="submit()">
									<h:outputText value="Programación Mes de la Innovación" />
								</h:outputLink>
							</h:form></li>

						<li><h:form>
								<h:outputLink
									value="#{facesContext.externalContext.requestContextPath}/pages/principal/Principal.xhtml"
									onclick="submit()">
									<h:outputText value="Salir" />
								</h:outputLink>
							</h:form></li>
					</ul>

				</t:div>
			</t:div>
