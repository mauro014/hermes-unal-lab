<?xml version='1.0' encoding='ISO-8859-1' ?>
<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:t="http://myfaces.apache.org/tomahawk"
	xmlns:s="http://myfaces.apache.org/sandbox"
	template="../../templates/common.xhtml">

	<ui:define name="title">RECONOCIMIENTO AL ESPÍRITU INNOVADOR - LISTA DE INSCRITOS</ui:define>

	<ui:define name="content">

		<h:form id="form">

			<t:div styleClass="informacion">

				<t:div styleClass="informacion-texto">

					<t:div styleClass="contenido-titulo-general-myriad">
						<h:outputText
							value="Inscritos reconocimiento al espíritu innovador 2014" />
					</t:div>

					<p:growl id="mensajeGrowl" showDetail="true" for="mensajeGrowl"
						effect="fade" />

					<!-- 	Panel Informacion General -->

					<h:panelGrid columns="1" align="center" id="panelPreinscritos">

						<t:div styleClass="informacion-subtexto">
							<h:outputText
								value="La siguiente lista muestra la información de las personas que realizaron el proceso de inscripción al reconocimiento al espíritu innovador por medio de la página Web, sin importar que la postulación sea propia o no. Para obtener la información detallada, seleccione la persona en la tabla y los datos se cargarán en el panel inferior." />
						</t:div>

						<br />

						<!-- 	Panel Informacion Detallada -->

						<p:dataTable id="tablaPreinscritos"
							value="#{ManejadorListaInscritosEspirituInnovador.seleccionadoDataModel}"
							var="preinscrito" cellpadding="6" cellspacing="3"
							paginator="true" rows="15"
							emptyMessage="No existen personas inscritas a este curso"
							selection="#{ManejadorListaInscritosEspirituInnovador.estudianteSeleccionado}"
							selectionMode="single"
							sortBy="#{preinscrito.investigador.apellido1}"
							paginatorPosition="bottom">

							<p:ajax event="rowSelect"
								listener="#{ManejadorListaInscritosEspirituInnovador.onRowSelect}"
								update="@form" />

							<p:ajax event="rowUnselect"
								listener="#{ManejadorListaInscritosEspirituInnovador.onRowUnselect}"
								update="@form" />

							<p:column style="font-size:10px;" rendered="false">
								<f:facet name="header">
									<h:outputText value="TIPO DOCUMENTO" />
								</f:facet>

								<h:outputText
									value="#{preinscrito.investigador.id.tipoDocumento}" />
							</p:column>

							<p:column style="font-size:10px;"
								sortBy="#{preinscrito.investigador.id.documento}">
								<f:facet name="header">
									<h:outputText value="DOCUMENTO" />
								</f:facet>

								<h:outputText value="#{preinscrito.investigador.id.documento}" />
							</p:column>

							<p:column style="font-size:10px;"
								sortBy="#{preinscrito.investigador.nombre1}">
								<f:facet name="header">
									<h:outputText value="NOMBRES" />
								</f:facet>

								<h:outputText
									value="#{preinscrito.investigador.nombre1} #{preinscrito.investigador.nombre2}" />
							</p:column>

							<p:column style="font-size:10px;"
								sortBy="#{preinscrito.investigador.apellido1}">
								<f:facet name="header">
									<h:outputText value="APELLIDOS" />
								</f:facet>

								<h:outputText
									value="#{preinscrito.investigador.apellido1} #{preinscrito.investigador.apellido2}" />
							</p:column>

							<p:column style="font-size:10px;"
								sortBy="#{preinscrito.investigador.email}">
								<f:facet name="header">
									<h:outputText value="CORREO" />
								</f:facet>

								<h:outputText value="#{preinscrito.investigador.email}" />
							</p:column>


						</p:dataTable>

						<br />

					</h:panelGrid>

					<!-- 	Panel Informacion Detallada -->

					<p:tabView
						rendered="#{ManejadorListaInscritosEspirituInnovador.estudianteSeleccionado != null}">

						<p:tab title="Información General">

							<t:div styleClass="contenido-titulo-general-myriad-2">Información del postulante</t:div>
							<br />

							<h:panelGrid columns="2" cellspacing="6"
								style="vertical-align: top;">

								<h:outputText value="Primer nombre " style="font-weight: bold;" />
								<h:outputText
									value="#{ManejadorListaInscritosEspirituInnovador.estudianteSeleccionado.investigador.nombre1}" />

								<h:outputText value="Segundo nombre " style="font-weight: bold;" />
								<h:outputText
									value="#{ManejadorListaInscritosEspirituInnovador.estudianteSeleccionado.investigador.nombre2}" />

								<h:outputText value="Primer apellido "
									style="font-weight: bold;" />
								<h:outputText
									value="#{ManejadorListaInscritosEspirituInnovador.estudianteSeleccionado.investigador.apellido1}" />

								<h:outputText value="Segundo apellido "
									style="font-weight: bold;" />
								<h:outputText
									value="#{ManejadorListaInscritosEspirituInnovador.estudianteSeleccionado.investigador.apellido2}" />

								<h:outputText value="Correo electrónico "
									style="font-weight: bold;" />
								<h:outputText
									value="#{ManejadorListaInscritosEspirituInnovador.estudianteSeleccionado.investigador.email}" />

								<h:outputText value="Teléfono de contacto "
									style="font-weight: bold;" />
								<h:outputText
									value="#{ManejadorListaInscritosEspirituInnovador.estudianteSeleccionado.investigador.telefono}" />

								<h:outputText value="Postulación propia"
									style="font-weight: bold;" />
								<h:outputText
									value="#{ManejadorListaInscritosEspirituInnovador.strPostulacionPropia}" />

								<h:outputText value="Dependencia" style="font-weight: bold;"
									rendered="#{ManejadorListaInscritosEspirituInnovador.esPostulacionPropia}" />
								<h:outputText
									value="#{ManejadorListaInscritosEspirituInnovador.facultadPostulante}"
									rendered="#{ManejadorListaInscritosEspirituInnovador.esPostulacionPropia}" />

								<h:outputText value="Sede" style="font-weight: bold;"
									rendered="#{ManejadorListaInscritosEspirituInnovador.esPostulacionPropia}" />
								<h:outputText
									value="#{ManejadorListaInscritosEspirituInnovador.sedePostulante}"
									rendered="#{ManejadorListaInscritosEspirituInnovador.esPostulacionPropia}" />

								<h:outputText value="Rol" style="font-weight: bold;"
									rendered="#{ManejadorListaInscritosEspirituInnovador.esPostulacionPropia}" />
								<h:outputText
									value="#{ManejadorListaInscritosEspirituInnovador.estudianteSeleccionado.profesion}"
									rendered="#{ManejadorListaInscritosEspirituInnovador.esPostulacionPropia}" />

							</h:panelGrid>

							<t:div styleClass="contenido-titulo-general-myriad-2">Información del participante</t:div>


							<br />

							<h:panelGrid columns="2" cellspacing="6"
								style="vertical-align: top;"
								rendered="#{!ManejadorListaInscritosEspirituInnovador.esPostulacionPropia}">

								<h:outputText value="Nombres " style="font-weight: bold;" />
								<h:outputText
									value="#{ManejadorListaInscritosEspirituInnovador.primer_nombre_par}" />

								<h:outputText value="Apellidos " style="font-weight: bold;" />
								<h:outputText
									value="#{ManejadorListaInscritosEspirituInnovador.primer_apellido_par}" />

								<h:outputText value="Correo electrónico "
									style="font-weight: bold;" />
								<h:outputText
									value="#{ManejadorListaInscritosEspirituInnovador.estudianteSeleccionado.correo_empresa}" />

								<h:outputText value="Teléfono de contacto "
									style="font-weight: bold;" />
								<h:outputText
									value="#{ManejadorListaInscritosEspirituInnovador.estudianteSeleccionado.tel_contacto}" />

								<h:outputText value="Dependencia" style="font-weight: bold;" />
								<h:outputText
									value="#{ManejadorListaInscritosEspirituInnovador.dependencia_par}" />

								<h:outputText value="Sede" style="font-weight: bold;"/>
								<h:outputText
									value="#{ManejadorListaInscritosEspirituInnovador.sede_par}" />

								<h:outputText value="Rol" style="font-weight: bold;" />
								<h:outputText
									value="#{ManejadorListaInscritosEspirituInnovador.estudianteSeleccionado.ocupacion}"/>

							</h:panelGrid>

							<t:div styleClass="contenido-titulo-general-myriad-2">Información de las actividades</t:div>
							<br />

							<h:panelGrid columns="2" style="width: 625px;">

								<p:column>

									<h:panelGrid columns="1" cellspacing="6"
										style="vertical-align: top;">

										<h:outputText
											value="1. ¿Qué actividades innovadoras ha realizado? "
											style="font-weight: bold;" />
										<h:outputText
											value="#{ManejadorListaInscritosEspirituInnovador.estudianteSeleccionado.nombreProblema}" />

										<h:outputText
											value="2. ¿Cuál ha sido la motivación para emprender dichas actividades? "
											style="font-weight: bold;" />
										<h:outputText
											value="#{ManejadorListaInscritosEspirituInnovador.estudianteSeleccionado.comunidadObjetivoProblema}" />

										<h:outputText
											value="3. De las actividades innovadoras mencionadas en el numeral 1, describa en detalle la que ha tenido mayor impacto. "
											style="font-weight: bold;" />
										<h:outputText
											value="#{ManejadorListaInscritosEspirituInnovador.estudianteSeleccionado.descripcionProblema}" />

									</h:panelGrid>

								</p:column>


							</h:panelGrid>
						</p:tab>

						<p:tab title="Adjuntos">

							<h:panelGrid columns="1" style="width: 625px;">

								<t:div styleClass="contenido-titulo-general-myriad-2">Documentos Adjuntos</t:div>
								<br />
								<p:dataTable id="tablaArchivosAdjuntos"
									value="#{ManejadorListaInscritosEspirituInnovador.listaArchivosAdjuntos}"
									var="archivo" cellpadding="6" cellspacing="3"
									emptyMessage="No se encuentran archivos adjuntos">

									<p:column>
										<f:facet name="header">
											<h:outputText value="ARCHIVO" />
										</f:facet>

										<h:outputText value="#{archivo.nombreArchivo}" />
									</p:column>

									<p:column>
										<f:facet name="header">
											<h:outputText value="Descargar" />
										</f:facet>

										<center>
											<p:commandButton ajax="false"
												icon="ui-icon-arrowthickstop-1-s"
												action="#{ManejadorListaInscritosEspirituInnovador.descargarArchivo}">
												<f:setPropertyActionListener value="#{archivo}"
													target="#{ManejadorListaInscritosEspirituInnovador.archivoSeleccionado}" />
											</p:commandButton>
										</center>

									</p:column>

								</p:dataTable>

								<br />

							</h:panelGrid>

						</p:tab>

					</p:tabView>

				</t:div>

			</t:div>

		</h:form>

	</ui:define>

</ui:composition>
