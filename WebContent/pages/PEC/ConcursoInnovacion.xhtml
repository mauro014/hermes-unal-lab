				<t:div styleClass="informacion">

							<t:div styleClass="informacion-subtitulo">
								<p>
									<b>¿TE CONSIDERAS INNOVADOR? POSTÚLATE A "RECONOCIMIENTOS AL ESPÍRITU INNOVADOR UN 2013" </b>
								</p>
							</t:div>
						</center>
						
						<t:div styleClass="informacion-subtexto">
							<h:outputText
								value="La Vicerrectoría de Investigación y la Dirección de Extensión Sede Bogotá, buscan el ESPÍRITU INNOVADOR UN - 2013, personas de la comunidad universitaria que con sus ideas, proyectos o iniciativas crean soluciones innovadoras a situaciones o problemas reales identificados en cualquier ámbito y que con ellos expresan creatividad, originalidad, experimentación, liderazgo, trabajo en equipo, motivación, perseverancia, dominio de un campo , entre otros elementos propios de la innovación, destacando el carácter innovador de los postulados." />
						</t:div>

						<br />

						<t:div styleClass="informacion-subtexto">
							<h:outputText
								value="Si te consideras portador del Espíritu innovador UN o conoces a alguien, inscríbete o inscríbelo en alguna de  las categorías  del concurso y cuéntanos la experiencia." />

						</t:div>

						<br />
						<t:div styleClass="informacion-subtexto">
