<?xml version='1.0' encoding='ISO-8859-1' ?>
<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:f="http://java.sun.com/jsf/core"

	xmlns:t="http://myfaces.apache.org/tomahawk"
	xmlns:s="http://myfaces.apache.org/sandbox"
	template="../../templates/her-plantillaBasica.xhtml">

	<ui:define name="title">CONCURSO INNOVACIÓN 2013</ui:define>

	<ui:define name="content">

		<img
			src="#{facesContext.externalContext.requestContextPath}/images/her-paginas/cabezote.png"
			style="padding-bottom: 10px;" />

		<t:div styleClass="contenido-informacion">

			<t:div styleClass="cabezote-informacion-pagina-buscador">
				<h:outputText
					value="Dirección de Extensión Bogotá - Vicerrectoría de Investigación" />
			</t:div>

			<t:div styleClass="contenedor-informacion">

				<br />

				<t:div styleClass="contenido-titulo-general-myriad">Capacitaciones en Propiedad Intelectual</t:div>
				<br />

				<center>

					<p:imageSwitch effect="fade" speed="1500" slideshowSpeed="6000">
						<img
							src="#{facesContext.externalContext.requestContextPath}/images/concursoInnovacionVRI-DEB/cap1.PNG" />
						<img
							src="#{facesContext.externalContext.requestContextPath}/images/concursoInnovacionVRI-DEB/cap2.PNG" />
						<img
							src="#{facesContext.externalContext.requestContextPath}/images/concursoInnovacionVRI-DEB/cap3.PNG" />
					</p:imageSwitch>

				</center>

				<br />

				<t:div styleClass="informacion">

					<t:div styleClass="informacion-texto">

						<t:div styleClass="informacion-subtitulo">
							<center>
								<p>
									<b>AVANZA LA JORNADA DE CAPACITACIÓN EN PROPIEDAD
										INTELECTUAL </b>
								</p>
							</center>

						</t:div>

						<br />

						<t:div styleClass="informacion-subtexto">
							<h:outputText
								value="En el marco del objetivo uno del proyecto Fomento de una Cultura de la Innovación en la Universidad Nacional de Colombia Sede Bogotá, relacionado con incentivar la generación de propuestas de innovación, se viene desarrollando desde el pasado 18 de octubre, la Jornada de Capacitación en Propiedad Intelectual, en coordinación con el Aula de propiedad Intelectual de la Superintendencia de Industria y Comercio, con una gran acogida por parte de la comunidad universitaria." />
						</t:div>

						<br />

						<t:div styleClass="informacion-subtexto">
							<h:outputText
								value="Los cursos, en los que se inscribieron un total de 123 personas, están compuestos de cuatro sesiones fundamentales impartidas una vez a la semana, de acuerdo al grupo disciplinar, y contemplan las siguientes temáticas: Introducción, conceptos básicos en Propiedad Intelectual, aspectos claves para solicitar una patente y sus procedimientos, procesos y conceptos propios de derechos de autor y derechos conexos, concepto de marca, y los aspectos claves para procesar su solicitud." />
						</t:div>

						<br />

					</t:div>

				</t:div>

				<br />
			</t:div>

			<t:div styleClass="final-contenedor-informacion" />
		</t:div>
		<t:div styleClass="contenido-menu">
			<t:div styleClass="menu-superior">
				<t:div styleClass="cabezote-derecho-menu">
					<h:outputText value="UNINNOVA" />
				</t:div>
				<t:div styleClass="menu-grande1">

					<ul>
						<li><h:form>
								<h:outputLink
									value="#{facesContext.externalContext.requestContextPath}/pages/PEC/PrincipalUninnova.xhtml"
									onclick="submit()">
									<h:outputText value="UNINNOVA" />
								</h:outputLink>
							</h:form></li>

						<li><h:form>
								<h:outputLink
									value="#{facesContext.externalContext.requestContextPath}/pages/PEC/ConvocatoriaFomentoInnovacion.xhtml"
									onclick="submit()">
									<h:outputText value="Convocatoria Cultura de la Innovación" />
								</h:outputLink>
							</h:form></li>

						<li><h:form>
								<h:outputLink
									value="#{facesContext.externalContext.requestContextPath}/pages/PEC/CapacitacionesPropiedadIntelectual.xhtml"

								</h:outputLink>
							</h:form></li>

						<li><h:form>
								<h:outputLink
									value="#{facesContext.externalContext.requestContextPath}/pages/PEC/ConcursoInnovacion.xhtml"
									onclick="submit()">
									<h:outputText value="Espíritu Innovador" />
								</h:outputLink>
							</h:form></li>

						<li><h:form>
								<h:outputLink
									value="#{facesContext.externalContext.requestContextPath}/pages/PEC/ProgramacionMesInnovacion.xhtml"
									onclick="submit()">
									<h:outputText value="Programación Mes de la Innovación" />
								</h:outputLink>
							</h:form></li>

						<li><h:form>
								<h:outputLink
									value="#{facesContext.externalContext.requestContextPath}/pages/principal/Principal.xhtml"
									onclick="submit()">
									<h:outputText value="Salir" />
								</h:outputLink>
							</h:form></li>
					</ul>

				</t:div>
			</t:div>
		</t:div>

	</ui:define>

</ui:composition>
