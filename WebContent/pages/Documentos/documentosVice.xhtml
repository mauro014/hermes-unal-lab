<?xml version='1.0' encoding='ISO-8859-1' ?>
<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:t="http://myfaces.apache.org/tomahawk"
	xmlns:s="http://myfaces.apache.org/sandbox"
	template="../../templates/common.xhtml">
	<ui:define name="content">
		<h:form>
			<t:div styleClass="contenido-titulo-general-myriad" >Documentos Vicerrectoría</t:div>
			<p:tree value="#{manejadorDocumentosVice.root}" var="node" id="tree" style="width: 100%;" dynamic="true">  
		        <p:treeNode id="treeNode" expandedIcon="ui-icon-folder-open"  
                    collapsedIcon="ui-icon-folder-collapsed">  
		            <h:outputText value="#{node.nombre}"/>  
		        </p:treeNode>  
		        <p:treeNode type="document" icon="ui-icon ui-icon-document">
					<h:commandLink value="#{node.nombre}"
								action="#{manejadorDocumentosVice.descargarDocumentoEvento}" target="_blank">
						<f:setPropertyActionListener value="#{node}" target="#{manejadorDocumentosVice.documentoSeleccionado}" />
					</h:commandLink>
				</p:treeNode>
		    </p:tree> 
		</h:form>
	</ui:define>
</ui:composition>
