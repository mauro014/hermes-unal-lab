<?xml version='1.0' encoding='ISO-8859-1' ?>
<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:c="http://java.sun.com/jsp/jstl/core"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:t="http://myfaces.apache.org/tomahawk"
	xmlns:s="http://myfaces.apache.org/sandbox"
	template="../../templates/common.xhtml">

	<ui:define name="content">
		<script type="text/javascript">
		if (window.addEventListener) {
			  window.addEventListener('pageshow', function(event) {
			    if (event.persisted) {
			      // Eliminar caché de la página
			      window.location.reload(); 
			    }
			  }, false);
			}
		</script>
		<h:form id="form" styleClass="estilo-panelgrid-sinbordes">
			<t:div styleClass="contenido-titulo-general-myriad">Criticidad de equipos de laboratorio</t:div>

			<p:panel>
				<center>
					<p:panelGrid columns="4" style="width:100%;">
						<h:outputText value="Laboratorio/Sede" styleClass="negrilla" />
						<h:outputText
							value="#{manejadorCriticidadEquipos.equipo.laboratorio.nombre} / #{manejadorCriticidadEquipos.equipo.laboratorio.sede.nombre}" />

						<h:outputText value="Placa" styleClass="negrilla" />
						<h:outputText value="#{manejadorCriticidadEquipos.equipo.placa}" />

						<h:outputText value="Equipo" styleClass="negrilla" />
						<h:outputText value="#{manejadorCriticidadEquipos.equipo.equipo}" />

						<h:outputText value="Marca" styleClass="negrilla" />
						<h:outputText value="#{manejadorCriticidadEquipos.equipo.marca}" />

						<h:outputText value="Modelo" styleClass="negrilla" />
						<h:outputText value="#{manejadorCriticidadEquipos.equipo.modelo}" />

						<h:outputText value="Serial" styleClass="negrilla" />
						<h:outputText value="#{manejadorCriticidadEquipos.equipo.serial}" />
					</p:panelGrid>
				</center>
			</p:panel>
			<p:spacer height="10" />
			<p:panel>
				<p:panelGrid style="width:100%;font-size:16px !important">
					<p:row>
						<p:column style="width:10%;text-align:center">
							<h:outputText value="Impacto" styleClass="negrilla" />
						</p:column>
						<p:column style="width:15%;text-align:center">
							<h:outputText value="#{manejadorCriticidadEquipos.equipo.critEquiposValorImpacto}" />
						</p:column>
						<p:column style="width:10%;text-align:center">
							<h:outputText value="Probabilidad" styleClass="negrilla" />
						</p:column>
						<p:column style="width:15%;text-align:center">
							<h:outputText value="#{manejadorCriticidadEquipos.equipo.critEquiposValorProbabilidad}" />
						</p:column>
						<p:column style="width:15%;text-align:center">
							<h:outputText value="|" />
						</p:column>
						<p:column style="width:15%;text-align:center">
							<h:outputText value="Riesgo" styleClass="negrilla" />
						</p:column>
						<p:column style="width:20%;text-align:center;#{manejadorCriticidadEquipos.colorValorRiesgo}">
							<t:div>
								<h:outputText value="#{manejadorCriticidadEquipos.equipo.critEquiposValorRiesgo}" styleClass="negrilla"/>
							</t:div>	
						</p:column>
					</p:row>
				</p:panelGrid>
			</p:panel>
			<p:spacer height="10" />
			<p:panel>
<!-- 				<p:messages id="messagesUp" autoUpdate="true" closable="true" redisplay="false" /> -->
				<t:div styleClass="contenido-titulo-general-ancizar-left">Items de impacto</t:div>
				<p:spacer height="15" />
				<br />
				
				<p:panelGrid columns="1">
					<h:outputText value="Operaciones del laboratorio" styleClass="negrilla" />
					<p:selectOneRadio id="critEquiposImpactoOperaLab" value="#{manejadorCriticidadEquipos.equipo.critEquiposImpactoOperaLab}" layout="pageDirection" converter="ConvertidorTipos">
					    <f:selectItems value="#{manejadorCriticidadEquipos.listaImpactoOperaLab}" />
					</p:selectOneRadio>
					<br />
					<h:outputText value="Seguridad para los usuarios del equipo" styleClass="negrilla" />
					<p:selectOneRadio id="critEquiposImpactoSegUsuarios" value="#{manejadorCriticidadEquipos.equipo.critEquiposImpactoSegUsuarios}" layout="pageDirection" converter="ConvertidorTipos">
					    <f:selectItems value="#{manejadorCriticidadEquipos.listaImpactoSegUsuarios}" />
					</p:selectOneRadio>
					<br />
					<h:outputText value="Daños a la Infraestructura física" styleClass="negrilla" />
					<p:selectOneRadio id="critEquiposImpactoDaniosInfra" value="#{manejadorCriticidadEquipos.equipo.critEquiposImpactoDaniosInfra}" layout="pageDirection" converter="ConvertidorTipos">
					    <f:selectItems value="#{manejadorCriticidadEquipos.listaImpactoDaniosInfra}" />
					</p:selectOneRadio>
					<br />
					<h:outputText value="Daños al Medioambiente" styleClass="negrilla" />
					<p:selectOneRadio id="critEquiposImpactoDaniosAmbient" value="#{manejadorCriticidadEquipos.equipo.critEquiposImpactoDaniosAmbient}" layout="pageDirection" converter="ConvertidorTipos">
					    <f:selectItems value="#{manejadorCriticidadEquipos.listaImpactoDaniosAmbient}" />
					</p:selectOneRadio>
					<br />
					<h:outputText value="Imagen de la Universidad" styleClass="negrilla" />
					<p:selectOneRadio id="critEquiposImpactoImagenUN" value="#{manejadorCriticidadEquipos.equipo.critEquiposImpactoImagenUN}" layout="pageDirection" converter="ConvertidorTipos">
					    <f:selectItems value="#{manejadorCriticidadEquipos.listaImpactoImagenUN}" />
					</p:selectOneRadio>
					<br />
					<h:outputText value="Quejas y/o Sanciones	 Económicos" styleClass="negrilla" />
					<p:selectOneRadio id="critEquiposImpactoQuejas" value="#{manejadorCriticidadEquipos.equipo.critEquiposImpactoQuejas}" layout="pageDirection" converter="ConvertidorTipos">
					    <f:selectItems value="#{manejadorCriticidadEquipos.listaImpactoQuejas}" />
					</p:selectOneRadio>
					<br />
					<h:outputText value="Impactos Económicos" styleClass="negrilla" />
					<p:selectOneRadio id="critEquiposImpactoEconomicos" value="#{manejadorCriticidadEquipos.equipo.critEquiposImpactoEconomicos}" layout="pageDirection" converter="ConvertidorTipos">
					    <f:selectItems value="#{manejadorCriticidadEquipos.listaImpactoEconomicos}" />
					</p:selectOneRadio>
				</p:panelGrid>
				
				<p:spacer height="15" />
				<t:div styleClass="contenido-titulo-general-ancizar-left">Items de probabilidad</t:div>
				<p:spacer height="15" />
				
				<p:panelGrid columns="1">
					<h:outputText value="Reportes de fallas / mal funcionamiento del equipo" styleClass="negrilla" />
					<p:selectOneRadio value="#{manejadorCriticidadEquipos.equipo.critEquiposProbRepFalla}" layout="pageDirection" converter="ConvertidorTipos">
					    <f:selectItems value="#{manejadorCriticidadEquipos.listaProbRepFalla}" />
					</p:selectOneRadio>
					<br />
					<h:outputText value="Tiempo de trabajo del equipo y sobreesfuerzos" styleClass="negrilla" />
					<p:selectOneRadio value="#{manejadorCriticidadEquipos.equipo.critEquiposProbTiempoTrabajo}" layout="pageDirection" converter="ConvertidorTipos">
					    <f:selectItems value="#{manejadorCriticidadEquipos.listaProbTiempoTrabajo}" />
					</p:selectOneRadio>
					<br />
					<h:outputText value="Condiciones ambientales donde se encuentra ubicado el equipo" styleClass="negrilla" />
					<p:selectOneRadio value="#{manejadorCriticidadEquipos.equipo.critEquiposProbCondAmbient}" layout="pageDirection" converter="ConvertidorTipos">
					    <f:selectItems value="#{manejadorCriticidadEquipos.listaProbCondAmbient}" />
					</p:selectOneRadio>
					<br />
					<h:outputText value="Mantenimiento y confirmación metrológica del equipo" styleClass="negrilla" />
					<p:selectOneRadio value="#{manejadorCriticidadEquipos.equipo.critEquiposProbMetrologia}" layout="pageDirection" converter="ConvertidorTipos">
					    <f:selectItems value="#{manejadorCriticidadEquipos.listaProbMetrologia}" />
					</p:selectOneRadio>
				</p:panelGrid>
			</p:panel>
			<p:spacer height="10" />
			<p:panel>
				<p:panelGrid style="width:100%;font-size:16px !important">
					<p:row>
						<p:column style="width:10%;text-align:center">
							<h:outputText value="Impacto" styleClass="negrilla" />
						</p:column>
						<p:column style="width:15%;text-align:center">
							<h:outputText value="#{manejadorCriticidadEquipos.equipo.critEquiposValorImpacto}" />
						</p:column>
						<p:column style="width:10%;text-align:center">
							<h:outputText value="Probabilidad" styleClass="negrilla" />
						</p:column>
						<p:column style="width:15%;text-align:center">
							<h:outputText value="#{manejadorCriticidadEquipos.equipo.critEquiposValorProbabilidad}" />
						</p:column>
						<p:column style="width:15%;text-align:center">
							<h:outputText value="|" />
						</p:column>
						<p:column style="width:15%;text-align:center">
							<h:outputText value="Riesgo" styleClass="negrilla" />
						</p:column>
						<p:column style="width:20%;text-align:center;#{manejadorCriticidadEquipos.colorValorRiesgo}">
							<t:div>
								<h:outputText value="#{manejadorCriticidadEquipos.equipo.critEquiposValorRiesgo}" styleClass="negrilla"/>
							</t:div>	
						</p:column>
					</p:row>
				</p:panelGrid>
			</p:panel>
			<p:spacer height="10" />		
			<p:messages id="messages" autoUpdate="true" closable="true" redisplay="false" />
			<p:spacer height="10" />
			<center>
				<p:panelGrid columns="2">
					<p:commandButton value="Volver al Laboratorio"
						icon="ui-icon-arrowreturnthick-1-w" ajax="false"
						action="#{manejadorCriticidadEquipos.volverLaboratorio}"
						onclick="if(!confirm('Está seguro de regresar a la página del Laboratorio?'))return false" />
					<p:commandButton value="Guardar" icon="ui-icon-disk"
						update="@form"
						action="#{manejadorCriticidadEquipos.guardarEquipo}"
						onclick="if(!confirm('Está seguro de guardar los cambios?'))return false" />
				</p:panelGrid>
			</center>

		</h:form>

		<p:dialog widgetVar="dialogEspere" resizable="false" closable="false" modal="true">
			<p:graphicImage value="/images/ajaxloading.gif" />
			Por favor espere...
		</p:dialog>

	</ui:define>
</ui:composition>
