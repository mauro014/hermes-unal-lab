<?xml version='1.0' encoding='ISO-8859-1' ?>
<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:t="http://myfaces.apache.org/tomahawk"
	xmlns:s="http://myfaces.apache.org/sandbox"
	template="../../templates/common.xhtml">

	<ui:define name="content">
		<h:form id="form" styleClass="estilo-panelgrid-sinbordes">
			<t:div styleClass="contenido-titulo-general-myriad">Solicitud SNL</t:div>

			<p:panel>

				<p:panel header="Solicitante">
					<p:panelGrid columns="3">
						<t:div style="width:110px;">
							<h:outputText value="Nombre" styleClass="negrilla" />
						</t:div>
						<h:outputText
							value="#{manejadorSolicitudSNL.solicitudSeleccionada.persona.nombreCompleto}" />
						<h:outputText value="" />

						<h:outputText value="e-mail" styleClass="negrilla" />
						<h:outputText
							value="#{manejadorSolicitudSNL.solicitudSeleccionada.persona.email}" />
						<h:outputText value="" />

						<h:outputText value="Teléfono" styleClass="negrilla" />
						<h:outputText
							value="#{manejadorSolicitudSNL.solicitudSeleccionada.persona.telefono}" />
						<h:outputText value="" />

						<h:outputText value="Empresa/Cargo" styleClass="negrilla" />
						<h:outputText
							value="#{manejadorSolicitudSNL.solicitudSeleccionada.cargoSolicitante}" />
						<h:outputText value="" />

						<h:outputText value="Sede" styleClass="negrilla"
							rendered="#{manejadorSolicitudSNL.solicitanteInterno}" />
						<h:outputText
							value="#{manejadorSolicitudSNL.solicitudSeleccionada.persona.dependencia.sede.nombre}"
							rendered="#{manejadorSolicitudSNL.solicitanteInterno}" />
						<h:outputText value="" />

						<h:outputText value="Dependencia" styleClass="negrilla"
							rendered="#{manejadorSolicitudSNL.solicitanteInterno}" />
						<h:outputText
							value="#{manejadorSolicitudSNL.solicitudSeleccionada.persona.dependencia.nombre}"
							rendered="#{manejadorSolicitudSNL.solicitanteInterno}" />
						<h:outputText value="" />

						<h:outputText value="Laboratorio" styleClass="negrilla"
							rendered="#{manejadorSolicitudSNL.solicitudSeleccionada.laboratorioSolicitante ne null}" />
						<h:outputText
							value="#{manejadorSolicitudSNL.solicitudSeleccionada.laboratorioSolicitante.nombre}"
							rendered="#{manejadorSolicitudSNL.solicitudSeleccionada.laboratorioSolicitante ne null}" />
						<h:outputText value=""
							rendered="#{manejadorSolicitudSNL.solicitudSeleccionada.laboratorioSolicitante ne null}" />

						<h:outputText value="Extensión" styleClass="negrilla"
							rendered="#{manejadorSolicitudSNL.solicitanteInterno}" />
						<h:outputText
							value="#{manejadorSolicitudSNL.solicitudSeleccionada.persona.telExtension}"
							rendered="#{manejadorSolicitudSNL.solicitanteInterno}" />
						<h:outputText value="" />

					</p:panelGrid>
				</p:panel>

				<p:spacer height="15" />

				<p:panel header="Solicitud">

					<p:panelGrid columns="2">

						<h:outputText value="Id" styleClass="negrilla" />
						<h:outputText
							value="#{manejadorSolicitudSNL.solicitudSeleccionada.id}" />

						<h:outputText value="Fecha" styleClass="negrilla" />
						<h:outputText
							value="#{manejadorSolicitudSNL.solicitudSeleccionada.fecha}" />

						<h:outputText value="Estado" styleClass="negrilla" />
						<h:outputText
							value="#{manejadorSolicitudSNL.solicitudSeleccionada.estadoSolicitud.nombre}" />

						<t:div style="width:110px;">
							<h:outputText value="Tipo" styleClass="negrilla" />
						</t:div>
						<h:outputText
							value="#{manejadorSolicitudSNL.solicitudSeleccionada.tipoSolicitud.nombre}" />

						<h:outputText value="Dirigida a" styleClass="negrilla" />
						<h:outputText
							value="#{manejadorSolicitudSNL.solicitudSeleccionada.dirigidaA.nombre}" />

						<h:outputText value="Justificación" styleClass="negrilla" />
						<p:inputTextarea id="itJust" rows="7" cols="65" autoResize="false"
							maxlength="4000" counterTemplate="{0} caracteres restantes"
							readonly="true"
							value="#{manejadorSolicitudSNL.solicitudSeleccionada.justificacion}" />

						<p:outputLabel value="Observaciones" for="itObservaciones"
							styleClass="negrilla" />
						<p:inputTextarea id="itObservaciones" rows="7" cols="65"
							autoResize="false" maxlength="4000"
							counter="counterObservaciones"
							counterTemplate="{0} caracteres restantes"
							readonly="#{manejadorSolicitudSNL.soloLectura}"
							value="#{manejadorSolicitudSNL.solicitudSeleccionada.observaciones}" />
						<h:outputText rendered="#{not manejadorSolicitudSNL.soloLectura}" />
						<h:outputText rendered="#{not manejadorSolicitudSNL.soloLectura}"
							id="counterObservaciones" styleClass="pequennio" />

						<h:outputText value="Fecha respuesta" styleClass="negrilla"
							rendered="#{manejadorSolicitudSNL.solicitudSeleccionada.esFinalizada}" />
						<h:outputText
							value="#{manejadorSolicitudSNL.solicitudSeleccionada.fechaRespuesta}"
							rendered="#{manejadorSolicitudSNL.solicitudSeleccionada.esFinalizada}" />

					</p:panelGrid>

				</p:panel>
			</p:panel>

			<p:spacer height="15" />

			<p:messages id="messages" autoUpdate="true" closable="true"
				showDetail="true" showSummary="false" redisplay="false" />

			<center>
				<p:commandButton value="Guardar" icon="ui-icon-disk"
					rendered="#{not manejadorSolicitudSNL.soloLectura}" update="@form"
					onclick="if(!confirm('Está seguro de guardar? Por favor confirme las observaciones diligenciadas.  La solicitud se considerará finalizada y no podrá editarse.  No olvide incluir, en caso de ser necesario, los datos de contacto.'))return false"
					action="#{manejadorSolicitudSNL.responderSolicitud}" />
				<p:commandButton value="Atrás" icon="ui-icon-arrowthick-1-w"
					update="@form" title="Volver al listado de Solicitudes"
					action="#{manejadorSolicitudSNL.volverListado}" />
			</center>

		</h:form>
	</ui:define>
</ui:composition>
