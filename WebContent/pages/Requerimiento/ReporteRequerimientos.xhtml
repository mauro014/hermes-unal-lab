<?xml version='1.0' encoding='ISO-8859-1' ?>
<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:t="http://myfaces.apache.org/tomahawk"
	xmlns:s="http://myfaces.apache.org/sandbox"
	template="../../templates/common.xhtml">

	<ui:define name="content">
		<h:form>
			<t:div styleClass="contenido-titulo-general-myriad">Generar Reportes</t:div>

			<p:growl id="growl2" showDetail="true" />
			<p:growl id="growl" showDetail="true" />
			<p:messages id="msgs" autoUpdate="true" closable="true" />
			
			<br />
			<center>
			<p:panel id="panel1" header="Reportes requerimientos / inconvenientes">
				<br /> 
				<h:outputText value="NOTA: Para la generación de los reportes seleccione el tipo de reporte, el rango del reporte (fecha inicial y fecha final) de los requerimientos/inconvenientes registrados y de clic sobre sobre el botón 'Generar reporte'. " />
				
				<br /> <br /> <br />
				<p:panelGrid styleClass="estilo-panelgrid-sinbordes" id="panelReporte" columns="2">
					<h:outputText value="Tipo de reporte:" />
					<p:selectOneMenu style="width:160px"
   							 value="#{ManejadorConsultarRequerimientoAdm.tipoReporte}"
   							 id="tipodoecv" >
   							 <f:selectItems value="#{ManejadorConsultarRequerimientoAdm.tipoReporteItem}" />
   					</p:selectOneMenu>
					
					<h:outputText value="Fecha inicial:" />
					<p:calendar id="fechaInicial" navigator="true"
									locale="es" readonlyInput="true"
									value="#{ManejadorConsultarRequerimientoAdm.fechaInicio}" />	
									
					<h:outputText value="Fecha final:" />
					<p:calendar id="fechaFinal" navigator="true"
									locale="es" readonlyInput="true"
									value="#{ManejadorConsultarRequerimientoAdm.fechaFinal}" />	
									
					<h:outputText value="" />
					<h:outputText value="" />
					
					<h:outputText value="" />
					<h:commandLink value="Generar reporte" id="generarReporte"
						 action="#{ManejadorConsultarRequerimientoAdm.imprimirReporte}" style="color: #16A8E2;"/>
				</p:panelGrid> 
				
				<br />
				<p:message id="error_reporte" for="generarReporte" />		
				
				
			<br />	
			</p:panel>	
			</center>
					
			<br />
			
			
			<p:dialog widgetVar="dialogEspere" resizable="false"
					closable="false" modal="true">
					<p:graphicImage value="/images/ajaxloading.gif" />
						Por favor espere...
			</p:dialog>

		</h:form>
	</ui:define>
</ui:composition>
