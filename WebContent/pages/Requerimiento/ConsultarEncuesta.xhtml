<?xml version='1.0' encoding='ISO-8859-1' ?>
<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:t="http://myfaces.apache.org/tomahawk"
	template="../../templates/common.xhtml">


	<ui:define name="content">
		<t:div styleClass="contenido-titulo-general-myriad">Encuesta servicio al usuario</t:div>

		<h:form id="content">

			<p:messages id="msgs" />

			<br> </br>

			<p:dataTable var="encuesta" id="tablaEncuesta"
				emptyMessage="No existen resultados de la encuesta"
				value="#{ManejadorConsultarEncuesta.listaResultadosEncuesta}"
				paginator="true" paginatorposition="bottom" rows="20">

				<f:facet name="header">  
	            	Resultados registrados
	        	</f:facet>

				<p:column >
						<f:facet name="header">
			                <h:outputText value="Número" />
			            </f:facet>
					<h:outputText value="#{encuesta.id}"/>
				</p:column>
				
				<p:column >
						<f:facet name="header">
			                <h:outputText value="Fecha" />
			            </f:facet>
					<h:outputText value="#{encuesta.fecha}"/>
				</p:column>
							
				<p:column >
					  	<f:facet name="header">
			                <h:outputText value="Atención recibida" />
			            </f:facet>
						<h:outputText value="#{encuesta.atencion}" />					
				</p:column>									
				
				<p:column >
						<f:facet name="header">
			                <h:outputText value="Tiempo esperado" />
			            </f:facet>
						<h:outputText value="#{encuesta.tiempo}" />
				</p:column>		

				<p:column >
						<f:facet name="header">
			                <h:outputText value="Solución adecuada" />
			            </f:facet>
					<h:outputText value="#{encuesta.solucion}" />
				</p:column>
				
				<p:column >
						<f:facet name="header">
			                <h:outputText value="Sede" />
			            </f:facet>
					<h:outputText value="#{encuesta.idSede.nombre}"/>
				</p:column>
				
				<p:column style="display:none">
						<f:facet name="header">
			                <h:outputText value="Proceso" />
			            </f:facet>
					<h:outputText value="#{encuesta.proceso}" />
				</p:column>
				
				<p:column style="display:none">
						<f:facet name="header">
			                <h:outputText value="Observaciones" />
			            </f:facet>
					<h:outputText value="#{encuesta.observaciones}" />
				</p:column>				
				

			<f:facet name="footer">  
	            	<h:outputText value="Se encontraron #{ManejadorConsultarEncuesta.numeroResultados} solicitudes" />
	        </f:facet>

			</p:dataTable>
			<br> </br>
			<center>
			 <h:commandLink value="Exportar a excel">
		        <p:dataExporter type="xls" target="tablaEncuesta" fileName="tablaEncuesta" pageOnly="false" />
		    </h:commandLink>
		    </center>
			<br> </br>
		

		</h:form>
	</ui:define>

</ui:composition>
