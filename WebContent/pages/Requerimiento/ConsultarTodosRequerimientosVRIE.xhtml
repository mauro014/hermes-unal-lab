<?xml version='1.0' encoding='ISO-8859-1' ?>
<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:t="http://myfaces.apache.org/tomahawk"
	template="../../templates/common.xhtml">


	<ui:define name="content">
		<t:div styleClass="contenido-titulo-general-myriad">Solicitudes VRIE</t:div>
 
		<h:form id="content">

			<p:messages id="msgs" />

			<br> </br>

			<p:dataTable var="requerimientoRegistrado"
				emptyMessage="No existen resultados de la Consulta"
				value="#{ManejadorConsultarRequerimientoVRIE.requerimientoListaCompleta}"
				paginator="true" paginatorposition="bottom" rows="20">

				<f:facet name="header">  
	            	Solicitudes registradas Vicerrectoría de Investigación y Extensión
	        		</f:facet>


				<p:column headerText="Número"
					style="text-align: center;">
					<h:outputText value="#{requerimientoRegistrado.id}"
						style="font-size: 12px;" />
				</p:column>
							

				<p:column headerText="Estado" filterBy="#{requerimientoRegistrado.estSelRequerimiento}" filterMatchMode="contains">					
						<h:outputText
							value="#{requerimientoRegistrado.estSelRequerimiento}"
							style="font-size: 12px;" />
				</p:column>

				<p:column headerText="Fecha de solicitud">
					<h:outputText value="#{requerimientoRegistrado.fechaSolicitud}"
						style="font-size: 12px;" />
				</p:column>


				<p:column headerText="Editar/Consultar" style="text-align: center;">
					<p:commandButton
						action="#{ManejadorConsultarRequerimientoVRIE.editarRequerimientoCoord}"
						icon="ui-icon-pencil" ajax="false">
						<f:setPropertyActionListener value="#{requerimientoRegistrado}"
							target="#{ManejadorConsultarRequerimientoVRIE.requerimientoSeleccionado}" />
					</p:commandButton>
					<p:commandButton action="#{ManejadorConsultarRequerimientoVRIE.consultarRequerimientoCoord}"
						icon="ui-icon-search" rendered="true" title="Consultar">
						<f:setPropertyActionListener value="#{requerimientoRegistrado}"
							target="#{ManejadorConsultarRequerimientoVRIE.requerimientoSeleccionado}" />
					</p:commandButton>
				</p:column>


			</p:dataTable>

			<br> </br>
			<br> </br>




		</h:form>
	</ui:define>

</ui:composition>
