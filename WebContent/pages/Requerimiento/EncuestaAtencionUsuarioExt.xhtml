<?xml version='1.0' encoding='ISO-8859-1' ?>
<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:t="http://myfaces.apache.org/tomahawk"
	xmlns:s="http://myfaces.apache.org/sandbox"
	template="../principal/PlantillaExternaEncuesta.xhtml">
	<ui:define name="content">
		<h:form>
		
		<t:div id="panelTitulo" style="text-align: center; width: 100%;">
			<h:panelGrid columns="1" styleClass="estilo-panelgrid-sinbordes1"
				style="width: 100%;"	>	
				<t:div styleClass="contendido-titulo-principal" style="margin-bottom: 30px;">			
					<t:div style="text-align: center;" styleClass="contenido-titulo-general-myriad-3">
						Calificación del servicio prestado
				    </t:div>
				   
			    </t:div>	
			</h:panelGrid>
		</t:div>
			
		<p:panel style="width:750px; margin:auto; margin-bottom:15px;" header="Sistema de Información Hermes"
				id="requerimiento">

				<br/><br/>
				<h:outputText value="Es importante para nosotros verificar la calidad de nuestro servicio de atención del sistema de Información Hermes, por lo tanto si considera puede diligenciar estas preguntas sobre la calificación al servicio prestado." />

			<br/><br/>
			<br/><br/>
				<p:panelGrid columns="2" styleClass="estilo-panelgrid-sinbordes"
					id="panelReq">
					
					<h:outputText value="" />
					<h:outputText value="" />
					
					<h:outputText value="1. Sede a la que pertenece:"  styleClass="negrilla"/>
					<p:selectOneMenu value="#{ManejadorEncuestaUsuarios.encuesta.idSede.id}"
						style="width: 110px;" id="idSed">
						<f:selectItems value="#{ManejadorEncuestaUsuarios.sedesItems}" />
					</p:selectOneMenu>
					
					<p:spacer width="20" height="20" />
					<p:spacer width="20" height="20" />
					
					<h:outputText value="2. ¿Cómo ha sido la atención recibida a su solicitud?" 
						 styleClass="negrilla" />
					<p:selectOneMenu
						value="#{ManejadorEncuestaUsuarios.encuesta.atencion}"
						id="atencion" style="width:110px">
						<f:selectItems
							value="#{ManejadorEncuestaUsuarios.atencionItems}" />
					</p:selectOneMenu>	
					
					<p:spacer width="20" height="20" />
					<p:spacer width="20" height="20" />

					<h:outputText value="3. ¿El tiempo de respuesta fue el esperado? " 
						styleClass="negrilla" />
					<p:selectOneMenu
						value="#{ManejadorEncuestaUsuarios.encuesta.tiempo}"
						id="tiempo" style="width:60px">
						<f:selectItems
							value="#{ManejadorEncuestaUsuarios.moduloItems}" />
					</p:selectOneMenu>						
										
				</p:panelGrid>
				
				<br/><br/>
				<center>
					<p:commandButton value="Enviar" 
					action="#{ManejadorEncuestaUsuarios.guardar}" update="msgs"
					icon="ui-icon-disk" onstart="dialogEspere.show()" oncomplete="dialogEspere.hide()"/>
				</center>
				
				<p:messages id="msgs" />
					
				<br/><br/>
				
				
				<h:outputText value="NOTA: para reclamos o sugerencias acerca de la atención recibida, escríbanos al correo hermes@unal.edu.co ó realice su observación ingresando al sistema de Información Hermes en la opción 'mejoras'." />
				
				<br/><br/>
				
		</p:panel>
		
			 <p:dialog widgetVar="dialogEspere" resizable="false"
						closable="false" modal="true">
						<p:graphicImage value="/images/ajaxloading.gif" />
							Por favor espere...
			</p:dialog>
			
		</h:form>
		
	</ui:define>
</ui:composition>
