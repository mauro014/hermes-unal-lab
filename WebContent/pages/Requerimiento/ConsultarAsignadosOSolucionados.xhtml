<?xml version='1.0' encoding='ISO-8859-1' ?>
<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:t="http://myfaces.apache.org/tomahawk"
	template="../../templates/common.xhtml">


	<ui:define name="content">
		<t:div styleClass="contenido-titulo-general-myriad">Solicitudes asignadas o atendidas</t:div>

		<h:form id="content">

			<p:messages id="msgs" />

			<br> </br>

			<p:dataTable var="requerimientoAsignadoOsolucionado"
				widgetVar="reqmsTable"
				emptyMessage="No existen resultados de la Consulta"
				value="#{ManejadorConsultarRequerimientoAdm.listaAsignadosYSolucionados}"
				paginator="true" paginatorposition="bottom" rows="20">

				<f:facet name="header">  
	            	Solicitudes asignadas o atendidas
	        		</f:facet>


				<p:column headerText="Número" style="text-align: center;"
					sortBy="#{requerimientoAsignadoOsolucionado.id}"
					filterBy="#{requerimientoAsignadoOsolucionado.id}"
					filterStyle="width: 50px;">
					<h:outputText value="#{requerimientoAsignadoOsolucionado.id}" />
				</p:column>

				<p:column headerText="Prioridad"
					sortBy="#{requerimientoAsignadoOsolucionado.prioridad}"
					filterBy="#{requerimientoAsignadoOsolucionado.prioridad}"
					filterOptions="#{ManejadorConsultarRequerimientoAdm.prioridadItem}"
					filterMatchMode="contains" style="text-align: center;">
					<center>
						<h:outputText
							value="#{requerimientoAsignadoOsolucionado.prioridad}" />
					</center>
				</p:column>

				<p:column headerText="Módulo"
					sortBy="#{requerimientoAsignadoOsolucionado.moduloVista}"
					filterBy="#{requerimientoAsignadoOsolucionado.moduloVista}"
					filterOptions="#{ManejadorConsultarRequerimientoAdm.moduloItem}"
					filterMatchMode="contains" style="text-align: center;">
					<h:outputText
						value="#{requerimientoAsignadoOsolucionado.moduloVista}" />
				</p:column>

				<p:column headerText="Ingeniero"
					sortBy="#{requerimientoAsignadoOsolucionado.ingenieroVista}"
					filterBy="#{requerimientoAsignadoOsolucionado.ingenieroVista}"
					filterOptions="#{ManejadorConsultarRequerimientoAdm.ingsItems}"
					filterMatchMode="contains" style="text-align: center;">
					<center>
						<h:outputText
							value="#{requerimientoAsignadoOsolucionado.ingenieroVista}" />
					</center>
				</p:column>

				<p:column headerText="Estado"
					sortBy="#{requerimientoAsignadoOsolucionado.estSelRequerimiento}"
					filterBy="#{requerimientoAsignadoOsolucionado.estSelRequerimiento}"
					filterOptions="#{ManejadorConsultarRequerimientoAdm.estadosRequerimientos}"
					filterMatchMode="contains" style="text-align: center;">
					<center>
						<h:outputText
							value="#{requerimientoAsignadoOsolucionado.estSelRequerimiento}" />
					</center>
				</p:column>

				<p:column headerText="Acciones" style="text-align: center;"
					rendered="#{!ManejadorConsultarRequerimientoAdm.esConsultaRequerimientos}">
					<p:commandButton
						action="#{ManejadorConsultarRequerimientoAdm.editarRequerimientoCoord}"
						icon="ui-icon-pencil"
						rendered="#{requerimientoAsignadoOsolucionado.estSelRequerimiento ne 'Solucionado'}"
						ajax="false">
						<f:setPropertyActionListener
							value="#{requerimientoAsignadoOsolucionado}"
							target="#{ManejadorConsultarRequerimientoAdm.requerimientoSeleccionado}" />
					</p:commandButton>
					<p:commandButton
						action="#{ManejadorConsultarRequerimientoAdm.consultarRequerimientoCoord}"
						icon="ui-icon-search" rendered="true" title="Consultar">
						<f:setPropertyActionListener
							value="#{requerimientoAsignadoOsolucionado}"
							target="#{ManejadorConsultarRequerimientoAdm.requerimientoSeleccionado}" />
					</p:commandButton>
					<p:commandButton
						action="#{ManejadorConsultarRequerimientoAdm.cargarHistorico}"
						title="Histórico" icon="ui-icon-clock"
						oncomplete="dialogHistorico.show();" update="@form">
						<f:setPropertyActionListener
							value="#{requerimientoAsignadoOsolucionado}"
							target="#{ManejadorConsultarRequerimientoAdm.requerimientoSeleccionado}" />
					</p:commandButton>
				</p:column>

				<f:facet name="footer">
					<h:outputText
						value="Se encontraron #{ManejadorConsultarRequerimientoAdm.numeroAsignadosSolucionados} solicitudes asignadas y atendidas" />
				</f:facet>
			</p:dataTable>

			<br> </br>
			<br> </br>
			<p:dialog
				header="Histórico Requerimiento - ID: #{ManejadorConsultarRequerimientoAdm.requerimientoSeleccionado.id}"
				widgetVar="dialogHistorico" modal="true" resizable="false"
				width="600">
				<p:dataTable style="border:none; margin-top: 10px;"
					id="histRequerimiento" var="historico"
					value="#{ManejadorConsultarRequerimientoAdm.historicoRequerimiento}"
					emptyMessage="No hay un histórico para este requerimiento."
					paginator="true" rows="10" paginatorPosition="bottom"
					paginatorTemplate="{CurrentPageReport}  {FirstPageLink} {PreviousPageLink} {PageLinks} {NextPageLink} {LastPageLink} {RowsPerPageDropdown}">
					<p:column>
						<f:facet name="header">
							<h:outputText value="Fecha" />
						</f:facet>
						<h:outputText value="#{historico.fechaCambio}">
							<f:convertDateTime pattern="dd/MM/yyyy hh:mm:ss" />
						</h:outputText>
					</p:column>
					<p:column>
						<f:facet name="header">
							<h:outputText value="Comentarios al Usuario" />
						</f:facet>
						<h:outputText value="#{historico.comentariosUsuario}" />
					</p:column>
				</p:dataTable>
			</p:dialog>

		</h:form>
	</ui:define>

</ui:composition>
