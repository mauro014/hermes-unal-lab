<?xml version='1.0' encoding='ISO-8859-1' ?>
<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:t="http://myfaces.apache.org/tomahawk"
	xmlns:s="http://myfaces.apache.org/sandbox"
	template="../../templates/common.xhtml">
	<ui:define name="content">
		<h:form>
			<t:div styleClass="contenido-titulo-general-myriad" >Consulta solicitud aprobada</t:div>
			<p:panel>
				<p:panelGrid columns="2"  styleClass="estilo-panelgrid-sinbordes" style="border-collapse: separate;">
					<h:outputText value="Código Proyecto: "/>
					<h:outputText
					value="#{ManejadorInboxUnidadAdministrativa.solicitudSeleccionada.proyecto.id}" style='font-weight: bold'/>
					<h:outputText value="Nombre Proyecto: " />
					<h:outputText
						value="#{ManejadorInboxUnidadAdministrativa.solicitudSeleccionada.proyecto.nombre}"
						style='font-weight: bold' />
					<h:outputText value="Investigador Principal: "/>
					<h:outputText
						value="#{ManejadorInboxUnidadAdministrativa.nombreInvPal}" style='font-weight: bold'/>
				</p:panelGrid>
			</p:panel>
			<br />
			<p:panel header="Información de la solicitud">
				<p:panelGrid columns="2"  styleClass="estilo-panelgrid-sinbordes" style="border-collapse: separate;">
					<h:outputText value="Código solicitud: "/>
					<h:outputText
						value="#{ManejadorInboxUnidadAdministrativa.solicitudSeleccionada.id}" style='font-weight: bold'/>
					<h:outputText value="Tipo solicitud: "/>
					<h:outputText
						value="#{ManejadorInboxUnidadAdministrativa.solicitudSeleccionada.tipoSolicitud.nombre}" style='font-weight: bold'/>
					<h:outputText value="Descripción: "/>
					<h:outputText
						value="#{ManejadorInboxUnidadAdministrativa.solicitudSeleccionada.descripcion}" style='font-weight: bold'/>
					<h:outputText value="Fecha de realización: "/>
					<h:outputText
						value="#{ManejadorInboxUnidadAdministrativa.solicitudSeleccionada.fecha}" style='font-weight: bold'/>
					<h:outputText value="Coordinador del proyecto: "/>
					<h:outputText
						value="#{ManejadorInboxUnidadAdministrativa.nombreCoor}" style='font-weight: bold'/>
					<h:outputText value="Correo coordinador: "/>
					<h:outputText
						value="#{ManejadorInboxUnidadAdministrativa.coordinador.email}" style='font-weight: bold'/>
				</p:panelGrid>
			</p:panel>
			<br />
			<p:dataTable var="archivoResumen"
				value="#{ManejadorInboxUnidadAdministrativa.listaArchivosSolicitudes}"
				style="width: 100%">
				<f:facet name="header">
					<h:outputText value="Documentos adjuntos" />
				</f:facet>
				<p:column>
					<f:facet name="header">
						<h:outputText value="Nombre de archivo" />
					</f:facet>
					<h:outputText value=" #{archivoResumen.carta.nombre}" />
				</p:column>
				<p:column>
					<f:facet name="header">
						<h:outputText value="Descargar" />
					</f:facet>
					<p:commandButton value="Descargar" ajax="false"
						action="#{ManejadorInboxUnidadAdministrativa.descargarArchivoSolicitud}" >
						<f:setPropertyActionListener value="#{archivoResumen}" target="#{ManejadorInboxUnidadAdministrativa.archivoSeleccionado}" />
					</p:commandButton>
				</p:column>
			</p:dataTable>
			<br />
			<div style="margin: auto; text-align: center; width: 100%;">
				<p:commandButton value="Confirmar solicitud revisada"
					action="#{ManejadorInboxUnidadAdministrativa.confirmarSolicitudUA}"
					 rendered="#{ManejadorInboxUnidadAdministrativa.mostrarAprobacionUA}" ajax="false"/>
				<p:commandButton value="Regresar al buzón de alertas"
					action="#{ManejadorInboxUnidadAdministrativa.atras}" />
			</div>
		</h:form>
</ui:define>
</ui:composition>
