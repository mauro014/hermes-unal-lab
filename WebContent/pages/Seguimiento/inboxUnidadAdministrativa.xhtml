<?xml version='1.0' encoding='ISO-8859-1' ?>
<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:t="http://myfaces.apache.org/tomahawk"
	xmlns:s="http://myfaces.apache.org/sandbox"
	template="../../templates/common.xhtml">
	<ui:define name="content">
		<h:form>
			<t:div styleClass="contenido-titulo-general-myriad" >Alertas de solicitudes aprobadas proyectos convocatorias internas</t:div>
			<p:dataTable style="width:100%;font-size:13px;"  var="solicitudesAprobadas" emptyMessage="No hay solicitudes pendientes."
				value="#{ManejadorInboxUnidadAdministrativa.listaSolicitudesAprobadas}"
				scrollable="true" paginator="true"
				paginatorTemplate="{CurrentPageReport} {FirstPageLink} {PreviousPageLink} {PageLinks} {NextPageLink} {LastPageLink}"
				paginatorPosition="bottom"
                rows="20">
				<p:column width="70">
					<f:facet name="header">
						Código<br/>
						Proyecto
					</f:facet>
					<h:outputText value="#{solicitudesAprobadas.proyecto.id}"/>
				</p:column>
				<p:column width="292">
					<f:facet name="header">
						Nombre del Proyecto
					</f:facet>
					<h:outputText value="#{solicitudesAprobadas.proyecto.nombre}"/>
				</p:column>
				<p:column width="70">
					<f:facet name="header">
						Código
						<br/>solicitud
					</f:facet>
					<h:outputText value="#{solicitudesAprobadas.id}"
						styleClass="normal"/>
				</p:column>
				<p:column width="85">
					<f:facet name="header">
						Tipo
						<br/>solicitud
					</f:facet>
					<h:outputText value="#{solicitudesAprobadas.tipoSolicitud.nombre}"
						styleClass="normal"/>
				</p:column>
				<p:column width="90">
					<f:facet name="header">
						Fecha
						<br/>solicitud
					</f:facet>
					<h:outputText value="#{solicitudesAprobadas.fecha}"
						styleClass="normal"/>
				</p:column>
				<p:column width="50">
					<p:commandButton
						action="#{ManejadorInboxUnidadAdministrativa.consultarSolicitudes}"
						icon="ui-icon-search" ajax="false">
						<f:setPropertyActionListener value="#{solicitudesAprobadas}" target="#{ManejadorInboxUnidadAdministrativa.solicitudUsada}"/>
					</p:commandButton>		
				</p:column>
			</p:dataTable>
		</h:form>
	</ui:define>
</ui:composition>
