<?xml version='1.0' encoding='ISO-8859-1' ?>
<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:t="http://myfaces.apache.org/tomahawk"
	xmlns:s="http://myfaces.apache.org/sandbox"
	template="../../templates/common.xhtml">

<ui:define name="content">
<h:form>

<h:panelGrid columns="1" border="0"
	cellpadding="1" cellspacing="1" columnClasses="alignTop, alignTop">


		<h:outputText value="Alertas Unidad Administrativa Facultad" styleClass="proyectoH3" />

			
			<br />
			<br />
			 	    
	<h:panelGrid columns="5"
	 		 	 align="left" 
 	         	 cellpadding="0"
 	         	 cellspacing="1"
 	         	 rendered="true">
 	    
		<h:dataTable id="tablaAlertas"
					 styleClass="table-background"
					 var  ="alerta"
			         value="#{manejadorSeguimiento.alertasHermesFacultad}"		                
			         cellpadding="0"
					 border="1"
					 rows="10"
					 binding="#{manejadorSeguimiento.tablaAlertasAsesor}"
	   	             rowClasses="table-odd-row,table-even-row"
	   	             style="width: 500px">   	    	
	   	    <h:column>
   	    		<h:panelGrid columns="2"
				 		 	 cellpadding="0"
			 	         	 cellspacing="1"
			 	         	 rendered="true" 
			 	         	 style="background-color:#{alerta.colorAlerta};width: 500px">
			 	    <h:outputText value="Código proyecto : "/>
			 	    <h:outputText value="#{alerta.proyecto.id}"
									  style="color:#003366; font-weight: normal"/>
					<h:outputText value="Código de la solicitud: "/>
			 	    <h:outputText value="#{alerta.solicitud.id}"
									  style="color:#003366; font-weight: normal"/>
					<h:outputText value="Código División Investigación : "/>
			 	    <h:outputText value="#{alerta.proyecto.codigoDib}"
									  style="color:#003366; font-weight: normal"/>						
					<h:outputText value="Alerta : "/>
			 	    <h:outputText value="#{alerta.mensaje}"
									  style="color:#003366; font-weight: normal"/>
					<h:outputText value="Fecha límite : "/>
			 	    <h:outputText value="#{alerta.fechaGenera}"
									  style="color:#003366; font-weight: normal"/>
					<h:outputText value="Estado alerta : "/>
					<h:outputText value="#{alerta.estadoMostrar}"
									  style="color:#003366; font-weight: normal"/>
				</h:panelGrid>
				<center>
					<h:panelGrid columns="2"
								 cellpadding="0"
					   	         cellspacing="1"
					   	         rendered="true"
					   	         style="background-color:#{alerta.colorAlerta};width: 500px">
					   	 <h:commandButton action="#{manejadorSeguimiento.examinarInformacionHermesFacultad}" 
								 		  image="/imgplantilla/pngtitulos/cen_examinar.png" />
			   	         <h:commandButton onclick="if(!confirm('Cancelar alerta #{alerta.mensaje} para el proyecto #{alerta.proyecto.id}?'))return false"
			   	         				  action="#{manejadorSeguimiento.cerrarAlerta}" 
								 		  image="/imgplantilla/pngtitulos/cancelar.png" />
					</h:panelGrid>			
				</center>
			</h:column>		    					    		    	   	
	   	</h:dataTable>  	   		
   	</h:panelGrid>   	                    


<h:panelGrid columns="1"
 		 	 align="center"
 		 	 cellpadding="0"									 	         	 	 
	         	 cellspacing="3"					 	         	 
	         	 rendered="true">
	<t:dataScroller for="tablaAlertas"
                    fastStep="5"
                    renderFacetsIfSinglePage ="false"
                    pageCountVar="pageCount"
                    pageIndexVar="pageIndex"
                    paginator="true"				                        
                    paginatorMaxPages="5"
                    paginatorActiveColumnStyle="font-size:18px;font-weight:bold;">
		<f:facet name="first">
			<t:outputText value=" <<Primero "/>
		</f:facet>
        
        <f:facet name="previous">
			<t:outputText  value = " <Anterior "/>
        </f:facet>

		<f:facet name="next">
			<t:outputText  value = " Siguiente> "/>
        </f:facet>
        
        <f:facet name="last">
			<t:outputText  value = " Ultimo>> "/>
        </f:facet>						        			
	</t:dataScroller>
</h:panelGrid>
 </h:panelGrid></h:form>
</ui:define>
</ui:composition>
