<?xml version='1.0' encoding='ISO-8859-1' ?>
<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:t="http://myfaces.apache.org/tomahawk"
	xmlns:s="http://myfaces.apache.org/sandbox"
	template="../../templates/common.xhtml">

<ui:define name="content">
<h:form>
<t:div styleClass="contenido-titulo-general-myriad">Aval pendientes - Otras Dependencias</t:div>


 <h:outputText
	value="Han sido encontrados #{manejadorConsultaAvalDRE.tamañoLista} avales pendientes de evaluación en facultad y sede "/>
	
		<p:dataTable var="avalVisi"
						value="#{manejadorConsultaAvalDRE.listaAval}"
						emptyMessage="No existen avales pendientes de revisión.">	
			
			<p:column style="font-size:11px;">
				<f:facet name="header">
					<h:outputText value="Tipo - Código"/>
				</f:facet>
				<h:outputText 
 					value="#{avalVisi.nombreTipo} - #{avalVisi.aviId}"/> 
			</p:column>
			
			<p:column style="font-size:11px;">
				<f:facet name="header">
					<h:outputText value="Título" />
				</f:facet>
				<h:outputText
					value="#{avalVisi.aviTitulo}" />
			</p:column>
			
			<p:column style="font-size:11px;">
				<f:facet name="header">
					<h:outputText value="Profesor" />
				</f:facet>
				<h:outputText
					value="#{avalVisi.nombreInvestigador}" />
			</p:column>
			
			<p:column style="font-size:11px;">
				<f:facet name="header">
					<h:outputText value="Sede" />
				</f:facet>
				<h:outputText
					value="#{avalVisi.evento}" />
			</p:column>
			
			<p:column style="font-size:11px;">
				<f:facet name="header">
					<h:outputText value="Facultad" />
				</f:facet>
				<h:outputText
					value="#{avalVisi.nombreFacultad}" />
			</p:column>
						
			<p:column style="font-size:11px;">
				<f:facet name="header">
					<h:outputText value="Estado"  />
				</f:facet>
				<h:outputText
					value="#{avalVisi.nombreEstado}" />
			</p:column>
			
			<p:column style="font-size:11px;">
				<f:facet name="header">
					<h:outputText value="Fecha" />
				</f:facet>
				
				<h:outputText
					value="#{avalVisi.fecha}" />						
			</p:column>
	
		</p:dataTable>
	
</h:form>
</ui:define>
</ui:composition>
