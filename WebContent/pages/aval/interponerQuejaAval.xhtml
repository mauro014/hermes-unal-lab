<?xml version='1.0' encoding='ISO-8859-1' ?>
<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:t="http://myfaces.apache.org/tomahawk"
	xmlns:s="http://myfaces.apache.org/sandbox"
	template="../../templates/common.xhtml">

	<ui:define name="content">
		<h:form>
			<style type="text/css">
			.confirmaEdicion .ui-state-default, .confirmaEdicion .ui-widget-content .ui-state-default,
				.confirmaEdicion .ui-widget-header .ui-state-default {
				border: 1px solid #646464;
			}
			</style>
			<t:div styleClass="contenido-titulo-general-myriad">Interponer queja</t:div>

			<br />
			<p:panel id="panelAvalInfo">
				<p:panelGrid styleClass="estilo-panelgrid-sinbordes" id="panelAval" style="text-align:left">
					<p:row>
						<p:column>
							<h:outputText value="Código aval: "></h:outputText>
						</p:column>
						<p:column>
							<h:outputText value="#{manejadorSolicitudAvalHome.aval.aviId}"></h:outputText>
						</p:column>
					</p:row>
					<p:row>
						<p:column>
							<h:outputText value="Tipo aval: "></h:outputText>
						</p:column>
						<p:column>
							<h:outputText
								value="#{manejadorSolicitudAvalHome.aval.nombreTipo}"></h:outputText>
						</p:column>
					</p:row>
					<p:row>
						<p:column>
							<h:outputText value="Unidad Académica Básica: "></h:outputText>
						</p:column>
						<p:column>
							<h:outputText
								value="#{manejadorSolicitudAvalHome.aval.dependencia.nombre}"></h:outputText>
						</p:column>
					</p:row>
					<p:row>
						<p:column>
							<h:outputText value="Facultad: "></h:outputText>
						</p:column>
						<p:column>
							<h:outputText
								value="#{manejadorSolicitudAvalHome.aval.dependencia.facultad.nombre}"></h:outputText>
						</p:column>
					</p:row>
					<p:row>
						<p:column>
							<h:outputText value="Sede: "></h:outputText>
						</p:column>
						<p:column>
							<h:outputText
								value="#{manejadorSolicitudAvalHome.aval.dependencia.facultad.sede.nombre}"></h:outputText>
						</p:column>
					</p:row>
					<p:row>
						<p:column>
							<h:outputText value="Consultar información aval: " />
						</p:column>
						<p:column>
							<h:outputText value="" />
							<h:commandLink value="Ver reporte específico"
								action="#{manejadorSolicitudAvalHome.imprimirAval}"
								target="_popUpWindow1"
								onclick="javascript: void window.open('', '_popUpWindow1', 'status=0,toolbar=0,location=0,menubar=0,directories=0,resizable,width=750,height=500,scrollbars,left=0,top=0');"
								style="text-decoration:none; 
										color: #16A8E2;
										font-weight: bold;">
							</h:commandLink>
						</p:column>
					</p:row>
					<p:row>
						<p:column>
							<h:outputText
								value="Consultar información de proyecto relacionado: " />
						</p:column>
						<p:column>
							<h:commandLink value="Ver reporte de proyecto"
								target="_popUpWindow2"
								action="#{manejadorSolicitudAvalHome.imprimirProyecto}"
								onclick="javascript: void window.open('', '_popUpWindow2', 'status=0,toolbar=0,location=0,menubar=0,directories=0,resizable,width=750,height=500,scrollbars,left=0,top=0');"
								style="text-decoration:none; 
										color: #16A8E2;
										font-weight: bold;">
							</h:commandLink>
						</p:column>
					</p:row>

				</p:panelGrid>
				<br />

				<p:dataTable var="documento" id="tablaArchivoDoc"
					value="#{manejadorSolicitudAvalHome.listaArchivos}"
					emptyMessage="No hay archivos adjuntos." cellpadding="1"
					cellspacing="8" align="center" border="1" style="width:100%">
					<f:facet name="header">Archivos Adjuntos</f:facet>

					<p:column headerText="Id" style="width:2%">

						<h:outputText value=" #{documento.id}" />
					</p:column>

					<p:column headerText="Archivo" style="width:95%">

						<h:outputText value=" #{documento.nombre}" />
					</p:column>

					<p:column headerText="Descargar" style="width:3%">
						<p:commandButton id="descargar"
							action="#{manejadorSolicitudAvalHome.descargarArchivo}"
							icon="ui-icon-circle-arrow-s" title="Descargar archivo"
							ajax="false">
							<f:setPropertyActionListener value="#{documento}"
								target="#{manejadorSolicitudAvalHome.archivoAval}" />
						</p:commandButton>
					</p:column>
				</p:dataTable>
			</p:panel>

			<br />
			<p:fieldset id="panelQueja" legend="Queja">
				<p:panel rendered="#{manejadorSolicitudAvalHome.esConsultaQueja}">					
					<t:div>
						<b>NOTA:</b> Usted ya interpuso una queja para esta solicitud de aval con los siguientes datos
					</t:div>
				</p:panel>
				<br />
				<p:panelGrid columns="1" styleClass="estilo-panelgrid-sinbordes" >
					
					<p:panelGrid id="panelTieneRecurso" styleClass="estilo-panelgrid-sinbordes" style="text-align:left">
						<p:row>
							<p:column>
								<h:outputText value="¿Está de acuerdo con interponer una queja?: " style='font-weight: bold;'/>
							</p:column>
							<p:column>
								<p:selectOneRadio
									disabled="#{manejadorSolicitudAvalHome.esConsultaQueja}"
									value="#{manejadorSolicitudAvalHome.aval.avalTieneQueja}">
									<f:selectItem itemLabel="SI" itemValue="SI" />
									<f:selectItem itemLabel="NO" itemValue="NO" />
									<p:ajax update="panelQuejaDatos" process="panelQuejaDatos" />
								</p:selectOneRadio>
							</p:column>
						</p:row>
					</p:panelGrid>
					<br />
					<p:panelGrid id="panelQuejaDatos" styleClass="estilo-panelgrid-sinbordes" style="text-align:left">
						<p:row rendered="#{manejadorSolicitudAvalHome.aval.avalTieneQueja == 'SI'}">
							<p:column>
								<h:outputText value="Justificación: " style='font-weight: bold;'/>
							</p:column>
							<p:column>
								<p:inputTextarea cols="70" rows="6" style="width:100%"
									autoResize="false" id="dev1Recurso"
									value="#{manejadorSolicitudAvalHome.aval.textoQueja}"
									maxlength="3800"
									disabled="#{manejadorSolicitudAvalHome.esConsultaQueja}">
									<f:validateLength minimum="0" maximum="3800" for="dev1Recurso"></f:validateLength>
								</p:inputTextarea>
							</p:column>
						</p:row>
					</p:panelGrid>
					
					<p:panelGrid id="panelQuejaNotas" columns="1" styleClass="estilo-panelgrid-sinbordes">
						<br />
						<h:outputText value="En caso de seleccionar SI, esta queja será  enviada al comité de ética en segunda instancia."/>
					</p:panelGrid>
				</p:panelGrid>	
				<br />
			</p:fieldset>
			
			<br />
			
			<center>	
				<p:panelGrid id="panelGuardar" columns="2" styleClass="estilo-panelgrid-sinbordes">
					<p:commandButton
						disabled="#{manejadorSolicitudAvalHome.esConsultaQueja}"
						action="#{manejadorSolicitudAvalHome.guardarQuejaEtico}"
						value="Guardar y enviar queja" onstart="dialogEspere.show()"
						oncomplete="dialogEspere.hide()"
						update="@form">
					</p:commandButton>
					<p:commandButton action="#{manejadorSolicitudAvalHome.regresar}"
						value="Regresar" onstart="dialogEspere.show()"
						oncomplete="dialogEspere.hide()">
					</p:commandButton>
				</p:panelGrid>
			</center>
			
			<p:messages id="msgs" autoUpdate="true" />
			<p:dialog widgetVar="dialogEspere" resizable="false" closable="false" modal="true">
				<p:graphicImage value="/images/ajaxloading.gif" /> Por favor espere...
			</p:dialog>
		</h:form>
	</ui:define>
</ui:composition>
