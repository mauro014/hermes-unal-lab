<?xml version='1.0' encoding='ISO-8859-1' ?>
<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:t="http://myfaces.apache.org/tomahawk"
	xmlns:s="http://myfaces.apache.org/sandbox"
	template="../../templates/common.xhtml">

	<ui:define name="content">
		<h:form id="solicitudAvalFormulario">

			<t:div styleClass="contenido-titulo-general-myriad">Consultar aval</t:div>
			<br />

			<p:accordionPanel id="ficha" multiple="false" cache="true">
				
				<p:tab title="INFORMACIÓN GENERAL" id="infGeneral">

						<p:panelGrid columns="3" styleClass="estilo-panelgrid-sinbordes"
							id="panelPrincipal">
	
							<h:outputText value="Tipo de actividad:" />
							<p:selectOneMenu value="#{manejadorSolicitudAval.categoria}"
								id="categoria" disabled="true" style="width:480px"
									panelStyle="width: 460px;">
								<f:selectItems value="#{manejadorSolicitudAval.categoriaItems}" />
							</p:selectOneMenu>
							<p:message for="categoria" display="icon" />
	
							<h:outputText value="Modalidad:"  rendered="false"/>
							<p:selectOneMenu  rendered="false"
								value="#{manejadorSolicitudAval.modalidadSolicitud}"
								id="modalidadSolicitud"   disabled="true">
								<f:selectItems
									value="#{manejadorSolicitudAval.modalidadSolicitudItems}" />
							</p:selectOneMenu>
							<p:message for="modalidadSolicitud" display="icon" />
	
							<h:outputText value="Mecanismo:"  rendered="false"/>
							<p:selectOneMenu  rendered="false"
								value="#{manejadorSolicitudAval.mecanismoSolicitud}"
								id="mecanismoSolicitud"  disabled="true">
								<f:selectItems
									value="#{manejadorSolicitudAval.mecanismoSolicitudItems}" />
							</p:selectOneMenu>
							<p:message for="mecanismoSolicitud" display="icon" />
	
						</p:panelGrid>
	
						<p:panelGrid columns="3" styleClass="estilo-panelgrid-sinbordes"
							id="panelPrincipal2">
							<h:outputText value="Título:" />
							<p:inputTextarea value="#{manejadorSolicitudAval.aval.aviTitulo}"
								id="titulo" required="true" requiredMessage="Título es requerido"
								validatorMessage="Título debe estar entre 1 - 3000 caracteres"
								rows="3" cols="70"  readonly="true">
								<f:validateLength minimum="1" maximum="3000" for="titulo"></f:validateLength>
							</p:inputTextarea>
							<p:message for="titulo" display="icon" />
	
	
							<h:outputText
								value="Objeto/Objetivo principal (Máx. 4000 caracteres):" />
							<p:inputTextarea required="true"
								requiredMessage="Objeto/Objetivo Principal es requerido"
								validatorMessage="Objeto/Objetivo Principal debe estar entre 1 - 4000 caracteres"
								value="#{manejadorSolicitudAval.aval.objetivoPrincipal}" rows="3"
								id="objeto" cols="70"  readonly="true">
								<f:validateLength minimum="1" maximum="4000" for="objeto"></f:validateLength>
							</p:inputTextarea>
							<p:message for="objeto" display="icon" />
	
	
							<h:outputText value="Resumen (Máx. 4000 caracteres):" />
							<p:inputTextarea value="#{manejadorSolicitudAval.aval.resumen}"
								id="resumen" required="true"
								requiredMessage="Resumen es requerido"
								validatorMessage="Resumen debe estar entre 1 - 4000 caracteres"
								rows="5" cols="70"  readonly="true">
								<f:validateLength minimum="1" maximum="4000" for="resumen"></f:validateLength>
							</p:inputTextarea>
							<p:message for="resumen" display="icon" />
	
	
							<h:outputText value="Area de la ciencia:" />
							<p:selectOneMenu
								value="#{manejadorSolicitudAval.aval.areaCiencia}"
								id="areaCiencia"  disabled="true">
								<f:selectItems value="#{manejadorSolicitudAval.listaAreaCiencia}" />
							</p:selectOneMenu>
							<p:message for="areaCiencia" display="icon" />
	
	
							<h:outputText value="Objetivo socioeconómico:" />
							<p:selectOneMenu id="socioeconomico"
								value="#{manejadorSolicitudAval.aval.objetivoSocioeconomico}" disabled="true">
								<f:selectItems
									value="#{manejadorSolicitudAval.listaObjSocioeconomico}" />
							</p:selectOneMenu>
							<p:message for="socioeconomico" display="icon" />
	
	
							<h:outputText value="Duración:" />
							<h:panelGrid columns="12">
								<h:outputText value="Meses" />
								<p:inputText value="#{manejadorSolicitudAval.aval.duracion}"
									size="3" id="horam" required="true"
									requiredMessage="Meses es requerido"
									validatorMessage="Meses entre 0 - 1000"  readonly="true">
									<f:validateLongRange minimum="0" maximum="1000" for="horam" />
								</p:inputText>
								<p:message for="horam" display="icon" />
								<h:outputText value="Semanas" />
								<p:inputText value="#{manejadorSolicitudAval.aval.duracions}"
									size="3" id="horas" required="true"
									requiredMessage="Semanas es requerido"
									validatorMessage="Semanas entre 0 - 1000"  readonly="true">
									<f:validateLongRange minimum="0" maximum="1000" for="horas" />
								</p:inputText>
								<p:message for="horas" display="icon" />
								<h:outputText value="Días" />
								<p:inputText value="#{manejadorSolicitudAval.aval.duraciond}"
									size="3" id="horad" required="true"
									requiredMessage="Dias es requerido"
									validatorMessage="Dias entre 0 - 1000"  readonly="true">
									<f:validateLongRange minimum="0" maximum="1000" for="horad" />
								</p:inputText>
								<p:message for="horad" display="icon" />
								<h:outputText value="Horas" />
								<p:inputText value="#{manejadorSolicitudAval.aval.duracionh}"
									size="3" id="horah" required="true"
									requiredMessage="Horas es requerido"
									validatorMessage="Horas entre 0 - 1000"  readonly="true">
									<f:validateLongRange minimum="0" maximum="1000" for="horah" />
								</p:inputText>
								<p:message for="horah" display="icon" />
							</h:panelGrid>
							<h:outputText value="" />
						</p:panelGrid>
						
					<br />
					<p:separator id="customSeparator" />
					<br /><br />
					
						<center>
						<h:outputText value="PALABRAS CLAVE" />
						<br /> <br/>
						</center>		
							<p:dataTable id="palabrasTable" 
								emptyMessage="No se han agregado palabras clave"
								value="#{manejadorSolicitudAval.listaPalabrasClave}" var="pal">
								<p:column style="width:25%" headerText="Palabras Clave">
									<h:outputText value="#{pal.palabraVista}" />
								</p:column>
							</p:dataTable>				
						
					<p:message for="palabrasTable" display="icon" />
						
					<br />
					<p:separator id="customSeparator" />
					<br /><br />
					
					<center>
					<h:outputText value="PARTICIPANTES UN" />
					<br /><br/>
					</center>					
	
						<p:dataTable id="participantesTabla" var="coinvestigadorAval"
						value="#{manejadorSolicitudAval.listaCoinvestigadores}"
						emptyMessage="No se han agregado participantes" style="width:70%">

						<p:column headerText="Participante">
							<h:outputText value=" #{coinvestigadorAval.nombreCandidato}" />
						</p:column>

						<p:column headerText="Tipo">
							<h:outputText value=" #{coinvestigadorAval.tipoVinculacion}" />
						</p:column>

						<p:column headerText="Rol">
							<h:outputText value=" #{coinvestigadorAval.rol}" />
						</p:column>

						<p:column headerText="te - hf/sf"
							style="width:60%">
							<h:outputText
								value=" #{coinvestigadorAval.horas} - #{coinvestigadorAval.horasSemanaFormulacion} / #{coinvestigadorAval.semanasFormulacion}" />
						</p:column>

						<p:column headerText="Contrapartida (Personal)"
							style="width:60%">
							<h:outputText
								value="#{coinvestigadorAval.valorPagar}" />
						</p:column>

						<p:column headerText="Facultad">
							<h:outputText value=" #{coinvestigadorAval.facultad}" />
						</p:column>

					</p:dataTable>
					<br />				
						
			</p:tab>

			<p:tab title="INFORMACIÓN FINANCIERA" id="infFinanciera">
				<br />
				<p:panelGrid columns="2" style="width:645px" styleClass="estilo-panelgrid-sinbordes" id="registrofinan">

					<h:outputText value="Unidad Académica Básica responsable:" />
					<p:inputText value="#{manejadorSolicitudAval.aval.uab}" size="70"
						id="ejecutora" readonly="true"/>					

					<h:outputText value="Valor total de la propuesta:" />
					<p:inputText value="#{manejadorSolicitudAval.aval.aviVrTotal}"
						id="valortotal" readonly="true">
					</p:inputText>					
					
					<h:outputText value="Genera Servicios Académicos Remunerados?" />
					<p:selectOneMenu id="remunerados" disabled="true"
						value="#{manejadorSolicitudAval.aval.serviciosAcademicos}">
						<f:selectItem itemLabel="NO" itemValue="NO" />
						<f:selectItem itemLabel="SI" itemValue="SI" />
					</p:selectOneMenu>				

				</p:panelGrid>
			
					<br/>
					<center>
					<h:outputText value="CONTRAPARTIDAS" style='font-weight: bold;'/>
					<br /><br/>
					</center>
									
						
					<br />
					<br />					
						<h:outputText value="CONTRAPARTIDA PERSONAL UN"
							style='font-weight: bold;' />
						<br /> <br />					
					
					<h:outputText value="Valor contrapartida PERSONAL Universidad Nacional de Colombia: $" />
					<h:outputText value="#{manejadorSolicitudAval.aval.valorPersonalTotal}" id="valorpersonalun" style='font-weight: bold;'/>
					<br /><br />
					<h:outputText value="(Este valor ha sido calculado empleando la duración del proyecto, el tiempo de dedicación al proyecto de cada docente participante y el valor por hora de cada docente)" />
					
					<br /><br />
					<p:separator id="customSeparator" />
					<br />
					<br />
					<center>
						<h:outputText value="PRESUPUESTO ADICIONAL"
							style='font-weight: bold;' />
						<br /> <br />
					</center>

					
					<br />
					<p:dataTable id="entidadess" var="entidades"
						style="text-align: center"
						value="#{manejadorSolicitudAval.listaEntidades}" align="center"
						emptyMessage="No se han agregado contrapartidas">
					
						<p:column headerText="Entidad" style="text-align: center">
							<h:outputText value=" #{entidades.nombre}" />
						</p:column>

						<p:column headerText="Rubro" style="text-align: center">
							<h:outputText value=" #{entidades.tipoRubro.nombre }" />
						</p:column>
							<p:column headerText="Aporte Especie" style="text-align: center">
								<h:outputText
									value=" #{entidades.especie !=0 ? entidades.especie: ''}" />							
							</p:column>
							
							<p:column headerText="Aporte Frescos" style="text-align: center">							
								<h:outputText
									value="#{entidades.frescos!=0? entidades.frescos: ''}" />
							</p:column>

					</p:dataTable>

					<br></br>
			
			</p:tab>

			<p:tab title="INFORMACIÓN ESPECÍFICA" id="infEspecifica" >
				<br></br>
				<h:panelGroup rendered="#{manejadorSolicitudAval.verConvocatorias}">
					<p:panelGrid columns="3" styleClass="estilo-panelgrid-sinbordes"
					id="panelIntConvocatoria">

					<h:outputText value="Entidad convocante:" />
					<p:selectOneMenu id="entidadConvocante"
									value="#{manejadorSolicitudAval.aval.aviEntidad}"
									style="width:480px"
									panelStyle="width: 460px;"
									disabled="true">
									<f:selectItems
										value="#{manejadorSolicitudAval.listaEntidadesParticipantesSR}" />
								</p:selectOneMenu>
					<p:message for="entidadConvocante" display="icon" />

					<h:outputText value="Convocatoria:" />
					<p:selectOneMenu id="convocatoriaid"
								value="#{manejadorSolicitudAval.aval.aviConvocatoria}"
								style="width:480px"
								disabled="true"
								panelStyle="width: 460px;">
								<f:selectItems
									value="#{manejadorSolicitudAval.convocatoriasExternasItem}" />
							</p:selectOneMenu>
					<p:message for="convocatoriaid" display="icon" />

					<h:outputText value="Monto solicitado a la entidad convocante:" />
					<p:inputText value="#{manejadorSolicitudAval.aval.aviMontoEntConv}"
						id="montoSolicitado"  readonly="true"
						validatorMessage="Monto solicitado a la entidad convocante entre 0 - 10000000000000">
						<f:validateLongRange minimum="0" maximum="10000000000000"
							for="montoSolicitado" />
					</p:inputText>
					<p:message for="montoSolicitado" display="icon" />

					<h:outputText value="Entidad ejecutora" />
					<p:inputText id="entidadEjecutora" size="70"
						value="#{manejadorSolicitudAval.aval.aviEntidadejecutora}"
						minQueryLength="3"  readonly="true"/>
					<p:message for="entidadEjecutora" display="icon" />

					<h:outputText value="Entidad coejecutora:" />
					<p:inputText id="entidadCoejecutora" size="70"
						value="#{manejadorSolicitudAval.aval.aviEntidadcoejecutora}"  readonly="true"/>
					<p:message for="entidadCoejecutora" display="icon" />

					<h:outputText value="Fecha de cierre del proceso" />
					<p:calendar id="fechacierrepros"
						value="#{manejadorSolicitudAval.aval.aviFechaCierreConv}" disabled="true"/>
					<p:message for="fechacierrepros" display="icon" />

				
				</p:panelGrid>	
							
				<br/>
			 </h:panelGroup>					
			
			<h:panelGroup rendered="#{manejadorSolicitudAval.verSistRegalias}">
			
				<h:panelGrid columns="3" styleClass="estilo-panelgrid-sinbordes"
					id="panelRegalias">
					
					<h:outputText value="Lugar específico de ejecución:" />
					<p:inputText value="#{manejadorSolicitudAval.aval.lugarEjecucion}"
						id="lugarEjuecucion" required="true"
						size="70" readonly="true">
					</p:inputText>
					<p:message for="lugarEjuecucion" display="icon" />

					<h:outputText value="Fase:" />
					<p:selectOneMenu value="#{manejadorSolicitudAval.aval.fase}"
						id="faseSelec" disabled="true">
						<f:selectItems value="#{manejadorSolicitudAval.listaFases}" />
					</p:selectOneMenu>
					<p:message for="faseSelec" display="icon" />

					<h:outputText value="Entidad que se propone como ejecutora:" />
					<p:inputText id="entiEjecu"
						value="#{manejadorSolicitudAval.aval.aviEntidadejecutora}"
						size="70" readonly="true">
					</p:inputText>
					<p:message for="entiEjecu" display="icon" />
				</h:panelGrid>

					<br />
					<p:separator id="customSeparator" />
					<br /><br />
					<center>
					<h:outputText value="MONTO SOLICITADO AL FONDO DE CT+I REGALÍAS" />
					<br /><br/>
					</center>
				<br />
				<p:dataTable id="monto" var="monto"
					value="#{manejadorSolicitudAval.listaMontoAnoo}" align="center"
					emptyMessage="No se han agregado montos">

					<p:column headerText="Región">
						<h:outputText value="#{monto.regiontxt}" />
					</p:column>

					<p:column headerText="SubRegión">
						<h:outputText value="#{monto.subregiontxt}" />
					</p:column>

					<p:column headerText="Año">
						<h:outputText value="#{monto.ano}" />
					</p:column>

					<p:column headerText="Monto">
						<h:outputText value="#{monto.monto}" />
					</p:column>

					
				</p:dataTable>
				
			<br />
			</h:panelGroup>			
			
			<h:panelGroup rendered="#{manejadorSolicitudAval.verMovilidadEvento}">
				<p:panelGrid columns="2" styleClass="estilo-panelgrid-sinbordes"
					id="panelMovilidadEven">

					<h:outputText value="Tipo:" />
					<p:selectOneMenu value="#{manejadorSolicitudAval.aval.tipoEvento}"
						id="tipEve" disabled="true" width="100px;">
						<f:selectItems value="#{manejadorSolicitudAval.eventoItem}" />
					</p:selectOneMenu>


					<h:outputText value="Número de la convocatoria:"
						id="numeroConvocatoria" />
					<p:inputText
						value="#{manejadorSolicitudAval.aval.aviNumeroConvocatoria}"
						id="numeroConvocatoria1" readonly="true" />

					<h:outputText value="Convocatoria:" />
					<p:inputText value="#{manejadorSolicitudAval.aval.aviConvocatoria}"
						size="70" readonly="true"/>

					<h:outputText value="Fecha de cierre del proceso" />
					<p:calendar id="fechainicio" disabled="true"
						value="#{manejadorSolicitudAval.aval.aviFechaCierreConv}" />

					<h:outputText value="Entidad convocante:" />
					<p:inputText value="#{manejadorSolicitudAval.aval.aviEntidad}"
						size="70" readonly="true"/>

					<h:outputText value="Entidad ejecutora" />
					<p:inputText size="70" readonly="true"
						value="#{manejadorSolicitudAval.aval.aviEntidadejecutora}" />

					<h:outputText value="Monto solicitado a la entidad convocante:" />
					<p:inputText value="#{manejadorSolicitudAval.aval.aviMontoEntConv}" readonly="true"/>

					<h:outputText value="Nombre del evento:" />
					<p:inputText value="#{manejadorSolicitudAval.aval.evento}"
						size="70" readonly="true"/>

					<h:outputText value="Fecha inicial:" />
					<p:calendar value="#{manejadorSolicitudAval.aval.fechaInicio}" readonly="true" />

					<h:outputText value="Fecha final:" />
					<p:calendar value="#{manejadorSolicitudAval.aval.fechaFin}" readonly="true"/>

					<h:outputText value="País:" />
					<p:selectOneMenu value="#{manejadorSolicitudAval.aval.pais}" disabled="true">
						<f:selectItems value="#{manejadorSolicitudAval.paisItem}" />
					</p:selectOneMenu>

				</p:panelGrid>
					
			<br />
			</h:panelGroup>
			
			<br />
			<p:separator id="customSeparator" />
			<br /><br /><center>
			<h:outputText value="DOCUMENTOS DE SOPORTE" />
			<br /><br/>
			</center>
			
			<br/>		
			<center>
				<p:panelGrid columns="1" style="width:60%" styleClass="estilo-panelgrid-sinbordes">
					

					<p:dataTable value="#{manejadorSolicitudAval.listaArchivos}"
						var="archivo" emptyMessage="No hay archivos asociados"
						id="tabla-archivo">

						<p:column headerText="Documentos adjuntos">
							<h:outputText value="#{archivo.nombre}"
								style="text-align: left; width: 500px; text-transform:uppercase; padding-bottom: 10px;" />
						</p:column>
						<p:column style="width:3%" headerText="Descargar">
								<p:commandButton id="selectButton" 
										value="Descargar"
										action="#{manejadorSolicitudAval.descargarArchivo}"
										 ajax="false">
										<f:setPropertyActionListener value="#{archivo}"
											target="#{manejadorSolicitudAval.archivoAval}" />
									</p:commandButton>
								</p:column>
					</p:dataTable>
				</p:panelGrid>
			</center>
			<br />			
			
			<br />

			<p:messages id="msgs" autoUpdate="true" />
			</p:tab>


			<br />
			<p:tab title="REVISIÓN AVAL" id="infGeneral">
						
			<p:panelGrid columns="2" cellpadding="4" cellspacing="4" styleClass="estilo-panelgrid-sinbordes">
				
				<h:outputText value="Estado  Aval:"/>
				<h:outputText value="#{manejadorSolicitudAval.aval.nombreEstado}" />

				<h:outputText value="Observaciones en caso de no avalar:" rendered="#{manejadorSolicitudAval.aval.descripcionfacultad!=null}"/>
				<h:inputTextarea readonly="true" cols="40" rows="3" autoResize="false"
					value="#{manejadorSolicitudAval.aval.descripcionfacultad}" rendered="#{manejadorSolicitudAval.aval.descripcionfacultad!=null}"/>
					
				
				<h:outputText value="Documento Aval:" />
				
				<h:outputText value="No ha sido generado" rendered="#{manejadorSolicitudAval.aval.archivoAval==null}"/>
		
				<h:panelGroup rendered="#{manejadorSolicitudAval.aval.archivoAval!=null}">
					<h:outputText value="#{manejadorSolicitudAval.aval.archivoAval}" />
					<p:spacer width="15" />
					<p:commandButton
						action="#{manejadorSolicitudAval.descargarAval}"
						value=" Descargar Aval" icon="ui-icon-circle-arrow-s" ajax="false">
					</p:commandButton>
	
				</h:panelGroup>
	
				<h:outputText value="Documentos de soporte revisor:" />	
			
				<p:dataTable var="archivoResumen" emptyMessage="No se han encontrado documentos"
					value="#{manejadorSolicitudAval.aval.archivosCoorList}"
					cellpadding="1" cellspacing="8" align="center" border="1">
	
					<p:column headerText="Archivos Adjuntos">						
						<h:outputText value=" #{archivoResumen.nombre}"  />
					</p:column>
					
					<p:column headerText="Descargar">
						<p:commandButton  id = "descargar"
							action="#{manejadorSolicitudAval.descargarArchivoCoor}"
							icon="ui-icon-save" title="Descargar archivo" ajax="false">
							<f:setPropertyActionListener value="#{archivoResumen}" 
									target="#{manejadorSolicitudAval.documentoSeleccionado}"/>
						</p:commandButton>
	
					</p:column>
	
				</p:dataTable>
			</p:panelGrid>
			
			<br/>
			</p:tab>

		</p:accordionPanel>

	  </h:form>
	</ui:define>
</ui:composition>
