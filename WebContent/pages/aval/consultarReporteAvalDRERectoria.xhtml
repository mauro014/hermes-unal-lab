<?xml version='1.0' encoding='ISO-8859-1' ?>
<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:t="http://myfaces.apache.org/tomahawk"
	xmlns:s="http://myfaces.apache.org/sandbox"
	template="../../templates/common.xhtml">
	<ui:define name="content">
		<h:form>
			<t:div styleClass="contenido-titulo-general-myriad">Reportes</t:div>
			<p:growl id="growl" showDetail="true" />
			<p:growl id="growl2" showDetail="true" />
			<p:tabView>
				<!-- 	Avales -->
				<p:tab title="Avales" titleStyle="font-size:12px"
					rendered="#{manejadorAutenticacion.esAvalDRE or manejadorAutenticacion.esConsulta}">
					<p:growl id="growl" showDetail="true" />
					<br />
					<p:accordionPanel>
						<p:tab title="Información detallada avales">
							<p:messages id="msgs" autoUpdate="true" showDetail="true"
								closable="true" />
							<br />
							<p:panelGrid styleClass="estilo-panelgrid-sinbordes">
								<p:row>
									<p:column colspan="6">
										<p:panel id="aclaracion">
											<h:outputText style="color:#FF8000;"
												value="El rango de fechas seleccionadas corresponde a las fechas de envío de las solicitudes de aval por parte de los docentes."></h:outputText>
										</p:panel>
										<br />
									</p:column>
								</p:row>
								<p:row>
									<p:column colspan="3">
										<h:outputText value="Fecha Inicial:" />
									</p:column>
									<p:column colspan="3">
										<p:calendar id="fechaInicial"
											value="#{manejadorAvalReporteCoord.fechaInicio}"
											mindate="28/02/14" readonlyInput="true" navigator="true"
											locale="es" />
									</p:column>
								</p:row>
								<p:row>
									<p:column colspan="3">
										<h:outputText value="Fecha Final:" />
									</p:column>
									<p:column colspan="3">
										<p:calendar id="fechaFinal"
											value="#{manejadorAvalReporteCoord.fechaFin}"
											mindate="28/02/14" readonlyInput="true" navigator="true"
											locale="es" />
									</p:column>
								</p:row>
								<p:row>
									<p:column colspan="6">
									</p:column>
								</p:row>
								<p:row>
									<p:column colspan="3">
										<h:outputText value="Tipo de Aval:" />
									</p:column>
									<p:column colspan="3">
										<p:selectCheckboxMenu id="siTipoAval"
											value="#{manejadorAvalReporteCoord.selectedTipoAval}"
											label="Seleccione tipo(s) de aval" panelStyle="width:250px">
											<f:selectItems
												value="#{manejadorAvalReporteCoord.tipoAvalItems}" />
										</p:selectCheckboxMenu>
									</p:column>
								</p:row>
								<p:row>
									<p:column colspan="6">
									</p:column>
								</p:row>
								<p:row>
									<p:column colspan="3">
										<h:outputText value="Estado Aval:" />
									</p:column>
									<p:column colspan="3">
										<p:selectCheckboxMenu id="siCategoriaAval"
											value="#{manejadorAvalReporteCoord.selectedEstados}"
											label="Seleccione estado(s)" panelStyle="width:250px">
											<f:selectItems
												value="#{manejadorAvalReporteCoord.estadoItems}" />
										</p:selectCheckboxMenu>
									</p:column>
								</p:row>
								<p:row>
									<p:column colspan="6">
									</p:column>
								</p:row>
								<p:row>
									<p:column colspan="6">
										<h:outputText value="Contenido del reporte:"
											style='font-weight: bold;' />
										<br />
										<h:outputText
											value="Seleccione la información que desea ver de los proyectos en el reporte." />
										<br />
										<br />
									</p:column>
								</p:row>
								<p:row>
									<p:column colspan="6">
									</p:column>
								</p:row>
								<p:row>
									<p:column>
										<p:selectBooleanCheckbox
											value="#{manejadorAvalReporteCoord.columns[0]}"></p:selectBooleanCheckbox>
									</p:column>
									<p:column>
										<h:outputText value="Nro. Aval" />
									</p:column>
									<p:column>
										<p:selectBooleanCheckbox
											value="#{manejadorAvalReporteCoord.columns[1]}"></p:selectBooleanCheckbox>
									</p:column>
									<p:column>
										<h:outputText value="Fecha Último Envío" />
									</p:column>
									<p:column>
										<p:selectBooleanCheckbox
											value="#{manejadorAvalReporteCoord.columns[2]}"></p:selectBooleanCheckbox>
									</p:column>
									<p:column>
										<h:outputText value="Tipo de Aval" />
									</p:column>
								</p:row>
								<p:row>
									<p:column>
										<p:selectBooleanCheckbox
											value="#{manejadorAvalReporteCoord.columns[3]}"></p:selectBooleanCheckbox>
									</p:column>
									<p:column>
										<h:outputText value="Estado de Aval" />
									</p:column>
									<p:column>
										<p:selectBooleanCheckbox
											value="#{manejadorAvalReporteCoord.columns[4]}"></p:selectBooleanCheckbox>
									</p:column>
									<p:column>
										<h:outputText value="Fechas de Revisión" />
									</p:column>
									<p:column>
										<p:selectBooleanCheckbox
											value="#{manejadorAvalReporteCoord.columns[5]}"></p:selectBooleanCheckbox>
									</p:column>
									<p:column>
										<h:outputText value="Convocatoria" />
									</p:column>
								</p:row>
								<p:row>
									<p:column>
										<p:selectBooleanCheckbox
											value="#{manejadorAvalReporteCoord.columns[6]}"></p:selectBooleanCheckbox>
									</p:column>
									<p:column>
										<h:outputText value="Número de la Convocatoria" />
									</p:column>
									<p:column>
										<p:selectBooleanCheckbox
											value="#{manejadorAvalReporteCoord.columns[7]}"></p:selectBooleanCheckbox>
									</p:column>
									<p:column>
										<h:outputText value="Fecha de Cierre de la Convocatoria" />
									</p:column>
									<p:column>
										<p:selectBooleanCheckbox
											value="#{manejadorAvalReporteCoord.columns[8]}"></p:selectBooleanCheckbox>
									</p:column>
									<p:column>
										<h:outputText value="Entidad Convocante" />
									</p:column>
								</p:row>
								<p:row>
									<p:column>
										<p:selectBooleanCheckbox
											value="#{manejadorAvalReporteCoord.columns[9]}"></p:selectBooleanCheckbox>
									</p:column>
									<p:column>
										<h:outputText value="Investigador" />
									</p:column>
									<p:column>
										<p:selectBooleanCheckbox
											value="#{manejadorAvalReporteCoord.columns[10]}"></p:selectBooleanCheckbox>
									</p:column>
									<p:column>
										<h:outputText value="Departamento" />
									</p:column>
									<p:column>
										<p:selectBooleanCheckbox
											value="#{manejadorAvalReporteCoord.columns[11]}"></p:selectBooleanCheckbox>
									</p:column>
									<p:column>
										<h:outputText value="Facultad" />
									</p:column>
								</p:row>
								<p:row>
									<p:column>
										<p:selectBooleanCheckbox
											value="#{manejadorAvalReporteCoord.columns[12]}"></p:selectBooleanCheckbox>
									</p:column>
									<p:column>
										<h:outputText value="Sede" />
									</p:column>
									<p:column>
										<p:selectBooleanCheckbox
											value="#{manejadorAvalReporteCoord.columns[13]}"></p:selectBooleanCheckbox>
									</p:column>
									<p:column>
										<h:outputText value="Información del Proyecto" />
									</p:column>
									<p:column>
										<p:selectBooleanCheckbox
											value="#{manejadorAvalReporteCoord.columns[14]}"></p:selectBooleanCheckbox>
									</p:column>
									<p:column>
										<h:outputText value="Valor Total" />
									</p:column>
								</p:row>
								<p:row>
									<p:column>
										<p:selectBooleanCheckbox
											value="#{manejadorAvalReporteCoord.columns[15]}"></p:selectBooleanCheckbox>
									</p:column>
									<p:column>
										<h:outputText value="Información de Grupo" />
									</p:column>
									<p:column>
										<p:selectBooleanCheckbox
											value="#{manejadorAvalReporteCoord.columns[16]}"></p:selectBooleanCheckbox>
									</p:column>
									<p:column>
										<h:outputText value="Valor Solicitado a Entidad Convocante" />
									</p:column>
									<p:column>
										<p:selectBooleanCheckbox
											value="#{manejadorAvalReporteCoord.columns[17]}"></p:selectBooleanCheckbox>
									</p:column>
									<p:column>
										<h:outputText value="Valor de Contrapartida - Personal UN" />
									</p:column>
								</p:row>
								<p:row>
									<p:column>
										<p:selectBooleanCheckbox
											value="#{manejadorAvalReporteCoord.columns[18]}"></p:selectBooleanCheckbox>
									</p:column>
									<p:column>
										<h:outputText value="Valor Contrapartida en Especie UN" />
									</p:column>
									<p:column>
										<p:selectBooleanCheckbox
											value="#{manejadorAvalReporteCoord.columns[19]}"></p:selectBooleanCheckbox>
									</p:column>
									<p:column>
										<h:outputText value="Valor Contrapartida en Efectivo UN" />
									</p:column>
									<p:column>
										<p:selectBooleanCheckbox
											value="#{manejadorAvalReporteCoord.columns[20]}"></p:selectBooleanCheckbox>
									</p:column>
									<p:column>
										<h:outputText value="Entidades Participantes del Proyecto" />
									</p:column>
								</p:row>
								<br />
								<br />
								<p:row>
									<p:column colspan="6" style="text-align:center">
										<p:commandButton
											action="#{manejadorAvalReporteCoord.imprimirReporteAvalesNacional}"
											value="Generar Reporte avales" ajax="false">
										</p:commandButton>
									</p:column>
								</p:row>
							</p:panelGrid>
						</p:tab>
						<p:tab title="Graficación datos nacionales">
							<p:panelGrid styleClass="estilo-panelgrid-sinbordes"
								id="reportes-vicerrectoria">

								<p:row>
									<p:column>
										<h:outputText
											value="Seleccione los datos que desea consultar:" />
									</p:column>
									<p:column>
										<p:selectOneMenu id="tipo-reporte"
											value="#{manejadorAvalReporteCoord.tipoReporteAval}"
											label="Seleccione reporte" panelStyle="width:250px">
											<f:selectItem itemLabel="" itemValue="" />
											<f:selectItems
												value="#{manejadorAvalReporteCoord.reportesAvalesItems}" />
											<p:ajax update="@form" process="@form" event="change"
												listener="#{manejadorAvalReporteCoord.opcionesReporteAval}" />
										</p:selectOneMenu>
									</p:column>
								</p:row>
								<p:row rendered="#{manejadorAvalReporteCoord.mostrarOpcionAno}">
									<p:column>
										<h:outputText value="Año para el reporte:" />
									</p:column>
									<p:column>
										<p:selectOneMenu id="ano-reporte" style="width:80px;"
											value="#{manejadorAvalReporteCoord.anoReporteAval}"
											panelStyle="width:50px">
											<f:selectItem itemLabel="" itemValue="" />
											<f:selectItems
												value="#{manejadorAvalReporteCoord.anosReporteItems}" />
										</p:selectOneMenu>
									</p:column>
								</p:row>
								<p:row id="sede"
									rendered="#{manejadorAvalReporteCoord.mostrarOpcionSede}">
									<p:column>
										<h:outputText value="Sede para el reporte:" />
									</p:column>
									<p:column>
										<p:selectOneMenu
											value="#{manejadorAvalReporteCoord.sedeSeleccionadaAval}"
											style="width:120px;">
											<f:selectItem itemLabel="" itemValue="" />
											<f:selectItems
												value="#{manejadorAvalReporteCoord.listaSedesItem}" />
										</p:selectOneMenu>
									</p:column>
								</p:row>
								<p:row>
									<p:column colspan="2" style="text-align:center">
										<br />
										<p:commandButton
											action="#{manejadorAvalReporteCoord.generarGraficoAvalesNacional}"
											value="Generar gráfico" ajax="false">
										</p:commandButton>
									</p:column>
								</p:row>
								<p:row rendered="#{manejadorAvalReporteCoord.reporteAvales}">
									<p:column colspan="2">
										<p:graphicImage
											value="#{manejadorAvalReporteCoord.graficoAvalesNacional}" />
									</p:column>
								</p:row>
								<p:row rendered="#{manejadorAvalReporteCoord.reporteAvales}">
									<p:column>
										<h:outputText value="Observaciones: " style='font-weight:bold' />
									</p:column>
									<p:column style="text-align:justify">
										<h:outputText
											value="#{manejadorAvalReporteCoord.indicador.observacion}" />
									</p:column>
								</p:row>
								<p:row
									rendered="#{manejadorAvalReporteCoord.reporteAvales and manejadorAvalReporteCoord.indicador.consultaDetalle!=null}">
									<p:column>
										<h:outputText value="Ver detalle: " style='font-weight:bold' />
									</p:column>
									<p:column>
										<h:commandLink value="Descargar archivo excel"
											action="#{manejadorAvalReporteCoord.descargarDetalleExcel}"
											style="text-decoration:none; 
										color: #16A8E2;
										font-weight: bold;">
										</h:commandLink>
									</p:column>
								</p:row>
							</p:panelGrid>
						</p:tab>
					</p:accordionPanel>
				</p:tab>
			</p:tabView>
			<p:messages id="msgs" autoUpdate="true" closable="true" />
		</h:form>
	</ui:define>
</ui:composition>
