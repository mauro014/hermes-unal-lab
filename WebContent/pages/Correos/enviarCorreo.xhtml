<?xml version='1.0' encoding='ISO-8859-1' ?>
<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:t="http://myfaces.apache.org/tomahawk"
	xmlns:s="http://myfaces.apache.org/sandbox"
	template="../../templates/common.xhtml">

<ui:define name="content">
<h:form>

<h:panelGrid columns="1" align="center">

  
 <h:panelGroup>
  		<!--   
  		<h:form id="MyForm" enctype="multipart/form-data" >
		-->					
			  <h:messages globalOnly="true" styleClass="message"/>
			  <h:outputText  value="Por medio de este recurso se pueden enviar avisos o advertencias a Investigadores" styleClass="mediana_f"/>
			  <fieldset style="background-color: #fbfbfb;"><LEGEND class="normal"><b>Mensaje de correo</b></LEGEND>
			  <h:panelGrid columns="2" border="0" cellspacing="5">          	
			  <h:outputText value="Cédula"/>   	                 
		   	   <h:inputText id="cedula" value="#{manejadorCorreos.cedula}"/>    	                      	                
				
			  <h:outputLabel for="myFileId" value="Adjuntar archivo: "/>
			      
			        
		        <t:inputFileUpload id="myFileId"
		            value="#{manejadorCorreos.archivo}"
		            storage="file"/>
			     
			   		   
			   <h:outputText value="Asunto"/>   	                 
		   	   <h:inputText id="Asunto" value="#{manejadorCorreos.correo.asunto}">    	                      	                
		   	     <f:validateLength maximum="255"/> 
		   	   </h:inputText>			   
			    <!--   -->
			   <h:outputText value="Contenido"/>
		       <h:inputTextarea id="Contenido" value="#{manejadorCorreos.correo.cuerpo}" rows="5" cols="40">
		         <f:validateLength minimum="0"/>
		         <f:validateLength maximum="2000"/>
		         </h:inputTextarea>     
	            <h:commandButton value="Enviar correo" action="#{manejadorCorreos.enviarCorreo}"/>   
		         <h:outputText/>
		         <h:outputText/> 			           			                  
			 </h:panelGrid>
			 </fieldset>	 
		<!--     			
	 </h:form> -->	
 </h:panelGroup>
 
</h:panelGrid>
 
		
</h:form>
</ui:define>
</ui:composition>
