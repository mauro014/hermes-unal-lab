<?xml version='1.0' encoding='ISO-8859-1' ?>
<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:t="http://myfaces.apache.org/tomahawk"
	xmlns:s="http://myfaces.apache.org/sandbox"
	template="../../templates/common.xhtml">

	<ui:define name="content">
		<h:form>

			<p:panel header="Configuración Boletín VRIE" id="panelEnvioBoletin">

				<p:panelGrid columns="1" style="width: 100%;"
					styleClass="estilo-panelgrid-sinbordes">
					<p:outputLabel value="Asunto:" for="Asunto" />
					<p:inputText id="Asunto" size="100"
						value="#{manejadorCorreoBoletin.asuntoBoletin}">
						<f:validateLength maximum="500" />
					</p:inputText>

					<p:outputLabel value="Contenido:" for="Contenido" />
					<p:inputTextarea id="Contenido" style="width: 100%;"
						value="#{manejadorCorreoBoletin.cuerpoBoletin}" rows="12"
						autoResize="false">
					</p:inputTextarea>
				</p:panelGrid>

				<p:messages autoUpdate="true" />

				<p:panelGrid columns="2" id="panel243111"
					styleClass="estilo-panelgrid-sinbordes">
					<h:outputLabel value="#{manejadorCorreoBoletin.progresoEnvio}" />
					<h:outputLabel value="#{manejadorCorreoBoletin.envioProfesores}" />
					<h:outputLabel value="#{manejadorCorreoBoletin.envioPosgrado}" />
					<h:outputLabel
						value="#{manejadorCorreoBoletin.envioAdministrativos}" />
					<h:outputLabel value="#{manejadorCorreoBoletin.envioPregrado}" />
					<h:outputLabel value="#{manejadorCorreoBoletin.envioOtros}" />
				</p:panelGrid>

				<p:panelGrid columns="2" id="panel256598"
					styleClass="estilo-panelgrid-sinbordes">
					<p:commandButton value="Cargar datos"
						action="#{manejadorCorreoBoletin.cargarCorreoBoletin}"
						update="panelEnvioBoletin" />
					<h:outputLabel value="" />

					<p:inputText id="direccionPrueba"
						value="#{manejadorCorreoBoletin.dirPrueba}">
						<f:validateLength maximum="255" />
					</p:inputText>

					<p:commandButton value="Prueba correo"
						action="#{manejadorCorreoBoletin.enviarBoletinPrueba}"
						update="panelEnvioBoletin" />
				</p:panelGrid>

				<p:panelGrid columns="7" id="panel300019"
					styleClass="estilo-panelgrid-sinbordes">
					<p:selectOneMenu
						value="#{manejadorCorreoBoletin.tipoCorreoPersona}">
						<f:selectItems
							value="#{manejadorCorreoBoletin.tipoCorreoPersonaItem}" />
					</p:selectOneMenu>

					<p:selectOneMenu value="#{manejadorCorreoBoletin.tipoCorreoSede}">
						<f:selectItems
							value="#{manejadorCorreoBoletin.tipoCorreoSedeItem}" />
					</p:selectOneMenu>

					<p:commandButton value="#{manejadorCorreoBoletin.nombreBoton}"
						action="#{manejadorCorreoBoletin.enviarCorreo}"
						update="panelEnvioBoletin" />
				</p:panelGrid>

			</p:panel>
			<br />
			<p:panel header="Suscripción al boletín" id="panelSuscripcion">
				<p:panelGrid styleClass="estilo-panelgrid-sinbordes">
				
					<p:row>
						<p:column>
							<h:outputText style="font-weight:bold;"
										value="Total personas en la lista otros:" />
						</p:column>
						<p:column>
							<h:outputText
										value="#{manejadorCorreoBoletin.totalListaOtros}" />
						</p:column>
					</p:row>
					<p:row>
						<p:column>
							<h:outputText style="font-weight:bold;"
										value="Total personas suscritas a través de los sitios web:" />
						</p:column>
						<p:column>
							<h:outputText
										value="#{manejadorCorreoBoletin.totalSuscritos}" />
						</p:column>
					</p:row>
			
				</p:panelGrid>
			</p:panel>

		</h:form>
	</ui:define>
</ui:composition>
