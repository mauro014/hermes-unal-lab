<?xml version='1.0' encoding='ISO-8859-1' ?>
<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:t="http://myfaces.apache.org/tomahawk"
	xmlns:s="http://myfaces.apache.org/sandbox"
	template="../../templates/common.xhtml">

	<ui:define name="content">
		<h:form id="formEnviarAlertasCompromisos">
			<p:panel header="Envío de Alertas Compromisos">
				<p:panelGrid columns="1" styleClass="estilo-panelgrid-sinbordes">

					<p:dialog header="Enviando Alertas" widgetVar="dlg"
						resizable="false" closable="false" modal="true">
						<p:graphicImage value="/images/ajaxloading.gif" />
						Por favor espere...
					</p:dialog>

					<p:commandButton value="Enviar Alertas" onstart="dlg.show()"
						oncomplete="dlg.hide()"
						action="#{manejadorEnviarAlertasCompromisos.enviarAlertas}">
					</p:commandButton>

					<p:messages id="messageResultadoEnvio" autoUpdate="true" />
				</p:panelGrid>
			</p:panel>
		</h:form>
	</ui:define>
</ui:composition>
