<?xml version='1.0' encoding='ISO-8859-1' ?>
<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:t="http://myfaces.apache.org/tomahawk"
	xmlns:s="http://myfaces.apache.org/sandbox"
	template="../../templates/common.xhtml">

	<ui:define name="content">
		<h:form id="formEDS" enctype="multipart/form-data">
			<t:div styleClass="contenido-titulo-general-myriad">Certificaciones Investigador</t:div>

			<br />

			<p:panel id="panelRegistro" header="Información del docente">

				<h:panelGrid columns="1" cellpadding="5" cellspacing="5"
					align="center">
					<h:outputText
						value="Por favor ingrese los datos del investigador del que desea generar el reporte de participación en proyectos de investigación: " />
				</h:panelGrid>

				<br />

				<h:panelGrid columns="2" cellpadding="5" cellspacing="5"
					align="center">

					<h:outputText value="Tipo de documento" />
					<p:selectOneMenu
						value="#{ManejadorCertificacionesInvestigadoresVIF.tipoDocumento.id}">
						<f:selectItems
							value="#{ManejadorCertificacionesInvestigadoresVIF.tipoDocumentoItem}" />
					</p:selectOneMenu>

					<h:outputText value="Número de documento" />
					<p:inputText id="Numero"
						value="#{ManejadorCertificacionesInvestigadoresVIF.documento}" size="20">
					</p:inputText>

					<h:outputText />
					<p:commandButton value="Continuar" icon="ui-icon-search"
						onstart="dialogEspere.show()" oncomplete="dialogEspere.hide()"
						action="#{ManejadorCertificacionesInvestigadoresVIF.irGenerarCertificaciones}" />
				</h:panelGrid>

				<br />
			</p:panel>

			<br />

			<center>
				<h:panelGrid columns="1" id="panelSalir">

					<p:commandButton value="Ir al inicio" id="botonInicio"
						action="#{ManejadorCertificacionesInvestigadoresVIF.irInicio}"
						styleClass="ui-priority-primary" />

				</h:panelGrid>
			</center>

			<br />
			<p:messages id="msgs" autoUpdate="true" closable="true" />
			<br />

		</h:form>

	</ui:define>
</ui:composition>
