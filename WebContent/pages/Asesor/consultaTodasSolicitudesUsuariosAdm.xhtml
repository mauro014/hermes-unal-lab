<?xml version='1.0' encoding='ISO-8859-1' ?>
<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:t="http://myfaces.apache.org/tomahawk"
	xmlns:s="http://myfaces.apache.org/sandbox"
	template="../../templates/common.xhtml">

	<ui:define name="content">
		<h:form>

			<!-- -->
			<t:div styleClass="contenido-titulo-general-myriad">Consulta Solicitudes Asignación de Roles Hermes</t:div>
			<t:div styleClass="estilo-propio" id="panelPropio">


				<p:dataTable var="solRegistradas"
					emptyMessage="No existen resultados de la consulta"
					value="#{manejadorConsultarSolicitudesUsuario.listaSolicitudes}"
					paginator="true" paginatorposition="bottom" rows="20">


					<p:column headerText="No.">
						<h:outputText value="#{solRegistradas.id}"
							style=' font-weight: bold;' />
					</p:column>
					
					<p:column headerText="Usuario">
						<h:outputText
							value="#{solRegistradas.nombre1} #{solRegistradas.apellido1}" />
					</p:column>

					<p:column headerText="Dependencia">
						<h:outputText value="#{solRegistradas.dependencia.nombre}" />
					</p:column>
					
					<p:column headerText="Fecha" sortBy="#{solicitud.fechaSolicitud}">
						<h:outputText value="#{solRegistradas.fechaSolicitud}" />
					</p:column>
					
					<p:column headerText="Estado">
						<h:outputText value="#{solRegistradas.nombreEstadoSol}"
							style=' font-weight: bold;' />
					</p:column>

					<p:column rendered="false">

						<f:facet name="header">
							<h:outputText value="Consultar" />
						</f:facet>
					
						<p:commandButton action="#{manejadorConsultarSolicitudesUsuario.consultarSolicitudU}"
							icon="ui-icon-search" ajax="false">
							<f:setPropertyActionListener value="#{solRegistradas}"
								target="#{manejadorConsultarSolicitudesUsuario.solicitudSeleccionada}" />
						</p:commandButton>
					</p:column>
					
					<p:column headerText="Revisar">
						<p:commandButton rendered="#{solRegistradas.estadoSol eq 'P'}"
							action="#{manejadorConsultarSolicitudesUsuario.administrar}"
							icon="ui-icon-pencil" ajax="false">
							<f:setPropertyActionListener value="#{solRegistradas}"
								target="#{manejadorConsultarSolicitudesUsuario.solicitudSeleccionada}" />
						</p:commandButton>
					</p:column>

				</p:dataTable>

			</t:div>

		</h:form>
	</ui:define>
</ui:composition>
