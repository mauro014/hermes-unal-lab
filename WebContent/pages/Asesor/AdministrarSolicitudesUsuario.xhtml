<?xml version='1.0' encoding='ISO-8859-1' ?>
<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:t="http://myfaces.apache.org/tomahawk"
	xmlns:s="http://myfaces.apache.org/sandbox"
	template="../../templates/common.xhtml">
	<ui:define name="content">
		<h:form id="form">
			<t:div styleClass="contenido-titulo-general-myriad">Solicitud de Asignación de Roles</t:div>
			
			 <p:panel id="panelInformacion" header="INFORMACIÓN DE LA SOLICITUD"
   			 	toggleable="false" >
   			 	<br />
   			 	 <p:panelGrid columns="2" cellpadding="5" cellspacing="5"
  							 id="infoSolicitante"
  							 styleClass="estilo-panelgrid-sinbordes">
  						<h:outputText value="Identificador de la solicitud:" style="font-weight: bold;"/>
  						<h:outputText value="#{manejadorAdministrarSolicitudesUsuario.solicitudadmin.id}" />
  						<h:outputText value="Fecha de la solicitud:" style="font-weight: bold;"/>
  						<h:outputText value="#{manejadorAdministrarSolicitudesUsuario.solicitudadmin.fechaSolicitud}" />
  						<h:outputText value="Nombre del solicitante:" style="font-weight: bold;"/>
  						<h:outputText value="#{manejadorAdministrarSolicitudesUsuario.solicitudadminSol.nombre1} 
  											#{manejadorAdministrarSolicitudesUsuario.solicitudadminSol.nombre2}
  										    #{manejadorAdministrarSolicitudesUsuario.solicitudadminSol.apellido1}  
  										    #{manejadorAdministrarSolicitudesUsuario.solicitudadminSol.apellido2}" />
  						<h:outputText value="Correo del solicitante:" style="font-weight: bold;"/>
  						<h:outputText value="#{manejadorAdministrarSolicitudesUsuario.solicitudadminSol.email}" />
  						<h:outputText value="Observaciones del solicitante:" style="font-weight: bold;"/>
  						<p:inputTextarea rows="5" cols="60"
								value="#{manejadorAdministrarSolicitudesUsuario.solicitudadmin.observaciones}" autoresize="false"
								disabled="true" />
  				</p:panelGrid>   			 
   			 	<br />
   			 	<p:panelGrid columns="2" cellpadding="5" cellspacing="5"
  							 id="infoSolicitante"
  							 styleClass="estilo-panelgrid-sinbordes">
  						<h:outputText value="Nombre del usuario:" style="font-weight: bold;"/>
  						<h:outputText value="#{manejadorAdministrarSolicitudesUsuario.solicitudadmin.nombre1} 
  											#{manejadorAdministrarSolicitudesUsuario.solicitudadmin.nombre2} 
  											#{manejadorAdministrarSolicitudesUsuario.solicitudadmin.apellido1} 
  											 #{manejadorAdministrarSolicitudesUsuario.solicitudadmin.apellido2}" />
  						<h:outputText value="Identificación del usuario:" style="font-weight: bold;"/>
  						<h:outputText value="#{manejadorAdministrarSolicitudesUsuario.solicitudadmin.usuarioTipoDocumento} 
  										    #{manejadorAdministrarSolicitudesUsuario.solicitudadmin.usuarioDocumento}" />
  						<h:outputText value="Correo del usuario:" style="font-weight: bold;"/>
  						<h:outputText value=" #{manejadorAdministrarSolicitudesUsuario.solicitudadmin.email}" />
  						<h:outputText value="Dependencia del usuario:" style="font-weight: bold;"/>
  						<h:outputText value=" #{manejadorAdministrarSolicitudesUsuario.solicitudadmin.dependencia.nombre}" />  
  						<h:outputText value="Vigencia de los roles del usuario:" style="font-weight: bold;"/>
  						<h:outputText value=" #{manejadorAdministrarSolicitudesUsuario.solicitudadmin.fechaFin}" />						
  				</p:panelGrid>   			 
   			 	<br />
   			 </p:panel>
			
			<br />
			 <p:panel id="panelInformacion" header="INFORMACIÓN DE LOS ROLES DEL USUARIO"
   			 	toggleable="false" >
   			 	<p:dataTable var="roles"
					emptyMessage="No existen resultados de la Consulta"
					style="margin-top: 20px;"
					value="#{manejadorAdministrarSolicitudesUsuario.listaRoles}">
					<p:column headerText="Rol">
						<h:outputText value="#{roles.rol.nombre}" />
					</p:column>
					<p:column headerText="Acción">
						<h:outputText value=" #{roles.nombreAccion}" />
					</p:column>
				</p:dataTable>
			<br />
			</p:panel>
			
			
			<br />
			<h:outputText value="Observaciones:" style="text-align:left; font-weight: bold;" />
			<br /><br />
			<p:inputTextarea rows="5" cols="90" autoresize="false"
					value="#{manejadorAdministrarSolicitudesUsuario.observacion}" />
			<br />
			
			<br />
			<div align="center">
				<p:commandButton ajax="false"
					action="#{manejadorAdministrarSolicitudesUsuario.aprobarSolicitud}"
					value="APROBAR" style="width:100px">
				</p:commandButton>

				<p:commandButton ajax="false"
					action="#{manejadorAdministrarSolicitudesUsuario.negarSolicitud}"
					value="NEGAR" style="width:100px">
				</p:commandButton>
			</div>
			<BR />
			<p:panel>
				<p:messages id="msgs" closable="true" />
			</p:panel>
		</h:form>
	</ui:define>
</ui:composition>
