<?xml version='1.0' encoding='ISO-8859-1' ?>
<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:t="http://myfaces.apache.org/tomahawk"
	xmlns:s="http://myfaces.apache.org/sandbox"
	template="../../templates/common.xhtml">

	<ui:define name="content">
		<h:form>

			<!-- -->

			<t:div styleClass="contenido-titulo-general-myriad">Consulta Solicitudes Creación de Usuarios Hermes</t:div>
			<t:div styleClass="estilo-propio" id="panelPropio">


				<p:dataTable var="solRegistradas"
					emptyMessage="No existen resultados de la Consulta"
					value="#{ManejadorConsultarSolicitudUsuario.solicitudULista}">


					<p:column>
						<f:facet name="header">
							<h:outputText value="#" />
						</f:facet>


						<h:outputText value="#{solRegistradas.id}"
							style=' font-weight: bold;' />

					</p:column>
					
					<p:column>
						<f:facet name="header">
							<h:outputText value="Usuario" />
						</f:facet>

						<h:outputText
							value="#{solRegistradas.nombre1} #{solRegistradas.nombre2}" />
						<br />
						<h:outputText
							value="#{solRegistradas.apellido1} #{solRegistradas.apellido2}" />
					</p:column>

					<p:column>
						<f:facet name="header">
							<h:outputText value="Dependencia" />
						</f:facet>
						<br />
						<h:outputText value="#{solRegistradas.dependencia.nombre}" />

					</p:column>
					
					<p:column>
						<f:facet name="header">
							<h:outputText value="Estado" />
						</f:facet>


						<h:outputText value="#{solRegistradas.nombreEstadoSol}"
							style=' font-weight: bold;' />

					</p:column>

					<p:column>

						<f:facet name="header">
							<h:outputText value="Consultar/Editar" />
						</f:facet>

						<p:commandButton rendered="#{solRegistradas.estadoSol eq 'I'}"
							action="#{ManejadorConsultarSolicitudUsuario.editarSolicitudU}"
							icon="ui-icon-pencil" ajax="false">
							<f:setPropertyActionListener value="#{solRegistradas}"
								target="#{ManejadorConsultarSolicitudUsuario.solicitudSeleccionada}" />
						</p:commandButton>
						
						<p:commandButton rendered="#{solRegistradas.estadoSol eq 'P'}"
							action="#{ManejadorConsultarSolicitudUsuario.consultarSolicitudU}"
							icon="ui-icon-search" ajax="false">
							<f:setPropertyActionListener value="#{solRegistradas}"
								target="#{ManejadorConsultarSolicitudUsuario.solicitudSeleccionada}" />
						</p:commandButton>

						<p:commandButton rendered="#{solRegistradas.estadoSol eq 'A'}"
							action="#{ManejadorConsultarSolicitudUsuario.consultarSolicitudU}"
							icon="ui-icon-check" ajax="false">
							<f:setPropertyActionListener value="#{solRegistradas}"
								target="#{ManejadorConsultarSolicitudUsuario.solicitudSeleccionada}" />
						</p:commandButton>
						
						<p:commandButton rendered="#{solRegistradas.estadoSol eq 'N'}"
							action="#{ManejadorConsultarSolicitudUsuario.consultarSolicitudU}"
							icon="ui-icon-close" ajax="false">
							<f:setPropertyActionListener value="#{solRegistradas}"
								target="#{ManejadorConsultarSolicitudUsuario.solicitudSeleccionada}" />
						</p:commandButton>


					</p:column>

				</p:dataTable>

			</t:div>

		</h:form>
	</ui:define>
</ui:composition>
