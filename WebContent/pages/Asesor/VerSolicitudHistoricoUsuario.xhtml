<?xml version='1.0' encoding='ISO-8859-1' ?>
<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:t="http://myfaces.apache.org/tomahawk"
	xmlns:s="http://myfaces.apache.org/sandbox"
	template="../../templates/common.xhtml">
	<ui:define name="content">
		<h:form id="form">
		
		<t:div styleClass="contenido-titulo-general-myriad">Solicitud Revisada de Asignación de Rol</t:div>
			
			 <p:panel id="panelInformacion" header="INFORMACIÓN DE LA SOLICITUD"
   			 	toggleable="false" >
   			 	<br />
   			 	 <p:panelGrid columns="2" cellpadding="5" cellspacing="5"
  							 id="infoSolicitante"
  							 styleClass="estilo-panelgrid-sinbordes">
  						<h:outputText value="Identificador de la solicitud:" style="font-weight: bold;"/>
  						<h:outputText value="#{manejadorVerSolicitudHistoricoUsuario.solicitudadmin.id}" />
  						<h:outputText value="Acción de la solicitud:" style="font-weight: bold;"/>
  						<h:outputText value="#{manejadorVerSolicitudHistoricoUsuario.solicitudadmin.nombreEstadoSol}" />
  						<h:outputText value="Fecha de registro:" style="font-weight: bold;"/>
  						<h:outputText value="#{manejadorVerSolicitudHistoricoUsuario.solicitudadmin.fechaSolicitud}" />
  						<h:outputText value="Fecha de aprobación:" style="font-weight: bold;"/>
  						<h:outputText value="#{manejadorVerSolicitudHistoricoUsuario.solicitudadmin.fechaAprobacion}" />
  						<h:outputText value="Responsable de aprobación:" style="font-weight: bold;"/>
  						<h:outputText value="#{manejadorVerSolicitudHistoricoUsuario.solicitudResponsable.nombre1} 
  											#{manejadorVerSolicitudHistoricoUsuario.solicitudResponsable.nombre2}
  										    #{manejadorVerSolicitudHistoricoUsuario.solicitudResponsable.apellido1}  
  										    #{manejadorVerSolicitudHistoricoUsuario.solicitudResponsable.apellido2}" />
  						<h:outputText value="Comentarios:" style="font-weight: bold;"/>
  						<p:inputTextarea rows="5" cols="60"
								value="#{manejadorVerSolicitudHistoricoUsuario.solicitudadmin.comentarios}" autoresize="false"
								disabled="true" />
  					
  					</p:panelGrid>   			 
	   			 	
	   			 	<br />
	   			 	<p:panelGrid columns="2" cellpadding="5" cellspacing="5"
	  							 id="infoSolicitante1"
	  							 styleClass="estilo-panelgrid-sinbordes">
  						<h:outputText value="Datos del solicitante" style="font-weight: bold;"/>
  						<h:outputText value="" style="font-weight: bold;"/>
  						<h:outputText value="Nombre del solicitante:" style="font-weight: bold;"/>
  						<h:outputText value="#{manejadorVerSolicitudHistoricoUsuario.solicitudadminSol.nombre1} 
  											#{manejadorVerSolicitudHistoricoUsuario.solicitudadminSol.nombre2}
  										    #{manejadorVerSolicitudHistoricoUsuario.solicitudadminSol.apellido1}  
  										    #{manejadorVerSolicitudHistoricoUsuario.solicitudadminSol.apellido2}" />
  						<h:outputText value="Identificación del solicitante:" style="font-weight: bold;"/>
  						<h:outputText value="#{manejadorVerSolicitudHistoricoUsuario.solicitudadmin.solicTipoDocumento} 
  										    #{manejadorVerSolicitudHistoricoUsuario.solicitudadmin.solicDocumento}" />
  						<h:outputText value="Correo del solicitante:" style="font-weight: bold;"/>
  						<h:outputText value="#{manejadorVerSolicitudHistoricoUsuario.solicitudadminSol.email}" />
  						<h:outputText value="Dependencia del solicitante:" style="font-weight: bold;"/>
  						<h:outputText value="#{manejadorVerSolicitudHistoricoUsuario.solicitudadminSol.dependencia.nombre}" />
  						<h:outputText value="Observaciones del solicitante:" style="font-weight: bold;"/>
  						<p:inputTextarea rows="5" cols="60"
								value="#{manejadorVerSolicitudHistoricoUsuario.solicitudadmin.observaciones}" autoresize="false"
								disabled="true" />
  				</p:panelGrid>   			 
   			 	
   			 	<br />
   			 	<p:panelGrid columns="2" cellpadding="5" cellspacing="5"
  							 id="infoSolicitante"
  							 styleClass="estilo-panelgrid-sinbordes">
  						<h:outputText value="Datos del usuario (asignación roles)" style="font-weight: bold;"/>
  						<h:outputText value="" style="font-weight: bold;"/>
  						<h:outputText value="Nombre del usuario:" style="font-weight: bold;"/>
  						<h:outputText value="#{manejadorVerSolicitudHistoricoUsuario.solicitudadmin.nombre1} 
  											#{manejadorVerSolicitudHistoricoUsuario.solicitudadmin.nombre2} 
  											#{manejadorVerSolicitudHistoricoUsuario.solicitudadmin.apellido1} 
  											 #{manejadorVerSolicitudHistoricoUsuario.solicitudadmin.apellido2}" />
  						<h:outputText value="Identificación del usuario:" style="font-weight: bold;"/>
  						<h:outputText value="#{manejadorVerSolicitudHistoricoUsuario.solicitudadmin.usuarioTipoDocumento} 
  										    #{manejadorVerSolicitudHistoricoUsuario.solicitudadmin.usuarioDocumento}" />
  						<h:outputText value="Correo del usuario:" style="font-weight: bold;"/>
  						<h:outputText value=" #{manejadorVerSolicitudHistoricoUsuario.solicitudadmin.email}" />
  						<h:outputText value="Dependencia del usuario:" style="font-weight: bold;"/>
  						<h:outputText value=" #{manejadorVerSolicitudHistoricoUsuario.solicitudadmin.dependencia.nombre}" />  						
  				</p:panelGrid>   			 
   			 	<br />
   			 </p:panel>
			
			<br />
			<p:panel id="panelInformacion" header="INFORMACIÓN DE LOS ROLES DEL USUARIO"
   			 	toggleable="false" >
   			 	<p:dataTable var="roles"
					emptyMessage="No existen resultados de la Consulta"
					style="margin-top: 20px;"
					value="#{manejadorVerSolicitudHistoricoUsuario.listaRoles}">
					<p:column headerText="Rol">
						<h:outputText value="#{roles.rol.nombre}" />
					</p:column>
					<p:column headerText="Acción">
						<h:outputText value=" #{roles.nombreAccion}" />
					</p:column>
				</p:dataTable>
			<br />
			</p:panel>
			
			<br />
			<div align="center">
				<p:commandButton ajax="false"
					action="#{manejadorVerSolicitudHistoricoUsuario.regresarSolicitud}"
					value="REGRESAR">
				</p:commandButton>

			</div>
		</h:form>
	</ui:define>
</ui:composition>
