<?xml version='1.0' encoding='ISO-8859-1' ?>
<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:t="http://myfaces.apache.org/tomahawk"
	xmlns:s="http://myfaces.apache.org/sandbox"
	template="../../../../templates/common.xhtml">
	<ui:define name="content">
		<h:form>
			<t:div styleClass="contenido-titulo-general-myriad">Solicitudes de Semilleros - UAB</t:div>
			<p:messages id="msgs" />
			<p:dataTable var="solicitud"
				emptyMessage="No tiene solicitudes de semilleros para aprobar."
				paginator="true"
				value="#{manejadorSemillerosSolicitudUAB.listaSolicitudes}"
				rows="10" paginatorPosition="bottom">
				<f:facet name="header">Solicitudes para aprobar: #{manejadorSemillerosSolicitudUAB.totalSolicitudes}</f:facet>
				<p:column headerText="Datos de Semillero">
					<h:outputText
						value="&lt;strong&gt;ID: &lt;/strong&gt; #{solicitud.semillero.id}"
						escape="false" />
					<br />
					<h:outputText
						value="&lt;strong&gt;Nombre: &lt;/strong&gt; #{solicitud.semillero.nombre}"
						escape="false" />
					<br />
					<h:outputText
						value="&lt;strong&gt;Solicitante: &lt;/strong&gt; #{solicitud.semillero.lider.nombreCompleto}"
						escape="false" />
				</p:column>
				<p:column headerText="Datos de Solicitud">
					<h:outputText
						value="&lt;strong&gt;Tipo: &lt;/strong&gt; #{solicitud.tipo.nombre}"
						escape="false" />
					<br />
					<h:outputText
						value="&lt;strong&gt;Fecha Solicitud: &lt;/strong&gt; #{solicitud.fechaSolicitud}"
						escape="false" />
				</p:column>
				<p:column style="text-align: center;" headerText="Acciones">
					<p:commandButton value="Revisar Solicitud"
						oncomplete="dlgPrincipal.show();" icon="ui-icon-search"
						action="#{manejadorSemillerosSolicitudUAB.cargarSolicitud}"
						update="@form">
						<f:setPropertyActionListener value="#{solicitud}"
							target="#{manejadorSemillerosSolicitudUAB.solicitudActual}" />
					</p:commandButton>
				</p:column>
			</p:dataTable>
			<p:messages id="msgs" />
			<p:dialog widgetVar="dlgPrincipal" modal="true" resizable="false"
				id="dlgPrincipal" width="800"
				header="Aprobar Solicitud - #{manejadorSemillerosSolicitudUAB.solicitudActual.tipo.nombre}">
				<t:div styleClass="panel-interno-tabla" id="frmDialog"
					style="max-height:460px; overflow: auto;">
					<p:panelGrid style="width: 100%;"
						styleClass="estilo-panelgrid-sinbordes">
						<p:row>
							<p:column>ID de Semillero:</p:column>
							<p:column>
								<h:outputText
									value="#{manejadorSemillerosSolicitudUAB.solicitudActual.semillero.id}" />
							</p:column>
							<p:column rowspan="3" style="text-align: center;">
								<h:commandLink value="Ver reporte de semillero (PDF)"
									action="#{manejadorSemillerosSolicitudUAB.reporteSemillero}"
									target="_popUpWindow1"
									onclick="javascript: void window.open('', '_popUpWindow1', 'status=0,toolbar=0,location=0,menubar=0,directories=0,resizable,width=750,height=500,scrollbars,left=0,top=0');"
									style="text-decoration:none; 
										color: #16A8E2;
										font-weight: bold;">
								</h:commandLink>
							</p:column>
						</p:row>
						<p:row>
							<p:column>ID de Solicitud:</p:column>
							<p:column>
								<h:outputText
									value="#{manejadorSemillerosSolicitudUAB.solicitudActual.id}" />
							</p:column>
						</p:row>
						<p:row>
							<p:column>Nombre:</p:column>
							<p:column>
								<h:outputText
									value="#{manejadorSemillerosSolicitudUAB.solicitudActual.semillero.nombre}" />
							</p:column>
						</p:row>
						<p:row
							rendered="#{manejadorSemillerosSolicitudUAB.solicitudActual.tipo.id eq 2}">
							<p:column>Nuevo Estado del Semillero:</p:column>
							<p:column>
								<h:outputText
									value="#{manejadorSemillerosSolicitudUAB.nuevoEstado}" />
							</p:column>
						</p:row>
						<p:row
							rendered="#{manejadorSemillerosSolicitudUAB.solicitudActual.tipo.id eq 1}">
							<p:column colspan="3">
								<p:dataTable style="border:none; margin-top: 10px;"
									var="archivo"
									value="#{manejadorSemillerosSolicitudUAB.solicitudActual.semillero.listaArchivos}"
									emptyMessage="No hay archivos asociados para este semillero."
									paginator="true" rows="5" paginatorPosition="bottom"
									paginatorTemplate="{CurrentPageReport}  {FirstPageLink} {PreviousPageLink} {PageLinks} {NextPageLink} {LastPageLink} {RowsPerPageDropdown}">
									<p:column>
										<f:facet name="header">
											<h:outputText value="Archivos asociados al Semillero" />
										</f:facet>
										<h:outputText value="#{archivo.nombre}" />
									</p:column>
									<p:column>
										<p:commandButton
											action="#{manejadorSemillerosSolicitudUAB.descargarArchivo}"
											icon="ui-icon-search" title="Descargar" ajax="false"
											onstart="dialogEspere.show()"
											oncomplete="dialogEspere.hide()">
											<f:setPropertyActionListener value="#{archivo}"
												target="#{manejadorSemillerosSolicitudUAB.archivoActual}" />
										</p:commandButton>
									</p:column>
								</p:dataTable>
							</p:column>
						</p:row>
						<p:row
							rendered="#{manejadorSemillerosSolicitudUAB.solicitudActual.tipo.id eq 2}">
							<p:column colspan="3">
								<p:dataTable style="border:none; margin-top: 10px;"
									var="archivo"
									value="#{manejadorSemillerosSolicitudUAB.solicitudActual.listaArchivosSolicitud}"
									emptyMessage="No hay archivos asociados para este semillero."
									paginator="true" rows="5" paginatorPosition="bottom"
									paginatorTemplate="{CurrentPageReport}  {FirstPageLink} {PreviousPageLink} {PageLinks} {NextPageLink} {LastPageLink} {RowsPerPageDropdown}">
									<p:column>
										<f:facet name="header">
											<h:outputText value="Archivos asociados al Semillero" />
										</f:facet>
										<h:outputText value="#{archivo.nombre}" />
									</p:column>
									<p:column>
										<p:commandButton
											action="#{manejadorSemillerosSolicitudUAB.descargarArchivo}"
											icon="ui-icon-search" title="Descargar" ajax="false"
											onstart="dialogEspere.show()"
											oncomplete="dialogEspere.hide()">
											<f:setPropertyActionListener value="#{archivo}"
												target="#{manejadorSemillerosSolicitudUAB.archivoActual}" />
										</p:commandButton>
									</p:column>
								</p:dataTable>
							</p:column>
						</p:row>
					</p:panelGrid>
					<p:panelGrid style="width: 100%;" id="panRespuestaSol"
						styleClass="estilo-panelgrid-sinbordes">
						<p:row>
							<p:column colspan="2">
								<p:messages id="msgsModal" />
							</p:column>
						</p:row>
						<p:row>
							<p:column>Respuesta:</p:column>
							<p:column>
								<p:selectOneMenu styleClass="selectGrupo"
									value="#{manejadorSemillerosSolicitudUAB.solicitudActual.respuestaUAB.id}">
									<f:selectItems
										value="#{manejadorSemillerosSolicitudUAB.respuestasSolicitud}" />
									<p:ajax update="panRespuestaSol" process="panRespuestaSol" />
								</p:selectOneMenu>
							</p:column>
						</p:row>
						<p:row
							rendered="#{manejadorSemillerosSolicitudUAB.solicitudActual.respuestaUAB.id eq 2 or manejadorSemillerosSolicitudUAB.solicitudActual.respuestaUAB.id eq 4}">
							<p:column>Observaciones:</p:column>
							<p:column>
								<p:inputTextarea style="width: 100%;"
									value="#{manejadorSemillerosSolicitudUAB.solicitudActual.comentariosUAB}"
									counter="outObservaciones" maxlength="4000"
									counterTemplate="{0} caracteres restantes." autoResize="false" />
								<h:outputText id="outObservaciones" />
							</p:column>
						</p:row>
						<p:row
							rendered="#{manejadorSemillerosSolicitudUAB.solicitudActual.respuestaUAB.id eq 3}">
							<p:column
								rendered="#{manejadorSemillerosSolicitudUAB.solicitudActual.tipo.id eq 1}">Pertinencia de la creación del semillero:</p:column>
							<p:column
								rendered="#{manejadorSemillerosSolicitudUAB.solicitudActual.tipo.id ne 1}">Observaciones:</p:column>
							<p:column>
								<p:inputTextarea style="width: 100%;"
									value="#{manejadorSemillerosSolicitudUAB.solicitudActual.comentariosUAB}"
									counter="outObservaciones" maxlength="4000"
									counterTemplate="{0} caracteres restantes." autoResize="false" />
								<h:outputText id="outObservaciones" />
							</p:column>
						</p:row>
						<p:row
							rendered="#{manejadorSemillerosSolicitudUAB.solicitudActual.respuestaUAB.id != 1 and manejadorSemillerosSolicitudUAB.solicitudActual.tipo.id eq 1}">
							<p:column colspan="2">
								<p:fileUpload
									fileUploadListener="#{manejadorSemillerosSolicitudUAB.agregarArchivo}"
									mode="advanced" update="panRespuestaSol" auto="true"
									process="panRespuestaSol"
									sizeLimit="#{manejadorBase.maximoTamanoArchivos}"
									label="Incluir Archivo de Soporte">
								</p:fileUpload>
							</p:column>
						</p:row>
						<p:row
							rendered="#{manejadorSemillerosSolicitudUAB.solicitudActual.respuestaUAB.id != 1 and manejadorSemillerosSolicitudUAB.solicitudActual.tipo.id eq 1}">
							<p:column colspan="2">
								<p:dataTable style="border:none; margin-top: 10px;"
									var="archivo" id="dtbArchivosSol"
									value="#{manejadorSemillerosSolicitudUAB.solicitudActual.listaArchivosUAB}"
									emptyMessage="No hay un archivos vinculados a la respuesta de solicitud."
									paginator="true" rows="5" paginatorPosition="bottom"
									paginatorTemplate="{CurrentPageReport}  {FirstPageLink} {PreviousPageLink} {PageLinks} {NextPageLink} {LastPageLink} {RowsPerPageDropdown}">
									<p:column>
										<f:facet name="header">
											<h:outputText value="Archivos de soporte incluidos" />
										</f:facet>
										<h:outputText value="#{archivo.nombre}" />
									</p:column>
									<p:column>
										<p:commandButton
											action="#{manejadorSemillerosSolicitudUAB.descargarArchivoSol}"
											icon="ui-icon-search" title="Descargar"
											onstart="dialogEspere.show()"
											oncomplete="dialogEspere.hide()">
											<f:setPropertyActionListener value="#{archivo}"
												target="#{manejadorSemillerosSolicitudUAB.archivoSolActual}" />
										</p:commandButton>
										<p:commandButton
											action="#{manejadorSemillerosSolicitudUAB.eliminarArchivoSol}"
											update="dtbArchivosSol" icon="ui-icon-trash" title="Eliminar"
											onstart="dialogEspere.show()"
											oncomplete="dialogEspere.hide()">
											<f:setPropertyActionListener value="#{archivo}"
												target="#{manejadorSemillerosSolicitudUAB.archivoSolActual}" />
										</p:commandButton>
									</p:column>
								</p:dataTable>
							</p:column>
						</p:row>
						<p:row
							rendered="#{manejadorSemillerosSolicitudUAB.solicitudActual.respuestaUAB.id != 1}">
							<p:column colspan="2" style="text-align: center;">
								<p:commandButton
									action="#{manejadorSemillerosSolicitudUAB.actualizarSolicitud}"
									update="panRespuestaSol" process="panRespuestaSol"
									icon="ui-icon-disk" value="Actualizar Solicitud">
								</p:commandButton>
							</p:column>
						</p:row>
					</p:panelGrid>
				</t:div>
				<p:ajax event="close" update="@form"
					listener="#{manejadorSemillerosSolicitudUAB.validarFinalizado}" />
			</p:dialog>
			<p:dialog widgetVar="dialogEspere" resizable="false" closable="false"
				modal="true">
				<p:graphicImage value="/images/ajaxloading.gif" />
   					 Por favor espere...
   	 			</p:dialog>
		</h:form>
	</ui:define>
</ui:composition>
