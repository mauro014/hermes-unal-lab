<?xml version='1.0' encoding='ISO-8859-1' ?>
<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:t="http://myfaces.apache.org/tomahawk"
	xmlns:s="http://myfaces.apache.org/sandbox"
	template="../../../../templates/common.xhtml">
	<ui:define name="content">
		<h:form>
			<t:div styleClass="contenido-titulo-general-myriad">Solicitudes Tramitadas - VIF</t:div>
			<p:messages id="msgs" />
			<p:dataTable var="solicitud"
				emptyMessage="No tiene solicitudes de semilleros aprobadas." paginator="true"
				value="#{manejadorSemillerosConsultaVIF.listaSolicitudes}" rows="10"
				paginatorPosition="bottom">
				<f:facet name="header">Solicitudes aprobadas: #{manejadorSemillerosConsultaVIF.totalSolicitudes}</f:facet>
				<p:column headerText="Datos de Semillero">
					<h:outputText
						value="&lt;strong&gt;ID: &lt;/strong&gt; #{solicitud.semillero.id}"
						escape="false" />
					<br />
					<h:outputText
						value="&lt;strong&gt;Nombre: &lt;/strong&gt; #{solicitud.semillero.nombre}"
						escape="false" />
					<br />
					<h:outputText
						value="&lt;strong&gt;Solicitante: &lt;/strong&gt; #{solicitud.semillero.lider.nombreCompleto}"
						escape="false" />
				</p:column>
				<p:column headerText="Datos de Solicitud">
					<h:outputText
						value="&lt;strong&gt;Tipo: &lt;/strong&gt; #{solicitud.tipo.nombre}"
						escape="false" />
					<br />
					<h:outputText
						value="&lt;strong&gt;Fecha Solicitud: &lt;/strong&gt; #{solicitud.fechaSolicitud}"
						escape="false" />
					<br />
					<h:outputText
						value="&lt;strong&gt;Fecha Respuesta VIF: &lt;/strong&gt; #{solicitud.fechaRespuestaVifDi}"
						escape="false" />
					<br />
					<h:outputText
						value="&lt;strong&gt;Respuesta VIF: &lt;/strong&gt; #{solicitud.respuestaVifDi.nombre}"
						escape="false" />
				</p:column>
			</p:dataTable>
			<p:messages id="msgs" />
			<p:dialog widgetVar="dialogEspere" resizable="false" closable="false"
				modal="true">
				<p:graphicImage value="/images/ajaxloading.gif" />
   					 Por favor espere...
   	 			</p:dialog>
		</h:form>
	</ui:define>
</ui:composition>
