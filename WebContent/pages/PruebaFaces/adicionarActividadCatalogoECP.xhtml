<?xml version='1.0' encoding='ISO-8859-1' ?>
<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:t="http://myfaces.apache.org/tomahawk"
	template="../../templates/common.xhtml">
	
	<ui:define name="title">REGISTRO ACTIVIDAD CATALOGO ECP</ui:define>

	<ui:define name="content">
		<h:form>
			<h3>Adicionar actividad al catálogo</h3>
			<p:panel id="infoGeneral" header="Información General" borders="false">			
				<h:panelGrid columns="2">
				
					<h:outputText value="Sede:"/>
					<h:outputText value="" />
					
					<h:outputText value="Facultad/Instituto:"/>
					<h:outputText value="#{ManejadorAdicionarActividadCatalogoECP}" />
					
					<h:outputText value="Dependencia de Extensión"/>
					<h:outputText value="#{ManejadorAdicionarActividadCatalogoECP.dependencia.nombre}" />
					
					<h:outputText value="Nombre de la actividad:"/>
					<h:inputTextarea id="nombreActividad" value="#{ManejadorAdicionarActividadCatalogoECP.nombre}" 
						size="300" style="width:300px" rows="1"
						autoResize="false"/>

					<h:outputText value="Objeto de la actividad:"/>
					<h:inputTextarea id="objetoActividad" value="#{ManejadorAdicionarActividadCatalogoECP.objeto}"
						size="300" style="width:300px" rows="1"
						autoResize="true"/>
	
					<h:outputText value="Submodalidad ECP:"/>          			
					<p:selectOneMenu value="#{ManejadorAdicionarActividadCatalogoECP}" effect="fade" id="submodalidadECP">
						<f:selectItems value="#{ManejadorAdicionarActividadCatalogoECP.subModalidadECPItem}"/>
					</p:selectOneMenu>
					
					<h:outputText value="¿Tiene certificación de calidad?"/>
					<p:selectOneRadio id="certCalidad" value="#{ManejadorAdicionarActividadCatalogoECP.tieneCertificadoCalidad}">					
						<f:selectItem id="si" itemLabel="Si" itemValue="Si" />
						<f:selectItem id="no" itemLabel="No" itemValue="No" />
					</p:selectOneRadio>
					
					<h:outputText value="Población objetivo:"/>
					<h:inputTextarea id="poblacionObjetivo" value="#{ManejadorAdicionarActividadCatalogoECP.poblacionObjeto}" 
						rows="1" size="300" style="width:300px"
						autoResize="true"/>
																				
					<h:outputText value="¿Es oferta permanente?"/>
					<p:selectOneRadio id="ofertaPermanente" value="#{ManejadorAdicionarActividadCatalogoECP.esOfertaPermanente}">					
						<f:selectItem id="si" itemLabel="Si" itemValue="Si" />
						<f:selectItem id="no" itemLabel="No" itemValue="No" />
					</p:selectOneRadio>
					
					<h:outputText value="Eje Temático:"/>
					<p:selectOneMenu
						value="#{ManejadorAdicionarActividadCatalogoECP.ejeTematico}"
						effect="fade" id="ejeTematico">
						<f:selectItems value="#{ManejadorAdicionarActividadCatalogoECP.ejeTematicoItem}" />
					</p:selectOneMenu>

				</h:panelGrid>
				<h:panelGrid columns="4">
					<h:outputText value="Primera vez que se realizó la actividad: Año:"/>
					<p:inputText id="anioPrimeraVez" value="#{ManejadorAdicionarActividadCatalogoECP.anioPrimeraVez}"/>
					<h:outputText value="Mes"/>
					<p:selectOneMenu value="#{ManejadorAdicionarActividadCatalogoECP.mesPrimeraVez}" effect="fade" id="meses">
						<f:selectItems value="#{ManejadorAdicionarActividadCatalogoECP.mesItem}"/>
					</p:selectOneMenu>
				</h:panelGrid>
			</p:panel>
			<br/>
			<center>
				<p:commandButton id="guardar" value="Guardar"/>
				<p:commandButton id="volver" value="Volver"/>
			</center>
		</h:form> 	

	</ui:define>

</ui:composition>
