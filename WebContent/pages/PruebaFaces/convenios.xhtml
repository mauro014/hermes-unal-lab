<?xml version='1.0' encoding='ISO-8859-1' ?>
<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:t="http://myfaces.apache.org/tomahawk"
	template="../../templates/common.xhtml">
	
	<ui:define name="title">REGISTRO CONVENIOS</ui:define>

	<ui:define name="content">
	<h:form id="convenios">  
  
    <p:panel id="panel1" header="Datos del Convenio" widgetVar="panel1">  
  
        <p:messages id="msgs"/>  
  
        <h:panelGrid columns="3">  
  			<h:outputLabel for="tipo" value="Tipo de Convenio: " />    			
			<p:selectOneMenu value="" effect="fade" id="tipo"  filter="true" required="true">
				<f:selectItems value=""/>
			</p:selectOneMenu>
			<p:message for="tipo" display="icon"/>
  			
            <h:outputLabel for="noConvenio" value="Número del Convenio: " />  
            <p:inputText id="nit" value="" label="nit" required="true">  
                <f:validateLength minimum="5" />  
                <p:ajax update="msgNIT" event="keyup" />  
            </p:inputText>  
            <p:message for="nit" id="msgNIT" display="icon"/> 
            
            <h:outputText id="observaciones" value="Observaciones" />      			            
            <p:inputTextarea rows="5" cols="40" counter="counter" maxlength="200" counterTemplate="{0} caracteres restantes." autoResize="false" value="#{ManejadorCrearEntidad.observaciones}"/>
            <h:outputText id="counter"/> 	            
             			            			                        
        </h:panelGrid>  
    </p:panel>    
    <h:commandButton value="Guardar" update="convenios" id="guardar" actionListener="" styleClass="ui-priority-primary"/>  
    <h:commandButton value="Cancelar" update="convenios" id="cancelar" actionListener="" styleClass="ui-priority-primary"/>

</h:form> 

</ui:define>

</ui:composition>
