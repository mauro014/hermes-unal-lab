<?xml version='1.0' encoding='ISO-8859-1' ?>
<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:t="http://myfaces.apache.org/tomahawk"
	xmlns:s="http://myfaces.apache.org/sandbox"
	template="../../templates/common.xhtml">

	<ui:define name="content">
		<h:form>
			
			<t:div styleClass="contenido-titulo-general-myriad">
				<h:outputText value="Convocatorias Activas - DNE"/>
			</t:div>
			
			<p:dataTable id="tablaConvocatorias" var="convocatoriasActivas"
					value="#{ManejadorConsultarConvocatoriasExtension.listaConvocatoriasActivas}"
					paginator="true" paginatorPosition="bottom" rows="10">
					<p:column>
						<f:facet name="header">
							<h:outputText value="Id" />
						</f:facet>
						<h:outputText value="#{convocatoriasActivas.id}"
							styleClass="normal" />
					</p:column>
					<p:column>
						<f:facet name="header">
							<h:outputText value="Nombre" />
						</f:facet>
						<h:outputText value="#{convocatoriasActivas.nombre}"
							styleClass="normal" />
					</p:column>
					<p:column>
						<f:facet name="header">
							<h:outputText value="Entidad Convocante" />
						</f:facet>
						<h:outputText value="#{convocatoriasActivas.entidad}"
							styleClass="normal" />
					</p:column>
					<p:column>
						<f:facet name="header">
							<h:outputText value="Fecha Cierre" />
						</f:facet>
						<h:outputText value="#{convocatoriasActivas.fechaCierre}"
							styleClass="normal" />
					</p:column>
					<p:column>
						<f:facet name="header">
							<h:outputText value="Consultar" />
						</f:facet>
						<center>
						<p:commandButton icon="ui-icon-search"
							action="#{ManejadorConsultarConvocatoriasExtension.consultarConvocatorias}">
							<f:setPropertyActionListener value="#{convocatoriasActivas}"
								target="#{ManejadorConsultarConvocatoriasExtension.convocatoriasExtensionSeleccionada}" />
						</p:commandButton>
						</center>
					</p:column>
				</p:dataTable>
		</h:form>
	</ui:define>
</ui:composition>
