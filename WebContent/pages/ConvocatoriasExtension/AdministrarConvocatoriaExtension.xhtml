<?xml version='1.0' encoding='ISO-8859-1' ?>
<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:t="http://myfaces.apache.org/tomahawk"
	xmlns:s="http://myfaces.apache.org/sandbox"
	template="../../templates/common.xhtml">

	<ui:define name="content">
		<h:form>
			<p:panel header="Convocatorias - Dirección Nacional de Extensión">
				<p:dataTable id="tablaConvocatorias" var="convocatoriasActivas"
					value="#{ManejadorAdministrarConvocatoriasExtension.listaConvocatoriasActivas}"
					paginator="true" paginatorPosition="bottom" rows="10">
					<p:column>
						<f:facet name="header">
							<h:outputText value="Id" />
						</f:facet>
						<h:outputText value="#{convocatoriasActivas.id}" />
					</p:column>
					<p:column>
						<f:facet name="header">
							<h:outputText value="Nombre" />
						</f:facet>
						<h:outputText value="#{convocatoriasActivas.nombre}" />
					</p:column>
					<p:column>
						<f:facet name="header">
							<h:outputText value="Entidad Convocante" />
						</f:facet>
						<h:outputText value="#{convocatoriasActivas.entidad}" />
					</p:column>
					<p:column>
						<f:facet name="header">
							<h:outputText value="Fecha publicación" />
						</f:facet>
						<h:outputText value="#{convocatoriasActivas.fechaRegistro}" />
					</p:column>
					<p:column>
						<f:facet name="header">
							<h:outputText value="Fecha Cierre" />
						</f:facet>
						<h:outputText value="#{convocatoriasActivas.fechaCierre}" />
					</p:column>
					<p:column>
						<f:facet name="header">
							<h:outputText value="Estado" />
						</f:facet>
						<h:outputText
							value="#{convocatoriasActivas.estadoConvocatoria.nombre}" />
					</p:column>
					<p:column>
						<f:facet name="header">
							<h:outputText value="" />
						</f:facet>
						<p:commandButton icon="ui-icon-search"
							title="Consultar Convocatoria #{convocatoriasActivas.id}"
							action="#{ManejadorAdministrarConvocatoriasExtension.consultarConvocatorias}">
							<f:setPropertyActionListener value="#{convocatoriasActivas}"
								target="#{ManejadorAdministrarConvocatoriasExtension.convocatoriasExtensionSeleccionada}" />
						</p:commandButton>
					</p:column>
				</p:dataTable>

			</p:panel>

		</h:form>
	</ui:define>
</ui:composition>
