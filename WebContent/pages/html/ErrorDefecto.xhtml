<?xml version='1.0' encoding='ISO-8859-1' ?>
<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:t="http://myfaces.apache.org/tomahawk"
	xmlns:s="http://myfaces.apache.org/sandbox"
	template="../../templates/common.xhtml">
	<ui:define name="content">	

	
	<p:panelGrid columns="2" id="mensaje" styleClass="estilo-panelgrid-sinbordes">
			<img src="#{facesContext.externalContext.requestContextPath}/images/error.png" />	
			<h:outputText class="panel-titulo-error" value="Ha ocurrido un problema durante la ejecución del aplicativo, a continuación se presenta un formulario en el cual usted puede registrar el inconveniente presentado y sus sugerencias" />	
	</p:panelGrid>
		
	<br></br>
	
				
	<h:form>		
		
		<p:panel
				header="Información del inconveniente presentado"
				align="center" id="requerimiento">		
		  	 
			<p:panelGrid columns="2" id="formularioError" align="center"
					styleClass="estilo-panelgrid-sinbordes">
							
					<h:outputText value="Nombre:" rendered="false"/>
					<p:inputText size="50" id="nombre" value="#{ManejadorMensajeError.nombre}"  rendered="false"/>
											
					<h:outputText value="Email:" rendered="false"/>
					<p:inputText size="50" id="correo" value="#{ManejadorMensajeError.correo}"  rendered="false"/>
					
					<p:outputLabel value="Módulo al que corresponde el inconveniente:"
						for="modulo" styleClass="negrilla" />					
					<p:selectOneMenu
						value="#{ManejadorMensajeError.requerimiento.modulo}"
						id="modulo" style="width:300px">
						<f:selectItem itemLabel="Seleccione una opción" itemValue="0" />
						<f:selectItems
							value="#{ManejadorMensajeError.moduloItems}" />
						<p:ajax update="formularioError"  listener="#{ManejadorMensajeError.cargarSubModulo}"/> 
					</p:selectOneMenu>
					
					<h:outputText value="Sub-Módulo:" styleClass="negrilla" />					
					<p:selectOneMenu
						value="#{ManejadorMensajeError.requerimiento.subModulo}"
						id="submodulo" style="width:300px">
						<f:selectItem itemLabel="Seleccione una opción" itemValue="0" />
						<f:selectItems
							value="#{ManejadorMensajeError.subModuloItems}" />
					</p:selectOneMenu>
					
					
					<h:outputText value="Proceso que estaba realizando:" styleClass="negrilla"/>
					<p:inputTextarea value="#{ManejadorMensajeError.requerimiento.proceso}" id="form" rows="2" cols="60" >								
					</p:inputTextarea>
					
					<h:outputText value="Descripción del inconveniente:" styleClass="negrilla"/>
					<p:inputTextarea value="#{ManejadorMensajeError.requerimiento.descripcionSolic}" id="descripcion" rows="15" cols="60" >								
					</p:inputTextarea>
				
					<h:outputText value="" />
					<p:commandButton action="#{ManejadorMensajeError.guardar}" value="Enviar" id="botonEnviar" ajax="false"
					update="@form"/>	
												
	       </p:panelGrid>	
	       <br></br>
	       <p:messages id="messages" showDetail="true" autoUpdate="true" closable="true" /> 	
	       <br></br>
		</p:panel>
			<br></br>
			<center>
			<div class="panel-texto-error">Si lo desea, puede consultar a la mesa de ayuda  <br />del Sistema de Información de la Investigación - HERMES <br />en las extensión 11111.</div>
			<div class="panel-boton-error"><input type="button" onclick="history.back()" class="boton-regresar"/></div>
			</center>
		
	</h:form>
	</ui:define>
</ui:composition>
