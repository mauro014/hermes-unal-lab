<?xml version='1.0' encoding='ISO-8859-1' ?>
<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:t="http://myfaces.apache.org/tomahawk"
	xmlns:s="http://myfaces.apache.org/sandbox"
	template="../../templates/common.xhtml">

	<ui:define name="title">CURSOS DE FORMACIÓN - LISTA DE PREINSCRITOS</ui:define>

	<ui:define name="content">

		<h:form id="form">

			<t:div styleClass="informacion">

				<t:div styleClass="informacion-texto">

					<t:div styleClass="contenido-titulo-general-myriad">
						<h:outputText
							value="Lista de inscritos - Banco de problemas de innovación social" />
					</t:div>

					<p:growl id="mensajeGrowl" showDetail="true" for="mensajeGrowl"
						effect="fade" />

					<!-- 	Panel Informacion General -->

					<h:panelGrid columns="1" align="center" id="panelPreinscritos">

						<t:div>
							<h:outputText
								value="La siguiente lista muestra la información general de las personas que realizaron el proceso de 
							 registro por medio de la página Web. Para obtener la información detallada, seleccione la
							 persona en la tabla y los datos se cargarán en el panel inferior."
							 styleClass="grande"/>
						</t:div>

						<br />
						<!-- 		INICIO DataTable Exporter -->

						<p:dataTable id="tablaPreinscritosExporter"
							value="#{ManejadorListaPreinscritosBancoProblemas.seleccionadoDataModel}"
							var="preinscrito"
							emptyMessage="No existen personas inscritas a este curso"
							selection="#{ManejadorListaPreinscritosBancoProblemas.estudianteSeleccionado}"
							selectionMode="single" paginatorPosition="bottom"
							rendered="false">
							
							<p:column style="font-size:10px;">
								<f:facet name="header">
									<h:outputText value="ID" />
								</f:facet>

								<h:outputText
									value="#{preinscrito.id_pre}" />
							</p:column>
							
							<p:column style="font-size:10px;">
								<f:facet name="header">
									<h:outputText value="FECHA" />
								</f:facet>

								<h:outputText
									value="#{preinscrito.feccre}">
									<f:convertDateTime pattern="dd/MM/yyyy HH:mm" />
								</h:outputText>
							</p:column>

							<p:column style="font-size:10px;">
								<f:facet name="header">
									<h:outputText value="TIPO DOCUMENTO" />
								</f:facet>

								<h:outputText
									value="#{preinscrito.investigador.id.tipoDocumento}" />
							</p:column>

							<p:column style="font-size:10px;"
								sortBy="#{preinscrito.investigador.id.documento}">
								<f:facet name="header">
									<h:outputText value="DOCUMENTO" />
								</f:facet>

								<h:outputText value="#{preinscrito.investigador.id.documento}" />
							</p:column>

							<p:column style="font-size:10px;"
								sortBy="#{preinscrito.investigador.nombre1}">
								<f:facet name="header">
									<h:outputText value="NOMBRES" />
								</f:facet>

								<h:outputText
									value="#{preinscrito.investigador.nombre1} #{preinscrito.investigador.nombre2}" />
							</p:column>

							<p:column style="font-size:10px;"
								sortBy="#{preinscrito.investigador.apellido1}">
								<f:facet name="header">
									<h:outputText value="APELLIDOS" />
								</f:facet>

								<h:outputText
									value="#{preinscrito.investigador.apellido1} #{preinscrito.investigador.apellido2}" />
							</p:column>

							<p:column style="font-size:10px;"
								sortBy="#{preinscrito.investigador.email}">
								<f:facet name="header">
									<h:outputText value="CORREO" />
								</f:facet>

								<h:outputText value="#{preinscrito.investigador.email}" />
							</p:column>

							<p:column style="font-size:10px;">
								<f:facet name="header">
									<h:outputText value="TELÉFONO MOVIL" />
								</f:facet>

								<h:outputText value="#{preinscrito.tel_movil}" />
							</p:column>

							<p:column style="font-size:10px;">
								<f:facet name="header">
									<h:outputText value="CIUDAD" />
								</f:facet>

								<h:outputText value="#{preinscrito.ciudad.nombre}" />
							</p:column>

							<p:column style="font-size:10px;">
								<f:facet name="header">
									<h:outputText value="ESTADO" />
								</f:facet>

								<h:outputText value="#{preinscrito.estado}" />
							</p:column>

							<p:column style="font-size:10px;">
								<f:facet name="header">
									<h:outputText value="ROL DE QUIEN REGISTRA" />
								</f:facet>

								<h:outputText value="#{preinscrito.tipoVinculacionNombre}" />
							</p:column>

							<p:column style="font-size:10px;">
								<f:facet name="header">
									<h:outputText value="EMPRESA" />
								</f:facet>

								<h:outputText value="#{preinscrito.empresa}" />
							</p:column>

							<p:column style="font-size:10px;">
								<f:facet name="header">
									<h:outputText value="CARGO" />
								</f:facet>

								<h:outputText value="#{preinscrito.cargo}" />
							</p:column>
							
							<p:column style="font-size:10px;">
								<f:facet name="header">
									<h:outputText value="INTERESADA EN COFINANCIAR PROYECTO" />
								</f:facet>

								<h:outputText value="#{preinscrito.tipo_empresa}" />
							</p:column>

							<p:column style="font-size:10px;">
								<f:facet name="header">
									<h:outputText value="NOMBRE PROBLEMA" />
								</f:facet>

								<h:outputText value="#{preinscrito.nombreProblema}" />
							</p:column>

							<p:column style="font-size:10px;">
								<f:facet name="header">
									<h:outputText value="DESCRIPCIÓN PROBLEMA" />
								</f:facet>

								<h:outputText value="#{preinscrito.descripcionProblema}" />
							</p:column>

							<p:column style="font-size:10px;">
								<f:facet name="header">
									<h:outputText value="COMUNIDAD AFECTADA" />
								</f:facet>

								<h:outputText value="#{preinscrito.comunidadObjetivoProblema}" />
							</p:column>

							<p:column style="font-size:10px;">
								<f:facet name="header">
									<h:outputText value="DEPARTAMENTO PROBLEMA" />
								</f:facet>

								<h:outputText value="#{preinscrito.departamentoProblema.nombre}" />
							</p:column>

							<p:column style="font-size:10px;">
								<f:facet name="header">
									<h:outputText value="CIUDAD PROBLEMA" />
								</f:facet>

								<h:outputText value="#{preinscrito.ciudadProblema.nombre}" />
							</p:column>

							<p:column style="font-size:10px;">
								<f:facet name="header">
									<h:outputText value="ÁREA" />
								</f:facet>

								<h:outputText value="#{preinscrito.ubicacionProblema}" />
							</p:column>

							<p:column style="font-size:10px;">
								<f:facet name="header">
									<h:outputText value="TIENE ARCHIVOS" />
								</f:facet>

								<h:outputText rendered="#{preinscrito.tieneArchivos}" value="SI"/>
								<h:outputText rendered="#{!preinscrito.tieneArchivos}" value="NO"/>
							</p:column>
							
							<p:column style="font-size:10px;">
								<f:facet name="header">
									<h:outputText value="MEDIO PUBLICIDAD" />
								</f:facet>

								<h:outputText value="#{preinscrito.medio_publicidad == '1' ? 'Medios de comunicación UN':(preinscrito.medio_publicidad == '2' ? 'Redes sociales':(preinscrito.medio_publicidad == '3' ? 'Voz a voz':(preinscrito.medio_publicidad == '4' ? 'Alcaldías y/o Gobernaciones':(preinscrito.medio_publicidad == '5' ? 'Entidades del orden nacional':(preinscrito.medio_publicidad == '6' ? 'Otro':'')))))}" />
							</p:column>
							
							<p:column style="font-size:10px;">
								<f:facet name="header">
									<h:outputText value="MEDIO PUBLICIDAD OTRO" />
								</f:facet>

								<h:outputText value="#{preinscrito.otroMedioPublicidad}" />
							</p:column>

						</p:dataTable>

						<!-- 		FIN DataTable Exporter -->

						<!-- 	Panel Informacion Detallada -->

						<p:dataTable id="tablaPreinscritos"
							value="#{ManejadorListaPreinscritosBancoProblemas.seleccionadoDataModel}"
							var="preinscrito" cellpadding="6" cellspacing="3"
							paginator="true" rows="15"
							emptyMessage="No existen personas inscritas a este curso"
							selection="#{ManejadorListaPreinscritosBancoProblemas.estudianteSeleccionado}"
							selectionMode="single"
							sortBy="#{preinscrito.investigador.apellido1}"
							paginatorPosition="bottom"
							styleClass="pequennio">

							<p:ajax event="rowSelect"
								listener="#{ManejadorListaPreinscritosBancoProblemas.onRowSelect}"
								update="@form" />

							<p:ajax event="rowUnselect"
								listener="#{ManejadorListaPreinscritosBancoProblemas.onRowUnselect}"
								update="@form" />

							<p:column rendered="false">
								<f:facet name="header">
									<h:outputText value="TIPO DOCUMENTO" />
								</f:facet>

								<h:outputText
									value="#{preinscrito.investigador.id.tipoDocumento}" />
							</p:column>

							<p:column
								sortBy="#{preinscrito.investigador.id.documento}">
								<f:facet name="header">
									<h:outputText value="DOCUMENTO" />
								</f:facet>

								<h:outputText value="#{preinscrito.investigador.id.documento}" />
							</p:column>

							<p:column
								sortBy="#{preinscrito.investigador.nombre1}">
								<f:facet name="header">
									<h:outputText value="NOMBRES" />
								</f:facet>

								<h:outputText
									value="#{preinscrito.investigador.nombre1} #{preinscrito.investigador.nombre2}" />
							</p:column>

							<p:column
								sortBy="#{preinscrito.investigador.apellido1}">
								<f:facet name="header">
									<h:outputText value="APELLIDOS" />
								</f:facet>

								<h:outputText
									value="#{preinscrito.investigador.apellido1} #{preinscrito.investigador.apellido2}" />
							</p:column>

							<p:column
								sortBy="#{preinscrito.investigador.email}">
								<f:facet name="header">
									<h:outputText value="CORREO" />
								</f:facet>

								<h:outputText value="#{preinscrito.investigador.email}" />
							</p:column>

							<p:column sortBy="#{preinscrito.estado}">
								<f:facet name="header">
									<h:outputText value="ESTADO" />
								</f:facet>

								<h:outputText value="#{preinscrito.estado}" />
							</p:column>

						</p:dataTable>

						<br />

						<h:panelGrid columns="3" align="right">

							<p:commandButton value="Salir" icon="ui-icon-circle-arrow-w"
								action="#{ManejadorListaPreinscritosBancoProblemas.regresar}"
								rendered="false" />

							<p:commandButton value="Exportar a Excel"
								icon="ui-icon-document-b" ajax="false">
								<p:dataExporter type="xls" target="tablaPreinscritosExporter"
									fileName="Lista_Curso"
									postProcessor="#{ManejadorListaPreinscritosBancoProblemas.postProcessXLS}" />
							</p:commandButton>

							<p:commandButton value="Guardar" icon="ui-icon-check"
								action="#{ManejadorListaPreinscritosBancoProblemas.guardar}"
								update="@form" />
						</h:panelGrid>

						<br />

					</h:panelGrid>

					<!-- 	Panel Informacion Detallada -->

					<p:tabView
						rendered="#{ManejadorListaPreinscritosBancoProblemas.estudianteSeleccionado != null}">

						<p:tab title="Información General">

							<t:div styleClass="contenido-titulo-general-myriad-2">Información Personal</t:div>
							<br />

							<h:panelGrid columns="2" style="width: 625px;">

								<p:column>

									<h:panelGrid columns="2" cellspacing="6"
										style="vertical-align: top;">

										<h:outputText value="NOMBRES " style="font-weight: bold;" />
										<h:outputText
											value="#{ManejadorListaPreinscritosBancoProblemas.estudianteSeleccionado.investigador.nombre1} 
											 #{ManejadorListaPreinscritosBancoProblemas.estudianteSeleccionado.investigador.nombre2}" />

										<h:outputText value="CORREO " style="font-weight: bold;" />
										<h:outputText
											value="#{ManejadorListaPreinscritosBancoProblemas.estudianteSeleccionado.investigador.email}" />

									</h:panelGrid>

								</p:column>

								<p:column>

									<h:panelGrid columns="2" cellspacing="6">

										<h:outputText value="APELLIDOS " style="font-weight: bold;" />
										<h:outputText
											value="#{ManejadorListaPreinscritosBancoProblemas.estudianteSeleccionado.investigador.apellido1} #{ManejadorListaPreinscritosBancoProblemas.estudianteSeleccionado.investigador.apellido2}" />

										<h:outputText value="TELÉFONO MOVIL "
											style="font-weight: bold;" />
										<h:outputText
											value="#{ManejadorListaPreinscritosBancoProblemas.estudianteSeleccionado.tel_movil}" />

									</h:panelGrid>

								</p:column>


							</h:panelGrid>

							<h:panelGrid columns="2" style="width: 625px;">

								<p:column>

									<h:panelGrid columns="2" cellspacing="6">

										<h:outputText value="CIUDAD " style="font-weight: bold;" />
										<h:outputText
											value="#{ManejadorListaPreinscritosBancoProblemas.estudianteSeleccionado.ciudad.nombre}" />

										<h:outputText value="EMPRESA/ENTIDAD "
											style="font-weight: bold;" />
										<h:outputText
											value="#{ManejadorListaPreinscritosBancoProblemas.estudianteSeleccionado.empresa}" />

										<h:outputText value="CARGO " style="font-weight: bold;" />
										<h:outputText
											value="#{ManejadorListaPreinscritosBancoProblemas.estudianteSeleccionado.cargo}" />

									</h:panelGrid>

								</p:column>


							</h:panelGrid>

							<t:div styleClass="contenido-titulo-general-myriad-2">Información del problema</t:div>
							<br />

							<h:panelGrid columns="2" style="width: 625px;">

								<p:column>

									<h:panelGrid columns="2" cellspacing="6"
										style="vertical-align: top;">

										<h:outputText value="PROBLEMA " style="font-weight: bold;" />
										<h:outputText
											value="#{ManejadorListaPreinscritosBancoProblemas.estudianteSeleccionado.nombreProblema}" />

										<h:outputText value="DESCRIPCIÓN " style="font-weight: bold;" />
										<h:outputText
											value="#{ManejadorListaPreinscritosBancoProblemas.estudianteSeleccionado.descripcionProblema}" />

										<h:outputText value="COMUNIDAD AFECTADA "
											style="font-weight: bold;" />
										<h:outputText
											value="#{ManejadorListaPreinscritosBancoProblemas.estudianteSeleccionado.comunidadObjetivoProblema}" />

										<h:outputText value="DEPARTAMENTO " style="font-weight: bold;" />
										<h:outputText
											value="#{ManejadorListaPreinscritosBancoProblemas.estudianteSeleccionado.departamentoProblema.nombre}" />

										<h:outputText value="MUNICIPIO " style="font-weight: bold;" />
										<h:outputText
											value="#{ManejadorListaPreinscritosBancoProblemas.estudianteSeleccionado.ciudadProblema.nombre}" />

										<h:outputText value="ÁREA RURAL " style="font-weight: bold;" />
										<h:outputText
											value="#{ManejadorListaPreinscritosBancoProblemas.estudianteSeleccionado.ubicacionProblema}" />

									</h:panelGrid>

								</p:column>


							</h:panelGrid>
						</p:tab>

						<p:tab title="Adjuntos">

							<h:panelGrid columns="1" style="width: 625px;">

								<t:div styleClass="contenido-titulo-general-myriad-2">Documentos Adjuntos</t:div>
								<br />
								<p:dataTable id="tablaArchivosAdjuntos"
									value="#{ManejadorListaPreinscritosBancoProblemas.listaArchivosAdjuntos}"
									var="archivo" cellpadding="6" cellspacing="3"
									emptyMessage="No se encuentran archivos adjuntos">

									<p:column>
										<f:facet name="header">
											<h:outputText value="ARCHIVO" />
										</f:facet>

										<h:outputText value="#{archivo.nombreArchivo}" />
									</p:column>

									<p:column>
										<f:facet name="header">
											<h:outputText value="Descargar" />
										</f:facet>

										<center>
											<p:commandButton ajax="false"
												icon="ui-icon-arrowthickstop-1-s"
												action="#{ManejadorListaPreinscritosBancoProblemas.descargarArchivo}">
												<f:setPropertyActionListener value="#{archivo}"
													target="#{ManejadorListaPreinscritosBancoProblemas.archivoSeleccionado}" />
											</p:commandButton>
										</center>

									</p:column>

								</p:dataTable>

								<br />

							</h:panelGrid>

						</p:tab>

						<p:tab title="Aprobar">

							<h:panelGrid columns="1" style="width: 625px;">

								<t:div styleClass="contenido-titulo-general-myriad-2">Formalizar Asistente</t:div>
								<br />

								<h:panelGrid columns="2" align="center">

									<h:outputText value="Estado" />
									<p:selectOneMenu id="estadosPreinscripcionFormalizar"
										value="#{ManejadorListaPreinscritosBancoProblemas.estudianteSeleccionado.estado}"
										style="width: 200px">
										<p:ajax event="change" update=":form:panelPreinscritos" />
										<f:selectItems
											value="#{ManejadorListaPreinscritosBancoProblemas.listaEstadosPreinscripcion}" />
									</p:selectOneMenu>

								</h:panelGrid>

							</h:panelGrid>

						</p:tab>

					</p:tabView>

				</t:div>

			</t:div>

		</h:form>

	</ui:define>

</ui:composition>
