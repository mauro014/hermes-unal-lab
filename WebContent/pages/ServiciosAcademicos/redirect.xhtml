<?xml version='1.0' encoding='ISO-8859-1' ?>
<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:t="http://myfaces.apache.org/tomahawk"
	xmlns:s="http://myfaces.apache.org/sandbox"
	template="../../templates/common.xhtml">

	<ui:define name="title">Extensión</ui:define>
	<ui:define name="content">
		<h:form>


			<t:div styleClass="contenido-titulo-general-myriad" style="border-bottom:none;">Extensión</t:div>
			<t:div styleClass="linea-iconos"/>
			<t:div styleClass="paraIconosHermes"/>
			<t:div styleClass="informacion">
				<t:div styleClass="informacion-texto"
					style="border-bottom: 0px; padding-bottom: 0px; margin-top:-2px;">
					<h:outputText
						value="Usted puede acceder a los siguientes servicios:" />
				</t:div>
			</t:div>
			<div class="panel-iconos-home">
				<p:dataGrid columns="5" style="estilo-panelgrid-sinbordes-inicio"
					emptyMessage="No existen roles asociados" var="iconos"
					value="#{ManejadorRedirect.iconos}">
					<table class="tabla-inicio">
						<tr>
							<td><h:commandLink action="#{ManejadorRedirect.accion}">
									<img src="../../images/iconos/#{iconos.accion}.PNG"
										style="border: 0px;" />
								</h:commandLink></td>
						</tr>
						<tr>
							<td>
								<div style="padding-top: 5px; height: 40px;">
									<p:commandLink value="#{iconos.nombre}"
										action="#{ManejadorRedirect.accion}" ajax="false" />
								</div>
							</td>
						</tr>
					</table>
				</p:dataGrid>
			</div>

		</h:form>
	</ui:define>
</ui:composition>
