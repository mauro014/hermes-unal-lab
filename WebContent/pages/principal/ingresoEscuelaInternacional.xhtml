<?xml version='1.0' encoding='ISO-8859-1' ?>

								</h:commandButton>
								
								
								
						</h:panelGrid>

								<h:outputText

									styleClass="item_2col_f" />
							</h:panelGrid>
						</f:facet>

					</t:popup>


<h:outputText value="Curso completo: " styleClass="labels_proyecto" style='font-size: 10px; font-style: normal' />

					</h:selectOneMenu>

			<f:selectItems
				value="#{manejadorIngresoEscuelaInternacional.tipoModulo}" />

		</h:selectManyCheckbox>

</h:panelGrid>

	<h:panelGrid columns="2" rendered="false">
	
						<h:outputText value="Valor a pagar: " styleClass="labels_proyecto" style='font-size: 10px; font-style: normal'  />
