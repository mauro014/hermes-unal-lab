<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<%@ taglib uri="http://java.sun.com/jsf/html" prefix="h"%>
<%@ taglib uri="http://java.sun.com/jsf/core" prefix="f"%>
<%@ taglib uri="http://myfaces.apache.org/tomahawk" prefix="t"%>


<h:form>
<s:fieldset legend="Búsqueda avanzada" styleClass="legend1">
           <br /><center>
             <h:outputText value="Búsqueda por criterios" styleClass="titulo"/>
           </center><br />
           
           <center>
           <h:panelGrid columns="1"
                        styleClass="panelGridSimple"
                        columnClasses="columnaEtiquetas,columnaValores">
			<h:panelGroup>
				<h:selectOneRadio layout="pageDirection"
					value="#{manejadorConsultas.categoria}" onclick="submit()"
					valueChangeListener="#{manejadorConsultas.seleccionBusqueda}">
					<f:selectItems value="#{manejadorConsultas.categoriaItems}" />
				</h:selectOneRadio>
			</h:panelGroup>

			<h:panelGroup>
				<h:panelGrid columns="3" border="0" align="left" cellpadding="1"
					cellspacing="1" styleClass="mediano"
					binding="#{manejadorConsultas.panelCategoria}">

					<h:outputText id="otCategoriaGrupos" value="Categoria"
						styleClass="mediano" />
					<h:selectOneMenu value="#{manejadorConsultas.idCategoriaGrupo}"
						immediate="true" id="somCategoriaGrupos" styleClass="textarea">
						<f:selectItems id="siCategoriaGrupos"
							value="#{manejadorConsultas.categoriasGrupoItem}" />
					</h:selectOneMenu>
					<h:message for="somCategoriaGrupos" styleClass="mensajeerror"
						showDetail="true" showSummary="false" />
				</h:panelGrid>
			</h:panelGroup>

			<h:panelGroup>
				<h:panelGrid columns="3" border="0" align="left" cellpadding="1"
					cellspacing="1" styleClass="mediano"
					binding="#{manejadorConsultas.panelGruposProyectos}">

					<h:outputText id="otSedeGrupos" value="Sede" styleClass="mediano" />
					<h:selectOneMenu value="#{manejadorConsultas.idSede}"
						onchange="submit()" immediate="true"
						valueChangeListener="#{manejadorConsultas.cargarFacultadesSede}"
						id="somSedeGrupos" styleClass="textarea">
						<f:selectItems id="siSedeGrupos"
							value="#{manejadorConsultas.sedesItem}" />
					</h:selectOneMenu>
					<h:message for="somSedeGrupos" styleClass="mensajeerror"
						showDetail="true" showSummary="false" />

					<h:outputText id="otFacultadGrupos" value="Facultad"
						styleClass="mediano" />
					<h:selectOneMenu id="somFacultadGrupos" immediate="true"
						value="#{manejadorConsultas.idFacultad}" styleClass="textarea">
						<f:selectItems id="siFacultadGrupos"
							value="#{manejadorConsultas.facultadesSedeItem}" />
					</h:selectOneMenu>
					<h:message for="somFacultadGrupos" styleClass="mensajeerror"
						showDetail="true" showSummary="false" />
				</h:panelGrid>						
			</h:panelGroup>

			<h:panelGroup>
				<h:panelGrid columns="2" border="0" align="left" cellpadding="1"
					cellspacing="1" styleClass="mediano"
					binding="#{manejadorConsultas.panelInvestigadores}">
					<h:outputText value="Nombres" styleClass="mediano" />
					<h:inputText id="nombreInv"
						value="#{manejadorConsultas.nombreBusqueda}" size="38">
						<f:validateLength minimum="3" maximum="38" />
					</h:inputText>
					<h:outputText value="Apellidos" styleClass="mediano" />
					<h:inputText id="apellidoInv"
						value="#{manejadorConsultas.apellidoBusqueda}" size="38">
						<f:validateLength minimum="3" maximum="38" />
					</h:inputText>
				</h:panelGrid>
			</h:panelGroup>

			<h:panelGroup>				
				<h:panelGrid columns="3" border="0" align="left" cellpadding="1"
					cellspacing="1" styleClass="mediano"
					binding="#{manejadorConsultas.panelPalabra}">
					<h:outputText value="Palabra Clave" styleClass="mediano" />
					<h:inputText id="palabraClave"
						value="#{manejadorConsultas.claveBusqueda}" size="38" />

					<h:message for="palabraClave" styleClass="mensajeerror"
						showDetail="true" showSummary="false" />
				</h:panelGrid>				
			</h:panelGroup>

			<h:panelGroup>
				
					<br />
					<center>
				

				<h:commandButton action="#{manejadorConsultas.setListaObjetos}"
					image="/imgplantilla/pngtitulos/der_buscar.png" />

				
					<br />
					</center>
				
			</h:panelGroup>

		</h:panelGrid>
	   </s:fieldset>
</h:form></h:form>
</ui:define>
</ui:composition>
