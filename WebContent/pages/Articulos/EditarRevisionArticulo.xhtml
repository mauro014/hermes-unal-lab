<?xml version='1.0' encoding='ISO-8859-1' ?>
<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:t="http://myfaces.apache.org/tomahawk"
	xmlns:s="http://myfaces.apache.org/sandbox"
	template="../../templates/common.xhtml">

<ui:define name="content">
<h:form>


<s:fieldset
	legend="Consultar - Convocatoria de apoyo a producción académica- Universidad Nacional de Colombia"
	rendered="#{ManejadorEditarArticulo.panelRender[0]}"
	styleClass="legend1" style='font-size: 12px;'>
	
		<h:panelGrid columns="2">
					<h:outputText value="Solicitudes registradas:"
						styleClass="labels_proyecto" style='font-size: 10px; font-style: normal'/>
					<h:selectOneMenu
						value="#{ManejadorEditarArticulo.codigo}"
						styleClass="texto" style='font-size: 10px; font-style: normal'>
						<f:selectItems
							value="#{ManejadorEditarArticulo.articuloItem}" />
					</h:selectOneMenu>	
					
					</h:panelGrid>	
					
					<h:panelGrid columns="3" align="center">
								
				<h:outputText value=""
						styleClass="labels_proyecto" style='font-size: 10px; font-style: normal'/>
					<h:commandButton
					action="#{ManejadorEditarArticulo.buscarPersona}"
					value="Buscar" image="/imgplantilla/pngtitulos/cen_buscar.png" />
									
			
					<h:commandButton action="misProyectos" 
		           		 value="Atrás"
		           		 image="/imgplantilla/pngtitulos/cen_atras.png" />	
		           		 
		           		 </h:panelGrid>
		           		 
					<h:panelGrid columns="2">
					<h:outputText value=""
						styleClass="labels_proyecto" style='font-size: 10px; font-style: normal'/>
					<h:outputText value="#{ManejadorEditarArticulo.errores[0]}"
						styleClass="labels_proyecto" />
	</h:panelGrid>
</s:fieldset>

<s:fieldset legend="Información Generall (1/7)" styleClass="legend1"
	style='font-size: 12px;'
	rendered="#{ManejadorEditarArticulo.panelRender[1]}">

	<h:panelGrid columns="2">	
		<h:outputText value="Modalidad" styleClass="labels_proyecto"
			style='font-size: 10px; font-style: normal' />
		<h:outputText value="#{ManejadorEditarArticulo.nombreModalidad}" 
			styleClass="texto" style='font-size: 10px; font-style: normal' />

		<h:outputText value="Nombre de docente" styleClass="labels_proyecto"
			style='font-size: 10px; font-style: normal' />
		<h:outputText value="#{ManejadorEditarArticulo.nombreDocente}"
			styleClass="texto" style='font-size: 10px; font-style: normal' />


		<h:outputText value="Documento de identidad"
			styleClass="labels_proyecto"
			style='font-size: 10px; font-style: normal' />
		<h:outputText
			value="#{ManejadorEditarArticulo.documentoDocente}"
			styleClass="texto" style='font-size: 10px; font-style: normal' />


		<h:outputText value="Sede:" styleClass="labels_proyecto"
			style='font-size: 10px; font-style: normal' />
		<h:outputText value="#{ManejadorEditarArticulo.sede}"
			styleClass="texto" style='font-size: 10px; font-style: normal' />


		<h:outputText value="Facultad o instituto"
			styleClass="labels_proyecto"
			style='font-size: 10px; font-style: normal' />
		<h:outputText
			value="#{ManejadorEditarArticulo.facultadDocente}"
			styleClass="texto" style='font-size: 10px; font-style: normal' />


		<h:outputText value="Departamento" styleClass="labels_proyecto"
			style='font-size: 10px; font-style: normal' />
		<h:outputText
			value="#{ManejadorEditarArticulo.departamentoDocente}"
			styleClass="texto" style='font-size: 10px; font-style: normal' />

	

		<h:outputText value=""
			rendered="#{ManejadorEditarArticulo.panelRenderError[1]}" />
		<h:outputText value="#{ManejadorEditarArticulo.errores[1]}"
			styleClass="mensajeerror"
			rendered="#{ManejadorEditarArticulo.panelRenderError[1]}" />
		<h:outputText value="Nombre entidad o dependencia que aporta la contrapartida(*)" rendered="#{ManejadorEditarArticulo.banderaModalidad}"
			style='font-size: 10px; font-style: normal'
			styleClass="labels_proyecto" />
		<t:inputTextarea id="NombreContrapartida" rendered="#{ManejadorEditarArticulo.banderaModalidad}"
			value="#{ManejadorEditarArticulo.conArt.dependencia}" readonly="true"
			style='font-size: 10px; font-style: normal' rows="3" cols="60"
			styleClass="labels_proyecto">
		</t:inputTextarea>	

       
		
				<h:outputText value=""
			rendered="#{ManejadorEditarArticulo.panelRenderError[3]}" />
		<h:outputText value="#{ManejadorEditarArticulo.errores[3]}"
			styleClass="mensajeerror"
			rendered="#{ManejadorEditarArticulo.panelRenderError[3]}" />
		<h:outputText value="Título del artículo(*)" 
			style='font-size: 10px; font-style: normal'
			styleClass="labels_proyecto" />
		<t:inputTextarea id="TituloArticulo" readonly="true"
			value="#{ManejadorEditarArticulo.conArt.titulo}"
			style='font-size: 10px; font-style: normal' rows="3" cols="60"
			styleClass="labels_proyecto">
		</t:inputTextarea>	
		
		<h:outputText value=""
			rendered="#{ManejadorEditarArticulo.panelRenderError[4]}" />
		<h:outputText value="#{ManejadorEditarArticulo.errores[4]}"
			styleClass="mensajeerror"
			rendered="#{ManejadorEditarArticulo.panelRenderError[4]}" />
		<h:outputText value="Número de palabras(*)" 
			style='font-size: 10px; font-style: normal'
			styleClass="labels_proyecto" />
		<h:inputText id="Palabras" readonly="true"
			value="#{ManejadorEditarArticulo.conArt.palabras}"
			style='font-size: 10px; font-style: normal' 
			styleClass="labels_proyecto">			
		</h:inputText>	
		
		
		<h:outputText value=""
			rendered="#{ManejadorEditarArticulo.panelRenderError[5]}" />
		<h:outputText value="#{ManejadorEditarArticulo.errores[5]}"
			styleClass="mensajeerror"
			rendered="#{ManejadorEditarArticulo.panelRenderError[5]}" />
		<h:outputText value="Coautores (NOMBRE - INSTITUCIÓN)(*)" 
			style='font-size: 10px; font-style: normal'
			styleClass="labels_proyecto" />
		<t:inputTextarea id="Coautores" readonly="true"
			value="#{ManejadorEditarArticulo.conArt.coautores}"
			style='font-size: 10px; font-style: normal' rows="3" cols="60"
			styleClass="labels_proyecto">			
		</t:inputTextarea>	
		
		
			<h:outputText value=""
			rendered="#{ManejadorEditarArticulo.panelRenderError[6]}" />
		<h:outputText value="#{ManejadorEditarArticulo.errores[6]}"
			styleClass="mensajeerror"
			rendered="#{ManejadorEditarArticulo.panelRenderError[6]}" />
		<h:outputText value="ISSN(*)" 
			style='font-size: 10px; font-style: normal'
			styleClass="labels_proyecto" />
		<t:inputTextarea id="ISSN" readonly="true"
			value="#{ManejadorEditarArticulo.conArt.issn}"
			style='font-size: 10px; font-style: normal' rows="3" cols="60"
			styleClass="labels_proyecto">			
		</t:inputTextarea>	
		
		
		<h:outputText value=""
			rendered="#{ManejadorEditarArticulo.panelRenderError[7]}" />
		<h:outputText value="#{ManejadorEditarArticulo.errores[7]}"
			styleClass="mensajeerror"
			rendered="#{ManejadorEditarArticulo.panelRenderError[7]}" />
		<h:outputText value="Resumen artículo(*)" 
			style='font-size: 10px; font-style: normal'
			styleClass="labels_proyecto" />
		<t:inputTextarea id="Resumen" readonly="true"
			value="#{ManejadorEditarArticulo.conArt.resumen}"
			style='font-size: 10px; font-style: normal' rows="9" cols="60"
			styleClass="labels_proyecto">			
		</t:inputTextarea>	


 		<h:outputText value=""
			rendered="#{ManejadorEditarArticulo.panelRenderError[2]}" />
		<h:outputText value="#{ManejadorEditarArticulo.errores[2]}"
			styleClass="mensajeerror"
			rendered="#{ManejadorEditarArticulo.panelRenderError[2]}" />
		<h:outputText value="Número de apoyos del último año(*)"
			style='font-size: 10px; font-style: normal'
			styleClass="labels_proyecto" />
		<h:selectOneMenu onchange="submit(this)" readonly="true"
			valueChangeListener="#{ManejadorEditarArticulo.cambiarAlianza}"
			value="#{ManejadorEditarArticulo.conArt.numeroApoyos}"
			styleClass="texto" style='font-size: 10px; font-style: normal'>
			<f:selectItems value="#{ManejadorEditarArticulo.numeroApoyos}" />
		</h:selectOneMenu>
	
	</h:panelGrid>

</s:fieldset>


<s:fieldset legend="Información Archivos Adjuntos (2/2)" styleClass="legend1"
	style='font-size: 12px;'
	rendered="#{ManejadorEditarArticulo.panelRender[1]}">

<h:panelGrid columns="2">
		
			<h:outputText value="" rendered="#{ManejadorEditarArticulo.panelRenderError[25]}"/>
			<h:outputText
				value="#{ManejadorEditarArticulo.errores[25]}"
				styleClass="mensajeerror"
				rendered="#{ManejadorEditarArticulo.panelRenderError[25]}" />
			<h:outputText value="Archivos Registrados(*)"
				style='font-size: 10px; font-style: normal'
				styleClass="labels_proyecto" />
			<h:dataTable var="archivoAdjunto"
					value="#{ManejadorEditarArticulo.listaArchivosObligatoriosSel}"
					cellpadding="1" cellspacing="8" align="center" border="1"
					binding="#{ManejadorEditarArticulo.tablaArchivosObligatoriosSel}">
					
					<h:column>
						<f:facet name="header">
							<h:outputText value="Tipo documento" style='font-size: 10px;'/>
						</f:facet>
						<h:outputText value="#{archivoAdjunto.tipoArchivo}"
							styleClass="normal" style='font-size: 10px; font-style: normal'/>
					</h:column>
					<h:column>
						<f:facet name="header">
							<h:outputText value="Archivo Cargado" style='font-size: 10px;'/>
						</f:facet>
						<h:commandLink
							action="#{ManejadorEditarArticulo.verArchivo}"
							value="#{archivoAdjunto.nombre}"
							styleClass="normal" style='font-size: 10px; font-style: normal'/>
					</h:column>				
					
				</h:dataTable>
	    </h:panelGrid>

</s:fieldset>


</h:form>
</ui:define>
</ui:composition>
