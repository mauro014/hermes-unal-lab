<?xml version='1.0' encoding='ISO-8859-1' ?>
<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:t="http://myfaces.apache.org/tomahawk"
	xmlns:s="http://myfaces.apache.org/sandbox"
	template="../../templates/common.xhtml">

<ui:define name="content">
<h:form>

<s:fieldset legend="Solicitudes Evaluadas Convocatoria Artículos"
	styleClass="legend1" style='font-size: 12px;'>

	<h:panelGrid columns="1" align="center">
		<h:panelGrid columns="2">
			<h:outputText value="Solicitudes Registradas"
				styleClass="labels_proyecto"
				style='font-size: 10px; font-style: normal' />
			<h:selectOneMenu
				value="#{ManejadorRevisionArticuloVRI.codigoArticulo}"
				styleClass="texto" style='font-size: 10px; font-style: normal'>
				<f:selectItems value="#{ManejadorRevisionArticuloVRI.articuloItem}" />
			</h:selectOneMenu>
		</h:panelGrid>
		<h:panelGrid columns="2" align="center">
			<h:commandButton
				action="#{ManejadorRevisionArticuloVRI.buscarSolicitudConvocatoriaArticulos}"
				value="Buscar" image="/imgplantilla/pngtitulos/cen_buscar.png" />
			<h:commandButton action="#{ManejadorRevisionArticuloVRI.limpiar}"
				actionListener="#{ManejadorRevisionArticuloVRI.cancelAction}"
				value="Limpiar" image="/imgplantilla/pngtitulos/cen_limpiar.png"
				immediate="true" />
		</h:panelGrid>
	</h:panelGrid>

	<h:panelGrid columns="2" align="center"
		rendered="#{ManejadorRevisionArticuloVRI.panelRenderError[0]}">
		<h:outputText value="#{ManejadorRevisionArticuloVRI.errores[0]}"
			styleClass="labels_proyecto" />
	</h:panelGrid>

</s:fieldset>

<s:fieldset legend="Información de la Solicitud Registrada"
	styleClass="legend1" style='font-size: 12px;'
	rendered="#{ManejadorRevisionArticuloVRI.mostrarInformacionGeneral}">

	<h:panelGrid columns="2">

		<h:outputText value="Código de la Solicitud: "
			styleClass="labels_proyecto"
			style='font-size: 10px; font-style: normal' />
		<h:outputText value="#{ManejadorRevisionArticuloVRI.ca.id}"
			styleClass="texto"
			style='font-size: 10px; font-style: normal; font-weight: lighter' />

		<h:outputText value="Nombre del Profesor: "
			styleClass="labels_proyecto"
			style='font-size: 10px; font-style: normal' />
		<h:outputText value="#{ManejadorRevisionArticuloVRI.nombreDocente}"
			styleClass="texto"
			style='font-size: 10px; font-style: normal; font-weight: lighter' />

		<h:outputText value="Número de Identificación del Profesor: "
			styleClass="labels_proyecto"
			style='font-size: 10px; font-style: normal' />
		<h:outputText
			value="#{ManejadorRevisionArticuloVRI.ca.personaInv.id.documento}"
			styleClass="texto"
			style='font-size: 10px; font-style: normal; font-weight: lighter' />

		<h:outputText value="Teléfono del Profesor: "
			styleClass="labels_proyecto"
			style='font-size: 10px; font-style: normal' />
		<h:outputText
			value="#{ManejadorRevisionArticuloVRI.ca.telefonoDocente}"
			styleClass="texto"
			style='font-size: 10px; font-style: norma; font-weight: lighter' />

		<h:outputText value="Teléfono móvil: " styleClass="labels_proyecto"
			style='font-size: 10px; font-style: normal' />
		<h:outputText
			value="#{ManejadorRevisionArticuloVRI.ca.celularDocente}"
			styleClass="texto"
			style='font-size: 10px; font-style: normal; font-weight: lighter' />

		<h:outputText value="Correo del Profesor: "
			styleClass="labels_proyecto"
			style='font-size: 10px; font-style: normal' />
		<h:outputText value="#{ManejadorRevisionArticuloVRI.ca.emailDocente}"
			styleClass="texto"
			style='font-size: 10px; font-style: normal; font-weight: lighter' />

		<h:outputText value="Sede: " styleClass="labels_proyecto"
			style='font-size: 10px; font-style: normal' />
		<h:outputText value="#{ManejadorRevisionArticuloVRI.sede}"
			styleClass="texto"
			style='font-size: 10px; font-style: normal; font-weight: lighter' />

		<h:outputText value="Título del Artículo: "
			styleClass="labels_proyecto"
			style='font-size: 10px; font-style: normal' />
		<h:outputText value="#{ManejadorRevisionArticuloVRI.ca.titulo}"
			styleClass="texto"
			style='font-size: 10px; font-style: normal; font-weight: lighter' />

		<h:outputText value="Número de Palabras: "
			styleClass="labels_proyecto"
			style='font-size: 10px; font-style: normal' />
		<h:outputText value="#{ManejadorRevisionArticuloVRI.ca.palabras}"
			styleClass="texto"
			style='font-size: 10px; font-style: normal; font-weight: lighter' />

		<h:outputText value="ISSN: " styleClass="labels_proyecto"
			style='font-size: 10px; font-style: normal' />
		<h:outputText value="#{ManejadorRevisionArticuloVRI.ca.issn}"
			styleClass="texto"
			style='font-size: 10px; font-style: normal; font-weight: lighter' />

		<h:outputText value="Área: " styleClass="labels_proyecto"
			style='font-size: 10px; font-style: normal' />
		<h:outputText value="#{ManejadorRevisionArticuloVRI.ca.area}"
			styleClass="texto"
			style='font-size: 10px; font-style: normal; font-weight: lighter' />

		<h:outputText value="Modalidad: " styleClass="labels_proyecto"
			style='font-size: 10px; font-style: normal' />
		<h:outputText value="#{ManejadorRevisionArticuloVRI.modalidad}"
			styleClass="texto"
			style='font-size: 10px; font-style: normal; font-weight: lighter' />

		<h:outputText value="Idioma: " styleClass="labels_proyecto"
			style='font-size: 10px; font-style: normal' />
		<h:outputText value="#{ManejadorRevisionArticuloVRI.idioma}"
			styleClass="texto"
			style='font-size: 10px; font-style: normal; font-weight: lighter' />


	</h:panelGrid>
</s:fieldset>

<s:fieldset legend="Descargar Reporte"
	rendered="#{ManejadorRevisionArticuloVRI.mostrarInformacionGeneral}"
	styleClass="legend1" style='font-size: 12px;'>

	<h:panelGrid columns="1" align="center">
		<h:commandLink target="popupWindow"
			action="#{ManejadorRevisionArticuloVRI.imprimirReporteConvocatoriaArticulo}">

			<h:graphicImage
				value="/imgplantilla/pngtitulos/_formulario_imprimir.png" />
		</h:commandLink>
	</h:panelGrid>
</s:fieldset>

<s:fieldset legend="Archivos Adjuntos"
	rendered="#{ManejadorRevisionArticuloVRI.mostrarInformacionGeneral}"
	styleClass="legend1" style='font-size: 12px;'>
	<h:dataTable var="archivoResumen"
		value="#{ManejadorRevisionArticuloVRI.listaArchivosConvocatoriaArticulos}"
		cellpadding="1" cellspacing="8" align="center" border="1"
		binding="#{ManejadorRevisionArticuloVRI.tablaArchivosConvocatoriaArticulos}">

		<h:column>
			<f:facet name="header">
				<h:outputText value="Nombre del archivo" />
			</f:facet>
			<h:outputText value=" #{archivoResumen.nombre}" styleClass="normal" />
		</h:column>

		<h:column>
			<f:facet name="header">
				<h:outputText value="Tipo de archivo" />
			</f:facet>
			<h:outputText value=" #{archivoResumen.tipoArchivo}"
				styleClass="normal" />
		</h:column>

		<h:column>

			<f:facet name="header">
				<h:outputText value="Descargar" />
			</f:facet>

			<h:commandButton value="Descargar"
				action="#{ManejadorRevisionArticuloVRI.descargarArchivoArticulo}"
				image="/imgplantilla/pngtitulos/cen_descargar.png" />

		</h:column>
	</h:dataTable>
</s:fieldset>

<s:fieldset legend="Evaluación en la Sede" styleClass="legend1"
	style='font-size: 12px;'
	rendered="#{ManejadorRevisionArticuloVRI.mostrarInformacionGeneral}">

	<h:panelGrid columns="2">

		<h:outputText
			value="1. Está al día con los compromisos adquiridos en relación a proyectos de investigación financiados a través de las instancias e investigación de la Universidad Nacional de Colombia: "
			styleClass="labels_proyecto"
			style='font-size: 10px; font-style: normal' />
		<h:outputText
			value="#{ManejadorRevisionArticuloVRI.ca.requerimiento1}"
			styleClass="texto"
			style='font-size: 10px; font-style: normal; font-weight: lighter' />

		<h:outputText
			value="2. Si ha recibido apoyo anterior mediante esta convocatoria, presenta certificación que el artículo ha sido sometido (radicado) en la revista indicada: "
			styleClass="labels_proyecto"
			style='font-size: 10px; font-style: normal' />
		<h:outputText
			value="#{ManejadorRevisionArticuloVRI.ca.requerimiento2}"
			styleClass="texto"
			style='font-size: 10px; font-style: normal; font-weight: lighter' />

	</h:panelGrid>
	<h:panelGrid columns="2">
		<h:outputText value="Comentarios: " styleClass="labels_proyecto"
			style='font-size: 10px; font-style: normal' />
		<h:outputText
			value="#{ManejadorRevisionArticuloVRI.ca.comentarioEvaluacion}"
			styleClass="texto"
			style='font-size: 10px; font-style: normal; font-weight: lighter' />

		<h:outputText value="Estado: " styleClass="labels_proyecto"
			style='font-size: 10px; font-style: normal' />
		<h:outputText value="#{ManejadorRevisionArticuloVRI.estado}"
			styleClass="texto"
			style='font-size: 10px; font-style: normal; font-weight: lighter' />
	</h:panelGrid>

</s:fieldset>

<s:fieldset legend="Evaluación Vicerrectoria de Investigación"
	styleClass="legend1" style='font-size: 12px;'
	rendered="#{ManejadorRevisionArticuloVRI.aprobadoSede}">

	<h:panelGrid columns="1" align="center">
	<h:outputText
				value="#{ManejadorRevisionArticuloVRI.errores[4]}"
				styleClass="mensajeerror"
				rendered="#{ManejadorRevisionArticuloVRI.panelRenderError[4]}" />
		<h:selectOneRadio id="tipoBusq"
			value="#{ManejadorRevisionArticuloVRI.evaluacionVRI}"
			
			valueChangeListener="#{ManejadorRevisionArticuloVRI.cambiarFormAPS}"
			styleClass="texto" style='font-size: 10px; font-style: normal'
			onclick="submit();">
			<f:selectItem itemValue="APV" value="APV" itemLabel="Aprobar" />
			<f:selectItem itemValue="NAPV" value="NAPV" itemLabel="No Aprobar" />
		</h:selectOneRadio>
	</h:panelGrid>

	<h:panelGrid columns="2" rendered="#{ManejadorRevisionArticuloVRI.mostrarSiAPV}" align="center">

		<h:outputText value="" rendered="#{ManejadorRevisionArticuloVRI.panelRenderError[1]}"/>
			<h:outputText
				value="#{ManejadorRevisionArticuloVRI.errores[1]}"
				styleClass="mensajeerror"
				rendered="#{ManejadorRevisionArticuloVRI.panelRenderError[1]}" />
		
		<h:outputText value="Fecha de Envío: "
			styleClass="labels_proyecto" />
		<t:inputCalendar id="fechaEnvio"
			value="#{ManejadorRevisionArticuloVRI.fechaEnvio}"
			renderAsPopup="true" popupTodayString="Hoy es: "
			popupWeekString="Sem." renderPopupButtonAsImage="true" size="10"/>	
			
			<h:outputText value="" rendered="#{ManejadorRevisionArticuloVRI.panelRenderError[2]}"/>
			<h:outputText
				value="#{ManejadorRevisionArticuloVRI.errores[2]}"
				styleClass="mensajeerror"
				rendered="#{ManejadorRevisionArticuloVRI.panelRenderError[2]}" />

		<h:outputText value="Fecha Estimada de Entrega: "
			styleClass="labels_proyecto" />
		<t:inputCalendar id="fechainicio"
			value="#{ManejadorRevisionArticuloVRI.fechaEstimada}"
			renderAsPopup="true" popupTodayString="Hoy es: "
			popupWeekString="Sem." renderPopupButtonAsImage="true" size="10"/>	
		
	</h:panelGrid>
	
	<h:panelGrid columns="2" rendered="#{ManejadorRevisionArticuloVRI.mostrarEvaluarN}" align="center">
					<h:outputText value="Evaluar de nuevo en la sede:"
						styleClass="labels_proyecto" style='font-size: 10px; font-style: normal'/>
					<h:selectOneMenu
						value="#{ManejadorRevisionArticuloVRI.evalSede}"
						styleClass="texto" style='font-size: 10px; font-style: normal'>
						<f:selectItems
							value="#{ManejadorRevisionArticuloVRI.listaEval}" />
					</h:selectOneMenu>	
					
	</h:panelGrid>
	
	<h:panelGrid columns="2" rendered="#{ManejadorRevisionArticuloVRI.mostrarComentario}" align="center">
	
	<h:outputText value="" rendered="#{ManejadorRevisionArticuloVRI.panelRenderError[3]}"/>
			<h:outputText
				value="#{ManejadorRevisionArticuloVRI.errores[3]}"
				styleClass="mensajeerror"
				rendered="#{ManejadorRevisionArticuloVRI.panelRenderError[3]}" />
	
	<h:outputText value="Comentarios: "
			style='font-size: 10px; font-style: normal'
			styleClass="labels_proyecto" />
		<t:inputTextarea id="Resumen"
			value="#{ManejadorRevisionArticuloVRI.comentariosVRI}"
			style='font-size: 10px; font-style: normal' rows="9" cols="60"
			styleClass="labels_proyecto">
		</t:inputTextarea>
	</h:panelGrid>

</s:fieldset>

<s:fieldset legend="Evaluación Vicerrectoria de Investigación"
	styleClass="legend1" style='font-size: 12px;'
	rendered="#{ManejadorRevisionArticuloVRI.noAprobadoSede}">
	
	<h:panelGrid columns="1" align="center">
	
			<h:outputText
				value="#{ManejadorRevisionArticuloVRI.errores[4]}"
				styleClass="mensajeerror"
				rendered="#{ManejadorRevisionArticuloVRI.panelRenderError[4]}" />
				
		<h:selectOneRadio id="tipoBusq"
			value="#{ManejadorRevisionArticuloVRI.evaluacionVRIN}"
			
			styleClass="texto" style='font-size: 10px; font-style: normal'>
			<f:selectItem itemValue="APV" value="APV" itemLabel="Volver a revisar en sede" />
			<f:selectItem itemValue="NAPV" value="NAPV" itemLabel="No Aprobar" />
		</h:selectOneRadio>
	</h:panelGrid>
	
	<h:panelGrid columns="2" rendered="#{ManejadorRevisionArticuloVRI.noAprobadoSede}" align="center">
	
	<h:outputText value="" rendered="#{ManejadorRevisionArticuloVRI.panelRenderError[3]}"/>
			<h:outputText
				value="#{ManejadorRevisionArticuloVRI.errores[3]}"
				styleClass="mensajeerror"
				rendered="#{ManejadorRevisionArticuloVRI.panelRenderError[3]}" />
	
	<h:outputText value="Comentarios: "
			style='font-size: 10px; font-style: normal'
			styleClass="labels_proyecto" />
		<t:inputTextarea id="Resumen"
			value="#{ManejadorRevisionArticuloVRI.comentariosVRIN}"
			style='font-size: 10px; font-style: normal' rows="9" cols="60"
			styleClass="labels_proyecto">
		</t:inputTextarea>
	</h:panelGrid>

</s:fieldset>

<h:panelGrid columns="1" align="center"
	rendered="#{ManejadorRevisionArticuloVRI.mostrarInformacionGeneral}">
	<h:commandButton action="#{ManejadorRevisionArticuloVRI.guardar}"
		style='font-size: 10px; font-style: normal' value="Guardar"
		rendered="#{ManejadorRevisionArticuloVRI.mostrarInformacionGeneral}" />

</h:panelGrid></h:form>
</ui:define>
</ui:composition>
